<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生理学 模試対策問題</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:#f0f2f5;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 10px 40px;color:#1a1a1a}
.slide{width:100%;max-width:820px;background:#fff;border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,.10);overflow:hidden}
.hd{background:#3a6b2a;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.hd .ch{font-size:11px;color:#c8e0bd;letter-spacing:.06em;margin-bottom:2px}
.hd .tt{font-size:18px;font-weight:600;color:#fff}
.hd .pg{font-size:12px;color:#c8e0bd;white-space:nowrap}
.hd .home{background:none;border:1px solid #8fb57f;color:#fff;border-radius:6px;padding:5px 10px;font-size:12px;font-family:inherit;cursor:pointer;white-space:nowrap}
.bar{height:5px;background:#e5e7eb}.bar>i{display:block;height:100%;background:#3a6b2a;transition:width .3s;width:0}
.bd{padding:18px 20px 16px;min-height:300px}
.ctrl{display:flex;align-items:center;gap:8px;padding:12px 20px;background:#f8f9fb;border-top:1px solid #e5e7eb;flex-wrap:wrap}
.btn{padding:11px 18px;border-radius:8px;border:1px solid #3a6b2a;background:#3a6b2a;color:#fff;font-size:14px;cursor:pointer;font-family:inherit;font-weight:600;margin-left:auto}
.btn:disabled{opacity:.4;cursor:default}
.btn.sub{background:#fff;color:#3a6b2a;border-color:#cfd6cb;margin-left:0}
.qnum{font-size:12px;font-weight:700;color:#3a6b2a;margin-bottom:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mark{font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;background:rgba(58,107,42,.1);color:#3a6b2a}
.mark.ng{background:rgba(109,63,158,.12);color:#6d3f9e}
.mark.two{background:rgba(194,65,12,.13);color:#c2410c}
.q{font-size:16px;line-height:1.8;font-weight:600;margin-bottom:14px}
.q .em{color:#6d3f9e}.q .em2{color:#c2410c}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:left;font-size:15px;line-height:1.6;color:#222;background:#f8f9fb;border:1.5px solid #e5e7eb;border-radius:9px;padding:12px 14px;cursor:pointer;font-family:inherit;display:flex;gap:10px;align-items:flex-start;width:100%}
.opt .mk{flex-shrink:0;width:24px;height:24px;border-radius:50%;border:1.5px solid #c3c8d0;color:#666;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.opt.sel{border-color:#3a6b2a;background:#eef5ea}.opt.sel .mk{background:#3a6b2a;border-color:#3a6b2a;color:#fff}
.opt.dis{cursor:default}
.opt.correct{border-color:#1f9d6b;background:#e9f8f1}.opt.correct .mk{border-color:#1f9d6b;background:#1f9d6b;color:#fff}
.opt.wrong{border-color:#d0483f;background:#fdeceb}.opt.wrong .mk{border-color:#d0483f;background:#d0483f;color:#fff}
.opt .ex{display:block;font-size:13.5px;color:#444;margin-top:6px;line-height:1.75;font-weight:400}
.opt .ok-t{color:#1f9d6b;font-weight:700}.opt .ng-t{color:#d0483f;font-weight:700}
.vd{margin:14px 0 4px;font-weight:700;font-size:16px}.vd.ok{color:#1f9d6b}.vd.ng{color:#d0483f}
.z{margin-top:12px;border-left:4px solid #9cbf8c;background:#f4f8f1;padding:10px 12px;font-size:14px;line-height:1.85;border-radius:0 8px 8px 0}
.z b{color:#3a6b2a}
.meta{font-size:12px;color:#777;margin-top:8px}
.center{text-align:center}
.lead{font-size:14px;color:#555;line-height:1.8;margin-bottom:14px}
.sec{font-size:13px;font-weight:700;color:#3a6b2a;margin:18px 0 8px;letter-spacing:.05em}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{text-align:left;border:1.5px solid #e5e7eb;border-radius:11px;padding:13px 14px;cursor:pointer;background:#fff;font-family:inherit}
.mode:active{background:#f1f7ee}
.mode .nm{font-size:15px;font-weight:700;color:#3a6b2a;margin-bottom:3px}
.mode .ds{font-size:12px;color:#666;line-height:1.6}
.mode.wide{grid-column:1/-1}
.sets{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sbtn{border:1.5px solid #cfd6cb;background:#f4f8f1;border-radius:9px;padding:11px 0;font-size:16px;font-weight:700;color:#3a6b2a;font-family:inherit;cursor:pointer}
.sbtn:active{background:#3a6b2a;color:#fff}
.mode.or .nm{color:#c2410c}
.big{font-size:40px;font-weight:700;color:#3a6b2a;margin:4px 0}
.frow{display:grid;grid-template-columns:64px 1fr 58px;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid #f0f0f0;font-size:13px;cursor:pointer}
.frow .nm{font-weight:700}
.frow .tr{height:12px;background:#eceef1;border-radius:6px;overflow:hidden}
.frow .tr i{display:block;height:100%;border-radius:6px}
.frow .v{text-align:right;color:#555;font-variant-numeric:tabular-nums}
.frow.none{color:#aaa;cursor:default}
.note{font-size:12px;color:#888;line-height:1.7;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid #cfd6cb;background:#fff;border-radius:20px;padding:7px 13px;font-size:13px;font-family:inherit;cursor:pointer;color:#333}
.chip.on{background:#3a6b2a;color:#fff;border-color:#3a6b2a}
.card{border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin-bottom:14px}
.card .q{font-size:15px;margin-bottom:10px}
.ro{padding:9px 10px;border-radius:8px;background:#f8f9fb;margin-bottom:6px;font-size:14px;line-height:1.7}
.ro.c{background:#e9f8f1;border:1px solid #b6e6d1}
.ro .h{font-weight:700}.ro .e{display:block;color:#444;font-size:13.5px;margin-top:3px}
.hide .ro.c{background:#f8f9fb;border-color:transparent}.hide .ro .e,.hide .z,.hide .ansl{display:none}
.reveal{display:none;margin-top:6px}.hide .reveal{display:inline-block}
.ansl{font-size:13px;font-weight:700;color:#1f9d6b;margin-bottom:6px}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0 12px;cursor:pointer;user-select:none}
.sw input{width:18px;height:18px}
.rsel{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
@media (max-width:420px){.menu{grid-template-columns:1fr}.frow{grid-template-columns:56px 1fr 52px}}
</style>
</head>

<div class="slide">
  <div class="hd"><div><div class="ch" id="hch">柔道整復師国家試験対策｜生理学</div><div class="tt" id="htt">模試対策問題</div></div><div style="display:flex;gap:8px;align-items:center"><span class="pg" id="pg"></span><button class="home" id="hbtn" onclick="home()" style="display:none">メニュー</button></div></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="bd" id="bd"></div>
  <div class="ctrl" id="ctrl"></div>
</div>
<script>
/* ===== 問題データ =====
   id は「s(セット)-(問番号)」で固定。成績の記録はこの id に結びつくので、問題を追加しても既存の id は変えないこと。
   o: [選択肢, その肢の解説, 正答なら1] ／ c: 分野 ／ z: 整理 */
const DATA=[{"id": "s1-1", "set": 1, "n": 1, "c": "総論", "t": "総論・能動輸送", "p": "p.3", "r": "模試 2021問81（ほぼ同一の設問）／2020問81・2025問81でも輸送が出題", "s": "細胞膜を介した物質の移動で能動輸送はどれか。", "neg": false, "two": false, "o": [["肺胞におけるガス交換", "誤り。肺胞のガス交換は、O₂とCO₂が分圧の差に従って移動する拡散（受動輸送）である。", 0], ["糸球体からボーマン嚢への血漿のろ過", "誤り。糸球体での濾過は、血圧（糸球体毛細血管圧）による濾過で、ATPを使わない受動的な移動である。", 0], ["小腸における脂質の吸収", "誤り。脂質（脂肪酸・モノグリセリド）は脂溶性なので、細胞膜を拡散で通過して吸収される。", 0], ["甲状腺濾胞細胞へのヨウ素の取り込み", "正しい。甲状腺濾胞細胞は、血中より濃度の高い細胞内へヨウ素を取り込む。濃度勾配に逆らうので能動輸送（Na⁺の勾配を使う二次性能動輸送）である。", 1]], "z": "受動輸送＝拡散（ガス交換・脂溶性物質）・促通拡散・濾過・浸透。能動輸送＝一次性（Na⁺-K⁺ポンプ・Ca²⁺ポンプ・H⁺ポンプ）・二次性（Na⁺とグルコースの共輸送、ヨウ素の取り込み）。"}, {"id": "s1-2", "set": 1, "n": 2, "c": "総論", "t": "総論・酸塩基平衡", "p": "p.198〜199", "r": "模試 2020問82（重曹の大量摂取）／2021問82（大量の下痢）／2022問100／2024問100", "s": "激しい嘔吐を繰り返したときに生じるのはどれか。", "neg": false, "two": false, "o": [["呼吸性アシドーシス", "誤り。呼吸性アシドーシスは換気が低下してCO₂がたまる状態（呼吸不全など）である。", 0], ["呼吸性アルカローシス", "誤り。呼吸性アルカローシスは過換気でCO₂が過剰に排出される状態である。", 0], ["代謝性アシドーシス", "誤り。代謝性アシドーシスは下痢（HCO₃⁻の喪失）や糖尿病性ケトアシドーシス、腎不全などで起こる。", 0], ["代謝性アルカローシス", "正しい。嘔吐では胃酸（H⁺とCl⁻）が大量に失われるため、体液がアルカリ性に傾く（代謝性アルカローシス）。", 1]], "z": "嘔吐＝代謝性アルカローシス、下痢＝代謝性アシドーシス、過換気＝呼吸性アルカローシス、換気低下＝呼吸性アシドーシス。血液の正常pHは7.35〜7.45（約7.4）。"}, {"id": "s1-3", "set": 1, "n": 3, "c": "血液", "t": "血液・一次止血", "p": "p.119〜123", "r": "模試 2020問83／2022問93／2025問95（3年で出題）", "s": "一次止血で正しいのはどれか。", "neg": false, "two": false, "o": [["フィブリン網が形成される", "誤り。フィブリン網ができるのは凝固因子による二次止血である。", 0], ["血小板が血管内皮下のコラーゲンに結合する", "正しい。血管が傷つくと、血小板が内皮の下に露出したコラーゲンに粘着し（フォン・ヴィレブランド因子が仲立ち）、さらに血小板どうしが凝集して血小板血栓（一次血栓）をつくる。", 1], ["プロトロンビンが活性化される", "誤り。プロトロンビンがトロンビンに活性化されるのは二次止血（血液凝固）の過程である。", 0], ["ビタミンKを必要とする", "誤り。ビタミンKは肝臓で凝固因子（第Ⅱ・Ⅶ・Ⅸ・Ⅹ因子）をつくるのに必要で、二次止血に関わる。", 0]], "z": "止血の流れ＝①血管収縮→②一次止血（血小板の粘着・凝集）→③二次止血（凝固因子の連鎖でフィブリン網ができ、血栓が強固になる）→④線溶（プラスミンがフィブリンを溶かす）。"}, {"id": "s1-4", "set": 1, "n": 4, "c": "循環", "t": "循環・心周期", "p": "p.144〜145", "r": "模試 2020問84（動脈弁の閉鎖時に生じる心音）／2025問97", "s": "心周期で正しいのはどれか。", "neg": false, "two": false, "o": [["Ⅰ音は動脈弁の閉鎖によって生じる", "誤り。Ⅰ音は房室弁（僧帽弁・三尖弁）の閉鎖で生じる。動脈弁の閉鎖で生じるのはⅡ音。", 0], ["等容性収縮期には房室弁と動脈弁がともに閉じている", "正しい。等容性収縮期は房室弁も動脈弁も閉じており、心室の容積は変わらずに内圧だけが上がる。", 1], ["充満期には動脈弁が開いている", "誤り。充満期に開いているのは房室弁で、動脈弁は閉じている。動脈弁が開くのは駆出期である。", 0], ["Ⅱ音は等容性収縮期の開始時に生じる", "誤り。Ⅱ音は動脈弁が閉じる音で、等容性弛緩期の開始時（拡張期の始まり）に生じる。", 0]], "z": "房室弁が開いているのは充満期のみ、動脈弁が開いているのは駆出期のみで、等容性収縮期と等容性弛緩期は両方とも閉じている。Ⅰ音＝等容性収縮期の始まり、Ⅱ音＝等容性弛緩期の始まり。"}, {"id": "s1-5", "set": 1, "n": 5, "c": "循環", "t": "循環・血管系の機能分類", "p": "p.146〜148※", "r": "模試 2020問85（弾性血管系を問う形）／2022問97／2024問97", "s": "抵抗血管系に属するのはどれか。", "neg": false, "two": false, "o": [["大動脈", "誤り。大動脈は弾性に富む弾性血管（ふいご血管）で、収縮期に広がって血液をため、拡張期にも血流を保つ。", 0], ["細動脈", "正しい。細動脈は平滑筋が発達しており、内径を変えて血管抵抗を調節する抵抗血管である。血圧の低下が最も大きい部位。", 1], ["毛細血管", "誤り。毛細血管は物質交換を行う交換血管である。", 0], ["静脈", "誤り。静脈は血液の約60〜70％を蓄える容量血管である。", 0]], "z": "弾性血管＝大動脈・太い動脈、抵抗血管＝細動脈、交換血管＝毛細血管、容量血管＝静脈。血流速度は大動脈で最も速く、総断面積が最大の毛細血管で最も遅い。"}, {"id": "s1-6", "set": 1, "n": 6, "c": "呼吸", "t": "呼吸・肺気量分画", "p": "p.162〜163", "r": "模試 2020問86（死腔量の増大）／2021問98／2022問98", "s": "呼吸気量分画で正しいのはどれか。", "neg": false, "two": false, "o": [["肺胞換気量は1回換気量と等しい", "誤り。肺胞換気量は1回換気量から死腔量を差し引いた量で、1回換気量より少ない。", 0], ["肺活量には残気量が含まれる", "誤り。肺活量＝予備吸気量＋1回換気量＋予備呼気量で、残気量は含まない。", 0], ["機能的残気量は安静呼気位で肺内に残る空気量である", "正しい。機能的残気量は安静時に息を吐いた位置（安静呼気位）で肺に残っている空気量で、予備呼気量＋残気量である。", 1], ["全肺気量は肺活量から残気量を引いた量である", "誤り。全肺気量は肺活量に残気量を足した量である。", 0]], "z": "肺活量＝予備吸気量＋1回換気量＋予備呼気量。機能的残気量＝予備呼気量＋残気量。全肺気量＝肺活量＋残気量。残気量・機能的残気量・全肺気量はスパイロメータでは測れない。"}, {"id": "s1-7", "set": 1, "n": 7, "c": "呼吸", "t": "呼吸・酸素解離曲線", "p": "p.166〜167", "r": "模試 2022問99／2025問99", "s": "ヘモグロビンの酸素解離曲線を右方へ移動させるのはどれか。", "neg": false, "two": false, "o": [["pHの上昇", "誤り。pHが上昇すると曲線は左方へ移動し、ヘモグロビンは酸素を離しにくくなる。", 0], ["体温の低下", "誤り。体温が低下すると曲線は左方へ移動する。", 0], ["二酸化炭素分圧の上昇", "正しい。二酸化炭素分圧が上昇すると曲線は右方へ移動し、組織で酸素を離しやすくなる（ボーア効果）。", 1], ["2,3-DPGの減少", "誤り。2,3-DPGが減少すると曲線は左方へ移動する。2,3-DPGが増えると右方へ移動する。", 0]], "z": "右方移動（酸素を離しやすい）＝CO₂分圧↑・pH↓・体温↑・2,3-DPG↑。運動中の筋で起こる変化と覚える。左方移動はその逆で、胎児ヘモグロビンも左方にある（酸素と結合しやすい）。"}, {"id": "s1-8", "set": 1, "n": 8, "c": "消化", "t": "消化・消化液の性状", "p": "p.200〜205※", "r": "模試 2020問89（消化液と性状の組合せ）／2022問103／2024問103", "s": "消化液で正しいのはどれか。", "neg": false, "two": false, "o": [["唾液は強アルカリ性である", "誤り。唾液はpH約7前後でほぼ中性である。", 0], ["胃液のpHは約1.0である", "正しい。胃液は塩酸を含み、pH約1〜2の強酸性である。", 1], ["膵液は酸性である", "誤り。膵液はHCO₃⁻を多く含む弱アルカリ性（pH約8.5）で、胃酸を中和する。", 0], ["胆汁には消化酵素が含まれる", "誤り。胆汁は胆汁酸で脂肪を乳化するが、消化酵素は含まない。", 0]], "z": "唾液＝ほぼ中性（アミラーゼ）、胃液＝強酸性（ペプシン・塩酸）、膵液＝弱アルカリ性（アミラーゼ・トリプシン・リパーゼ）、胆汁＝弱アルカリ性（胆汁酸・ビリルビン、消化酵素なし）。"}, {"id": "s1-9", "set": 1, "n": 9, "c": "消化", "t": "消化・肝臓のはたらき", "p": "p.209〜210", "r": "模試 2020問90／2024問104／2025問103（3年で出題）", "s": "成人の肝臓の働きで誤っているのはどれか。", "neg": true, "two": false, "o": [["尿素の生成", "正しい記述。アミノ酸の分解で生じたアンモニアをオルニチン回路で尿素に変える。", 0], ["アルブミンの合成", "正しい記述。アルブミンやフィブリノゲンなど多くの血漿タンパク質は肝臓で合成される。", 0], ["胆汁の生成", "正しい記述。胆汁は肝細胞でつくられ、胆嚢で濃縮されて十二指腸へ出される。", 0], ["赤血球の産生", "誤りの記述（これが正解）。肝臓で赤血球がつくられるのは胎児期のみで、成人では骨髄でつくられる。", 1]], "z": "肝臓のはたらき＝糖代謝（グリコーゲン貯蔵・糖新生）、タンパク質代謝（血漿タンパク質・凝固因子の合成、尿素の生成）、脂質代謝、胆汁の生成、解毒、ビタミン・鉄の貯蔵。胎児期には造血も行う。"}, {"id": "s1-10", "set": 1, "n": 10, "c": "代謝", "t": "代謝・エネルギー代謝", "p": "p.190〜194", "r": "模試 2020問91（脂肪酸からのATP産生）／2021問100／2025問102", "s": "エネルギー代謝で正しいのはどれか。", "neg": false, "two": false, "o": [["解糖系はミトコンドリア内で進行する", "誤り。解糖系は細胞質で進行する。ミトコンドリア内で進むのはクエン酸回路と電子伝達系である。", 0], ["クエン酸回路は無酸素的に進行する", "誤り。クエン酸回路は電子伝達系と連動しており、酸素がないと進まない（有酸素的）。", 0], ["脂質は1gあたり約9kcalのエネルギーを生じる", "正しい。脂質は1gあたり約9kcalで、糖質とタンパク質（約4kcal）の2倍以上のエネルギーを生じる。", 1], ["特異動的作用とは運動による熱産生の増加をいう", "誤り。特異動的作用は食物を摂取したあとに代謝が高まって熱が産生される現象である。タンパク質で最も大きい。", 0]], "z": "1gあたりのエネルギー＝糖質4kcal・タンパク質4kcal・脂質9kcal。解糖系＝細胞質・無酸素・ATP2分子。クエン酸回路と電子伝達系＝ミトコンドリア・有酸素・ATPの大部分。"}, {"id": "s1-11", "set": 1, "n": 11, "c": "体温", "t": "体温・体温の測定部位と変動", "p": "p.215〜216", "r": "模試 2020問92（最も測定温が高い部位）／2021問103／2022問104", "s": "体温で正しいのはどれか。", "neg": false, "two": false, "o": [["腋窩温は直腸温より高い", "誤り。腋窩温は直腸温より約0.8℃低い。", 0], ["直腸温は深部温に相当する", "正しい。直腸温は身体の芯の温度（核心温・深部温）をよく反映する。", 1], ["早朝に最も高くなる", "誤り。体温は早朝（睡眠中の明け方）に最も低く、夕方に最も高くなる（日内変動、差は1℃以内）。", 0], ["皮膚温は環境温に影響されない", "誤り。皮膚温（外殻温）は環境温の影響を大きく受ける。", 0]], "z": "直腸温＞口腔温（約0.5℃低い）＞腋窩温（約0.8℃低い）。体温は早朝に最低・夕方に最高。女性は排卵後の黄体期にプロゲステロンの作用で約0.3〜0.5℃上昇する。"}, {"id": "s1-12", "set": 1, "n": 12, "c": "腎", "t": "腎・クリアランス", "p": "p.176〜180※", "r": "模試 2020問93（腎臓で最も高率に排泄されるもの）／2025問100", "s": "クリアランス値が最も大きいのはどれか。", "neg": false, "two": false, "o": [["グルコース", "誤り。グルコースは濾過されたあと近位尿細管でほぼ全部再吸収されるので、クリアランスは0である。", 0], ["ナトリウムイオン", "誤り。Na⁺は濾過された量の99％以上が再吸収されるので、クリアランスは非常に小さい。", 0], ["イヌリン", "誤り。イヌリンは濾過されるだけで再吸収も分泌もされないので、クリアランスは糸球体濾過量（約120mL/分）に等しい。", 0], ["パラアミノ馬尿酸", "正しい。パラアミノ馬尿酸は濾過に加えて尿細管から分泌され、1回の腎通過でほぼ全量が除かれる。クリアランスは腎血漿流量（約600mL/分）に相当する。", 1]], "z": "クリアランスの大きさ＝パラアミノ馬尿酸（腎血漿流量）＞クレアチニン（やや分泌もある）≒イヌリン（糸球体濾過量）＞尿素＞Na⁺＞グルコース（0）。再吸収されるとイヌリンより小さく、分泌されると大きくなる。"}, {"id": "s1-13", "set": 1, "n": 13, "c": "内分", "t": "内分泌・ホルモンの化学的分類", "p": "p.85〜86", "r": "模試 2020問94（ステロイドホルモン）／2021問89／2025問92（3年で出題）", "s": "アミノ酸誘導体ホルモン（アミンホルモン）はどれか。", "neg": false, "two": false, "o": [["オキシトシン", "誤り。オキシトシンはアミノ酸9個からなるペプチドホルモンである。", 0], ["サイロキシン", "正しい。サイロキシン（甲状腺ホルモン）はチロシンにヨウ素が結合してできるアミノ酸誘導体（アミン）ホルモンである。", 1], ["プロジェステロン", "誤り。プロゲステロンはコレステロールからつくられるステロイドホルモンである。", 0], ["ゴナドトロピン", "誤り。ゴナドトロピン（FSH・LH）は糖タンパク質で、ペプチドホルモンに分類される。", 0]], "z": "アミン＝甲状腺ホルモン・カテコールアミン（アドレナリン・ノルアドレナリン・ドーパミン）・メラトニン。ステロイド＝副腎皮質ホルモン・性ホルモン・活性型ビタミンD。それ以外の多くはペプチド。"}, {"id": "s1-14", "set": 1, "n": 14, "c": "内分", "t": "内分泌・アルドステロン", "p": "p.97, 180〜182", "r": "模試 2020問96／2022問91", "s": "アルドステロンの作用で正しいのはどれか。", "neg": false, "two": false, "o": [["腎臓でのK⁺の再吸収を促進する", "誤り。アルドステロンはK⁺の再吸収ではなく、K⁺の尿中への分泌（排泄）を促進する。", 0], ["集合管での水の再吸収を直接促進する", "誤り。集合管での水の再吸収を直接促進するのはバソプレシンである。アルドステロンはNa⁺の再吸収に伴って間接的に水を保持する。", 0], ["遠位尿細管でのNa⁺の再吸収を促進する", "正しい。アルドステロンは遠位尿細管と集合管でNa⁺の再吸収を促進し、同時にK⁺とH⁺の分泌を促す。", 1], ["末梢血管抵抗を低下させる", "誤り。アルドステロンはNa⁺と水を体にためて細胞外液量を増やし、血圧を上げる方向にはたらく。", 0]], "z": "アルドステロン（副腎皮質の球状層）＝Na⁺再吸収↑・K⁺とH⁺の分泌↑→細胞外液量↑・血圧↑。主にレニン–アンジオテンシン系と血中K⁺の上昇で分泌が増える。過剰になると低カリウム血症と高血圧（原発性アルドステロン症）。"}, {"id": "s1-15", "set": 1, "n": 15, "c": "骨", "t": "骨Ca・パラソルモン", "p": "p.137〜138", "r": "模試 5年連続（2020問98／2021問95／2022問90／2024問95／2025問96）", "s": "副甲状腺ホルモン（パラソルモン）の作用で正しいのはどれか。2つ選べ。", "neg": false, "two": true, "o": [["骨吸収の促進", "正しい。パラソルモンは破骨細胞のはたらきを高めて骨吸収を促し、骨からCaを血中へ出す。", 1], ["腎臓でのCa²⁺再吸収の促進", "正しい。腎臓（遠位尿細管）でのCa²⁺の再吸収を促し、尿へのCaの排泄を減らす。", 1], ["腎臓でのリン酸再吸収の促進", "誤り。パラソルモンは腎臓でのリン酸の再吸収を抑制し、血中リン酸濃度を下げる。", 0], ["活性型ビタミンD産生の抑制", "誤り。パラソルモンは腎臓での活性型ビタミンDの産生を促進する。", 0]], "z": "パラソルモン＝血中Ca↑・リン酸↓（骨吸収↑、腎でCa再吸収↑・リン酸再吸収↓、ビタミンD活性化↑）。カルシトニン＝血中Ca↓。活性型ビタミンD＝腸管からのCaとリン酸の吸収↑。"}, {"id": "s1-16", "set": 1, "n": 16, "c": "生殖", "t": "生殖・排卵とLHサージ", "p": "p.88, 109", "r": "模試 2020問97／2022問92／2024問91（3年で出題）", "s": "女性の性周期において排卵を誘発するのはどれか。", "neg": false, "two": false, "o": [["エストロゲン", "誤り。エストロゲンは卵胞から分泌され、ピークに達するとLHサージの引き金になるが、排卵を直接起こすのはLHである。", 0], ["プロゲステロン", "誤り。プロゲステロンは排卵後に黄体から分泌され、子宮内膜を分泌期にして着床に備える。", 0], ["黄体形成ホルモン", "正しい。エストロゲンの正のフィードバックで下垂体前葉から黄体形成ホルモン（LH）が一過性に大量分泌され（LHサージ）、成熟卵胞が破れて排卵が起こる。", 1], ["プロラクチン", "誤り。プロラクチンは乳汁の産生を促すホルモンで、排卵はむしろ抑制する。", 0]], "z": "卵胞期＝FSHで卵胞が発育しエストロゲン↑→LHサージ→排卵→黄体期＝プロゲステロン↑（基礎体温上昇）。授乳中はプロラクチンが高く、排卵が抑えられやすい。"}, {"id": "s1-17", "set": 1, "n": 17, "c": "神経", "t": "神経・神経線維の分類", "p": "p.26〜27", "r": "模試 2020問99（直径が最も太い線維）／2022問84／2024問84", "s": "神経線維で伝導速度が最も速いのはどれか。", "neg": false, "two": false, "o": [["Aα線維", "正しい。Aα線維は最も太い有髄線維で、伝導速度は最も速い（約70〜120m/秒）。骨格筋への運動線維（α運動ニューロン）や筋紡錘からのⅠa群線維がこれにあたる。", 1], ["Aδ線維", "誤り。Aδ線維は細い有髄線維で、速い痛み（一次痛）や冷覚を伝える。", 0], ["B線維", "誤り。B線維は自律神経の節前線維で、細い有髄線維である。", 0], ["C線維", "誤り。C線維は無髄線維で最も遅い（約0.5〜2m/秒）。遅い痛み（二次痛）や自律神経の節後線維がこれにあたる。", 0]], "z": "伝導速度は太いほど速く、有髄線維は跳躍伝導で速い。速い順にAα＞Aβ（触圧覚）＞Aγ（γ運動線維）＞Aδ（一次痛・冷覚）＞B（自律神経節前）＞C（二次痛・節後線維）。"}, {"id": "s1-18", "set": 1, "n": 18, "c": "神経", "t": "神経・コリン作動性線維", "p": "p.37〜40", "r": "模試 2020問100／2021問85／2022問85（3年で出題）", "s": "コリン作動性神経線維の支配を受けるのはどれか。", "neg": false, "two": false, "o": [["汗腺", "正しい。汗腺（エクリン腺）は交感神経に支配されるが、節後線維は例外的にアセチルコリンを放出するコリン作動性線維である。", 1], ["立毛筋", "誤り。立毛筋は交感神経のみに支配され、節後線維はノルアドレナリンを放出するアドレナリン作動性である。", 0], ["皮膚血管", "誤り。皮膚血管は交感神経のアドレナリン作動性線維で収縮する。", 0], ["腎臓の傍糸球体装置", "誤り。腎臓の傍糸球体装置は交感神経のアドレナリン作動性線維に支配され、レニン分泌が促される。", 0]], "z": "コリン作動性＝運動神経（神経筋接合部）・自律神経の節前線維（交感・副交感とも）・副交感神経の節後線維・汗腺を支配する交感神経の節後線維（例外）。それ以外の交感神経節後線維はアドレナリン作動性。"}, {"id": "s1-19", "set": 1, "n": 19, "c": "神経", "t": "神経・脳波", "p": "p.34〜35", "r": "模試 2020問101／2022問86／2025問85", "s": "成人の脳波で深睡眠時に現れるのはどれか。", "neg": false, "two": false, "o": [["α波", "誤り。α波（8〜13Hz）は閉眼・安静・覚醒時に現れる。", 0], ["β波", "誤り。β波（14Hz以上）は開眼時や精神活動時に現れる。", 0], ["θ波", "誤り。θ波（4〜7Hz）は浅い睡眠（入眠期）に現れる。", 0], ["δ波", "正しい。δ波（4Hz未満）は深いノンレム睡眠で現れる。新生児や幼児では覚醒時の基本のリズムでもある。", 1]], "z": "速い順にβ（開眼・精神活動）＞α（閉眼安静覚醒）＞θ（浅い睡眠）＞δ（深い睡眠）。レム睡眠は覚醒時に似た速い低振幅の波で、急速眼球運動と骨格筋の緊張低下を伴う。"}, {"id": "s1-20", "set": 1, "n": 20, "c": "運動", "t": "運動の生理・伸張反射", "p": "p.47〜48, 53〜55", "r": "模試 2021問86／2024問87／2025問86（3年で出題）", "s": "伸張反射で正しいのはどれか。", "neg": false, "two": false, "o": [["受容器はゴルジ腱器官である", "誤り。伸張反射の受容器は筋紡錘である。ゴルジ腱器官は張力を受容し、同名筋を抑制する。", 0], ["多シナプス反射である", "誤り。伸張反射は求心性線維がα運動ニューロンに直接シナプスする単シナプス反射で、唯一の単シナプス反射である。", 0], ["求心性線維はIa群線維である", "正しい。筋紡錘からの情報はⅠa群線維で脊髄に入り、同じ筋のα運動ニューロンを興奮させる。", 1], ["中枢は延髄にある", "誤り。伸張反射の中枢は脊髄である（膝蓋腱反射はL2〜L4）。", 0]], "z": "伸張反射＝受容器は筋紡錘・Ⅰa群・単シナプス・中枢は脊髄・同名筋が収縮（拮抗筋は抑制＝相反神経支配）。ゴルジ腱器官＝Ⅰb群・同名筋を抑制。屈曲反射は多シナプス反射。"}, {"id": "s1-21", "set": 1, "n": 21, "c": "筋", "t": "筋・筋線維のタイプ", "p": "p.14〜17", "r": "模試 2021問83／2025問82", "s": "骨格筋のⅠ型線維で正しいのはどれか。", "neg": false, "two": false, "o": [["筋線維が太い", "誤り。Ⅰ型線維は細い。太いのはⅡ型線維である。", 0], ["収縮速度が速い", "誤り。Ⅰ型線維は収縮速度が遅い（遅筋）。", 0], ["ミトコンドリアが多い", "正しい。Ⅰ型線維はミトコンドリアとミオグロビンが多く、有酸素的にATPをつくる。", 1], ["疲労しやすい", "誤り。Ⅰ型線維は疲労しにくい。疲労しやすいのはⅡx型（Ⅱb型）である。", 0]], "z": "Ⅰ型（SO・遅筋・赤筋）＝細い・遅い・疲れにくい・ミトコンドリアとミオグロビンが多い。Ⅱx型（FG・速筋・白筋）＝太い・速い・疲れやすい・解糖系。加齢で萎縮しやすいのはⅡ型。"}, {"id": "s1-22", "set": 1, "n": 22, "c": "筋", "t": "筋・心筋の特徴", "p": "p.11, 17, 20〜21", "r": "模試 2020問103／2022問83", "s": "骨格筋と比べた心筋の特徴で正しいのはどれか。", "neg": false, "two": false, "o": [["強縮を生じる", "誤り。心筋は不応期が長いため、刺激が重なっても強縮は生じない。", 0], ["不応期が短い", "誤り。心筋の活動電位にはプラトー相があり、不応期は長い。", 0], ["随意筋である", "誤り。心筋は自分の意思では動かせない不随意筋である。", 0], ["ギャップ結合を介して興奮が伝わる", "正しい。心筋細胞は介在板のギャップ結合でつながり、興奮が細胞から細胞へ伝わって機能的合胞体としてはたらく。", 1]], "z": "心筋＝横紋筋・不随意筋・ギャップ結合（機能的合胞体）・不応期が長く強縮しない・自動能あり。骨格筋＝横紋筋・随意筋・強縮する。平滑筋＝横紋なし・不随意筋。"}, {"id": "s1-23", "set": 1, "n": 23, "c": "感覚", "t": "感覚・受容器と適刺激", "p": "p.59〜60", "r": "模試 2020問104／2021問88／2025問88（3年で出題）", "s": "受容器と適刺激の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["コルチ器官 ―――― 回転加速度", "誤り。コルチ器の適刺激は音波（基底膜の振動）である。回転加速度を受容するのは半規管。", 0], ["半規管 ―――― 直線加速度", "誤り。半規管の適刺激は回転加速度である。直線加速度を受容するのは耳石器（卵形嚢・球形嚢）。", 0], ["パチニ小体 ―――― 振動", "正しい。パチニ小体は皮下深部や関節包にある速順応型の受容器で、振動を受容する。", 1], ["筋紡錘 ―――― 筋の張力", "誤り。筋紡錘の適刺激は筋の長さの変化（伸張）である。筋の張力を受容するのはゴルジ腱器官。", 0]], "z": "コルチ器＝音、半規管＝回転加速度、耳石器＝直線加速度と頭の傾き、パチニ小体＝振動、マイスナー小体＝触覚、筋紡錘＝筋の長さ、ゴルジ腱器官＝筋の張力、自由神経終末＝痛覚・温度覚。"}, {"id": "s1-24", "set": 1, "n": 24, "c": "感覚", "t": "感覚・2点弁別閾", "p": "p.74〜77※", "r": "模試 2020問105／2024問90", "s": "触・圧覚の2点弁別閾が最も大きいのはどれか。", "neg": false, "two": false, "o": [["指尖", "誤り。指尖は受容器の密度が高く、2点弁別閾は最も小さい部位の1つ（約2〜3mm）である。", 0], ["口唇", "誤り。口唇も2点弁別閾が小さい部位である。", 0], ["頬", "誤り。頬は指尖や口唇より大きいが、背部よりは小さい。", 0], ["背部", "正しい。背部は受容器の密度が低く、2点弁別閾が大きい（数cm）。", 1]], "z": "2点弁別閾が小さい（敏感）＝舌尖・指尖・口唇。大きい（鈍感）＝背部・上腕・大腿。大脳皮質の体性感覚野で、手や顔の領域が広いことと対応する。"}, {"id": "s1-25", "set": 1, "n": 25, "c": "加齢", "t": "加齢・加齢による変化", "p": "p.224〜232", "r": "模試 2021問104／2022問105／2025問104（3年で出題）", "s": "加齢に伴う変化で正しいのはどれか。", "neg": false, "two": false, "o": [["最大酸素摂取量が増加する", "誤り。最大酸素摂取量は加齢とともに低下する。", 0], ["水晶体の弾力性が低下する", "正しい。水晶体の弾力性が低下して厚みを変えにくくなり、近くが見えにくくなる（老視）。", 1], ["残気量が減少する", "誤り。肺の弾性が低下して息を吐ききれなくなるため、残気量は増加する。", 0], ["収縮期血圧が低下する", "誤り。動脈が硬くなるため収縮期血圧は上昇する（拡張期血圧は低下しやすく、脈圧が大きくなる）。", 0]], "z": "加齢で増える＝残気量・収縮期血圧・脈圧・空腹時血糖・感覚の閾値。減る＝最大酸素摂取量・肺活量・腎血流量・唾液と胃液の分泌・骨量・筋量（とくにⅡ型線維）・水晶体の弾力性（老視）。安静時の心拍数・心拍出量は変わりにくい。"}, {"id": "s2-1", "set": 2, "n": 1, "c": "総論", "t": "総論・二次性能動輸送", "p": "p.3", "r": "模試 2021問81／2020問81（一次性と二次性の区別が狙われやすい）", "s": "二次性能動輸送はどれか。", "neg": false, "two": false, "o": [["腎尿細管でのグルコースの再吸収", "正しい。尿細管や小腸では、Na⁺-K⁺ポンプがつくったNa⁺の濃度勾配を利用し、Na⁺と一緒にグルコースを取り込む（共輸送）。ATPを直接使わないので二次性能動輸送という。", 1], ["肺胞におけるガス交換", "誤り。肺胞のガス交換は分圧の差による拡散（受動輸送）である。", 0], ["赤血球への酸素の取り込み", "誤り。赤血球への酸素の取り込みも分圧の差による拡散である。", 0], ["ナトリウムポンプによるK⁺の取り込み", "誤り。Na⁺-K⁺ポンプはATPを直接分解してK⁺を取り込むので、一次性能動輸送である。", 0]], "z": "一次性能動輸送＝ATPを直接使う（Na⁺-K⁺ポンプ・Ca²⁺ポンプ・H⁺ポンプ）。二次性能動輸送＝Na⁺の濃度勾配を使う（Na⁺-グルコース共輸送・Na⁺-アミノ酸共輸送）。受動輸送＝拡散・促通拡散・濾過・浸透。"}, {"id": "s2-2", "set": 2, "n": 2, "c": "総論", "t": "総論・体液の区分", "p": "第1章※", "r": "模試 2021問95（正常血漿Ca濃度）のような数値問題の系統", "s": "成人男性で体重の約60％が体液である。細胞外液が体重に占める割合はどれか。", "neg": false, "two": false, "o": [["約5％", "誤り。約5％は血漿の割合である。", 0], ["約15％", "誤り。約15％は間質液（組織液）の割合である。", 0], ["約20％", "正しい。体液60％のうち細胞外液は約20％（間質液15％＋血漿5％）である。", 1], ["約40％", "誤り。約40％は細胞内液の割合である。", 0]], "z": "体液＝体重の約60％（細胞内液40％・細胞外液20％＝間質液15％＋血漿5％）。新生児は約80％、高齢者は50〜55％。細胞外液の主な陽イオンはNa⁺、細胞内液はK⁺。"}, {"id": "s2-3", "set": 2, "n": 3, "c": "血液", "t": "血液・ビタミンK依存性凝固因子", "p": "p.120〜125", "r": "模試 2022問93（止血で誤っているのはどれか）", "s": "生成にビタミンKを必要としない血液凝固因子はどれか。", "neg": true, "two": false, "o": [["第Ⅱ因子", "必要とする。第Ⅱ因子（プロトロンビン）はビタミンK依存性で肝臓で合成される。", 0], ["第Ⅶ因子", "必要とする。第Ⅶ因子は外因系の因子で、ビタミンK依存性である。", 0], ["第Ⅸ因子", "必要とする。第Ⅸ因子は内因系の因子で、ビタミンK依存性である（不足すると血友病B）。", 0], ["第Ⅻ因子", "必要としない（これが正解）。第Ⅻ因子（ハーゲマン因子）は内因系の開始因子で、ビタミンKを必要としない。", 1]], "z": "ビタミンK依存性の凝固因子は第Ⅱ・Ⅶ・Ⅸ・Ⅹ（「肉納豆」の語呂：2・7・9・10）。ワルファリンはビタミンKのはたらきを妨げて抗凝固作用を示すため、納豆などの摂取に注意する。"}, {"id": "s2-4", "set": 2, "n": 4, "c": "循環", "t": "循環・平均血圧の計算", "p": "p.154", "r": "模試 2021問97（血圧上昇要因）／2022問101のような計算形式", "s": "収縮期血圧140mmHg、拡張期血圧80mmHgのときの平均血圧に最も近いのはどれか。", "neg": false, "two": false, "o": [["100mmHg", "正しい。脈圧＝140−80＝60mmHg。平均血圧＝拡張期血圧＋脈圧÷3＝80＋20＝100mmHg。", 1], ["110mmHg", "誤り。単純な平均（(140＋80)÷2）である。拡張期のほうが長いので、平均血圧は単純平均より低い。", 0], ["120mmHg", "誤り。計算式に当てはまらない値である。", 0], ["60mmHg", "誤り。60mmHgは脈圧の値である。", 0]], "z": "脈圧＝収縮期血圧−拡張期血圧。平均血圧＝拡張期血圧＋脈圧÷3。動脈硬化では収縮期血圧が上がり拡張期血圧が下がるため、脈圧が大きくなる。"}, {"id": "s2-5", "set": 2, "n": 5, "c": "循環", "t": "循環・心筋の活動電位", "p": "p.139〜141※", "r": "模試 2020問103（骨格筋と比べた心筋の特徴）／2022問83", "s": "心筋の活動電位でプラトー相を形成する主なイオンの動きはどれか。", "neg": false, "two": false, "o": [["Na⁺の流入", "誤り。Na⁺の急速な流入は活動電位の立ち上がり（脱分極）を起こす。", 0], ["Ca²⁺の流入", "正しい。Ca²⁺がゆっくり流入し続けることで、膜電位が高いまま保たれるプラトー相ができる。", 1], ["K⁺の流出", "誤り。K⁺の流出は再分極（電位がもとに戻る過程）を起こす。", 0], ["Cl⁻の流入", "誤り。Cl⁻の流入は抑制性シナプス後電位などに関わり、プラトー相の主役ではない。", 0]], "z": "心室筋の活動電位＝立ち上がり（Na⁺流入）→プラトー相（Ca²⁺流入）→再分極（K⁺流出）。プラトー相のため不応期が長く、心筋は強縮しない。洞房結節の自動能（ゆっくりした脱分極）は別のしくみで起こる。"}, {"id": "s2-6", "set": 2, "n": 6, "c": "呼吸", "t": "呼吸・肺コンプライアンス", "p": "p.160〜163※", "r": "模試 2021問98／2022問98（肺気量分画）の周辺知識", "s": "肺のコンプライアンスが低下するのはどれか。", "neg": false, "two": false, "o": [["肺サーファクタントの増加", "誤り。サーファクタントが増えると表面張力が下がり、肺は膨らみやすくなる（コンプライアンスは上昇）。", 0], ["肺線維症", "正しい。肺線維症では肺が硬くなり膨らみにくくなるので、コンプライアンスは低下する（拘束性換気障害）。", 1], ["加齢", "誤り。加齢では肺の弾性線維が減り、膨らみやすくなる（コンプライアンスは上昇）。", 0], ["肺気腫", "誤り。肺気腫では肺胞壁が壊れて弾性が失われ、コンプライアンスは上昇する（閉塞性換気障害）。", 0]], "z": "コンプライアンス＝肺の膨らみやすさ。低下＝肺線維症・サーファクタント不足（新生児呼吸窮迫症候群）。上昇＝肺気腫・加齢。拘束性障害は％肺活量が低下、閉塞性障害は1秒率が低下する。"}, {"id": "s2-7", "set": 2, "n": 7, "c": "呼吸", "t": "呼吸・化学的調節", "p": "p.168〜169※", "r": "模試 2020問87（ヘーリング−ブロイエル反射）／2024問99", "s": "呼吸の化学的調節で誤っているのはどれか。", "neg": true, "two": false, "o": [["中枢化学受容器は延髄腹側表層にある", "正しい記述。中枢化学受容器は延髄の腹側表層にある。", 0], ["中枢化学受容器は脳脊髄液のH⁺濃度上昇で興奮する", "正しい記述。CO₂は脳脊髄液に拡散してH⁺を増やし、これが中枢化学受容器を興奮させる。", 0], ["末梢化学受容器は頸動脈小体と大動脈小体にある", "正しい記述。末梢化学受容器は頸動脈小体（舌咽神経）と大動脈小体（迷走神経）にある。", 0], ["末梢化学受容器は動脈血酸素分圧の上昇で興奮する", "誤りの記述（これが正解）。末梢化学受容器は動脈血酸素分圧の「低下」で興奮し、換気を増やす。", 1]], "z": "中枢化学受容器（延髄）＝CO₂分圧の上昇（H⁺の上昇）を感知。末梢化学受容器（頸動脈小体・大動脈小体）＝主にO₂分圧の低下を感知（H⁺・CO₂にも反応）。ふだんの換気はCO₂で調節されている。"}, {"id": "s2-8", "set": 2, "n": 8, "c": "消化", "t": "消化・グルコースの吸収", "p": "p.212", "r": "模試 2022問102（まったく同じ論点が出題済み）", "s": "小腸上皮細胞でグルコースの吸収に共役して輸送されるのはどれか。", "neg": false, "two": false, "o": [["カリウムイオン", "誤り。K⁺はグルコースと一緒には運ばれない。", 0], ["ナトリウムイオン", "正しい。小腸上皮の微絨毛膜にあるSGLT1が、Na⁺とグルコース（ガラクトース）を同時に取り込む（二次性能動輸送）。", 1], ["塩化物イオン", "誤り。Cl⁻はグルコースの吸収と共役しない。", 0], ["水素イオン", "誤り。H⁺は一部のペプチドの吸収と共役するが、グルコースとは共役しない。", 0]], "z": "グルコース・ガラクトース＝Na⁺と共輸送（SGLT1）、フルクトース＝促通拡散（GLUT5）。アミノ酸もNa⁺と共輸送。細胞内のNa⁺は基底側のNa⁺-K⁺ポンプでくみ出され、勾配が保たれる。経口補水液に糖と塩を入れるのはこのしくみを使うため。"}, {"id": "s2-9", "set": 2, "n": 9, "c": "消化", "t": "消化・胃液分泌の調節", "p": "p.202〜203※", "r": "模試 2020問88（胃液分泌を抑制するのはどれか／同一論点の裏返し）", "s": "胃液分泌を促進しないのはどれか。", "neg": true, "two": false, "o": [["迷走神経の興奮", "促進する。食物を見る・においをかぐなどで迷走神経が興奮し、胃液が分泌される（脳相）。", 0], ["胃壁の伸展", "促進する。食物が胃に入って胃壁が伸展すると、局所の反射で胃液が分泌される（胃相）。", 0], ["アミノ酸によるガストリン分泌", "促進する。タンパク質の分解産物（アミノ酸・ペプチド）がガストリンを分泌させ、胃酸分泌を促す（胃相）。", 0], ["十二指腸粘膜への胃酸の流入", "促進しない（これが正解）。十二指腸に胃酸が入るとセクレチンが分泌され、胃液分泌は抑制される（腸相）。", 1]], "z": "胃液分泌の3相＝脳相（迷走神経・約30％）、胃相（胃壁の伸展とガストリン・最も多い）、腸相（十二指腸からのセクレチンなどで主に抑制）。"}, {"id": "s2-10", "set": 2, "n": 10, "c": "代謝", "t": "代謝・リポタンパク質", "p": "p.186〜187", "r": "模試 2025問101（リポタンパク質のうち分子量が最も小さいもの）", "s": "リポタンパク質で密度が最も高いのはどれか。", "neg": false, "two": false, "o": [["カイロミクロン", "誤り。カイロミクロンは中性脂肪を最も多く含み、粒子が最も大きく、密度は最も低い。", 0], ["VLDL", "誤り。VLDLは肝臓でつくられた中性脂肪を運び、密度は低い。", 0], ["LDL", "誤り。LDLはコレステロールを最も多く含み、肝臓から末梢へコレステロールを運ぶ。", 0], ["HDL", "正しい。HDLはタンパク質の割合が最も高く、密度が最も高い。末梢の余ったコレステロールを肝臓へ運ぶ。", 1]], "z": "密度の低い順＝カイロミクロン＜VLDL＜LDL＜HDL（粒子の大きさは逆）。カイロミクロン＝食事由来の脂肪をリンパ経由で運ぶ、LDL＝「悪玉」コレステロール、HDL＝「善玉」コレステロール。"}, {"id": "s2-11", "set": 2, "n": 11, "c": "体温", "t": "体温・発熱", "p": "p.219〜222※", "r": "模試 2024問105（うつ熱に含まれないもの）／2022問104", "s": "発熱の上昇期にみられる悪寒戦慄で正しいのはどれか。", "neg": false, "two": false, "o": [["皮膚血管が拡張する", "誤り。上昇期は皮膚血管が収縮して熱放散を抑えるため、顔色が悪く寒気を感じる。", 0], ["発汗が増加する", "誤り。発汗が増えるのは解熱期である。", 0], ["体温調節中枢のセットポイントが上昇している", "正しい。発熱物質（プロスタグランジンE₂）によりセットポイントが上がり、今の体温が「低すぎる」と判断されて、ふるえ（戦慄）や皮膚血管の収縮が起こる。", 1], ["熱放散が増加している", "誤り。上昇期には熱放散は抑えられている。", 0]], "z": "発熱の上昇期＝セットポイント上昇・皮膚血管収縮・ふるえ・悪寒。解熱期＝セットポイントが戻り、皮膚血管拡張・発汗。うつ熱＝セットポイントは正常のまま熱がこもる状態。"}, {"id": "s2-12", "set": 2, "n": 12, "c": "腎", "t": "腎・有効濾過圧の計算", "p": "p.174", "r": "模試 2022問101／2024問101（2年で出題。数値を変えた出題が続いている）", "s": "糸球体血圧50mmHg、血漿膠質浸透圧25mmHg、ボーマン嚢内圧12mmHgのとき、有効濾過圧はどれか。", "neg": false, "two": false, "o": [["13mmHg", "正しい。有効濾過圧＝糸球体血圧−（血漿膠質浸透圧＋ボーマン嚢内圧）＝50−（25＋12）＝13mmHg。", 1], ["25mmHg", "誤り。50−25で、ボーマン嚢内圧を差し引いていない。", 0], ["37mmHg", "誤り。25＋12で、濾過を妨げる圧の合計である。", 0], ["63mmHg", "誤り。50＋25−12で、膠質浸透圧の向きを逆にしている。", 0]], "z": "濾過を進める＝糸球体毛細血管圧。妨げる＝血漿膠質浸透圧・ボーマン嚢内圧。低タンパク血症で膠質浸透圧が下がると濾過は増え、尿路閉塞で嚢内圧が上がると濾過は減る。"}, {"id": "s2-13", "set": 2, "n": 13, "c": "内分", "t": "内分泌・ホルモンの受容体", "p": "p.84〜86※", "r": "模試 2020問94／2021問89／2025問92（ホルモンの分類は毎年のように出題）", "s": "細胞内（核内）受容体に結合して作用するホルモンはどれか。", "neg": false, "two": false, "o": [["インスリン", "誤り。インスリンはペプチドホルモンで、細胞膜の受容体（チロシンキナーゼ型）に結合する。", 0], ["アドレナリン", "誤り。アドレナリンはカテコールアミンで、細胞膜のα・β受容体に結合する。", 0], ["コルチゾール", "正しい。コルチゾールはステロイドホルモンで、脂溶性のため細胞膜を通過し、細胞内の受容体に結合して遺伝子の発現を調節する。", 1], ["バソプレシン", "誤り。バソプレシンはペプチドホルモンで、細胞膜の受容体に結合する。", 0]], "z": "細胞内（核内）受容体＝ステロイドホルモン・甲状腺ホルモン・活性型ビタミンD（脂溶性、作用は遅いが長く続く）。細胞膜受容体＝ペプチドホルモン・カテコールアミン（セカンドメッセンジャーを介し、作用は速い）。"}, {"id": "s2-14", "set": 2, "n": 14, "c": "内分", "t": "内分泌・下垂体前葉による調節", "p": "p.91〜97", "r": "模試 2020問95（下垂体前葉ホルモンが分泌を直接刺激しないもの／正答率43％）", "s": "下垂体前葉ホルモンによって分泌が直接調節されないのはどれか。", "neg": true, "two": false, "o": [["サイロキシン", "調節される。サイロキシンは下垂体前葉の甲状腺刺激ホルモン（TSH）で分泌が調節される。", 0], ["コルチゾール", "調節される。コルチゾールは副腎皮質刺激ホルモン（ACTH）で調節される。", 0], ["テストステロン", "調節される。テストステロンは黄体形成ホルモン（LH）がライディッヒ細胞にはたらいて分泌される。", 0], ["アルドステロン", "調節されない（これが正解）。アルドステロンは主にレニン–アンジオテンシン系と血中K⁺濃度で調節され、ACTHの影響は小さい。", 1]], "z": "下垂体前葉の支配を受けない内分泌腺＝副腎髄質（交感神経）・膵島（血糖）・副甲状腺（血中Ca）・甲状腺のC細胞（カルシトニン）・副腎皮質の球状層（アルドステロン）。"}, {"id": "s2-15", "set": 2, "n": 15, "c": "骨", "t": "骨Ca・活性型ビタミンD", "p": "p.138", "r": "模試 2022問95（ビタミンDの活性化に関与しないもの）／骨・Ca代謝は5年連続出題", "s": "活性型ビタミンD₃の作用で正しいのはどれか。", "neg": false, "two": false, "o": [["腸管からのCa²⁺吸収を抑制する", "誤り。活性型ビタミンDは腸管からのCa²⁺吸収を促進する。", 0], ["腎臓で水酸化を受けて不活性化される", "誤り。ビタミンDは肝臓と腎臓で水酸化されて活性化される。腎臓での水酸化は不活性化ではない。", 0], ["腸管からのリン酸の吸収を促進する", "正しい。活性型ビタミンDは腸管からのCa²⁺とリン酸の吸収をともに促進する。", 1], ["副甲状腺ホルモンにより産生が抑制される", "誤り。副甲状腺ホルモンは腎臓での活性型ビタミンDの産生を促進する。", 0]], "z": "ビタミンD＝皮膚で紫外線によりつくられる（食事からも摂取）→肝臓で25位、腎臓で1α位が水酸化されて活性型に。作用＝腸管でCaとリン酸の吸収↑。欠乏で、くる病（小児）・骨軟化症（成人）。"}, {"id": "s2-16", "set": 2, "n": 16, "c": "生殖", "t": "生殖・hCG", "p": "p.109〜113※", "r": "模試 2021問92／2024問93（生殖は毎年1〜2問）", "s": "ヒト絨毛性ゴナドトロピン（hCG）の作用で正しいのはどれか。", "neg": false, "two": false, "o": [["子宮内膜を増殖させる", "誤り。子宮内膜を増殖させるのはエストロゲンである（増殖期）。", 0], ["黄体を維持する", "正しい。hCGは受精卵の絨毛から分泌され、黄体を妊娠黄体として維持し、プロゲステロンの分泌を続けさせて妊娠を保つ。", 1], ["分娩を誘発する", "誤り。分娩時に子宮を収縮させるのはオキシトシンである。", 0], ["乳汁を産生させる", "誤り。乳汁を産生させるのはプロラクチンである。", 0]], "z": "hCG＝妊娠初期に黄体を維持（妊娠検査で検出）。妊娠中期以降は胎盤がエストロゲンとプロゲステロンを分泌する。hPL＝母体の血糖を上げる。オキシトシン＝分娩・射乳、プロラクチン＝乳汁の産生。"}, {"id": "s2-17", "set": 2, "n": 17, "c": "神経", "t": "神経・錐体路と錐体外路", "p": "p.44〜46※", "r": "模試 2024問86（外側皮質脊髄路が交叉する部位）", "s": "錐体外路系に含まれないのはどれか。", "neg": true, "two": false, "o": [["赤核脊髄路", "含まれる。赤核脊髄路は中脳の赤核から起こり、屈筋の緊張を高める。", 0], ["網様体脊髄路", "含まれる。網様体脊髄路は脳幹の網様体から起こり、姿勢や筋緊張を調節する。", 0], ["前庭脊髄路", "含まれる。前庭脊髄路は前庭神経核から起こり、伸筋（抗重力筋）の緊張を高めて姿勢を保つ。", 0], ["外側皮質脊髄路", "含まれない（これが正解）。外側皮質脊髄路は延髄の錐体で交叉する錐体路である。", 1]], "z": "錐体路＝外側皮質脊髄路・前皮質脊髄路・皮質核路（随意運動）。錐体外路＝赤核脊髄路・網様体脊髄路・前庭脊髄路・視蓋脊髄路（姿勢・筋緊張）。錐体路の障害では痙性麻痺とバビンスキー反射が出る。"}, {"id": "s2-18", "set": 2, "n": 18, "c": "運動", "t": "運動の生理・ゴルジ腱器官", "p": "p.47〜48", "r": "模試 2025問86（同一論点）／筋紡錘との対比が頻出", "s": "ゴルジ腱器官で正しいのはどれか。", "neg": false, "two": false, "o": [["錘内筋線維と並列に配置される", "誤り。ゴルジ腱器官は筋と腱の移行部にあり、筋線維と直列に配置される。並列に配置されるのは筋紡錘。", 0], ["Ia群求心性線維が終末する", "誤り。ゴルジ腱器官からはⅠb群線維が出る。Ⅰa群線維は筋紡錘からの線維。", 0], ["筋の張力を受容する", "正しい。ゴルジ腱器官は筋の張力を受容し、Ⅰb群線維を介して同名筋を抑制する（自原抑制）。", 1], ["γ運動ニューロンの支配を受ける", "誤り。γ運動ニューロンが支配するのは筋紡錘の錘内筋線維である。", 0]], "z": "筋紡錘＝並列・長さを検出・Ⅰa群とⅡ群・γ運動ニューロンで感度調節・伸張反射。ゴルジ腱器官＝直列・張力を検出・Ⅰb群・自原抑制（筋を過大な張力から守る）。"}, {"id": "s2-19", "set": 2, "n": 19, "c": "神経", "t": "神経・自律神経節の伝達", "p": "p.37〜40", "r": "模試 2022問85（ムスカリン様受容体）／2020問98・問100（正答率7％の設問を含む）", "s": "自律神経節における伝達物質と受容体の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["アセチルコリン ―――― ムスカリン受容体", "誤り。ムスカリン受容体は、副交感神経節後線維が支配する効果器（心臓・消化管・汗腺など）の側にある。", 0], ["アセチルコリン ―――― ニコチン受容体", "正しい。交感・副交感神経とも、節前線維の終末からアセチルコリンが放出され、節後ニューロンのニコチン受容体にはたらく。", 1], ["ノルアドレナリン ―――― α受容体", "誤り。ノルアドレナリンは交感神経節後線維が効果器に放出する伝達物質で、自律神経節では使われない。", 0], ["ノルアドレナリン ―――― β受容体", "誤り。β受容体も効果器側（心臓・気管支など）にある受容体である。", 0]], "z": "自律神経節＝アセチルコリン→ニコチン受容体（交感・副交感とも）。効果器＝副交感はアセチルコリン→ムスカリン受容体、交感はノルアドレナリン→α・β受容体（汗腺だけはアセチルコリン）。神経筋接合部もニコチン受容体。"}, {"id": "s2-20", "set": 2, "n": 20, "c": "感覚", "t": "感覚・体性感覚の伝導路", "p": "p.76〜80※", "r": "模試 2024問89（聴覚の伝達）／2025問90（平衡感覚の伝導路）と同系統", "s": "意識にのぼる深部感覚を伝える伝導路はどれか。", "neg": false, "two": false, "o": [["外側脊髄視床路", "誤り。外側脊髄視床路は痛覚・温度覚を伝える。脊髄で交叉して反対側を上行する。", 0], ["前脊髄視床路", "誤り。前脊髄視床路は粗大な触圧覚を伝える。", 0], ["後索－内側毛帯路", "正しい。意識にのぼる深部感覚（位置覚・振動覚）と識別性の触圧覚は、後索を同側で上行し、延髄の後索核で交叉して内側毛帯を通り視床へ向かう。", 1], ["外側皮質脊髄路", "誤り。外側皮質脊髄路は運動の下行路（錐体路）で、感覚の伝導路ではない。", 0]], "z": "後索–内側毛帯路＝深部感覚・識別性触圧覚・振動覚（延髄で交叉）。脊髄視床路＝痛覚・温度覚（外側）・粗大な触圧覚（前）（脊髄で交叉）。意識にのぼらない深部感覚は脊髄小脳路で小脳へ。"}, {"id": "s2-21", "set": 2, "n": 21, "c": "筋", "t": "筋・サルコメアの構造", "p": "p.12〜13", "r": "模試 2022問82（A暗帯とミオシンフィラメント）／2024問82", "s": "骨格筋の収縮時に長さが変化しないのはどれか。", "neg": true, "two": false, "o": [["A帯", "正しい。A帯はミオシンフィラメントの長さそのものなので、収縮しても長さは変わらない。", 1], ["I帯", "誤り。I帯（アクチンだけの部分）は短くなる。", 0], ["H帯", "誤り。H帯（ミオシンだけの部分）は短くなり、強く収縮すると消える。", 0], ["サルコメア", "誤り。Z線からZ線までのサルコメアは短くなる。", 0]], "z": "滑走説：アクチンがミオシンの間に滑り込み、フィラメント自体の長さは変わらない。変わらない＝A帯、短くなる＝I帯・H帯・サルコメア。"}, {"id": "s2-22", "set": 2, "n": 22, "c": "筋", "t": "筋・平滑筋", "p": "p.20〜21", "r": "模試 2022問83（筋について誤っているのはどれか）", "s": "平滑筋で誤っているのはどれか。", "neg": true, "two": false, "o": [["横紋をもたない", "正しい記述。平滑筋は紡錘形の細胞で、横紋をもたない。", 0], ["トロポニンをもつ", "誤りの記述（これが正解）。平滑筋にはトロポニンがない。Ca²⁺はカルモジュリンと結合し、ミオシン軽鎖キナーゼを活性化して収縮を起こす。", 1], ["ギャップ結合がある", "正しい記述。内臓平滑筋（単一ユニット型）はギャップ結合でつながり、まとまって収縮する。", 0], ["自動性を示すものがある", "正しい記述。消化管などの平滑筋は自動性を示し、自発的に収縮をくり返す。", 0]], "z": "平滑筋＝横紋なし・トロポニンなし（カルモジュリン）・ギャップ結合・自動性あり・収縮は遅いが長く続き疲れにくい・伸展されると収縮する。骨格筋と心筋はトロポニンでCa²⁺を受け取る。"}, {"id": "s2-23", "set": 2, "n": 23, "c": "感覚", "t": "感覚・聴覚（音の高さ）", "p": "p.69〜71", "r": "模試 2022問88（内耳）／2020問104（聴覚の受容器）", "s": "音の高さ（周波数）の識別で正しいのはどれか。", "neg": false, "two": false, "o": [["蝸牛基底部では低音を受容する", "誤り。蝸牛の基底部（入口側）は高い音を受容する。", 0], ["蝸牛頂部では高音を受容する", "誤り。蝸牛の頂部は低い音を受容する。", 0], ["基底膜の最大振動部位により識別される", "正しい。基底膜は部位によって幅と硬さが違い、音の高さごとに最も大きく振動する場所が決まっている（場所説）。", 1], ["耳小骨の振動数により識別される", "誤り。耳小骨は鼓膜の振動を増幅して内耳へ伝える装置で、音の高さの識別はしない。", 0]], "z": "基底部＝高音、頂部＝低音（「入口が高い」）。老人性難聴は基底部の有毛細胞から障害されるため高音域から聞こえにくくなる。音の大きさは興奮する有毛細胞の数とインパルスの頻度で識別される。"}, {"id": "s2-24", "set": 2, "n": 24, "c": "感覚", "t": "感覚・錐体と杆体", "p": "p.63〜66※", "r": "模試 2024問88（屈折異常）／2025問89（光の三原色）", "s": "網膜の錐体細胞で正しいのはどれか。", "neg": false, "two": false, "o": [["網膜周辺部に多い", "誤り。網膜周辺部に多いのは杆体である。", 0], ["暗順応に関与する", "誤り。暗順応に関わるのは光の感度が高い杆体である。", 0], ["ロドプシンを含む", "誤り。ロドプシンを含むのは杆体である。錐体はフォトプシン（3種類）を含む。", 0], ["中心窩に密集する", "正しい。錐体は中心窩に密集し、明るい所での色覚と細かいものを見分ける視力を担う。", 1]], "z": "錐体＝中心窩に多い・明所視・色覚（赤・緑・青の3種類）・視力が高い。杆体＝周辺部に多い・暗所視・ロドプシン（ビタミンAから）・感度が高い・暗順応。ビタミンA欠乏で夜盲症。"}, {"id": "s2-25", "set": 2, "n": 25, "c": "競技", "t": "発育・スキャモンの発育曲線", "p": "p.235〜236", "r": "模試 2021問105（同一論点）／2021問104・2025問104（加齢・発育は3年で出題）", "s": "スキャモンの発育曲線で、思春期以降に急速に発育するのはどれか。", "neg": false, "two": false, "o": [["一般型", "誤り。一般型（身長・体重・内臓など）は乳幼児期と思春期の2回伸びるS字状の曲線を描く。", 0], ["神経型", "誤り。神経型（脳・脊髄など）は乳幼児期に急速に発育し、6歳ごろに成人の約90％に達する。", 0], ["リンパ型", "誤り。リンパ型（胸腺・リンパ節など）は学童期に成人の約2倍に達し、その後減少する。", 0], ["生殖型", "正しい。生殖型（精巣・卵巣など）は思春期まで低いまま推移し、思春期以降に急速に発育する。", 1]], "z": "スキャモンの発育曲線（20歳を100％とする）：神経型＝早く伸びる（6歳で約90％）、リンパ型＝思春期前に約200％→減少、一般型＝S字状、生殖型＝思春期以降に急増。運動指導では神経型が伸びる幼児期に多様な動きを経験させるとよい。"}, {"id": "s3-1", "set": 3, "n": 1, "c": "総論", "t": "総論・細胞小器官", "p": "p.4〜7※", "r": "第33回問81でATP産生（ミトコンドリア）、第34回問81でゴルジ装置が問われた。同じ細胞小器官の表を3年目の角度から問う形。", "s": "リソソームの機能はどれか。", "neg": false, "two": false, "o": [["ATP の産生", "誤り。ATPを産生するのはミトコンドリアである（好気的代謝の場）。", 0], ["タンパク質の合成", "誤り。タンパク質を合成するのはリボソーム（粗面小胞体に付着したものを含む）である。", 0], ["加水分解酵素による分解", "正しい。リソソームは多種類の加水分解酵素を含み、細胞内に取り込んだ物質や古くなった細胞小器官を分解する。", 1], ["ステロイドホルモンの合成", "誤り。ステロイドホルモンや脂質を合成するのは滑面小胞体である。", 0]], "z": "核＝遺伝情報（DNA）、リボソーム・粗面小胞体＝タンパク質合成、滑面小胞体＝脂質・ステロイドホルモン合成、ゴルジ装置＝タンパク質の修飾・濃縮・分泌顆粒の形成、リソソーム＝分解、ミトコンドリア＝ATP産生、中心体＝細胞分裂。"}, {"id": "s3-2", "set": 3, "n": 2, "c": "筋", "t": "筋・興奮収縮連関", "p": "p.14", "r": "第32回問81で横行小管、第34回問82でH帯が問われた。収縮機構の中核であるCa²⁺とトロポニンは5年間未出。", "s": "骨格筋の収縮でカルシウムイオンが結合するのはどれか。", "neg": false, "two": false, "o": [["アクチン", "誤り。アクチンは細いフィラメントの主成分で、ミオシン頭部が結合する相手である。Ca²⁺は直接結合しない。", 0], ["ミオシン", "誤り。ミオシンは太いフィラメントで、頭部がATPを分解してアクチンをたぐり寄せる。", 0], ["トロポニン", "正しい。筋小胞体から放出されたCa²⁺はトロポニン（トロポニンC）に結合する。", 1], ["トロポミオシン", "誤り。トロポミオシンは安静時にアクチンのミオシン結合部位を覆っている。Ca²⁺がトロポニンに結合すると位置がずれ、結合部位が露出する。", 0]], "z": "活動電位→横行小管→筋小胞体からCa²⁺放出→Ca²⁺がトロポニンに結合→トロポミオシンが移動→アクチンとミオシンが結合（滑走）→Ca²⁺が筋小胞体へ回収されて弛緩。回収にもATPが必要。"}, {"id": "s3-3", "set": 3, "n": 3, "c": "筋", "t": "筋・筋線維のタイプ", "p": "p.15〜17", "r": "模試では教科書p.15〜17が各3回引用された最頻出帯。本試験では第32回問84の運動単位で間接的に問われたのみで、線維タイプそのものは未出。", "s": "遅筋線維（Ⅰ型）で正しいのはどれか。", "neg": false, "two": false, "o": [["収縮速度が速い", "誤り。Ⅰ型（遅筋）は収縮速度が遅い。速いのはⅡ型（速筋）である。", 0], ["ミオグロビンに乏しい", "誤り。Ⅰ型はミオグロビンが多く、赤く見える（赤筋）。", 0], ["解糖系の酵素活性が高い", "誤り。解糖系の酵素活性が高いのはⅡx（Ⅱb）型である。Ⅰ型は酸化系の酵素活性が高い。", 0], ["ミトコンドリアが多い", "正しい。Ⅰ型は有酸素的にATPをつくるため、ミトコンドリアと毛細血管が多く、疲労しにくい。", 1]], "z": "Ⅰ型（SO・遅筋・赤筋）＝遅い・疲れにくい・ミトコンドリアとミオグロビンが多い・酸化系。Ⅱx型（FG・速筋・白筋）＝速い・疲れやすい・解糖系。Ⅱa型（FOG）はその中間。運動単位ではS型＝Ⅰ型、FR型＝Ⅱa型、FF型＝Ⅱx型。"}, {"id": "s3-4", "set": 3, "n": 4, "c": "神経", "t": "神経・自律神経の作用", "p": "p.37", "r": "第31回問83「交感神経の作用はどれか」の向きを反転させたもの。自律神経は第31・33・34回と3回出題されている定番枠。", "s": "副交感神経の作用はどれか。", "neg": false, "two": false, "o": [["気管支の拡張", "誤り。気管支を拡張させるのは交感神経である。副交感神経は気管支を収縮させる。", 0], ["瞳孔の散大", "誤り。瞳孔を散大させるのは交感神経（瞳孔散大筋）である。副交感神経は縮瞳（瞳孔括約筋）。", 0], ["膀胱排尿筋の収縮", "正しい。副交感神経（骨盤神経）は排尿筋を収縮させ、内尿道括約筋を弛緩させて排尿を起こす。", 1], ["心拍数の増加", "誤り。心拍数を増やすのは交感神経である。副交感神経（迷走神経）は心拍数を減らす。", 0]], "z": "副交感神経＝縮瞳・気管支収縮・心拍数↓・消化管運動と分泌↑・排尿筋収縮。交感神経＝散瞳・気管支拡張・心拍数↑・消化管運動↓・排尿筋弛緩・汗腺分泌↑（例外的にコリン作動性）。唾液腺はどちらでも分泌が増える。"}, {"id": "s3-5", "set": 3, "n": 5, "c": "神経", "t": "神経・言語中枢", "p": "p.39〜41※", "r": "第32回問83でブローカ野、第34回問85で頭頂連合野が問われた。対概念であるウェルニッケ野が次の候補。", "s": "ウェルニッケ野の損傷で生じるのはどれか。", "neg": false, "two": false, "o": [["書字のみが障害される", "誤り。ウェルニッケ野の損傷では、話し言葉も書き言葉も理解が障害される。書字だけの障害ではない。", 0], ["発語が途切れがちになる", "誤り。発語がたどたどしく途切れるのは運動性失語で、ブローカ野（前頭葉）の損傷による。", 0], ["話し言葉の理解が障害される", "正しい。ウェルニッケ野（側頭葉）は感覚性言語中枢で、損傷すると言葉の理解ができなくなる（感覚性失語）。話すことは流暢だが内容が伴わない。", 1], ["片側の運動麻痺が生じる", "誤り。片側の運動麻痺は、反対側の一次運動野（中心前回）や錐体路の障害で起こる。", 0]], "z": "ブローカ野（前頭葉・下前頭回）＝運動性言語中枢→運動性失語（理解は保たれるが話せない）。ウェルニッケ野（側頭葉・上側頭回）＝感覚性言語中枢→感覚性失語（話せるが理解できない）。多くの人で左半球にある。"}, {"id": "s3-6", "set": 3, "n": 6, "c": "運動", "t": "運動の生理・ゴルジ腱器官", "p": "p.47〜48", "r": "問84〜86は5年連続で神経・反射の枠。模試では教科書p.47〜48が繰り返し引用されるが、本試験では筋紡錘側（第31回問84）のみで腱器官側は未出。", "s": "ゴルジ腱器官からの求心性線維はどれか。", "neg": false, "two": false, "o": [["Ⅰa 群", "誤り。Ⅰa群線維は筋紡錘の一次終末（らせん形終末）からの線維で、伸張反射を起こす。", 0], ["Ⅰb 群", "正しい。ゴルジ腱器官は筋と腱の移行部にあって張力を受容し、Ⅰb群線維で脊髄へ伝える。同名筋のα運動ニューロンを抑制する（Ⅰb抑制・自原抑制）。", 1], ["Ⅱ 群", "誤り。Ⅱ群線維は筋紡錘の二次終末（散形終末）や皮膚の機械受容器からの線維である。", 0], ["Ⅲ 群", "誤り。Ⅲ群（Aδ）線維は速い痛み（一次痛）や温度覚を伝える。", 0]], "z": "筋紡錘＝筋線維と並列・長さを検出・Ⅰa群とⅡ群・γ運動ニューロンが感度を調節・同名筋を興奮。ゴルジ腱器官＝直列・張力を検出・Ⅰb群・同名筋を抑制。Ⅳ群（C線維）は遅い痛み（二次痛）。"}, {"id": "s3-7", "set": 3, "n": 7, "c": "神経", "t": "神経・錐体路と錐体外路", "p": "p.44〜45※", "r": "第31回問88「深部感覚の伝導路に含まれないのはどれか」、第32回問87「下行性痛覚抑制系に含まれるのはどれか」と、伝導路の帰属を問う形が2年続いている。", "s": "錐体路に含まれないのはどれか。", "neg": true, "two": false, "o": [["外側皮質脊髄路", "含まれる。外側皮質脊髄路は延髄の錐体で交叉する錐体路の主な経路で、四肢の随意運動を担う。", 0], ["前皮質脊髄路", "含まれる。前皮質脊髄路は錐体で交叉せずに下行し、脊髄の各髄節で交叉する。体幹の筋を支配する。", 0], ["皮質核路", "含まれる。皮質核路（皮質延髄路）は脳神経の運動核に終わる錐体路で、顔面や舌などの随意運動を担う。", 0], ["赤核脊髄路", "含まれない（これが正解）。赤核脊髄路は中脳の赤核から起こる錐体外路で、屈筋の緊張を高める。", 1]], "z": "錐体路＝大脳皮質運動野から起こる随意運動の経路（外側皮質脊髄路・前皮質脊髄路・皮質核路）。錐体外路＝赤核脊髄路・前庭脊髄路・網様体脊髄路・視蓋脊髄路などで、姿勢や筋緊張を調節する。"}, {"id": "s3-8", "set": 3, "n": 8, "c": "感覚", "t": "感覚・受容器と感覚の組合せ", "p": "p.60", "r": "第31回問87で同形式が出題済み。模試でも教科書p.60が3回引用されており、両方で繰り返される論点。", "s": "感覚と受容器の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["温 覚 ──── クラウゼ小体", "誤り。温覚の受容器は自由神経終末とされる（古い分類ではルフィニ小体）。クラウゼ小体は冷覚の受容器とされてきた構造である。", 0], ["振動覚 ──── パチニ小体", "正しい。パチニ小体は皮下の深部にある速順応型の受容器で、振動（とくに高い周波数）を受容する。", 1], ["触 覚 ──── 自由神経終末", "誤り。触覚を受容するのはマイスナー小体やメルケル盤である。自由神経終末は痛覚・温度覚を受容する。", 0], ["関節位置覚 ──── マイスナー小体", "誤り。マイスナー小体は真皮乳頭にある触覚の受容器である。関節の位置覚はルフィニ終末や筋紡錘などが担う。", 0]], "z": "マイスナー小体＝触覚・低い周波数の振動（速順応）、メルケル盤＝触圧覚（遅順応）、パチニ小体＝振動（速順応）、ルフィニ終末＝皮膚の伸張・関節の位置覚（遅順応）、自由神経終末＝痛覚・温度覚。"}, {"id": "s3-9", "set": 3, "n": 9, "c": "感覚", "t": "感覚・聴覚（音の高さ）", "p": "p.70〜72※", "r": "第33回問89で視覚が問われた。聴覚は第34回問88（嗅覚と視床）で周辺的に触れられたのみ。蝸牛基底部と頂部は対概念として狙われやすい。", "s": "音の高さの識別に関わるのはどれか。", "neg": false, "two": false, "o": [["鼓膜の振動数", "誤り。鼓膜は音の周波数で振動するが、音の高さの識別は内耳の基底膜で行われる。", 0], ["基底膜の振動部位", "正しい。音の高さによって基底膜の最も強く振動する部位が異なり、その部位のコルチ器が興奮する（場所説）。", 1], ["耳小骨の可動域", "誤り。耳小骨は鼓膜の振動を増幅して卵円窓へ伝える。可動域で高さを識別するわけではない。", 0], ["外リンパの量", "誤り。外リンパは前庭階・鼓室階を満たす液で、その量は音の高さの識別には関係しない。", 0]], "z": "高い音＝蝸牛の基底部（入口側）、低い音＝蝸牛の頂部が最もよく振動する。老人性難聴は基底部から障害されるので高音から聞こえにくくなる。音の大きさは興奮する有毛細胞の数とインパルスの頻度で識別される。"}, {"id": "s3-10", "set": 3, "n": 10, "c": "内分", "t": "内分泌・ホルモンの化学的分類", "p": "p.85〜86", "r": "第32回問90・第33回問90と、ステロイドホルモンの判別が2年連続で出題された。同じ化学分類の表を別の角度から問う形。模試でも教科書p.85が4回引用された最頻出ページ。", "s": "アミノ酸誘導体ホルモンはどれか。", "neg": false, "two": false, "o": [["インスリン", "誤り。インスリンはアミノ酸が多数つながったペプチドホルモンである。", 0], ["コルチゾール", "誤り。コルチゾールはコレステロールからつくられるステロイドホルモンである。", 0], ["サイロキシン", "正しい。サイロキシン（甲状腺ホルモン）はアミノ酸のチロシンにヨウ素が結合してつくられるアミノ酸誘導体（アミン）ホルモンである。", 1], ["バゾプレッシン", "誤り。バソプレシンはアミノ酸9個からなるペプチドホルモンである。", 0]], "z": "アミン（アミノ酸誘導体）＝アドレナリン・ノルアドレナリン・ドーパミン・甲状腺ホルモン・メラトニン。ステロイド＝副腎皮質ホルモン・性ホルモン・活性型ビタミンD。それ以外の多くはペプチド。水に溶けにくいステロイドと甲状腺ホルモンは核内受容体に結合する。"}, {"id": "s3-11", "set": 3, "n": 11, "c": "内分", "t": "内分泌・バソプレシンの分泌調節", "p": "p.89〜90※", "r": "第32回問101「バゾプレッシン分泌を抑制するのはどれか」の向きを反転させたもの。", "s": "血漿浸透圧の上昇で分泌が増加するのはどれか。", "neg": false, "two": false, "o": [["レニン", "誤り。レニンは腎臓の傍糸球体細胞から分泌され、血圧や循環血液量の低下で増える。浸透圧の上昇が直接の刺激ではない。", 0], ["カルシトニン", "誤り。カルシトニンは血中カルシウム濃度の上昇で分泌が増える。", 0], ["バゾプレッシン", "正しい。視床下部の浸透圧受容器が血漿浸透圧の上昇を感知し、下垂体後葉からバソプレシンが分泌される。集合管での水の再吸収が増え、尿は濃縮される。", 1], ["心房性ナトリウム利尿ペプチド", "誤り。心房性ナトリウム利尿ペプチドは循環血液量が増えて心房が伸展すると分泌され、Na⁺と水の排泄を促す。", 0]], "z": "バソプレシン（抗利尿ホルモン）の分泌が増える＝血漿浸透圧の上昇・循環血液量の減少・血圧低下。減る＝浸透圧の低下・飲水・アルコール。分泌が不足すると尿崩症（大量の薄い尿）になる。"}, {"id": "s3-12", "set": 3, "n": 12, "c": "生殖", "t": "生殖・排卵とLHサージ", "p": "p.108〜110※", "r": "模試では3年以上繰り返された論点だが、本試験の過去5年では未出。生殖は問91〜92が定位置。", "s": "排卵の直前に急激に増加するのはどれか。", "neg": false, "two": false, "o": [["プロゲステロン", "誤り。プロゲステロンは排卵後に黄体から分泌されて増える。排卵の直前に急増するわけではない。", 0], ["黄体形成ホルモン", "正しい。卵胞から分泌されたエストロゲンが高い値になると正のフィードバックが起こり、黄体形成ホルモン（LH）が急激に大量分泌される（LHサージ）。これが排卵を起こす。", 1], ["ヒト絨毛性ゴナドトロピン", "誤り。ヒト絨毛性ゴナドトロピン（hCG）は妊娠すると絨毛（胎盤）から分泌される。", 0], ["卵胞刺激ホルモン", "誤り。卵胞刺激ホルモン（FSH）もLHサージと同時にやや増えるが、急増して排卵を起こす主役はLHである。", 0]], "z": "卵胞期＝FSHで卵胞が発育しエストロゲンが増加→排卵直前にLHサージ→排卵→黄体期＝黄体からプロゲステロンとエストロゲン（基礎体温が上昇）→妊娠しなければ黄体が退縮して月経。"}, {"id": "s3-13", "set": 3, "n": 13, "c": "血液", "t": "血液・血液凝固", "p": "p.119〜125", "r": "第34回問93で外因系の起点、第30回問91で線維素溶解が問われた。凝固カスケード全体を押さえる必要がある。", "s": "血液凝固で正しいのはどれか。", "neg": false, "two": false, "o": [["カルシウムイオンは必要としない", "誤り。Ca²⁺（第Ⅳ因子）は多くの凝固反応に必要である。採血管のクエン酸ナトリウムはCa²⁺を除いて凝固を防いでいる。", 0], ["プラスミンがフィブリンを形成する", "誤り。フィブリンを形成するのはトロンビンである。プラスミンはフィブリンを分解する（線溶）。", 0], ["ビタミンKは凝固因子の合成に必要である", "正しい。ビタミンKは肝臓でプロトロンビン（第Ⅱ因子）や第Ⅶ・Ⅸ・Ⅹ因子をつくるのに必要である。不足すると出血しやすくなる。", 1], ["内因系は組織因子から始まる", "誤り。組織因子（第Ⅲ因子）から始まるのは外因系である。内因系は血液が血管内皮下のコラーゲンなどに接触して第Ⅻ因子が活性化されることから始まる。", 0]], "z": "一次止血＝血小板の粘着・凝集（血小板血栓）。二次止血＝凝固因子の連鎖でフィブリノゲン→フィブリン（トロンビンが作用）。外因系＝組織因子から、内因系＝第Ⅻ因子から。線溶＝プラスミンがフィブリンを分解。"}, {"id": "s3-14", "set": 3, "n": 14, "c": "免疫", "t": "免疫・免疫グロブリンのクラス", "p": "p.128〜131", "r": "第33回問94でIgE受容体、第34回問94で自然免疫が問われた。免疫は5年中4回出題されている。", "s": "胎盤を通過する免疫グロブリンはどれか。", "neg": false, "two": false, "o": [["IgA", "誤り。IgAは唾液・涙・母乳（初乳）などの分泌液に多く、粘膜で病原体の侵入を防ぐ。胎盤は通過しない。", 0], ["IgE", "誤り。IgEは肥満細胞や好塩基球に結合し、即時型（Ⅰ型）アレルギーに関わる。", 0], ["IgG", "正しい。IgGは血中に最も多い抗体で、唯一胎盤を通過する。母体から移行して生後数か月の新生児を守る（受動免疫）。", 1], ["IgM", "誤り。IgMは五量体で最も大きく、感染の初期に最初につくられる。大きいため胎盤は通過しない。", 0]], "z": "IgG＝最も多い・胎盤通過・二次応答の主役。IgM＝最も大きい（五量体）・一次応答で最初に出る。IgA＝分泌液・初乳（母乳で乳児へ）。IgE＝Ⅰ型アレルギー・寄生虫。IgD＝B細胞表面の受容体。"}, {"id": "s3-15", "set": 3, "n": 15, "c": "骨", "t": "骨Ca・カルシトニン", "p": "p.136〜138", "r": "問94〜95のCa代謝は5年連続で出題されている最も固い枠。第30回成人のCa、第31回骨吸収の抑制、第32回血中Ca低下への反応、第33回腎でのCa再吸収、第34回骨端線と続いており、カルシトニン単独はまだ出ていない。", "s": "カルシトニンの作用はどれか。", "neg": false, "two": false, "o": [["破骨細胞の活性を高める", "誤り。破骨細胞の活性を高める（骨吸収を促す）のはパラソルモンである。カルシトニンは破骨細胞を抑制する。", 0], ["血中カルシウム濃度を低下させる", "正しい。カルシトニンは甲状腺の傍濾胞細胞（C細胞）から分泌され、骨吸収を抑えて血中カルシウム濃度を低下させる。", 1], ["腎でのリン酸再吸収を促進する", "誤り。カルシトニンにこの作用はない。なお、パラソルモンは逆に腎でのリン酸の再吸収を抑制し、血中リン濃度を下げる。", 0], ["腸管でのカルシウム吸収を促進する", "誤り。腸管でのカルシウム吸収を促進するのは活性型ビタミンDである。", 0]], "z": "血中Caを上げる＝パラソルモン（骨吸収↑・腎でCa再吸収↑・ビタミンD活性化↑・リン↓）、活性型ビタミンD（腸管でCa吸収↑）。下げる＝カルシトニン（破骨細胞を抑制）。"}, {"id": "s3-16", "set": 3, "n": 16, "c": "循環", "t": "循環・心音", "p": "p.144〜145", "r": "第32回問97・第34回問96と、等容性収縮期が2回問われている。心周期の同じ図を音の側から問う形。", "s": "第Ⅱ心音が生じるのはどれか。", "neg": false, "two": false, "o": [["房室弁の閉鎖", "誤り。房室弁（僧帽弁・三尖弁）の閉鎖で生じるのは第Ⅰ音で、心室収縮期の始まりを示す。", 0], ["動脈弁の閉鎖", "正しい。第Ⅱ音は動脈弁（大動脈弁・肺動脈弁）が閉じる音で、心室拡張期の始まりを示す。", 1], ["房室弁の開放", "誤り。弁が開くときにはふつう音は生じない。", 0], ["動脈弁の開放", "誤り。動脈弁が開くときにもふつう音は生じない。", 0]], "z": "第Ⅰ音＝房室弁閉鎖・収縮期の始まり（低く長い）。第Ⅱ音＝動脈弁閉鎖・拡張期の始まり（高く短い）。第Ⅲ音＝急速充満期の心室壁の振動。等容性収縮期と等容性弛緩期は両方の弁が閉じている。"}, {"id": "s3-17", "set": 3, "n": 17, "c": "循環", "t": "循環・平均血圧の計算", "p": "p.150〜152※", "r": "第31回問95で収縮期130・拡張期70の同一形式が出題された。本試験の計算問題は5年で2問と少なく、いずれも第31回に集中している。", "s": "収縮期血圧 150 mmHg、拡張期血圧 90 mmHg のときの平均血圧はどれか。", "neg": false, "two": false, "o": [["100 mmHg", "誤り。拡張期血圧に脈圧の6分の1を足した値で、式が違う。", 0], ["110 mmHg", "正しい。脈圧＝150−90＝60mmHg。平均血圧＝拡張期血圧＋脈圧÷3＝90＋20＝110mmHg。", 1], ["120 mmHg", "誤り。収縮期と拡張期の単純な平均（(150＋90)÷2）である。心周期では拡張期のほうが長いので、平均血圧は単純平均より低くなる。", 0], ["130 mmHg", "誤り。計算式に当てはまらない値である。", 0]], "z": "脈圧＝収縮期血圧−拡張期血圧。平均血圧＝拡張期血圧＋脈圧÷3。例：120/80なら脈圧40、平均血圧は約93mmHg。"}, {"id": "s3-18", "set": 3, "n": 18, "c": "呼吸", "t": "呼吸・肺サーファクタント", "p": "p.161※", "r": "第30回問97で肺コンプライアンスと気道抵抗の組合せ、第32回問99・第34回問98で呼吸筋が問われた。サーファクタント自体は未出。", "s": "肺サーファクタントの作用はどれか。", "neg": false, "two": false, "o": [["気道抵抗を高める", "誤り。サーファクタントは肺胞にはたらき、気道抵抗を高める作用はない。", 0], ["肺胞の表面張力を低下させる", "正しい。Ⅱ型肺胞上皮細胞がつくるサーファクタント（表面活性物質）は、肺胞内面の表面張力を下げる。", 1], ["肺コンプライアンスを低下させる", "誤り。表面張力が下がると肺は膨らみやすくなるので、肺コンプライアンスは上昇する。", 0], ["呼息時に肺胞を虚脱させる", "誤り。サーファクタントは呼息時に小さな肺胞がつぶれる（虚脱する）のを防ぐ。", 0]], "z": "サーファクタント＝Ⅱ型肺胞上皮細胞が産生・表面張力↓・肺胞の虚脱を防ぐ・コンプライアンス↑。不足すると新生児呼吸窮迫症候群（早産児）になる。Ⅰ型肺胞上皮細胞はガス交換を担う薄い細胞。"}, {"id": "s3-19", "set": 3, "n": 19, "c": "呼吸", "t": "呼吸・二酸化炭素の運搬", "p": "p.168※", "r": "第31回問100で酸素解離曲線、第32回問100・第33回問100で酸素分圧が、高い側と低い側の両方から問われた。酸素側が続いた後の二酸化炭素側。", "s": "血液中の二酸化炭素が最も多く運搬される形はどれか。", "neg": false, "two": false, "o": [["物理的溶解", "誤り。血漿に物理的に溶けて運ばれるCO₂は約10％にすぎない。", 0], ["炭酸水素イオン", "正しい。CO₂は赤血球内の炭酸脱水酵素で炭酸になり、すぐ炭酸水素イオン（HCO₃⁻）とH⁺に分かれる。約70％がHCO₃⁻として血漿中を運ばれる。", 1], ["カルバミノ化合物", "誤り。ヘモグロビンのグロビン部分と結合したカルバミノ化合物として運ばれるのは約20％である。", 0], ["炭 酸", "誤り。炭酸（H₂CO₃）はすぐに電離するため、炭酸のままで運ばれる量はごくわずかである。", 0]], "z": "CO₂の運搬＝HCO₃⁻（約70％）＞カルバミノ化合物（約20％）＞物理的溶解（約10％）。O₂はほとんどがヘモグロビンのヘム鉄と結合して運ばれる。HCO₃⁻は血液のpHを保つ緩衝系にもなる。"}, {"id": "s3-20", "set": 3, "n": 20, "c": "腎", "t": "腎・原尿と尿量", "p": "p.174〜176※", "r": "第32回問102で近位尿細管、第33回問101で糸球体濾過率の推定、第34回問100で塩分過剰摂取が問われた。数値を問う形は模試で繰り返されている。", "s": "原尿のうち尿として排泄される割合はどれか。", "neg": false, "two": false, "o": [["約 1 ％", "正しい。原尿（糸球体濾過量）は1日約150〜180L、尿量は約1.5Lなので、尿になるのは約1％。99％は尿細管と集合管で再吸収される。", 1], ["約 10 ％", "誤り。約10％なら1日の尿量は15L以上になってしまう。", 0], ["約 30 ％", "誤り。実際の値よりはるかに多い。", 0], ["約 50 ％", "誤り。実際の値よりはるかに多い。", 0]], "z": "糸球体濾過量＝約100〜125mL/分（1日約150〜180L）、尿量＝1日約1.0〜1.5L。再吸収の多くは近位尿細管（水とNa⁺の約2/3、グルコースとアミノ酸はほぼ全部）。最終的な尿量はバソプレシンが集合管で調節する。"}, {"id": "s3-21", "set": 3, "n": 21, "c": "総論", "t": "総論・酸塩基平衡", "p": "p.198〜199", "r": "第30回問81で呼吸性アシドーシスが問われた。なお既存の模試解説（2021年度問82）では嘔吐と下痢の説明が入れ替わっているため、学生に配る際は注意が必要。", "s": "代謝性アシドーシスをきたすのはどれか。", "neg": false, "two": false, "o": [["嘔 吐", "誤り。嘔吐では胃酸（H⁺）が失われるので、代謝性アルカローシスになる。", 0], ["下 痢", "正しい。下痢では腸液中の炭酸水素イオン（HCO₃⁻）が大量に失われるので、代謝性アシドーシスになる。", 1], ["過換気", "誤り。過換気ではCO₂が過剰に排出されるので、呼吸性アルカローシスになる。", 0], ["利尿薬の過剰投与", "誤り。利尿薬の過剰投与ではK⁺やH⁺が尿中に失われ、代謝性アルカローシスになりやすい。", 0]], "z": "代謝性アシドーシス＝下痢・糖尿病性ケトアシドーシス・腎不全・激しい運動（乳酸）。代謝性アルカローシス＝嘔吐・重曹の大量摂取。呼吸性アシドーシス＝換気の低下（CO₂がたまる）。呼吸性アルカローシス＝過換気。"}, {"id": "s3-22", "set": 3, "n": 22, "c": "代謝", "t": "代謝・糖新生の材料", "p": "p.190〜192※", "r": "第31回問103「ミトコンドリアを必要としない反応はどれか」、第34回問101「二糖類はどれか」と、代謝は基礎的な分類を問う形が続いている。", "s": "糖新生の材料にならないのはどれか。", "neg": true, "two": false, "o": [["乳 酸", "材料になる。筋でできた乳酸は肝臓に運ばれてグルコースに戻される（コリ回路）。", 0], ["脂肪酸", "材料にならない（これが正解）。脂肪酸はβ酸化でアセチルCoAになるが、ヒトはアセチルCoAからグルコースをつくることができない。", 1], ["グリセロール", "材料になる。中性脂肪が分解されてできるグリセロールは糖新生に使われる。", 0], ["アミノ酸", "材料になる。アラニンなどの糖原性アミノ酸は糖新生に使われる。", 0]], "z": "糖新生＝主に肝臓（一部は腎臓）で、糖以外の物質からグルコースをつくる。材料＝乳酸・ピルビン酸・グリセロール・糖原性アミノ酸。促進するホルモン＝グルカゴン・コルチゾール・アドレナリン。"}, {"id": "s3-23", "set": 3, "n": 23, "c": "消化", "t": "消化・消化管ホルモンの作用", "p": "p.200〜205※", "r": "第32回問104で同形式、第34回問103でセクレチンによる胃液分泌抑制が問われた。模試でも教科書p.209の肝臓・胆道が4回引用されている。", "s": "消化管ホルモンと作用の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["ガストリン ──── 胃酸分泌の抑制", "誤り。ガストリンは胃の幽門部から分泌され、胃酸の分泌を促進する。", 0], ["セクレチン ──── 膵液中の重炭酸イオン分泌の促進", "正しい。セクレチンは酸性の胃内容が十二指腸に入ると分泌され、HCO₃⁻に富む膵液を出させて胃酸を中和する。", 1], ["コレシストキニン ──── 胆嚢の弛緩", "誤り。コレシストキニン（CCK）は胆嚢を収縮させて胆汁を出させ、消化酵素に富む膵液の分泌も促す。", 0], ["ソマトスタチン ──── 消化管ホルモン分泌の促進", "誤り。ソマトスタチンは各種消化管ホルモンの分泌を抑制する。", 0]], "z": "ガストリン＝胃酸分泌↑（タンパク質の分解産物で分泌）。セクレチン＝HCO₃⁻に富む膵液↑・胃酸分泌↓。コレシストキニン＝胆嚢収縮・消化酵素に富む膵液↑（脂肪・タンパク質で分泌）。ソマトスタチン＝分泌を全般に抑制。"}, {"id": "s3-24", "set": 3, "n": 24, "c": "体温", "t": "体温・寒冷時の反応", "p": "p.218〜219※", "r": "第32回問105「暑熱環境に曝露されたときに起こるのはどれか」の向きを反転させたもの。第34回問104では熱放散の分類が問われている。", "s": "寒冷環境に曝露されたときに起こらないのはどれか。", "neg": true, "two": false, "o": [["皮膚血管の収縮", "起こる。皮膚血管が収縮して皮膚の血流を減らし、熱放散を抑える。", 0], ["立毛筋の収縮", "起こる。立毛筋が収縮して鳥肌が立つ（ヒトでの保温効果は小さい）。", 0], ["発汗の増加", "起こらない（これが正解）。発汗は蒸発による熱放散を増やす反応で、暑熱時に起こる。寒冷時には抑制される。", 1], ["ふるえの出現", "起こる。ふるえは骨格筋の不随意な収縮で、熱を産生する。", 0]], "z": "寒冷時＝熱放散を減らす（皮膚血管収縮・立毛）＋熱産生を増やす（ふるえ・非ふるえ熱産生・甲状腺ホルモンやアドレナリンの分泌）。暑熱時＝皮膚血管拡張・発汗。体温調節中枢は視床下部。"}, {"id": "s3-25", "set": 3, "n": 25, "c": "加齢", "t": "加齢・加齢による変化", "p": "p.226〜228※", "r": "問104〜105の加齢枠は5年中4回。第31回問105・第33回問105（歩行）・第34回問105（睡眠）と続いており、呼吸機能の加齢変化はまだ出ていない。", "s": "加齢に伴って増加するのはどれか。", "neg": false, "two": false, "o": [["最大酸素摂取量", "誤り。最大酸素摂取量は加齢とともに低下する（最大心拍数の低下などによる）。", 0], ["残気量", "正しい。肺の弾性が低下して息を吐ききれなくなるため、残気量は増える。そのぶん肺活量は減る。", 1], ["腎血流量", "誤り。腎血流量や糸球体濾過量は加齢とともに低下する。", 0], ["唾液分泌量", "誤り。唾液の分泌量は加齢とともに低下し、口が乾きやすくなる。", 0]], "z": "加齢で増える＝残気量・収縮期血圧・脈圧・空腹時血糖・感覚の閾値（鈍くなる）。減る＝肺活量・最大酸素摂取量・最大心拍数・腎血流量・糸球体濾過量・唾液と胃液の分泌・骨量・筋量（とくにⅡ型線維）。変わりにくい＝安静時の心拍数。"}, {"id": "s4-1", "set": 4, "n": 1, "c": "総論", "t": "総論・細胞小器官", "p": "p.4〜7 ※", "r": "本試験 第33回問81（ATPを産生するのは）／第34回問81（ゴルジ装置の機能）", "s": "細胞小器官とそのはたらきの組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["粗面小胞体 ──── 脂質の合成", "粗面小胞体はリボソームが付着しており、タンパク質を合成する。脂質やステロイドホルモンを合成するのは滑面小胞体である。", 0], ["滑面小胞体 ──── タンパク質の合成", "滑面小胞体はリボソームが付着せず、脂質やステロイドホルモンを合成する。タンパク質合成は粗面小胞体である。", 0], ["リソソーム ──── 加水分解酵素による分解", "正しい。リソソームは多種類の加水分解酵素を含み、細胞内へ取り込んだ物質や老廃物を分解処理する。", 1], ["中心体 ──── ATPの産生", "中心体は核の近くにあり、細胞分裂やべん毛の形成に関与する。ATPを産生するのはミトコンドリアである。", 0]], "z": "細胞小器官は「核＝DNA」「リボソーム＝タンパク質合成」「粗面小胞体＝タンパク質合成（リボソーム付着）」「滑面小胞体＝脂質・ステロイドホルモン」「ゴルジ装置＝修飾・濃縮・分泌顆粒の生成」「リソソーム＝分解」「ミトコンドリア＝ATP産生」「中心体＝細胞分裂」で整理する。本試験は2年続けてこの表から出題している。"}, {"id": "s4-2", "set": 4, "n": 2, "c": "筋", "t": "筋・興奮収縮連関", "p": "p.14", "r": "模試 2026年度第2回問82（Ca²⁺とトロポニン）／2024年度第2回問82（ATP分解時）", "s": "骨格筋の興奮収縮連関で正しいのはどれか。", "neg": false, "two": false, "o": [["Ca²⁺はミオシン頭部に結合する", "Ca²⁺が結合するのはアクチン側にあるトロポニンである。この結合によりトロポミオシンが移動し、ミオシン頭部がアクチンと結合できるようになる。", 0], ["活動電位は横行小管を介して筋線維の深部へ伝わる", "正しい。筋線維鞘に生じた興奮は横行小管（T管）によって筋線維の深部へ導かれ、筋小胞体からのCa²⁺放出を引き起こす。", 1], ["筋小胞体はCa²⁺を細胞外へ排出する", "筋小胞体はCa²⁺を高濃度に貯蔵しており、興奮に応じて筋線維内（細胞質）へ放出する。細胞外への排出ではない。", 0], ["ATPが合成されるときにミオシン頭部が動く", "ミオシン頭部はATPが分解（加水分解）されるときに放出されるエネルギーを使って動く。合成時ではない。", 0]], "z": "興奮収縮連関は「運動神経→アセチルコリン→終板電位→筋線維鞘の活動電位→横行小管→筋小胞体からCa²⁺放出→トロポニンに結合→トロポミオシンが移動→ミオシン頭部がアクチンと結合→滑り込み」の順。Ca²⁺の結合先はトロポニン、エネルギーはATPの分解時である。"}, {"id": "s4-3", "set": 4, "n": 3, "c": "神経", "t": "神経・伝達物質", "p": "p.37〜40", "r": "模試 2022年度問85（ムスカリン様受容体）／2020年度問100（コリン作動性・正答率7%）", "s": "アセチルコリンが伝達物質としてはたらくのはどれか。2つ選べ。", "neg": false, "two": true, "o": [["神経筋接合部", "正しい。運動神経終末からアセチルコリンが放出され、終板のニコチン性アセチルコリン受容体に結合して終板電位を生じる。", 1], ["立毛筋を支配する交感神経節後線維", "立毛筋を支配する交感神経節後線維はアドレナリン作動性で、ノルアドレナリンを放出する。", 0], ["汗腺を支配する交感神経節後線維", "正しい。交感神経節後線維は原則としてノルアドレナリンを放出するが、汗腺を支配する線維だけは例外的にアセチルコリンを放出する（コリン作動性）。", 1], ["皮膚血管を支配する交感神経節後線維", "皮膚血管を支配する交感神経節後線維もアドレナリン作動性である。", 0]], "z": "アセチルコリンが使われるのは「自律神経節（交感・副交感とも節前線維→節後ニューロン、ニコチン受容体）」「副交感神経節後線維→効果器（ムスカリン受容体）」「神経筋接合部（ニコチン受容体）」「汗腺を支配する交感神経節後線維」の4か所。ノルアドレナリンは交感神経節後線維→効果器のみである。"}, {"id": "s4-4", "set": 4, "n": 4, "c": "神経", "t": "神経・中枢", "p": "p.42 ※", "r": "模試 2026年度第2回問85（視床下部に中枢があるもの）／2021年度問86（頸反射の中枢）", "s": "延髄に中枢があるのはどれか。", "neg": false, "two": false, "o": [["体温調節", "体温調節中枢は視床下部にある。摂食・飲水・性行動の中枢も視床下部である。", 0], ["排尿", "排尿反射の中枢は仙髄にある。橋や大脳皮質には随意的に制御する高次中枢がある。", 0], ["飲水", "飲水行動を起こす口渇中枢は視床下部にある。", 0], ["嚥下", "正しい。嚥下中枢は脳幹（延髄）にあり、口腔期で意識的に咽頭へ送られた食物は、以降は反射性に咽頭期・食道期へと進む。", 1]], "z": "延髄＝呼吸・循環（心臓、血管運動）・嚥下・嘔吐・咳・唾液分泌。視床下部＝体温調節・摂食・飲水・性行動・ホルモン分泌・自律神経の最高中枢。仙髄＝排尿・排便・勃起。中脳＝対光反射・立ち直り反射。"}, {"id": "s4-5", "set": 4, "n": 5, "c": "神経", "t": "神経・活動電位", "p": "p.26〜29", "r": "模試 2022年度問84（全か無の法則）／2024年度問84（伝導速度）", "s": "活動電位で誤っているのはどれか。", "neg": true, "two": false, "o": [["絶対不応期には新たな活動電位が生じない", "正しい。脱分極直後の絶対不応期では、どれほど強い刺激を与えても新たな活動電位は生じない。", 0], ["刺激が強いほど活動電位は大きくなる", "誤り。活動電位は全か無の法則に従い、閾値を超えれば刺激の強さにかかわらず一定の大きさで生じる。刺激の強さは発火の頻度として符号化される。", 1], ["脱分極相はNa⁺の細胞内への流入による", "正しい。電位依存性Na⁺チャネルが開口してNa⁺が急速に流入することで脱分極が起こる。", 0], ["有髄線維では跳躍伝導が起こる", "正しい。髄鞘は絶縁性をもつため、興奮はランビエの絞輪を飛び飛びに伝わる。これが跳躍伝導で、伝導速度が速くなる。", 0]], "z": "活動電位の性質は「全か無の法則」「不減衰伝導」「絶縁性伝導」「両方向性伝導」。伝導速度は軸索が太いほど、有髄であるほど、温度が高いほど速い。跳躍伝導は有髄線維に特有の様式であり、伝導の三原則には含まれない。"}, {"id": "s4-6", "set": 4, "n": 6, "c": "運動", "t": "運動の生理・運動単位", "p": "p.46", "r": "模試 2026年度第2回問86（運動単位のFF型）", "s": "運動単位の動員で正しいのはどれか。", "neg": false, "two": false, "o": [["FF型はS型より疲労しにくい", "FF型（fast fatigable）は無酸素的な解糖に依存するため最も疲労しやすい。疲労しにくいのはS型である。", 0], ["1つの運動単位には複数の運動ニューロンが含まれる", "1つの運動単位とは、1個のα運動ニューロンとそれが支配する筋線維群をいう。運動ニューロンは1個である。", 0], ["弱い収縮ではS型の運動単位から動員される", "正しい。サイズの原理により、小さい（閾値の低い）運動単位から順に動員され、収縮が強くなるにつれてFR型・FF型が加わる。", 1], ["細かい動きをする筋ほど神経支配比が大きい", "外眼筋や手指の筋など細かい調節を要する筋では、1個の運動ニューロンが支配する筋線維数（神経支配比）は小さい。大腿四頭筋などの大きな筋では大きい。", 0]], "z": "運動単位はS型（Ⅰ型線維・疲労しにくい・張力小・伝導速度遅い）、FR型（Ⅱa型・中間）、FF型（Ⅱx型・疲労しやすい・張力大・伝導速度速い）の3つ。動員順はサイズの原理に従いS→FR→FFである。"}, {"id": "s4-7", "set": 4, "n": 7, "c": "運動", "t": "運動の生理・随意運動の調節", "p": "p.49〜55 ※", "r": "模試 2024年度問85（大脳皮質の機能局在）／2024年度問87（姿勢反射）", "s": "運動の調節で正しいのはどれか。", "neg": false, "two": false, "o": [["大脳基底核の障害では運動麻痺が主症状となる", "大脳基底核の障害では不随意運動や筋緊張の異常（固縮・振戦など）が主症状となる。運動麻痺が起こるのは錐体路の障害である。", 0], ["小脳は運動の円滑さと協調を調節する", "正しい。小脳は運動の指令と実際の運動の誤差を補正し、運動を滑らかに協調させる。障害されると運動失調が起こる。", 1], ["一次運動野は同側の骨格筋を支配する", "一次運動野からの錐体路は延髄の錐体で大部分が交叉するため、対側の骨格筋を支配する。", 0], ["運動前野は伸張反射の中枢である", "運動前野は運動の準備やプログラムに関わる。伸張反射の中枢は脊髄である。", 0]], "z": "随意運動は「大脳皮質連合野で意図→大脳基底核と小脳でプログラムの調整→一次運動野→錐体路→脊髄前角細胞→骨格筋」の流れ。小脳の障害は運動失調、大脳基底核の障害は不随意運動と筋緊張異常、錐体路の障害は麻痺、と障害像で区別する。"}, {"id": "s4-8", "set": 4, "n": 8, "c": "感覚", "t": "感覚・伝導路", "p": "p.76〜80 ※", "r": "模試 2024年度問89（聴覚の伝達）／2025年度問90（平衡感覚の伝導路）", "s": "意識にのぼる深部感覚を伝える上行路はどれか。", "neg": false, "two": false, "o": [["外側脊髄視床路", "外側脊髄視床路は痛覚と温度覚を伝える。脊髄に入った高さで交叉してから上行する。", 0], ["前脊髄視床路", "前脊髄視床路は粗大な触圧覚を伝える。これも脊髄で交叉する。", 0], ["後索－内側毛帯路", "正しい。深部感覚（位置覚・運動覚・振動覚）と識別性触圧覚は後索を同側性に上行し、延髄の後索核でニューロンを変えて交叉し、内側毛帯を通って視床へ至る。", 1], ["後脊髄小脳路", "後脊髄小脳路は深部感覚の情報を小脳へ伝えるが、この情報は意識にのぼらない。", 0]], "z": "交叉する高さが違う点が要点。後索－内側毛帯路は延髄で交叉し、脊髄視床路は脊髄に入った分節の近くで交叉する。小脳へ向かう脊髄小脳路の情報は無意識性の深部感覚で、姿勢や運動の調節に使われる。"}, {"id": "s4-9", "set": 4, "n": 9, "c": "感覚", "t": "感覚・視覚", "p": "p.63〜66", "r": "模試 2026年度第2回問89（網膜・杆体の感度）／2024年度問88（近視）", "s": "暗順応で正しいのはどれか。", "neg": false, "two": false, "o": [["錐体細胞が主役となる", "暗順応の主役は杆体細胞である。錐体細胞は明所で色覚と細かい形の識別を担う。", 0], ["完成までに約30分を要する", "正しい。暗所に入ってから杆体の感度が最大になるまでには約30分かかる。明順応は約1分で完成し、暗順応よりはるかに速い。", 1], ["明順応より速やかに完成する", "明順応は約1分、暗順応は約30分であり、暗順応のほうがはるかに時間がかかる。", 0], ["視物質であるロドプシンが分解される", "暗所ではロドプシンが再合成されて蓄積し、感度が高まる。明るい所で分解される。", 0]], "z": "錐体＝明所視・色覚・中心窩に密集、杆体＝暗所視・感度が高い・ロドプシンを含み網膜周辺部に多い。暗順応は杆体のロドプシン再合成に時間がかかるため約30分、明順応は約1分で完成する。"}, {"id": "s4-10", "set": 4, "n": 10, "c": "内分", "t": "内分泌・作用機序", "p": "p.84〜86", "r": "本試験 第32回問90・第33回問90（ステロイドホルモン、2年連続）／模試 2026年度第2回問90", "s": "細胞内（核内）の受容体に結合して作用するホルモンはどれか。", "neg": false, "two": false, "o": [["インスリン", "インスリンはペプチドホルモンで、細胞膜表面の受容体に結合して作用する。", 0], ["アドレナリン", "アドレナリンはアミノ酸誘導体（カテコールアミン）で、細胞膜の受容体に結合しセカンドメッセンジャーを介して作用する。", 0], ["バソプレシン", "バソプレシンはペプチドホルモンで、集合管の細胞膜受容体に結合しアクアポリンを増加させる。", 0], ["コルチゾール", "正しい。ステロイドホルモンは脂溶性で細胞膜を通過し、細胞内（核内）の受容体と結合して遺伝子の発現を調節する。", 1]], "z": "脂溶性で核内受容体に作用するのはステロイドホルモン（副腎皮質ホルモン・性ホルモン）と甲状腺ホルモンの2系統。ペプチドホルモンとカテコールアミンは水溶性で、細胞膜の受容体に結合する。化学的分類（ステロイド／アミノ酸誘導体／ペプチド）は本試験が繰り返し問う論点である。"}, {"id": "s4-11", "set": 4, "n": 11, "c": "内分", "t": "内分泌・分泌部位", "p": "p.84〜99 ※", "r": "模試 2022年度問89（内分泌腺とホルモンの組合せ）／2021年度問90（ホルモンの作用の組合せ）", "s": "ホルモンとその分泌部位の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["メラトニン ──── 松果体", "正しい。松果体から分泌され、明暗の周期に応じて夜間に分泌が増え、概日リズムの調節に関わる。", 1], ["ソマトスタチン ──── 膵島A（α）細胞", "ソマトスタチンを分泌するのは膵島のD（δ）細胞である。A（α）細胞はグルカゴン、B（β）細胞はインスリンを分泌する。", 0], ["エリスロポエチン ──── 肝臓", "エリスロポエチンは主に腎臓から分泌され、骨髄での赤血球産生を促進する。", 0], ["心房性ナトリウム利尿ペプチド ──── 心室", "心房性ナトリウム利尿ペプチド（ANP）は、血液量の増加で心房が伸展されると心房から分泌される。", 0]], "z": "内分泌腺以外からもホルモンは分泌される。腎臓＝エリスロポエチン・レニン・活性型ビタミンD、心房＝ANP、消化管＝ガストリン・セクレチン・コレシストキニン・グレリン、松果体＝メラトニン。膵島はA細胞グルカゴン・B細胞インスリン・D細胞ソマトスタチンの3つを押さえる。"}, {"id": "s4-12", "set": 4, "n": 12, "c": "内分", "t": "内分泌・副腎", "p": "p.94〜96 ※", "r": "模試 2026年度第2回問91（ミネラルコルチコイド）／2020年度問94（糖質コルチコイド）", "s": "副腎髄質で正しいのはどれか。", "neg": false, "two": false, "o": [["アルドステロンを分泌する", "アルドステロン（電解質コルチコイド）は副腎皮質の球状層から分泌される。", 0], ["分泌されるホルモンはステロイドホルモンである", "副腎髄質から分泌されるアドレナリン・ノルアドレナリンはチロシンから合成されるアミノ酸誘導体（カテコールアミン）である。ステロイドホルモンは皮質から分泌される。", 0], ["交感神経節前線維の支配を受ける", "正しい。副腎髄質は交感神経節が変化したもので、節前線維の支配を直接受け、アセチルコリンの刺激でカテコールアミンを分泌する。", 1], ["分泌は下垂体前葉ホルモンにより調節される", "副腎髄質の分泌は交感神経によって直接調節される。下垂体前葉の副腎皮質刺激ホルモンが調節するのは皮質である。", 0]], "z": "副腎は皮質と髄質でまったく別の器官と考える。皮質＝球状層アルドステロン・束状層コルチゾール・網状層アンドロゲン、いずれもステロイドホルモンでACTHの支配下（アルドステロンはレニン-アンジオテンシン系とK⁺が主）。髄質＝カテコールアミン、交感神経節前線維の直接支配。"}, {"id": "s4-13", "set": 4, "n": 13, "c": "生殖", "t": "生殖・精子形成", "p": "p.105〜106", "r": "模試 2026年度第2回問92（精原細胞の分化に必要なホルモン）／2024年度問93（精子形成の過程）", "s": "卵胞刺激ホルモン（FSH）が男性で促進するのはどれか。", "neg": false, "two": false, "o": [["ライディッヒ細胞からのテストステロンの分泌", "テストステロンの分泌を促進するのは黄体形成ホルモン（LH）である。", 0], ["セルトリ細胞からのアンドロゲン結合タンパク質の分泌", "正しい。FSHはセルトリ細胞に作用してアンドロゲン結合タンパク質（ABP）の産生を促す。ABPは精細管内のテストステロン濃度を高め、精子の成熟に必要である。", 1], ["前立腺からの精液成分の分泌", "前立腺や精嚢などの付属腺の発育・分泌は主にテストステロンの作用による。", 0], ["精巣上体での精子の運搬", "精子は精巣上体で成熟したのち精管を移動するが、これはFSHが直接促す作用ではない。", 0]], "z": "男性では LH→ライディッヒ細胞→テストステロン、FSH→セルトリ細胞→アンドロゲン結合タンパク質、という2本立てで覚える。精原細胞の分化・増殖にはテストステロンが、精子の成熟にはABPによる局所濃度の上昇が必要である。"}, {"id": "s4-14", "set": 4, "n": 14, "c": "血液", "t": "血液・血漿タンパク", "p": "p.116〜117", "r": "模試 2021年度問94（担送機能）／2020年度問104（コロイド浸透圧）", "s": "血漿タンパク質で誤っているのはどれか。", "neg": true, "two": false, "o": [["γ-グロブリンは肝臓で産生される", "誤り。γ-グロブリン（免疫グロブリン）はBリンパ球が分化した形質細胞で産生される。肝臓はアルブミンをはじめほとんどの血漿タンパク質を産生するが、γ-グロブリンは例外である。", 1], ["アルブミンは血漿膠質浸透圧の維持に最も寄与する", "正しい。アルブミンは血漿タンパク質のうち最も数が多く、血漿膠質浸透圧の維持に最も大きく貢献する。", 0], ["フィブリノゲンは血液凝固に関与する", "正しい。フィブリノゲンはトロンビンの作用で不溶性のフィブリンとなり、二次止血で血栓を補強する。", 0], ["α・βグロブリンは脂質の運搬に関与する", "正しい。リポタンパク質を形成し、脂質やステロイドホルモン、ビタミン、鉄などの運搬体としてはたらく。", 0]], "z": "血漿タンパク質は「アルブミン＝膠質浸透圧・運搬」「α・βグロブリン＝運搬」「γ-グロブリン＝抗体」「フィブリノゲン＝凝固」。産生の場は肝臓だが、γ-グロブリンだけは形質細胞がつくるという例外を押さえる。"}, {"id": "s4-15", "set": 4, "n": 15, "c": "免疫", "t": "免疫", "p": "p.128〜131", "r": "本試験は免疫が4/125と模試より厚い／模試 2022年度問94（抗体）", "s": "免疫グロブリンで正しいのはどれか。2つ選べ。", "neg": false, "two": true, "o": [["IgMは分子量が最も小さい", "IgMは5量体をなし、免疫グロブリンのなかで分子量が最も大きい。そのため胎盤を通過できない。", 0], ["IgAは初乳や分泌液中に多く含まれる", "正しい。IgAは唾液・涙・腸液・初乳などの分泌液に多く、粘膜面での局所免疫を担う。", 1], ["IgEは血中に最も多く含まれる", "血中に最も多いのはIgGで、全体の約70〜75%を占める。IgEはごく微量で、肥満細胞や好塩基球に結合しⅠ型アレルギーに関与する。", 0], ["IgGは胎盤を通過する", "正しい。5つのクラスのうち胎盤を通過できるのはIgGだけで、母体から胎児へ移行して新生児の感染防御にはたらく。", 1]], "z": "5つのクラスは「IgG＝血中最多・唯一胎盤を通過」「IgA＝分泌液・初乳」「IgM＝最大・感染初期に最初に増加」「IgE＝Ⅰ型アレルギー」「IgD＝B細胞表面」で整理する。本試験は模試に比べ免疫の出題が多い。"}, {"id": "s4-16", "set": 4, "n": 16, "c": "骨", "t": "骨・Ca代謝", "p": "p.136〜138", "r": "本試験 問94〜95のCa代謝は5年連続／模試 2026年度第2回問95（パラソルモン）", "s": "カルシトニンで正しいのはどれか。", "neg": false, "two": false, "o": [["副甲状腺から分泌される", "カルシトニンは甲状腺の傍濾胞細胞から分泌される。副甲状腺（上皮小体）から分泌されるのはパラソルモンである。", 0], ["破骨細胞の骨吸収を促進する", "カルシトニンは破骨細胞のはたらきを抑制し、骨吸収を抑える。骨吸収を促進するのはパラソルモンである。", 0], ["血中カルシウム濃度の上昇により分泌が促進される", "正しい。カルシトニンは血中Ca²⁺濃度が高いときに分泌が促進され、濃度を低下させる方向にはたらく。", 1], ["腎臓でのカルシウムの再吸収を促進する", "カルシトニンは腎臓でのCa²⁺の排泄を促す。再吸収を促進するのはパラソルモンである。", 0]], "z": "血中Ca²⁺を上げるのはパラソルモンと活性型ビタミンD、下げるのはカルシトニンの1つだけ。パラソルモンは「骨吸収↑・腎Ca²⁺再吸収↑・腎リン酸再吸収↓・活性型ビタミンD産生↑」、カルシトニンはその逆と覚える。本試験では問94〜95に5年連続で出ている。"}, {"id": "s4-17", "set": 4, "n": 17, "c": "循環", "t": "循環・刺激伝導系", "p": "p.141〜143", "r": "模試 2022年度問96（ペースメーカー細胞）／2021年度問96（心電図のPQ）", "s": "刺激伝導系で興奮の伝導が最も遅いのはどれか。", "neg": false, "two": false, "o": [["房室結節", "正しい。房室結節での伝導はきわめて遅く、ここで興奮が遅延することで心房の収縮が終わってから心室が収縮できる。", 1], ["洞房結節", "洞房結節は正常のペースメーカーで、最も高い頻度で自動的に興奮する。伝導が最も遅い部位ではない。", 0], ["ヒス束", "ヒス束は心房と心室を電気的につなぐ唯一の経路で、伝導速度は速い。", 0], ["プルキンエ線維", "プルキンエ線維は刺激伝導系のなかで最も伝導速度が速く、心室全体をほぼ同時に興奮させる。", 0]], "z": "刺激伝導系は洞房結節→心房筋→房室結節→ヒス束→左脚・右脚→プルキンエ線維の順。房室結節だけが遅く、これが心電図のPQ（PR）間隔にあたる。遅延があるおかげで心房から心室へ血液を送り込む時間が確保される。"}, {"id": "s4-18", "set": 4, "n": 18, "c": "循環", "t": "循環・血圧調節", "p": "p.154〜157", "r": "模試 2025年度問98（長期的な動脈血圧調節）／2020年度問85（減圧反射の受容器）", "s": "動脈血圧が上昇したときに生じるのはどれか。", "neg": false, "two": false, "o": [["心拍数の減少", "正しい。頸動脈洞と大動脈弓の圧受容器が伸展され、迷走神経の活動が高まって心拍数が減少する。血圧を下げる方向の負のフィードバックである。", 1], ["交感神経活動の亢進", "血圧上昇時には交感神経活動は抑制される。亢進するのは血圧が低下したときである。", 0], ["末梢血管抵抗の増加", "交感神経活動の抑制により血管は拡張し、末梢血管抵抗は減少する。", 0], ["レニン分泌の増加", "腎血流が増えるためレニン分泌は抑制される。レニンは血圧低下時に分泌が増える。", 0]], "z": "圧受容器反射（減圧反射）は短期的な血圧調節を担い、受容器は頸動脈洞と大動脈弓にある。血圧上昇→受容器の伸展→迷走神経↑・交感神経↓→心拍数減少・血管拡張→血圧低下。長期的な調節は腎臓による体液量の調節が担う。"}, {"id": "s4-19", "set": 4, "n": 19, "c": "循環", "t": "循環・毛細血管", "p": "p.149", "r": "模試 2026年度第2回問97（毛細血管壁を通過できるもの）", "s": "毛細血管における物質の移動で正しいのはどれか。", "neg": false, "two": false, "o": [["動脈側では水が血管内へ再吸収される", "動脈側では毛細血管内圧が膠質浸透圧より高いため、水は血管外（組織側）へ濾過される。再吸収が起こるのは静脈側である。", 0], ["赤血球は容易に血管壁を通過する", "赤血球や血小板は血球であり、血漿タンパク質よりもはるかに大きいため通過できない。", 0], ["血漿膠質浸透圧は血管内へ水を引き戻す方向にはたらく", "正しい。血漿タンパク質は毛細血管壁を通過できないため血管内にとどまり、組織から水を引き戻す力（膠質浸透圧）を生む。", 1], ["濾過された液はすべて毛細血管に再吸収される", "濾過量の一部は再吸収されずに組織に残り、リンパ管に入って最終的に静脈へ戻る。", 0]], "z": "毛細血管での水の移動は、外へ押し出す毛細血管内圧と、内へ引き戻す血漿膠質浸透圧の差で決まる。動脈側は濾過、静脈側は再吸収。再吸収されなかった分はリンパ管が回収する。グルコース・酸素・尿素・無機イオンなど低分子は容易に通過し、血漿タンパク質と血球は通過できない。"}, {"id": "s4-20", "set": 4, "n": 20, "c": "呼吸", "t": "呼吸・肺気量", "p": "p.162〜163", "r": "模試 2022年度問98（予備呼気量）／2021年度問98（肺気量分画）", "s": "機能的残気量に含まれるのはどれか。", "neg": false, "two": false, "o": [["予備呼気量", "正しい。機能的残気量は安静呼気位で肺内に残る空気量で、予備呼気量と残気量の和である。", 1], ["予備吸気量", "予備吸気量は安静吸気位からさらに吸い込める量で、機能的残気量には含まれない。", 0], ["1回換気量", "1回換気量は安静時に出入りする空気量で、機能的残気量には含まれない。", 0], ["肺活量", "肺活量は予備吸気量＋1回換気量＋予備呼気量であり、機能的残気量とは別の分画である。", 0]], "z": "肺活量＝予備吸気量＋1回換気量＋予備呼気量（残気量を含まない）。機能的残気量＝予備呼気量＋残気量。全肺気量＝肺活量＋残気量。「安静呼気位から下」が機能的残気量、「最大吸気から最大呼気まで」が肺活量と押さえる。"}, {"id": "s4-21", "set": 4, "n": 21, "c": "呼吸", "t": "呼吸・肺サーファクタント", "p": "p.160〜162 ※", "r": "本試験に未出の論点（模試では既出）。分析資料で予想問題の素材として挙げていた項目", "s": "肺サーファクタントで正しいのはどれか。", "neg": false, "two": false, "o": [["肺胞の表面張力を高める", "肺サーファクタントは表面張力を低下させる。これにより小さな肺胞がつぶれるのを防ぎ、肺胞の大きさを安定させる。", 0], ["肺のコンプライアンスを低下させる", "表面張力が下がることで肺は膨らみやすくなり、コンプライアンスは上昇する。欠乏すると肺は硬くなる。", 0], ["気道の線毛上皮から分泌される", "気道の線毛上皮と杯細胞が分泌するのは粘液で、異物を排除する粘液線毛輸送に関わる。肺サーファクタントとは別である。", 0], ["Ⅱ型肺胞上皮細胞から分泌される", "正しい。肺胞壁のⅡ型肺胞上皮細胞がリン脂質を主成分とする表面活性物質を分泌する。Ⅰ型肺胞上皮細胞はガス交換を担う扁平な細胞である。", 1]], "z": "肺サーファクタントはⅡ型肺胞上皮細胞が分泌し、表面張力を下げて肺胞の虚脱を防ぎ、コンプライアンスを高める。胎生後期に産生が始まるため、早産児では不足して新生児呼吸窮迫症候群を起こしやすい。"}, {"id": "s4-22", "set": 4, "n": 22, "c": "腎", "t": "腎・糸球体濾過", "p": "p.173〜176", "r": "模試 2022年度問101・2024年度問101（有効濾過圧の計算、2年連続）", "s": "血漿イヌリン濃度0.5mg/mL、尿中イヌリン濃度60mg/mL、尿量1mL/分のとき、糸球体濾過量はどれか。", "neg": false, "two": false, "o": [["120mL/分", "正しい。クリアランス＝尿中濃度×尿量÷血漿濃度＝60×1÷0.5＝120mL/分。イヌリンは濾過されたのち再吸収も分泌も受けないため、そのクリアランスが糸球体濾過量に等しい。", 1], ["30mL/分", "血漿濃度で割らずに掛けるなど、計算の順序を誤ると生じる値である。", 0], ["60mL/分", "尿中濃度と尿量の積をそのまま答えた値で、血漿濃度による除算を行っていない。", 0], ["240mL/分", "正常なヒトの糸球体濾過量としても大きすぎる値である。", 0]], "z": "クリアランス＝（尿中濃度×尿量）÷血漿濃度。イヌリンクリアランス＝糸球体濾過量（約125mL/分）。パラアミノ馬尿酸は濾過に加えて分泌されるためクリアランスが最大（約585mL/分）、グルコースは全量再吸収されるため0mL/分。臨床では内因性クレアチニンクリアランスが使われる。"}, {"id": "s4-23", "set": 4, "n": 23, "c": "代謝", "t": "栄養と代謝・基礎代謝", "p": "p.190〜194", "r": "模試 2025年度問102（特異動的作用）／2021年度問100（無酸素的ATP産生）", "s": "基礎代謝量で正しいのはどれか。", "neg": false, "two": false, "o": [["睡眠中に測定した値である", "基礎代謝は覚醒・安静・空腹・快適な室温という条件で測定する。睡眠中は基礎代謝よりさらに低い。", 0], ["加齢とともに増加する", "体重あたりの基礎代謝量は小児期に高く、加齢とともに低下する。", 0], ["同年齢では女性のほうが高い", "女性は男性より筋量が少なく体脂肪率が高いため、基礎代謝量は男性より低い。", 0], ["同性・同年齢では体表面積にほぼ比例する", "正しい。熱の放散は体表面から起こるため、基礎代謝量は体表面積にほぼ比例する。", 1]], "z": "基礎代謝の測定条件は「覚醒・安静臥位・食後12時間以上（空腹）・快適な室温」。体表面積に比例し、男性＞女性、小児期に高く加齢で低下、発熱や甲状腺機能亢進で増加する。食後に代謝が高まる現象は特異動的作用（食事誘発性熱産生）という。"}, {"id": "s4-24", "set": 4, "n": 24, "c": "消化", "t": "消化・胃液分泌", "p": "p.205〜206", "r": "模試 2020年度問88（胃液分泌を抑制するもの）／2026年度第2回問102（消化器系の自律神経）", "s": "胃液分泌の3相のうち、分泌量への関与が最も大きいのはどれか。", "neg": false, "two": false, "o": [["脳相", "脳相は食事の開始に伴い食物が胃に入る前に起こる分泌で、全体の約35%である。", 0], ["胃相", "正しい。胃相は全体の約60%を占め、最も大きい。食物が胃に入ることでガストリンやヒスタミンが分泌され、神経反射も加わって分泌が増加する。", 1], ["腸相", "腸相は酸性の内容物が十二指腸に入ることで起こる分泌で、全体の約5%にとどまる。セクレチンやGIPにより分泌は次第に低下する。", 0], ["3相とも同程度である", "脳相35%、胃相60%、腸相5%と大きく異なる。", 0]], "z": "胃液分泌は脳相（約35%・味やにおい・咀嚼→副交感神経）、胃相（約60%・胃壁の伸展とアミノ酸→ガストリン）、腸相（約5%・十二指腸への酸性内容物の流入）の3相。腸相ではセクレチンや胃抑制ペプチドの分泌も起こり、全体としては分泌が低下してくる。"}, {"id": "s4-25", "set": 4, "n": 25, "c": "体温", "t": "体温", "p": "p.218〜220 ※", "r": "模試 2026年度第2回問104（体温の生理的変動）／2024年度問105（うつ熱）", "s": "熱放散に関与しないのはどれか。", "neg": true, "two": false, "o": [["放射", "体表面から電磁波として熱が移動する熱放散の経路で、常温・安静時の熱放散の半分近くを占める。", 0], ["伝導", "接触した物体へ直接熱が移動する熱放散の経路である。対流と合わせて考えることが多い。", 0], ["蒸発", "発汗と不感蒸泄による熱放散の経路で、高温環境下では唯一有効な放散手段となる。", 0], ["ふるえ", "ふるえは骨格筋の不随意収縮によって熱を産生する機序であり、熱放散の経路ではない。これが正解となる。", 1]], "z": "熱放散は放射・伝導・対流・蒸発の4つ。熱産生は基礎代謝、ふるえ、非ふるえ熱産生（褐色脂肪組織）、食事誘発性熱産生、甲状腺ホルモンやカテコールアミンによる代謝亢進。寒冷時は皮膚血管収縮・立毛・ふるえで対応し、高温時は皮膚血管拡張・発汗で対応する。"}, {"id": "s5-1", "set": 5, "n": 1, "c": "総論", "t": "総論・酸塩基平衡", "p": "p.198〜199 ※", "r": "模試 2020年度問82（重曹の大量摂取）／2021年度問82（大量の下痢）／2024年度問100", "s": "代謝性アルカローシスを生じるのはどれか。", "neg": false, "two": false, "o": [["大量の下痢", "下痢では腸液に含まれる重炭酸イオン（HCO₃⁻）が大量に失われるため、代謝性アシドーシスとなる。", 0], ["過換気症候群", "換気量の増加により二酸化炭素が過剰に排出され、呼吸性アルカローシスとなる。", 0], ["頻回の嘔吐", "正しい。嘔吐では酸である胃酸が大量に失われるため、体液はアルカリ性に傾く。", 1], ["気道の閉塞", "換気量の減少により二酸化炭素が蓄積し、呼吸性アシドーシスとなる。", 0]], "z": "原因の見分け方は「呼吸か代謝か」「酸が増えたか減ったか」。呼吸性は換気量の増減（換気↓でアシドーシス、換気↑でアルカローシス）、代謝性は酸または塩基の増減（嘔吐→胃酸喪失でアルカローシス、下痢→HCO₃⁻喪失でアシドーシス、腎不全やケトン体増加でアシドーシス）。"}, {"id": "s5-2", "set": 5, "n": 2, "c": "筋", "t": "筋・筋線維タイプ", "p": "p.14〜19", "r": "模試 2025年度問82（線維タイプⅠ）／2021年度問83（速筋）／2026年度第2回問83", "s": "骨格筋のⅡx型（Ⅱb型）線維で正しいのはどれか。2つ選べ。", "neg": false, "two": true, "o": [["解糖系酵素の活性が高い", "正しい。Ⅱx型線維は無酸素的な解糖によるATP産生に依存するため、解糖系酵素の活性が高い。", 1], ["ミオグロビンを多く含む", "ミオグロビンを多く含み赤く見えるのはⅠ型（遅筋・赤筋）線維である。", 0], ["収縮速度が速い", "正しい。Ⅱx型線維は収縮速度が速く大きな張力を発揮できるが、そのぶん疲労しやすい。", 1], ["ミトコンドリアが豊富である", "ミトコンドリアが豊富で有酸素的代謝が中心なのはⅠ型線維である。", 0]], "z": "Ⅰ型＝遅筋・赤筋・SO・ミトコンドリアとミオグロビンが豊富・疲労しにくい・運動単位はS型。Ⅱa型＝FOG・中間・FR型。Ⅱx型＝速筋・白筋・FG・解糖系依存・疲労しやすい・FF型。なお競技者で線維の割合が異なるのは生得的なもので、トレーニングの結果ではない。"}, {"id": "s5-3", "set": 5, "n": 3, "c": "筋", "t": "筋・平滑筋", "p": "p.20〜21", "r": "模試 2022年度問83（筋について誤っているもの）／2020年度問103（心筋の特徴）", "s": "平滑筋で誤っているのはどれか。", "neg": true, "two": false, "o": [["横紋をもたない", "正しい。平滑筋は紡錘形で、アクチンとミオシンが規則正しく配列していないため横紋がみられない。", 0], ["トロポニンにCa²⁺が結合して収縮する", "誤り。平滑筋にはトロポニンがなく、Ca²⁺はカルモジュリンと結合してミオシン軽鎖キナーゼを活性化することで収縮が起こる。", 1], ["内臓平滑筋にはギャップ結合がある", "正しい。腸管壁などの平滑筋はギャップ結合で電気的に連結し、集団として一斉に収縮する。", 0], ["自動性を示すものがある", "正しい。消化管の平滑筋などは神経の支配がなくても自発的にリズミカルな収縮を示す。", 0]], "z": "Ca²⁺の結合先が3種類の筋で異なる。骨格筋・心筋＝トロポニン（アクチン側）、平滑筋＝カルモジュリン。また横紋があるのは骨格筋と心筋、随意筋は骨格筋のみ、ギャップ結合をもつのは心筋と内臓平滑筋である。"}, {"id": "s5-4", "set": 5, "n": 4, "c": "神経", "t": "神経・自律神経", "p": "p.37〜40", "r": "模試 2021年度問85（拮抗支配を受けないもの）／2022年度問85", "s": "自律神経系で正しいのはどれか。", "neg": false, "two": false, "o": [["副交感神経は節前線維が短く節後線維が長い", "副交感神経の神経節は効果器の近くまたは壁内にあるため、節前線維が長く節後線維は短い。交感神経とは逆である。", 0], ["交感神経は節前線維が短く節後線維が長い", "正しい。交感神経節は脊柱の近く（交感神経幹など）にあるため節前線維は短く、効果器までの節後線維は長い。", 1], ["節前線維の伝達物質はノルアドレナリンである", "交感・副交感いずれも節前線維の伝達物質はアセチルコリンで、受容体はニコチン受容体である。", 0], ["交感神経は仙髄から出る", "交感神経は胸髄と上部腰髄（T1〜L2・3）から出る。仙髄から出るのは副交感神経（骨盤神経）である。", 0]], "z": "交感神経＝胸腰髄由来・節前線維が短い・節後はノルアドレナリン。副交感神経＝脳幹と仙髄由来・節前線維が長い・節後はアセチルコリン。節前線維はどちらもアセチルコリン（ニコチン受容体）。汗腺を支配する交感神経節後線維だけがアセチルコリンという例外がある。"}, {"id": "s5-5", "set": 5, "n": 5, "c": "神経", "t": "神経・脳波", "p": "p.34〜36", "r": "模試 2022年度問86（最も波長が短い脳波）／2020年度問101（閉眼安静時）／2025年度問85（睡眠）", "s": "ノンレム睡眠で正しいのはどれか。", "neg": false, "two": false, "o": [["急速眼球運動がみられる", "急速眼球運動（rapid eye movement）がみられるのはレム睡眠である。", 0], ["骨格筋の緊張が著しく低下する", "抗重力筋をはじめ骨格筋の緊張が著しく低下するのはレム睡眠の特徴である。", 0], ["夢をみていることが多い", "鮮明な夢をみていることが多いのはレム睡眠である。", 0], ["徐波睡眠とも呼ばれる", "正しい。ノンレム睡眠では脳波に周波数の低いδ波などの徐波が現れるため、徐波睡眠と呼ばれる。", 1]], "z": "レム睡眠＝急速眼球運動あり・筋緊張の著明な低下・脳波は覚醒時に近い・夢をみる・血圧や心拍が不安定（逆説睡眠）。ノンレム睡眠＝徐波睡眠・自律神経が安定し血圧低下と心拍数減少。加齢により徐波睡眠とレム睡眠はともに減少する。"}, {"id": "s5-6", "set": 5, "n": 6, "c": "神経", "t": "神経・下行性伝導路", "p": "p.44〜46 ※", "r": "模試 2024年度問86（外側皮質脊髄路が交叉する部位）", "s": "下行性伝導路のうち錐体路に属するのはどれか。", "neg": false, "two": false, "o": [["赤核脊髄路", "中脳の赤核から起こる錐体外路系の伝導路で、四肢の屈筋の緊張を高める。", 0], ["網様体脊髄路", "脳幹の網様体から起こる錐体外路系の伝導路で、姿勢や筋緊張の調節に関わる。", 0], ["前庭脊髄路", "前庭神経核から起こる錐体外路系の伝導路で、抗重力筋（伸筋）の緊張を高め平衡を保つ。", 0], ["外側皮質脊髄路", "正しい。大脳皮質運動野から起こり、延髄の錐体で約85〜90%の線維が交叉して脊髄側索を下行する。これが錐体路である。", 1]], "z": "錐体路は外側皮質脊髄路と前皮質脊髄路の2つだけで、随意運動の指令を伝える。錐体外路系は赤核脊髄路・網様体脊髄路・前庭脊髄路・視蓋脊髄路などで、姿勢や筋緊張を無意識に調節する。交叉する部位は錐体路が延髄の錐体である。"}, {"id": "s5-7", "set": 5, "n": 7, "c": "運動", "t": "運動の生理・反射", "p": "p.47〜48", "r": "模試 2025年度問86（ゴルジ腱器官）／2021年度問86", "s": "筋紡錘で正しいのはどれか。", "neg": false, "two": false, "o": [["Ⅰb群求心性線維が終末する", "筋紡錘に終末するのはⅠa群および Ⅱ群求心性線維である。Ⅰb群が終末するのはゴルジ腱器官である。", 0], ["筋の張力を受容する", "筋紡錘が受容するのは筋の長さの変化（伸張）である。張力を受容するのはゴルジ腱器官である。", 0], ["錘外筋線維と並列に配置される", "正しい。筋紡錘は錘外筋線維と並列に位置するため、筋が引き伸ばされると同時に伸張され興奮する。", 1], ["腱との移行部に存在する", "筋腱移行部に筋線維と直列に存在するのはゴルジ腱器官である。", 0]], "z": "筋紡錘＝錘外筋線維と並列・筋の長さ（伸張）を受容・Ⅰa群線維・γ運動ニューロンの支配を受ける・伸張反射を起こす。ゴルジ腱器官＝筋腱移行部に直列・筋の張力を受容・Ⅰb群線維・γ支配を受けない・自原抑制（Ⅰb抑制）を起こす。この対比はほぼ毎年どこかで問われる。"}, {"id": "s5-8", "set": 5, "n": 8, "c": "感覚", "t": "感覚・順応", "p": "p.58〜60", "r": "模試 2025年度問88（受容器と適刺激）／2021年度問87（皮膚痛覚）", "s": "順応が最も遅い（順応しにくい）感覚はどれか。", "neg": false, "two": false, "o": [["嗅覚", "嗅覚は順応がきわめて速く、同じにおいの中にいるとすぐ感じなくなる。", 0], ["痛覚", "正しい。痛覚は順応が非常に遅く、刺激が続くかぎり感じ続ける。生体への警告として重要な性質である。", 1], ["触覚", "触覚、とくにパチニ小体やマイスネル小体は急速順応型で、順応が速い。", 0], ["温覚", "温覚・冷覚は順応が比較的速く、入浴時に熱さをすぐ感じなくなるのがその例である。", 0]], "z": "順応が速い（急速順応型）のは嗅覚・触覚（パチニ小体、マイスネル小体）、遅い（遅順応型）のは痛覚・筋紡錘・頸動脈洞の圧受容器。痛覚が順応しにくいのは、組織の損傷を知らせ続ける必要があるためである。"}, {"id": "s5-9", "set": 5, "n": 9, "c": "感覚", "t": "感覚・平衡覚", "p": "p.69〜72", "r": "模試 2022年度問88（内耳）／2025年度問90（平衡感覚の伝導路）", "s": "半規管で正しいのはどれか。", "neg": false, "two": false, "o": [["回転加速度を受容する", "正しい。半規管は三半規管として三次元の各方向に配置され、内リンパの流れによって回転（角）加速度を受容する。", 1], ["受容器は平衡斑である", "半規管の受容器は膨大部稜にある有毛細胞である。平衡斑は耳石器（卵形嚢・球形嚢）の受容器である。", 0], ["直線加速度を受容する", "直線加速度を受容するのは耳石器で、卵形嚢が水平方向、球形嚢が垂直方向を担当する。", 0], ["音の高さを識別する", "音の受容と周波数の識別は蝸牛管のコルチ器が担う。", 0]], "z": "内耳は蝸牛（聴覚・コルチ器）と前庭器に分かれ、前庭器は半規管（回転加速度・膨大部稜）と耳石器（直線加速度・平衡斑／卵形嚢＝水平、球形嚢＝垂直）からなる。受容器の名前と適刺激をセットで覚える。"}, {"id": "s5-10", "set": 5, "n": 10, "c": "内分", "t": "内分泌・下垂体", "p": "p.91〜95", "r": "模試 2024年度問92（下垂体から分泌されるホルモン）／2020年度問95（前葉が直接刺激しないもの）", "s": "下垂体前葉ホルモンによって分泌が直接調節されるのはどれか。2つ選べ。", "neg": false, "two": true, "o": [["アルドステロン", "アルドステロンの分泌は主にレニン-アンジオテンシン系と血中K⁺濃度によって調節され、ACTHの影響は限定的である。", 0], ["コルチゾール", "正しい。副腎皮質刺激ホルモン（ACTH）が副腎皮質束状層に作用してコルチゾールの分泌を促す。", 1], ["カルシトニン", "カルシトニンは血中Ca²⁺濃度の上昇そのものによって分泌が促される。下垂体の支配は受けない。", 0], ["サイロキシン", "正しい。甲状腺刺激ホルモン（TSH）が甲状腺濾胞細胞に作用してサイロキシンの分泌を促す。", 1]], "z": "下垂体前葉の支配下にあるのは甲状腺ホルモン（TSH）、コルチゾール（ACTH）、性腺ホルモン（FSH・LH）の3系統。アルドステロン、カルシトニン、パラソルモン、インスリン、アドレナリンは下垂体の直接支配を受けず、それぞれ血中の電解質濃度や血糖値、神経によって調節される。"}, {"id": "s5-11", "set": 5, "n": 11, "c": "内分", "t": "内分泌・血糖調節", "p": "p.97", "r": "模試 2025年度問93（インスリン）／本試験でも血糖調節は頻出", "s": "血糖値を低下させるのはどれか。", "neg": false, "two": false, "o": [["インスリン", "正しい。膵島B（β）細胞から分泌され、肝臓や骨格筋でのグリコーゲン合成、組織へのグルコース取り込みを促進する。血糖を下げる作用をもつ唯一のホルモンである。", 1], ["グルカゴン", "膵島A（α）細胞から分泌され、肝グリコーゲンの分解と糖新生を促して血糖を上昇させる。", 0], ["コルチゾール", "糖新生を促進し、末梢でのグルコース利用を抑えることで血糖を上昇させる。", 0], ["成長ホルモン", "末梢組織でのグルコース利用を抑制し、脂肪分解を促すことで血糖を上昇させる。", 0]], "z": "血糖を下げるホルモンはインスリンだけ。上げるホルモンはグルカゴン、アドレナリン、コルチゾール、成長ホルモン、甲状腺ホルモンと多数ある。飢餓に備える機構は重複して備わっているが、過血糖に対する備えは1つしかない、と理解すると忘れにくい。"}, {"id": "s5-12", "set": 5, "n": 12, "c": "生殖", "t": "生殖・性周期", "p": "p.108〜110", "r": "模試 2022年度問92（排卵期に大量分泌）／2024年度問91（正のフィードバック）", "s": "黄体期で正しいのはどれか。", "neg": false, "two": false, "o": [["子宮内膜は増殖期にある", "黄体期に対応する子宮内膜の時期は分泌期である。増殖期は卵胞期に対応する。", 0], ["基礎体温が上昇する", "正しい。黄体から分泌されるプロゲステロンの作用により、基礎体温は排卵を境に0.3℃以上上昇し約10日間続く。", 1], ["エストロゲンのみが分泌される", "黄体はプロゲステロンとエストロゲンの両方を分泌する。", 0], ["妊娠が成立しなければ黄体は約28日持続する", "妊娠が成立しなければ黄体は14日ほどで退化し、白体と呼ばれる結合組織へ変化する。", 0]], "z": "卵巣周期は卵胞期と黄体期、子宮内膜の変化は月経期・増殖期・分泌期。卵胞期＝増殖期＝エストロゲン優位＝低温相、黄体期＝分泌期＝プロゲステロン優位＝高温相、と対応させて覚える。排卵はエストロゲンの正のフィードバックによるLHサージで誘発される。"}, {"id": "s5-13", "set": 5, "n": 13, "c": "血液", "t": "血液・止血", "p": "p.119〜125", "r": "模試 2022年度問93（止血で誤っているもの）／2025年度問95（血小板による止血）", "s": "血液凝固で正しいのはどれか。", "neg": false, "two": false, "o": [["トロンビンがフィブリノゲンをフィブリンに変える", "正しい。プロトロンビンから生じたトロンビンが可溶性のフィブリノゲンを不溶性のフィブリンに転換し、血栓を補強する。", 1], ["血小板血栓を二次血栓という", "血小板が粘着・凝集してできた血栓は一次血栓である。フィブリン網で補強されたものが二次血栓である。", 0], ["ヘパリンは血液凝固を促進する", "ヘパリンは抗トロンビン作用をもつ抗凝固物質である。", 0], ["カルシウムイオンは凝固に関与しない", "Ca²⁺は第Ⅳ因子として多くの凝固反応に必要である。採血した血液にクエン酸を加えるとCa²⁺が除かれて凝固しない。", 0]], "z": "止血は一次止血（血小板がコラーゲンに粘着・凝集→血小板血栓）と二次止血（凝固因子の連鎖反応→トロンビン→フィブリン網で補強）の2段階。凝固を止める側にはヘパリン、アンチトロンビンがあり、できた血栓を溶かすのはプラスミン（線溶）である。"}, {"id": "s5-14", "set": 5, "n": 14, "c": "免疫", "t": "免疫", "p": "p.128〜131", "r": "本試験は免疫が4/125と模試より厚い／模試 2026年度第2回問94（好塩基球）", "s": "獲得免疫に分類されるのはどれか。", "neg": false, "two": false, "o": [["好中球による貪食", "好中球の貪食は病原体の種類を問わずはたらく自然免疫である。", 0], ["皮膚や粘膜による物理的な防御", "体内への侵入そのものを防ぐ、生まれつき備わった自然免疫の第一線である。", 0], ["ナチュラルキラー細胞による感染細胞の傷害", "NK細胞は抗原の提示を受けずに感染細胞や腫瘍細胞を攻撃する自然免疫の細胞である。", 0], ["形質細胞による抗体の産生", "正しい。B細胞が抗原刺激を受けて形質細胞に分化し、その抗原に特異的な抗体を産生する。これは獲得免疫（液性免疫）である。", 1]], "z": "自然免疫＝生まれつき備わり特異性がなく即座にはたらく（皮膚・粘膜、好中球やマクロファージの貪食、NK細胞、補体）。獲得免疫＝特異性があり記憶が残る（B細胞・形質細胞による液性免疫、T細胞による細胞性免疫）。キラーT細胞は獲得免疫、NK細胞は自然免疫という区別が狙われやすい。"}, {"id": "s5-15", "set": 5, "n": 15, "c": "骨", "t": "骨・リモデリング", "p": "p.136", "r": "模試 2025年度問96（骨の形成と吸収）／本試験の問94〜95は5年連続でCa代謝", "s": "骨の改変（リモデリング）で正しいのはどれか。", "neg": false, "two": false, "o": [["骨芽細胞が骨を吸収する", "骨を吸収するのは破骨細胞である。骨芽細胞は骨基質を産生して骨を形成する。", 0], ["成長が止まると骨の改変は起こらなくなる", "成人でも骨の改変は生涯続いている。骨量が一定に保たれるのは形成と吸収が釣り合っているためである。", 0], ["破骨細胞が骨を吸収したあとに骨芽細胞が骨を形成する", "正しい。古い骨を破骨細胞が吸収し、そのあとを骨芽細胞が埋めて新しい骨をつくる。この繰り返しで骨は絶えず入れ替わっている。", 1], ["骨への機械的な負荷は骨形成を抑制する", "適度な機械的負荷は骨形成を促進する。臥床や無重力では負荷が減るため骨量が減少する。", 0]], "z": "破骨細胞＝吸収、骨芽細胞＝形成、骨細胞＝骨基質に埋まって力学的刺激を感知。30歳頃から吸収が形成を上回りはじめ骨量が低下する。女性では閉経後にエストロゲンが減少して骨吸収の抑制が外れるため、加齢変化が顕著になる。"}, {"id": "s5-16", "set": 5, "n": 16, "c": "骨", "t": "骨・ビタミンD", "p": "p.138", "r": "模試 2022年度問95（ビタミンDの活性化に関与しないもの）", "s": "活性型ビタミンDで正しいのはどれか。", "neg": false, "two": false, "o": [["肝臓で最終的に活性化される", "皮膚で紫外線により生成されたのち、肝臓と腎臓で2段階の水酸化を受ける。最終的な活性化は腎臓で起こる。", 0], ["副甲状腺ホルモンにより産生が抑制される", "パラソルモンは腎臓での活性化を促進する。抑制ではない。", 0], ["腸管からのカルシウムの吸収を促進する", "正しい。活性型ビタミンD₃は小腸に作用してCa²⁺とリン酸の吸収を促進し、血中Ca²⁺濃度を上昇させる。", 1], ["腸管からのリンの吸収を抑制する", "活性型ビタミンDはカルシウムとリンの両方の吸収を促進する。", 0]], "z": "ビタミンDは皮膚（紫外線）→肝臓（水酸化）→腎臓（水酸化・活性化）の順に処理される。肺は関与しない。活性型ビタミンDの作用は腸管でのCaとリンの吸収促進。パラソルモンは腎でのリン再吸収は抑制するが、活性型ビタミンDの産生は促進する、という向きの違いに注意する。"}, {"id": "s5-17", "set": 5, "n": 17, "c": "循環", "t": "循環・心周期", "p": "p.144〜145", "r": "本試験 第32回問97・第34回問96（等容性収縮期、同一論点の再出題）／模試 2026年度第2回問96", "s": "心周期で房室弁と動脈弁がともに閉じているのはどれか。", "neg": false, "two": false, "o": [["等容性収縮期", "正しい。等容性収縮期は房室弁が閉じたあと動脈弁がまだ開いていない時期で、心室の容積を変えずに内圧だけが上昇する。等容性弛緩期も同様に両弁が閉じている。", 1], ["心室駆出期", "心室駆出期は動脈弁が開いて血液が駆出される時期である。房室弁は閉じている。", 0], ["受動的心室充満期", "心室圧が心房圧より低下して房室弁が開き、血液が流入する時期である。動脈弁は閉じている。", 0], ["心房収縮期", "心房が収縮して残りの血液を心室へ送り込む時期で、房室弁は開いている。", 0]], "z": "弁の開閉は「房室弁が開いているのは充満期と心房収縮期のみ」「動脈弁が開いているのは駆出期のみ」「等容性収縮期と等容性弛緩期は両方閉じている」。Ⅰ音は房室弁の閉鎖音で等容性収縮期の開始時、Ⅱ音は動脈弁の閉鎖音で等容性弛緩期の開始時に生じる。本試験は「閉じている」「開いている」の両方向から問うてくる。"}, {"id": "s5-18", "set": 5, "n": 18, "c": "循環", "t": "循環・血管", "p": "p.146〜149", "r": "模試 2020年度問85（弾性血管系）／2022年度問97・2024年度問97（血管の拡張・収縮、向きの反転）", "s": "容量血管系に属するのはどれか。", "neg": false, "two": false, "o": [["大動脈", "大動脈は血管壁が厚く弾性に富み、心臓の拍動的な血流を連続的な血流に変える。弾性血管系である。", 0], ["静脈", "正しい。静脈は血管壁が薄く伸展性に富むため、全血液量の約60〜70%を収容する。これを容量血管という。", 1], ["細動脈", "細動脈は内径を変えて血管抵抗を調節する抵抗血管系である。", 0], ["毛細血管", "毛細血管は血液と間質液の間で物質交換を行う交換血管系である。", 0]], "z": "血管の機能的分類は「弾性血管＝大動脈など」「抵抗血管＝細動脈」「交換血管＝毛細血管」「容量血管＝静脈」。血圧＝心拍出量×末梢血管抵抗で、抵抗を決めるのは主に細動脈。静脈は血液の貯蔵庫として循環血液量の調節に関わる。"}, {"id": "s5-19", "set": 5, "n": 19, "c": "呼吸", "t": "呼吸・調節", "p": "p.168〜170", "r": "模試 2026年度第2回問99（頸動脈小体）／2024年度問99（呼吸の神経支配）", "s": "呼吸の化学的調節で誤っているのはどれか。", "neg": true, "two": false, "o": [["中枢化学受容器は延髄の腹側表層にある", "正しい。延髄腹側表層にあり、脳脊髄液のH⁺濃度の変化に反応する。", 0], ["二酸化炭素分圧の上昇は換気を促進する", "正しい。動脈血二酸化炭素分圧の上昇はもっとも強力な換気の促進因子である。", 0], ["末梢化学受容器は頸動脈小体と大動脈小体である", "正しい。頸動脈洞と大動脈弓にある圧受容器（血圧の調節）とは役割も位置も異なるので区別する。", 0], ["末梢化学受容器は動脈血酸素分圧の上昇で興奮する", "誤り。頸動脈小体と大動脈小体は動脈血酸素分圧の低下で興奮し、呼吸運動を促進する。上昇ではない。", 1]], "z": "換気の調節でもっとも鋭敏なのは二酸化炭素分圧（中枢化学受容器）で、酸素分圧の低下に反応するのは末梢化学受容器。頸動脈には化学受容器の頸動脈小体と圧受容器の頸動脈洞が隣り合っており、前者は呼吸、後者は血圧の調節に関わるという対比で整理する。"}, {"id": "s5-20", "set": 5, "n": 20, "c": "呼吸", "t": "呼吸・酸素解離曲線", "p": "p.166〜167", "r": "模試 2022年度問99／2025年度問99（ボーア効果）／2026年度第2回問98（pHと解離量）", "s": "酸素解離曲線が左方へ移動するのはどれか。", "neg": false, "two": false, "o": [["体温の低下", "正しい。体温低下、pH上昇、二酸化炭素分圧低下、2,3-DPG減少で曲線は左方へ移動し、ヘモグロビンは酸素を離しにくくなる。", 1], ["pHの低下", "pHの低下（酸性化）では曲線は右方へ移動し、酸素を離しやすくなる。これがボーア効果である。", 0], ["二酸化炭素分圧の上昇", "二酸化炭素分圧の上昇でも曲線は右方へ移動する。", 0], ["2,3-DPGの増加", "赤血球内の2,3-DPGが増加すると曲線は右方へ移動する。", 0]], "z": "右方移動＝酸素を離しやすい＝組織が酸素を必要としている状況（代謝亢進で PCO₂↑・pH↓・体温↑・2,3-DPG↑）。左方移動はその逆で、肺で酸素を受け取りやすい状況。「運動した筋では右へ」と覚えると向きを間違えにくい。"}, {"id": "s5-21", "set": 5, "n": 21, "c": "腎", "t": "腎・尿の生成", "p": "p.173〜178", "r": "模試 2026年度第2回問100（近位尿細管の再吸収率）／2025年度問100（尿細管で分泌されるもの）", "s": "1日の原尿量が150Lで尿量が1.5Lのとき、尿細管で再吸収される水の割合はどれか。", "neg": false, "two": false, "o": [["約99%", "正しい。（150−1.5）÷150≒0.99。原尿のうち約99%の水が再吸収され、残り約1%が尿として排泄される。", 1], ["約50%", "近位尿細管だけでも原尿の約60〜70%が再吸収されるため、全体で50%ということはない。", 0], ["約70%", "近位尿細管での再吸収率に近い値だが、ヘンレのループ以降でもさらに再吸収が続く。", 0], ["約90%", "計算すると約99%であり、90%では尿量が15Lとなって現実的でない。", 0]], "z": "糸球体濾過量は約125mL/分＝約180L/日（原尿）で、尿は1〜2L/日。約99%が再吸収される。部位別では近位尿細管が約60〜70%、以降はヘンレのループで髄質の浸透圧勾配を形成し、遠位尿細管はアルドステロン、集合管はバソプレシンで調節される。"}, {"id": "s5-22", "set": 5, "n": 22, "c": "代謝", "t": "栄養と代謝・脂質", "p": "p.186〜189", "r": "模試 2025年度問101（リポタンパク質の分子量）／2026年度第2回問101（ビタミン）", "s": "糖新生で正しいのはどれか。", "neg": false, "two": false, "o": [["脂肪酸からグルコースが産生される", "脂肪酸からグルコースはつくれない。材料となるのは乳酸、アミノ酸（糖原性アミノ酸）、中性脂肪由来のグリセロールである。", 0], ["インスリンによって促進される", "糖新生を促進するのはグルカゴンやコルチゾールである。インスリンはむしろ抑制する。", 0], ["主に肝臓で行われる", "正しい。糖新生は肝臓（および腎臓）で行われ、糖質以外の材料からグルコースを産生して血糖値の低下を防ぐ。", 1], ["食後に最も盛んになる", "糖新生は空腹時や飢餓時に盛んになる。食後は吸収されたグルコースが使われ、グリコーゲン合成が進む。", 0]], "z": "血糖を保つ仕組みは「食後＝グリコーゲン合成（インスリン）」「空腹時＝グリコーゲン分解→糖新生（グルカゴン・コルチゾール）」の順にはたらく。糖新生の材料は乳酸・糖原性アミノ酸・グリセロールで、脂肪酸は材料にならない点が狙われやすい。"}, {"id": "s5-23", "set": 5, "n": 23, "c": "消化", "t": "消化・消化管ホルモン", "p": "p.200〜201", "r": "模試 2021年度問101（体液性調節）／2020年度問88（胃液分泌の抑制）", "s": "消化管ホルモンとその作用の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["セクレチン ──── 胃酸分泌の促進", "セクレチンは胃から送られた酸性の内容物が十二指腸に入ることで分泌され、胃液の分泌はむしろ抑制する。促進するのは重炭酸イオンに富むアルカリ性の膵液の分泌である。", 0], ["コレシストキニン ──── 胆嚢の収縮", "正しい。十二指腸に脂質やタンパク質の消化産物が入ると分泌され、胆嚢を収縮させるとともにオッディの括約筋を弛緩させて、胆汁を十二指腸へ送り出す。酵素に富む膵液の分泌も促す。", 1], ["ガストリン ──── 膵液の分泌抑制", "ガストリンは胃や小腸上部から分泌され、胃酸とペプシンの分泌を促進する。膵液の分泌を抑制する作用はない。", 0], ["グレリン ──── 摂食の抑制", "グレリンは食事前の空腹時に胃や小腸から分泌され、視床下部にはたらいて摂食を促進する。成長ホルモンの分泌も増加させる。", 0]], "z": "消化管ホルモンは「ガストリン＝胃酸・ペプシン分泌（胃・小腸上部）」「セクレチン＝重炭酸イオンに富む膵液、胃液分泌は抑制（小腸）」「コレシストキニン＝酵素に富む膵液と胆嚢収縮（小腸）」「GLP-1＝インスリン分泌増加」「グレリン＝摂食促進・成長ホルモン分泌増加（空腹時に胃から）」。"}, {"id": "s5-24", "set": 5, "n": 24, "c": "消化", "t": "消化・脂質の吸収", "p": "p.213〜214", "r": "模試 2022年度問102（グルコースと共輸送されるイオン）／2024年度問104（肝臓の働き）", "s": "小腸で吸収された脂質が最初に入る経路はどれか。", "neg": false, "two": false, "o": [["門脈", "門脈へ入るのは糖質（単糖類）とタンパク質（アミノ酸）である。これらは毛細血管から門脈を経て肝臓へ運ばれる。", 0], ["肝動脈", "肝動脈は肝臓へ酸素を含む動脈血を供給する血管で、吸収経路ではない。", 0], ["リンパ管", "正しい。吸収上皮細胞内で再合成されたトリグリセリドはカイロミクロンとなり、絨毛中心部のリンパ管に入る。乳び槽から胸管を経て左静脈角で静脈へ合流する。", 1], ["胸管から直接大動脈へ", "胸管はリンパを左静脈角で静脈系へ返す。大動脈へ直接注ぐことはない。", 0]], "z": "吸収経路は栄養素によって分かれる。糖質・アミノ酸・水溶性ビタミン・ミネラルは毛細血管→門脈→肝臓。脂質と脂溶性ビタミンはカイロミクロンとなってリンパ管→乳び槽→胸管→左静脈角→静脈。脂質だけが肝臓を経由せず体循環に入る点が要点である。"}, {"id": "s5-25", "set": 5, "n": 25, "c": "加齢", "t": "加齢", "p": "p.223〜232", "r": "模試 2026年度第2回問105（細胞老化）／2025年度問104（加齢による細胞の変化）／2022年度問105（感覚器系）", "s": "加齢に伴う変化で誤っているのはどれか。", "neg": true, "two": false, "o": [["体重に占める水分量が約60%から約50%へ減少する", "正しい。減少するのは主に細胞内液で、細胞外液の割合は約20%のまま変わらない。", 0], ["遅筋より速筋のほうが加齢の影響を受けやすい", "正しい。遅筋では筋線維の数のみが減少するのに対し、速筋では数と太さの両方が減少する。", 0], ["肺活量が減少し残気量が増加する", "正しい。肺組織の変性によりコンプライアンスが変化し、胸郭も広がりにくくなるため、呼吸筋の仕事量が増す。", 0], ["小腸での栄養の吸収機能が著しく低下する", "誤り。粘膜の萎縮は若干みられるものの、絨毛の数や吸収上皮細胞の増殖能は変化しないため、栄養吸収機能への影響は小さい。一方で唾液量と胃酸分泌量は顕著に低下する。", 1]], "z": "加齢で低下するもの＝脳重量・ニューロン数・筋量と筋力（速筋優位）・骨量・肺活量・唾液と胃酸・視力と聴力（高音域から）・嗅覚・平衡機能・歩行速度と歩幅。増加するもの＝体脂肪率・残気量・歩隔・両足支持期・末梢血管抵抗・左心室壁厚。変わらないもの＝細胞外液の割合・筋線維の単位断面積あたりの最大張力・小腸の吸収能。"}, {"id": "s6-1", "set": 6, "n": 1, "c": "総論", "t": "総論・細胞膜の輸送", "p": "p.3※", "r": "模試 2021問81", "s": "細胞膜を介した物質の輸送で正しいのはどれか。", "neg"
