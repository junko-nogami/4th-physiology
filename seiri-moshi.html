: false, "two": false, "o": [["小腸上皮でNa⁺と共に取り込まれるグルコースの輸送は二次性能動輸送である。", "正しい。Na⁺-K⁺ポンプがつくったNa⁺の濃度勾配を利用し、グルコースを濃度勾配に逆らって取り込む。ATPを直接使わないので「二次性」という。", 1], ["単純拡散では物質が濃度勾配に逆らって移動する。", "誤り。単純拡散は濃度の高い側から低い側へ、エネルギーを使わずに移動する受動輸送である。", 0], ["Na⁺-K⁺ポンプはATPを使わずにイオンを運ぶ。", "誤り。Na⁺-K⁺ポンプはATPを分解したエネルギーで、Na⁺を細胞外へ3個、K⁺を細胞内へ2個運ぶ一次性能動輸送である。", 0], ["輸送体を介する促通拡散は、濃度を上げても輸送速度が飽和しない。", "誤り。促通拡散は輸送体（担体）の数に限りがあるため、濃度を上げると輸送速度が頭打ち（飽和）になる。飽和しないのは単純拡散である。", 0]], "z": "受動輸送＝単純拡散・促通拡散（エネルギー不要、勾配に従う）／能動輸送＝一次性（ATPを直接使う：Na⁺-K⁺ポンプ、Ca²⁺ポンプ）・二次性（Na⁺の勾配を利用：Na⁺-グルコース共輸送、Na⁺-アミノ酸共輸送）。"}, {"id": "s6-2", "set": 6, "n": 2, "c": "筋", "t": "筋・単収縮と強縮", "p": "p.17-19※", "r": "", "s": "骨格筋の収縮で正しいのはどれか。", "neg": false, "two": false, "o": [["骨格筋は不応期が長いため強縮を起こさない。", "誤り。不応期が長く強縮を起こさないのは心筋である。骨格筋は不応期が短いので、刺激を重ねると収縮が加重して強縮になる。", 0], ["単収縮の持続時間は活動電位の持続時間より短い。", "誤り。骨格筋の活動電位は数msで終わるが、単収縮は数十〜100ms続く。だから次の刺激で収縮が加重できる。", 0], ["不完全強縮は完全強縮より高い刺激頻度で生じる。", "誤り。刺激頻度が低いと収縮の波が残る不完全強縮、さらに頻度を上げると波が融合した完全強縮になる。", 0], ["完全強縮の張力は単収縮の張力より大きい。", "正しい。収縮が加重するため、完全強縮の張力は単収縮の数倍になる。日常の随意運動は強縮で行われている。", 1]], "z": "加重と強縮が起こる条件は「活動電位（不応期）が収縮より短い」こと。骨格筋はこれを満たし、心筋は不応期が収縮期とほぼ同じ長さなので強縮しない（ポンプ機能を守るしくみ）。"}, {"id": "s6-3", "set": 6, "n": 3, "c": "筋", "t": "筋・心筋の特徴", "p": "p.20-21※", "r": "模試 2020問103", "s": "骨格筋と比べた心筋の特徴で正しいのはどれか。", "neg": false, "two": false, "o": [["横紋がみられない。", "誤り。心筋も骨格筋と同じく横紋筋である。横紋がないのは平滑筋。", 0], ["不応期が短い。", "誤り。心筋の不応期は長い（活動電位にプラトー相がある）。", 0], ["ギャップ結合により機能的合胞体としてはたらく。", "正しい。介在板のギャップ結合を通して興奮が細胞から細胞へ広がるため、心房・心室がそれぞれ一体となって収縮する。", 1], ["強縮を起こしやすい。", "誤り。不応期が長いため強縮を起こさない。", 0]], "z": "心筋＝横紋あり・不随意・ギャップ結合（機能的合胞体）・不応期が長く強縮しない・自動能あり・自律神経とホルモンの調節を受ける。骨格筋＝横紋あり・随意・強縮する。平滑筋＝横紋なし・不随意。"}, {"id": "s6-4", "set": 6, "n": 4, "c": "神経", "t": "神経・脳波", "p": "p.34-35", "r": "模試 2020問101", "s": "脳波と状態の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["β波 ―――― 深睡眠時", "誤り。β波（14Hz以上）は開眼時や精神活動時にみられる速い波である。", 0], ["α波 ―――― 閉眼安静覚醒時", "正しい。α波（8〜13Hz）は閉眼・安静・覚醒時に後頭部で目立つ。開眼や暗算で消える（α波阻止）。", 1], ["δ波 ―――― 覚醒時", "誤り。δ波（4Hz未満）は深いノンレム睡眠でみられる。", 0], ["θ波 ―――― 開眼時の精神活動", "誤り。θ波（4〜7Hz）は浅いノンレム睡眠（入眠期）でみられる。", 0]], "z": "速い順に β（開眼・精神活動）＞α（閉眼安静覚醒）＞θ（浅い睡眠）＞δ（深い睡眠）。レム睡眠は覚醒時に似た低振幅の速い波を示し、急速眼球運動と骨格筋の緊張低下を伴う。"}, {"id": "s6-5", "set": 6, "n": 5, "c": "神経", "t": "神経・シナプス伝達の特徴", "p": "p.28-29", "r": "模試 2026問84", "s": "シナプス伝達の特徴で誤っているのはどれか。", "neg": true, "two": false, "o": [["興奮は両方向に伝わる。", "誤りの記述（これが正解）。両方向に伝わるのは神経線維上の興奮伝導（両側性伝導）である。シナプスでは一方向性。", 1], ["シナプス遅延がある。", "正しい記述。伝達物質の放出・拡散・受容体結合に時間がかかるため、1つのシナプスで約0.5msの遅れが生じる。", 0], ["神経線維の伝導に比べて疲労しやすい。", "正しい記述。高頻度の刺激が続くと伝達物質が枯渇し、伝達が弱まる。", 0], ["興奮は一方向にのみ伝わる。", "正しい記述。伝達物質はシナプス前終末からしか放出されず、受容体はシナプス後膜にあるため、一方向性である。", 0]], "z": "神経線維の伝導＝両側性・絶縁性・不減衰。シナプス伝達＝一方向性・シナプス遅延・疲労しやすい・薬物や酸素欠乏の影響を受けやすい・加重（時間的／空間的）・可塑性がある。"}, {"id": "s6-6", "set": 6, "n": 6, "c": "神経", "t": "神経・脳神経と副交感神経", "p": "p.36-37※", "r": "", "s": "副交感神経線維を含む脳神経はどれか。2つ選べ。", "neg": false, "two": true, "o": [["動眼神経", "正しい。縮瞳（瞳孔括約筋）と遠近調節（毛様体筋）を担う副交感神経線維を含む。", 1], ["滑車神経", "誤り。上斜筋を支配する運動神経のみで、副交感神経線維は含まない。", 0], ["顔面神経", "正しい。涙腺、顎下腺・舌下腺の分泌を担う副交感神経線維を含む。", 1], ["舌下神経", "誤り。舌筋を支配する運動神経のみである。", 0]], "z": "副交感神経を含む脳神経はⅢ動眼・Ⅶ顔面・Ⅸ舌咽（耳下腺）・Ⅹ迷走（胸腹部内臓）の4つ。仙髄（S2〜S4）からは骨盤神経として出る。"}, {"id": "s6-7", "set": 6, "n": 7, "c": "運動", "t": "運動の生理・ゴルジ腱器官", "p": "p.47-48", "r": "模試 2025問86", "s": "ゴルジ腱器官で正しいのはどれか。", "neg": false, "two": false, "o": [["筋線維と並列に配置されている。", "誤り。ゴルジ腱器官は筋と腱の移行部にあり、筋線維と直列に配置されている。並列に配置されているのは筋紡錘。", 0], ["γ運動ニューロンの支配を受ける。", "誤り。γ運動ニューロンが支配するのは筋紡錘の錘内筋線維である。", 0], ["筋の長さの変化を検出する。", "誤り。筋の長さを検出するのは筋紡錘である。", 0], ["腱の張力を検出し、同名筋を抑制する。", "正しい。張力の情報はIb群線維で脊髄へ送られ、抑制性介在ニューロンを介して同じ筋のα運動ニューロンを抑制する（自原抑制、Ib抑制）。", 1]], "z": "筋紡錘＝並列・長さ（伸張）を検出・Ia群とⅡ群・γ運動ニューロンで感度調節・伸張反射（同名筋を興奮）。ゴルジ腱器官＝直列・張力を検出・Ib群・自原抑制（同名筋を抑制）。"}, {"id": "s6-8", "set": 6, "n": 8, "c": "運動", "t": "運動の生理・姿勢反射の中枢", "p": "p.53-54", "r": "模試 2021問86／2026問87", "s": "反射とその中枢の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["伸張反射 ―――― 延髄", "誤り。伸張反射は単シナプス反射で、中枢は脊髄。", 0], ["立ち直り反射 ―――― 中脳", "正しい。立ち直り反射の中枢は中脳にあり、除脳（中脳より下で切断）すると消失する。", 1], ["緊張性頸反射 ―――― 中脳", "誤り。緊張性頸反射の中枢は延髄。", 0], ["跳び直り反応 ―――― 脊髄", "誤り。跳び直り反応や踏み直り反応などの平衡反応の中枢は大脳皮質。", 0]], "z": "脊髄＝伸張反射・屈曲反射・交叉性伸展反射／延髄＝緊張性頸反射・緊張性迷路反射（除脳固縮で残る）／中脳＝立ち直り反射／大脳皮質＝跳び直り反応・踏み直り反応・置き直り反応。"}, {"id": "s6-9", "set": 6, "n": 9, "c": "感覚", "t": "感覚・受容器と適刺激", "p": "p.59-60", "r": "模試 2021問88／2025問88", "s": "機械受容器でないのはどれか。", "neg": true, "two": false, "o": [["網膜の杆体", "機械受容器ではない（これが正解）。杆体は光を適刺激とする光受容器である。", 1], ["マイスネル小体", "機械受容器。真皮乳頭にあり、触覚や低い周波数の振動を受容する。", 0], ["コルチ器の有毛細胞", "機械受容器。音波による基底膜の振動で毛が曲がり、興奮する。", 0], ["パチニ小体", "機械受容器。皮下の深部にあり、振動（約200Hz）を受容する。", 0]], "z": "機械受容器＝パチニ小体・マイスネル小体・メルケル盤・ルフィニ終末・筋紡錘・腱器官・有毛細胞（聴覚・平衡覚）・圧受容器。光受容器＝杆体・錐体。化学受容器＝味細胞・嗅細胞・頸動脈小体。温度受容器・侵害受容器は自由神経終末。"}, {"id": "s6-10", "set": 6, "n": 10, "c": "感覚", "t": "感覚・味覚", "p": "p.75-77※", "r": "", "s": "味覚で正しいのはどれか。", "neg": false, "two": false, "o": [["辛味は基本味に含まれる。", "誤り。基本味は甘味・塩味・酸味・苦味・うまみの5つ。辛味は痛覚・温度覚の受容器で感じる。", 0], ["受容器は有毛細胞である。", "誤り。味の受容器は味蕾の中の味細胞である。有毛細胞は聴覚と平衡覚の受容器。", 0], ["順応はほとんどみられない。", "誤り。味覚は順応しやすい感覚である。順応が最も遅いのは痛覚。", 0], ["舌の前2/3の味覚は顔面神経が伝える。", "正しい。舌の前2/3は顔面神経（鼓索神経）、後1/3は舌咽神経、咽頭・喉頭は迷走神経が伝える。", 1]], "z": "味覚の神経：舌前2/3＝顔面神経（鼓索神経）、舌後1/3＝舌咽神経、咽頭・喉頭＝迷走神経。延髄の孤束核→視床→大脳皮質味覚野。舌の一般体性感覚（触・痛）は前2/3が三叉神経。"}, {"id": "s6-11", "set": 6, "n": 11, "c": "内分", "t": "内分泌・ホルモンの化学的分類", "p": "p.85-86", "r": "模試 2021問89", "s": "ペプチド（タンパク質）ホルモンでないのはどれか。", "neg": true, "two": false, "o": [["インスリン", "ペプチドホルモン。膵島のB細胞から分泌される。", 0], ["成長ホルモン", "ペプチドホルモン。下垂体前葉から分泌される。", 0], ["アルドステロン", "ペプチドホルモンではない（これが正解）。副腎皮質から分泌されるステロイドホルモンで、コレステロールから合成される。", 1], ["バソプレシン", "ペプチドホルモン。視床下部でつくられ下垂体後葉から分泌される。", 0]], "z": "ステロイド＝副腎皮質ホルモン（コルチゾール・アルドステロン）・性ホルモン（テストステロン・エストロゲン・プロゲステロン）・活性型ビタミンD。アミン（アミノ酸誘導体）＝アドレナリン・ノルアドレナリン・甲状腺ホルモン・メラトニン。その他の多くはペプチド。ステロイドと甲状腺ホルモンは核内受容体に結合する。"}, {"id": "s6-12", "set": 6, "n": 12, "c": "内分", "t": "内分泌・下垂体後葉", "p": "p.89-90※", "r": "", "s": "下垂体後葉ホルモンで正しいのはどれか。", "neg": false, "two": false, "o": [["オキシトシンは下垂体後葉で合成される。", "誤り。オキシトシンとバソプレシンは視床下部の室傍核・視索上核で合成され、軸索を通って後葉に運ばれてから分泌される（神経分泌）。", 0], ["バソプレシンは集合管での水の再吸収を促進する。", "正しい。集合管の水チャネル（アクアポリン2）を増やし、尿を濃縮する。抗利尿ホルモンとも呼ばれる。", 1], ["後葉の分泌は視床下部の放出ホルモンで調節される。", "誤り。放出ホルモンが下垂体門脈を通って調節するのは前葉である。後葉は神経で直接つながる。", 0], ["バソプレシンは血漿浸透圧が低下すると分泌が増える。", "誤り。血漿浸透圧が上昇したとき（脱水時）や循環血液量が減ったときに分泌が増える。", 0]], "z": "後葉ホルモンはオキシトシン（射乳・子宮収縮）とバソプレシン（抗利尿・血管収縮）の2つだけ。前葉ホルモンは成長ホルモン・プロラクチン・TSH・ACTH・FSH・LH の6つ。"}, {"id": "s6-13", "set": 6, "n": 13, "c": "生殖", "t": "生殖・胎盤のホルモン", "p": "p.110-112※", "r": "", "s": "妊娠初期に黄体を維持し、妊娠検査の対象となるホルモンはどれか。", "neg": false, "two": false, "o": [["ヒト絨毛性ゴナドトロピン（hCG）", "正しい。受精卵の絨毛（胎盤）から分泌され、LHに似た作用で黄体を妊娠黄体として維持する。尿中に出るので妊娠検査に使われる。妊娠10週ごろが分泌のピーク。", 1], ["ヒト胎盤性ラクトゲン（hPL）", "誤り。妊娠後期に増えるホルモンで、母体の血糖を上げて胎児へのブドウ糖供給を増やす。", 0], ["オキシトシン", "誤り。分娩時の子宮収縮と、授乳時の射乳に関わる下垂体後葉ホルモン。", 0], ["プロラクチン", "誤り。下垂体前葉から分泌され、乳汁の産生を促す。", 0]], "z": "胎盤のホルモン＝hCG（黄体維持・初期）、hPL（母体の血糖上昇・後期）、エストロゲン・プロゲステロン（妊娠中期以降は黄体に代わって胎盤が主に分泌）。乳汁の産生＝プロラクチン、射乳＝オキシトシン。"}, {"id": "s6-14", "set": 6, "n": 14, "c": "血液", "t": "血液・ヘモグロビンの代謝", "p": "p.118", "r": "", "s": "ヘモグロビンの代謝で正しいのはどれか。", "neg": false, "two": false, "o": [["グルクロン酸抱合は脾臓で行われる。", "誤り。グルクロン酸抱合は肝臓で行われ、水に溶けやすい直接ビリルビンとなって胆汁中に排泄される。", 0], ["グロビンはビリベルジンに分解される。", "誤り。ビリベルジンになるのはヘムである。グロビンはアミノ酸に分解され、タンパク質合成に再利用される。", 0], ["間接ビリルビンは水に溶けやすい。", "誤り。間接ビリルビンは水に溶けにくく、アルブミンと結合して肝臓へ運ばれる。", 0], ["ヘム由来の鉄は主にフェリチンとして肝臓に貯蔵される。", "正しい。鉄は貯蔵鉄として再利用されるため、鉄の摂取が減ってもすぐには貧血にならない。", 1]], "z": "赤血球は脾臓などで破壊→ヘモグロビン＝グロビン（アミノ酸へ）＋ヘム（鉄→貯蔵鉄／ビリベルジン→間接ビリルビン）→肝臓でグルクロン酸抱合→直接ビリルビン→胆汁→腸でウロビリノゲン→ステルコビリンとして便へ。"}, {"id": "s6-15", "set": 6, "n": 15, "c": "血液", "t": "血液・ヘモグロビンの酸素結合量", "p": "p.118", "r": "", "s": "血液100mLにヘモグロビンが15g含まれ、すべてが酸素と結合したとき、ヘモグロビンと結合している酸素量に最も近いのはどれか。", "neg": false, "two": false, "o": [["約2mL", "誤り。ヘモグロビン1gが結合できる酸素量を1.34mLとして計算すると合わない。", 0], ["約10mL", "誤り。15g×1.34mLの半分程度で、酸素飽和度が約50%のときの値に近い。", 0], ["約20mL", "正しい。ヘモグロビン1gは約1.34mLの酸素と結合するので、15g×1.34mL≒20mLとなる。", 1], ["約40mL", "誤り。計算値の約2倍で、該当しない。", 0]], "z": "ヘモグロビン1g＝酸素1.34mL。血液100mL中のHb約15g→約20mL。血漿に物理的に溶ける酸素はごくわずかで、酸素の大部分はHbと結合して運ばれる。"}, {"id": "s6-16", "set": 6, "n": 16, "c": "免疫", "t": "免疫・細胞性免疫", "p": "p.130-132", "r": "", "s": "細胞性免疫に直接関与するのはどれか。2つ選べ。", "neg": false, "two": true, "o": [["形質細胞", "誤り。B細胞が分化した形質細胞は抗体を産生する。液性免疫の担い手である。", 0], ["キラーT細胞", "正しい。MHCクラスⅠに提示されたウイルス抗原を認識し、パーフォリン含有顆粒を分泌して感染細胞を殺傷する。", 1], ["補体", "誤り。補体は肝臓で産生されるタンパク質で、抗原に結合した抗体により活性化される。液性免疫の作用を補助する。", 0], ["ヘルパーT細胞（Th1細胞）", "正しい。IL-2を分泌してキラーT細胞を活性化し、IFN-γを分泌してマクロファージの貪食能を高める。", 1]], "z": "細胞性免疫＝Th1細胞（IL-2・IFN-γ）、キラーT細胞、マクロファージ、MHCクラスⅠでの抗原提示。液性免疫＝Th2細胞（IL-4・5・6・10）、B細胞→形質細胞（抗体）・メモリーB細胞、抗体の作用（中和・オプソニン化・補体の活性化）。"}, {"id": "s6-17", "set": 6, "n": 17, "c": "骨", "t": "骨Ca・パラソルモン", "p": "p.137-138", "r": "模試 2020問98／2026問95", "s": "パラソルモンの作用で誤っているのはどれか。", "neg": true, "two": false, "o": [["破骨細胞による骨吸収を促進する。", "正しい記述。骨からカルシウムを溶け出させ、血中カルシウム濃度を上げる。", 0], ["腎臓でのカルシウムの再吸収を促進する。", "正しい記述。尿中へのカルシウムの排泄を減らす。", 0], ["血中リン濃度を上昇させる。", "誤りの記述（これが正解）。腎臓でのリンの再吸収を抑制し、血中リン濃度を低下させる。", 1], ["腎臓でのビタミンDの活性化を促進する。", "正しい記述。活性型ビタミンDが増え、腸管からのカルシウム吸収が間接的に増える。", 0]], "z": "パラソルモン（副甲状腺）＝血中Ca↑・リン↓、骨吸収↑、腎でCa再吸収↑・リン再吸収↓・ビタミンD活性化↑。カルシトニン（甲状腺）＝骨吸収↓・血中Ca↓。活性型ビタミンD＝腸管でのCa吸収↑。なおパラソルモンは間欠的に投与すると骨形成を促進する。"}, {"id": "s6-18", "set": 6, "n": 18, "c": "循環", "t": "循環・心電図の波形", "p": "p.141-143", "r": "模試 2021問96", "s": "心電図で正しいのはどれか。", "neg": false, "two": false, "o": [["P波は心室の脱分極を表す。", "誤り。P波は心房の脱分極（興奮）を表す。", 0], ["QRS波は心房の再分極を表す。", "誤り。QRS波は心室の脱分極を表す。心房の再分極はQRS波に重なって見えない。", 0], ["PQ時間は心室内の伝導時間を表す。", "誤り。PQ時間は心房の興奮開始から心室の興奮開始までで、房室間の興奮伝導時間を表す。", 0], ["T波は心室の再分極を表す。", "正しい。T波は心室の興奮が消えていく過程（再分極）である。", 1]], "z": "P＝心房の脱分極、PQ時間＝房室伝導時間（房室結節で遅れる）、QRS＝心室の脱分極、ST部分＝心室全体が興奮している時期、T＝心室の再分極、QT時間＝心室の電気的収縮時間。"}, {"id": "s6-19", "set": 6, "n": 19, "c": "循環", "t": "循環・心音", "p": "p.144-145", "r": "", "s": "心音で正しいのはどれか。", "neg": false, "two": false, "o": [["Ⅰ音は心室拡張期の始まりを示す。", "誤り。Ⅰ音は心室収縮期の始まりを示す。拡張期の始まりを示すのはⅡ音。", 0], ["Ⅱ音は房室弁の開放で生じる。", "誤り。Ⅱ音は動脈弁（大動脈弁・肺動脈弁）の閉鎖で生じる。", 0], ["Ⅰ音は房室弁の閉鎖で生じる。", "正しい。心室の収縮が始まり、房室弁（僧帽弁・三尖弁）が閉じるときの音である。", 1], ["Ⅲ音は動脈弁の開放で生じる。", "誤り。Ⅲ音は急速充満期に血液が心室へ流れ込み、心室壁が振動して生じる。", 0]], "z": "Ⅰ音＝房室弁閉鎖＝収縮期の始まり（低く長い）／Ⅱ音＝動脈弁閉鎖＝拡張期の始まり（高く短い）。Ⅰ音〜Ⅱ音が収縮期、Ⅱ音〜次のⅠ音が拡張期。弁が開くときは音が出ない。"}, {"id": "s6-20", "set": 6, "n": 20, "c": "呼吸", "t": "呼吸・肺胞換気量の計算", "p": "p.162-163※", "r": "模試 2020問86", "s": "1回換気量500mL、死腔量150mL、呼吸数12回/分のときの肺胞換気量はどれか。", "neg": false, "two": false, "o": [["1,800mL/分", "誤り。死腔量150mL×12回で、死腔を出入りするだけの換気量である。", 0], ["4,200mL/分", "正しい。肺胞換気量＝（1回換気量−死腔量）×呼吸数＝（500−150）×12＝4,200mL/分。", 1], ["6,000mL/分", "誤り。500mL×12回で、分時換気量（死腔を差し引いていない）である。", 0], ["7,800mL/分", "誤り。死腔量を足してしまった（500＋150）×12の値。", 0]], "z": "分時換気量＝1回換気量×呼吸数、肺胞換気量＝（1回換気量−死腔量）×呼吸数。浅く速い呼吸では、分時換気量が同じでも死腔の割合が増えて肺胞換気量が減る。"}, {"id": "s6-21", "set": 6, "n": 21, "c": "呼吸", "t": "呼吸・ヘーリング–ブロイエル反射", "p": "p.169-170※", "r": "模試 2020問87", "s": "ヘーリング–ブロイエル反射で正しいのはどれか。", "neg": false, "two": false, "o": [["肺の伸展の情報は迷走神経を上行する。", "正しい。気管支平滑筋にある肺伸展受容器の情報は、迷走神経を通って延髄の呼吸中枢へ送られる。", 1], ["吸息を促進する。", "誤り。肺が十分にふくらむと吸息を抑制し、呼息へ切り替える（肺の過膨張を防ぐ）。", 0], ["受容器は頸動脈小体にある。", "誤り。頸動脈小体は動脈血の酸素分圧低下などを感知する末梢化学受容器である。", 0], ["中枢は大脳皮質にある。", "誤り。中枢は延髄（呼吸中枢）である。", 0]], "z": "呼吸の調節：化学的調節（中枢化学受容器＝延髄腹側でCO₂・H⁺、末梢化学受容器＝頸動脈小体・大動脈小体でO₂低下）と神経性調節（ヘーリング–ブロイエル反射＝肺伸展受容器→迷走神経→延髄→吸息抑制）。"}, {"id": "s6-22", "set": 6, "n": 22, "c": "腎", "t": "腎・排尿", "p": "p.180-182※", "r": "", "s": "排尿で正しいのはどれか。", "neg": false, "two": false, "o": [["排尿時の排尿筋の収縮は交感神経による。", "誤り。排尿筋を収縮させるのは骨盤神経（副交感神経）である。交感神経（下腹神経）は排尿筋を弛緩させ、尿をためるようにはたらく。", 0], ["外尿道括約筋は陰部神経に支配される骨格筋である。", "正しい。外尿道括約筋は随意的に締めたりゆるめたりできる。", 1], ["排尿反射の中枢は延髄にある。", "誤り。排尿反射の中枢は仙髄（S2〜S4）にあり、橋の排尿中枢がこれを調節する。", 0], ["膀胱内圧は尿量に比例して直線的に上昇する。", "誤り。膀胱壁が伸びるため、一定量（約300mL）まではほとんど上昇せず、それを超えると急に上昇して尿意が生じる。", 0]], "z": "骨盤神経（副交感）＝排尿筋収縮・内尿道括約筋弛緩→排尿／下腹神経（交感）＝排尿筋弛緩・内尿道括約筋収縮→蓄尿／陰部神経（体性）＝外尿道括約筋（随意）。"}, {"id": "s6-23", "set": 6, "n": 23, "c": "代謝", "t": "代謝・ATP産生", "p": "p.190-191", "r": "模試 2020問91／2021問100", "s": "1分子のグルコースが完全に酸化されるとき、最も多くのATPを生じる過程はどれか。", "neg": false, "two": false, "o": [["解糖系", "誤り。解糖系は細胞質で行われ、グルコース1分子から差し引き2分子のATPしかできない。酸素を使わずにATPを産生できるのが特徴。", 0], ["クエン酸回路", "誤り。ミトコンドリア内で行われるが、直接つくられるATP（GTP）はグルコース1分子あたり2分子程度。主な役割はNADHなどの産生。", 0], ["電子伝達系", "正しい。ミトコンドリア内膜でNADH・FADH₂の電子を使い、酸化的リン酸化で大部分（約30分子以上）のATPをつくる。酸素を必要とする。", 1], ["クレアチンリン酸系", "誤り。筋の中のクレアチンリン酸からADPへリン酸を渡して素早くATPを再合成する系で、グルコースの酸化とは別である。", 0]], "z": "グルコース1分子から約30〜38分子のATP。無酸素で働く＝解糖系・クレアチンリン酸系／酸素が必要＝クエン酸回路・電子伝達系（ミトコンドリア）。脂肪酸はβ酸化でアセチルCoAになりクエン酸回路へ入る（解糖系は使わない）。"}, {"id": "s6-24", "set": 6, "n": 24, "c": "消化", "t": "消化・肝臓のはたらき", "p": "p.209", "r": "模試 2020問90／2025問103", "s": "肝臓のはたらきでないのはどれか。", "neg": true, "two": false, "o": [["尿素の生成", "肝臓のはたらき。アミノ酸の分解で生じた有害なアンモニアを、オルニチン回路で無毒な尿素に変える。", 0], ["インスリンの分泌", "肝臓のはたらきではない（これが正解）。インスリンは膵臓のランゲルハンス島B細胞から分泌される。", 1], ["アルブミンの合成", "肝臓のはたらき。アルブミンやフィブリノゲンなど多くの血漿タンパク質は肝臓で合成される。", 0], ["グリコーゲンの貯蔵", "肝臓のはたらき。血糖が高いときはグリコーゲンとして蓄え、低いときに分解してグルコースを血中に出す。", 0]], "z": "肝臓のはたらき：糖代謝（グリコーゲン貯蔵・糖新生）、タンパク質代謝（アルブミン・凝固因子の合成、尿素の生成）、脂質代謝（コレステロール合成）、胆汁の生成、解毒、ビリルビンのグルクロン酸抱合、ビタミン・鉄の貯蔵。"}, {"id": "s6-25", "set": 6, "n": 25, "c": "体温", "t": "体温・発熱とうつ熱", "p": "p.219-221※", "r": "", "s": "発熱で正しいのはどれか。", "neg": false, "two": false, "o": [["体温調節中枢のセットポイントが上昇する。", "正しい。発熱物質（プロスタグランジンE₂など）が視床下部に作用して設定温度が上がり、体温がその値まで上げられる。", 1], ["発熱物質は延髄に作用する。", "誤り。体温調節中枢は視床下部にある。", 0], ["体温の上昇期には皮膚血管が拡張する。", "誤り。上昇期は皮膚血管が収縮して熱放散を減らし、ふるえで熱をつくる（悪寒・戦慄）。", 0], ["うつ熱ではセットポイントが上昇する。", "誤り。うつ熱（熱中症など）はセットポイントは正常のまま、熱放散が追いつかずに体温が上がる状態である。", 0]], "z": "発熱＝セットポイント上昇（上昇期：皮膚血管収縮・ふるえ・悪寒／解熱期：皮膚血管拡張・発汗）。うつ熱＝セットポイントは正常で熱の産生＞放散。解熱薬（プロスタグランジン合成阻害）は発熱には効くが、うつ熱には効かない。"}, {"id": "s7-1", "set": 7, "n": 1, "c": "総論", "t": "総論・体液の区分", "p": "p.6-8※", "r": "", "s": "体重60kgの成人男性の細胞外液量に最も近いのはどれか。", "neg": false, "two": false, "o": [["3L", "誤り。体重の約5%で、血漿量に相当する。", 0], ["12L", "正しい。細胞外液は体重の約20%なので、60kg×0.2＝12Lとなる。", 1], ["24L", "誤り。体重の約40%で、細胞内液量に相当する。", 0], ["36L", "誤り。体重の約60%で、体液の総量に相当する。", 0]], "z": "成人男性の体液は体重の約60%＝細胞内液40%＋細胞外液20%（間質液15%＋血漿5%）。新生児は約80%、高齢者や女性は少ない（脂肪が多いほど水分の割合が低い）。"}, {"id": "s7-2", "set": 7, "n": 2, "c": "筋", "t": "筋・サルコメアの構造", "p": "p.12-14※", "r": "模試 2026問82", "s": "骨格筋が収縮するとき、長さが変わらないのはどれか。", "neg": false, "two": false, "o": [["I帯", "誤り。I帯はアクチンだけの部分で、フィラメントが滑り込むと短くなる。", 0], ["H帯", "誤り。H帯はミオシンだけの部分で、アクチンが中央へ滑り込むと短くなる（消失する）。", 0], ["サルコメア", "誤り。Z線とZ線の間のサルコメアは短くなる。", 0], ["A帯", "正しい。A帯はミオシンフィラメントの長さそのものなので、収縮しても長さは変わらない。", 1]], "z": "滑走説：アクチンがミオシンの間に滑り込み、フィラメント自体の長さは変わらない。短くなる＝I帯・H帯・サルコメア、変わらない＝A帯。Ca²⁺がトロポニンに結合するとアクチンとミオシンが結合できるようになる。"}, {"id": "s7-3", "set": 7, "n": 3, "c": "神経", "t": "神経・大脳皮質の機能局在", "p": "p.39-41※", "r": "", "s": "大脳皮質の部位と機能の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["中心前回 ―――― 体性感覚", "誤り。中心前回は一次運動野である。体性感覚野は中心後回。", 0], ["後頭葉 ―――― 聴覚", "誤り。後頭葉には一次視覚野がある。", 0], ["側頭葉 ―――― 聴覚", "正しい。一次聴覚野は側頭葉の上側頭回（横側頭回）にある。", 1], ["ウェルニッケ野 ―――― 運動性失語", "誤り。ウェルニッケ野（側頭葉）の障害は感覚性失語（言葉の理解ができない）である。運動性失語はブローカ野（前頭葉）の障害。", 0]], "z": "前頭葉＝一次運動野（中心前回）・ブローカ野（運動性言語中枢）／頭頂葉＝体性感覚野（中心後回）／側頭葉＝聴覚野・ウェルニッケ野（感覚性言語中枢）／後頭葉＝視覚野。"}, {"id": "s7-4", "set": 7, "n": 4, "c": "神経", "t": "神経・交感神経の作用", "p": "p.37", "r": "", "s": "交感神経の興奮で起こらないのはどれか。", "neg": true, "two": false, "o": [["散瞳", "起こる。瞳孔散大筋が収縮する。", 0], ["消化管運動の促進", "起こらない（これが正解）。交感神経は消化管の運動と分泌を抑制する。促進するのは副交感神経。", 1], ["心拍数の増加", "起こる。洞房結節に作用して心拍数を上げ、心収縮力も高める。", 0], ["気管支の拡張", "起こる。気管支平滑筋が弛緩し、空気が通りやすくなる。", 0]], "z": "交感神経＝散瞳・気管支拡張・心拍数↑・血圧↑・消化管運動↓・膀胱（排尿筋）弛緩・汗腺分泌↑（例外的にコリン作動性）。副交感神経＝縮瞳・気管支収縮・心拍数↓・消化管運動↑・排尿筋収縮。唾液腺はどちらでも分泌が増える。"}, {"id": "s7-5", "set": 7, "n": 5, "c": "神経", "t": "神経・視床下部の中枢", "p": "p.42", "r": "模試 2026問85", "s": "視床下部に中枢があるのはどれか。2つ選べ。", "neg": false, "two": true, "o": [["摂食", "正しい。視床下部には摂食中枢（外側野）と満腹中枢（腹内側核）がある。", 1], ["呼吸リズムの形成", "誤り。呼吸中枢は延髄にあり、橋がこれを調節する。", 0], ["排尿反射", "誤り。排尿反射の中枢は仙髄にあり、橋がこれを調節する。", 0], ["体温調節", "正しい。体温調節中枢は視床下部にある。", 1]], "z": "視床下部＝体温調節・摂食（摂食中枢・満腹中枢）・飲水・概日リズム（視交叉上核）・情動行動・下垂体ホルモンの調節・自律神経の統合。延髄＝呼吸・循環・嚥下・嘔吐。橋＝呼吸調節・排尿中枢。"}, {"id": "s7-6", "set": 7, "n": 6, "c": "運動", "t": "運動の生理・歩行の調節", "p": "p.55-57※", "r": "", "s": "歩行のリズムをつくる中枢パターン発生器（CPG）が主に存在する部位はどれか。", "neg": false, "two": false, "o": [["大脳皮質", "誤り。大脳皮質は歩行の開始・停止や、障害物をよけるなど意図的な調節に関わる。", 0], ["小脳", "誤り。小脳は歩行中の姿勢や運動の誤差を修正し、なめらかにする。", 0], ["延髄", "誤り。延髄は姿勢反射（緊張性頸反射など）や呼吸・循環の中枢である。", 0], ["脊髄", "正しい。屈筋と伸筋を交互に活動させるリズムは脊髄の神経回路（CPG）でつくられる。上位中枢（中脳の歩行誘発野など）がこれを起動・調節する。", 1]], "z": "歩行の調節：脊髄＝CPG（リズム形成）、脳幹（中脳歩行誘発野など）＝歩行の起動と筋緊張の調節、小脳＝誤差の修正、大脳基底核＝運動の開始と円滑さ、大脳皮質＝随意的な調節。"}, {"id": "s7-7", "set": 7, "n": 7, "c": "運動", "t": "運動の生理・緊張性迷路反射", "p": "p.53-54", "r": "", "s": "緊張性迷路反射で正しいのはどれか。", "neg": false, "two": false, "o": [["背臥位で四肢の伸筋の緊張が高まる。", "正しい。背臥位では伸筋の緊張が高まり、腹臥位では屈筋の緊張が高まる。", 1], ["中枢は中脳にある。", "誤り。中枢は延髄にある。", 0], ["受容器は半規管である。", "誤り。頭部の傾き（重力の向き）を感知する耳石器（卵形嚢・球形嚢）が受容器である。半規管は回転加速度を感知する。", 0], ["健常成人では常に顕著にみられる。", "誤り。乳児期にみられ、成長とともに上位中枢に抑制されて目立たなくなる。脳損傷で再び現れることがある。", 0]], "z": "延髄が中枢の緊張性反射：緊張性迷路反射（受容器＝耳石器。背臥位で伸筋↑・腹臥位で屈筋↑）と緊張性頸反射（受容器＝頸部の筋・関節。顔を向けた側の上下肢が伸展、後頭側が屈曲）。立ち直り反射は中脳。"}, {"id": "s7-8", "set": 7, "n": 8, "c": "感覚", "t": "感覚・聴覚の伝導路", "p": "p.70-72※", "r": "", "s": "聴覚の伝導路に含まれないのはどれか。", "neg": true, "two": false, "o": [["蝸牛神経核", "含まれる。蝸牛神経（内耳神経）が最初に終わる延髄の神経核である。", 0], ["外側膝状体", "含まれない（これが正解）。外側膝状体は視覚の伝導路の中継核である。", 1], ["内側膝状体", "含まれる。視床の内側膝状体を経て側頭葉の聴覚野へ向かう。", 0], ["下丘", "含まれる。中脳の下丘は聴覚の中継核である。", 0]], "z": "聴覚＝コルチ器→蝸牛神経→蝸牛神経核→（上オリーブ核）→下丘→内側膝状体→聴覚野（側頭葉）。視覚＝網膜→視神経→視交叉→外側膝状体→視覚野（後頭葉）。「内側＝聴覚、外側＝視覚」。上丘は視覚反射に関わる。"}, {"id": "s7-9", "set": 7, "n": 9, "c": "感覚", "t": "感覚・関連痛", "p": "p.78-79※", "r": "", "s": "心筋梗塞で関連痛が生じやすい部位はどれか。", "neg": false, "two": false, "o": [["左肩から左上腕の内側", "正しい。心臓からの内臓痛覚線維と同じ脊髄髄節（T1〜T4付近）に入る皮膚の領域に痛みを感じる。", 1], ["右肩", "誤り。右肩の関連痛は胆嚢・肝臓の疾患（横隔神経を介する）でみられる。", 0], ["臍の周囲", "誤り。虫垂炎の初期などでみられる部位である。", 0], ["右季肋部", "誤り。胆石症・胆嚢炎でみられる部位である。", 0]], "z": "関連痛は、内臓からの痛覚線維と皮膚からの線維が同じ脊髄髄節に入るため、脳が皮膚の痛みと誤って感じる現象。心臓＝左肩・左上腕内側、胆嚢＝右肩・右季肋部、虫垂＝臍周囲（初期）、尿管＝鼠径部。"}, {"id": "s7-10", "set": 7, "n": 10, "c": "内分", "t": "内分泌・成長ホルモン", "p": "p.89※・p.137", "r": "", "s": "成長ホルモンで正しいのはどれか。", "neg": false, "two": false, "o": [["下垂体後葉から分泌される。", "誤り。成長ホルモンは下垂体前葉から分泌される。", 0], ["血糖値を低下させる。", "誤り。成長ホルモンは血糖値を上昇させる（インスリンに拮抗する）。", 0], ["ソマトスタチンにより分泌が促進される。", "誤り。ソマトスタチンは成長ホルモンの分泌を抑制する。促進するのは成長ホルモン放出ホルモン（GHRH）。", 0], ["肝臓でIGF-1の産生を促す。", "正しい。成長ホルモンは肝臓などでIGF-1（ソマトメジンC）をつくらせ、これを介して成長期の成長軟骨にはたらき骨を伸ばす。", 1]], "z": "成長ホルモン：下垂体前葉。GHRHで促進・ソマトスタチンで抑制。睡眠中（深いノンレム睡眠）や運動、低血糖で分泌増加。作用＝IGF-1を介した骨の成長、タンパク質合成↑、脂肪分解↑、血糖↑。"}, {"id": "s7-11", "set": 7, "n": 11, "c": "内分", "t": "内分泌・副腎皮質", "p": "p.94-95", "r": "模試 2026問91", "s": "副腎皮質から分泌されないのはどれか。", "neg": true, "two": false, "o": [["コルチゾール", "分泌される。束状層から分泌される糖質コルチコイドで、血糖上昇・抗炎症作用をもつ。", 0], ["アルドステロン", "分泌される。球状層から分泌される鉱質コルチコイドで、腎でNa⁺の再吸収とK⁺の排泄を促す。", 0], ["アドレナリン", "分泌されない（これが正解）。アドレナリンは副腎髄質から分泌されるアミン（カテコールアミン）である。", 1], ["副腎アンドロゲン", "分泌される。網状層から分泌される男性ホルモン（DHEAなど）。", 0]], "z": "副腎皮質（外から）球状層＝アルドステロン／束状層＝コルチゾール／網状層＝アンドロゲン。いずれもステロイド。副腎髄質＝アドレナリン・ノルアドレナリン（交感神経節後線維に相当）。アルドステロンは主にレニン–アンジオテンシン系で調節され、ACTHの影響は小さい。"}, {"id": "s7-12", "set": 7, "n": 12, "c": "生殖", "t": "生殖・性分化", "p": "p.103-105※", "r": "模試 2021問92", "s": "男性の性分化で正しいのはどれか。", "neg": false, "two": false, "o": [["ミュラー管が精管に分化する。", "誤り。ミュラー管は女性で卵管・子宮・腟上部になる。男性では退化する。", 0], ["ウォルフ管が精巣上体や精管に分化する。", "正しい。精巣のライディッヒ細胞が分泌するテストステロンにより、ウォルフ管が精巣上体・精管・精嚢に分化する。", 1], ["性染色体にY染色体を含まない。", "誤り。男性の性染色体はXYである。Y染色体上の遺伝子（SRY）により生殖腺が精巣になる。", 0], ["抗ミュラー管ホルモンはライディッヒ細胞が分泌する。", "誤り。抗ミュラー管ホルモンを分泌するのはセルトリ細胞である。", 0]], "z": "男性：Y染色体（SRY）→精巣→セルトリ細胞の抗ミュラー管ホルモンでミュラー管が退化、ライディッヒ細胞のテストステロンでウォルフ管が発達。女性：精巣がないため、ウォルフ管が退化しミュラー管が卵管・子宮になる。"}, {"id": "s7-13", "set": 7, "n": 13, "c": "血液", "t": "血液・血液型", "p": "p.125-127", "r": "", "s": "血液型で正しいのはどれか。", "neg": false, "two": false, "o": [["O型の血漿には抗A抗体と抗B抗体の両方が存在する。", "正しい。O型の赤血球にはA抗原もB抗原もなく、血漿には両方の抗体（凝集素）がある。", 1], ["AB型の血漿には抗A抗体が存在する。", "誤り。AB型の血漿には抗A・抗B抗体のどちらも存在しない。", 0], ["ABO式血液型の抗体は胎盤を通過しやすい。", "誤り。ABO式の抗体はIgM型で胎盤を通過できない。胎盤を通過するのは抗D抗体などのIgG型である。", 0], ["日本人のRh陰性率は約15%である。", "誤り。日本人のRh陰性率は約0.5%にすぎない。約15%は白色人種の値である。", 0]], "z": "A型＝A抗原・抗B抗体、B型＝B抗原・抗A抗体、AB型＝両抗原・抗体なし、O型＝抗原なし・両抗体。ABO式の抗体は生後4か月ごろから自然にできる規則抗体（IgM）。Rh陰性の母親に抗D抗体（IgG）ができると、第二子以降で胎児赤血球の溶血が起こりうる。"}, {"id": "s7-14", "set": 7, "n": 14, "c": "血液", "t": "血液・線維素溶解", "p": "p.124-125", "r": "", "s": "線維素溶解（線溶）で正しいのはどれか。", "neg": false, "two": false, "o": [["トロンビンはプラスミンのはたらきを促進する。", "誤り。トロンビンはプラスミンのはたらきを抑制する。", 0], ["アンチプラスミンはフィブリンの分解を促進する。", "誤り。アンチプラスミンはプラスミンを抑制する因子である。", 0], ["第XIII因子はフィブリンを分解する。", "誤り。第XIII因子（フィブリン安定化因子）は、できたばかりの不安定なフィブリンを安定した網目状にする。", 0], ["組織プラスミノゲン活性化因子（t-PA）はプラスミノゲンを活性化する。", "正しい。t-PAやウロキナーゼがプラスミノゲンをプラスミンに変え、プラスミンがフィブリンを分解する。これらの製剤は血栓を溶かす治療薬に使われる。", 1]], "z": "線溶：プラスミノゲン→（t-PA・ウロキナーゼ、第XIa・XIIa因子で促進）→プラスミン→フィブリンを分解。抑制＝アンチプラスミン・トロンビン。止血の順は 血管収縮→血小板凝集（一次血栓）→血液凝固（二次血栓）→線溶。"}, {"id": "s7-15", "set": 7, "n": 15, "c": "免疫", "t": "免疫・白血球のはたらき", "p": "p.128", "r": "模試 2026問94", "s": "白血球で正しいのはどれか。2つ選べ。", "neg": false, "two": true, "o": [["好中球は血中で数か月生存する。", "誤り。好中球は寿命が短く、血中から10時間以内に組織へ移り、2〜3日で死滅する。数か月生存するのは組織のマクロファージ。", 0], ["単球は組織に移行してマクロファージとなる。", "正しい。単球は血中を約3日循環したのち組織に入り、マクロファージ（肝臓のクッパー細胞、肺胞マクロファージ、脳のミクログリアなど）になる。", 1], ["好塩基球は表面にIgEの受容体をもつ。", "正しい。抗原と結合したIgEが受容体に結合するとヒスタミンを放出し、蕁麻疹やアナフィラキシーなどの即時型アレルギーを起こす。", 1], ["好酸球はヒスタミンを放出してアレルギー反応を強める。", "誤り。好酸球はヒスタミンを不活化してアレルギー反応を抑える。寄生虫と闘い、気管支喘息などで増加する。", 0]], "z": "好中球＝貪食・殺菌（最初に集まる、膿になる）／好酸球＝寄生虫・ヒスタミン不活化／好塩基球＝IgE受容体・ヒスタミン放出／単球→マクロファージ＝貪食・後片付け・抗原提示／リンパ球＝T・B・NK細胞、再循環するのはリンパ球のみ／樹状細胞＝抗原提示。"}, {"id": "s7-16", "set": 7, "n": 16, "c": "骨", "t": "骨Ca・骨の成長", "p": "p.135-138", "r": "", "s": "骨の成長で正しいのはどれか。", "neg": false, "two": false, "o": [["長管骨の長軸方向への成長は、骨膜の骨芽細胞による。", "誤り。長軸方向の成長は成長軟骨（骨端軟骨）が増殖して骨化することによる。骨膜の骨芽細胞は骨を太くする（横径成長）。", 0], ["出生直後の長管骨では骨端部が骨化している。", "誤り。出生直後に骨化しているのは骨幹部（一次骨化中心）で、骨端部は軟骨のままである。骨端核（二次骨化中心）は成長期にできる。", 0], ["エストロゲンは成長軟骨を抑制して身長の増加を抑える。", "正しい。エストロゲンは思春期に骨端線の閉鎖を促し、身長の伸びを止める。同時に骨吸収を抑制し、骨形成を維持する。", 1], ["骨年齢の評価では、男児は女児より1〜2年成長が早い。", "誤り。男児は女児に比べて1〜2年ほど成長が遅い。", 0]], "z": "胎生期＝軟骨→出生直後＝骨幹部が骨化（一次骨化中心）→成長期＝骨端核（二次骨化中心）と成長軟骨→成長後＝成長軟骨が消えて骨端線（骨端線閉鎖）。長軸方向＝成長軟骨、横径＝骨膜の骨芽細胞、形の修正（モデリング）＝破骨細胞。X線は軟骨を透過するので骨年齢を評価できる。"}, {"id": "s7-17", "set": 7, "n": 17, "c": "骨", "t": "骨Ca・血漿カルシウム濃度", "p": "p.137", "r": "模試 2021問95", "s": "成人の血漿カルシウム濃度の正常値に最も近いのはどれか。", "neg": false, "two": false, "o": [["1mg/dL", "誤り。正常値よりはるかに低い。", 0], ["5mg/dL", "誤り。約5mg/dLはタンパク質と結合していない遊離Ca²⁺の濃度である。総カルシウム濃度ではない。", 0], ["10mg/dL", "正しい。血漿カルシウム濃度は9〜10mg/dLに保たれている。", 1], ["20mg/dL", "誤り。正常値の約2倍で、該当しない。", 0]], "z": "血漿Ca＝9〜10mg/dL（うち遊離Ca²⁺は約5mg/dL、残りはアルブミンなどと結合）。上げる＝パラソルモン・活性型ビタミンD、下げる＝カルシトニン。低Ca血症では神経・筋の興奮性が高まりテタニーが起こる。"}, {"id": "s7-18", "set": 7, "n": 18, "c": "循環", "t": "循環・リンパの流れ", "p": "p.127・p.150-151※", "r": "", "s": "リンパで正しいのはどれか。", "neg": false, "two": false, "o": [["右下肢のリンパは右リンパ本幹に注ぐ。", "誤り。右下肢を含む下半身のリンパは乳び槽を経て胸管に集まる。右リンパ本幹が集めるのは右上半身（右上肢・右頭頸部・右胸部）のみ。", 0], ["小腸で吸収された脂肪はリンパを通らない。", "誤り。脂肪はキロミクロンとなって小腸の中心乳び管（リンパ管）に入り、胸管を経て静脈へ運ばれる。", 0], ["リンパ管には弁がない。", "誤り。リンパ管には逆流を防ぐ弁が多数ある。周囲の筋の収縮でリンパが押し流される。", 0], ["胸管は左静脈角に注ぐ。", "正しい。胸管は左内頸静脈と左鎖骨下静脈の合流部（左静脈角）に注ぐ。", 1]], "z": "リンパの流れ：毛細リンパ管→リンパ管（弁あり）→リンパ節→リンパ本幹。右上半身＝右リンパ本幹→右静脈角、それ以外（下半身・左上半身）＝乳び槽→胸管→左静脈角。"}, {"id": "s7-19", "set": 7, "n": 19, "c": "循環", "t": "循環・冠循環", "p": "p.153-154※", "r": "", "s": "冠循環で誤っているのはどれか。", "neg": true, "two": false, "o": [["冠動脈は上行大動脈の起始部から分岐する。", "正しい記述。大動脈弁のすぐ上（バルサルバ洞）から左右の冠動脈が出る。", 0], ["左冠動脈の血流は主に拡張期に流れる。", "正しい記述。収縮期は心筋が血管を圧迫するため、左冠動脈の血流は拡張期に多い。", 0], ["心筋の酸素摂取率は他の臓器より低い。", "誤りの記述（これが正解）。心筋は安静時でも動脈血の酸素の約70%を取り込み、酸素摂取率が非常に高い。そのため酸素需要が増えると冠血流量を増やして対応する。", 1], ["冠静脈血の多くは冠静脈洞を経て右心房に戻る。", "正しい記述。", 0]], "z": "冠循環：安静時に心拍出量の約5%。左冠動脈は拡張期に流れる（頻脈で拡張期が短くなると不利）。酸素摂取率が高いので、需要増には血流量の増加で応じる。冠静脈血→冠静脈洞→右心房。"}, {"id": "s7-20", "set": 7, "n": 20, "c": "呼吸", "t": "呼吸・呼吸筋", "p": "p.160-161※", "r": "", "s": "努力性呼気ではたらく筋はどれか。", "neg": false, "two": false, "o": [["横隔膜", "誤り。横隔膜は安静吸気で最も重要な吸息筋である（収縮して下がり、胸腔を広げる）。", 0], ["内肋間筋", "正しい。内肋間筋は肋骨を引き下げ、腹筋群とともに努力性呼気ではたらく。", 1], ["胸鎖乳突筋", "誤り。胸鎖乳突筋は努力性吸気ではたらく補助吸息筋である。", 0], ["外肋間筋", "誤り。外肋間筋は肋骨を引き上げる吸息筋である。", 0]], "z": "安静吸気＝横隔膜・外肋間筋／安静呼気＝筋はほとんどはたらかない（肺と胸郭の弾性で戻る）／努力性吸気＝胸鎖乳突筋・斜角筋なども加わる／努力性呼気＝内肋間筋・腹筋群（腹直筋・腹斜筋など）。"}, {"id": "s7-21", "set": 7, "n": 21, "c": "呼吸", "t": "呼吸・二酸化炭素の運搬", "p": "p.118・p.168※", "r": "", "s": "血液中の二酸化炭素の運搬で最も多い形態はどれか。", "neg": false, "two": false, "o": [["重炭酸イオン（HCO₃⁻）", "正しい。赤血球内の炭酸脱水酵素によりCO₂＋H₂O→H₂CO₃→H⁺＋HCO₃⁻となり、70〜80%がこの形で運ばれる。", 1], ["ヘモグロビンのグロビンとの結合", "誤り。カルバミノ化合物として運ばれるのは20〜30%程度である。", 0], ["血漿への物理的溶解", "誤り。物理的に溶けて運ばれる二酸化炭素はごくわずか（約10%以下）である。", 0], ["ヘモグロビンのヘム鉄との結合", "誤り。ヘム鉄と結合するのは酸素（や一酸化炭素）であり、二酸化炭素はグロビン部分と結合する。", 0]], "z": "CO₂の運搬：重炭酸イオン70〜80%＞Hb（グロビン）と結合20〜30%＞物理的溶解（わずか）。酸素の運搬はほとんどがHbのヘム鉄と結合。重炭酸イオンは血液のpH緩衝にもはたらく。"}, {"id": "s7-22", "set": 7, "n": 22, "c": "腎", "t": "腎・有効濾過圧の計算", "p": "p.174", "r": "", "s": "糸球体毛細血管圧55mmHg、血漿膠質浸透圧30mmHg、ボウマン嚢内圧15mmHgのとき、有効濾過圧はどれか。", "neg": false, "two": false, "o": [["10mmHg", "正しい。有効濾過圧＝糸球体毛細血管圧−（血漿膠質浸透圧＋ボウマン嚢内圧）＝55−（30＋15）＝10mmHg。", 1], ["40mmHg", "誤り。55−15で、膠質浸透圧を差し引いていない。", 0], ["70mmHg", "誤り。55＋15で、ボウマン嚢内圧を足してしまっている。", 0], ["100mmHg", "誤り。3つの圧をすべて足した値で、意味をもたない。", 0]], "z": "濾過を進める力＝糸球体毛細血管圧。濾過を妨げる力＝血漿膠質浸透圧（血漿タンパク質による）とボウマン嚢内圧。低タンパク血症では膠質浸透圧が下がり濾過が増える。尿路閉塞ではボウマン嚢内圧が上がり濾過が減る。"}, {"id": "s7-23", "set": 7, "n": 23, "c": "代謝", "t": "代謝・特異動的作用", "p": "p.194", "r": "模試 2025問102", "s": "特異動的作用によるエネルギー消費が摂取エネルギーに対して最も大きい栄養素はどれか。", "neg": false, "two": false, "o": [["糖質", "誤り。糖質の特異動的作用は摂取エネルギーの約6%である。", 0], ["脂質", "誤り。脂質の特異動的作用は約4%と最も小さい。", 0], ["タンパク質", "正しい。タンパク質は約30%と最も大きい。アミノ酸の代謝（脱アミノ、尿素合成など）に多くのエネルギーを使うためである。", 1], ["ビタミン", "誤り。ビタミンはエネルギー源とならない。", 0]], "z": "特異動的作用（食事誘発性熱産生）＝食後に代謝が高まり熱が出る現象。タンパク質約30%＞糖質約6%＞脂質約4%、混合食で約10%。食後に体温が上がる理由の1つ。"}, {"id": "s7-24", "set": 7, "n": 24, "c": "消化", "t": "消化・膵液", "p": "p.207-208※", "r": "模試 2020問89", "s": "膵液で正しいのはどれか。", "neg": false, "two": false, "o": [["酸性である。", "誤り。膵液は重炭酸イオン（HCO₃⁻）を多く含む弱アルカリ性で、十二指腸に入った胃酸を中和する。", 0], ["セクレチンは重炭酸イオンに富む膵液の分泌を促進する。", "正しい。胃酸が十二指腸に入ると十二指腸粘膜からセクレチンが分泌され、HCO₃⁻に富む膵液を出させる。消化酵素に富む膵液を出させるのはコレシストキニン（CCK）。", 1], ["トリプシンは活性型のまま分泌される。", "誤り。不活性型のトリプシノーゲンとして分泌され、十二指腸でエンテロキナーゼにより活性化される（膵臓自身の消化を防ぐ）。", 0], ["胆汁酸を含む。", "誤り。胆汁酸は肝臓でつくられる胆汁の成分で、膵液には含まれない。", 0]], "z": "膵液＝弱アルカリ性。消化酵素：アミラーゼ（糖質）、トリプシノーゲン・キモトリプシノーゲン（タンパク質）、リパーゼ（脂質）。分泌刺激：セクレチン→HCO₃⁻、CCK→酵素、副交感神経→分泌促進。胆汁＝胆汁酸・ビリルビン、消化酵素を含まない。"}, {"id": "s7-25", "set": 7, "n": 25, "c": "加齢", "t": "加齢・感覚器の変化", "p": "p.228-230※", "r": "", "s": "加齢に伴う感覚機能の変化で正しいのはどれか。", "neg": false, "two": false, "o": [["高い音から聞こえにくくなる。", "正しい。老人性難聴は蝸牛基底部（高音を受容）の有毛細胞から障害が進むため、高音域から聴力が低下する。", 1], ["暗順応に要する時間が短くなる。", "誤り。加齢により暗順応に時間がかかるようになり、暗い場所での見え方も悪くなる。", 0], ["二点識別閾が小さくなる。", "誤り。触覚の受容器が減るため、二点識別閾は大きくなる（区別しにくくなる）。", 0], ["味覚の閾値が低下する。", "誤り。味蕾の減少などで味覚の閾値は上昇する（濃い味でないと感じにくい）。", 0]], "z": "加齢による感覚の変化：聴覚＝高音域から低下／視覚＝老視（調節力低下）・暗順応の遅れ・水晶体の混濁／体性感覚＝振動覚・二点識別覚の低下／味覚・嗅覚＝閾値上昇。平衡機能が低下し、転倒の一因となる。"}, {"id": "s8-1", "set": 8, "n": 1, "c": "総論", "t": "総論・体液の区分（計算）", "p": "第1章※", "r": "", "s": "体重60kgの成人男性の細胞外液量に最も近いのはどれか。", "neg": false, "two": false, "o": [["3L", "誤り。血漿量（体重の約5％）に相当する値である。", 0], ["9L", "誤り。間質液（組織間液、体重の約15％）に相当する値である。", 0], ["12L", "正しい。成人男性の体液は体重の約60％（36L）で、細胞内液が40％（24L）、細胞外液が20％（12L）である。", 1], ["24L", "誤り。細胞内液（体重の約40％）に相当する値である。", 0]], "z": "体液＝体重の60％（新生児約80％、高齢者約50％、女性は脂肪が多く男性より少ない）。内訳は細胞内液40％、細胞外液20％（間質液15％＋血漿5％）。細胞外液の主な陽イオンはNa⁺、細胞内液はK⁺。"}, {"id": "s8-2", "set": 8, "n": 2, "c": "筋", "t": "筋・サルコメアの構造", "p": "第2章※", "r": "", "s": "骨格筋が収縮するとき長さが変わらないのはどれか。", "neg": true, "two": false, "o": [["A帯", "正しい。A帯はミオシンフィラメントの長さそのものなので、収縮しても長さは変わらない（暗く見えるので暗帯）。", 1], ["H帯", "誤り。H帯はA帯の中央でアクチンが重なっていない部分で、収縮すると短くなり、強く収縮すると消える。", 0], ["I帯", "誤り。I帯はアクチンフィラメントだけの部分で、アクチンがミオシンの間に滑り込むと短くなる（明帯）。", 0], ["サルコメア（筋節）", "誤り。Z線からZ線までの長さで、収縮すると短くなる。", 0]], "z": "滑走説：フィラメント自体の長さは変わらず、アクチンがミオシンの間に滑り込む。短くなる＝I帯・H帯・サルコメア、変わらない＝A帯（およびアクチン・ミオシン各フィラメントの長さ）。"}, {"id": "s8-3", "set": 8, "n": 3, "c": "神経", "t": "神経・化学シナプスの伝達（否定形）", "p": "第3章※", "r": "", "s": "化学シナプスの伝達で誤っているのはどれか。", "neg": true, "two": false, "o": [["シナプス遅延がある。", "正しい記述。伝達物質の放出・拡散・受容体への結合に時間がかかり、1つのシナプスで約0.5msの遅れが生じる。", 0], ["反復刺激で疲労しやすい。", "正しい記述。伝達物質が枯渇するため、神経線維の伝導と違ってシナプスは疲労しやすい。", 0], ["伝達物質の放出は終末へのNa⁺の流入が直接の引き金となる。", "誤り（これが正解）。活動電位が終末に達すると電位依存性Ca²⁺チャネルが開き、流入したCa²⁺がシナプス小胞の開口放出を起こす。", 1], ["興奮は一方向にのみ伝わる。", "正しい記述。伝達物質はシナプス前終末から放出され、受容体はシナプス後膜にあるため、伝達は前から後への一方向に限られる（一方向性伝達）。", 0]], "z": "神経線維の伝導の3原則（両方向性・絶縁性・不減衰）とシナプス伝達の特徴（一方向性・シナプス遅延・易疲労性・薬物や酸素欠乏の影響を受けやすい・加重がある）を対で覚える。開口放出の引き金はCa²⁺。"}, {"id": "s8-4", "set": 8, "n": 4, "c": "神経", "t": "神経・脳波", "p": "第3章※", "r": "", "s": "健康成人が覚醒・安静・閉眼のとき後頭部で優位にみられる脳波はどれか。", "neg": false, "two": false, "o": [["α波", "正しい。8〜13Hzの波で、覚醒・安静・閉眼時に後頭部で優位となる。開眼や暗算で消えてβ波に置き換わる（α波阻止）。", 1], ["δ波", "誤り。4Hz未満の遅い波で、深い睡眠（徐波睡眠）や乳児でみられる。", 0], ["θ波", "誤り。4〜7Hzの波で、浅い睡眠時や小児でみられる。", 0], ["β波", "誤り。14Hz以上の速い波で、開眼時や精神活動時にみられる。", 0]], "z": "速い順にβ（14Hz以上・精神活動）＞α（8〜13Hz・安静閉眼）＞θ（4〜7Hz・浅い睡眠）＞δ（4Hz未満・深い睡眠）。レム睡眠では覚醒時に似た速い低振幅の波となる（逆説睡眠）。"}, {"id": "s8-5", "set": 8, "n": 5, "c": "神経", "t": "神経・大脳皮質の機能局在（組合せ）", "p": "第3章※", "r": "", "s": "大脳皮質の部位と機能の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["上側頭回後部────視覚", "誤り。上側頭回後部はウェルニッケ野で、感覚性言語中枢である。障害されると話せるが理解できない感覚性失語となる。", 0], ["後頭葉────聴覚", "誤り。後頭葉には視覚野がある。聴覚野は側頭葉（横側頭回）。", 0], ["中心前回────体性感覚", "誤り。中心前回は一次運動野である。体性感覚野は中心後回（頭頂葉）。", 0], ["下前頭回後部────運動性言語", "正しい。ブローカ野で、障害されると言葉の理解はできるが話せない運動性失語となる。", 1]], "z": "前頭葉＝一次運動野（中心前回）・ブローカ野／頭頂葉＝体性感覚野（中心後回）／側頭葉＝聴覚野・ウェルニッケ野／後頭葉＝視覚野。運動野・感覚野とも身体部位の対側を支配し、手と顔の領域が広い。"}, {"id": "s8-6", "set": 8, "n": 6, "c": "運動", "t": "運動の生理・反射の中枢", "p": "第4章※", "r": "", "s": "中枢が中脳にある反射はどれか。2つ選べ。", "neg": false, "two": true, "o": [["立ち直り反射", "正しい。傾いた頭や体幹をもとの位置に戻す反射で、中脳が中枢である。", 1], ["緊張性頸反射", "誤り。頸の回旋や屈伸で四肢の筋緊張が変わる反射で、中枢は延髄である。", 0], ["対光反射", "正しい。光で瞳孔が縮む反射で、中脳（視蓋前域・動眼神経副核）が中枢である。", 1], ["膝蓋腱反射", "誤り。伸張反射で、中枢は脊髄（L2〜L4）である。", 0]], "z": "中枢の高さで整理：脊髄＝伸張反射・屈曲反射・交叉性伸展反射／延髄＝緊張性頸反射・緊張性迷路反射（嚥下・咳・嘔吐も延髄）／中脳＝立ち直り反射・対光反射・輻輳反射／大脳皮質＝平衡反応（傾斜反応・ホッピング反応）。"}, {"id": "s8-7", "set": 8, "n": 7, "c": "感覚", "t": "感覚・一次感覚細胞と二次感覚細胞", "p": "p.60-61", "r": "", "s": "二次感覚細胞はどれか。", "neg": false, "two": false, "o": [["パチニ小体", "誤り。パチニ小体は感覚神経の終末を結合組織が層状に包んだもので、神経終末そのものが受容器である。", 0], ["自由神経終末", "誤り。痛覚・温冷覚を受ける感覚神経の終末そのものである。", 0], ["味細胞", "正しい。味細胞と感覚神経終末の間にシナプスがあり、伝達物質で神経に活動電位を起こさせる二次感覚細胞である。", 1], ["嗅細胞", "誤り。嗅細胞は自ら刺激を受け、その軸索が嗅神経となる一次感覚細胞である。", 0]], "z": "二次感覚細胞（受容器と神経の間にシナプスがある）＝内耳の有毛細胞（聴覚・平衡覚）、味細胞、視細胞、メルケル細胞。一次感覚細胞（受容器と神経がひとつづき）＝嗅細胞。神経終末型＝自由神経終末・パチニ小体・マイスネル小体・ルフィニ終末・筋紡錘・ゴルジ腱器官。"}, {"id": "s8-8", "set": 8, "n": 8, "c": "感覚", "t": "感覚・聴覚の仕組み", "p": "p.68-69", "r": "", "s": "聴覚で正しいのはどれか。", "neg": false, "two": false, "o": [["基底膜は蝸牛頂に近いほど狭い。", "誤り。基底膜は前庭窓に近い基部ほど狭く、蝸牛頂に近いほど広い。", 0], ["鼓膜と前庭窓の面積比と耳小骨のてこ比により、音圧は約22倍に増幅される。", "正しい。面積比約17：1とてこ比約1.3：1を掛け合わせて約22倍になる。", 1], ["蝸牛管は外リンパで満たされている。", "誤り。蝸牛管は内リンパ（K⁺に富む）、前庭階と鼓室階は外リンパで満たされる。", 0], ["高い音ほど蝸牛頂に近い部位の基底膜が大きく振動する。", "誤り。高い音は狭くて硬い基部側、低い音は広い蝸牛頂側で大きく振動する。", 0]], "z": "可聴域は20〜20,000Hz、会話は250〜4,000Hz。外耳道は約2.5cm、蝸牛は2と3/4回転。音を脳へ伝えるのは内有毛細胞（1列）、外有毛細胞（3〜5列）は振動を調節・増幅する。老人性難聴が高音から始まるのは基部の有毛細胞から障害されるため。"}, {"id": "s8-9", "set": 8, "n": 9, "c": "内分", "t": "内分泌・ホルモンの化学的分類", "p": "p.86", "r": "", "s": "ステロイドホルモンはどれか。2つ選べ。", "neg": false, "two": true, "o": [["甲状腺ホルモン", "誤り。チロシンからつくられるアミノ酸誘導体ホルモンである。ただし脂溶性で、ステロイドと同じく核内受容体に結合する。", 0], ["アルドステロン", "正しい。副腎皮質の球状層から分泌されるミネラルコルチコイドで、コレステロールからつくられるステロイドホルモンである。", 1], ["バソプレシン", "誤り。アミノ酸9個からなるペプチドホルモンである。", 0], ["プロゲステロン", "正しい。卵巣（黄体）や胎盤から分泌される性ホルモンで、ステロイドホルモンである。", 1]], "z": "アミノ酸誘導体＝カテコールアミン（アドレナリン・ノルアドレナリン）、甲状腺ホルモン、メラトニン／ペプチド＝視床下部・下垂体のホルモン、インスリン、グルカゴン、PTH、カルシトニンなど大部分／ステロイド（コレステロールから）＝副腎皮質ホルモンと性ホルモン（＋活性型ビタミンD）。"}, {"id": "s8-10", "set": 8, "n": 10, "c": "内分", "t": "内分泌・バソプレシン", "p": "p.92", "r": "", "s": "バソプレシンで正しいのはどれか。", "neg": false, "two": false, "o": [["集合管での水の再吸収を抑制する。", "誤り。集合管での水の再吸収を促進し、尿を濃く少なくする（抗利尿作用）。", 0], ["下垂体前葉で合成される。", "誤り。視床下部（視索上核・室傍核）の神経細胞でつくられ、軸索を通って下垂体後葉から放出される（神経分泌）。", 0], ["血漿浸透圧が上昇すると分泌が増加する。", "正しい。発汗・嘔吐などで体液の浸透圧が上がったときや、出血で血液量が減ったときに分泌が増える。", 1], ["分娩時に子宮筋を収縮させる。", "誤り。オキシトシンの作用である。オキシトシンは射乳反射も起こす。", 0]], "z": "下垂体後葉＝バソプレシン（抗利尿ホルモン、大量で細動脈収縮→血圧上昇）とオキシトシン（子宮収縮・射乳）。どちらも視床下部でつくられる。バソプレシン不足は尿崩症（多量の薄い尿）。"}, {"id": "s8-11", "set": 8, "n": 11, "c": "内分", "t": "内分泌・低血糖時の反応（否定形）", "p": "p.100-101", "r": "", "s": "低血糖時に分泌が増加しないのはどれか。", "neg": true, "two": false, "o": [["インスリン", "分泌が低下する（これが正解）。インスリンは唯一の血糖低下ホルモンで、低血糖時には分泌が抑えられ、組織でのグルコース利用が制限される。", 1], ["アドレナリン", "分泌が増加する。交感神経が活性化して副腎髄質から放出され、肝グリコーゲンの分解を促す。", 0], ["コルチゾル", "分泌が増加する。肝臓での糖新生を促して血糖を上げる。", 0], ["グルカゴン", "分泌が増加する。膵島A細胞から分泌され、肝臓のグリコーゲン分解と糖新生で血糖を上げる。", 0]], "z": "血糖を上げる＝グルカゴン・アドレナリン・コルチゾル・成長ホルモン・甲状腺ホルモン。下げる＝インスリンのみ（骨格筋・脂肪組織・心筋ではGLUT4を細胞膜へ移動させて取り込みを促す）。"}, {"id": "s8-12", "set": 8, "n": 12, "c": "生殖", "t": "生殖・ヒト絨毛性ゴナドトロピン", "p": "第7章※", "r": "", "s": "ヒト絨毛性ゴナドトロピン（hCG）で正しいのはどれか。", "neg": false, "two": false, "o": [["下垂体前葉から分泌される。", "誤り。胎盤の絨毛（栄養膜合胞体層）から分泌される。", 0], ["妊娠末期に分泌量が最大となる。", "誤り。妊娠8〜10週ころに最大となり、その後は減る。黄体の役割が胎盤に移るためである。", 0], ["妊娠初期に黄体を維持する。", "正しい。黄体を妊娠黄体として維持し、プロゲステロンとエストロゲンの分泌を続けさせる。妊娠検査薬は尿中のhCGを検出している。", 1], ["乳汁を射出させる。", "誤り。乳汁の射出はオキシトシン、乳汁の産生はプロラクチンの作用である。", 0]], "z": "胎盤のホルモン＝hCG（初期に黄体維持）、hPL（ヒト胎盤性ラクトゲン：母体の血糖を上げ胎児へ糖を回す）、エストロゲン、プロゲステロン（妊娠中期以降は胎盤が主な産生部位）。"}, {"id": "s8-13", "set": 8, "n": 13, "c": "血液", "t": "血液・赤血球", "p": "第8章※", "r": "", "s": "赤血球で正しいのはどれか。", "neg": false, "two": false, "o": [["核をもつ。", "誤り。ヒトの成熟赤血球は核もミトコンドリアももたない。そのため解糖系だけでATPをつくる。", 0], ["寿命は約120日である。", "正しい。古くなった赤血球は主に脾臓で壊され、ヘモグロビンはビリルビンへと代謝される。", 1], ["産生はトロンボポエチンで促進される。", "誤り。赤血球の産生を促すのは腎臓から分泌されるエリスロポエチンである。トロンボポエチンは血小板の産生を促す。", 0], ["成人では主に脾臓でつくられる。", "誤り。成人では骨髄（胸骨・椎骨・骨盤などの扁平骨の赤色骨髄）でつくられる。脾臓は壊す場所。", 0]], "z": "赤血球＝無核・両凹円板・寿命約120日・男性約500万/μL、女性約450万/μL・エリスロポエチン（腎）で産生促進。白血球＝有核・4,000〜9,000/μL。血小板＝無核・寿命約10日・15万〜40万/μL・トロンボポエチン（肝）で産生促進。"}, {"id": "s8-14", "set": 8, "n": 14, "c": "免疫", "t": "免疫・アレルギーの型（組合せ）", "p": "第8章※", "r": "", "s": "アレルギーの型と代表例の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["Ⅱ型────ツベルクリン反応", "誤り。ツベルクリン反応はT細胞が関与するⅣ型（遅延型）である。", 0], ["Ⅰ型────花粉症", "正しい。IgEが肥満細胞に結合し、抗原が来るとヒスタミンが放出される即時型反応である。アナフィラキシー、気管支喘息、じんま疹も同じ型。", 1], ["Ⅲ型────アナフィラキシー", "誤り。アナフィラキシーはⅠ型である。Ⅲ型は免疫複合体が組織に沈着する型で、糸球体腎炎や全身性エリテマトーデスが代表例。", 0], ["Ⅳ型────自己免疫性溶血性貧血", "誤り。自分の赤血球に抗体が結合して壊すのはⅡ型（細胞傷害型）である。不適合輸血もⅡ型。", 0]], "z": "Ⅰ型＝IgE・肥満細胞（花粉症・アナフィラキシー）／Ⅱ型＝IgG・IgMと補体による細胞傷害（不適合輸血・溶血性貧血）／Ⅲ型＝免疫複合体（糸球体腎炎・SLE）／Ⅳ型＝T細胞・遅延型（ツベルクリン反応・接触皮膚炎）。Ⅰ〜Ⅲ型は抗体、Ⅳ型だけが細胞性免疫。"}, {"id": "s8-15", "set": 8, "n": 15, "c": "骨", "t": "骨Ca・骨の細胞とホルモン", "p": "p.94、99", "r": "", "s": "骨とカルシウムの調節で正しいのはどれか。", "neg": false, "two": false, "o": [["骨芽細胞は骨を吸収する。", "誤り。骨芽細胞は骨をつくる（骨形成）。骨を壊して吸収するのは破骨細胞である。", 0], ["パラソルモンは血中Ca²⁺濃度を低下させる。", "誤り。パラソルモンは骨吸収を進め、血中Ca²⁺濃度を上昇させる。分泌は血中Ca²⁺の低下で増える。", 0], ["エストロゲンが減少すると骨吸収が抑制される。", "誤り。エストロゲンは骨吸収を抑えているため、閉経後に減ると骨吸収が進み骨粗鬆症が増える。", 0], ["カルシトニンは破骨細胞の活動を抑制する。", "正しい。骨吸収を抑えて血中Ca²⁺濃度を下げる。分泌は血中Ca²⁺の上昇で増える。", 1]], "z": "血中Ca²⁺を上げる＝パラソルモン（副甲状腺）・活性型ビタミンD（腸からの吸収促進）／下げる＝カルシトニン（甲状腺C細胞）。骨形成＝骨芽細胞、骨吸収＝破骨細胞、骨のリモデリングで両者が釣り合う。"}, {"id": "s8-16", "set": 8, "n": 16, "c": "循環", "t": "循環・心電図（否定形）", "p": "p.142", "r": "", "s": "心電図で誤っているのはどれか。", "neg": true, "two": false, "o": [["P波は心房の脱分極を示す。", "正しい記述。左右の心房筋が脱分極するときに生じる。", 0], ["T波は心室の再分極を示す。", "正しい記述。心室が再分極する過程を示す。", 0], ["QRS波は心室の脱分極を示す。", "正しい記述。心室の脱分極で生じる。心房の再分極はQRS波に隠れて見えない。", 0], ["PQ時間は心室内の伝導時間を示す。", "誤り（これが正解）。PQ（PR）時間はP波の始まりからQRS波の始まりまでで、房室伝導に要する時間を示す。心室内の伝導時間を示すのはQRS幅である。", 1]], "z": "PQ時間＝房室伝導時間（延長すると房室ブロック）／QRS幅＝心室内伝導時間／ST部分＝心室全体が興奮している時期（心筋梗塞で上昇）／QT時間＝心室の脱分極開始から再分極終了まで。通常は10mm＝1mV、25mm＝1秒で記録し、第Ⅱ誘導が基準。"}, {"id": "s8-17", "set": 8, "n": 17, "c": "循環", "t": "循環・心音", "p": "p.144-145", "r": "", "s": "心音で正しいのはどれか。", "neg": false, "two": false, "o": [["Ⅰ音は房室弁の閉鎖で生じる。", "正しい。心室の収縮が始まり心室内圧が上がると、房室弁（僧帽弁・三尖弁）が閉じてⅠ音が生じる。", 1], ["Ⅰ音は等容性弛緩期の始まりに生じる。", "誤り。Ⅰ音は等容性収縮期の始まりに生じる。等容性弛緩期の始まりに生じるのはⅡ音。", 0], ["Ⅱ音は房室弁の開放で生じる。", "誤り。Ⅱ音は半月弁（大動脈弁・肺動脈弁）の閉鎖で生じる。弁が開くときには通常音は出ない。", 0], ["Ⅱ音は心電図のP波とほぼ同時に生じる。", "誤り。Ⅱ音は心室の再分極が終わるころ、T波の終わり付近で生じる。Ⅰ音はQRS波の直後。", 0]], "z": "Ⅰ音＝房室弁閉鎖・等容性収縮期の始まり・QRS直後・低く長い／Ⅱ音＝半月弁閉鎖・等容性弛緩期の始まり・T波の終わり・高く短い。房室弁が開くのは充満期のみ、半月弁が開くのは駆出期のみで、等容性収縮期と等容性弛緩期は両方とも閉じている。"}, {"id": "s8-18", "set": 8, "n": 18, "c": "循環", "t": "循環・心拍出量（計算）", "p": "p.153", "r": "", "s": "拡張期末容量120mL、収縮期末容量50mL、心拍数70回/分のとき、心拍出量に最も近いのはどれか。", "neg": false, "two": false, "o": [["3.5L/分", "誤り。収縮期末容量50mLに心拍数を掛けた値で、意味をもたない。", 0], ["4.9L/分", "正しい。1回拍出量＝拡張期末容量−収縮期末容量＝120−50＝70mL。心拍出量＝70mL×70回/分＝4,900mL/分≒4.9L/分。", 1], ["8.4L/分", "誤り。拡張期末容量120mLをそのまま1回拍出量として計算している。", 0], ["11.9L/分", "誤り。2つの容量を足して計算している。", 0]], "z": "1回拍出量＝拡張期末容量−収縮期末容量。心拍出量＝1回拍出量×心拍数（安静時約5L/分、運動時は5倍程度まで）。動脈圧＝心拍出量×総末梢血管抵抗。駆出率＝1回拍出量÷拡張期末容量（この例では約58％）。"}, {"id": "s8-19", "set": 8, "n": 19, "c": "呼吸", "t": "呼吸・ヘーリング－ブロイエル反射", "p": "第11章※", "r": "", "s": "ヘーリング－ブロイエル反射で正しいのはどれか。", "neg": false, "two": false, "o": [["求心路は舌咽神経である。", "誤り。求心路は迷走神経である。舌咽神経は頸動脈洞・頸動脈小体からの情報を伝える。", 0], ["吸息を促進する。", "誤り。肺がふくらむと吸息を抑えて呼息へ切り替える（肺伸展反射）。吸息が深くなりすぎるのを防ぐ。", 0], ["中枢は大脳皮質にある。", "誤り。中枢は延髄・橋の呼吸中枢である。", 0], ["肺の伸展受容器が受容器となる。", "正しい。気管支・細気管支の平滑筋にある伸展受容器が、肺がふくらんだことを感知する。", 1]], "z": "呼吸の調節：中枢化学受容器（延髄、CO₂・H⁺に反応）、末梢化学受容器（頸動脈小体→舌咽神経、大動脈小体→迷走神経、主にO₂低下に反応）、肺伸展受容器（迷走神経、ヘーリング－ブロイエル反射）。呼吸のリズムは延髄でつくられ、橋がこれを調整する。"}, {"id": "s8-20", "set": 8, "n": 20, "c": "呼吸", "t": "呼吸・肺胞換気量（計算）", "p": "第11章※", "r": "", "s": "1回換気量500mL、死腔量150mL、呼吸数12回/分のとき、肺胞換気量はどれか。", "neg": false, "two": false, "o": [["1,800mL/分", "誤り。死腔量150mLに呼吸数を掛けた値で、死腔換気量である。", 0], ["4,200mL/分", "正しい。肺胞換気量＝（1回換気量−死腔量）×呼吸数＝（500−150）×12＝4,200mL/分。", 1], ["6,000mL/分", "誤り。1回換気量×呼吸数で、分時換気量である。死腔量を差し引いていない。", 0], ["7,800mL/分", "誤り。1回換気量に死腔量を足して計算している。", 0]], "z": "分時換気量＝1回換気量×呼吸数。肺胞換気量＝（1回換気量−死腔量）×呼吸数。分時換気量が同じでも、浅く速い呼吸は死腔の割合が増えて肺胞換気量が減る。解剖学的死腔は約150mL（体重1ポンドあたり1mLが目安）。"}, {"id": "s8-21", "set": 8, "n": 21, "c": "腎", "t": "腎・排尿の神経支配", "p": "第12章※", "r": "", "s": "排尿で正しいのはどれか。", "neg": false, "two": false, "o": [["排尿反射の中枢は腰髄にある。", "誤り。脊髄の排尿中枢は仙髄（S2〜S4）にある。さらに上位の橋の排尿中枢と大脳皮質が調節する。", 0], ["内尿道括約筋は随意的に調節できる。", "誤り。内尿道括約筋は平滑筋で不随意である。随意的に締められるのは横紋筋の外尿道括約筋（陰部神経支配）。", 0], ["交感神経の興奮は膀胱排尿筋を収縮させる。", "誤り。交感神経（下腹神経）は排尿筋をゆるめ内尿道括約筋を締めて、尿をためる方向にはたらく（蓄尿）。", 0], ["排尿時、膀胱排尿筋は骨盤神経の興奮で収縮する。", "正しい。骨盤神経（副交感神経）が膀胱排尿筋を収縮させ、内尿道括約筋をゆるめて排尿を起こす。", 1]], "z": "蓄尿＝交感神経（下腹神経）：排尿筋弛緩・内尿道括約筋収縮＋陰部神経：外尿道括約筋収縮。排尿＝副交感神経（骨盤神経）：排尿筋収縮・内尿道括約筋弛緩＋陰部神経の抑制。膀胱容量は成人で約300〜500mL。"}, {"id": "s8-22", "set": 8, "n": 22, "c": "代謝", "t": "代謝・ATPの産生", "p": "第13章※", "r": "", "s": "ATPの産生で正しいのはどれか。", "neg": false, "two": false, "o": [["解糖系はミトコンドリアで行われる。", "誤り。解糖系は細胞質（細胞質基質）で行われる。", 0], ["解糖系は酸素を必要とする。", "誤り。解糖系は酸素を使わずにグルコースをピルビン酸まで分解する。酸素が足りないとピルビン酸は乳酸になる。", 0], ["グルコースの分解で最も多くのATPをつくるのは電子伝達系である。", "正しい。ミトコンドリア内膜の電子伝達系（酸化的リン酸化）で、グルコース1分子あたりのATPの大部分がつくられる。", 1], ["クエン酸回路は細胞質で行われる。", "誤り。クエン酸回路（TCA回路）はミトコンドリアのマトリックスで行われる。", 0]], "z": "グルコース1分子から：解糖系（細胞質・酸素不要）2ATP→クエン酸回路（ミトコンドリアのマトリックス）2ATP→電子伝達系（ミトコンドリア内膜・酸素が必要）約34ATP、合計約38ATP（現在は約30〜32とする説もある）。"}, {"id": "s8-23", "set": 8, "n": 23, "c": "消化", "t": "消化・嚥下の3期", "p": "第14章※", "r": "", "s": "嚥下で正しいのはどれか。", "neg": false, "two": false, "o": [["食道期の中枢は大脳皮質にある。", "誤り。咽頭期・食道期は反射で行われ、嚥下中枢は延髄にある。食道期は蠕動運動で食塊を胃へ送る。", 0], ["咽頭期には軟口蓋が挙上して鼻腔への通路をふさぐ。", "正しい。軟口蓋が上がって鼻咽腔を閉じ、喉頭蓋が気道をふさいで、食塊が食道へ送られる。", 1], ["口腔期は不随意運動である。", "誤り。口腔期（舌で食塊を咽頭へ送る時期）は随意運動である。", 0], ["咽頭期には呼吸が促進される。", "誤り。咽頭期には呼吸が反射的に一時停止する（嚥下性無呼吸）。誤嚥を防ぐしくみである。", 0]], "z": "第1期 口腔期（随意）→第2期 咽頭期（不随意・嚥下反射：軟口蓋挙上、喉頭挙上、喉頭蓋で気道閉鎖、呼吸停止）→第3期 食道期（不随意・蠕動）。嚥下中枢は延髄。"}, {"id": "s8-24", "set": 8, "n": 24, "c": "体温", "t": "体温・発熱（否定形）", "p": "第15章※", "r": "", "s": "発熱で誤っているのはどれか。", "neg": true, "two": false, "o": [["解熱期には発汗がみられる。", "正しい記述。設定温度が下がると体温が高すぎる状態になり、発汗と皮膚血管拡張で熱を逃がす。", 0], ["体温調節中枢の設定温度（セットポイント）が上昇する。", "正しい記述。発熱物質（プロスタグランジンE₂など）が視床下部の設定温度を引き上げる。", 0], ["体温上昇期には悪寒やふるえが起こる。", "正しい記述。体温が新しい設定温度より低いため、寒さを感じてふるえ（熱産生）と皮膚血管収縮（熱放散の抑制）が起こる。", 0], ["うつ熱と同じしくみで起こる。", "誤り（これが正解）。うつ熱は設定温度は正常のまま、熱放散が熱産生に追いつかずに体温が上がる状態（熱中症など）。発熱は設定温度そのものが上がる。", 1]], "z": "発熱＝設定温度の上昇（解熱薬はプロスタグランジンの合成を抑えて効く）。うつ熱＝設定温度は正常で放散が不足（解熱薬は効かず、冷却が必要）。"}, {"id": "s8-25", "set": 8, "n": 25, "c": "加齢", "t": "加齢・呼吸循環機能の変化", "p": "第16章 p.223〜※", "r": "", "s": "加齢に伴う呼吸・循環機能の変化で正しいのはどれか。", "neg": false, "two": false, "o": [["残気量が増加する。", "正しい。肺の弾性が低下し、気道が早く閉じるため息を吐ききれず、残気量が増える。1秒率は低下する。", 1], ["圧受容器反射の感度が高まる。", "誤り。圧受容器反射の感度は低下する。そのため立ち上がったときに血圧を保てず、起立性低血圧を起こしやすい。", 0], ["拡張期血圧が上昇し、脈圧が小さくなる。", "誤り。動脈壁が硬くなるため収縮期血圧が上がり、拡張期血圧は変わらないか下がる。そのため脈圧は大きくなる（収縮期高血圧）。", 0], ["肺活量が増加する。", "誤り。肺の弾性低下と呼吸筋の筋力低下で肺活量は減少する。全肺気量はほぼ変わらず、その分残気量が増える。", 0]], "z": "呼吸：肺の弾性↓・肺活量↓・1秒率↓・残気量↑・動脈血酸素分圧↓。循環：動脈硬化で収縮期血圧↑・脈圧↑、左心室壁は肥厚、安静時の心拍数と心拍出量はほぼ変わらず運動時の最大心拍数は低下（220−年齢）、圧受容器反射↓で起立性低血圧。"}, {"id": "s9-1", "set": 9, "n": 1, "c": "総論", "t": "総論・浸透圧と等張液", "p": "第1章※", "r": "", "s": "血漿とほぼ等張の溶液はどれか。", "neg": false, "two": false, "o": [["10％ブドウ糖液", "誤り。高張である。等張となるブドウ糖液は5％。", 0], ["3％食塩水", "誤り。高張である。赤血球を入れると水が出ていき縮む。", 0], ["0.45％食塩水", "誤り。生理食塩水の半分の濃度で低張である。赤血球を入れると水が入り込んで膨らみ、溶血する。", 0], ["0.9％食塩水", "正しい。生理食塩水で、血漿とほぼ等しい浸透圧（約290mOsm/kg）をもつ。", 1]], "z": "血漿浸透圧は約285〜290mOsm/kgで、主にNa⁺とCl⁻で決まる。等張液＝0.9％食塩水・5％ブドウ糖液。低張液では赤血球に水が入って溶血、高張液では水が出て縮む。血漿タンパク質による浸透圧（膠質浸透圧）は約25mmHgとわずかだが、毛細血管で水を血管内へ引き戻す。"}, {"id": "s9-2", "set": 9, "n": 2, "c": "筋", "t": "筋・収縮のエネルギー供給", "p": "第2章※", "r": "", "s": "筋収縮のエネルギー供給で正しいのはどれか。", "neg": false, "two": false, "o": [["クレアチンリン酸はADPからATPを再合成する。", "正しい。クレアチンリン酸のリン酸をADPに渡してすばやくATPをつくる（ATP-CP系）。短距離走など数秒の全力運動を支える。", 1], ["無酸素的な解糖では乳酸は生じない。", "誤り。酸素が不足するとピルビン酸が乳酸に変わる。", 0], ["有酸素系は最も速くATPを供給できる。", "誤り。有酸素系は単位時間あたりの供給は最も遅いが、長時間にわたり大量のATPをつくれる。", 0], ["筋に蓄えられたATPだけで数分間の運動を続けられる。", "誤り。筋内のATPの量はわずかで、全力運動では数秒で使い切る。", 0]], "z": "ATP供給の速さ：ATP-CP系＞解糖系（乳酸系）＞有酸素系。持続時間はその逆。全力運動の目安はATP-CP系で約10秒、解糖系を加えて約30〜40秒、それ以上は有酸素系が中心。"}, {"id": "s9-3", "set": 9, "n": 3, "c": "神経", "t": "神経・副交感神経線維を含む脳神経", "p": "第3章※", "r": "", "s": "副交感神経線維を含む脳神経はどれか。2つ選べ。", "neg": false, "two": true, "o": [["動眼神経", "正しい。瞳孔括約筋と毛様体筋を支配し、縮瞳と遠近調節（近くを見る）を起こす。", 1], ["三叉神経", "誤り。顔面の感覚と咀嚼筋の運動を担い、副交感神経線維はもたない。", 0], ["副神経", "誤り。胸鎖乳突筋と僧帽筋を支配する運動神経で、副交感神経線維はもたない。", 0], ["舌咽神経", "正しい。耳下腺の分泌を支配する副交感神経線維を含む。", 1]], "z": "副交感神経を含む脳神経は4つ：動眼神経（Ⅲ：縮瞳・調節）、顔面神経（Ⅶ：涙腺・顎下腺・舌下腺）、舌咽神経（Ⅸ：耳下腺）、迷走神経（Ⅹ：胸腹部内臓）。仙髄（S2〜S4）からの骨盤神経とあわせて頭仙系と呼ぶ。"}, {"id": "s9-4", "set": 9, "n": 4, "c": "神経", "t": "神経・視床下部の中枢（否定形）", "p": "第3章※", "r": "", "s": "視床下部に中枢がないのはどれか。", "neg": true, "two": false, "o": [["摂食中枢", "視床下部（外側野）にある。満腹中枢は腹内側核にある。", 0], ["体温調節中枢", "視床下部にある。前部が熱放散、後部が熱産生の調節にかかわる。", 0], ["呼吸中枢", "視床下部にはない（これが正解）。呼吸中枢は延髄と橋にある。", 1], ["飲水中枢（渇中枢）", "視床下部にある。浸透圧受容器が血漿浸透圧の上昇を感知し、のどの渇きとバソプレシン分泌を起こす。", 0]], "z": "視床下部＝自律神経と内分泌の最高中枢：体温調節、摂食・満腹、飲水、下垂体ホルモンの調節、概日リズム（視交叉上核）、情動行動。延髄＝呼吸・心臓血管・嚥下・嘔吐・咳・くしゃみの中枢。"}, {"id": "s9-5", "set": 9, "n": 5, "c": "神経", "t": "神経・交感神経の作用（否定形）", "p": "第3章※", "r": "", "s": "交感神経の興奮で起こらないのはどれか。", "neg": true, "two": false, "o": [["心拍数の増加", "起こる。洞房結節にはたらき心拍数を増やす（正の変時作用）。収縮力も増す（正の変力作用）。", 0], ["瞳孔散大", "起こる。瞳孔散大筋が収縮する。", 0], ["消化管運動の促進", "起こらない（これが正解）。交感神経は消化管の運動と分泌を抑える。促進するのは副交感神経である。", 1], ["気管支拡張", "起こる。気管支平滑筋がゆるみ（β₂受容体）、空気が通りやすくなる。", 0]], "z": "交感神経＝闘争と逃走：散瞳・心拍数と収縮力の増加・気管支拡張・血糖上昇・消化管運動抑制・発汗（汗腺だけはコリン作動性）・膀胱排尿筋弛緩。副交感神経＝休息と消化：縮瞳・心拍数減少・気管支収縮・消化管運動と分泌の促進・排尿筋収縮。"}, {"id": "s9-6", "set": 9, "n": 6, "c": "運動", "t": "運動の生理・ゴルジ腱器官", "p": "第4章※", "r": "", "s": "ゴルジ腱器官で正しいのはどれか。", "neg": false, "two": false, "o": [["筋線維と直列に配置されている。", "正しい。筋と腱の移行部にあり、筋線維と直列に並ぶため、筋が発生する張力を感知できる。", 1], ["Ia群線維で中枢へ情報を伝える。", "誤り。ゴルジ腱器官はIb群線維で伝える。Ia群線維は筋紡錘からの線維である。", 0], ["興奮すると同じ筋の収縮を促す。", "誤り。介在ニューロンを介して同じ筋（同名筋）を抑制する（Ib抑制、自原抑制）。過大な張力から筋や腱を守るしくみである。", 0], ["筋の長さを感知する。", "誤り。筋の張力を感知する。筋の長さ（伸張）を感知するのは、筋線維と並列に並ぶ筋紡錘である。", 0]], "z": "筋紡錘＝筋線維と並列・長さを感知・Ia（とⅡ）群線維・同名筋を興奮させる（伸張反射）・γ運動ニューロンで感度を調節。ゴルジ腱器官＝筋線維と直列・張力を感知・Ib群線維・同名筋を抑制（Ib抑制）。"}, {"id": "s9-7", "set": 9, "n": 7, "c": "感覚", "t": "感覚・皮膚の感覚受容器", "p": "p.74-75", "r": "", "s": "皮膚の感覚受容器で正しいのはどれか。", "neg": false, "two": false, "o": [["メルケル触盤は順応が速い。", "誤り。メルケル触盤は遅順応型で、持続する皮膚の変形（触覚・圧覚）を伝える。", 0], ["パチニ小体は振動を受容し、順応が非常に速い。", "正しい。結合組織が玉ねぎ状に何十層も包んでおり、圧の変化（振動）にだけ反応してすぐ順応する。", 1], ["ルフィニ終末は振動を受容し、順応が速い。", "誤り。ルフィニ終末は皮膚の変形（引き伸ばし）を受容する遅順応型である。", 0], ["痛覚はマイスネル小体で受容される。", "誤り。痛覚は自由神経終末（侵害受容器）で受容される。マイスネル小体は速順応型で、粗い振動や接触を受容する。", 0]], "z": "速順応＝マイスネル小体（粗い振動・接触）、パチニ小体（振動、非常に速い）、毛包受容器。遅順応＝メルケル触盤（触圧）、ルフィニ終末（皮膚の変形）。温覚・冷覚・痛覚＝自由神経終末（温度受容にはTRPチャネルがかかわる）。"}, {"id": "s9-8", "set": 9, "n": 8, "c": "感覚", "t": "感覚・痛覚", "p": "p.79-81", "r": "", "s": "痛覚で正しいのはどれか。", "neg": false, "two": false, "o": [["刺す痛み（一次痛）はC線維で伝えられる。", "誤り。鋭く局在のはっきりした刺す痛みは、伝導の速いAδ線維で伝えられる。C線維は鈍く長く続く灼けつく痛み（二次痛）を伝える。", 0], ["痛覚は同側の脊髄後索を上行する。", "誤り。痛覚の線維は脊髄で中継されたあと交叉し、対側の前側索（脊髄視床路）を上行する。", 0], ["痛覚は順応しやすい。", "誤り。痛覚はほかの感覚と違ってほとんど順応しない。刺激が繰り返されるとむしろ痛覚過敏が起こる。", 0], ["関連痛は、内臓と同じ高さの脊髄に入る皮膚分節に現れる。", "正しい。たとえば狭心症では、胸だけでなく左腕の内側にも痛みを感じる。", 1]], "z": "一次痛（刺す痛み）＝Aδ線維・局在明確・すぐ消える。二次痛（灼けつく痛み）＝C線維・局在不明瞭・長く続く。深部痛では骨膜が最も敏感。管状の内臓は切っても痛まないが、強い収縮・伸展で疝痛が起こる。発痛物質＝ブラジキニン、セロトニン、ヒスタミン、K⁺（プロスタグランジンは感受性を高める）。"}, {"id": "s9-9", "set": 9, "n": 9, "c": "内分", "t": "内分泌・副腎皮質の層（組合せ）", "p": "p.94-95", "r": "", "s": "副腎皮質の層と分泌されるホルモンの組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["網状層────アルドステロン", "誤り。網状層は少量の性ホルモン（副腎アンドロゲン）を分泌する。", 0], ["束状層────コルチゾル", "正しい。束状層はグルココルチコイドを分泌し、その代表がコルチゾルである。", 1], ["網状層────アドレナリン", "誤り。アドレナリンは副腎髄質から分泌される。", 0], ["球状層────コルチゾル", "誤り。球状層はミネラルコルチコイド（アルドステロン）を分泌する。", 0]], "z": "外から「球・束・網」＝「塩・糖・性」：球状層＝ミネラルコルチコイド（アルドステロン：Na⁺再吸収・K⁺排泄）、束状層＝グルココルチコイド（コルチゾル：糖新生・抗炎症、早朝に高い日内変動）、網状層＝性ホルモン。髄質＝アドレナリン・ノルアドレナリン。"}, {"id": "s9-10", "set": 9, "n": 10, "c": "内分", "t": "内分泌・レニン－アンジオテンシン－アルドステロン系", "p": "p.99-100", "r": "", "s": "レニン－アンジオテンシン－アルドステロン系で正しいのはどれか。", "neg": false, "two": false, "o": [["アンジオテンシンⅡは血管を拡張させる。", "誤り。アンジオテンシンⅡは血管平滑筋を強く収縮させ血圧を上げる。あわせて副腎皮質からアルドステロンを分泌させる。", 0], ["アルドステロンは腎臓でのK⁺の再吸収を促進する。", "誤り。アルドステロンはNa⁺の再吸収とK⁺の排泄を促進する。", 0], ["アンジオテンシンⅠをⅡに変える酵素は肺に多い。", "正しい。アンジオテンシン変換酵素（ACE）は肺の血管内皮などに多く、アンジオテンシンⅠをⅡに変換する。", 1], ["レニンは副腎皮質から分泌される。", "誤り。レニンは腎臓の傍糸球体細胞から分泌される。血圧低下や腎交感神経の興奮で分泌が増える。", 0]], "z": "血圧低下→腎の傍糸球体細胞からレニン→アンジオテンシノーゲン（肝臓でつくられる）をアンジオテンシンⅠに→ACE（肺）でアンジオテンシンⅡ→①血管収縮 ②アルドステロン分泌→Na⁺と水の保持→細胞外液量増加→血圧上昇。"}, {"id": "s9-11", "set": 9, "n": 11, "c": "生殖", "t": "生殖・性分化", "p": "第7章※", "r": "", "s": "性分化で正しいのはどれか。", "neg": false, "two": false, "o": [["精巣から分泌される抗ミュラー管ホルモンがミュラー管を退縮させる。", "正しい。セルトリ細胞から分泌される抗ミュラー管ホルモンでミュラー管が退縮し、テストステロンでウォルフ管が発達する。", 1], ["男性ではミュラー管が精管になる。", "誤り。精管・精巣上体・精嚢になるのはウォルフ管である。ミュラー管は女性で卵管・子宮・膣上部になる。", 0], ["外性器はエストロゲンの作用で男性型になる。", "誤り。外性器を男性型にするのはアンドロゲン（テストステロンから変換されるジヒドロテストステロン）である。アンドロゲンがなければ女性型になる。", 0], ["Y染色体がないと精巣が形成される。", "誤り。Y染色体上のSRY遺伝子がはたらくと未分化性腺が精巣になる。Y染色体がなければ卵巣になる。", 0]], "z": "基本形は女性型。男性化には①SRY（精巣の形成）②抗ミュラー管ホルモン（ミュラー管の退縮）③テストステロン（ウォルフ管の発達）④ジヒドロテストステロン（外性器の男性化）がそろう必要がある。"}, {"id": "s9-12", "set": 9, "n": 12, "c": "血液", "t": "血液・血小板", "p": "第8章※", "r": "", "s": "血小板で正しいのはどれか。", "neg": false, "two": false, "o": [["寿命は約120日である。", "誤り。血小板の寿命は約10日である。約120日は赤血球の寿命。", 0], ["産生はエリスロポエチンで促進される。", "誤り。血小板の産生を促すのはトロンボポエチン（主に肝臓でつくられる）である。エリスロポエチンは赤血球の産生を促す。", 0], ["血液1μL中に15万〜40万個ある。", "正しい。これより少ないと出血しやすくなる（血小板減少症）。", 1], ["核をもつ。", "誤り。血小板は骨髄の巨核球の細胞質がちぎれてできた断片で、核をもたない。", 0]], "z": "止血：①血管収縮 ②血小板血栓（一次止血：血小板の粘着・凝集、セロトニンなどを放出）③血液凝固（二次止血：フィブリンの網）→④線溶（プラスミンでフィブリンを溶かす）。"}, {"id": "s9-13", "set": 9, "n": 13, "c": "免疫", "t": "免疫・補体", "p": "第8章※", "r": "", "s": "補体で正しいのはどれか。", "neg": false, "two": false, "o": [["獲得免疫だけではたらく。", "誤り。抗体が結合して活性化される経路（古典経路）のほか、抗体なしで細菌表面で直接活性化される経路（第二経路）があり、自然免疫でもはたらく。", 0], ["主にリンパ球でつくられる。", "誤り。補体の多くは肝臓でつくられる。", 0], ["抗体の一種である。", "誤り。補体は約30種類の血漿タンパク質の一群で、抗体（免疫グロブリン）とは別のものである。", 0], ["細菌の細胞膜に孔をあけて溶かす。", "正しい。活性化された補体は膜侵襲複合体をつくり、細菌の膜に孔をあけて溶かす（溶菌）。", 1]], "z": "補体のはたらき：①オプソニン化（細菌を食べられやすくする）②炎症の誘発（肥満細胞を刺激、白血球を呼び寄せる）③溶菌（膜侵襲複合体）。自然免疫の担い手＝好中球・マクロファージ・NK細胞・補体。獲得免疫＝T細胞（細胞性免疫）とB細胞・抗体（体液性免疫）。"}, {"id": "s9-14", "set": 9, "n": 14, "c": "骨", "t": "骨Ca・血中Ca²⁺を上げるホルモン", "p": "p.94", "r": "", "s": "血中Ca²⁺濃度を上昇させるのはどれか。2つ選べ。", "neg": false, "two": true, "o": [["カルシトニン", "誤り。破骨細胞のはたらきを抑えて骨吸収を減らし、血中Ca²⁺を下げる。", 0], ["パラソルモン", "正しい。骨吸収を促し、腎臓でのCa²⁺の再吸収を増やし、ビタミンDの活性化を促して血中Ca²⁺を上げる。", 1], ["活性型ビタミンD", "正しい。小腸からのCa²⁺の吸収を促し、血中Ca²⁺を上げる。ビタミンDは肝臓と腎臓で順に水酸化されて活性型になる。", 1], ["アルドステロン", "誤り。腎臓でのNa⁺の再吸収とK⁺の排泄を促すホルモンで、Ca²⁺の調節には直接かかわらない。", 0]], "z": "血中Ca²⁺の正常値は約10mg/dL（9〜10.5）。上げる＝パラソルモン（骨・腎・ビタミンD活性化）と活性型ビタミンD（腸）、下げる＝カルシトニン。Ca²⁺が低下すると神経・筋の興奮性が高まりテタニー（手足のけいれん）が起こる。"}, {"id": "s9-15", "set": 9, "n": 15, "c": "循環", "t": "循環・血圧低下時の圧受容器反射", "p": "p.154-155", "r": "", "s": "急に立ち上がって血圧が下がったときに起こる反応で正しいのはどれか。", "neg": false, "two": false, "o": [["心臓迷走神経の活動が亢進する。", "誤り。迷走神経（副交感神経）の活動は低下し、心拍数が増える。", 0], ["細動脈が収縮して末梢血管抵抗が増加する。", "正しい。交感神経の活動が高まり、細動脈が収縮して血管抵抗が増し、血圧を戻す。静脈も収縮して静脈還流量（前負荷）が増える。", 1], ["心筋の収縮性が低下する。", "誤り。交感神経の興奮で心筋の収縮性は増加し（正の変力作用）、1回拍出量が増える。", 0], ["頸動脈洞の圧受容器からの求心性インパルスが増加する。", "誤り。血圧が下がると圧受容器の伸展が減り、インパルスは減少する。", 0]], "z": "圧受容器（頸動脈洞→舌咽神経、大動脈弓→迷走神経）→延髄の心臓血管中枢。血圧低下時は交感神経↑・副交感神経↓で、心拍数↑・収縮力↑・血管抵抗↑・静脈還流↑。血圧上昇時はその逆。長期的には腎臓（バソプレシン、RAAS）が体液量で調節する。"}, {"id": "s9-16", "set": 9, "n": 16, "c": "循環", "t": "循環・リンパの流れ", "p": "p.152-153", "r": "", "s": "リンパで正しいのはどれか。", "neg": false, "two": false, "o": [["1日のリンパ流量は約20Lである。", "誤り。ヒトのリンパ流量は約2〜4L/日である。", 0], ["右上半身のリンパは胸管を通って左静脈角に注ぐ。", "誤り。右上半身のリンパは右リンパ本幹を通って右静脈角に注ぐ。胸管が集めるのは下肢・腹部・左上半身のリンパ。", 0], ["リンパ管には弁がない。", "誤り。リンパ管には弁が多数あり、リンパは静脈側へ一定方向に流れる。", 0], ["組織液中のタンパク質を血管内に戻す。", "正しい。毛細血管から漏れ出たタンパク質を1日に75〜195g血管内へ戻し、血漿量と血漿タンパク質を保つ。", 1]], "z": "リンパを流す力＝筋肉運動・呼吸運動・消化管運動・動脈の拍動（受動的）とリンパ管自身の収縮（能動的）。食後は腸からのリンパ（乳び：脂肪を含む）が増える。リンパの流れが止まると浮腫が起こる。リンパ節は異物を除くフィルターで、がんの転移経路にもなる。"}, {"id": "s9-17", "set": 9, "n": 17, "c": "循環", "t": "循環・1回拍出量を決める因子（否定形）", "p": "p.153-154", "r": "", "s": "1回拍出量を増加させる要因でないのはどれか。", "neg": true, "two": false, "o": [["拡張期末容量の増加", "増加させる。心筋が引き伸ばされるほど強く収縮する（フランク・スターリングの心臓の法則）。", 0], ["動脈圧（後負荷）の上昇", "増加させない（これが正解）。血液を押し出すときの抵抗が大きくなり、収縮期末容量が増えるので1回拍出量は減る。", 1], ["静脈還流量の増加", "増加させる。心室に流れ込む血液（前負荷）が増え、拡張期末容量が増えるので1回拍出量が増える。", 0], ["交感神経による心筋収縮力の増強", "増加させる。収縮期末容量が減り、1回拍出量が増える。", 0]], "z": "1回拍出量＝拡張期末容量−収縮期末容量。増やす＝前負荷↑（静脈還流↑）・収縮性↑（交感神経）・後負荷↓。減らす＝後負荷↑（高血圧）。立位では下肢に血液がたまり静脈還流が減る。息こらえ（胸腔内圧上昇）でも静脈還流は減る。"}, {"id": "s9-18", "set": 9, "n": 18, "c": "呼吸", "t": "呼吸・呼吸筋（組合せ）", "p": "第11章※", "r": "", "s": "呼吸筋とはたらく時期の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["外肋間筋────吸息", "正しい。外肋間筋は肋骨を引き上げて胸郭を広げる吸息筋である。", 1], ["横隔膜────安静呼息", "誤り。横隔膜は安静吸息の主役で、収縮して下がり胸腔を広げる。安静呼息は筋の収縮ではなく、肺と胸郭の弾性で受動的に起こる。", 0], ["胸鎖乳突筋────安静吸息", "誤り。胸鎖乳突筋は努力吸息のときにはたらく補助吸息筋である。", 0], ["内肋間筋────安静吸息", "誤り。内肋間筋は肋骨を引き下げる呼息筋で、努力呼息ではたらく。", 0]], "z": "安静吸息＝横隔膜（約7割）・外肋間筋／努力吸息＝＋胸鎖乳突筋・斜角筋・大小胸筋など／安静呼息＝受動的（筋は使わない）／努力呼息＝内肋間筋・腹筋群（腹直筋・腹斜筋・腹横筋）。"}, {"id": "s9-19", "set": 9, "n": 19, "c": "呼吸", "t": "呼吸・肺気量分画（計算）", "p": "第11章※", "r": "", "s": "肺活量4,000mL、予備吸気量2,000mL、予備呼気量1,500mLのとき、1回換気量はどれか。", "neg": false, "two": false, "o": [["500mL", "正しい。肺活量＝予備吸気量＋1回換気量＋予備呼気量なので、1回換気量＝4,000−2,000−1,500＝500mL。", 1], ["2,000mL", "誤り。予備吸気量の値である。", 0], ["2,500mL", "誤り。肺活量から予備呼気量を引いた値で、最大吸気量（予備吸気量＋1回換気量）にあたる。", 0], ["5,500mL", "誤り。肺活量に予備呼気量を足した値で、意味をもたない。", 0]], "z": "肺活量＝予備吸気量＋1回換気量＋予備呼気量。全肺気量＝肺活量＋残気量。機能的残気量＝予備呼気量＋残気量。残気量と機能的残気量・全肺気量はスパイロメータでは測れない。"}, {"id": "s9-20", "set": 9, "n": 20, "c": "腎", "t": "腎・尿細管での再吸収と分泌", "p": "第12章※", "r": "", "s": "腎臓での尿の生成で正しいのはどれか。", "neg": false, "two": false, "o": [["濾過されたNa⁺の大部分は遠位尿細管で再吸収される。", "誤り。Na⁺の約2/3は近位尿細管で再吸収される。遠位尿細管・集合管ではアルドステロンによる微調整が行われる。", 0], ["尿素はまったく再吸収されない。", "誤り。尿素は一部が再吸収され、腎髄質の浸透圧を高めて尿の濃縮に役立つ。", 0], ["パラアミノ馬尿酸は尿細管から分泌される。", "正しい。パラアミノ馬尿酸（PAH）は濾過に加えて近位尿細管から分泌され、1回の通過でほぼすべて尿中へ出る。そのためPAHクリアランスは腎血漿流量の指標になる。", 1], ["グルコースは主に集合管で再吸収される。", "誤り。濾過されたグルコースは正常ではほぼ100％が近位尿細管で再吸収される。", 0]], "z": "近位尿細管＝グルコース・アミノ酸のほぼ全部、Na⁺・水の約2/3を再吸収。分泌されるもの＝H⁺、K⁺、PAH、薬物など。クリアランス：イヌリン＝糸球体濾過量（濾過のみで再吸収も分泌もない）、PAH＝腎血漿流量。"}, {"id": "s9-21", "set": 9, "n": 21, "c": "代謝", "t": "代謝・呼吸商", "p": "第13章※", "r": "", "s": "糖質だけが燃焼したときの呼吸商はどれか。", "neg": false, "two": false, "o": [["0.7", "誤り。脂質だけが燃焼したときの呼吸商である。", 0], ["0.8", "誤り。タンパク質だけが燃焼したときの呼吸商である。", 0], ["0.85", "誤り。糖質と脂質がまざって燃焼したとき（混合食、0.82前後）に近い値である。", 0], ["1.0", "正しい。グルコースの燃焼では消費したO₂と同じ数のCO₂ができる（C₆H₁₂O₆＋6O₂→6CO₂＋6H₂O）ので、6÷6＝1.0。", 1]], "z": "呼吸商＝排出したCO₂量÷消費したO₂量。糖質1.0、タンパク質0.8、脂質0.7。呼吸商から燃えている栄養素の割合がわかる。絶食が続くと脂質の利用が増えて0.7に近づく。"}, {"id": "s9-22", "set": 9, "n": 22, "c": "消化", "t": "消化・肝臓のはたらき（否定形）", "p": "第14章※", "r": "", "s": "肝臓のはたらきで誤っているのはどれか。", "neg": true, "two": false, "o": [["アンモニアから尿素を合成する。", "正しい記述。有害なアンモニアを尿素回路で尿素に変え、腎臓から排泄させる。", 0], ["グリコーゲンを貯蔵する。", "正しい記述。食後はグルコースをグリコーゲンとして蓄え、空腹時に分解して血糖を保つ。", 0], ["消化酵素を含む胆汁を分泌する。", "誤り（これが正解）。胆汁は胆汁酸やビリルビンを含むが、消化酵素は含まない。胆汁酸が脂肪を乳化して、リパーゼのはたらきを助ける。", 1], ["アルブミンを合成する。", "正しい記述。アルブミンのほか、フィブリノゲンやプロトロンビンなどの凝固因子もつくる。", 0]], "z": "肝臓のはたらき：糖代謝（グリコーゲンの貯蔵・糖新生）、タンパク質代謝（アルブミン・凝固因子の合成、尿素の合成）、脂質代謝（コレステロール・リポタンパク質の合成）、胆汁の生成、解毒、ビタミン（A・D・B₁₂）や鉄の貯蔵。"}, {"id": "s9-23", "set": 9, "n": 23, "c": "体温", "t": "体温・生理的変動（否定形）", "p": "第15章※", "r": "", "s": "体温の生理的変動で誤っているのはどれか。", "neg": true, "two": false, "o": [["女性では黄体期に基礎体温が上昇する。", "正しい記述。黄体から分泌されるプロゲステロンが体温を0.3〜0.5℃上げる。そのため基礎体温は低温期と高温期の二相性になる。", 0], ["高齢者の体温は小児より高い。", "誤り（これが正解）。小児は代謝がさかんで体温がやや高く、高齢者は代謝が下がるためやや低い。", 1], ["早朝に最も低く、夕方に最も高い。", "正しい記述。1日の変動（日内変動）は1℃以内である。", 0], ["食後に体温が上昇する。", "正しい記述。食後は特異動的作用（食事誘発性熱産生）で代謝が高まり、体温が上がる。", 0]], "z": "体温の変動要因：日内変動（早朝最低・夕方最高）、性周期（黄体期に高温）、年齢（小児＞成人＞高齢者）、食事（特異動的作用）、運動、精神的興奮。測定部位による違いは直腸＞口腔＞腋窩。"}, {"id": "s9-24", "set": 9, "n": 24, "c": "加齢", "t": "加齢・脱水になりやすい理由", "p": "第16章 p.223〜※", "r": "", "s": "高齢者が脱水になりやすい理由で正しいのはどれか。", "neg": false, "two": false, "o": [["のどの渇きを感じにくい。", "正しい。口渇中枢（視床下部）の感受性が低下し、体液が減っても渇きを感じにくいため、水を飲む量が不足しやすい。", 1], ["尿の濃縮力が高まる。", "誤り。腎機能の低下で尿を濃縮する力が下がり、水を体に保てず尿として失いやすい。", 0], ["細胞内液の割合が増える。", "誤り。筋量の減少で細胞内液が減ることが、高齢者の体液減少の主な原因である。", 0], ["体重に占める水分量の割合が増える。", "誤り。水分量の割合は成人の約60％から高齢者では約50％に減る。水分を多く含む筋が減り脂肪の割合が増えるためで、体内の水の蓄えが少ない。", 0]], "z": "高齢者の脱水の要因：①体液量そのものが少ない（体重の約50％、主に細胞内液の減少）②口渇を感じにくい ③尿の濃縮力の低下 ④トイレを気にして飲水を控える・摂食量の減少。腎機能の低下で低ナトリウム血症・低カリウム血症などの電解質異常も起こりやすい。"}, {"id": "s9-25", "set": 9, "n": 25, "c": "競技", "t": "競技者・持久的トレーニングの効果", "p": "p.235〜※", "r": "", "s": "持久的トレーニングを続けた競技者の安静時の特徴で正しいのはどれか。", "neg": false, "two": false, "o": [["左心室の内腔が狭くなる。", "誤り。持久的トレーニングでは内腔が広がる遠心性肥大になる。内腔が広がらず壁が厚くなる求心性肥大は、筋力トレーニングなど圧の負荷が大きい競技でみられる。", 0], ["1回拍出量が多い。", "正しい。心室の内腔が広がり（遠心性肥大）、1回に送り出す血液量が増える。", 1], ["最大酸素摂取量が少ない。", "誤り。最大酸素摂取量は増える。持久力の最もよい指標である。", 0], ["心拍数が多い。", "誤り。安静時の心拍数は少なくなる（スポーツ心臓の徐脈）。1回拍出量が増えるため、少ない拍数で同じ心拍出量をまかなえる。", 0]], "z": "持久性競技者（容量負荷）＝遠心性肥大・安静時徐脈・1回拍出量増加・最大酸素摂取量増加・毛細血管密度増加。筋力系競技者（圧負荷）＝求心性肥大（壁が厚くなり内腔は広がらない）。安静時の心拍出量は一般人とほぼ同じ。"}, {"id": "s10-1", "set": 10, "n": 1, "c": "総論", "t": "総論・能動輸送", "p": "第1章※（関連 p.24・26）", "r": "", "s": "Na⁺-K⁺ポンプについて正しいのはどれか。", "neg": false, "two": false, "o": [["Na⁺を細胞内へ、K⁺を細胞外へ運ぶ。", "向きが逆である。Na⁺を細胞外へくみ出し、K⁺を細胞内へ取り込む。その結果、細胞外液はNa⁺が多く、細胞内液はK⁺が多い状態が保たれる。", 0], ["1回の反応でNa⁺2個とK⁺3個を運ぶ。", "数が逆である。1回でNa⁺3個を細胞外へ、K⁺2個を細胞内へ運ぶ。正の電荷が差し引き1個分細胞外へ出るので、膜電位を負に保つ方向にもはたらく。", 0], ["濃度勾配に従う受動輸送である。", "濃度勾配に従って移動するのは拡散やイオンチャネルを通る受動輸送である。ポンプは勾配に逆らうため能動輸送に分類される。", 0], ["ATPのエネルギーを使って物質を運ぶ。", "正しい。Na⁺-K⁺ポンプはATPを分解して得たエネルギーで、濃度勾配に逆らってイオンを運ぶ能動輸送（一次性能動輸送）である。", 1]], "z": "細胞外液はNa⁺・Cl⁻・Ca²⁺が多く、細胞内液はK⁺が多い。静止膜電位は主にK⁺の平衡電位で決まり（p.25）、活動電位の上昇相はNa⁺の流入、下降相はK⁺の流出で起こる（p.26）。"}, {"id": "s10-2", "set": 10, "n": 2, "c": "筋", "t": "筋・単収縮と強縮", "p": "第2章※", "r": "", "s": "骨格筋の収縮で正しいのはどれか。", "neg": false, "two": false, "o": [["単収縮の持続時間は活動電位の持続時間より短い。", "逆である。骨格筋の活動電位は数ミリ秒で終わるが、単収縮は数十〜100ミリ秒ほど続く。この差があるため、収縮が終わる前に次の刺激を加えて収縮を重ねる（加重）ことができる。", 0], ["不完全強縮は完全強縮より高い刺激頻度で起こる。", "逆である。刺激頻度が低いと収縮の波がギザギザに残る不完全強縮となり、頻度を上げると波が融合して滑らかな完全強縮になる。", 0], ["心筋は骨格筋より強縮を起こしやすい。", "心筋は不応期が長く、収縮がほぼ終わるまで次の興奮が起こらないため強縮を起こさない。これにより心臓は収縮と弛緩（ポンプ作用）を規則正しく繰り返せる。", 0], ["完全強縮の張力は単収縮の張力より大きい。", "正しい。単収縮が融合して加重されるため、強縮の張力は単収縮の数倍になる。日常の随意運動は強縮で行われている。", 1]], "z": "刺激頻度：低い→単収縮の加重→不完全強縮→高い→完全強縮。強縮しないのは心筋（不応期が長い）。張力は 単収縮 ＜ 不完全強縮 ＜ 完全強縮。"}, {"id": "s10-3", "set": 10, "n": 3, "c": "神経", "t": "神経・神経線維の分類", "p": "p.27〜28", "r": "", "s": "神経線維の種類と支配領域の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["Aγ線維 ──── 痛覚", "Aγ線維は筋紡錘の錘内筋線維を支配する運動神経（γ運動ニューロン）である。痛覚を伝えるのはAδ線維（鋭い痛み）とC線維（鈍い痛み）である。", 0], ["B線維 ──── 自律神経節後線維", "B線維は有髄の自律神経節前線維である。節後線維は無髄のC線維である。", 0], ["Aα線維 ──── 骨格筋", "正しい。Aα線維は直径15〜20μm、伝導速度70〜120m/秒と最も太く速い有髄線維で、骨格筋（錘外筋線維）を支配する運動神経である。", 1], ["C線維 ──── 筋紡錘の一次終末", "筋紡錘の一次終末（らせん形終末）からの情報はAα（Ⅰa群）線維が伝える。C線維は直径0.5〜1μm、伝導速度0.5〜2m/秒の無髄線維で、温・冷・痛覚と自律神経節後線維を担う。", 0]], "z": "表3・1の整理：Aα＝骨格筋の運動・Ⅰa（筋紡錘一次終末）・Ⅰb（ゴルジ腱器官）／Aβ（Ⅱ）＝筋紡錘二次終末・圧・触覚／Aγ＝錘内線維／Aδ（Ⅲ）＝温・冷・痛覚／B＝節前線維／C＝節後線維・温・冷・痛覚。伝導速度は線維が太いほど速く、有髄は細くても無髄より速い（跳躍伝導）。"}, {"id": "s10-4", "set": 10, "n": 4, "c": "神経", "t": "神経・学習と記憶", "p": "p.35〜37", "r": "", "s": "学習と記憶について正しいのはどれか。", "neg": false, "two": false, "o": [["繰り返される刺激に反応しなくなる現象を増感という。", "これは「慣れ」である。増感は、痛みを伴う強い刺激などが繰り返されて反応が強くなる現象で、どちらも1つの刺激で生じる非連合学習に分類される。", 0], ["パブロフのイヌの条件反射はオペラント条件づけである。", "パブロフの実験（ベル音＝条件刺激と食餌＝無条件刺激の組合せ）は古典的条件づけである。オペラント条件づけは、ある行動（レバー押しなど）に報酬や罰を与えて行動の起こる確率を変える学習である。", 0], ["短期記憶には海馬が重要な役割を果たす。", "正しい。電話番号を覚えてかけるまでのような数秒〜数分の短期記憶には、大脳辺縁系、特に海馬が重要である。", 1], ["技術や運動の長期記憶にはウェルニッケ野が関与する。", "ウェルニッケ野が関与するのは言語の意味としての長期記憶である。技術や運動の長期記憶には小脳・大脳基底核・前運動野など運動に関連する領域が関与する。", 0]], "z": "非連合学習＝慣れ・増感。連合学習＝古典的条件づけ（消去：条件刺激だけ続けると弱まる／汎化：似た刺激でも成立）とオペラント条件づけ（報酬で正の強化）。記憶の基盤はシナプスの可塑性。長期記憶は短期記憶の単なる延長ではない。"}, {"id": "s10-5", "set": 10, "n": 5, "c": "神経", "t": "神経・自律神経の単独性支配", "p": "p.37〜38", "r": "", "s": "交感神経のみの支配を受けるのはどれか。2つ選べ。", "neg": false, "two": true, "o": [["副腎髄質", "正しい。副腎髄質は交感神経節前線維のみの支配を受け、カテコールアミン（主にアドレナリン）を分泌する。", 1], ["心臓", "交感神経（心拍数・収縮力の増加）と副交感神経（減少）の二重支配で、作用が互いに反対の拮抗性支配の代表例である。", 0], ["汗腺", "正しい。汗腺は交感神経のみの支配を受ける。ただし節後線維はアセチルコリンを放出する（例外的にコリン作動性）。", 1], ["唾液腺", "交感神経と副交感神経の二重支配を受けるが、どちらも分泌を促進するため拮抗性支配ではない。二重支配だが拮抗しない例として問われる。", 0]], "z": "単独性支配（交感神経のみ）＝副腎髄質・汗腺・皮膚血管・立毛筋。二重支配で拮抗しない例＝唾液腺。自律神経は常に活動している（持続性支配）。交感神経の節前線維は胸髄〜第1〜3腰髄、副交感神経は脳幹と第2〜4仙髄から出る（p.40）。"}, {"id": "s10-6", "set": 10, "n": 6, "c": "運動", "t": "運動の生理・脊髄反射", "p": "第4章※", "r": "", "s": "単シナプス反射はどれか。", "neg": false, "two": false, "o": [["屈曲反射", "皮膚への侵害刺激で同側の屈筋が収縮する反射で、介在ニューロンを含む多シナプス反射である。", 0], ["交叉性伸展反射", "屈曲反射と同時に反対側の伸筋が収縮する反射で、脊髄を交叉する介在ニューロンを介する多シナプス反射である。", 0], ["腹壁反射", "腹壁の皮膚をこすると腹筋が収縮する皮膚（表在）反射で、多シナプス反射である。錐体路障害で消失する。", 0], ["膝蓋腱反射", "正しい。膝蓋腱をたたくと大腿四頭筋の筋紡錘が伸張され、Ⅰa群線維→α運動ニューロンと1つのシナプスだけを介して同じ筋が収縮する（伸張反射）。", 1]], "z": "単シナプス反射は伸張反射（腱反射：膝蓋腱・アキレス腱・上腕二頭筋腱反射など）だけ。屈曲反射・交叉性伸展反射・皮膚反射・自律反射は多シナプス反射。伸張反射の受容器は筋紡錘、自原抑制（Ⅰb抑制）の受容器はゴルジ腱器官。"}, {"id": "s10-7", "set": 10, "n": 7, "c": "感覚", "t": "感覚・視細胞", "p": "p.63〜65※", "r": "", "s": "網膜の錐体について誤っているのはどれか。", "neg": true, "two": false, "o": [["暗所での光感度は杆体より高い。", "誤り（これが正解）。光感度が高いのは杆体で、暗い場所での視覚（暗所視）を担う。杆体の視物質はロドプシンで、ビタミンAが不足すると夜盲症になる。", 1], ["中心窩に多く分布する。", "正しい記述。錐体は中心窩に密集し、細かいものを見分ける視力（解像度）を担う。中心窩には杆体がない。", 0], ["3種類の視物質をもつ。", "正しい記述。赤・緑・青の光に感度の高い3種類の錐体があり、その興奮の比率で色を識別する。", 0], ["明所視を担う。", "正しい記述。明るい場所での視覚（明所視）と色覚は錐体が担う。", 0]], "z": "錐体＝中心窩・明所視・色覚・3種類。杆体＝網膜周辺部・暗所視・ロドプシン（ビタミンA）・光感度が高い。暗順応は錐体の順応のあと杆体の順応が続くため30分ほどかかる。視神経乳頭には視細胞がなく盲点となる。"}, {"id": "s10-8", "set": 10, "n": 8, "c": "感覚", "t": "感覚・嗅覚", "p": "p.72〜73※", "r": "", "s": "嗅覚について正しいのはどれか。", "neg": false, "two": false, "o": [["順応しにくい感覚である。", "嗅覚は順応しやすい感覚の代表である。同じにおいの中にいるとすぐに感じなくなる。", 0], ["嗅覚の情報は視床を経由せずに大脳皮質へ達する。", "正しい。嗅覚の情報は嗅球から嗅索を経て、視床を経由せずに嗅皮質（梨状葉・扁桃体など大脳辺縁系）へ伝わる。においが情動や記憶と結びつきやすいのはこのためである。", 1], ["嗅細胞は二次感覚細胞である。", "嗅細胞は自らが軸索をもつ神経細胞で、一次感覚細胞である。二次感覚細胞は味細胞・有毛細胞（聴覚・平衡覚）など、別のニューロンにシナプスで情報を渡す受容細胞である。", 0], ["嗅神経は第2脳神経である。", "嗅神経は第1脳神経である。第2脳神経は視神経である。", 0]], "z": "視床を経由しない感覚は嗅覚だけ。味覚の伝導路：舌前2/3＝顔面神経（鼓索神経）、舌後1/3＝舌咽神経、咽頭・喉頭＝迷走神経→延髄の孤束核→視床→大脳皮質味覚野。基本味は甘味・塩味・酸味・苦味・うま味の5つ。"}, {"id": "s10-9", "set": 10, "n": 9, "c": "内分", "t": "内分泌・成長ホルモン", "p": "p.92", "r": "", "s": "成長ホルモンについて正しいのはどれか。", "neg": false, "two": false, "o": [["血糖値を上昇させる。", "正しい。成長ホルモンには抗インスリン作用があり、肝臓での糖新生を促して血糖値を上げる。", 1], ["肝臓でソマトスタチンの産生を促す。", "成長ホルモンが肝臓で産生を促すのはインスリン様成長因子-1（IGF-1、ソマトメジンC）で、これが骨端軟骨の増殖などを起こす。ソマトスタチンは成長ホルモンの分泌を抑えるホルモンである（視床下部・膵臓D細胞）。", 0], ["睡眠中は分泌が減少する。", "成長ホルモンは入眠後の深いノンレム睡眠（徐波睡眠）のときに多く分泌される。", 0], ["脂肪の分解を抑制する。", "逆である。成長ホルモンは脂肪の分解を促進し、たんぱく質の合成を促進する。", 0]], "z": "成長ホルモン：下垂体前葉から分泌。分泌促進＝GHRH・睡眠・運動・低血糖・アルギニン、抑制＝ソマトスタチン。過剰で巨人症（骨端線閉鎖前）・先端巨大症（閉鎖後）、不足で下垂体性小人症（知能は正常）。血糖を上げるホルモン＝グルカゴン・アドレナリン・コルチゾール・成長ホルモン・甲状腺ホルモン。"}, {"id": "s10-10", "set": 10, "n": 10, "c": "内分", "t": "内分泌・甲状腺ホルモン", "p": "p.93〜94※", "r": "", "s": "甲状腺ホルモンの作用で誤っているのはどれか。", "neg": true, "two": false, "o": [["基礎代謝を上昇させる。", "正しい記述。ほとんどの細胞で酸素消費と熱産生を増やし、基礎代謝を上げる。", 0], ["心拍数を増加させる。", "正しい記述。心臓のβ受容体を増やしてカテコールアミンへの感受性を高め、心拍数を増やす。甲状腺機能亢進症（バセドウ病）では頻脈になる。", 0], ["中枢神経系の発達を促す。", "正しい記述。胎児期・乳児期の脳の発達に不可欠で、不足するとクレチン症（知能低下を伴う発育障害）になる。", 0], ["血中コレステロールを上昇させる。", "誤り（これが正解）。甲状腺ホルモンはコレステロールの分解・排泄を促し、血中コレステロールを低下させる。機能低下症では高コレステロール血症になる。", 1]], "z": "甲状腺ホルモン（T₃・T₄）は核内受容体に結合する。作用：基礎代謝↑・熱産生↑・心拍数↑・血糖↑・コレステロール↓・成長と脳の発達。分泌はTRH（視床下部）→TSH（下垂体前葉）で促進され、負のフィードバックを受ける。血中Ca²⁺を下げるカルシトニンは甲状腺の傍濾胞細胞から出る。"}, {"id": "s10-11", "set": 10, "n": 11, "c": "内分", "t": "内分泌・エストロゲン", "p": "p.99", "r": "", "s": "エストロゲンの作用で正しいのはどれか。2つ選べ。", "neg": false, "two": true, "o": [["基礎体温を上昇させる。", "基礎体温を上げるのはプロゲステロン（黄体ホルモン）である。排卵後の黄体期に体温が約0.3〜0.5℃上がり、高温相となる。", 0], ["骨吸収を抑制する。", "正しい。破骨細胞のはたらきを抑えて骨量を保つ。閉経後にエストロゲンが減ると骨吸収が進み、骨粗鬆症になりやすい。", 1], ["乳腺での乳汁の産生を促す。", "乳汁の産生を促すのはプロラクチン（下垂体前葉）である。エストロゲンは乳管を発達させるが、妊娠中の高濃度のエストロゲンはむしろ乳汁分泌を抑える。", 0], ["子宮内膜を増殖させる。", "正しい。卵胞期（増殖期）に子宮内膜を厚くする。その内膜を分泌期に変えて着床に備えるのがプロゲステロンである。", 1]], "z": "エストロゲン＝卵胞（顆粒膜細胞）から分泌。子宮内膜の増殖・二次性徴・骨吸収抑制・LDL↓HDL↑・排卵前のLHサージを起こす（正のフィードバック）。プロゲステロン＝黄体から分泌。子宮内膜の分泌期化・体温上昇・妊娠の維持・子宮筋の収縮抑制。"}, {"id": "s10-12", "set": 10, "n": 12, "c": "生殖", "t": "生殖・乳汁分泌", "p": "第7章※（関連 p.92）", "r": "", "s": "乳汁の分泌について正しいのはどれか。", "neg": false, "two": false, "o": [["プロラクチンは下垂体後葉から分泌される。", "プロラクチンは下垂体前葉から分泌される。下垂体後葉から分泌されるのはオキシトシンとバソプレシンである。", 0], ["妊娠中は高濃度のエストロゲンが乳汁の分泌を促進する。", "妊娠中は胎盤由来の高濃度のエストロゲンとプロゲステロンが乳汁分泌を抑えている。分娩で胎盤が出てこれらが急に減ると、プロラクチンの作用が現れて乳汁分泌が始まる。", 0], ["吸啜刺激は下垂体後葉からのオキシトシン分泌を促す。", "正しい。乳頭への吸啜刺激が神経を介して視床下部に伝わり、下垂体後葉からオキシトシンが分泌される（射乳反射）。同時にプロラクチンの分泌も促される。", 1], ["オキシトシンは乳腺の腺房細胞で乳汁を産生させる。", "オキシトシンは乳腺の腺房を取り巻く筋上皮細胞を収縮させ、乳汁を押し出す（射乳）。乳汁をつくるのはプロラクチンの作用である。", 0]], "z": "乳汁の「産生」＝プロラクチン（前葉）、乳汁の「射出」＝オキシトシン（後葉）。オキシトシンは分娩時の子宮筋収縮にもはたらく。プロラクチンは排卵を抑えるため、授乳中は月経が戻りにくい。"}, {"id": "s10-13", "set": 10, "n": 13, "c": "血液", "t": "血液・血漿と血清", "p": "第8章※", "r": "", "s": "血清に含まれないのはどれか。", "neg": true, "two": false, "o": [["フィブリノゲン", "含まれない（これが正解）。血清は血液が凝固したあとの上澄みで、血漿からフィブリノゲンなどの凝固因子が除かれたものである。フィブリノゲンはフィブリンとなって血餅に取り込まれる。", 1], ["アルブミン", "血清に含まれる。血漿たんぱく質で最も多く、膠質浸透圧の維持と物質の運搬を担う。肝臓で合成される。", 0], ["γ-グロブリン", "血清に含まれる。抗体（免疫グロブリン）の主体で、形質細胞がつくる。", 0], ["グルコース", "血清に含まれる。血清には糖・電解質・アルブミン・グロブリンなどがそのまま残る。", 0]], "z": "血漿＝血液から血球を除いた液体（抗凝固剤を入れて遠心）。血清＝血漿－フィブリノゲン（凝固因子）。血漿たんぱく質のうち肝臓でつくられないのはγ-グロブリン。"}, {"id": "s10-14", "set": 10, "n": 14, "c": "免疫", "t": "免疫・自然免疫", "p": "第8章※", "r": "", "s": "自然免疫を担う細胞はどれか。", "neg": false, "two": false, "o": [["形質細胞", "B細胞が抗原刺激を受けて分化した細胞で、抗体を産生する。体液性免疫（獲得免疫）を担う。", 0], ["ヘルパーT細胞", "抗原提示を受けてB細胞やキラーT細胞を活性化する、獲得免疫の司令塔である。", 0], ["NK細胞", "正しい。NK（ナチュラルキラー）細胞は、抗原にあらかじめ感作されていなくてもウイルス感染細胞や腫瘍細胞を直接破壊する自然免疫の細胞である。", 1], ["細胞傷害性T細胞", "キラーT細胞ともいい、特定の抗原をもつ感染細胞を破壊する細胞性免疫（獲得免疫）の細胞である。", 0]], "z": "自然免疫＝好中球・マクロファージ・NK細胞・樹状細胞・補体など（生まれつき・非特異的・すばやい・記憶なし）。獲得免疫＝T細胞・B細胞・形質細胞（後天的・特異的・記憶あり）。獲得免疫は体液性免疫（抗体）と細胞性免疫（キラーT細胞）に分かれる。"}, {"id": "s10-15", "set": 10, "n": 15, "c": "骨", "t": "骨・骨の構造と成分", "p": "第9章※", "r": "", "s": "骨について正しいのはどれか。", "neg": false, "two": false, "o": [["骨芽細胞は骨を吸収する。", "骨芽細胞は骨基質をつくる（骨形成）細胞である。骨を吸収するのは破骨細胞である。", 0], ["骨基質の無機成分の主体はハイドロキシアパタイトである。", "正しい。リン酸カルシウムの結晶（ハイドロキシアパタイト）が骨の硬さをつくり、有機成分の主体であるコラーゲン線維が粘り強さをつくる。", 1], ["骨の長さの成長は骨膜で行われる。", "長さの成長は骨端軟骨（骨端線）で行われる。骨膜で行われるのは太さの成長である。", 0], ["体内のカルシウムの約50％が骨に存在する。", "体内のカルシウムの約99％が骨と歯に存在する。血液中にあるのは残りのわずかである。", 0]], "z": "骨の細胞：骨芽細胞（形成）→骨基質に埋まると骨細胞、破骨細胞（吸収）。長さ＝骨端軟骨、太さ＝骨膜。骨端線が閉じると身長の伸びは止まる。骨形成を促すもの＝カルシトニン・エストロゲン・運動負荷、骨吸収を促すもの＝パラソルモン。"}, {"id": "s10-16", "set": 10, "n": 16, "c": "循環", "t": "循環・有効濾過圧（計算）", "p": "p.151〜152※", "r": "", "s": "毛細血管の動脈端で、毛細血管内圧35mmHg、間質液圧2mmHg、血漿膠質浸透圧25mmHg、間質液膠質浸透圧4mmHgのとき、有効濾過圧はどれか。", "neg": false, "two": false, "o": [["4mmHg", "4つの値を全部引き算した誤り（35－2－25－4）。間質液膠質浸透圧は水を血管外へ引き出す力なので、足し算の側に入る。", 0], ["8mmHg", "間質液膠質浸透圧を無視した誤り（35－2－25）。", 0], ["12mmHg", "正しい。有効濾過圧＝（毛細血管内圧＋間質液膠質浸透圧）－（血漿膠質浸透圧＋間質液圧）＝（35＋4）－（25＋2）＝12mmHg。正の値なので、動脈端では水が血管外へ濾過される。", 1], ["16mmHg", "間質液圧を引き算でなく足し算した誤り（35＋2－25＋4）。間質液圧は血管内へ押し戻す力である。", 0]], "z": "スターリングの仮説：血管外へ出す力＝毛細血管内圧・間質液膠質浸透圧、血管内へ戻す力＝血漿膠質浸透圧・間質液圧。動脈端では濾過、静脈端では毛細血管内圧が下がって再吸収が起こる。再吸収しきれない分はリンパ管へ入る。血漿アルブミンが減ると膠質浸透圧が下がり浮腫になる。"}, {"id": "s10-17", "set": 10, "n": 17, "c": "循環", "t": "循環・静脈還流", "p": "p.150〜151", "r": "", "s": "静脈還流を増加させるのはどれか。", "neg": false, "two": false, "o": [["骨格筋の弛緩", "静脈還流を増やすのは骨格筋の収縮である。筋が収縮すると間の静脈が圧迫され、静脈弁のはたらきで血液が心臓の方向へ押し出される（筋ポンプ）。", 0], ["吸息", "正しい。吸息時は胸腔内圧（胸膜腔内圧）がさらに低下し、胸腔内の大静脈と右心房が広がって血液が引き込まれる。腹圧も上がるので腹部の静脈血が胸腔へ押し出される（呼吸ポンプ）。", 1], ["臥位から立位への体位変換", "立位になると重力で下肢の静脈に血液がたまり、静脈還流は一時的に減る。これを圧受容器反射が代償する。", 0], ["胸腔内圧の上昇", "胸腔内圧が上がると胸腔内の静脈が圧迫され、静脈還流は減る。息をこらえていきむ（バルサルバ手技）と静脈還流が減って血圧が下がる。", 0]], "z": "静脈還流を増やすもの：骨格筋の収縮（筋ポンプ）・静脈弁・吸息（呼吸ポンプ）・臥位・静脈の収縮（交感神経）・循環血液量の増加。減らすもの：立位・胸腔内圧の上昇・長時間の静止立位。静脈は容量血管として全血液の約2/3を蓄えている。"}, {"id": "s10-18", "set": 10, "n": 18, "c": "呼吸", "t": "呼吸・呼吸中枢", "p": "p.168〜170", "r": "", "s": "呼吸の調節について正しいのはどれか。", "neg": false, "two": false, "o": [["延髄と脊髄の間で切断すると自発呼吸は停止する。", "正しい。延髄より下で切断すると、延髄の呼吸中枢からの指令が呼吸筋の運動神経へ届かなくなり、自発呼吸は完全に停止する。", 1], ["橋と延髄の間で切断すると自発呼吸は停止する。", "橋の下（橋と延髄の間）で切断しても、いくらか不規則になるが自発呼吸は続く。延髄の呼吸ニューロンだけで呼吸リズムをつくれることを示す。", 0], ["延髄の背側呼吸ニューロン群は主に呼息ニューロンで構成される。", "背側群は主に吸息ニューロンで構成され、主に横隔神経を支配する。吸息ニューロンと呼息ニューロンが混在するのは腹側群で、補助呼吸筋と肋間筋を支配する。", 0], ["中枢化学受容器は主に動脈血の酸素分圧の低下を感知する。", "中枢化学受容器（延髄腹側表面）が感知するのはpHと二酸化炭素分圧の変化である。動脈血の酸素分圧を主に感知するのは末梢化学受容器（頸動脈小体・大動脈小体）である。", 0]], "z": "呼吸中枢＝延髄（狭義の呼吸中枢：リズム形成）＋橋（呼吸調節中枢：吸息から呼息への切り替え）。随意呼吸は大脳皮質から皮質脊髄路を通る。頸動脈小体＝舌咽神経、大動脈小体＝迷走神経。肺の伸展受容器→迷走神経→吸息を抑制＝ヘーリング・ブロイエル反射（迷走神経を切ると吸息が延長し、深くゆっくりした呼吸になる）。"}, {"id": "s10-19", "set": 10, "n": 19, "c": "呼吸", "t": "呼吸・酸素解離曲線", "p": "p.166〜167", "r": "", "s": "ヘモグロビンの酸素解離曲線を右方へ移動させないのはどれか。", "neg": true, "two": false, "o": [["二酸化炭素分圧の低下", "右方移動させない（これが正解）。二酸化炭素分圧が下がるとpHが上がるため、曲線は左方へ移動し、ヘモグロビンは酸素を離しにくくなる。", 1], ["体温の上昇", "右方移動させる。温度が高くなるほど曲線は右下方へ移り、代謝が盛んで温かい組織では酸素が離れやすくなる。", 0], ["血液pHの低下", "右方移動させる。pHが低いほどヘモグロビンが酸素を手放しやすくなる。これをボーア効果という。", 0], ["2,3-DPGの増加", "右方移動させる。2,3-ジホスホグリセリン酸（DPG）は赤血球でつくられ、貧血や低酸素状態が続くと増えて酸素の解離を促す。", 0]], "z": "右方移動（酸素を離しやすい）＝体温↑・pH↓・CO₂分圧↑・2,3-DPG↑。運動中の筋はこの条件がそろい、効率よく酸素を受け取れる。左方移動はその逆と胎児ヘモグロビン。動脈血（PO₂約100mmHg）の酸素飽和度はほぼ100％、混合静脈血（約40mmHg）は約75％。"}, {"id": "s10-20", "set": 10, "n": 20, "c": "腎", "t": "腎・尿の濃縮", "p": "第12章※", "r": "", "s": "尿の濃縮について正しいのはどれか。", "neg": false, "two": false, "o": [["ヘンレループの上行脚は水の透過性が高い。", "上行脚は水をほとんど通さず、NaClだけを能動的に再吸収する。水を通しやすいのは下行脚である。この差で髄質に浸透圧の勾配ができる（対向流増幅系）。", 0], ["腎髄質の間質の浸透圧は皮質より低い。", "逆である。髄質の深部ほど浸透圧が高く、乳頭部では約1,200mOsm/Lに達する。この高い浸透圧が集合管から水を引き出す。", 0], ["バソプレシンは集合管での水の再吸収を促進する。", "正しい。バソプレシン（抗利尿ホルモン）は集合管の細胞に水チャネル（アクアポリン2）を組み込ませ、水の再吸収を増やして尿を濃くする。", 1], ["尿素は尿の濃縮に関与しない。", "尿素は集合管の髄質部から間質へ移動し、髄質の高い浸透圧の約半分をつくる。尿の濃縮に大きく関与している。", 0]], "z": "尿の濃縮＝①ヘンレループの対向流増幅系で髄質の浸透圧勾配をつくる ②尿素の再循環 ③バソプレシンが集合管の水透過性を上げる。バソプレシンの分泌が不足すると尿崩症（多量の薄い尿）になる。"}, {"id": "s10-21", "set": 10, "n": 21, "c": "代謝", "t": "代謝・エネルギー代謝率（計算）", "p": "第13章※", "r": "", "s": "ある作業中の代謝量が8.0kcal/分、安静時代謝量が1.2kcal/分、基礎代謝量が1.0kcal/分のとき、エネルギー代謝率（RMR）はどれか。", "neg": false, "two": false, "o": [["6.7", "作業中の代謝量を安静時代謝量で割った値（8.0÷1.2）。これは安静時を1とする考え方で、メッツに近い指標である。RMRは基礎代謝量を分母にする。", 0], ["6.8", "正しい。RMR＝（作業中の代謝量－安静時代謝量）÷基礎代謝量＝（8.0－1.2）÷1.0＝6.8。作業そのものに使った分のエネルギーが、基礎代謝の何倍かを表す。", 1], ["7.0", "安静時代謝量の代わりに基礎代謝量を引いた誤り（（8.0－1.0）÷1.0）。", 0], ["8.0", "作業中の代謝量を基礎代謝量で割っただけの誤り（8.0÷1.0）。安静時代謝量を差し引いていない。", 0]], "z": "RMR＝（作業時代謝量－安静時代謝量）÷基礎代謝量。安静時代謝量は基礎代謝量の約1.2倍。メッツ（METs）＝運動時の代謝量÷安静時代謝量（1メッツ≒酸素摂取量3.5mL/kg/分）。"}, {"id": "s10-22", "set": 10, "n": 22, "c": "消化", "t": "消化・排便", "p": "第14章※（関連 p.42）", "r": "", "s": "排便について正しいのはどれか。", "neg": false, "two": false, "o": [["胃大腸反射は空腹時に起こる。", "胃大腸反射は、食物が胃に入ったときに大腸に強い蠕動（総蠕動）が起こる反射である。朝食後に便意が起こりやすいのはこのためである。", 0], ["内肛門括約筋は随意的に収縮させることができる。", "内肛門括約筋は平滑筋で、自律神経に支配される不随意筋である。随意的に締められるのは横紋筋の外肛門括約筋（陰部神経支配）である。", 0], ["直腸壁の伸展は交感神経を介して排便を促す。", "排便を促す遠心路は副交感神経である骨盤神経である。交感神経（下腹神経）は直腸の運動を抑え、内肛門括約筋を収縮させる。", 0], ["排便反射の中枢は仙髄にある。", "正しい。直腸壁が伸展されると骨盤神経を介して仙髄（S2〜S4）の排便中枢に伝わり、直腸の収縮と内肛門括約筋の弛緩が起こる。ふだんは大脳からの抑制で随意的に排便を調節できる。", 1]], "z": "排便に関わる神経：骨盤神経（副交感）＝直腸収縮・内肛門括約筋弛緩、下腹神経（交感）＝その逆、陰部神経（体性）＝外肛門括約筋。排便中枢・排尿中枢はともに仙髄、上位中枢は橋。いきみ（腹圧）は随意的な補助。"}, {"id": "s10-23", "set": 10, "n": 23, "c": "体温", "t": "体温・体温調節反応", "p": "第15章※（関連 p.41）", "r": "", "s": "体温調節について正しいのはどれか。", "neg": false, "two": false, "o": [["寒冷時には交感神経のはたらきで皮膚血管が収縮する。", "正しい。皮膚の冷受容器からの情報が視床下部に伝わると交感神経の活動が高まり、皮膚血管を収縮させて熱放散を抑える。脂肪組織の代謝を高めて熱産生も増やす（体性-内臓反射）。", 1], ["体温調節中枢は延髄にある。", "体温調節中枢は視床下部にある。延髄には呼吸中枢・心臓血管中枢・嚥下中枢などがある。", 0], ["ふるえは自律神経によって起こる。", "ふるえは体性運動神経が骨格筋に律動的な収縮を起こさせる反応である。自律神経ではない。", 0], ["発汗は副交感神経によって起こる。", "汗腺は交感神経のみの支配を受ける。ただし節後線維の伝達物質はアセチルコリンである（例外的にコリン作動性）。", 0]], "z": "寒冷時：皮膚血管収縮・立毛（熱放散↓）、ふるえ・非ふるえ熱産生（褐色脂肪・甲状腺ホルモン・アドレナリン）（熱産生↑）。暑熱時：皮膚血管拡張・発汗（熱放散↑）。皮膚血管と汗腺はいずれも交感神経の単独支配。"}, {"id": "s10-24", "set": 10, "n": 24, "c": "加齢", "t": "高齢者・加齢に伴う変化", "p": "第16章 p.223〜※", "r": "", "s": "加齢に伴う変化で正しいのはどれか。", "neg": false, "two": false, "o": [["低音域から聴力が低下する。", "老人性難聴は高音域から聴力が低下する。内耳（蝸牛）の基底部の有毛細胞が先に障害されるためである。", 0], ["夜間の中途覚醒が減少する。", "高齢者は眠りが浅くなり、夜間の中途覚醒が増える。早朝に目が覚める（早朝覚醒）ことも多い。", 0], ["深い睡眠（徐波睡眠）が増加する。", "加齢とともにノンレム睡眠のステージ3・4（徐波睡眠）は減少し、浅い睡眠が増える。", 0], ["胸腺が萎縮しT細胞の機能が低下する。", "正しい。胸腺は思春期に最大となり、その後は萎縮して脂肪組織に置き換わる。T細胞の機能が落ちるため、高齢者は感染症にかかりやすく、悪性腫瘍も増える。", 1]], "z": "加齢による変化：増えるもの＝残気量・収縮期血圧・中途覚醒・血中のノルアドレナリン。減るもの＝肺活量・最大心拍数・体内水分量（特に細胞内液）・口渇感・徐波睡眠・胸腺・腎血流量・筋量（特に速筋線維）。聴力は高音域から、視覚は近くから（老視）低下する。"}, {"id": "s10-25", "set": 10, "n": 25, "c": "競技", "t": "発育・スキャモンの発育曲線", "p": "第17章 p.235〜※", "r": "", "s": "スキャモンの発育曲線の型と器官の組合せで正しいのはどれか。", "neg": false, "two": false, "o": [["一般型 ──── 胸腺", "胸腺はリンパ型である。一般型は身長・体重・筋・骨格・内臓（呼吸器・消化器など）で、乳幼児期と思春期の2回急に伸びるS字状の曲線を描く。", 0], ["神経型 ──── 脳", "正しい。神経型は脳・脊髄・眼・頭囲などで、出生後から急速に発育し、6歳ころまでに成人の約90％に達する。", 1], ["リンパ型 ──── 生殖器", "生殖器は生殖型である。リンパ型（胸腺・扁桃・リンパ節）は思春期ころに成人の約2倍に達し、その後低下する。", 0], ["生殖型 ──── 身長", "身長は一般型である。生殖型（精巣・卵巣・子宮など）は思春期まではわずかしか発育せず、思春期以降に急速に発育する。", 0]], "z": "スキャモンの4型：一般型（S字）・神経型（早期に完成）・リンパ型（思春期に約200％）・生殖型（思春期以降に急増）。運動指導への応用：神経型が伸びる幼児期〜児童期は巧みさ（調整力）、一般型が伸びる思春期は持久力、その後に筋力を伸ばしやすい。"}];

/* 分野（教科書の章順）と、ランダム25問の配分（本試験基準） */
const FIELDS=[["総論","総論・細胞・体液",1],["筋","筋の生理",2],["神経","神経の生理",3],["運動","運動の生理",2],["感覚","感覚の生理",2],["内分","内分泌",2],["生殖","生殖",1],["血液","血液",1],["免疫","免疫",1],["骨","骨の生理・Ca",1],["循環","循環",2],["呼吸","呼吸",2],["腎","尿の生成と排泄",1],["代謝","栄養と代謝",1],["消化","消化と吸収",1],["体温","体温",1],["加齢","高齢者の生理",1],["競技","発育と発達・競技者",0]];
const FN=Object.fromEntries(FIELDS.map(f=>[f[0],f[1]]));
const FORD=Object.fromEntries(FIELDS.map((f,i)=>[f[0],i]));
const SETS=[...new Set(DATA.map(q=>q.set))].sort((a,b)=>a-b);
const KEY="seiri_mock_v1";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(st){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function corr(q){return q.o.map((x,i)=>x[2]?i:-1).filter(i=>i>=0);}
function head(ch,tt,pg,bar,showHome){$("hch").textContent=ch;$("htt").textContent=tt;$("pg").textContent=pg||"";$("bar").style.width=(bar||0)+"%";$("hbtn").style.display=showHome?"":"none";window.scrollTo(0,0);}

/* ===== 成績（累計）===== 記録：問題ごとに [解いた回数, 正解数, 最後に正解したか] */
function fieldStats(){const st=load(),r={};DATA.forEach(q=>{const s=st[q.id];if(!s)return;r[q.c]=r[q.c]||[0,0];r[q.c][0]+=s[0];r[q.c][1]+=s[1];});return r;}
function color(p){return p>=0.8?"#1f9d6b":p>=0.6?"#8db33a":p>=0.4?"#e0a020":"#d0483f";}
function fieldRows(stat,click){
  const rows=FIELDS.map(f=>[f[0],stat[f[0]]]).sort((a,b)=>{const pa=a[1]?a[1][1]/a[1][0]:2,pb=b[1]?b[1][1]/b[1][0]:2;return pa-pb||FORD[a[0]]-FORD[b[0]];});
  return rows.map(([c,s])=>{
    if(!s)return `<div class="frow none"><span class="nm">${c}</span><span class="tr"></span><span class="v">未回答</span></div>`;
    const p=s[1]/s[0];
    return `<div class="frow" onclick="${click}('${c}')"><span class="nm">${c}</span><span class="tr"><i style="width:${Math.max(p*100,3)}%;background:${color(p)}"></i></span><span class="v">${s[1]}/${s[0]}</span></div>`;}).join("");
}

/* ===== メニュー ===== */
function home(){
  head("柔道整復師国家試験対策｜生理学","模試対策問題","",0,false);
  const setBtns=`<div class="mode wide" style="cursor:default"><div class="nm">セットを解く</div><div class="ds" style="margin-bottom:8px">25問を順番に解く</div><div class="sets">${SETS.map(s=>`<button class="sbtn" onclick="startList(DATA.filter(q=>q.set==${s}),'セット${s}',true)">${s}</button>`).join("")}</div></div>`;
  $("bd").innerHTML=`
   <p class="lead">問題は全${DATA.length}問。1回タップすると答えが確定し、4つの選択肢すべての解説が出ます。</p>
   <div class="sec">解く</div>
   <div class="menu">${setBtns}
    <button class="mode wide or" onclick="startRandom()"><div class="nm">ランダム25問</div><div class="ds">全セットから本試験の分野配分どおりに25問を抽選。毎回ちがう組み合わせになります</div></button>
    <button class="mode wide" onclick="weakPage('solve')"><div class="nm">分野を選んで解く</div><div class="ds">苦手な分野だけを集中して解く</div></button>
   </div>
   <div class="sec">読んで覚える</div>
   <div class="menu">
    <button class="mode" onclick="readPage('set',${SETS[0]})"><div class="nm">解説を読む（セット別）</div><div class="ds">問1から順に、全選択肢の解説と整理</div></button>
    <button class="mode" onclick="readPage('field','${FIELDS[0][0]}')"><div class="nm">解説を読む（分野別）</div><div class="ds">全セットの同じ分野をまとめて読む</div></button>
   </div>
   <div class="sec">成績</div>
   <div class="menu"><button class="mode wide" onclick="weakPage('stat')"><div class="nm">分野別の正答率（累計）</div><div class="ds">これまでに解いた結果を、苦手な分野から順に表示</div></button></div>`;
  $("ctrl").innerHTML="";
}

/* ===== ランダム25問：分野配分を守って抽選、同じ論点は重ねない、2つ選べは2問まで ===== */
function startRandom(){
  const used=new Set();let two=0;const pick=[];
  const pool=shuffle(DATA);
  const take=(q)=>{if(used.has(q.t)||pick.includes(q))return false;if(q.two&&two>=2)return false;pick.push(q);used.add(q.t);if(q.two)two++;return true;};
  FIELDS.forEach(([c,,n])=>{let k=0;for(const q of pool){if(k>=n)break;if(q.c===c&&take(q))k++;}});
  for(const q of pool){if(pick.length>=25)break;take(q);}
  pick.sort((a,b)=>FORD[a.c]-FORD[b.c]);
  startList(pick,"ランダム25問",true);
}

/* ===== 解く ===== */
let S=null;
function startList(list,title,record){S={list,title,record,i:0,score:0,miss:[],ans:[]};show();}
function qText(q){let s=esc(q.s);if(q.neg)s=s.replace(/(誤っている|でない|しない|含まれない|起こらない|されない)/,'<span class="em">$1</span>');if(q.two)s=s.replace("2つ選べ。",'<span class="em2">2つ選べ。</span>');return s;}
function show(){
  const q=S.list[S.i];S.sel=[];S.done=false;
  head(S.title,`問 ${S.i+1}`,`${S.i+1} / ${S.list.length}`,S.i/S.list.length*100,true);
  let m=`<span class="mark">${FN[q.c]}</span>`;if(q.neg)m+=`<span class="mark ng">否定形</span>`;if(q.two)m+=`<span class="mark two">2つ選べ</span>`;
  let h=`<div class="qnum">問${S.i+1}　${m}</div><div class="q">${qText(q)}</div><div class="opts">`;
  q.o.forEach((o,k)=>{h+=`<button class="opt" id="o${k}" onclick="tap(${k})"><span class="mk">${k+1}</span><span class="tx"><span>${esc(o[0])}</span><span class="ex" id="e${k}" style="display:none"></span></span></button>`;});
  h+=`</div><div id="after"></div>`;
  $("bd").innerHTML=h;
  $("ctrl").innerHTML=q.two?`<button class="btn" id="go" onclick="judge()" disabled>2つ選んでください</button>`:`<button class="btn" id="go" onclick="next()" disabled>選択肢をタップ</button>`;
}
function tap(k){
  if(S.done)return;const q=S.list[S.i];
  if(!q.two){S.sel=[k];judge();return;}
  const at=S.sel.indexOf(k);if(at>=0)S.sel.splice(at,1);else{if(S.sel.length>=2)S.sel.shift();S.sel.push(k);}
  q.o.forEach((_,j)=>$("o"+j).classList.toggle("sel",S.sel.includes(j)));
  const g=$("go");g.disabled=S.sel.length<2;g.textContent=S.sel.length<2?"2つ選んでください":"解答する";
}
function judge(){
  const q=S.list[S.i],c=corr(q);S.done=true;
  const ok=c.length===S.sel.length&&c.every(x=>S.sel.includes(x));
  q.o.forEach((o,k)=>{const el=$("o"+k);el.classList.remove("sel");el.classList.add("dis");
    if(o[2])el.classList.add("correct");else if(S.sel.includes(k))el.classList.add("wrong");
    const e=$("e"+k);e.style.display="block";e.innerHTML=(o[2]?'<span class="ok-t">正答　</span>':'')+esc(o[1]);});
  if(ok)S.score++;else S.miss.push(q);
  S.ans.push([q,ok]);
  if(S.record){const st=load();const r=st[q.id]||[0,0,0];r[0]++;if(ok)r[1]++;r[2]=ok?1:0;st[q.id]=r;save(st);}
  $("after").innerHTML=`<div class="vd ${ok?"ok":"ng"}">${ok?"正解！":"不正解　正答は "+c.map(x=>x+1).join("・")}</div>
    <div class="z"><b>整理：</b>${esc(q.z)}</div><div class="meta">［${esc(q.t)}］【生理】${esc(q.p)}${q.r?"　出題実績："+esc(q.r):""}</div>`;
  const g=$("go");g.onclick=next;g.disabled=false;g.textContent=S.i+1<S.list.length?"次の問題 ▶":"結果を見る ▶";
  $("after").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function next(){if(S.i+1<S.list.length){S.i++;show();}else result();}
function result(){
  const n=S.list.length,stat={};
  S.ans.forEach(([q,ok])=>{stat[q.c]=stat[q.c]||[0,0];stat[q.c][0]++;if(ok)stat[q.c][1]++;});
  head(S.title,"結果","",100,true);
  const all=S.miss.length===0;
  $("bd").innerHTML=`<div class="center"><div>${esc(S.title)}${S.record?"":"（解き直し）"}</div><div class="big">${S.score} / ${n}</div>
    <div class="lead">${all?"全問正解です！":"間違えた問題は "+S.miss.length+" 問。解き直して全部正解にしましょう。"}</div></div>
    <div class="sec">今回の分野別（低い順）</div>${fieldRows(stat,"readField")}
    <p class="note">分野名をタップすると、その分野の解説を読めます。1セットでは1分野1〜3問なので、弱点は「分野別の正答率（累計）」で確認しましょう。</p>`;
  const lastMiss=S.miss;
  $("ctrl").innerHTML=`<button class="btn sub" onclick="home()">メニューへ</button>${all?"":`<button class="btn" id="retry">間違えた問題だけもう一度 ▶</button>`}`;
  if(!all)$("retry").onclick=()=>startList(lastMiss,"間違えた問題の解き直し",false);
}

/* ===== 分野別の正答率（累計）／分野を選んで解く ===== */
function weakPage(kind){
  const stat=fieldStats();
  head("分野別",kind==="stat"?"分野別の正答率（累計）":"分野を選んで解く","",0,true);
  let h=`<p class="lead">${kind==="stat"?"これまでに解いた全結果の累計です。苦手な分野が上に来ます。":"解きたい分野をタップしてください。苦手な分野が上に来ます。"}</p>${fieldRows(stat,kind==="stat"?"fieldMenu":"solveField")}`;
  if(kind==="solve"){h+=`<div class="sec">未回答も含めて分野を選ぶ</div><div class="chips">${FIELDS.map(f=>`<button class="chip" onclick="solveField('${f[0]}')">${f[0]}（${DATA.filter(q=>q.c===f[0]).length}）</button>`).join("")}</div>`;}
  else{h+=`<p class="note">分野名をタップすると、その分野を解くか解説を読むかを選べます。記録はこの端末のブラウザに保存されます（別の端末とは共有されません）。</p>`;}
  $("bd").innerHTML=h;
  $("ctrl").innerHTML=`<button class="btn sub" onclick="home()">メニューへ</button>${kind==="stat"?`<button class="btn sub" style="margin-left:auto" onclick="resetRec()">記録を消す</button>`:""}`;
}
function fieldMenu(c){
  const n=DATA.filter(q=>q.c===c).length;
  head("分野別",FN[c],"",0,true);
  $("bd").innerHTML=`<p class="lead">「${FN[c]}」の問題は ${n} 問あります。</p><div class="menu">
   <button class="mode" onclick="solveField('${c}')"><div class="nm">この分野を解く</div><div class="ds">${n}問をランダムな順で</div></button>
   <button class="mode" onclick="readField('${c}')"><div class="nm">解説を読む</div><div class="ds">全選択肢の解説と整理</div></button></div>`;
  $("ctrl").innerHTML=`<button class="btn sub" onclick="weakPage('stat')">◀ 正答率へ戻る</button>`;
}
function solveField(c){startList(shuffle(DATA.filter(q=>q.c===c)),"分野別："+FN[c],true);}
function readField(c){readPage("field",c);}
function resetRec(){confirmBox();}
function confirmBox(){
  $("bd").innerHTML=`<p class="lead">これまでの記録をすべて消します。よろしいですか？</p>`;
  $("ctrl").innerHTML=`<button class="btn sub" onclick="weakPage('stat')">やめる</button><button class="btn" style="background:#d0483f;border-color:#d0483f" onclick="try{localStorage.removeItem(KEY)}catch(e){};weakPage('stat')">消す</button>`;
}

/* ===== 解説を読む ===== */
let HIDE=false;
try{HIDE=localStorage.getItem(KEY+"_hide")==="1"}catch(e){}
function readPage(by,val){
  const list=by==="set"?DATA.filter(q=>q.set==val):DATA.filter(q=>q.c===val);
  head("解説を読む",by==="set"?"セット"+val:FN[val],list.length+"問",0,true);
  const tabs=by==="set"?SETS.map(s=>`<button class="chip ${s==val?"on":""}" onclick="readPage('set',${s})">セット${s}</button>`).join("")
    :FIELDS.map(f=>`<button class="chip ${f[0]===val?"on":""}" onclick="readPage('field','${f[0]}')">${f[0]}</button>`).join("");
  let h=`<div class="rsel"><button class="chip ${by==="set"?"on":""}" onclick="readPage('set',${SETS[0]})">セット別</button><button class="chip ${by==="field"?"on":""}" onclick="readPage('field','${FIELDS[0][0]}')">分野別</button></div>
   <div class="chips" style="margin-bottom:10px">${tabs}</div>
   <label class="sw"><input type="checkbox" ${HIDE?"checked":""} onchange="HIDE=this.checked;try{localStorage.setItem(KEY+'_hide',HIDE?'1':'0')}catch(e){};document.querySelectorAll('.card').forEach(c=>c.classList.toggle('hide',HIDE))">答えを隠す（タップで1問ずつ開く）</label>`;
  if(!list.length)h+=`<p class="lead">この分野の問題はまだありません。</p>`;
  list.forEach(q=>{
    const c=corr(q);
    h+=`<div class="card ${HIDE?"hide":""}"><div class="qnum">セット${q.set} 問${q.n}　<span class="mark">${FN[q.c]}</span>${q.neg?'<span class="mark ng">否定形</span>':""}${q.two?'<span class="mark two">2つ選べ</span>':""}</div>
     <div class="q">${qText(q)}</div><div class="ansl">正答 ${c.map(x=>x+1).join("・")}</div>
     ${q.o.map((o,k)=>`<div class="ro ${o[2]?"c":""}"><span class="h">${k+1}．${esc(o[0])}</span><span class="e">${esc(o[1])}</span></div>`).join("")}
     <button class="btn sub reveal" onclick="this.closest('.card').classList.remove('hide')">答えと解説を見る</button>
     <div class="z"><b>整理：</b>${esc(q.z)}</div><div class="meta">［${esc(q.t)}］【生理】${esc(q.p)}${q.r?"　出題実績："+esc(q.r):""}</div></div>`;});
  $("bd").innerHTML=h;
  $("ctrl").innerHTML=`<button class="btn sub" onclick="home()">メニューへ</button>`;
}
home();
</script>
