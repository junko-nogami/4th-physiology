<script>
/* ===== 問題プール =====
   パートA〜Dの全問（教科書 第8章 P115〜132 ベース）＋ チャレンジ限定の新問題10問
   choices: [表示文, 正解フラグ, その選択肢が何かの説明]
   kihon / gori / hosoku / shinmon の意味は ch3_challenge と同じ。
   章末はライフ制なので dobon フラグは使わない（データ上は残っているが表示・判定には使わない）。

   内訳：パートA 56問／B 47問／C 33問／D 62問 ＝ 198問 ＋ 初見10問 ＝ 全208問
   コース配分（初見10問を引いた枠をプール数に比例配分）
     コンプリート50 ：A11・B9・C7・D13（計40）＋初見10
     コンプリート100：A26・B21・C15・D28（計90）＋初見10
     ALL            ：全208問
   見本：ch3_challenge.html（2段階の開始画面・ライフ制・最長連続正解・🏆COMPLETE）
   タグ配色：🎯＝章カラー #8b2635／⚠＝紫 #6d3f9e／📘＝琥珀 #8a6314／🔥＝焦茶オレンジ #c2410c
             （赤系の章なのでタグ4種が赤系に偏らないよう色を散らしている）*/

/* ========== パートA のプール（ch8_quizA.html と同一） ========== */
const POOL_A=[
/* ---------- A-1 血漿（P115〜117） ---------- */

{q:"細胞の周囲を満たしている体液はどれか。",
 choices:[
  ["組織液",true,""],
  ["血液",false,"血管を流れる体液。"],
  ["リンパ液",false,"リンパ管を流れる体液。"],
  ["血清",false,"血液が凝固したあとに残る液体。"]],
 exp:"ヒトの体液は<b>血液</b>（血管）・<b>リンパ液</b>（リンパ管）・<b>組織液</b>（組織の細胞を取り囲む）に分けられ、いずれも細胞の外にある体液（細胞外液）である。（教科書 P115）"},

{q:"血液は体重の約何％を占めるか。",kihon:true,
 choices:[
  ["約8％",true,""],
  ["約3％",false,"教科書が示す値より少ない。"],
  ["約15％",false,"教科書が示す値より多い。"],
  ["約25％",false,"教科書が示す値より大幅に多い。"]],
 exp:"血液は粘り気がある赤色の液体で、<b>体重の約8％</b>を占める。（教科書 P115）"},

{q:"血液のうち液体成分が占める割合はどれか。",kihon:true,
 choices:[
  ["55％",true,""],
  ["45％",false,"細胞成分が占める割合。"],
  ["75％",false,"図8・1が示す値ではない。"],
  ["90％",false,"血漿そのものに含まれる水の割合。"]],
 exp:"血液は<b>血漿（液体成分）55％</b>と<b>血球（細胞成分）45％</b>で構成される。（図8・1、教科書 P115）"},

{q:"血漿の約90％を占めるのはどれか。",
 choices:[
  ["水",true,""],
  ["タンパク質",false,"血漿に含まれるが、大部分を占めるものではない。"],
  ["電解質",false,"血漿に含まれるが、大部分を占めるものではない。"],
  ["グルコース",false,"血漿に含まれる栄養素だが、大部分を占めるものではない。"]],
 exp:"血漿の約90％は<b>水</b>で、そこに電解質、グルコースなどの栄養素や代謝老廃物、タンパク質が含まれる。（図8・1、教科書 P115）"},

{q:"血漿中でもっとも多い陽イオンはどれか。",kihon:true,
 choices:[
  ["Na⁺（143 mEq/L）",true,""],
  ["K⁺（4 mEq/L）",false,"血漿中の濃度は低い陽イオン。"],
  ["Ca²⁺（5 mEq/L）",false,"血漿中の濃度は低い陽イオン。"],
  ["Mg²⁺（3 mEq/L）",false,"血漿中の濃度は低い陽イオン。"]],
 exp:"表8・1より、もっとも多い陽イオンは<b>Na⁺</b>（143 mEq/L）である。（教科書 P116）"},

{q:"血漿中でもっとも多い陰イオンはどれか。",
 choices:[
  ["Cl⁻（103 mEq/L）",true,""],
  ["HCO₃⁻（27 mEq/L）",false,"血漿中に含まれる陰イオンだが、最多ではない。"],
  ["HPO₄²⁻（2 mEq/L）",false,"血漿中の濃度は低い陰イオン。"],
  ["SO₄²⁻（1 mEq/L）",false,"血漿中の濃度は低い陰イオン。"]],
 exp:"表8・1より、もっとも多い陰イオンは<b>Cl⁻</b>（103 mEq/L）である。（教科書 P116）"},

{q:"血漿の浸透圧の維持で大きな役割を果たす電解質の組合せはどれか。",kihon:true,
 choices:[
  ["Na⁺ と Cl⁻",true,""],
  ["K⁺ と Ca²⁺",false,"神経や筋で活動電位を起こすために必要な電解質の組合せ。"],
  ["HCO₃⁻ と HPO₄²⁻",false,"HCO₃⁻は体液のpHが大きく変化しないようにするはたらきをもつ。HPO₄²⁻は血漿中の濃度が2 mEq/Lと低い。"],
  ["Mg²⁺ と SO₄²⁻",false,"どちらも血漿中の濃度が1〜3 mEq/Lと低く、浸透圧を左右するほどの量がない。"]],
 exp:"血液に含まれる電解質のうち、<b>Na⁺とCl⁻</b>は浸透圧の維持で大きな役割を果たす。血漿中でもっとも多い陽イオン（143 mEq/L）と陰イオン（103 mEq/L）なので、量がそのまま浸透圧に効いてくる。電解質のはたらきは「<b>浸透圧＝Na⁺・Cl⁻</b>」「活動電位＝K⁺・Ca²⁺」「pH緩衝＝HCO₃⁻」の3つで整理しておく。（教科書 P116）"},

{q:"神経や筋で活動電位を起こすために必要な電解質の組合せはどれか。",kihon:true,
 choices:[
  ["K⁺ と Ca²⁺",true,""],
  ["Na⁺ と Cl⁻",false,"血漿中でもっとも多い陽イオンと陰イオンで、浸透圧の維持で大きな役割を果たす組合せ。"],
  ["HCO₃⁻ と HPO₄²⁻",false,"HCO₃⁻は体液のpHが大きく変化しないようにするはたらきをもつ。HPO₄²⁻は血漿中の濃度が2 mEq/Lと低い。"],
  ["Mg²⁺ と SO₄²⁻",false,"どちらも血漿中の濃度が1〜3 mEq/Lと低く、表8・1で個別のはたらきが示されていない電解質。"]],
 exp:"<b>K⁺とCa²⁺</b>は、神経や筋で活動電位を起こすために必要である。電解質のはたらきは「浸透圧＝Na⁺・Cl⁻」「<b>活動電位＝K⁺・Ca²⁺</b>」「pH緩衝＝HCO₃⁻」の3つで整理しておく。（教科書 P116）"},

{q:"体液のpHが大きく変化しないようにする作用をもつ電解質はどれか。",kihon:true,
 choices:[
  ["HCO₃⁻（重炭酸イオン）",true,""],
  ["Na⁺",false,"血漿中でもっとも多い陽イオンで、Cl⁻とともに浸透圧の維持で大きな役割を果たす。"],
  ["Ca²⁺",false,"K⁺とともに、神経や筋で活動電位を起こすために必要な電解質。"],
  ["HPO₄²⁻",false,"血漿中の濃度が2 mEq/Lと低く、表8・1で個別のはたらきが示されていない陰イオン。"]],
 exp:"重炭酸イオンのこのはたらきを<b>pH緩衝作用</b>という。血漿タンパク質も酸塩基平衡の調節分子として同じはたらきをもつ。電解質のはたらきは「浸透圧＝Na⁺・Cl⁻」「活動電位＝K⁺・Ca²⁺」「<b>pH緩衝＝HCO₃⁻</b>」の3つで整理しておく。（教科書 P116）"},

{q:"血漿タンパク質の作用はどれか。",kihon:true,
 choices:[
  ["浸透圧維持・pH緩衝作用・物質運搬",true,""],
  ["酸素運搬・二酸化炭素運搬・pH維持",false,"ヘモグロビンの3つのはたらき。"],
  ["止血・凝固・線溶",false,"止血のしくみに関する語の並び。"],
  ["造血・成熟・分化",false,"血球がつくられる過程に関する語の並び。"]],
 exp:"血漿タンパク質は<b>浸透圧維持・pH緩衝作用・物質運搬</b>などのはたらきを担う。そのほか血液の粘性を維持し、血液凝固作用や免疫作用でも重要な役割を果たす。（教科書 P116）"},

{q:"もっとも多い血漿タンパク質はどれか。",kihon:true,dobon:true,
 choices:[
  ["アルブミン",true,""],
  ["グロブリン",false,"電気的な性質の差によって4種類に分けられる血漿タンパク質。"],
  ["フィブリノゲン",false,"血液の凝固で中心的な役割を果たす血漿タンパク質。"],
  ["ヘモグロビン",false,"赤血球の内部にある色素タンパク質で、血漿タンパク質ではない。"]],
 exp:"<b>アルブミン</b>は血漿タンパク質の60％を占める。浸透圧を維持して血漿の量を一定に保つはたらきへの寄与も最大である。（教科書 P117）"},

{q:"アルブミンが血漿タンパク質に占める割合はどれか。",
 choices:[
  ["約60％",true,""],
  ["約30％",false,"教科書が示す値より少ない。"],
  ["約45％",false,"教科書が示す値より少ない。"],
  ["約90％",false,"教科書が示す値より多い。"]],
 exp:"アルブミンは血漿タンパク質の<b>60％</b>を占める。（教科書 P117）"},

{q:"抗体として免疫機能を担う血漿タンパク質はどれか。",kihon:true,
 choices:[
  ["γグロブリン",true,""],
  ["アルブミン",false,"もっとも多い血漿タンパク質。"],
  ["フィブリノゲン",false,"フィブリンに変化して血餅をつくる血漿タンパク質。"],
  ["ヘモグロビン",false,"赤血球の内部にある色素タンパク質。"]],
 exp:"グロブリンはα₁、α₂、β、γの4種類に分けられ、α₁・α₂・βはホルモンやビタミンと結合して全身へ運び、<b>γ</b>は抗体として免疫機能を担う。（教科書 P117）"},

{q:"血漿からある成分を除いたものが血清である。除かれるのはどれか。",kihon:true,dobon:true,
 choices:[
  ["フィブリノゲン",true,""],
  ["赤血球",false,"血液の細胞成分であり、液体成分である血漿にはもともと含まれない。"],
  ["アルブミン",false,"もっとも多い血漿タンパク質で、血清にも残る。"],
  ["グルコース",false,"血漿に含まれる栄養素で、血清にも残る。"]],
 exp:"血漿から<b>フィブリノゲン</b>を除去したものは凝固せず、<b>血清</b>と呼ばれる。（教科書 P117）"},

{q:"スターリングの仮説で、毛細血管の動脈側で起こるのはどれか。",kihon:true,
 choices:[
  ["毛細血管から間質へ水分が押し出される",true,""],
  ["タンパク質が毛細血管から間質へ自由に移動する",false,"タンパク質は内皮細胞の隙間を透過しにくい。"],
  ["赤血球が間質へ出ていく",false,"血球が毛細血管壁を通り抜けるわけではない。"],
  ["水分の移動がまったく起こらない",false,"内圧の差によって水分は移動している。"]],
 exp:"動脈側は内圧が高いため毛細血管から間質へ水分が<b>押し出される</b>。静脈側は内圧が次第に低下するため、間質側から毛細血管へ水分が<b>引き込まれる</b>。（教科書 P116）"},

{q:"血漿タンパク質が結合して運搬するのはどれか。",
 choices:[
  ["カルシウム",true,""],
  ["酸素",false,"赤血球内のヘモグロビンが結合して運ぶ。"],
  ["ブドウ糖",false,"血漿に溶けて運ばれる栄養素。"],
  ["尿素",false,"血漿に含まれる代謝老廃物。"]],
 exp:"血漿タンパク質は<b>薬物、カルシウム、ホルモン</b>などの一部と結合してこれらを運搬する。（教科書 P116）"},

{q:"血液が末梢組織から回収するものはどれか。",
 choices:[
  ["代謝老廃物と二酸化炭素",true,""],
  ["酸素とホルモン",false,"末梢組織へ運ばれるもの。"],
  ["熱と栄養分",false,"末梢組織へ運ばれるもの。"],
  ["鉄と葉酸",false,"赤血球の産生に必要な材料。"]],
 exp:"血液は心臓のポンプ作用で循環し、酸素・栄養分・熱・ホルモンなどを末梢組織へ運び、<b>代謝老廃物と二酸化炭素</b>を回収する。（教科書 P115）"},

/* ---------- A-2 赤血球（P117〜119） ---------- */

{q:"赤血球の直径はどれか。",kihon:true,
 choices:[
  ["7〜8μm",true,""],
  ["2〜3μm",false,"血液の成分のうち、これより小さいものの直径。"],
  ["5〜20μm",false,"赤血球より幅のある直径。"],
  ["15〜20μm",false,"図8・1が赤血球に示している値ではない。"]],
 exp:"赤血球は両凹型をした直径約<b>7〜8μm</b>の円盤状の細胞。柔軟に変形するため直径5μm程度の毛細血管でも通過できる。（教科書 P117、図8・1）"},

{q:"血液1μL中の赤血球の数はどれか。",kihon:true,
 choices:[
  ["400万〜450万",true,""],

 choices:[

 exp:"<b>貪食</b>は自然免疫の中心となるはたらき、<b>抗原提示（MHCクラスII）</b>は獲得免疫の入口となるはたらき。さらにTh1細胞が分泌するIFN-γで活性化されると貪食能が亢進するので、獲得免疫から指令を受ける側でもある。（教科書 P128〜132）"},

];

/* ===== コース設定（プール数に比例して抽出。初見10問は常に全問） ===== */
const PARTS={A:POOL_A,B:POOL_B,C:POOL_C,D:POOL_D};
const COURSES={
  "50" :{name:"コンプリート50", pick:{A:11,B:9,C:7,D:13}},
  "100":{name:"コンプリート100",pick:{A:26,B:21,C:15,D:28}},
  "all":{name:"ALL",            pick:null}
};
const TOTAL=Object.values(PARTS).reduce((s,p)=>s+p.length,0)+SHINMON.length;

/* ===== 出題エンジン ===== */
let course="50", drawn=[], idx=0, correct=0, streak=0, best=0, lives=0, maxLives=0, answered=false, dead=false;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function hearts(){
  if(maxLives<=1) return "";
  let h="";
  for(let i=0;i<maxLives;i++) h += (i<lives) ? "♥" : '<span class="off">♥</span>';
  return h;
}
function paintHead(){
  document.getElementById("life").innerHTML = hearts();
  document.getElementById("pg").textContent = (drawn.length? `${idx+1} / ${drawn.length}問目` : "");
}
function cname(){ return COURSES[course].name; }
function lname(){ return (maxLives<=1) ? "一発勝負" : "ライフ "+maxLives; }
function resetHead(t){
  document.getElementById("htt").textContent=t;
  document.getElementById("life").innerHTML="";
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="0";
  drawn=[];
  document.getElementById("ctrl").innerHTML="";
}

/* ステップ1：問題数を選ぶ */
function home(){
  resetHead("コンプリートチャレンジ");
  document.getElementById("bd").innerHTML=`
    <div class="center">
      <p class="lead">第8章の全パートの問題に、チャレンジ限定の新問題を混ぜて出題します。<br>毎回ランダムに選んでシャッフル。ライフがなくなるまで出し続けます。</p>
      <div class="step">STEP 1　問題数を選ぶ</div>
      <div class="modes">
        <button class="mode" onclick="pickCourse('50')">
          <div class="nm">コンプリート50</div>
          <div class="ds">パートA〜Dから比例配分で40問＋チャレンジ限定10問。まずはここから。</div>
        </button>
        <button class="mode" onclick="pickCourse('100')">
          <div class="nm">コンプリート100</div>
          <div class="ds">パートA〜Dから比例配分で90問＋チャレンジ限定10問。</div>
        </button>
        <button class="mode hard" onclick="pickCourse('all')">
          <div class="nm">ALL（全${TOTAL}問）</div>
          <div class="ds">第8章の全問題。最後までたどり着けるか挑戦。</div>
        </button>
      </div>
      <div class="legend">
        <span class="mark kihon">🎯 基本</span> 落としちゃダメな基本問題<br>
        <span class="mark gori">⚠ 誤りを選ぶ</span> 誤っているものを選ぶ問題<br>
        <span class="mark hosoku">📘 補足（資料外）</span> 教科書外の国試頻出テーマ<br>
        <span class="mark shinmon">🔥 チャレンジ限定</span> この章末だけに出る新問題<br>
        ※ どのモードでも選び直しはできません。間違えた問題も解説は表示されます。
      </div>
    </div>`;
}

/* ステップ2：ライフを選ぶ */
function pickCourse(c){
  course=c;
  resetHead(cname());
  document.getElementById("bd").innerHTML=`
    <div class="center">
      <p class="lead"><b>${cname()}</b>（${c==="all"?TOTAL:c}問）に挑戦します。</p>
      <div class="step">STEP 2　ライフを選ぶ</div>
      <div class="modes">
        <button class="mode hard" onclick="start(1)">
          <div class="nm">一発勝負（ライフなし）</div>
          <div class="ds">1問でも間違えたら、そこで終了。何問連続で正解できるかに挑戦。</div>
        </button>
        <button class="mode" onclick="start(3)">
          <div class="nm">ライフ 3</div>
          <div class="ds">3回まで間違えられます。3回目を間違えた時点で終了。</div>
        </button>
        <button class="mode" onclick="start(5)">
          <div class="nm">ライフ 5</div>
          <div class="ds">5回まで間違えられます。まずはここから挑戦してみましょう。</div>
        </button>
      </div>
    </div>`;
  document.getElementById("ctrl").innerHTML=`<button class="btn sub" onclick="home()">◀ 問題数を選び直す</button>`;
}

function draw(){
  const p=COURSES[course].pick;
  let list=SHINMON.slice();
  for(const k in PARTS){
    list = list.concat(p ? shuffle(PARTS[k]).slice(0,p[k]) : PARTS[k]);
  }
  return shuffle(list);
}

function start(n){
  maxLives=n; lives=n;
  drawn=draw();
  idx=0; correct=0; streak=0; best=0; dead=false;
  render();
}

function render(){
  answered=false;
  const item=drawn[idx];
  const opts=shuffle(item.choices);
  document.getElementById("htt").textContent = cname()+"｜"+lname();
  paintHead();
  document.getElementById("bar").style.width=(idx/drawn.length*100)+"%";
  const L=["ア","イ","ウ","エ","オ"];
  let markHtml="";
  if(item.kihon)   markHtml += `<span class="mark kihon">🎯 基本</span>`;
  if(item.gori)    markHtml += `<span class="mark gori">⚠ 誤りを選ぶ</span>`;
  if(item.hosoku)  markHtml += `<span class="mark hosoku">📘 補足（資料外）</span>`;
  if(item.shinmon) markHtml += `<span class="mark shinmon">🔥 チャレンジ限定</span>`;
  const qText = item.gori ? item.q.replace("誤っている",'<span class="ng">誤っている</span>') : item.q;
  let h=`<div class="qnum">Q${idx+1} ${markHtml}</div><div class="q">${qText}</div><div class="opts">`;
  opts.forEach((o,i)=>{h+=`<button class="opt" onclick="pick(this,${o[1]})"><span class="mk">${L[i]}</span><span>${o[0]}</span></button>`;});
  h+=`</div><div class="exp" id="exp"><div class="vd" id="vd"></div><div class="tx" id="tx"></div></div>`;
  document.getElementById("bd").innerHTML=h;
  document.getElementById("ctrl").innerHTML=`<button class="btn" id="nx" onclick="next()" disabled>解答を選んでください</button>`;
}

function pick(el,ok){
  if(answered)return;
  answered=true;
  const item=drawn[idx];
  const selText=el.querySelector("span:last-child").textContent;
  const selChoice=item.choices.find(c=>c[0]===selText);
  const exp=document.getElementById("exp");
  const nx=document.getElementById("nx");
  document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));

  if(ok){
    el.classList.add("correct");
    correct++; streak++; if(streak>best) best=streak;
    exp.className="exp show ok";
    document.getElementById("vd").textContent="正解！";
    document.getElementById("tx").innerHTML=item.exp;
  }else{
    // 選び直しなし。正解の語句・色は伏せたまま、選んだ選択肢が何かだけ説明する
    el.classList.add("wrong");
    lives--; streak=0;
    paintHead();
    exp.className="exp show ng";
    document.getElementById("vd").textContent =
      (lives>0) ? `不正解（残りライフ ${lives}）` : "不正解 — ここで終了";
    document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}`;
    if(lives<=0) dead=true;
  }
  nx.disabled=false;
  if(dead)                         nx.textContent="結果を見る ▶";
  else if(idx+1<drawn.length)      nx.textContent="次の問題 ▶";
  else                             nx.textContent="結果を見る ▶";
}

function next(){
  if(dead){result();return;}
  if(idx+1<drawn.length){idx++;render();}
  else result();
}

function result(){
  const n=drawn.length;
  const done=idx+1;                       // 出題された問題数
  const complete=(!dead && done>=n);      // 全問やりきった
  document.getElementById("htt").textContent="結果";
  document.getElementById("life").innerHTML=hearts();
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="100%";

  let html;
  if(complete && correct===n){
    html=`<div class="center score">
      <span class="tag">🏆 ${cname()} COMPLETE</span>
      <div>全問ノーミス</div>
      <div class="big">${n} / ${n}</div>
      <div class="msg">第8章を完全制覇しました。文句なしです。</div>
      <div class="stats">最長連続正解 ${best}問</div>
    </div>`;
  }else if(complete){
    html=`<div class="center score">
      <span class="tag">🏁 ${cname()} 完走</span>
      <div>最後まで到達しました</div>
      <div class="big">${correct} / ${n}</div>
      <div class="msg">ライフを残して全問クリア。あと一歩でコンプリートです。</div>
      <div class="stats">最長連続正解 ${best}問　｜　残りライフ ${lives}</div>
    </div>`;
  }else if(maxLives<=1){
    html=`<div class="center score dead">
      <span class="tag dob">${cname()}｜一発勝負</span>
      <div>ここで終了</div>
      <div class="big">${correct} 問連続正解</div>
      <div class="msg">全${n}問中 ${done}問目でストップ。<br>上の解説を確認して、もう一度挑戦しましょう。</div>
    </div>`;
  }else{
    html=`<div class="center score dead">
      <span class="tag dob">${cname()}｜ライフ ${maxLives}</span>
      <div>ライフがなくなりました</div>
      <div class="big">${correct} / ${done}</div>
      <div class="msg">全${n}問中 ${done}問目でストップ。<br>最長で ${best}問連続正解でした。</div>
      <div class="stats">正解 ${correct}問　｜　最長連続 ${best}問</div>
    </div>`;
  }
  document.getElementById("bd").innerHTML=html;
  document.getElementById("ctrl").innerHTML=`<button class="btn sub" onclick="home()">問題数を選ぶ</button><button class="btn sub" onclick="pickCourse(course)">ライフを選ぶ</button><button class="btn" onclick="start(maxLives)">もう一度（シャッフル）▶</button>`;
}

home();
</script>
</body>
</html>
