<h1>生理学 第12章 尿の生成と排泄｜パートB 確認テスト</h1>
<div class="slide">
  <div class="hd"><div><div class="ch">第12章 尿の生成と排泄 ｜ B 尿の生成（教科書 P173〜177）</div><div class="tt" id="htt">確認テスト</div></div><div class="pg" id="pg"></div></div>
  <div class="bar"><i id="bar"></i></div>

<script>
/* ===== 問題プール（教科書 第12章 P173〜P177 ベース）=====
   対応スライド：ch12_partB.html（B 尿の生成）
   choices: [表示文, 正解フラグ, その選択肢が何かの説明]
   kihon/dobon/gori/hosoku の意味は他章と同じ。g … 出題グループ（GMAXで1回の出題数を制限）

   内訳：全44問／🎯基本18問／💣ドボン7問／⚠誤りを選ぶ3問／📘補足5問
   2026年11月追加：模試（尿の生成と排泄）との照合で「GFRが増加する＝糸球体毛細血管の血圧の上昇」を追加。
   GFRの値は P173（男性約120・女性約110 mL/分）と P178（体表面積補正で男性125 mL/分）の両方を解説に記載
   グループ（すべて上限1）：同じテーマの問題や、先に出た問題の解説・ダミー説明が次の答えになる組を同じグループにした。
     ryo（尿量）／gfr（GFRの増減）／atsu（濾過圧）／henle（ヘンレループ）／nyochu（尿中に出るもの）
     glu（グルコース）／horm（バソプレシン・アルドステロン）／bunpi（H⁺・アンモニアの分泌）
     chisso（窒素代謝産物：尿素・尿酸・アンモニア・クレアチン系）／nyo（尿の性質）

   過去問（尿の生成と排泄 (2)尿の生成）でこの範囲に関わるもの：
   近位尿細管での再吸収6回／有効濾過圧・GFR5回／再吸収されにくい物質（クレアチニン）4回／分泌（H⁺）3回
   正常な尿の成分3回／尿量・乏尿・無尿3回／濾過されないもの2回 */
const PICK=5;
const GMAX={ryo:1,gfr:1,atsu:1,henle:1,nyochu:1,glu:1,horm:1,bunpi:1,chisso:1,nyo:1};
function draw(){const out=[],cnt={};for(const q of shuffle(POOL)){const g=q.g;if(g&&GMAX[g]!==undefined){if((cnt[g]||0)>=GMAX[g])continue;cnt[g]=(cnt[g]||0)+1;}out.push(q);if(out.length>=PICK)break;}return out;}
const POOL=[
/* ---------- 尿量（P173） ---------- */

{g:"ryo",q:"健常成人が1日に排泄する尿量はどれか。",kihon:true,
 choices:[
  ["約1.5 L",true,""],
  ["約180 L",false,"1日に糸球体で濾過される原尿の量。"],
  ["約150 mL",false,"乏尿の基準（400 mL以下）にあてはまる少ない量。"],
  ["約15 L",false,"実際の尿量の10倍にあたる量。"]],
 exp:"通常、1日で<b>約1.5 L</b>の尿が排泄される。（教科書 P173）"},

{q:"1日の尿量には下限（400〜500 mL）がある。その理由はどれか。",
 choices:[
  ["1日の代謝産物を排泄するのに必要な量だから",true,""],
  ["膀胱が尿意を感じる量だから",false,"尿意は膀胱に150〜300 mLたまったときに感じる（パートD）。"],
  ["糸球体で濾過される量の下限だから",false,"糸球体で濾過される原尿は尿量よりはるかに多く、尿量の下限とは関係しない。"],
  ["尿細管が再吸収できる水の上限を超えた分だから",false,"尿量は水の再吸収量を調節して増減する。再吸収の上限で決まるわけではない。"]],
 exp:"尿量は飲んだ水分量で増減するが、1日400〜500 mLが下限。これは<b>1日の代謝産物を排泄する</b>のに欠かせない量である。（教科書 P173）"},

{g:"ryo",q:"成人の乏尿の基準はどれか。",hosoku:true,
 choices:[
  ["1日400 mL以下",true,""],
  ["1日100 mL以下",false,"無尿の基準。"],
  ["1日1,500 mL以下",false,"健常成人のふつうの1日尿量くらい。"],
  ["1日3,000 mL以上",false,"多尿の基準。"]],
 exp:"補足知識（資料外）。1日の尿量が<b>400 mL以下</b>を乏尿、100 mL以下を無尿、3,000 mL以上を多尿という。"},

{g:"ryo",q:"成人の無尿の基準はどれか。",hosoku:true,
 choices:[
  ["1日100 mL以下",true,""],
  ["1日400 mL以下",false,"乏尿の基準。"],
  ["1日0 mL（まったく出ない）のときだけ",false,"尿がごく少量出ていても無尿という。"],
  ["1日3,000 mL以上",false,"多尿の基準。"]],
 exp:"補足知識（資料外）。1日の尿量が<b>100 mL以下</b>を無尿、400 mL以下を乏尿という。"},

/* ---------- 糸球体での濾過（P173〜174） ---------- */

{q:"糸球体で通常濾過されないのはどれか。",kihon:true,dobon:true,
 choices:[
  ["タンパク質",true,""],
  ["グルコース",false,"糸球体で濾過され、尿細管で再吸収される糖。"],
  ["Na⁺",false,"糸球体で濾過される電解質。"],
  ["水",false,"原尿の大部分を占め、濾過される。"]],
 exp:"水・Na⁺・K⁺・グルコースなどは濾過されてボーマン嚢へ出る。分子量の大きい<b>タンパク質</b>や血球は通常濾過されない。（教科書 P173・図12・4）"},

{q:"糸球体での濾過について誤っているのはどれか。",gori:true,
 choices:[
  ["血球は濾過されて原尿に含まれる",true,""],
  ["水・Na⁺・グルコースなどの血漿成分の一部がボーマン嚢へ出る",false,"教科書どおりの記述なので、正しい。"],
  ["濾過膜の透過性が非常に高いため、有効濾過圧が小さくても効果的に濾過される",false,"教科書どおりの記述なので、正しい。"],
  ["7 nm以上の粒子は濾過膜を通過しにくい",false,"教科書どおりの記述なので、正しい。"]],
 exp:"<b>血球</b>は大きく、通常は糸球体で濾過されない。（教科書 P173〜174）"},

{q:"1分間に糸球体で濾過される原尿の量を何というか。",kihon:true,
 choices:[
  ["糸球体濾過量（GFR）",true,""],
  ["腎血流量",false,"1分間に腎臓を流れる血液の量（パートC）。"],
  ["有効濾過圧",false,"血液が濾過される際の原動力となる圧。"],
  ["濾過率",false,"腎臓へ流入する血漿のうち、糸球体で濾過されるものの割合（パートC）。"]],
 exp:"1分間に濾過される原尿の量を<b>糸球体濾過量（GFR）</b>という。成人男性で約120 mL/分、成人女性で約110 mL/分。（教科書 P173）なお、体表面積1.73 m²当たりで補正した成人男性の正常値は125 mL/分とされる（教科書 P178、パートC）。"},

{g:"gfr",q:"糸球体濾過量（GFR）が増加するのはどれか。",
 choices:[
  ["血漿タンパク質濃度の低下",true,""],
  ["ショックによる血圧の著しい低下",false,"濾過を進める力が弱まる変化。"],
  ["腎結石によるボーマン嚢内圧の上昇",false,"濾過に逆らう力が強まる変化。"],
  ["糸球体毛細血管の血流量の減少",false,"濾過される血液そのものが減る変化。"]],
 exp:"<b>血漿タンパク質濃度が下がる</b>と、濾過に逆らう血漿膠質浸透圧が小さくなり、GFRは増加する。（教科書 P174）"},

{g:"gfr",q:"糸球体濾過量（GFR）が増加するのはどれか。",
 choices:[
  ["糸球体毛細血管の血圧の上昇",true,""],
  ["ボーマン嚢内圧の上昇",false,"濾過に逆らう力が強まる変化。"],
  ["血漿膠質浸透圧の上昇",false,"水を血管内に引き戻す力が強まる変化。"],
  ["膀胱内圧の上昇",false,"膀胱にたまった尿の圧で、糸球体での濾過には直接かかわらない。"]],
 exp:"濾過を進める<b>糸球体毛細血管の血圧が上がる</b>と、有効濾過圧が大きくなり、GFRは増加する。（教科書 P174）"},

{g:"gfr",q:"糸球体濾過量（GFR）が減少するのはどれか。",
 choices:[
  ["腎結石によるボーマン嚢内圧の上昇",true,""],
  ["血漿タンパク質濃度の低下",false,"濾過に逆らう血漿膠質浸透圧が小さくなる変化。"],
  ["糸球体毛細血管の血圧の上昇",false,"濾過を進める力が強まる変化。"],
  ["濾過膜の透過性の上昇",false,"物質が膜を通りやすくなる変化。"]],
 exp:"<b>ボーマン嚢内圧が上がる</b>と濾過に逆らう力が強まり、GFRは減少する。ショックで血圧が著しく下がったときも減少する。（教科書 P174）"},

{g:"atsu",q:"糸球体での濾過の原動力となるのはどれか。",kihon:true,
 choices:[
  ["糸球体毛細血管の血圧",true,""],
  ["血漿膠質浸透圧",false,"血漿タンパク質がつくる浸透圧。水を血管内に引き戻す向きにはたらく。"],
  ["ボーマン嚢内圧",false,"ボーマン嚢の中の圧。濾過される液を押し返す向きにはたらく。"],
  ["尿細管内の浸透圧",false,"尿細管での水の再吸収に関わる圧。"]],
 exp:"<b>糸球体毛細血管の血圧</b>が濾過を進め、血漿膠質浸透圧とボーマン嚢内圧がこれに逆らう。（教科書 P174・図12・4）"},

{g:"atsu",q:"有効濾過圧を求める式で正しいのはどれか（血圧＝糸球体毛細血管の血圧）。",kihon:true,dobon:true,
 choices:[
  ["血圧 −（血漿膠質浸透圧 ＋ ボーマン嚢内圧）",true,""],
  ["血圧 ＋ 血漿膠質浸透圧 ＋ ボーマン嚢内圧",false,"濾過に逆らう2つの圧まで足している。"],
  ["血圧 ＋ 血漿膠質浸透圧 − ボーマン嚢内圧",false,"血漿膠質浸透圧を、濾過を進める側に入れている。"],
  ["血漿膠質浸透圧 −（血圧 ＋ ボーマン嚢内圧）",false,"濾過を進める圧を、逆らう側に入れている。"]],
 exp:"濾過を進める血圧から、逆らう血漿膠質浸透圧とボーマン嚢内圧の和を引いた圧が<b>有効濾過圧</b>。（教科書 P174）"},

{g:"atsu",q:"糸球体毛細血管の血圧60 mmHg、血漿膠質浸透圧25 mmHg、ボーマン嚢内圧15 mmHgのとき、有効濾過圧はどれか。",
 choices:[
  ["20 mmHg",true,""],
  ["100 mmHg",false,"3つの圧をすべて足した値。"],
  ["50 mmHg",false,"血圧にボーマン嚢内圧を足し、血漿膠質浸透圧を引いた値。"],
  ["35 mmHg",false,"血圧から血漿膠質浸透圧だけを引いた値。"]],
 exp:"60 −（25＋15）＝<b>20 mmHg</b>。教科書の例（55 −（25＋15）＝15 mmHg）と同じ考え方。（教科書 P174）"},

{q:"有効濾過圧を決める血漿成分はどれか。",kihon:true,
 choices:[
  ["アルブミン",true,""],
  ["グルコース",false,"糸球体で濾過される糖。膠質浸透圧はつくらない。"],
  ["尿素",false,"タンパク質の代謝でできる窒素代謝産物。"],
  ["Na⁺",false,"血漿中に多い電解質で、糸球体で濾過される。"]],
 exp:"濾過に逆らう血漿膠質浸透圧は、血漿タンパク質（とくに<b>アルブミン</b>）がつくる。（教科書 P174・第8章）"},

{q:"タンパク質は分子が大きいため糸球体濾過膜を通りにくい。大きさのほかに、タンパク質の通過を妨げているのはどれか。",
 choices:[
  ["ボーマン嚢の内側をおおう足細胞が、強い陰電荷をもつこと",true,""],
  ["濾過膜の透過性が非常に低いこと",false,"濾過膜の透過性は実際には非常に高い。"],
  ["有効濾過圧が非常に大きいこと",false,"有効濾過圧は比較的小さい（15 mmHg程度）。"],
  ["ボーマン嚢内圧がタンパク質だけを押し返すこと",false,"ボーマン嚢内圧は濾過される液全体を押し返す圧で、物質を選ぶはたらきはない。"]],
 exp:"タンパク質は2段階で止められる。①7 nm以上の粒子は濾過膜を通りにくい（大きさ）。②<b>強い陰電荷をもつ足細胞</b>が通過を妨げる（電荷）。腎炎やネフローゼでこのしくみが壊れるとタンパク尿がみられる。（教科書 P174・図12・4）"},

{q:"腎炎やネフローゼで糸球体濾過膜に病変が生じたときにみられるのはどれか。",
 choices:[
  ["タンパク尿",true,""],
  ["糖尿",false,"尿中にグルコースが排泄される状態。"],
  ["多尿",false,"1日の尿量が異常に多い状態。"],
  ["アルカリ性の尿",false,"野菜を多く食べたときなどにみられる尿。"]],
 exp:"濾過膜に病変が生じるとタンパク質が濾過されてボーマン嚢へ入り、<b>タンパク尿</b>がみられる。（教科書 P174）"},

/* ---------- 尿細管での再吸収（P175〜176） ---------- */

{q:"原尿中の水が尿細管で再吸収される割合はどれか。",kihon:true,dobon:true,
 choices:[
  ["約99％",true,""],
  ["約80％",false,"近位尿細管だけで再吸収される割合。"],
  ["約50％",false,"実際よりかなり少ない。"],

{g:"nyo",q:"健常成人の尿について正しいのはどれか。",
 choices:[
  ["1日の尿の約95％は水分である",true,""],
  ["無機物の主成分は尿素である",false,"誤り。尿素は有機物の中心。"],
  ["新鮮な尿は無色透明である",false,"誤り。透明に近い黄色を示す。"],
  ["野菜をたくさん食べると酸性に傾く",false,"誤り。野菜を多く食べると逆の性質になる。"]],
 exp:"1日1.5 Lの尿のうち<b>95％は水分</b>。残りの5％は、塩化ナトリウム（約10 g）などの無機物と、尿素を中心とした有機物である。（教科書 P177）"},

];

let mode="normal", drawn=[], idx=0, score=0, streak=0, answered=false, dead=false;
let qmiss=0, totalMiss=0, firstTryCount=0; // ミス回数の集計（通常モード）
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function home(){
  document.getElementById("htt").textContent="確認テスト";
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="0";
  document.getElementById("bd").innerHTML=`
    <div class="center">
      <p class="lead">モードを選んでスタート。<br>問題は毎回シャッフルされ、プール${POOL.length}問から${PICK}問が出題されます。</p>
      <div class="modes">
        <button class="mode" onclick="start('normal')">
          <div class="nm">通常モード</div>
          <div class="ds">${PICK}問を最後まで解いて採点します。ふだんの確認用。<span class="mark kihon" style="margin-left:4px">🎯基本</span> は落としちゃダメな基本問題、<span class="mark gori">⚠ 誤りを選ぶ</span> は誤っているものを選ぶ問題、<span class="mark hosoku">📘 補足（資料外）</span> は教科書外の国試頻出テーマ。</div>
        </button>
        <button class="mode dob" onclick="start('dobon')">
          <div class="nm">💣 ドボンチャレンジ</div>
          <div class="ds">プールの中のごく一部、<b>絶対に落とせない最重要問題</b>だけが <b>💣ドボン！</b> に変身。それを外したらそこで終了。どこまで正解を続けられるか挑戦！</div>
        </button>
      </div>
    </div>`;
  document.getElementById("ctrl").innerHTML="";
}
function start(m){
  mode=m; drawn=draw();
  idx=0;score=0;streak=0;dead=false;totalMiss=0;firstTryCount=0;render();
}
function render(){
  answered=false; qmiss=0;
  const item=drawn[idx];
  const opts=shuffle(item.choices);
  const isDob=(mode==="dobon" && item.dobon);
  document.getElementById("htt").textContent=(mode==="dobon")?"ドボンチャレンジ":"確認テスト";
  document.getElementById("pg").textContent=`問 ${idx+1} / ${drawn.length}`;
  document.getElementById("bar").style.width=(idx/drawn.length*100)+"%";
  const L=["ア","イ","ウ","エ","オ"];
  let markHtml = isDob ? `<span class="mark dobon">💣 ドボン！</span>`
                       : (item.kihon ? `<span class="mark kihon">🎯 基本</span>` : "");
  if(item.gori)   markHtml += `<span class="mark gori">⚠ 誤りを選ぶ</span>`;
  if(item.hosoku) markHtml += `<span class="mark hosoku">📘 補足（資料外）</span>`;
  const qText = item.gori ? item.q.replace("誤っている",'<span class="ng">誤っている</span>') : item.q;
  let h=`<div class="qnum">Q${idx+1} ${markHtml}</div><div class="q">${qText}</div><div class="opts">`;
  opts.forEach((o,i)=>{h+=`<button class="opt" onclick="pick(this,${o[1]})"><span class="mk">${L[i]}</span><span>${o[0]}</span></button>`;});
  h+=`</div><div class="exp" id="exp"><div class="vd" id="vd"></div><div class="tx" id="tx"></div></div>`;
  document.getElementById("bd").innerHTML=h;
  document.getElementById("ctrl").innerHTML=`<button class="btn" id="nx" onclick="next()" disabled>解答を選んでください</button>`;
}
function pick(el,ok){
  if(answered)return;
  if(el.classList.contains("dis"))return;
  const item=drawn[idx];
  const isDob=(mode==="dobon" && item.dobon);
  const selText=el.querySelector("span:last-child").textContent;
  const selChoice=item.choices.find(c=>c[0]===selText);
  const exp=document.getElementById("exp");
  const nx=document.getElementById("nx");

  if(ok){
    answered=true;
    el.classList.add("correct");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    score++;
    if(mode!=="dobon"){ if(qmiss===0) firstTryCount++; }
    if(mode==="dobon") streak++;
    exp.className="exp show ok";
    document.getElementById("vd").textContent="正解！";
    document.getElementById("tx").innerHTML=item.exp;
    nx.disabled=false;
    nx.textContent=(idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶";
    return;
  }

  if(mode==="dobon"){
    answered=true;
    el.classList.add("wrong");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    if(item.dobon){ dead=true; }
    exp.className="exp show ng";
    document.getElementById("vd").textContent=isDob?"💣 ドボン！":"不正解";
    document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}`;
    nx.disabled=false;
    nx.textContent=dead?"結果を見る（ドボン）▶":((idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶");
    return;
  }

  qmiss++; totalMiss++;
  el.classList.add("wrong","dis");
  exp.className="exp show ng";
  document.getElementById("vd").textContent="不正解（ミス "+qmiss+"回）";
  document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}<br>ほかの選択肢からもう一度選んでください。`;
}
function next(){
  if(dead){result();return;}
  if(idx+1<drawn.length){idx++;render();}
  else result();
}
function result(){
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="100%";
  if(mode==="dobon"){
    document.getElementById("htt").textContent="結果";
    if(dead){
      document.getElementById("bd").innerHTML=`<div class="center score dead">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>ドボンを踏んでしまいました</div>
        <div class="big">${streak} 問連続正解</div>
        <div class="msg">${idx}問正解のあと、${idx+1}問目でドボン。<br>上の解説を復習して再挑戦しましょう。</div>
      </div>`;
    }else{
      document.getElementById("bd").innerHTML=`<div class="center score">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>クリア！</div>
        <div class="big">${score} / ${drawn.length}</div>
        <div class="msg">ドボンを踏まず完走しました。お見事！</div>
      </div>`;
    }
  }else{
    document.getElementById("htt").textContent="結果";
    const n=drawn.length;
    const ftPct=Math.round(firstTryCount/n*100);
    const noMiss=(totalMiss===0);
    let head = noMiss
      ? `<div class="big">✨ ノーミス パーフェクト！</div><div>全 ${n} 問を一発で正解</div>`
      : `<div>今回の成績</div><div class="big">${firstTryCount} / ${n}</div><div>一発正解率 ${ftPct}%</div>`;
    let stat = `<div class="stats">一発正解 ${firstTryCount}問　｜　総ミス ${totalMiss}回</div>`;
    let msg = noMiss?"完璧です。この調子！":ftPct>=60?"よくできました。ミスした問題を復習しましょう。":"もう一度スライドで確認してから挑戦しましょう。";
    document.getElementById("bd").innerHTML=`<div class="center score">${head}${stat}<div class="msg">${msg}</div></div>`;
  }
  document.getElementById("ctrl").innerHTML=`<button class="btn sub" onclick="home()">モード選択へ</button><button class="btn" onclick="start(mode)">もう一度（シャッフル）▶</button>`;
}
home();
</script>
</body>
</html>
