.slide{width:100%;max-width:820px;background:#fff;border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,.10);overflow:hidden}
.hd{background:#1e4d7b;padding:14px 28px;display:flex;align-items:center;justify-content:space-between}
.hd .ch{font-size:11px;color:#c4d9f0;font-weight:500;letter-spacing:.07em;margin-bottom:3px}

.mark{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px}
.mark.kihon{background:rgba(30,77,123,.13);color:#163a5c}
.mark.dobon{background:rgba(200,60,40,.14);color:#c33c28}
.mark.gori{background:rgba(168,50,46,.13);color:#a8322e;border:1px solid rgba(168,50,46,.35)}
.mark.hosoku{background:rgba(160,110,20,.14);color:#8a6314;border:1px solid rgba(160,110,20,.35)}
.q{font-size:16px;line-height:1.8;color:#1a1a1a;font-weight:500;margin-bottom:18px}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:left;font-size:14.5px;line-height:1.6;color:#222;background:#f8f9fb;border:1.5px solid #e5e7eb;border-radius:9px;padding:12px 15px;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;gap:10px;align-items:flex-start}
.opt .mk{flex-shrink:0;width:22px;height:22px;border-radius:50%;border:1.5px solid #c3c8d0;color:#888;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.opt:not(.dis):hover{border-color:#1e4d7b;background:#eef3f9}

.exp .tx b{color:#111}

.btn:hover{background:#163a5c}

.btn.sub:hover{background:#f0f2f5}
.center{text-align:center;padding:14px 10px}
.center .lead{font-size:14px;color:#555;line-height:1.8;margin-bottom:20px}
.modes{display:flex;flex-direction:column;gap:12px;max-width:470px;margin:0 auto}
.mode{text-align:left;border:1.5px solid #e5e7eb;border-radius:11px;padding:15px 18px;cursor:pointer;background:#fff;transition:all .15s;font-family:inherit}

.score .big{font-size:40px;font-weight:700;color:#1e4d7b;margin:6px 0}

.score .stats{display:inline-block;margin-top:12px;font-size:13px;font-weight:600;color:#163a5c;background:rgba(30,77,123,.09);padding:7px 16px;border-radius:20px}
.tag{display:inline-block;font-size:12px;font-weight:600;color:#1e4d7b;background:rgba(30,77,123,.1);padding:3px 12px;border-radius:20px;margin-bottom:6px}

<h1>生理学 第4章 運動の生理｜パートC2 確認テスト（誘発筋電図と複雑な反射）</h1>
<div class="slide">
  <div class="hd"><div><div class="ch">第4章 運動の生理 ｜ C2 誘発筋電図と複雑な反射</div><div class="tt" id="htt">確認テスト</div></div><div class="pg" id="pg"></div></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="bd" id="bd"></div>
  <div class="ctrl" id="ctrl"></div>
</div>
<script>
/* ===== 問題プール ===== */
const PICK=5;
const POOL=[
{q:"誘発筋電図とはどのような筋電図か。",
 choices:[
 ["末梢神経や筋を電気刺激して得られる筋電図",true,""],
 ["随意収縮をしているときに筋から記録する筋電図",false,"自発的な活動を記録したもので、刺激を加えていない。"],
 ["安静時に筋から自然に生じる電位を記録した筋電図",false,"刺激を加えずに記録したものである。"],
 ["脳の電気活動を頭皮から記録したもの",false,"筋ではなく脳の活動の記録である。"]],
 exp:"末梢神経を刺激することで、伸張反射を模倣した単シナプス反射を誘発できる。このように刺激して得られる筋電図を誘発筋電図と呼ぶ（P51）。"},

{q:"末梢神経を電気刺激したとき、最初に刺激される線維はどれか。",kihon:true,dobon:true,
 choices:[
 ["Ia群線維",true,""],
 ["α運動ニューロンの軸索",false,"閾値が高く、刺激を強めてから刺激される。"],
 ["Ib群線維",false,"腱の受容器から出る求心性線維である。"],
 ["γ運動ニューロンの軸索",false,"錘内筋を支配する細い遠心性線維である。"]],
 exp:"電気刺激をすると、もっとも太いIa群線維が最初に刺激される（P51）。太い線維ほど閾値が低い。"},

{q:"H波（H反射）について正しいのはどれか。",kihon:true,
 choices:[
 ["伸張反射を電気刺激によって模倣したものである",true,""],
 ["ゴルジ腱器官からの信号によって生じる",false,"腱の張力を検出する受容器は関与していない。"],
 ["中枢内で複数のシナプスを介して生じる",false,"介在神経を介さない経路で生じる。"],
 ["筋を直接電気刺激することで生じる",false,"刺激しているのは末梢神経である。"]],
 exp:"末梢神経を刺激するともっとも太いIa群線維が最初に刺激され、伸張反射と同様にα運動ニューロンが興奮して筋電図上にH波が現れる。つまり伸張反射（単シナプス反射）を電気刺激で模倣したものである（P51）。"},

{q:"下腿の筋でH波とM波を記録するとき、電気刺激する部位はどれか。",
 choices:[
 ["膝窩部で脛骨神経",true,""],
 ["肘窩部で正中神経",false,"上肢での刺激部位である。"],
 ["鼠径部で大腿神経",false,"大腿の前面の筋を支配する神経の走る部位である。"],
 ["足関節部で腓骨神経",false,"下腿よりも末梢にあたり、下腿の筋を支配する枝はすでに分かれている。"]],
 exp:"下腿の筋で誘発筋電図を記録するときは、膝窩部で脛骨神経を電気刺激し、強度を徐々に上げていく（P51、図4・7）。"},

{q:"H波について正しいのはどれか。",kihon:true,dobon:true,
 choices:[
 ["脊髄のα運動ニューロンを経由するため、潜時が長い",true,""],
 ["筋へ直接向かう活動電位によって生じ、潜時が短い",false,"もう一方の波の説明になっている。"],
 ["刺激を強くするほど振幅が大きくなり続ける",false,"途中から減少に転じる。"],
 ["反射回路を介さずに生じる",false,"反射を介して生じる波である。"]],
 exp:"Ia群線維で起こった活動電位は伸張反射と同様にα運動ニューロンを興奮させ、筋電図上に潜時の長いH波が現れる。これをH反射と呼ぶ（P51）。"},

{q:"H波の潜時がM波より長いのはなぜか。",kihon:true,
 choices:[
 ["興奮が脊髄まで伝わり、α運動ニューロンを経由してから筋へ戻るため",true,""],
 ["刺激される線維の伝導速度が、神経線維の中でとくに遅いため",false,"最初に刺激される線維は神経線維の中でもっとも速い。"],
 ["加える電気刺激の強さが弱いため",false,"刺激の強さは潜時を決める要因ではない。"],
 ["筋が収縮を始めるまでに時間がかかるため",false,"波が遅れるのは筋の側の事情によるものではない。"]],
 exp:"H波はIa群線維→脊髄→α運動ニューロン→筋という遠回りの経路をたどるため、筋へ直接向かう活動電位によるM波より潜時が長くなる（P51、図4・7）。"},

{q:"M波について正しいのはどれか。",kihon:true,dobon:true,
 choices:[
 ["刺激が強くなるにつれて振幅が大きくなる",true,""],
 ["刺激が強くなると振幅が小さくなり、やがて消失する",false,"もう一方の波にあてはまる変化である。"],
 ["脊髄を経由して生じるため、潜時が長い",false,"脊髄を経由せずに生じる波である。"],
 ["Ia群線維が刺激されることで生じる",false,"より閾値の高い線維が刺激されて生じる。"]],
 exp:"強い刺激でα運動ニューロンの軸索も刺激されると、筋に向かう活動電位によって潜時の短いM波が現れる。M波は刺激が強くなるにつれて振幅が大きくなる（P51）。"},

{q:"電気刺激の強度を徐々に上げていったとき、H波の振幅はどのように変化するか。",kihon:true,
 choices:[
 ["はじめは大きくなるが、ある強度から減少し、やがて消失する",true,""],
 ["刺激の強さにかかわらず一定である",false,"刺激強度によって変化する。"],
 ["はじめから一貫して小さくなり続ける",false,"はじめは大きくなる。"],
 ["はじめは小さくなるが、途中から大きくなり続ける",false,"変化の向きが逆である。"]],
 exp:"刺激強度を上げるとH波の振幅は大きくなるが、ある強度まで高まると減少し始め、やがて完全に消失する（P51、図4・7）。"},

{q:"H波の振幅が減少し始めるのはなぜか。",kihon:true,
 choices:[
 ["Ia群線維よりも閾値が高いα運動ニューロンの軸索も刺激されるため",true,""],
 ["Ia群線維が疲労して興奮できなくなるため",false,"線維の疲労によるものではない。"],
 ["筋紡錘の感度が下がって信号が弱くなるため",false,"電気刺激では受容器を介していない。"],
 ["脊髄のシナプスが抑制されるため",false,"シナプスの抑制によるものではない。"]],
 exp:"強い電気刺激によって、Ia群線維よりも閾値が高いα運動ニューロンの軸索も刺激されるためである（P51）。"},

{q:"H波が完全に消失してしまうのはなぜか。",
 choices:[
 ["逆行する活動電位と、α運動ニューロンを下行してきた活動電位とが衝突して、両者とも消えるため",true,""],
 ["刺激がIa群線維に届かなくなるため",false,"強い刺激でも届かなくなることはない。"],
 ["脊髄の反射中枢が疲労してしまうため",false,"中枢の疲労によるものではない。"],
 ["筋が強く収縮して電位が記録できなくなるため",false,"記録できなくなるからではない。"]],
 exp:"逆行する活動電位は、α運動ニューロンを下行してきたH波を起こすはずの活動電位と衝突し、両者ともに消失してしまう（P51）。"},

{q:"α運動ニューロンの軸索が刺激されたときに生じるものはどれか。",
 choices:[
 ["筋に向かう活動電位と、正常では起こらない脊髄へ逆行する活動電位",true,""],
 ["筋に向かう活動電位だけ",false,"正常では起こらないもう一方の活動電位も生じる。"],
 ["脊髄へ逆行する活動電位だけ",false,"筋に向かう活動電位も同時に生じる。"],
 ["筋紡錘へ向かう求心性の活動電位",false,"求心性線維ではないので、この向きには生じない。"]],
 exp:"この刺激により、筋に向かう活動電位と、正常では起こらない脊髄へ逆行する活動電位が生じる（P51）。"},

{q:"H波とM波について誤っているのはどれか。",gori:true,
 choices:[
 ["M波はH波より潜時が長い",true,""],
 ["H波は伸張反射を電気刺激で模倣したものである",false,"教科書どおりの記述なので、正しい。"],
 ["M波は刺激が強くなるにつれて振幅が大きくなる",false,"教科書どおりの記述なので、正しい。"],
 ["電気刺激をすると、もっとも太い線維が最初に刺激される",false,"教科書どおりの記述なので、正しい。"]],
 exp:"M波は筋へ直接向かう活動電位によって生じるため潜時が短く、脊髄のα運動ニューロンを経由するH波のほうが潜時は長い（P51）。"},

{q:"H波とM波について正しいのはどれか。",kihon:true,
 choices:[
 ["電気刺激を強くしていくと、H波は消失するが、M波は振幅が大きくなる",true,""],
 ["H波はM波より潜時が短い",false,"脊髄を経由するぶん、時間のかかり方が逆になる。"],
 ["M波はIa群線維が刺激されることで生じる",false,"より閾値の高い線維が刺激されて生じる波である。"],
 ["H波は反射回路を介さずに生じる",false,"脊髄を経由して生じる波である。"]],
 exp:"刺激を強めるとα運動ニューロンの軸索が刺激され、M波の振幅は大きくなる。一方、逆行する活動電位との衝突によってH波はやがて完全に消失する（P51、図4・7）。"},

{q:"膝蓋腱反射の反射中枢がある脊髄分節はどれか。",hosoku:true,
 choices:[
 ["L2〜L4",true,""],
 ["C5〜C6",false,"上腕二頭筋反射の中枢とされる高さである。"],
 ["C7",false,"上腕三頭筋反射の中枢とされる高さである。"],
 ["L5〜S2",false,"アキレス腱反射の中枢とされる高さである。"]],
 exp:"補足知識（資料外）。国試では深部腱反射と中枢の高さの組合せがくり返し問われている。膝蓋腱反射＝L2〜L4、アキレス腱反射＝L5〜S2、上腕二頭筋反射＝C5〜C6、上腕三頭筋反射＝C7。教科書には分節の高さの記載はない。"},

{q:"屈曲反射の別名はどれか。",kihon:true,
 choices:[
 ["引っ込め反射",true,""],
 ["伸展反射",false,"肢を伸ばす向きの反応を指す語である。"],
 ["立ち直り反射",false,"頭部や体幹をまっすぐに保つための反射である（P54）。"],
 ["把握反射",false,"手のひらへの刺激で握り込む反射である。"]],
 exp:"皮膚や筋に侵害刺激が加わると、その部位を引っ込める反射が起こる。これを屈曲反射（引っ込め反射）と呼ぶ（P51〜52）。"},

{q:"屈曲反射のきっかけとなる受容器はどれか。",
 choices:[
 ["侵害受容器",true,""],
 ["筋紡錘",false,"筋の長さの変化を監視する受容器である。"],
 ["ゴルジ腱器官",false,"筋が発生する張力を検出する受容器である。"],
 ["半規管",false,"頭部の傾きや回転を検出する内耳の器官である。"]],
 exp:"侵害受容器で生まれた求心性信号が、脊髄内でいくつかのニューロンを介して運動ニューロンにはたらく（P51〜52）。"},

{q:"屈曲反射が起こるとき、刺激を受けた側で起こることはどれか。",kihon:true,dobon:true,
 choices:[
 ["屈筋が緊張し、伸筋が弛緩する",true,""],
 ["屈筋が弛緩し、伸筋が緊張する",false,"反対側の肢で起こる反応である。"],
 ["屈筋と伸筋が同時に緊張する",false,"関節が動かず、刺激から遠ざかれない。"],
 ["屈筋と伸筋がともに弛緩する",false,"肢を引っ込める動きが起こらない。"]],
 exp:"求心性信号は屈筋を支配する運動ニューロンを興奮させる一方、伸筋を支配する運動ニューロンを抑制する。その結果、関節は屈曲する（P51〜52）。"},

{q:"多シナプス反射はどれか。",hosoku:true,
 choices:[
 ["屈曲反射",true,""],
 ["膝蓋腱反射",false,"介在ニューロンを介さずに起こる反射である。"],
 ["アキレス腱反射",false,"下腿三頭筋で起こる、介在ニューロンを介さない反射である。"],
 ["上腕二頭筋反射",false,"上腕二頭筋で起こる、介在ニューロンを介さない反射である。"]],
 exp:"補足知識（資料外）。中枢内でシナプスを2個以上介する反射を多シナプス反射と呼ぶ。交叉性伸展反射や腹壁反射も該当し、腱反射（伸張反射）は単シナプス反射である。教科書は「いくつかのニューロンを介して」と書いており、多シナプス反射という語は使っていない（P51〜52）。"},

{q:"交叉性伸展反射が起こるとき、刺激を受けた側と反対側で起こることはどれか。",kihon:true,
 choices:[
 ["屈筋が弛緩し、伸筋が収縮する",true,""],
 ["屈筋が収縮し、伸筋が弛緩する",false,"刺激を受けた側で起こる反応である。"],
 ["屈筋と伸筋が同時に収縮する",false,"体重を支える肢の伸展が起こらない。"],
 ["どちらの筋にも変化は起こらない",false,"反射が起こっていないことになる。"]],
 exp:"交叉性伸展反射では、屈曲反射とは逆に、屈筋が弛緩し伸筋が収縮する（P52、図4・8）。"},

{q:"交叉性伸展反射が起こる意味はどれか。",kihon:true,
 choices:[

let mode="normal", drawn=[], idx=0, score=0, streak=0, answered=false, dead=false;
let qmiss=0, totalMiss=0, firstTryCount=0; // ミス回数の集計（通常モード）
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function home(){
  document.getElementById("htt").textContent="確認テスト";
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="0";
  document.getElementById("bd").innerHTML=`
    <div class="center">
      <p class="lead">モードを選んでスタート。<br>問題は毎回シャッフルされ、プール${POOL.length}問から${PICK}問が出題されます。</p>
      <div class="modes">
        <button class="mode" onclick="start('normal')">
          <div class="nm">通常モード</div>
          <div class="ds">${PICK}問を最後まで解いて採点します。ふだんの確認用。<span class="mark kihon" style="margin-left:4px">🎯基本</span> は落としちゃダメな基本問題、<span class="mark gori">⚠ 誤りを選ぶ</span> は誤っているものを選ぶ問題、<span class="mark hosoku">📘 補足（資料外）</span> は教科書外の国試頻出テーマ。</div>
        </button>
        <button class="mode dob" onclick="start('dobon')">
          <div class="nm">💣 ドボンチャレンジ</div>
          <div class="ds">プールの中のごく一部、<b>絶対に落とせない最重要問題</b>だけが <b>💣ドボン！</b> に変身。それを外したらそこで終了。どこまで正解を続けられるか挑戦！</div>
        </button>
      </div>
    </div>`;
  document.getElementById("ctrl").innerHTML="";
}
function start(m){
  mode=m; drawn=shuffle(POOL).slice(0,Math.min(PICK,POOL.length));
  idx=0;score=0;streak=0;dead=false;totalMiss=0;firstTryCount=0;render();
}
function render(){
  answered=false; qmiss=0;
  const item=drawn[idx];
  const opts=shuffle(item.choices);
  const isDob=(mode==="dobon" && item.dobon);
  document.getElementById("htt").textContent=(mode==="dobon")?"ドボンチャレンジ":"確認テスト";
  document.getElementById("pg").textContent=`問 ${idx+1} / ${drawn.length}`;
  document.getElementById("bar").style.width=(idx/drawn.length*100)+"%";
  const L=["ア","イ","ウ","エ","オ"];
  // ドボン対象の問題だけ💣に変わる。それ以外の🎯基本は通常どおり🎯のまま表示する
  let markHtml = isDob ? `<span class="mark dobon">💣 ドボン！</span>`
                       : (item.kihon ? `<span class="mark kihon">🎯 基本</span>` : "");
  if(item.gori)   markHtml += `<span class="mark gori">⚠ 誤りを選ぶ</span>`;
  if(item.hosoku) markHtml += `<span class="mark hosoku">📘 補足（資料外）</span>`;
  // 誤り選択問題は、設問中の「誤っている」を赤字にして読み飛ばしを防ぐ
  const qText = item.gori ? item.q.replace("誤っている",'<span class="ng">誤っている</span>') : item.q;
  let h=`<div class="qnum">Q${idx+1} ${markHtml}</div><div class="q">${qText}</div><div class="opts">`;
  opts.forEach((o,i)=>{h+=`<button class="opt" onclick="pick(this,${o[1]})"><span class="mk">${L[i]}</span><span>${o[0]}</span></button>`;});
  h+=`</div><div class="exp" id="exp"><div class="vd" id="vd"></div><div class="tx" id="tx"></div></div>`;
  document.getElementById("bd").innerHTML=h;
  document.getElementById("ctrl").innerHTML=`<button class="btn" id="nx" onclick="next()" disabled>解答を選んでください</button>`;
}
function pick(el,ok){
  if(answered)return;
  if(el.classList.contains("dis"))return; // 無効化済みの選択肢は再カウントしない
  const item=drawn[idx];
  const isDob=(mode==="dobon" && item.dobon);
  const selText=el.querySelector("span:last-child").textContent;
  const selChoice=item.choices.find(c=>c[0]===selText);
  const exp=document.getElementById("exp");
  const nx=document.getElementById("nx");

  if(ok){
    // 正解：ここで確定。正解した選択肢だけ緑にする（不正解の選択肢は先に色を変えない）
    answered=true;
    el.classList.add("correct");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    score++;
    if(mode!=="dobon"){ if(qmiss===0) firstTryCount++; }
    if(mode==="dobon") streak++;
    exp.className="exp show ok";
    document.getElementById("vd").textContent="正解！";
    document.getElementById("tx").innerHTML=item.exp;
    nx.disabled=false;
    nx.textContent=(idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶";
    return;
  }

  // 不正解
  if(mode==="dobon"){
    // ドボンモードは一発勝負：選び直しなし・正解は伏せる
    answered=true;
    el.classList.add("wrong");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    if(item.dobon){ dead=true; } // 💣ドボン対象を外したときだけ終了
    exp.className="exp show ng";
    document.getElementById("vd").textContent=isDob?"💣 ドボン！":"不正解";
    document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}`;
    nx.disabled=false;
    nx.textContent=dead?"結果を見る（ドボン）▶":((idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶");
    return;
  }

  // 通常モード：ミスを数え、選んだ選択肢だけ赤にして無効化。正解は伏せたまま選び直せる
  qmiss++; totalMiss++;
  el.classList.add("wrong","dis");
  exp.className="exp show ng";
  document.getElementById("vd").textContent="不正解（ミス "+qmiss+"回）";
  document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}<br>ほかの選択肢からもう一度選んでください。`;
  // 「次へ」はまだ出さない（正解するまで進めない）
}
function next(){
  if(dead){result();return;}
  if(idx+1<drawn.length){idx++;render();}
  else result();
}
function result(){
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="100%";
  if(mode==="dobon"){
    document.getElementById("htt").textContent="結果";
    if(dead){
      document.getElementById("bd").innerHTML=`<div class="center score dead">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>ドボンを踏んでしまいました</div>
        <div class="big">${streak} 問連続正解</div>
        <div class="msg">${idx}問正解のあと、${idx+1}問目でドボン。<br>上の解説を復習して再挑戦しましょう。</div>
      </div>`;
    }else{
      document.getElementById("bd").innerHTML=`<div class="center score">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>クリア！</div>
        <div class="big">${score} / ${drawn.length}</div>
        <div class="msg">ドボンを踏まず完走しました。お見事！</div>
      </div>`;
    }
  }else{
    document.getElementById("htt").textContent="結果";
    const n=drawn.length;
    const ftPct=Math.round(firstTryCount/n*100);
    const noMiss=(totalMiss===0);
    let head = noMiss
      ? `<div class="big">✨ ノーミス パーフェクト！</div><div>全 ${n} 問を一発で正解</div>`
      : `<div>今回の成績</div><div class="big">${firstTryCount} / ${n}</div><div>一発正解率 ${ftPct}%</div>`;
    let stat = `<div class="stats">一発正解 ${firstTryCount}問　｜　総ミス ${totalMiss}回</div>`;
    let msg = noMiss?"完璧です。この調子！":ftPct>=60?"よくできました。ミスした問題を復習しましょう。":"もう一度スライドで確認してから挑戦しましょう。";
    document.getElementById("bd").innerHTML=`<div class="center score">${head}${stat}<div class="msg">${msg}</div></div>`;
  }
  document.getElementById("ctrl").innerHTML=`<button class="btn sub" onclick="home()">モード選択へ</button><button class="btn" onclick="start(mode)">もう一度（シャッフル）▶</button>`;
}
home();
</script>
</body>
</html>
