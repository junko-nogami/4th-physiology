<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第10章 循環 パートB｜生理学スライド</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:#f0f2f5;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 12px}
h1{font-size:14px;color:#555;margin-bottom:16px;font-weight:400;letter-spacing:.05em}
.slide{width:100%;max-width:820px;background:#fff;border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,.10);overflow:hidden}
.hd{background:#8c2a2a;padding:14px 28px}
.hd .ch{font-size:11px;color:#f0c4c4;font-weight:500;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.hd .tt{font-size:20px;font-weight:500;color:#fff}
.bd{padding:20px 28px 16px;background:#fff}
.sec{font-size:10px;font-weight:600;color:#888;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.box{background:#f8f9fb;border:1px solid #e5e7eb;border-radius:8px;padding:14px 18px;margin-bottom:12px}
.row{display:block;font-size:14px;line-height:1.9;color:#222;padding:5px 0;border-bottom:1px solid #e5e7eb}
.row:last-child{border-bottom:none}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#8c2a2a;color:#fff;padding:8px 10px;font-weight:500;text-align:left;font-size:12px}
.tbl td{padding:8px 10px;border-bottom:1px solid #e5e7eb;vertical-align:top;color:#222;line-height:1.7}
.tbl tr:last-child td{border-bottom:none}
.tbl td:first-child{font-weight:600;color:#8c2a2a;white-space:nowrap;min-width:110px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:4px;margin-bottom:7px}
.tf{background:rgba(140,42,42,.12);color:#8c2a2a}
.tb{background:rgba(42,90,140,.12);color:#2a5a8c}
.blank{display:inline-block;min-width:72px;border-bottom:2.5px solid #8c2a2a;border-radius:3px 3px 0 0;cursor:pointer;text-align:center;padding:0 5px;transition:all .22s;position:relative;vertical-align:baseline}
.blank::after{content:"？";font-size:12px;color:#8c2a2a;opacity:.45;position:absolute;left:50%;transform:translateX(-50%)}
.blank span{visibility:hidden;font-weight:600;color:#8c2a2a;font-size:14px;opacity:0;transition:opacity .22s;display:inline-block}
.blank.on{border-bottom-color:transparent;background:rgba(140,42,42,.1);border-radius:4px;padding:1px 7px}
.blank.on::after{display:none}
.blank.on span{visibility:visible;opacity:1}
.blank:not(.on):hover{background:rgba(140,42,42,.07)}
.ctrl{display:flex;align-items:center;gap:8px;padding:10px 28px 12px;background:#f8f9fb;border-top:1px solid #e5e7eb;flex-wrap:wrap}
.btn{padding:7px 15px;border-radius:6px;border:1px solid #d1d5db;background:#fff;color:#333;font-size:12px;cursor:pointer;font-family:inherit;transition:background .15s}
.btn:hover{background:#f0f2f5}
.btnp{background:#8c2a2a;color:#fff;border-color:#8c2a2a}
.btnp:hover{background:#6f2020}
.cnt{font-size:11px;color:#888;margin-left:auto}
.nav{display:flex;align-items:center;gap:7px;padding:9px 28px 11px;background:#f8f9fb;border-top:1px solid #e5e7eb;border-radius:0 0 12px 12px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:#d1d5db;cursor:pointer;transition:background .18s;flex-shrink:0}
.dot.a{background:#8c2a2a}
.pg{font-size:11px;color:#888;margin-left:auto}
</style>
</head>
<body>
<h1>生理学 第10章 循環｜パートB：心電図・心臓の活動周期</h1>
<div class="slide">
  <div id="sc"></div>
  <div class="ctrl">
    <button class="btn" onclick="nxt()">次のカッコを開く ▶</button>
    <button class="btn" onclick="showAll()">すべて表示</button>
    <button class="btn" onclick="rst()">リセット</button>
    <button class="btn btnp" onclick="go(cur-1)">◀ 前へ</button>
    <button class="btn btnp" onclick="go(cur+1)">次へ ▶</button>
    <span class="cnt" id="cnt"></span>
  </div>
  <div class="nav" id="nav"></div>
</div>
<script>
const S=[
{t:"心電図とは",ch:"第10章 循環 ｜ A-3 心電図",type:"p",
rows:[
{t:"心臓を取り巻く体液および組織は [電導体] である．",b:["電導体"]},
{t:"心筋細胞の興奮伝導による [膜電位] の変化は，心臓周囲組織の電位差分布の変化をつくる．",b:["膜電位"]},
{t:"[心電図]（ECG）は，心臓の電気活動による胸部の電位分布の変化を [皮膚上] に置いた電極でとらえたものである．",b:["心電図","皮膚上"]},
{t:"心電図の測定法には [双極誘導法] と [単極誘導法] がある．",b:["双極誘導法","単極誘導法"]},
]},
{t:"心電図の誘導法",ch:"第10章 循環 ｜ A-3 心電図",type:"two",
left:{label:"① 双極誘導法",rows:[
{t:"左右の手および [左足] のいずれか2点から記録する方法．",b:["左足"]},
{t:"両腕間を [第Ⅰ誘導] と呼ぶ．",b:["第Ⅰ誘導"]},
{t:"右手と左足間を [第Ⅱ誘導] と呼ぶ．",b:["第Ⅱ誘導"]},
{t:"左手と左足間を [第Ⅲ誘導] と呼ぶ．",b:["第Ⅲ誘導"]},
{t:"左右の手と左足を頂点とする [アイントーベン] の正三角形モデルをつくり，その各辺を第Ⅰ，Ⅱ，Ⅲ誘導と呼ぶ（図10・4）．",b:["アイントーベン"]},
]},
right:{label:"② 単極誘導法",rows:[
{t:"一方の極に，電位が心起電力の影響を受けない電極（[不関電極]）を用いる誘導法．",b:["不関電極"]},
{t:"[単極胸部誘導]（V₁〜V₆）がある．",b:["単極胸部誘導"]},
{t:"[単極肢誘導]（aV<sub>R</sub>，aV<sub>L</sub>，aV<sub>F</sub>）がある．",b:["単極肢誘導"]},
{t:"※補足知識（資料外）：標準12誘導心電図＝双極肢誘導3＋単極肢誘導3＋単極胸部誘導6．",b:[]},
]}},
{t:"正常心電図の基本",ch:"第10章 循環 ｜ A-3 心電図",type:"p",
rows:[
{t:"心電図の形態は，一般に [第Ⅱ誘導] 心電図が基準とされている．",b:["第Ⅱ誘導"]},
{t:"心電図は，心筋細胞の電気活動の [総和] としてとらえられる．",b:["総和"]},
{t:"心電図は 0.05〜100Hz の [バンドパスフィルター] を介して記録されるので，電位変化の [直流成分] はカットされている．",b:["バンドパスフィルター","直流成分"]},
{t:"すなわち，電位の [絶対値] でなく，その [変化値] が示されている．",b:["絶対値","変化値"]},
{t:"通常，心電図は [10mm] を 1mV，[25mm] を 1秒として記録する（図10・4）．",b:["10mm","25mm"]},
]},
{t:"心電図の波形",ch:"第10章 循環 ｜ A-3 心電図",type:"tbl",
cols:["波形・区間","意味"],
rows:[
["1) P波","[左右の心房筋] が [脱分極] することによって生じる波"],
["2) QRS波","[心室] の脱分極によって生じる波"],
["3) T波","心室の [再分極] の過程を示す波"],
["4) PQ（PR）時間","Pの始まりからQRS波の始まりまで．[房室伝導] に要する時間を示す"],
["5) QRS幅","Q（R）の始まりからR（S）の終わりまで．[心室内伝導時間] を示す"],
["6) ST部分","QRS波の終わりからT波の始まりまで．[心室全体の興奮状態] を示す．大きな電位変化がないため [基線] に近くなる"],
["7) QT時間","QRS波の始まりからT波の終わりまで．心室の [脱分極開始] から [再分極終了] までの時間"],
["8) 基線","[T波] の終わりと次の [P波] の始めを結ぶ線"],
],
},
{t:"心電図の判読",ch:"第10章 循環 ｜ A-3 心電図",type:"p",
rows:[
{t:"1) [リズム] の異常はないか？（[R-R] の間隔をみる）",b:["リズム","R-R"]},
{t:"2) [洞房結節] がペースメーカーになっているか？（[P波] と QRS波との関係）",b:["洞房結節","P波"]},
{t:"3) [興奮伝導] に異常はないか？（PQ，QRS，QT などの時間）",b:["興奮伝導"]},
{t:"4) 各波形の [振幅] に異常はないか？（mV で電位を判断）",b:["振幅"]},
{t:"5) 波形そのものに異常はないか？（P波，QRS幅の変化，ST-Tの変化など）",b:[]},
{t:"6) 心臓の [電気軸] に異常はないか？",b:["電気軸"]},
{t:"判読によって得られる情報は，[不整脈]，[心筋障害]，心房や心室の肥大・拡張などが主なものである．",b:["不整脈","心筋障害"]},
]},
{t:"異常心電図の例",ch:"第10章 循環 ｜ A-3 心電図",type:"two",
left:{label:"期外収縮",rows:[
{t:"[興奮生成] 異常により生じる．",b:["興奮生成"]},
{t:"発生部位により [心室性期外収縮] と [上室性]（心房ないし房室結節周辺から発生するもの）期外収縮に分けられる．",b:["心室性期外収縮","上室性"]},
{t:"心室性期外収縮では，[P波] を先行しない [幅の広い] 変形したQRS波が早期に出現する．",b:["P波","幅の広い"]},
{t:"期外収縮をはさんだ R-R 間隔の長さにより [代償性] と [間入性] を区別する（図10・5）．",b:["代償性","間入性"]},
]},
right:{label:"心筋障害",rows:[
{t:"心筋障害は [狭心症] と [心筋梗塞] を含む．",b:["狭心症","心筋梗塞"]},
{t:"狭心症は [一過性] の心筋の虚血により生じる．",b:["一過性"]},
{t:"心筋梗塞は心筋の虚血による [心筋細胞の壊死] を伴う．",b:["心筋細胞の壊死"]},
{t:"心筋梗塞の急性期には [ST上昇] や [異常Q波] が出現し，後に [冠性T波]（左右対称性の陰性T波）がみられる（図10・5）．",b:["ST上昇","異常Q波","冠性T波"]},
{t:"出現時期：ST上昇＝発作直後〜数時間，異常Q波＝数時間〜12時間，冠性T波＝2日〜1週間（図10・5）．",b:[]},
]}},
{t:"心臓の活動周期",ch:"第10章 循環 ｜ A-4 心臓の活動周期",type:"p",
rows:[
{t:"[収縮] と [拡張] を1周期とし，活動周期ごとに興奮伝導と固有心筋の収縮，そして [弁の開閉] が順序正しく行われる．",b:["収縮","拡張","弁の開閉"]},
{t:"心臓の活動周期は，[心室] の活動を中心に [5期] に分けられる（図10・6）．",b:["心室","5期"]},
{t:"【5期の順番】① [心房収縮期] → ② [等容性心室収縮期] → ③ [心室駆出期] → ④ [等容性心室弛緩期] → ⑤ [受動的心室充満期]",b:["心房収縮期","等容性心室収縮期","心室駆出期","等容性心室弛緩期","受動的心室充満期"]},
]},
{t:"活動周期の各期（1）",ch:"第10章 循環 ｜ A-4 心臓の活動周期",type:"tbl",
cols:["時期","内容"],
rows:[
["① 心房収縮期","ペースメーカー細胞の興奮が心房筋に伝わり心房筋が興奮すると（心電図 [P波]），心房が収縮する．"],
["（血液の流入）","心房から心室への血液の流入は，[受動的心室充満期] に開始されており，心房収縮による流入は [少量] である．"],
["（拡張期末容量）","心房収縮期の最後（心室収縮開始前）の心室の容量を [拡張期末容量]（EDV）と呼ぶ．"],
["② 等容性心室収縮期","心室筋が興奮すると（心電図 [QRS波]），心室が収縮を開始する．心室内圧が上昇し [房室弁]（左：僧帽弁，右：三尖弁）が閉鎖し，[心音図第Ⅰ音]（S1）が記録される．"],
["（等容性収縮）","房室弁閉鎖から [半月弁] が開くまでは，心室容積は [一定] であり，心室内圧は上昇する．"],
["（最低血圧）","動脈圧は半月弁が開く直前が最低値を示し，この圧を [拡張期血圧] あるいは [最低血圧] という．"],
],
},
{t:"活動周期の各期（2）",ch:"第10章 循環 ｜ A-4 心臓の活動周期",type:"tbl",
cols:["時期","内容"],
rows:[
["③ 心室駆出期","心室内圧が [動脈圧] より高くなると，[半月弁] が開き，心室の血液は動脈へ駆出される．"],
["（最高血圧）","駆出期間中は心室内圧と動脈圧が等しくなり，圧力が最大になる点がある．この最大圧力を [収縮期血圧] あるいは [最高血圧] と呼ぶ．"],
["（収縮期末容量）","心室内のすべての血液が駆出されることはなく，残った血液量を [収縮期末容量]（ESV）と呼ぶ．"],
["④ 等容性心室弛緩期","心室は弛緩し，心室圧は低下する．心室圧が大動脈圧より低くなったとき，[半月弁] が閉じ [心音図第Ⅱ音]（S2）が記録される．"],
["⑤ 受動的心室充満期","[房室弁] が開き，心房の血液が心室に [急速] に流入する．"],
],
},
{t:"図10・6 の読み方",ch:"第10章 循環 ｜ A-4 心臓の活動周期",type:"tbl",
cols:["図中の点・記号","意味"],
rows:[
["A","[僧帽弁] 閉鎖（→ 心音 S1）"],
["B","[大動脈弁] 開放（駆出の開始）"],
["C","大動脈弁 [閉鎖]（→ 心音 S2）"],
["D","僧帽弁 [開放]（充満の開始）"],
["EDV","[拡張期末容量]（図では約130mL）"],
["ESV","[収縮期末容量]（図では約60mL）"],
["補足知識（資料外）","1回拍出量 ＝ EDV − ESV（図の値で約70mL）．等容性の2つの時期は，房室弁も半月弁も [すべて閉じている]．"],
],
},
{t:"パートBまとめ",ch:"第10章 循環 ｜ パートBまとめ",type:"tbl",
cols:["項目","内容"],
rows:[
["双極誘導","第Ⅰ＝両腕間／第Ⅱ＝[右手と左足]／第Ⅲ＝左手と左足"],
["単極誘導","胸部誘導 V₁〜V₆／肢誘導 aV<sub>R</sub>・aV<sub>L</sub>・aV<sub>F</sub>（[不関電極] を使う）"],
["記録の基準","第Ⅱ誘導．10mm＝1mV，[25mm]＝1秒"],
["P波／QRS波／T波","心房の脱分極／心室の [脱分極]／心室の [再分極]"],
["PQ時間","[房室伝導] に要する時間"],
["心室性期外収縮","P波を先行しない [幅の広い] QRS波"],
["心筋梗塞","ST上昇 → [異常Q波] → 冠性T波"],
["活動周期","心房収縮期 → [等容性心室収縮期] → 心室駆出期 → 等容性心室弛緩期 → 受動的心室充満期"],
["心音","Ⅰ音＝[房室弁] 閉鎖／Ⅱ音＝[半月弁] 閉鎖"],
["血圧","最低血圧＝半月弁が開く [直前]／最高血圧＝駆出期中の最大圧"],
],
},
];
let cur=0,bs=[];
function bl(id,ans){return `<span class="blank" id="${id}" onclick="rb('${id}')"><span>${ans}</span></span>`;}
function buildSlide(i){
  const s=S[i];bs=[];
  let h=`<div class="hd"><div class="ch">${s.ch}</div><div class="tt">${s.t}</div></div><div class="bd">`;
  if(s.type==="p"){
    h+=`<div class="sec">重要事項</div><div class="box">`;
    s.rows.forEach(r=>{
      let t=r.t;
      r.b.forEach(a=>{const id="b"+bs.length;bs.push({id,on:false});t=t.replace("["+a+"]",bl(id,a));});
      h+=`<span class="row">${t}</span>`;
    });
    h+=`</div>`;
  }else if(s.type==="tbl"){
    h+=`<div class="sec">重要事項</div><div class="box" style="padding:0;overflow:hidden"><table class="tbl"><thead><tr>`;
    s.cols.forEach(c=>h+=`<th>${c}</th>`);
    h+=`</tr></thead><tbody>`;
    s.rows.forEach(row=>{
      h+=`<tr>`;
      row.forEach(cell=>{
        const t=cell.replace(/\[([^\[\]]+)\]/g,(m,a)=>{
          const id="b"+bs.length;bs.push({id,on:false});return bl(id,a);
        });
        h+=`<td>${t}</td>`;
      });
      h+=`</tr>`;
    });
    h+=`</tbody></table></div>`;
  }else if(s.type==="two"){
    h+=`<div class="two">`;
    ["left","right"].forEach(side=>{
      const d=s[side];
      const tc=side==="left"?"tf":"tb";
      h+=`<div class="box"><span class="tag ${tc}">${d.label}</span>`;
      d.rows.forEach(r=>{
        let t=r.t;
        r.b.forEach(a=>{const id="b"+bs.length;bs.push({id,on:false});t=t.replace("["+a+"]",bl(id,a));});
        h+=`<p style="font-size:13px;line-height:1.8;border-bottom:1px solid #e5e7eb;padding:4px 0">${t}</p>`;
      });
      h+=`</div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;
  document.getElementById("sc").innerHTML=h;
  upd();bldNav();
}
function rb(id){const b=bs.find(x=>x.id===id);if(b&&!b.on){b.on=true;document.getElementById(id).classList.add("on");}upd();}
function nxt(){const u=bs.find(x=>!x.on);if(u)rb(u.id);}
function showAll(){bs.forEach(b=>rb(b.id));}
function rst(){bs.forEach(b=>{b.on=false;const el=document.getElementById(b.id);if(el)el.classList.remove("on");});upd();}
function upd(){const d=bs.filter(x=>x.on).length;document.getElementById("cnt").textContent=d+"/"+bs.length+" 表示済み";}
function go(i){if(i>=0&&i<S.length){cur=i;buildSlide(cur);}}
function bldNav(){
  let h="";
  S.forEach((_,i)=>h+=`<div class="dot${i===cur?" a":""}" onclick="go(${i})"></div>`);
  h+=`<span class="pg">${cur+1} / ${S.length}</span>`;
  document.getElementById("nav").innerHTML=h;
}
buildSlide(0);
</script>
</body>
</html>
