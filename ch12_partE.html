<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第12章 尿の生成と排泄 パートE｜生理学スライド</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:#f0f2f5;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 12px}
h1{font-size:14px;color:#555;margin-bottom:16px;font-weight:400;letter-spacing:.05em}
.slide{width:100%;max-width:820px;background:#fff;border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,.10);overflow:hidden}
.hd{background:#4a3a6b;padding:14px 28px}
.hd .ch{font-size:11px;color:#c4b5e8;font-weight:500;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.hd .tt{font-size:20px;font-weight:500;color:#fff}
.bd{padding:20px 28px 16px;background:#fff}
.sec{font-size:10px;font-weight:600;color:#888;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.box{background:#f8f9fb;border:1px solid #e5e7eb;border-radius:8px;padding:14px 18px;margin-bottom:12px}
.row{display:block;font-size:14px;line-height:1.9;color:#222;padding:5px 0;border-bottom:1px solid #e5e7eb}
.row:last-child{border-bottom:none}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#4a3a6b;color:#fff;padding:8px 10px;font-weight:500;text-align:left;font-size:12px}
.tbl td{padding:8px 10px;border-bottom:1px solid #e5e7eb;vertical-align:top;color:#222;line-height:1.7}
.tbl tr:last-child td{border-bottom:none}
.tbl td:first-child{font-weight:600;color:#4a3a6b;white-space:nowrap;min-width:110px}
.tbl.wide td:first-child{white-space:normal;min-width:88px}
.kw{font-weight:700;color:#4a3a6b}
.hs{display:inline-block;font-size:11px;font-weight:700;color:#8a6314;background:rgba(160,110,20,.12);border-radius:4px;padding:1px 7px;margin-right:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:4px;margin-bottom:7px}
.tf{background:rgba(74,58,107,.12);color:#4a3a6b}
.tb{background:rgba(180,60,30,.12);color:#b43c1e}
.blank{display:inline-block;min-width:72px;border-bottom:2.5px solid #4a3a6b;border-radius:3px 3px 0 0;cursor:pointer;text-align:center;padding:0 5px;transition:all .22s;position:relative;vertical-align:baseline}
.blank::after{content:"？";font-size:12px;color:#4a3a6b;opacity:.45;position:absolute;left:50%;transform:translateX(-50%)}
.blank span{visibility:hidden;font-weight:600;color:#4a3a6b;font-size:14px;opacity:0;transition:opacity .22s;display:inline-block}
.blank.on{border-bottom-color:transparent;background:rgba(74,58,107,.1);border-radius:4px;padding:1px 7px}
.blank.on::after{display:none}
.blank.on span{visibility:visible;opacity:1}
.blank:not(.on):hover{background:rgba(74,58,107,.07)}
.ctrl{display:flex;align-items:center;gap:8px;padding:10px 28px 12px;background:#f8f9fb;border-top:1px solid #e5e7eb;flex-wrap:wrap}
.btn{padding:7px 15px;border-radius:6px;border:1px solid #d1d5db;background:#fff;color:#333;font-size:12px;cursor:pointer;font-family:inherit;transition:background .15s}
.btn:hover{background:#f0f2f5}
.btnp{background:#4a3a6b;color:#fff;border-color:#4a3a6b}
.btnp:hover{background:#3d305a}
.cnt{font-size:11px;color:#888;margin-left:auto}
.nav{display:flex;align-items:center;gap:7px;padding:9px 28px 11px;background:#f8f9fb;border-top:1px solid #e5e7eb;border-radius:0 0 12px 12px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:#d1d5db;cursor:pointer;transition:background .18s;flex-shrink:0}
.dot.a{background:#4a3a6b}
.pg{font-size:11px;color:#888;margin-left:auto}
@media (max-width:520px){.two{grid-template-columns:1fr}.bd{padding:16px 14px}.hd{padding:12px 16px}.ctrl,.nav{padding-left:14px;padding-right:14px}.tbl{font-size:12px}.tbl td,.tbl th{padding:6px 6px}}
</style>
</head>
<body>
<h1>生理学 第12章 尿の生成と排泄｜パートE：腎臓による体液の調節</h1>
<div class="slide">
  <div id="sc"></div>
  <div class="ctrl">
    <button class="btn" onclick="nextBlank()">次のカッコを開く ▶</button>
    <button class="btn" onclick="showAll()">すべて表示</button>
    <button class="btn" onclick="resetAll()">リセット</button>
    <button class="btn btnp" onclick="go(cur-1)">◀ 前へ</button>
    <button class="btn btnp" onclick="go(cur+1)">次へ ▶</button>
    <span class="cnt" id="cnt"></span>
  </div>
  <div class="nav" id="nav"></div>
</div>
<script>
const S=[
{t:"腎臓による体液の調節",ch:"第12章 尿の生成と排泄 ｜ E 腎臓による体液の調節 ｜ P180",type:"p",
rows:[
"ヒトの体液は，電解質や血漿タンパク質などで [浸透圧] が一定に保たれている．",
"細胞活動で生じる老廃物が呼吸や尿で排泄されることで，[pH] も一定に維持される．",
"体液の量・浸透圧・pHは，水分や塩分の摂取のほか，尿の量や組成を調節する [ホルモン] が腎臓にはたらくことで，厳密にコントロールされる．",
"体液の量や浸透圧の変化は，それぞれ固有の [受容器] で感知され，その情報に基づいて各種ホルモンの分泌が促される．",
]},
{t:"バソプレシン",ch:"第12章 尿の生成と排泄 ｜ E-1 ホルモンによる調節 ｜ P180",type:"p",
rows:[
"脱水などで血漿浸透圧が上昇すると，[視床下部] にある [浸透圧受容器] が刺激される（図12・8）．",
"その情報が視床下部の [視索上核] と [室傍核] に伝わると，[下垂体後葉] からの [バソプレシン] の分泌が促される．",
"バソプレシンは [集合管] での水の再吸収を促すことで，血漿浸透圧を [低下] させる．",
"逆に，血漿浸透圧が低下すると，バソプレシンの分泌が低下し，水の再吸収が [抑制] される．",
"血液量や胸腔内圧が減少すると，心房の [低圧受容器]（伸展受容器）がそれを感知して，バソプレシンの分泌が [促進] される．",
]},
{t:"レニン-アンジオテンシン-アルドステロン系",ch:"第12章 尿の生成と排泄 ｜ E-1 ホルモンによる調節 ｜ P181",type:"p",
rows:[
"塩分の過剰摂取などで体液量が増加すると，[傍糸球体装置] がそれを感知して [レニン] の分泌を抑制する（図12・9）．",
"レニンは [アンジオテンシン] の分泌抑制を介して，副腎からの [アルドステロン] 分泌を抑制する．",
"その結果，[遠位尿細管] や集合管での [Na⁺] の再吸収が減少し，それとともに水の再吸収量が減少して [尿量] が増える．",
]},
{t:"心房性ナトリウム利尿ペプチド",ch:"第12章 尿の生成と排泄 ｜ E-1 ホルモンによる調節 ｜ P182",type:"p",
rows:[
"体内の血液量が増加し心臓へ流れ込む血液量が増えると，心房の [低圧受容器] が興奮する．",
"その結果，心房から [心房性ナトリウム利尿ペプチド] が分泌される．",
"心房性ナトリウム利尿ペプチドは集合管での [Na⁺] の再吸収を抑制し，水の再吸収量が減って [尿量] が増える（図12・9）．",
]},
{t:"3つのホルモンのまとめ",ch:"第12章 尿の生成と排泄 ｜ E-1 ホルモンによる調節 ｜ P180〜182",type:"tbl",
cols:["ホルモン","分泌されるところ","分泌を変えるもの","腎臓での作用"],
rows:[
["[バソプレシン]","[下垂体後葉]","血漿浸透圧の [上昇]・血液量の減少で促進","[集合管] での水の再吸収↑ → 尿量↓"],
["[アルドステロン]","副腎","体液量の増加で [レニン] とともに抑制","遠位尿細管・集合管での [Na⁺] の再吸収↑"],
["[心房性ナトリウム利尿ペプチド]","[心房]","血液量の増加で亢進","集合管での Na⁺の再吸収↓ → 尿量 [↑]"],
]},
{t:"飲水での調節",ch:"第12章 尿の生成と排泄 ｜ E-2 飲水での調節 ｜ P182",type:"p",
rows:[
"水分摂取の制限や塩分の過剰摂取などで体液の [浸透圧] が上昇したときや，発汗・下痢・出血などで大量の体液が失われたときは，のどが渇いて水を飲む．",
"[浸透圧受容器] や [容積受容器] などからの情報が中枢で総合される結果，飲水行動が起こる．",
"この中枢を [口渇中枢]（飲水中枢）と呼ぶ（図12・8）．",
]},
{t:"pHの調節",ch:"第12章 尿の生成と排泄 ｜ E-3 pHの調節 ｜ P182",type:"p",
rows:[
"体液は，中性に近い弱アルカリ性である pH [7.4] となるよう厳密にコントロールされている．代謝を担う [酵素] がこのpHでもっとも活性化するためである．",
"ヒトは代謝に伴い，1日に約 [15 mol] の酸（水素イオン）を産生する．",
"このうち揮発性の酸（CO₂）は主に [呼吸] で排泄される．不揮発性の酸および塩基は [腎臓] で処理される（図12・10）．",
"腎臓は酸を尿中へ排泄するほか，酸の緩衝で重要な [重炭酸イオン] を再吸収することで酸を処理する．リン酸水素イオンや [アンモニア] の分泌でも酸は処理される．",
"pHがアルカリ側に傾いたときは，体液中のアルカリを炭酸で中和して [重炭酸塩] とし，尿中に排泄する．",
]},
{t:"パートEまとめ",ch:"第12章 尿の生成と排泄 ｜ パートEまとめ",type:"tbl",
cols:["項目","内容"],
rows:[
["バソプレシン","血漿浸透圧↑ → [視床下部] の浸透圧受容器 → [下垂体後葉] から分泌 → 集合管で水の再吸収↑"],
["レニン-アンジオテンシン-アルドステロン系","体液量↑ → [傍糸球体装置] でレニン分泌↓ → [アルドステロン]↓ → Na⁺・水の再吸収↓ → 尿量↑"],
["心房性ナトリウム利尿ペプチド","血液量↑ → [心房] から分泌 → 集合管でNa⁺の再吸収↓ → 尿量↑"],
["飲水","浸透圧↑・体液の喪失 → [口渇中枢]（飲水中枢）→ 飲水行動"],
["pH","体液は pH [7.4]．揮発性の酸（CO₂）＝[呼吸]／不揮発性の酸・塩基＝[腎臓]"],
]},
];
let cur=0,bs=[];
function bl(id,ans){return `<span class="blank" id="${id}" onclick="revealBlank('${id}')"><span>${ans}</span></span>`;}
function fill(t){t=t.replace(/\{\{([^{}]+)\}\}/g,'<span class="kw">$1</span>');t=t.replace(/【補足】/g,'<span class="hs">📘 補足知識（資料外）</span>');return t.replace(/\[([^\[\]]+)\]/g,(m,a)=>{const id="b"+bs.length;bs.push({id,on:false});return bl(id,a);});}
function buildSlide(i){
  const s=S[i];bs=[];
  let h=`<div class="hd"><div class="ch">${s.ch}</div><div class="tt">${s.t}</div></div><div class="bd">`;
  if(s.type==="p"){
    h+=`<div class="sec">重要事項</div><div class="box">`;
    s.rows.forEach(r=>{h+=`<span class="row">${fill(r)}</span>`;});
    h+=`</div>`;
  }else if(s.type==="tbl"){
    h+=`<div class="sec">重要事項</div><div class="box" style="padding:0;overflow:hidden"><table class="tbl${s.cols.length>2?' wide':''}"><thead><tr>`;
    s.cols.forEach(c=>h+=`<th>${c}</th>`);
    h+=`</tr></thead><tbody>`;
    s.rows.forEach(row=>{h+=`<tr>`;row.forEach(cell=>{h+=`<td>${fill(cell)}</td>`;});h+=`</tr>`;});
    h+=`</tbody></table></div>`;
    if(s.note){h+=`<div class="box" style="font-size:13px;line-height:1.8">${fill(s.note)}</div>`;}
  }else if(s.type==="two"){
    h+=`<div class="two">`;
    ["left","right"].forEach(side=>{
      const d=s[side];const tc=side==="left"?"tf":"tb";
      h+=`<div class="box"><span class="tag ${tc}">${d.label}</span>`;
      d.rows.forEach(r=>{h+=`<p style="font-size:13px;line-height:1.8;border-bottom:1px solid #e5e7eb;padding:4px 0">${fill(r)}</p>`;});
      h+=`</div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;
  document.getElementById("sc").innerHTML=h;
  upd();bldNav();
}
function revealBlank(id){const b=bs.find(x=>x.id===id);if(b&&!b.on){b.on=true;document.getElementById(id).classList.add("on");}upd();}
function nextBlank(){const u=bs.find(x=>!x.on);if(u){revealBlank(u.id);const el=document.getElementById(u.id);if(el)el.scrollIntoView({behavior:"smooth",block:"center"});}}
function showAll(){bs.forEach(b=>revealBlank(b.id));}
function resetAll(){bs.forEach(b=>{b.on=false;const el=document.getElementById(b.id);if(el)el.classList.remove("on");});upd();}
function upd(){const d=bs.filter(x=>x.on).length;document.getElementById("cnt").textContent=bs.length?d+"/"+bs.length+" 表示済み":"参照用スライド（カッコなし）";}
function go(i){if(i>=0&&i<S.length){cur=i;buildSlide(cur);}}
function bldNav(){
  let h="";
  S.forEach((_,i)=>h+=`<div class="dot${i===cur?" a":""}" onclick="go(${i})"></div>`);
  h+=`<span class="pg">${cur+1} / ${S.length}</span>`;
  document.getElementById("nav").innerHTML=h;
}
buildSlide(0);
</script>
</body>
</html>
