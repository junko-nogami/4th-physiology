<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第2章 筋の生理 パートB｜生理学スライド</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:#f0f2f5;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 12px}
h1{font-size:14px;color:#555;margin-bottom:16px;font-weight:400;letter-spacing:.05em}
.slide{width:100%;max-width:820px;background:#fff;border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,.10);overflow:hidden}
.hd{background:#9e3450;padding:14px 28px}
.hd .ch{font-size:11px;color:#e8b3c1;font-weight:500;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.hd .tt{font-size:20px;font-weight:500;color:#fff}
.bd{padding:20px 28px 16px;background:#fff}
.sec{font-size:10px;font-weight:600;color:#888;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.box{background:#f8f9fb;border:1px solid #e5e7eb;border-radius:8px;padding:14px 18px;margin-bottom:12px}
.row{display:block;font-size:14px;line-height:1.9;color:#222;padding:5px 0;border-bottom:1px solid #e5e7eb}
.row:last-child{border-bottom:none}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#9e3450;color:#fff;padding:8px 10px;font-weight:500;text-align:left;font-size:12px}
.tbl td{padding:8px 10px;border-bottom:1px solid #e5e7eb;vertical-align:top;color:#222;line-height:1.7}
.tbl tr:last-child td{border-bottom:none}
.tbl td:first-child{font-weight:600;color:#9e3450;white-space:nowrap;min-width:110px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:4px;margin-bottom:7px}
.tf{background:rgba(158,52,80,.12);color:#9e3450}
.tb{background:rgba(40,90,140,.12);color:#285a8c}
.blank{display:inline-block;min-width:72px;border-bottom:2.5px solid #9e3450;border-radius:3px 3px 0 0;cursor:pointer;text-align:center;padding:0 5px;transition:all .22s;position:relative;vertical-align:baseline}
.blank::after{content:"？";font-size:12px;color:#9e3450;opacity:.45;position:absolute;left:50%;transform:translateX(-50%)}
.blank span{visibility:hidden;font-weight:600;color:#9e3450;font-size:14px;opacity:0;transition:opacity .22s;display:inline-block}
.blank.on{border-bottom-color:transparent;background:rgba(158,52,80,.1);border-radius:4px;padding:1px 7px}
.blank.on::after{display:none}
.blank.on span{visibility:visible;opacity:1}
.blank:not(.on):hover{background:rgba(158,52,80,.07)}
.ctrl{display:flex;align-items:center;gap:8px;padding:10px 28px 12px;background:#f8f9fb;border-top:1px solid #e5e7eb;flex-wrap:wrap}
.btn{padding:7px 15px;border-radius:6px;border:1px solid #d1d5db;background:#fff;color:#333;font-size:12px;cursor:pointer;font-family:inherit;transition:background .15s}
.btn:hover{background:#f0f2f5}
.btnp{background:#9e3450;color:#fff;border-color:#9e3450}
.btnp:hover{background:#84293f}
.cnt{font-size:11px;color:#888;margin-left:auto}
.nav{display:flex;align-items:center;gap:7px;padding:9px 28px 11px;background:#f8f9fb;border-top:1px solid #e5e7eb;border-radius:0 0 12px 12px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:#d1d5db;cursor:pointer;transition:background .18s;flex-shrink:0}
.dot.a{background:#9e3450}
.pg{font-size:11px;color:#888;margin-left:auto}
</style>
</head>
<body>
<h1>生理学 第2章 筋の生理｜パートB：骨格筋の収縮と弛緩</h1>
<div class="slide">
  <div id="sc"></div>
  <div class="ctrl">
    <button class="btn" onclick="nxt()">次のカッコを開く ▶</button>
    <button class="btn" onclick="showAll()">すべて表示</button>
    <button class="btn" onclick="rst()">リセット</button>
    <button class="btn btnp" onclick="go(cur-1)">◀ 前へ</button>
    <button class="btn btnp" onclick="go(cur+1)">次へ ▶</button>
    <span class="cnt" id="cnt"></span>
  </div>
  <div class="nav" id="nav"></div>
</div>
<script>
const S=[
{t:"筋収縮のしくみ①：活動電位の発生",ch:"第2章 筋の生理 ｜ A-2 骨格筋の収縮と弛緩",type:"p",
rows:[
{t:"骨格筋線維は [運動神経] の支配を受けており，運動神経と筋線維の接合部を [神経筋接合部]（運動終末）と呼ぶ．",b:["運動神経","神経筋接合部"]},
{t:"神経筋接合部は各筋線維に [1つ] ある．",b:["1つ"]},
{t:"神経筋接合部では [アセチルコリン] という神経伝達物質が放出される．",b:["アセチルコリン"]},
{t:"筋細胞膜の [ニコチン型アセチルコリン受容体] にアセチルコリンが結合すると [終板電位] が発生し，その加重で [活動電位] が発生する．",b:["ニコチン型アセチルコリン受容体","終板電位","活動電位"]},
{t:"<span style='color:#8a8f98;font-size:12px'>※ここでの「加重」は終板電位どうしの加重。単収縮の加重（＝強縮）とは別のもの。</span>",b:[]},
]},
{t:"筋収縮のしくみ②：活動電位の伝搬",ch:"第2章 筋の生理 ｜ A-2 骨格筋の収縮と弛緩",type:"p",
rows:[
{t:"筋線維鞘に伝わった活動電位は，[横行小管]（T管）を経て筋線維の深部へ導かれる．",b:["横行小管"]},
{t:"活動電位が [筋小胞体] へ伝わると，内部に蓄えられた [Ca²⁺] が筋線維内へ放出される．",b:["筋小胞体","Ca²⁺"]},
{t:"放出されたCa²⁺が [トロポニン] に結合すると，アクチンがミオシンと結合できる状態になる．",b:["トロポニン"]},
]},
{t:"筋収縮のしくみ③：収縮と弛緩",ch:"第2章 筋の生理 ｜ A-2 骨格筋の収縮と弛緩",type:"p",
rows:[
{t:"ミオシンは [頭部]（側枝）を回転させ，アクチン結合部位と連結してそれをたぐり込む．",b:["頭部"]},
{t:"アクチンフィラメントがサルコメアの [中央部] に引き込まれて [筋収縮] が生じる．",b:["中央部","筋収縮"]},
{t:"約 [50〜70ミリ秒] 後にCa²⁺が筋小胞体へ [再取り込み] されることで，筋線維中のCa²⁺濃度が下がり筋が [弛緩] する．",b:["50〜70ミリ秒","再取り込み","弛緩"]},
]},
{t:"興奮収縮連関",ch:"第2章 筋の生理 ｜ A-2 骨格筋の収縮と弛緩",type:"p",
rows:[
{t:"筋収縮は，筋線維鞘の電気的な [興奮] から始まる．",b:["興奮"]},
{t:"次に [Ca²⁺] の作用という化学的過程を経て，ミオシンとアクチンの結合という [機械的] 反応へ移る．",b:["Ca²⁺","機械的"]},
{t:"この一連の反応を [興奮収縮連関] と呼ぶ．",b:["興奮収縮連関"]},
{t:"筋線維が収縮する際には，[サルコメア] が機能的な最小単位としてはたらいて全筋が張力を発揮する．",b:["サルコメア"]},
]},
{t:"収縮・弛緩のためのエネルギー供給",ch:"第2章 筋の生理 ｜ A-2 骨格筋の収縮と弛緩",type:"p",
rows:[
{t:"筋の収縮には，[アデノシン三リン酸]（ATP）の分解でもたらされるエネルギーが用いられる．",b:["アデノシン三リン酸"]},
{t:"ATPは，[アデノシン二リン酸]（ADP）と [無機リン酸]（Pi）に分解されるときに大きなエネルギーを発生する（ATPのTは [三]，ADPのDは [二] を表す）．",b:["アデノシン二リン酸","無機リン酸","三","二"]},
{t:"発生したエネルギーは，力学的エネルギー（筋線維の収縮）と [熱エネルギー] に変換される．",b:["熱エネルギー"]},
{t:"激しい運動をしない限りATP濃度が低下しにくいのは，分解産物である [ADP] がATPへとすぐに再変換されるためである．",b:["ADP"]},
]},
{t:"パートBまとめ",ch:"第2章 筋の生理 ｜ パートBまとめ",type:"tbl",
cols:["段階","内容"],
rows:[
["① 活動電位の発生","運動神経→[神経筋接合部]→[アセチルコリン]→終板電位→活動電位"],
["② 活動電位の伝搬","[横行小管]（T管）→[筋小胞体]から [Ca²⁺] 放出→トロポニンに結合"],
["③ 収縮","ミオシン [頭部] がアクチンをたぐり込み筋収縮（滑り込み）"],
["④ 弛緩","約 [50〜70ミリ秒] 後にCa²⁺が再取り込みされ弛緩"],
["一連の反応","電気的興奮→化学的過程→機械的反応＝[興奮収縮連関]"],
["エネルギー源","[ATP] の分解（ATP→ADP＋Pi）"],
],
blanks:["神経筋接合部","アセチルコリン","横行小管","筋小胞体","Ca²⁺","頭部","50〜70ミリ秒","興奮収縮連関","ATP"]
},
];
let cur=0,bs=[];
function bl(id,ans){return `<span class="blank" id="${id}" onclick="rb('${id}')"><span>${ans}</span></span>`;}
function buildSlide(i){
  const s=S[i];bs=[];
  let h=`<div class="hd"><div class="ch">${s.ch}</div><div class="tt">${s.t}</div></div><div class="bd">`;
  if(s.type==="p"){
    h+=`<div class="sec">重要事項</div><div class="box">`;
    s.rows.forEach(r=>{
      let t=r.t;
      r.b.forEach(a=>{const id="b"+bs.length;bs.push({id,on:false});t=t.replace("["+a+"]",bl(id,a));});
      h+=`<span class="row">${t}</span>`;
    });
    h+=`</div>`;
  }else if(s.type==="tbl"){
    h+=`<div class="sec">重要事項</div><div class="box" style="padding:0;overflow:hidden"><table class="tbl"><thead><tr>`;
    s.cols.forEach(c=>h+=`<th>${c}</th>`);
    h+=`</tr></thead><tbody>`;
    s.rows.forEach(row=>{
      h+=`<tr>`;
      row.forEach(cell=>{
        let t=cell;
        if(s.blanks)s.blanks.forEach(a=>{
          if(t.includes("["+a+"]")){const id="b"+bs.length;bs.push({id,on:false});t=t.replace("["+a+"]",bl(id,a));}
        });
        h+=`<td>${t}</td>`;
      });
      h+=`</tr>`;
    });
    h+=`</tbody></table></div>`;
  }else if(s.type==="two"){
    h+=`<div class="two">`;
    ["left","right"].forEach(side=>{
      const d=s[side];
      const tc=side==="left"?"tf":"tb";
      h+=`<div class="box"><span class="tag ${tc}">${d.label}</span>`;
      d.rows.forEach(r=>{
        let t=r.t;
        r.b.forEach(a=>{const id="b"+bs.length;bs.push({id,on:false});t=t.replace("["+a+"]",bl(id,a));});
        h+=`<p style="font-size:13px;line-height:1.8;border-bottom:1px solid #e5e7eb;padding:4px 0">${t}</p>`;
      });
      h+=`</div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;
  document.getElementById("sc").innerHTML=h;
  upd();bldNav();
}
function rb(id){const b=bs.find(x=>x.id===id);if(b&&!b.on){b.on=true;document.getElementById(id).classList.add("on");}upd();}
function nxt(){const u=bs.find(x=>!x.on);if(u)rb(u.id);}
function showAll(){bs.forEach(b=>rb(b.id));}
function rst(){bs.forEach(b=>{b.on=false;const el=document.getElementById(b.id);if(el)el.classList.remove("on");});upd();}
function upd(){const d=bs.filter(x=>x.on).length;document.getElementById("cnt").textContent=d+"/"+bs.length+" 表示済み";}
function go(i){if(i>=0&&i<S.length){cur=i;buildSlide(cur);}}
function bldNav(){
  let h="";
  S.forEach((_,i)=>h+=`<div class="dot${i===cur?" a":""}" onclick="go(${i})"></div>`);
  h+=`<span class="pg">${cur+1} / ${S.length}</span>`;
  document.getElementById("nav").innerHTML=h;
}
buildSlide(0);
</script>
</body>
</html>
