<div class="slide">
  <div class="hd"><div><div class="ch">第4章 運動の生理 ｜ B 運動神経と運動単位</div><div class="tt" id="htt">確認テスト</div></div><div class="pg" id="pg"></div></div>

<script>
/* ===== 問題プール ===== */
const PICK=5;
const POOL=[
{q:"運動単位を構成するものの組合せはどれか。",kihon:true,dobon:true,
 choices:[
 ["脊髄前角の運動ニューロンと、それが支配する筋線維",true,""],
 ["一次運動野の錐体細胞とその軸索",false,"大脳皮質から脊髄へ下行する伝導路の出発点となる細胞である（P45）。"],
 ["筋紡錘と、そこに終止するγ運動ニューロン",false,"筋の長さを監視する受容器と、その感度を調節する神経である（P47）。"],
 ["1本の筋線維と、その中に並ぶ筋原線維",false,"筋線維の内部構造であり、神経との組合せではない（第2章P12）。"]],
 exp:"1つのα運動ニューロンと、それが支配する筋線維群をまとめて運動単位と呼ぶ。張力発生の機能的単位である（P46、図4・3）。"},

{q:"運動に関係する信号が最終的にすべて集まることから、α運動ニューロンにつけられている別名はどれか。",kihon:true,
 choices:[
 ["最終共通路",true,""],
 ["皮質脊髄路",false,"大脳の運動関連領域から脊髄前角へ下行する伝導路の名称である（P45）。"],
 ["錐体交叉",false,"下行線維の約80〜90%が対側へ乗り換える延髄の部位である（P45）。"],
 ["反射弓",false,"反射が成立する経路全体を指す名称である（P47）。"]],
 exp:"運動（筋収縮）に関係する信号は、最終的にはすべてα運動ニューロンへ送られる。このためα運動ニューロンは最終共通路とも呼ばれる（P46）。"},

{q:"筋線維とα運動ニューロンの接合部で、神経側から放出される物質はどれか。",kihon:true,dobon:true,
 choices:[
 ["アセチルコリン",true,""],
 ["ノルアドレナリン",false,"交感神経の節後線維から放出される伝達物質である。"],
 ["グルタミン酸",false,"中枢神経系の代表的な興奮性伝達物質である。"],
 ["γ-アミノ酪酸（GABA）",false,"中枢神経系の代表的な抑制性伝達物質である。"]],
 exp:"筋線維とα運動ニューロンの神経筋接合部では、神経伝達物質としてアセチルコリン（ACh）が放出される（P46）。国試でくり返し問われているところ。"},

{q:"神経支配比について正しいのはどれか。",kihon:true,
 choices:[
 ["精密な動きが必要な筋ほど小さい",true,""],
 ["1本の筋線維が支配を受けるα運動ニューロンの数を表す",false,"筋線維とニューロンの関係が逆になっている。"],
 ["筋線維の太さ（直径）の平均を表す",false,"この比が表しているのは太さではない。"],
 ["どの骨格筋でもほぼ一定の値をとる",false,"筋によって数本から数百本まで大きく異なる。"]],
 exp:"神経支配比とは、1本のα運動ニューロンが支配する筋線維の数である。手や眼筋のように精密な動きが必要な筋では小さく、大きく力強い運動を行う四肢の筋などでは大きい（P46）。"},

{q:"1本の骨格筋線維とα運動ニューロンの関係で正しいのはどれか。",
 choices:[
 ["1本の筋線維を支配するα運動ニューロンは1つだけである",true,""],
 ["1本の筋線維は複数のα運動ニューロンから重複して支配を受ける",false,"教科書がはっきり否定している記述である。"],
 ["1つのα運動ニューロンが支配できる筋線維は1本だけである",false,"これでは運動単位という機能的なまとまりが成り立たない。"],
 ["支配するニューロンの数は筋の部位によって1〜3本の間で変わる",false,"そのような記載はない。"]],
 exp:"1本の筋線維が複数のα運動ニューロンで支配されることはない（P46）。"},

{q:"1つの筋は、何本程度のα運動ニューロンの支配を受けているか。",
 choices:[
 ["数十〜数百本",true,""],
 ["1本",false,"1つの筋がまるごと1つの運動単位になってしまう。"],
 ["2〜3本",false,"これでは力を細かく調節できない。"],
 ["数万本",false,"筋線維の本数と取り違えた値である。"]],
 exp:"1つの筋は数十〜数百本のα運動ニューロンの支配を受けている（P46）。"},

{q:"骨格筋が張力を発生するのは、何を受け取ったときか。",kihon:true,
 choices:[
 ["脊髄のα運動ニューロンの活動電位",true,""],
 ["筋紡錘から送られるIa群線維の信号",false,"筋の伸展を中枢へ伝える求心性の信号である（P47）。"],
 ["ゴルジ腱器官から送られるIb群線維の信号",false,"筋にかかる張力を中枢へ伝える求心性の信号である（P48）。"],
 ["腱から筋へ直接伝わる機械的な張力",false,"腱は力を骨に伝える組織で、収縮の指令を出すわけではない。"]],
 exp:"骨格筋は、脊髄のα運動ニューロンの活動電位を受けて収縮することで張力を発生する（P45〜46、図4・3）。"},

{q:"運動単位の種類とその特徴の組合せで正しいのはどれか。",kihon:true,dobon:true,
 choices:[
 ["S型 ── 単収縮が遅く、疲労しにくい",true,""],
 ["FF型 ── α運動ニューロンの伝導速度が遅い",false,"この型の伝導速度は3つの中で最も速い。"],
 ["FR型 ── 支配する筋線維はタイプIである",false,"この型が支配するのは速筋線維である。"],
 ["S型 ── 運動単位のサイズが3つの中で最も大きい",false,"この型のサイズは3つの中で最も小さい。"]],
 exp:"S型は遅筋線維（タイプI）を支配し、単収縮が遅く、サイズが小さく、α運動ニューロンの伝導速度が遅く、疲労しにくい（表4・1）。"},

{q:"FF型の運動単位が支配する筋線維はどれか。",
 choices:[
 ["速筋線維（タイプIIx）",true,""],
 ["遅筋線維（タイプI）",false,"収縮速度が遅く持久性に富む線維で、S型が支配する。"],
 ["速筋線維（タイプIIa）",false,"収縮速度も疲労耐性も中間で、FR型が支配するものである。"],
 ["錘内筋線維",false,"筋紡錘の中にあり、γ運動ニューロンの支配を受ける線維である（P47）。"]],
 exp:"FF型は速筋線維（タイプIIx）からなる。FR型はタイプIIa、S型はタイプIの筋線維を支配する（表4・1）。"},

{q:"単収縮の速さ・運動単位のサイズ・疲労のしやすさが、いずれも中間である運動単位はどれか。",
 choices:[
 ["FR型",true,""],
 ["S型",false,"単収縮が遅く、サイズが小さく、最も疲労しにくい型である。"],
 ["FF型",false,"単収縮が速く、サイズが大きく、最も疲労しやすい型である。"],
 ["γ型",false,"運動単位の分類にこのような型はない。"]],
 exp:"運動単位はS型・FR型・FF型に分けられ、FR型は両者の中間の性質をもつ（表4・1）。"},

{q:"運動単位のタイプについて誤っているのはどれか。",kihon:true,gori:true,
 choices:[
 ["1つの運動単位は、異なるタイプの筋線維が混ざって構成される",true,""],
 ["F型はFR型とFF型にさらに分けられる",false,"教科書どおりの記述なので、正しい。"],
 ["S型は、F型に比べて単収縮が小さい",false,"教科書どおりの記述なので、正しい。"],
 ["収縮速度が速い運動単位をF型と呼ぶ",false,"教科書どおりの記述なので、正しい。"]],
 exp:"1つの運動単位を構成する筋線維は、すべて同じタイプである。だからこそ運動単位そのものをタイプに分類できる（P46）。"},

{q:"運動単位のサイズについて正しいのはどれか。",kihon:true,
 choices:[
 ["S型・FR型・FF型の順に大きくなる",true,""],
 ["α運動ニューロンの細胞体の直径のことを指す",false,"「サイズ」が指しているのは細胞の大きさではない。"],
 ["3つのタイプでほぼ等しい",false,"タイプによって異なることが表4・1に示されている。"],
 ["支配する筋線維1本あたりの太さを指す",false,"1本の線維の太さを表す言葉ではない。"]],
 exp:"運動単位が発生する力の大きさを運動単位のサイズと呼び、S型は小さく、FR型、FF型の順に大きくなる（P46）。"},

{q:"骨格筋線維のタイプと運動単位の関係で正しいのはどれか。",kihon:true,
 choices:[
 ["同じ運動単位に属する筋線維は、すべて同じタイプである",true,""],
 ["1つの運動単位の中でのタイプの割合は、筋ごとに決まっている",false,"1つの運動単位の中にタイプの混在があることを前提にした記述である。"],
 ["運動単位のタイプは、支配する筋線維の本数で決まる",false,"本数（神経支配比）とタイプの分類は別の話である。"],
 ["筋線維のタイプは運動のたびに切り替わる",false,"1回ごとの運動で入れ替わるものではない。"]],
 exp:"1つの運動単位を構成する筋線維はすべて同じタイプであり、そのため運動単位もタイプに分類できる（P46）。"},

{q:"筋全体の収縮力を調節する方法として正しいのはどれか。",kihon:true,
 choices:[
 ["活動している運動単位の数を変える",true,""],
 ["筋線維の本数そのものを増減させる",false,"収縮のたびに筋線維の本数が増減することはない。"],
 ["α運動ニューロンの軸索の太さを変える",false,"軸索の太さはその場で変化しない。"],
 ["神経筋接合部で放出される伝達物質の種類を変える",false,"骨格筋の接合部で使われる伝達物質は1種類である。"]],
 exp:"筋全体の力は、①活動している運動単位の数を変える方法と、②それぞれの運動単位で発生する収縮力（α運動ニューロンの活動頻度）を変える方法で調節される（P46〜47）。"},

{q:"活動させる運動単位の数を増やして筋の張力を高めるしくみを何と呼ぶか。",
 choices:[
 ["動員（リクルートメント）",true,""],
 ["加重",false,"複数の入力が重なって膜電位の変化が大きくなる現象である。"],
 ["強縮",false,"活動電位がくり返し生じ、単収縮が融合した状態である（第2章P17）。"],
 ["不応期",false,"活動電位の直後、次の刺激に反応できない期間である。"]],
 exp:"筋全体の力を調節する第1の方法が、活動している運動単位の数を変える動員（リクルートメント）である（P46〜47）。"},

{q:"弱い力を出すときに先に活動する運動単位はどれか。",kihon:true,dobon:true,
 choices:[
 ["サイズの小さいS型",true,""],
 ["サイズの大きいFF型",false,"大きな力が必要になってから動員される型である。"],
 ["FR型とFF型が同時に",false,"力の大きさにかかわらず同時に働くわけではない。"],
 ["運動単位が活動する順序は決まっていない",false,"動員の順序には一定の原則がある。"]],
 exp:"「サイズの原理」により、弱い力を出すときには小さなサイズの運動単位（S型）だけがはたらき、発生させる力を増やすにつれて大きなサイズの運動単位（F型）が動員される（P47）。"},

{q:"弱い力を出すときに、小さなサイズの運動単位から先に活動することが理にかなっている理由はどれか。",kihon:true,
 choices:[
 ["弱い力を出す場面では持久力が求められ、疲労しにくい運動単位が適しているため",true,""],
 ["小さな運動単位ほど伝導速度が速く、素早く反応できるため",false,"小さなサイズの型は、α運動ニューロンの伝導速度は遅い。"],
 ["小さな運動単位ほど、一度に大きな張力を出せるため",false,"小さなサイズの型が発生する力は小さい。"],
 ["大きな運動単位は神経支配比が小さく、細かい調節に向かないため",false,"大きな運動単位は神経支配比が大きい。"]],
 exp:"弱い力を出すときには持久力が要求されるため、疲労しにくい小さなサイズの運動単位を先に活動させることは理にかなっている（P47）。"},

{q:"筋の収縮力の調節について誤っているのはどれか。",kihon:true,gori:true,
 choices:[
 ["サイズの原理では、大きなサイズの運動単位から先に動員される",true,""],
 ["筋の収縮力は、状況に応じて調節される",false,"教科書どおりの記述なので、正しい。"],
 ["α運動ニューロンの活動頻度を変えることで収縮力が変わる",false,"教科書どおりの記述なので、正しい。"],
 ["活動している運動単位の数を増やすと、筋全体の張力は大きくなる",false,"教科書どおりの記述なので、正しい。"]],
 exp:"サイズの原理では、小さなサイズの運動単位から先に活動し、発生させる力を増やすにつれて大きなサイズの運動単位が加わる（P47）。"},

{q:"運動単位について誤っているのはどれか。",gori:true,
 choices:[
 ["疲労しにくい運動単位ほど、α運動ニューロンの伝導速度が速い",true,""],
 ["1つの筋は複数の運動単位から支配を受けている",false,"教科書どおりの記述なので、正しい。"],
 ["支配する筋線維の数は、運動単位によって異なる",false,"教科書どおりの記述なので、正しい。"],
 ["発生する力が大きい運動単位ほど、疲労しやすい",false,"教科書どおりの記述なので、正しい。"]],
 exp:"最も疲労しにくいのはS型だが、S型のα運動ニューロンの伝導速度は遅い。疲労耐性と伝導速度は逆の関係になる（表4・1）。"},

{q:"握力計をゆっくり握り込み、力を徐々に強めていったときに起こることはどれか。",
 choices:[
 ["活動する運動単位の数が増え、やがてサイズの大きい運動単位も加わる",true,""],
 ["先に活動していた運動単位が休み、別の運動単位に交代する",false,"先に働いていた型の活動が止まるわけではない。"],

 choices:[

 ["筋線維の半数ずつが交互に興奮する",false,"そのようなしくみはない。"]],
 exp:"補足知識（資料外）。1つのα運動ニューロンの軸索が枝分かれしてすべての筋線維に達するため、それらは常に活動を共にする。この性質が、運動単位を「機能的単位」と呼ぶ根拠になっている。"},

{q:"サイズの原理を、α運動ニューロンの側からみた説明として正しいのはどれか。",hosoku:true,
 choices:[
 ["細胞体が小さいニューロンほど興奮の閾値が低く、先に活動する",true,""],
 ["細胞体が大きいニューロンほど閾値が低く、先に活動する",false,"これでは動員の順序が逆になってしまう。"],
 ["細胞体の大きさと閾値の間に関係はない",false,"大きさと閾値の間には一定の関係がある。"],
 ["閾値は細胞体ではなく軸索の長さで決まる",false,"軸索の長さで動員の順序が決まるわけではない。"]],
 exp:"補足知識（資料外）。小径の細胞ほど小さな入力で興奮するため、先に動員される。教科書は運動単位のサイズ（発生する力）で説明しており、細胞体の大きさには触れていない（P47）。"},

 choices:[

 ["FF型",false,"単収縮が速く大きいが、疲労しやすい型である。"],

 choices:[
 ["大きなサイズの運動単位まで動員されるが、その型は疲労しやすい",true,""],
 ["小さなサイズの運動単位だけが、活動頻度を上げて対応する",false,"大きな力を出すときには、大きなサイズの型まで加わる。"],

 choices:[

 ["筋が短くなりながら力を発揮する収縮では、はじめから大きな運動単位が動員される",false,"求心性（短縮性）収縮では原則どおりの順序で動員される。"],
 ["等尺性収縮では、動員の順序が毎回入れ替わる",false,"順序が毎回変わるという報告はない。"],
 ["疲労が進むと、動員の順序が小さいものから大きいものへと逆転する",false,"もともと小さいものが先なので、これでは逆転にならない。"]],
 exp:"補足知識（資料外）。通常はサイズの原理に従って小さなサイズの運動単位（S型）から動員されるが、遠心性（伸張性）収縮では速筋線維をもつ大きな運動単位が優先的に動員されるという報告がある。坂道を下る、着地の衝撃を受け止めるといった動作で筋線維が傷つきやすく、遅発性筋痛が起こりやすいことの説明にも使われる。教科書には記載がない（遠心性（伸張性）収縮の定義は第2章P17）。"}
];

let mode="normal", drawn=[], idx=0, score=0, streak=0, answered=false, dead=false;
let qmiss=0, totalMiss=0, firstTryCount=0; // ミス回数の集計（通常モード）
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function home(){
  document.getElementById("htt").textContent="確認テスト";
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="0";
  document.getElementById("bd").innerHTML=`
    <div class="center">
      <p class="lead">モードを選んでスタート。<br>問題は毎回シャッフルされ、プール${POOL.length}問から${PICK}問が出題されます。</p>
      <div class="modes">
        <button class="mode" onclick="start('normal')">
          <div class="nm">通常モード</div>
          <div class="ds">${PICK}問を最後まで解いて採点します。ふだんの確認用。<span class="mark kihon" style="margin-left:4px">🎯基本</span> は落としちゃダメな基本問題、<span class="mark gori">⚠ 誤りを選ぶ</span> は誤っているものを選ぶ問題、<span class="mark hosoku">📘 補足（資料外）</span> は教科書外の国試頻出テーマ。</div>
        </button>
        <button class="mode dob" onclick="start('dobon')">
          <div class="nm">💣 ドボンチャレンジ</div>
          <div class="ds">プールの中のごく一部、<b>絶対に落とせない最重要問題</b>だけが <b>💣ドボン！</b> に変身。それを外したらそこで終了。どこまで正解を続けられるか挑戦！</div>
        </button>
      </div>
    </div>`;
  document.getElementById("ctrl").innerHTML="";
}
function start(m){
  mode=m; drawn=shuffle(POOL).slice(0,Math.min(PICK,POOL.length));
  idx=0;score=0;streak=0;dead=false;totalMiss=0;firstTryCount=0;render();
}
function render(){
  answered=false; qmiss=0;
  const item=drawn[idx];
  const opts=shuffle(item.choices);
  const isDob=(mode==="dobon" && item.dobon);
  document.getElementById("htt").textContent=(mode==="dobon")?"ドボンチャレンジ":"確認テスト";
  document.getElementById("pg").textContent=`問 ${idx+1} / ${drawn.length}`;
  document.getElementById("bar").style.width=(idx/drawn.length*100)+"%";
  const L=["ア","イ","ウ","エ","オ"];
  // ドボン対象の問題だけ💣に変わる。それ以外の🎯基本は通常どおり🎯のまま表示する
  let markHtml = isDob ? `<span class="mark dobon">💣 ドボン！</span>`
                       : (item.kihon ? `<span class="mark kihon">🎯 基本</span>` : "");
  if(item.gori)   markHtml += `<span class="mark gori">⚠ 誤りを選ぶ</span>`;
  if(item.hosoku) markHtml += `<span class="mark hosoku">📘 補足（資料外）</span>`;
  // 誤り選択問題は、設問中の「誤っている」を赤字にして読み飛ばしを防ぐ
  const qText = item.gori ? item.q.replace("誤っている",'<span class="ng">誤っている</span>') : item.q;
  let h=`<div class="qnum">Q${idx+1} ${markHtml}</div><div class="q">${qText}</div><div class="opts">`;
  opts.forEach((o,i)=>{h+=`<button class="opt" onclick="pick(this,${o[1]})"><span class="mk">${L[i]}</span><span>${o[0]}</span></button>`;});
  h+=`</div><div class="exp" id="exp"><div class="vd" id="vd"></div><div class="tx" id="tx"></div></div>`;
  document.getElementById("bd").innerHTML=h;
  document.getElementById("ctrl").innerHTML=`<button class="btn" id="nx" onclick="next()" disabled>解答を選んでください</button>`;
}
function pick(el,ok){
  if(answered)return;
  if(el.classList.contains("dis"))return; // 無効化済みの選択肢は再カウントしない
  const item=drawn[idx];
  const isDob=(mode==="dobon" && item.dobon);
  const selText=el.querySelector("span:last-child").textContent;
  const selChoice=item.choices.find(c=>c[0]===selText);
  const exp=document.getElementById("exp");
  const nx=document.getElementById("nx");

  if(ok){
    // 正解：ここで確定。正解した選択肢だけ緑にする（不正解の選択肢は先に色を変えない）
    answered=true;
    el.classList.add("correct");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    score++;
    if(mode!=="dobon"){ if(qmiss===0) firstTryCount++; }
    if(mode==="dobon") streak++;
    exp.className="exp show ok";
    document.getElementById("vd").textContent="正解！";
    document.getElementById("tx").innerHTML=item.exp;
    nx.disabled=false;
    nx.textContent=(idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶";
    return;
  }

  // 不正解
  if(mode==="dobon"){
    // ドボンモードは一発勝負：選び直しなし・正解は伏せる
    answered=true;
    el.classList.add("wrong");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    if(item.dobon){ dead=true; } // 💣ドボン対象を外したときだけ終了
    exp.className="exp show ng";
    document.getElementById("vd").textContent=isDob?"💣 ドボン！":"不正解";
    document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}`;
    nx.disabled=false;
    nx.textContent=dead?"結果を見る（ドボン）▶":((idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶");
    return;
  }

  // 通常モード：ミスを数え、選んだ選択肢だけ赤にして無効化。正解は伏せたまま選び直せる
  qmiss++; totalMiss++;
  el.classList.add("wrong","dis");
  exp.className="exp show ng";
  document.getElementById("vd").textContent="不正解（ミス "+qmiss+"回）";
  document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}<br>ほかの選択肢からもう一度選んでください。`;
  // 「次へ」はまだ出さない（正解するまで進めない）
}
function next(){
  if(dead){result();return;}
  if(idx+1<drawn.length){idx++;render();}
  else result();
}
function result(){
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="100%";
  if(mode==="dobon"){
    document.getElementById("htt").textContent="結果";
    if(dead){
      document.getElementById("bd").innerHTML=`<div class="center score dead">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>ドボンを踏んでしまいました</div>
        <div class="big">${streak} 問連続正解</div>
        <div class="msg">${idx}問正解のあと、${idx+1}問目でドボン。<br>上の解説を復習して再挑戦しましょう。</div>
      </div>`;
    }else{
      document.getElementById("bd").innerHTML=`<div class="center score">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>クリア！</div>
        <div class="big">${score} / ${drawn.length}</div>
        <div class="msg">ドボンを踏まず完走しました。お見事！</div>
      </div>`;
    }
  }else{
    document.getElementById("htt").textContent="結果";
    const n=drawn.length;
    const ftPct=Math.round(firstTryCount/n*100);
    const noMiss=(totalMiss===0);
    let head = noMiss
      ? `<div class="big">✨ ノーミス パーフェクト！</div><div>全 ${n} 問を一発で正解</div>`
      : `<div>今回の成績</div><div class="big">${firstTryCount} / ${n}</div><div>一発正解率 ${ftPct}%</div>`;
    let stat = `<div class="stats">一発正解 ${firstTryCount}問　｜　総ミス ${totalMiss}回</div>`;
    let msg = noMiss?"完璧です。この調子！":ftPct>=60?"よくできました。ミスした問題を復習しましょう。":"もう一度スライドで確認してから挑戦しましょう。";
    document.getElementById("bd").innerHTML=`<div class="center score">${head}${stat}<div class="msg">${msg}</div></div>`;
  }
  document.getElementById("ctrl").innerHTML=`<button class="btn sub" onclick="home()">モード選択へ</button><button class="btn" onclick="start(mode)">もう一度（シャッフル）▶</button>`;
}
home();
</script>
</body>
</html>
