<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:#f0f2f5;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 12px}
h1{font-size:14px;color:#555;margin-bottom:16px;font-weight:400;letter-spacing:.05em}
.slide{width:100%;max-width:820px;background:#fff;border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,.10);overflow:hidden}
.hd{background:#9e3450;padding:14px 28px;display:flex;align-items:center;justify-content:space-between}
.hd .ch{font-size:11px;color:#e8b3c1;font-weight:500;letter-spacing:.07em;margin-bottom:3px}
.hd .tt{font-size:19px;font-weight:500;color:#fff}
.hd .pg{font-size:12px;color:#e8b3c1;font-weight:500;white-space:nowrap;margin-left:14px}
.bar{height:5px;background:#e5e7eb;overflow:hidden}
.bar > i{display:block;height:100%;background:#9e3450;transition:width .3s;width:0}
.bd{padding:22px 28px 18px;background:#fff;min-height:300px}
.qnum{font-size:11px;font-weight:600;color:#9e3450;letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mark{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px}
.mark.kihon{background:rgba(158,52,80,.13);color:#84293f}
.mark.dobon{background:rgba(200,60,40,.14);color:#c33c28}
.mark.gori{background:rgba(168,50,46,.13);color:#a8322e;border:1px solid rgba(168,50,46,.35)}
.mark.hosoku{background:rgba(40,90,140,.12);color:#285a8c;border:1px solid rgba(40,90,140,.3)}
.q{font-size:16px;line-height:1.8;color:#1a1a1a;font-weight:500;margin-bottom:18px}
.q .ng{color:#a8322e;font-weight:700}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:left;font-size:14.5px;line-height:1.6;color:#222;background:#f8f9fb;border:1.5px solid #e5e7eb;border-radius:9px;padding:12px 15px;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;gap:10px;align-items:flex-start}
.opt .mk{flex-shrink:0;width:22px;height:22px;border-radius:50%;border:1.5px solid #c3c8d0;color:#888;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.opt:not(.dis):hover{border-color:#9e3450;background:#fdf3f5}
.opt.dis{cursor:default}
.opt.correct{border-color:#1f9d6b;background:#e9f8f1}
.opt.correct .mk{border-color:#1f9d6b;background:#1f9d6b;color:#fff}
.opt.wrong{border-color:#d0483f;background:#fdeceb}
.opt.wrong .mk{border-color:#d0483f;background:#d0483f;color:#fff}
.exp{margin-top:16px;border-radius:9px;padding:14px 16px;font-size:14px;line-height:1.85;display:none}
.exp.show{display:block}
.exp.ok{background:#e9f8f1;border:1px solid #b6e6d1}
.exp.ng{background:#fdeceb;border:1px solid #f2c4c0}
.exp .vd{font-weight:700;font-size:15px;margin-bottom:4px}
.exp.ok .vd{color:#1f9d6b}
.exp.ng .vd{color:#d0483f}
.exp .tx{color:#333}
.exp .tx b{color:#111}
.ctrl{display:flex;align-items:center;gap:8px;padding:12px 28px 14px;background:#f8f9fb;border-top:1px solid #e5e7eb;border-radius:0 0 12px 12px}
.btn{padding:9px 18px;border-radius:7px;border:1px solid #9e3450;background:#9e3450;color:#fff;font-size:13px;cursor:pointer;font-family:inherit;font-weight:500;transition:background .15s;margin-left:auto}
.btn:hover{background:#84293f}
.btn:disabled{opacity:.4;cursor:default}
.btn.sub{background:#fff;color:#9e3450;border-color:#d1d5db;margin-left:0}
.btn.sub:hover{background:#f0f2f5}
.center{text-align:center;padding:14px 10px}
.center .lead{font-size:14px;color:#555;line-height:1.8;margin-bottom:20px}
.modes{display:flex;flex-direction:column;gap:12px;max-width:470px;margin:0 auto}
.mode{text-align:left;border:1.5px solid #e5e7eb;border-radius:11px;padding:15px 18px;cursor:pointer;background:#fff;transition:all .15s;font-family:inherit}
.mode:hover{border-color:#9e3450;background:#fdf3f5}
.mode .nm{font-size:16px;font-weight:600;color:#9e3450;margin-bottom:4px}
.mode .ds{font-size:13px;color:#666;line-height:1.7}
.mode.dob .nm{color:#c33c28}
.mode.dob:hover{border-color:#c33c28;background:#fdefec}
.score .big{font-size:40px;font-weight:700;color:#9e3450;margin:6px 0}
.score.dead .big{color:#c33c28}
.score .msg{font-size:15px;color:#444;line-height:1.8;margin-top:8px}
.score .stats{display:inline-block;margin-top:12px;font-size:13px;font-weight:600;color:#84293f;background:rgba(158,52,80,.09);padding:7px 16px;border-radius:20px}
.tag{display:inline-block;font-size:12px;font-weight:600;color:#9e3450;background:rgba(158,52,80,.1);padding:3px 12px;border-radius:20px;margin-bottom:6px}
.tag.dob{color:#c33c28;background:rgba(200,60,40,.12)}
</style>

<body>
<h1>生理学 第2章 筋の生理｜パートD 確認テスト</h1>
<div class="slide">
  <div class="hd"><div><div class="ch">第2章 筋の生理 ｜ D 張力の関係・筋電図・心筋・平滑筋</div><div class="tt" id="htt">確認テスト</div></div><div class="pg" id="pg"></div></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="bd" id="bd"></div>
  <div class="ctrl" id="ctrl"></div>
</div>
<script>
/* ===== 問題プール（教科書 第2章 P17〜21 ベース）=====
   choices: [表示文, 正解フラグ, その選択肢が何かの説明]
   kihon :true … 落としちゃダメな基本問題（🎯基本／ドボンモードでは💣ドボン！）
   gori  :true … 「誤っているのはどれか」形式。true が付くのは「誤っている記述」＝選ぶべき選択肢
   hosoku:true … 教科書に記述のない補足知識（国試過去問・夏期講習の頻出テーマ）。🎯基本にはしない
   exp … 正解時に見せる「なぜ正しいか」 */
const PICK=5;
const POOL=[
/* ---- 長さ-張力関係 ---- */
{q:"サルコメア長と張力の関係で、もっとも大きい張力を発揮するサルコメア長を何と呼ぶか。",kihon:true,
 choices:[
  ["至適長",true,""],
  ["上行脚",false,"至適長より短い領域のこと。"],
  ["下行脚",false,"至適長より長い領域のこと。"],
  ["長さ-張力関係",false,"長さと張力の関係全体を指す呼び名で、特定の長さのことではない。"]],
 exp:"ヒトではサルコメア長が2.64〜2.81μmのときもっとも大きい張力を発揮し、このときのサルコメア長を至適長と呼ぶ。"},

{q:"至適長で張力がもっとも大きくなる理由はどれか。",kihon:true,
 choices:[
  ["ミオシンフィラメントとアクチンフィラメントの重なりの数がもっとも多くなるから",true,""],
  ["サルコメアの数がもっとも多くなるから",false,"サルコメアの数は長さによって増減するものではない。"],
  ["ATPの分解速度がもっとも速くなるから",false,"張力を決めているのはフィラメントの重なりの数。"],
  ["筋線維の横断面積がもっとも大きくなるから",false,"横断面積は長さとは別の、力を決める解剖学的要因。"]],
 exp:"張力はフィラメントの重なりの数に依存し、重なりの数はサルコメアの長さに依存する。このため張力はサルコメア長に依存して変化する。"},

{q:"サルコメア長が至適長より長い領域を何と呼ぶか。",
 choices:[
  ["下行脚",true,""],
  ["上行脚",false,"至適長より短い領域のこと。"],
  ["至適長",false,"最大張力を発揮するサルコメア長そのもの。"],
  ["長さ-張力関係",false,"長さと張力の関係全体を指す呼び名。"]],
 exp:"至適長より長い場合は、ミオシンフィラメントとアクチンフィラメントの重なりの数が減少するため張力が小さくなる。この領域を長さ-張力関係の下行脚と呼ぶ。"},

/* ---- 収縮速度・横断面積と張力 ---- */
{q:"求心性（短縮性）収縮における収縮速度と張力の関係で正しいのはどれか。",kihon:true,
 choices:[
  ["収縮速度の上昇に伴い張力は減少する",true,""],
  ["収縮速度の上昇に伴い張力は増大する",false,"変化の向きが逆。"],
  ["収縮速度が変わっても張力は変わらない",false,"動的収縮では、発揮できる張力は収縮速度に依存する。"],
  ["収縮速度は張力とはまったく無関係である",false,"動的収縮では張力は収縮速度に依存する。"]],
 exp:"速い求心性（短縮性）収縮ではアクチンフィラメントが素早く滑走するため、ミオシンとアクチンの結合が生じにくくなり、張力が減少する。"},

{q:"遠心性（伸張性）収縮の発揮張力について正しいのはどれか。",kihon:true,
 choices:[
  ["等尺性収縮時よりも大きくなる",true,""],
  ["等尺性収縮時よりも小さくなる",false,"変化の向きが逆。"],
  ["等尺性収縮時と同じになる",false,"等尺性収縮時より大きくなる。"],
  ["求心性収縮時よりも小さくなる",false,"求心性収縮時より大きい。"]],
 exp:"外的負荷が発揮張力より大きい遠心性（伸張性）収縮では、ミオシン頭部がアクチンを引き込もうとするにもかかわらず筋が引き伸ばされる。この状態では発揮張力は等尺性収縮時よりも大きくなる。"},

{q:"筋線維の横断面積が決める要因はどれか。",kihon:true,
 choices:[
  ["力",true,""],
  ["収縮速度",false,"筋線維の長さが決める要因。"],
  ["疲労耐性",false,"筋線維のタイプ（遅筋・速筋）によって決まる。"],
  ["至適長",false,"サルコメア長に関する特性で、横断面積とは別。"]],
 exp:"筋線維の横断面積（太さ）が力を、長さが収縮速度を決める解剖学的要因となる。横断面積が大きいほどミオシンとアクチンの結合の数が多い。"},

/* ---- 筋電図 ---- */
{q:"筋電図の振幅値を増減させる要因の組合せで正しいのはどれか。",kihon:true,
 choices:[
  ["動員されている運動単位数と、その発火頻度",true,""],
  ["筋線維の横断面積と長さ",false,"張力や収縮速度を決める解剖学的要因で、振幅値の直接の要因ではない。"],
  ["サルコメア長と至適長",false,"長さ-張力関係に関わる要素。"],
  ["ATP濃度と乳酸濃度",false,"代謝に関わる指標。"]],
 exp:"筋電図の振幅値は、動員されている運動単位数のほか、それら運動単位の発火頻度（興奮頻度）で増減する。発揮張力が増大すれば振幅値は大きくなる。"},

{q:"筋電図振幅値が示すものとして正しいのはどれか。",
 choices:[
  ["当該筋の筋収縮に対する指令の大きさ",true,""],
  ["筋が発揮している張力そのもの",false,"筋電図は電気的活動状態をとらえるもので、張力そのものを評価できるわけではない。"],
  ["筋線維内のATP濃度",false,"代謝に関わる指標で、筋電図が測るものではない。"],
  ["サルコメアの長さ",false,"長さ-張力関係に関わる要素で、筋電図が測るものではない。"]],
 exp:"筋電図振幅値は、当該筋の筋収縮に対する指令の大きさを示す。筋収縮時の電気的活動状態をとらえるものであって、筋収縮自体や筋の張力を評価できるわけではない（筋力と振幅値にはおおむね直線関係が認められる）。"},

{q:"筋電図での評価について正しいのはどれか。",
 choices:[
  ["筋電図振幅値では、脊髄運動ニューロンの興奮性が過小評価される可能性がある",true,""],
  ["筋電図振幅値は筋の張力そのものを直接測定している",false,"電気的活動状態をとらえるもので、張力そのものの評価ではない。"],
  ["等尺性収縮では運動が生じないため筋電図は記録できない",false,"運動は生じなくても神経筋活動は生じるので記録できる。"],
  ["筋電図の振幅値は発揮張力が増大しても変わらない",false,"発揮張力が増大すれば筋電図振幅値は大きくなる。"]],
 exp:"一般的に用いられる双極誘導で記録される筋電図では、個々の活動電位が正と負の局面をもつ。複数の活動電位が同時に記録されると波形の干渉で打ち消しあうことがあり、脊髄運動ニューロンの興奮性が過小評価される可能性がある。振幅値には他に、運動単位の同期発火の度合い、筋の疲労状態（筋内pHなど）、筋線維伝導速度、筋温なども影響する。"},

/* ---- 心筋 ---- */
{q:"心筋のうち、興奮の発生と伝導を役割とするのはどれか。",kihon:true,
 choices:[
  ["特殊心筋",true,""],
  ["固有心筋",false,"収縮を担当する心筋。"],
  ["平滑筋",false,"中腔臓器の壁を構成する筋で、心筋の分類ではない。"],
  ["骨格筋",false,"骨に付着して関節を動かす筋。"]],
 exp:"心臓を構成する心筋は、収縮を担当する固有心筋と、興奮の発生と伝導を役割とする特殊心筋の2つに分けられる。"},

{q:"固有心筋線維が形態的に分離していながら機能的につながっている状態を何と呼ぶか。",
 choices:[
  ["機能的合胞体",true,""],
  ["運動単位",false,"1つのα運動ニューロンとそれが支配する筋線維群のこと。"],
  ["介在板",false,"心筋線維同士の接合部にある構造そのものの名称。"],
  ["ギャップ結合",false,"介在板にあって、細胞どうしを電気的に結合させるしくみ。"]],
 exp:"介在板のギャップ結合を介してすべての固有心筋線維へ活動電位が伝わるため、心房や心室はそれぞれ一体として機能する。これを機能的合胞体と呼ぶ。"},

{q:"特殊心筋線維のうち、ペースメーカーの機能をもつのはどれか。",
 choices:[
  ["洞房結節と房室結節",true,""],
  ["固有心筋線維",false,"収縮を担当し、活動電位を自動的に生む機能はもたない。"],
  ["介在板",false,"心筋線維同士の接合部にある構造。"],
  ["心房と心室",false,"心臓の部屋の名称で、特殊心筋線維の種類ではない。"]],
 exp:"特殊心筋線維のうち洞房結節と房室結節は、活動電位を自動的に生むペースメーカーの機能をもつ点で固有心筋線維と異なる。"},

/* ---- 平滑筋 ---- */
{q:"平滑筋の収縮・弛緩の制御方法として正しいのはどれか。",kihon:true,
 choices:[
  ["ミオシン軽鎖のリン酸化と脱リン酸化",true,""],
  ["トロポニンへのCa²⁺の結合",false,"骨格筋や心筋で行われる制御。"],
  ["トロポミオシンの位置の移動",false,"これも骨格筋や心筋の制御方法。"],
  ["介在板のギャップ結合",false,"心筋で興奮を細胞から細胞へ伝えるしくみ。"]],
 exp:"骨格筋や心筋ではアクチンフィラメント上のトロポニンやトロポミオシンで収縮・弛緩が制御されるが、平滑筋ではミオシン軽鎖のリン酸化と脱リン酸化で行われる。"},

/* ---- 誤りを選ぶ ---- */
{q:"心筋の性質について誤っているのはどれか。",kihon:true,gori:true,
 choices:[
  ["固有心筋線維では収縮の加重（強縮）が起こる",true,""],
  ["固有心筋線維は活動電位の持続時間が長い",false,"教科書どおりの記述なので、正しい。"],
  ["収縮の強さの調節は自律神経やホルモンによって行われる",false,"教科書どおりの記述なので、正しい。"],
  ["拍動ごとに全心筋線維が興奮して収縮する",false,"教科書どおりの記述なので、正しい。"]],
 exp:"固有心筋線維は活動電位の持続時間が長いため、骨格筋線維と異なり収縮の加重（強縮）が起こらない。骨格筋との重要な違い。"},

{q:"平滑筋について誤っているのはどれか。",gori:true,
 choices:[
  ["ミオシンとアクチンが規則正しく配列し、縞模様を示す",true,""],
  ["細胞は紡錘形で、単一の核が中央部にある",false,"教科書どおりの記述なので、正しい。"],
  ["消化管や血管、子宮などの中腔臓器の壁にある",false,"教科書どおりの記述なので、正しい。"],
  ["収縮時間や収縮強度が器官ごとに大きく異なる",false,"教科書どおりの記述なので、正しい。"]],
 exp:"平滑筋はミオシンフィラメントとアクチンフィラメントが規則正しい配列をもたないため、横紋筋に特徴的な縞模様を示さない。この点で骨格筋線維や心筋線維とは形態的に大きく異なる。"},

{q:"長さ-張力関係について誤っているのはどれか。",gori:true,
 choices:[
  ["サルコメア長が至適長より短いほど張力は大きくなる",true,""],
  ["至適長より長い領域を下行脚と呼ぶ",false,"教科書どおりの記述なので、正しい。"],
  ["至適長より短い領域を上行脚と呼ぶ",false,"教科書どおりの記述なので、正しい。"],
  ["張力はフィラメントの重なりの数に依存する",false,"教科書どおりの記述なので、正しい。"]],
 exp:"短すぎても長すぎても張力は小さくなる。至適長より短い場合は、アクチンフィラメント同士が重なり合うなどの理由で張力が低下する。「短ければ短いほど強い」ではない。"},

/* ---- やや難 ---- */
{q:"骨格筋と心筋の比較で正しいのはどれか。",
 choices:[
  ["骨格筋では強縮が起こるが、心筋では起こらない",true,""],
  ["どちらも介在板をもつ",false,"介在板があるのは心筋のみ。"],
  ["どちらも運動神経によって収縮の強さが調節される",false,"心筋の調節は自律神経やホルモンによる。"],
  ["どちらも横紋をもたない",false,"骨格筋も心筋もどちらも横紋をもつ横紋筋。"]],
 exp:"骨格筋は収縮の加重によって強縮が起こるが、心筋は活動電位の持続時間が長いため強縮が起こらない。心臓が拡張と収縮を繰り返せるのは、この性質による。"},

{q:"同じ筋で、遠心性収縮・等尺性収縮・求心性収縮を発揮張力の大きい順に並べたものはどれか。",
 choices:[
  ["遠心性 ＞ 等尺性 ＞ 求心性",true,""],
  ["求心性 ＞ 等尺性 ＞ 遠心性",false,"順序が逆になっている。"],
  ["等尺性 ＞ 遠心性 ＞ 求心性",false,"遠心性収縮の発揮張力は等尺性収縮時を上回る。"],
  ["3つとも同じ張力になる",false,"筋が発揮できる力の大きさは、収縮様式および収縮速度によって異なる。"]],
 exp:"遠心性（伸張性）収縮では発揮張力が等尺性収縮時より大きくなり、求心性（短縮性）収縮では収縮速度の上昇に伴い張力が減少する。図2·7の曲線がこの順序を表している。"},

/* ---- 補足知識（教科書外・国試過去問／夏期講習の頻出テーマ） ---- */
{q:"心臓の正常なペースメーカーとしてはたらくのはどれか。",hosoku:true,
 choices:[
  ["洞房結節",true,""],
  ["房室結節",false,"ペースメーカー機能はもつが、通常は洞房結節のリズムに従う。"],
  ["プルキンエ線維",false,"心室へ興奮を伝える伝導路。"],
  ["固有心筋線維",false,"収縮を担当し、自動的に活動電位を生む機能はもたない。"]],
 exp:"補足知識（資料外）。刺激伝導系のうち、通常はもっとも発火頻度の高い洞房結節が心拍のリズムを決めている。"},

{q:"眼球にあり、平滑筋であるのはどれか。",hosoku:true,
 choices:[
  ["毛様体筋",true,""],
  ["外眼筋",false,"眼球を動かす骨格筋。"],
  ["横隔膜",false,"呼吸に関わる骨格筋。"],
  ["咬筋",false,"咀嚼に関わる骨格筋。"]],
 exp:"補足知識（資料外）。平滑筋は中腔臓器の壁のほか、眼球の毛様体筋、皮膚の立毛筋、外分泌腺の筋上皮にもある。"},

{q:"遠心性（伸張性）収縮の例として適切なのはどれか。",hosoku:true,
 choices:[
  ["階段を下りるときの大腿四頭筋",true,""],
  ["階段を上るときの大腿四頭筋",false,"筋が短くなりながら張力を発揮する求心性（短縮性）収縮。"],
  ["動かない壁を押すときの上肢の筋",false,"関節角度が変化しない等尺性収縮。"],
  ["荷物を持ったまま静止しているときの上腕二頭筋",false,"これも関節角度が変化しない等尺性収縮。"]],
 exp:"補足知識（資料外）。階段を下りるときは体重を支えながら膝が曲がるため、大腿四頭筋は伸ばされながら張力を発揮する。遅発性筋痛が起こりやすいのもこの収縮。"},

{q:"筋線維が太くなり筋力が増大する現象を何と呼ぶか。",hosoku:true,
 choices:[
  ["筋肥大",true,""],
  ["筋萎縮",false,"筋線維が細くなり筋力が低下する現象。"],
  ["筋硬直",false,"ATPが枯渇して筋が硬くなった状態。"],
  ["筋トーヌス",false,"変動の少ない基本張力のこと。"]],
 exp:"補足知識（資料外）。横断面積が力を決める解剖学的要因であるため、トレーニングによって筋線維が太くなれば、発揮できる力も大きくなる。"},

/* ---- 補足知識：誘発筋電図（H波・M波） ---- */
{q:"H波について正しいのはどれか。",hosoku:true,
 choices:[
  ["単シナプス反射回路を介して生じる",true,""],
  ["閾値はM波より高い",false,"H波のほうが閾値は低く、弱い刺激で先に出現する。"],
  ["Aα運動神経の直接の興奮によって生じる",false,"それはM波。H波は脊髄を経由する。"],
  ["潜時はM波より短い",false,"脊髄を経由する分、H波のほうが潜時は長い。"]],
 exp:"補足知識（資料外）。H波は、末梢神経内のⅠa群感覚線維を電気刺激し、同名筋における反射応答を筋電図で記録した波形。求心性線維→脊髄前角細胞→遠心性の運動神経、という単シナプス反射回路を通る。"},

{q:"M波が生じるしくみとして正しいのはどれか。",hosoku:true,
 choices:[
  ["α運動ニューロンが直接興奮し、脊髄を通らずに筋収縮が起こる",true,""],
  ["Ⅰa線維の興奮が脊髄を経由して筋収縮を起こす",false,"H波が生じるしくみ。"],
  ["筋紡錘が伸張されて反射が起こる",false,"腱反射（伸張反射）のしくみ。"],
  ["ゴルジ腱器官が興奮して筋が弛緩する",false,"Ⅰb抑制のしくみ。"]],
 exp:"補足知識（資料外）。電気刺激を強くしてα運動ニューロンの閾値に達すると、脊髄を通過せずに直接筋収縮が起こる。この記録がM波。刺激部位から筋までの距離が短いため、M波は潜時が小さい。"},

{q:"電気刺激を徐々に強くしたときのH波とM波の変化で正しいのはどれか。",hosoku:true,
 choices:[
  ["M波が最大になるとき、H波はみられない",true,""],
  ["M波が最大になるとき、H波も最大になる",false,"M波が最大のときH波は消失する。"],
  ["刺激を強くするほどH波は大きくなり続ける",false,"α運動ニューロンの閾値を超えると、H波はかえって小さくなる。"],
  ["H波はM波より閾値が高いため、あとから出現する",false,"閾値が低いのはH波のほうで、弱い刺激で先に出現する。"]],
 exp:"補足知識（資料外）。閾値の低いⅠa線維が先に興奮してH波が出る。刺激を強めてα運動ニューロンの閾値を超えると、順行性の活動電位と逆行性の活動電位が衝突してH波は小さくなり、すべてのα運動ニューロンが興奮してM波が最大になったとき、H波は消失する。"},

{q:"H波が代表的な指標として表すものはどれか。",hosoku:true,
 choices:[
  ["脊髄前角細胞（脊髄運動ニューロン）の興奮性",true,""],
  ["筋線維の横断面積",false,"力を決める解剖学的要因で、H波が表すものではない。"],
  ["筋小胞体のCa²⁺貯蔵量",false,"H波から知ることはできない。"],
  ["末梢神経の伝導速度",false,"潜時からある程度推定できるが、H波が代表的な指標とされるのは前角細胞の興奮性。"]],
 exp:"補足知識（資料外）。H波は骨格筋を支配する脊髄前角細胞の興奮性を表す代表的な指標とされる。教科書にある「筋電図振幅値では脊髄運動ニューロンの興奮性が過小評価される可能性がある」という話ともつながる。"},
];

let mode="normal", drawn=[], idx=0, score=0, streak=0, answered=false, dead=false;
let qmiss=0, totalMiss=0, firstTryCount=0; // ミス回数の集計（通常モード）
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function home(){
  document.getElementById("htt").textContent="確認テスト";
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="0";
  document.getElementById("bd").innerHTML=`
    <div class="center">
      <p class="lead">モードを選んでスタート。<br>問題は毎回シャッフルされ、プール${POOL.length}問から${PICK}問が出題されます。</p>
      <div class="modes">
        <button class="mode" onclick="start('normal')">
          <div class="nm">通常モード</div>
          <div class="ds">${PICK}問を最後まで解いて採点します。ふだんの確認用。<span class="mark kihon" style="margin-left:4px">🎯基本</span> は落としちゃダメな基本問題、<span class="mark gori">⚠ 誤りを選ぶ</span> は誤っているものを選ぶ問題、<span class="mark hosoku">📘 補足</span> は教科書外の国試頻出テーマ。</div>
        </button>
        <button class="mode dob" onclick="start('dobon')">
          <div class="nm">💣 ドボンチャレンジ</div>
          <div class="ds">🎯基本の問題は <b>💣ドボン！</b> に変身。1問でも外したら、解説を見てそこで終了。どこまで正解を続けられるか挑戦！</div>
        </button>
      </div>
    </div>`;
  document.getElementById("ctrl").innerHTML="";
}
function start(m){
  mode=m; drawn=shuffle(POOL).slice(0,Math.min(PICK,POOL.length));
  idx=0;score=0;streak=0;dead=false;totalMiss=0;firstTryCount=0;render();
}
function render(){
  answered=false; qmiss=0;
  const item=drawn[idx];
  const opts=shuffle(item.choices);
  const isDob=(mode==="dobon" && item.kihon);
  document.getElementById("htt").textContent=(mode==="dobon")?"ドボンチャレンジ":"確認テスト";
  document.getElementById("pg").textContent=`問 ${idx+1} / ${drawn.length}`;
  document.getElementById("bar").style.width=(idx/drawn.length*100)+"%";
  const L=["ア","イ","ウ","エ","オ"];
  let markHtml = item.kihon ? (isDob?`<span class="mark dobon">💣 ドボン！</span>`:`<span class="mark kihon">🎯 基本</span>`) : "";
  if(item.gori)   markHtml += `<span class="mark gori">⚠ 誤りを選ぶ</span>`;
  if(item.hosoku) markHtml += `<span class="mark hosoku">📘 補足（資料外）</span>`;
  // 誤り選択問題は、設問中の「誤っている」を赤字にして読み飛ばしを防ぐ
  const qText = item.gori ? item.q.replace("誤っている",'<span class="ng">誤っている</span>') : item.q;
  let h=`<div class="qnum">Q${idx+1} ${markHtml}</div><div class="q">${qText}</div><div class="opts">`;
  opts.forEach((o,i)=>{h+=`<button class="opt" onclick="pick(this,${o[1]})"><span class="mk">${L[i]}</span><span>${o[0]}</span></button>`;});
  h+=`</div><div class="exp" id="exp"><div class="vd" id="vd"></div><div class="tx" id="tx"></div></div>`;
  document.getElementById("bd").innerHTML=h;
  document.getElementById("ctrl").innerHTML=`<button class="btn" id="nx" onclick="next()" disabled>解答を選んでください</button>`;
}
function pick(el,ok){
  if(answered)return;
  if(el.classList.contains("dis"))return; // 無効化済みの選択肢は再カウントしない
  const item=drawn[idx];
  const isDob=(mode==="dobon" && item.kihon);
  const selText=el.querySelector("span:last-child").textContent;
  const selChoice=item.choices.find(c=>c[0]===selText);
  const exp=document.getElementById("exp");
  const nx=document.getElementById("nx");

  if(ok){
    // 正解：ここで確定。正解した選択肢だけ緑にする（不正解の選択肢は先に色を変えない）
    answered=true;
    el.classList.add("correct");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    score++;
    if(mode!=="dobon"){ if(qmiss===0) firstTryCount++; }
    if(mode==="dobon") streak++;
    exp.className="exp show ok";
    document.getElementById("vd").textContent=(qmiss===0)?"正解！":"正解！（"+qmiss+"回目で正解）";
    document.getElementById("tx").innerHTML=item.exp;
    nx.disabled=false;
    nx.textContent=(idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶";
    return;
  }

  // 不正解
  if(mode==="dobon"){
    // ドボンモードは一発勝負：選び直しなし・正解は伏せる
    answered=true;
    el.classList.add("wrong");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    if(item.kihon){ dead=true; }
    exp.className="exp show ng";
    document.getElementById("vd").textContent=isDob?"💣 ドボン！":"不正解";
    document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}`;
    nx.disabled=false;
    nx.textContent=dead?"結果を見る（ドボン）▶":((idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶");
    return;
  }

  // 通常モード：ミスを数え、選んだ選択肢だけ赤にして無効化。正解は伏せたまま選び直せる
  qmiss++; totalMiss++;
  el.classList.add("wrong","dis");
  exp.className="exp show ng";
  document.getElementById("vd").textContent="不正解（ミス "+qmiss+"回）";
  document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}<br>ほかの選択肢からもう一度選んでください。`;
  // 「次へ」はまだ出さない（正解するまで進めない）
}
function next(){
  if(dead){result();return;}
  if(idx+1<drawn.length){idx++;render();}
  else result();
}
function result(){
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="100%";
  if(mode==="dobon"){
    document.getElementById("htt").textContent="結果";
    if(dead){
      document.getElementById("bd").innerHTML=`<div class="center score dead">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>ドボンを踏んでしまいました</div>
        <div class="big">${streak} 問連続正解</div>
        <div class="msg">${idx}問正解のあと、${idx+1}問目でドボン。<br>上の解説を復習して再挑戦しましょう。</div>
      </div>`;
    }else{
      document.getElementById("bd").innerHTML=`<div class="center score">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>クリア！</div>
        <div class="big">${score} / ${drawn.length}</div>
        <div class="msg">ドボンを踏まず完走しました。お見事！</div>
      </div>`;
    }
  }else{
    document.getElementById("htt").textContent="結果";
    const n=drawn.length;
    const ftPct=Math.round(firstTryCount/n*100);
    const noMiss=(totalMiss===0);
    let head = noMiss
      ? `<div class="big">✨ ノーミス パーフェクト！</div><div>全 ${n} 問を一発で正解</div>`
      : `<div>今回の成績</div><div class="big">${firstTryCount} / ${n}</div><div>一発正解率 ${ftPct}%</div>`;
    let stat = `<div class="stats">一発正解 ${firstTryCount}問　｜　総ミス ${totalMiss}回</div>`;
    let msg = noMiss?"完璧です。この調子！":ftPct>=60?"よくできました。ミスした問題を復習しましょう。":"もう一度スライドで確認してから挑戦しましょう。";
    document.getElementById("bd").innerHTML=`<div class="center score">${head}${stat}<div class="msg">${msg}</div></div>`;
  }
  document.getElementById("ctrl").innerHTML=`<button class="btn sub" onclick="home()">モード選択へ</button><button class="btn" onclick="start(mode)">もう一度（シャッフル）▶</button>`;
}
home();
</script>
</body>
</html>
