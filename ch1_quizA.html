<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:#f0f2f5;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 12px}
h1{font-size:14px;color:#555;margin-bottom:16px;font-weight:400;letter-spacing:.05em}
.slide{width:100%;max-width:820px;background:#fff;border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,.10);overflow:hidden}
.hd{background:#0e6b6b;padding:14px 28px;display:flex;align-items:center;justify-content:space-between}
.hd .ch{font-size:11px;color:#a3ddd8;font-weight:500;letter-spacing:.07em;margin-bottom:3px}
.hd .tt{font-size:19px;font-weight:500;color:#fff}
.hd .pg{font-size:12px;color:#a3ddd8;font-weight:500;white-space:nowrap;margin-left:14px}
.bar{height:5px;background:#e5e7eb;overflow:hidden}
.bar > i{display:block;height:100%;background:#0e6b6b;transition:width .3s;width:0}
.bd{padding:22px 28px 18px;background:#fff;min-height:300px}
.qnum{font-size:11px;font-weight:600;color:#0e6b6b;letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mark{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px}
.mark.kihon{background:rgba(14,107,107,.13);color:#0b5c5c}
.mark.dobon{background:rgba(200,60,40,.14);color:#c33c28}
.mark.gori{background:rgba(109,63,158,.12);color:#6d3f9e;border:1px solid rgba(109,63,158,.35)}
.mark.hosoku{background:rgba(160,110,20,.14);color:#8a6314;border:1px solid rgba(160,110,20,.35)}
.q{font-size:16px;line-height:1.8;color:#1a1a1a;font-weight:500;margin-bottom:18px}
.q .ng{color:#6d3f9e;font-weight:700}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:left;font-size:14.5px;line-height:1.6;color:#222;background:#f8f9fb;border:1.5px solid #e5e7eb;border-radius:9px;padding:12px 15px;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;gap:10px;align-items:flex-start}
.opt .mk{flex-shrink:0;width:22px;height:22px;border-radius:50%;border:1.5px solid #c3c8d0;color:#888;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.opt:not(.dis):hover{border-color:#0e6b6b;background:#f0faf9}
.opt.dis{cursor:default}
.opt.correct{border-color:#1f9d6b;background:#e9f8f1}
.opt.correct .mk{border-color:#1f9d6b;background:#1f9d6b;color:#fff}
.opt.wrong{border-color:#d0483f;background:#fdeceb}
.opt.wrong .mk{border-color:#d0483f;background:#d0483f;color:#fff}
.exp{margin-top:16px;border-radius:9px;padding:14px 16px;font-size:14px;line-height:1.85;display:none}
.exp.show{display:block}

.exp.ng{background:#fdeceb;border:1px solid #f2c4c0}
.exp .vd{font-weight:700;font-size:15px;margin-bottom:4px}
.exp.ok .vd{color:#1f9d6b}
.exp.ng .vd{color:#d0483f}
.exp .tx{color:#333}
.exp .tx b{color:#111}
.ctrl{display:flex;align-items:center;gap:8px;padding:12px 28px 14px;background:#f8f9fb;border-top:1px solid #e5e7eb;border-radius:0 0 12px 12px;flex-wrap:wrap}
.btn{padding:9px 18px;border-radius:7px;border:1px solid #0e6b6b;background:#0e6b6b;color:#fff;font-size:13px;cursor:pointer;font-family:inherit;font-weight:500;transition:background .15s;margin-left:auto}
.btn:hover{background:#0a5555}
.btn:disabled{opacity:.4;cursor:default}
.btn.sub{background:#fff;color:#0e6b6b;border-color:#d1d5db;margin-left:0}
.btn.sub:hover{background:#f0f2f5}
.center{text-align:center;padding:14px 10px}
.center .lead{font-size:14px;color:#555;line-height:1.8;margin-bottom:20px}
.modes{display:flex;flex-direction:column;gap:12px;max-width:470px;margin:0 auto}
.mode{text-align:left;border:1.5px solid #e5e7eb;border-radius:11px;padding:15px 18px;cursor:pointer;background:#fff;transition:all .15s;font-family:inherit}
.mode:hover{border-color:#0e6b6b;background:#f0faf9}
.mode .nm{font-size:16px;font-weight:600;color:#0e6b6b;margin-bottom:4px}
.mode .ds{font-size:13px;color:#666;line-height:1.7}
.mode.dob .nm{color:#c33c28}
.mode.dob:hover{border-color:#c33c28;background:#fdefec}
.score .big{font-size:40px;font-weight:700;color:#0e6b6b;margin:6px 0}
.score.dead .big{color:#c33c28}
.score .msg{font-size:15px;color:#444;line-height:1.8;margin-top:8px}
.score .stats{display:inline-block;margin-top:12px;font-size:13px;font-weight:600;color:#0b5c5c;background:rgba(14,107,107,.09);padding:7px 16px;border-radius:20px}
.tag{display:inline-block;font-size:12px;font-weight:600;color:#0e6b6b;background:rgba(14,107,107,.1);padding:3px 12px;border-radius:20px;margin-bottom:6px}
.tag.dob{color:#c33c28;background:rgba(200,60,40,.12)}
</style>
</head>
<body>
<h1>生理学 第1章 生理学とは｜パートA 確認テスト</h1>
<div class="slide">
  <div class="hd"><div><div class="ch">第1章 生理学とは ｜ 生理学とは・A-1 細胞膜</div><div class="tt" id="htt">確認テスト</div></div><div class="pg" id="pg"></div></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="bd" id="bd"></div>
  <div class="ctrl" id="ctrl"></div>
</div>
<script>
/* ===== 問題プール（教科書 第1章 P1〜4 ベース）=====
   choices: [表示文, 正解フラグ, その選択肢が何かの説明]
   kihon:true … 🎯基本　dobon:true … 💣ドボン（ドボンモードで外したら終了）
   gori:true … ⚠誤りを選ぶ　hosoku:true … 📘補足（資料外）
   2026年11月 全面改訂（初版12問 → 25問、ドボン分離の新エンジン） */
const PICK=5;
const POOL=[
/* ---------- 生理学とは（P1） ---------- */
{q:"からだの構造を明らかにする学問はどれか。",kihon:true,
 choices:[
  ["解剖学",true,""],
  ["生理学",false,"物理学的・化学的方法で生命活動（しくみとはたらき）を探究する学問。"],
  ["生化学",false,"生体内の化学反応や物質を扱う学問で、構造そのものを対象とはしない。"],
  ["病理学",false,"病気による組織や細胞の変化を扱う学問。"]],
 exp:"<b>解剖学</b>はからだの構造を明らかにする学問。生理学は健康なヒトのからだのしくみとはたらきを扱う。（P1）"},

{q:"人体のすべての細胞が同一のDNAをもつのはなぜか。",
 choices:[
  ["すべて1個の受精卵が分裂して生じたから",true,""],
  ["分化によって同じ形態と機能をもつようになるから",false,"分化は、細胞が異なる形態や機能をもつようになること。"],
  ["細胞どうしがDNAを受け渡し合うから",false,"細胞の間でDNAを交換して同じにするしくみはない。"],
  ["同じ器官に属する細胞の集まりだから",false,"器官は組織の組み合わせでできたもので、人体の細胞は多くの器官に分かれている。"]],
 exp:"人体の約数十兆個の細胞は、すべて<b>1個の受精卵</b>が分裂して生じたため、同一のDNAをもつ。発達に伴って分化しても、DNAは同じ。（P1）"},

/* ---------- 細胞の構造（P1） ---------- */
{q:"細胞を構成する基本要素の組合せで正しいのはどれか。",kihon:true,
 choices:[
  ["細胞膜・細胞質・核",true,""],
  ["細胞膜・血漿・核",false,"血漿は細胞外液（体液）の成分で、細胞そのものの構成要素ではない。"],
  ["細胞質・核・染色体",false,"染色体は核の中にある構造で、細胞膜が抜けている。"],
  ["細胞膜・組織液・核",false,"組織液は細胞の外を満たす体液で、細胞の構成要素ではない。"]],
 exp:"細胞は、<b>細胞膜</b>に覆われた<b>細胞質</b>と<b>核</b>で構成されている。（P1）"},

/* ---------- 細胞膜の構造（P2） ---------- */
{q:"細胞膜のリン脂質について誤っているのはどれか。",kihon:true,gori:true,
 choices:[
  ["尾部は親水性である",true,""],
  ["頭部はリン酸基からなる",false,"教科書どおりの記述なので、正しい。"],
  ["尾部は2本の脂肪酸からなる",false,"教科書どおりの記述なので、正しい。"],
  ["二重に重なって膜をつくる",false,"教科書どおりの記述なので、正しい。"]],
 exp:"尾部は2本の脂肪酸からなり、膜の内側にあって<b>疎水性</b>。親水性なのはリン酸基からなる頭部。（P2）"},

{q:"膜タンパク質の存在のしかたで正しいのはどれか。",
 choices:[
  ["脂質二重層の中に島状に埋め込まれている",true,""],
  ["細胞膜の外側の表面にだけ付着している",false,"膜タンパク質は膜の中に埋め込まれ、物質の通り道になる。表面に付くだけでは、物質を膜の向こうへ通せない。"],
  ["2層のリン脂質の間に、1枚の層となって挟まれている",false,"膜タンパク質は層をつくらず、島のように点在している。"],
  ["細胞質基質に浮かんでいて、必要なときだけ膜に移動する",false,"膜タンパク質は細胞膜に埋め込まれた状態で物質の輸送を担う。"]],
 exp:"膜タンパク質は細胞膜に<b>島状に埋め込まれた</b>タンパク質で、物質の輸送を担う。（P2）"},

{q:"細胞膜のはたらきでないのはどれか。",kihon:true,
 choices:[
  ["ATPを産生する",true,""],
  ["特定のイオンを選択的に通過させる",false,"チャネルのはたらき。"],
  ["濃度勾配に逆らって物質を運ぶ",false,"膜タンパク質が仕事をする能動輸送のはたらき。"],
  ["細胞外の物質を受容体に結合させて取り込む",false,"エンドサイトーシスのはたらき。"]],
 exp:"ATPを産生するのは<b>ミトコンドリア</b>で、クエン酸回路や電子伝達系による。細胞膜は膜タンパク質や受容体を使って物質の出入りを担う。（P2〜3、P6）"},

{q:"特定のイオンを選択的に通過させる膜タンパク質はどれか。",kihon:true,
 choices:[
  ["チャネル",true,""],
  ["輸送体",false,"結合部位にぴったり合う物質やイオンしか通さない膜タンパク質。"],
  ["ヒストン",false,"DNAが巻きつくタンパク質で、膜輸送には関与しない。"],
  ["リボソーム",false,"タンパク質を合成する構造で、膜のイオン通過とは無関係。"]],
 exp:"<b>チャネル</b>は特定のイオンを選択的に通過させる。輸送体は結合部位に合う物質やイオンしか通さない。（P2）"},

/* ---------- 拡散・浸透・濾過（P3） ---------- */
{q:"細胞膜を自由に通過できる物質はどれか。",kihon:true,
 choices:[
  ["酸素",true,""],
  ["ナトリウムイオン",false,"イオンは自由に通過できず、チャネルや輸送体を必要とする。"],
  ["タンパク質",false,"大きな物質は自由に通れず、エンドサイトーシスで取り込まれる。"],
  ["グルコース",false,"水溶性の栄養素で、輸送体を介して運ばれる。"]],
 exp:"細胞膜は半透膜の性質をもち、<b>酸素</b>・二酸化炭素や脂溶性のアルコールなどは自由に通過できる。（P3）"},

{q:"物質が濃度の高いほうから低いほうへ自然に移動する現象はどれか。",kihon:true,dobon:true,
 choices:[
  ["拡散",true,""],
  ["浸透",false,"濃度の高い場所へ“水”が移動して水溶液を薄める現象。移動するのは物質ではなく水。"],
  ["濾過",false,"小さな穴に水溶液を通し、大きな物質を分ける現象。"],
  ["能動輸送",false,"濃度勾配に“逆らって”物質を移動させ、膜タンパク質の仕事を必要とする輸送。"]],
 exp:"<b>拡散</b>は、物質が濃度勾配に従って高いほうから低いほうへ自然に移動する現象。（P3）"},

{q:"代謝によって細胞内の酸素分圧が下がると、酸素が細胞外から細胞内へ移動する。このしくみはどれか。",
 choices:[
  ["拡散",true,""],
  ["浸透",false,"水が、濃度の高い側へ移動する現象。"],
  ["濾過",false,"圧力によって、水溶液を小さな穴に通して分けること。"],
  ["一次能動輸送",false,"ATPのエネルギーを使い、濃度勾配に逆らって運ぶ輸送。"]],
 exp:"酸素は細胞膜を自由に通過できるので、多い細胞外から少ない細胞内へ<b>拡散</b>する。（P3）"},

{q:"半透膜で仕切った容器の一方に濃い食塩水、もう一方に薄い食塩水を入れた。水はどちらへ移動するか。",kihon:true,dobon:true,
 choices:[
  ["濃い食塩水の側へ",true,""],
  ["薄い食塩水の側へ",false,"この向きに水が動くと、濃さの差がさらに広がってしまう。"],
  ["どちらへも移動しない",false,"濃度に差がある限り、水は移動する。"],
  ["両側へ同じ量ずつ移動する",false,"差し引きでは水が動かないのと同じになり、濃度の差が縮まらない。"]],
 exp:"浸透は、物質の濃度が高い場所へ水が移動し、水溶液を薄める現象。水は<b>濃い食塩水の側</b>へ移動する。（P3）"},

{q:"浸透圧の説明で正しいのはどれか。",
 choices:[
  ["水を、濃度の高い側へ引き寄せる力",true,""],
  ["物質を、濃度の高い側から低い側へ押し出す力",false,"濃度勾配に従って物質が自然に移るのは拡散で、力で押し出すものではない。"],
  ["水溶液を小さな穴に押し通す力",false,"濾過を起こす圧の説明。"],
  ["物質を濃度勾配に逆らって運ぶ力",false,"膜タンパク質が仕事をして運ぶ能動輸送の説明。"]],
 exp:"物質の濃度が高い場所へ水が移動し水溶液を薄める現象が浸透で、このときはたらく力が<b>浸透圧</b>。（P3）"},

{q:"腎臓の糸球体で、血球やタンパク質が血管内に残るしくみはどれか。",kihon:true,
 choices:[
  ["濾過",true,""],
  ["拡散",false,"濃度の高いほうから低いほうへ物質が自然に移動すること。大きさで物質を分けるしくみではない。"],
  ["浸透",false,"濃度の高い場所へ水が移動すること。圧力でこし出すしくみではない。"],
  ["エンドサイトーシス",false,"細胞外の大きな物質を、小胞として細胞内へ取り込むこと。"]],
 exp:"<b>濾過</b>は、小さな穴に水溶液を通して大きな物質を分けること。毛細血管の壁などで行われる。（P3。糸球体は第12章）"},

/* ---------- 受動輸送・能動輸送（P3） ---------- */
{q:"細胞膜を介した物質の移動のうち、駆動力を必要としないものはどれか。",
 choices:[
  ["受動輸送",true,""],
  ["一次能動輸送",false,"ATPのエネルギーを使って勾配に逆らう輸送で、駆動力が必要。"],
  ["二次能動輸送",false,"イオンの電気化学的勾配を使って物質を運ぶ能動輸送。"],
  ["エンドサイトーシス",false,"大きな物質を小胞として取り込むはたらきで、膜タンパク質を通る移動ではない。"]],
 exp:"膜タンパク質を通る物質が濃度勾配に従って移動するときは、駆動力を必要とせず受動的なので<b>受動輸送</b>と呼ぶ。（P3）"},

{q:"能動輸送について正しいのはどれか。",kihon:true,dobon:true,
 choices:[
  ["濃度勾配に逆らって物質を移動させる",true,""],
  ["濃度勾配に従って移動する",false,"これは受動輸送の説明。"],
  ["駆動力を必要としない",false,"これも受動輸送の特徴。能動輸送は膜タンパク質が仕事をする必要がある。"],
  ["半透膜による現象である",false,"半透膜の性質で説明されるのは拡散・浸透などで、膜タンパク質の仕事による輸送ではない。"]],
 exp:"<b>能動輸送</b>は濃度勾配に逆らって物質を移動させ、膜タンパク質が仕事をする必要がある。（P3）"},

{q:"一次能動輸送が利用するエネルギー源はどれか。",kihon:true,dobon:true,
 choices:[
  ["ATP",true,""],
  ["電気化学的勾配",false,"イオンの電気化学的勾配を利用するのは“二次”能動輸送。"],
  ["浸透圧",false,"水の移動に関わる力で、能動輸送のエネルギー源ではない。"],
  ["熱エネルギー",false,"体内で生じる熱は、物質の輸送を動かすエネルギー源にはならない。"]],
 exp:"一次能動輸送は<b>ATP（アデノシン三リン酸）</b>のエネルギーを利用する。二次能動輸送はイオンの電気化学的勾配を利用する。（P3）"},

{q:"二次能動輸送を最もよく説明しているのはどれか。",
 choices:[
  ["ATPを直接使わず、イオンの電気化学的勾配を利用して物質を運ぶ",true,""],
  ["ATPを直接分解してそのエネルギーで物質を運ぶ",false,"これは“一次”能動輸送の説明。"],
  ["濃度勾配に従って駆動力なしに移動する",false,"これは受動輸送の説明で、能動輸送ではない。"],
  ["半透膜を通して水が移動する",false,"これは浸透の説明。"]],
 exp:"<b>二次能動輸送</b>はATPを直接使わず、イオンの電気化学的勾配を利用して物質を輸送する能動輸送。（P3）"},

{q:"細胞膜を介した物質の移動について誤っているのはどれか。",gori:true,
 choices:[
  ["浸透では、溶けている物質が濃度の高いほうから低いほうへ移動する",true,""],
  ["脂溶性のアルコールは、細胞膜を自由に通過できる",false,"教科書どおりの記述なので、正しい。"],
  ["拡散では、物質が濃度の高いほうから低いほうへ移動する",false,"教科書どおりの記述なので、正しい。"],
  ["受動輸送は、駆動力を必要としない",false,"教科書どおりの記述なので、正しい。"]],
 exp:"これは拡散の説明。浸透で移動するのは<b>水</b>で、物質の濃度が高い場所へ移動して水溶液を薄める。（P3）"},

/* ---------- ナトリウムポンプ・共輸送（補足） ---------- */
{q:"ナトリウムポンプのはたらきで正しいのはどれか。",dobon:true,hosoku:true,
 choices:[
  ["Na⁺を細胞外へ、K⁺を細胞内へ運ぶ",true,""],
  ["Na⁺を細胞内へ、K⁺を細胞外へ運ぶ",false,"運ぶ向きが逆。"],
  ["Na⁺もK⁺も細胞外へ運ぶ",false,"2つのイオンは反対向きに運ばれる。"],
  ["濃度勾配に従ってNa⁺を細胞内へ通す",false,"Na⁺チャネルを通る受動的な移動の説明。"]],

  ["エンドサイトーシス",false,"大きな細胞外物質を、小胞として取り込むしくみ。"]],

 choices:[

 exp:"<b>食作用</b>（ファゴサイトーシス）は、エンドサイトーシスのうち死んだ細胞やバクテリアを取り込んで消化するはたらき。（P3〜4）"},

let mode="normal", drawn=[], idx=0, score=0, streak=0, answered=false, dead=false;
let qmiss=0, totalMiss=0, firstTryCount=0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function home(){
  document.getElementById("htt").textContent="確認テスト";
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="0";
  document.getElementById("bd").innerHTML=`
    <div class="center">
      <p class="lead">モードを選んでスタート。<br>問題は毎回シャッフルされ、プール${POOL.length}問から${PICK}問が出題されます。</p>
      <div class="modes">
        <button class="mode" onclick="start('normal')">
          <div class="nm">通常モード</div>
          <div class="ds">${PICK}問を最後まで解いて採点します。まちがえても正解するまで選び直せます。<span class="mark kihon" style="margin-left:4px">🎯基本</span> は落としちゃダメな基本問題。</div>
        </button>
        <button class="mode dob" onclick="start('dobon')">
          <div class="nm">💣 ドボンチャレンジ</div>
          <div class="ds">絶対に落とせない問題が <b>💣ドボン！</b> に変身。外したら選び直しなしで即終了。どこまで連続正解できるか挑戦！</div>
        </button>
      </div>
    </div>`;
  document.getElementById("ctrl").innerHTML="";
}
function start(m){
  mode=m; drawn=shuffle(POOL).slice(0,Math.min(PICK,POOL.length));
  idx=0;score=0;streak=0;dead=false;totalMiss=0;firstTryCount=0;render();
}
function render(){
  answered=false; qmiss=0;
  const item=drawn[idx];
  const opts=shuffle(item.choices);
  const isDob=(mode==="dobon" && item.dobon);
  document.getElementById("htt").textContent=(mode==="dobon")?"ドボンチャレンジ":"確認テスト";
  document.getElementById("pg").textContent=`問 ${idx+1} / ${drawn.length}`;
  document.getElementById("bar").style.width=(idx/drawn.length*100)+"%";
  const L=["ア","イ","ウ","エ","オ"];
  let markHtml="";
  if(isDob) markHtml+=`<span class="mark dobon">💣 ドボン！</span>`;
  else if(item.kihon) markHtml+=`<span class="mark kihon">🎯 基本</span>`;
  if(item.gori) markHtml+=`<span class="mark gori">⚠ 誤りを選ぶ</span>`;
  if(item.hosoku) markHtml+=`<span class="mark hosoku">📘 補足（資料外）</span>`;
  const qt=item.gori?item.q.replace("誤っている",'<span class="ng">誤っている</span>'):item.q;
  let h=`<div class="qnum">Q${idx+1} ${markHtml}</div><div class="q">${qt}</div><div class="opts">`;
  opts.forEach((o,i)=>{h+=`<button class="opt" onclick="pick(this,${o[1]})"><span class="mk">${L[i]}</span><span>${o[0]}</span></button>`;});
  h+=`</div><div class="exp" id="exp"><div class="vd" id="vd"></div><div class="tx" id="tx"></div></div>`;
  document.getElementById("bd").innerHTML=h;
  document.getElementById("ctrl").innerHTML=`<button class="btn" id="nx" onclick="next()" disabled>解答を選んでください</button>`;
}
function pick(el,ok){
  if(answered)return;
  if(el.classList.contains("dis"))return;
  const item=drawn[idx];
  const isDob=(mode==="dobon" && item.dobon);
  const selText=el.querySelector("span:last-child").textContent;
  const selChoice=item.choices.find(c=>c[0]===selText);
  const exp=document.getElementById("exp");
  const nx=document.getElementById("nx");

  if(ok){
    answered=true;
    el.classList.add("correct");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    score++;
    if(mode!=="dobon"){ if(qmiss===0) firstTryCount++; }
    if(mode==="dobon") streak++;
    exp.className="exp show ok";
    document.getElementById("vd").textContent="正解！";
    document.getElementById("tx").innerHTML=item.exp;
    nx.disabled=false;
    nx.textContent=(idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶";
    return;
  }
  if(mode==="dobon"){
    answered=true;
    el.classList.add("wrong");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    if(item.dobon){ dead=true; }
    exp.className="exp show ng";
    document.getElementById("vd").textContent=isDob?"💣 ドボン！":"不正解";
    document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}`;
    nx.disabled=false;
    nx.textContent=dead?"結果を見る（ドボン）▶":((idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶");
    return;
  }
  qmiss++; totalMiss++;
  el.classList.add("wrong","dis");
  exp.className="exp show ng";
  document.getElementById("vd").textContent="不正解（ミス "+qmiss+"回）";
  document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}<br>ほかの選択肢からもう一度選んでください。`;
}
function next(){
  if(dead){result();return;}
  if(idx+1<drawn.length){idx++;render();}
  else result();
}
function result(){
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="100%";
  if(mode==="dobon"){
    document.getElementById("htt").textContent="結果";
    if(dead){
      document.getElementById("bd").innerHTML=`<div class="center score dead">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>ドボンを踏んでしまいました</div>
        <div class="big">${score} 問正解</div>
        <div class="msg">${idx+1}問目でドボン。<br>解説を復習して再挑戦しましょう。</div>
      </div>`;
    }else{
      document.getElementById("bd").innerHTML=`<div class="center score">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>クリア！</div>
        <div class="big">${score} / ${drawn.length}</div>
        <div class="msg">ドボンを踏まず完走しました。お見事！</div>
      </div>`;
    }
  }else{
    document.getElementById("htt").textContent="結果";
    const n=drawn.length;
    const ftPct=Math.round(firstTryCount/n*100);
    const noMiss=(totalMiss===0);
    let head = noMiss
      ? `<div class="big">✨ ノーミス パーフェクト！</div><div>全 ${n} 問を一発で正解</div>`
      : `<div>今回の成績</div><div class="big">${firstTryCount} / ${n}</div><div>一発正解率 ${ftPct}%</div>`;
    let stat = `<div class="stats">一発正解 ${firstTryCount}問　｜　総ミス ${totalMiss}回</div>`;
    let msg = noMiss?"完璧です。この調子！":ftPct>=60?"よくできました。ミスした問題を復習しましょう。":"もう一度スライドで確認してから挑戦しましょう。";
    document.getElementById("bd").innerHTML=`<div class="center score">${head}${stat}<div class="msg">${msg}</div></div>`;
  }
  document.getElementById("ctrl").innerHTML=`<button class="btn sub" onclick="home()">モード選択へ</button><button class="btn" onclick="start(mode)">もう一度（シャッフル）▶</button>`;
}
home();
</script>
