<script>
/* ===== 問題プール =====
   パートA〜Cの全問（教科書 第1章 P1〜10 ベース）＋ チャレンジ限定の新問題10問
   choices: [表示文, 正解フラグ, その選択肢が何かの説明]
   章末はライフ制なので dobon フラグは使わない。g（出題グループ上限）も章末では使わない（データ上は残している）。

   内訳：パートA 25問／B 24問／C 33問 ＝ 82問 ＋ 初見10問 ＝ 全92問
   コース配分（初見10問を引いた枠をプール数に比例配分・最大剰余法）
     コンプリート30：A6・B6・C8（計20）＋初見10
     コンプリート60：A15・B15・C20（計50）＋初見10
     ALL           ：全92問
   見本：ch11_challenge.html（2段階の開始画面・ライフ制・📖学習モード）
   タグ配色：🎯＝章カラー #0e6b6b／⚠＝紫 #6d3f9e／📘＝琥珀 #8a6314／🔥＝焦茶オレンジ #c2410c／📖学習モード＝青 #1e4d7b */


/* ========== パートA のプール（ch1_quizA.html と同一）生理学とは・A-1 細胞膜（P1〜4） ========== */
const POOL_A=[
/* ---------- 生理学とは（P1） ---------- */
{q:"からだの構造を明らかにする学問はどれか。",kihon:true,
 choices:[
  ["解剖学",true,""],
  ["生理学",false,"物理学的・化学的方法で生命活動（しくみとはたらき）を探究する学問。"],
  ["生化学",false,"生体内の化学反応や物質を扱う学問で、構造そのものを対象とはしない。"],
  ["病理学",false,"病気による組織や細胞の変化を扱う学問。"]],
 exp:"<b>解剖学</b>はからだの構造を明らかにする学問。生理学は健康なヒトのからだのしくみとはたらきを扱う。（P1）"},

{q:"人体のすべての細胞が同一のDNAをもつのはなぜか。",
 choices:[
  ["すべて1個の受精卵が分裂して生じたから",true,""],
  ["分化によって同じ形態と機能をもつようになるから",false,"分化は、細胞が異なる形態や機能をもつようになること。"],
  ["細胞どうしがDNAを受け渡し合うから",false,"細胞の間でDNAを交換して同じにするしくみはない。"],
  ["同じ器官に属する細胞の集まりだから",false,"器官は組織の組み合わせでできたもので、人体の細胞は多くの器官に分かれている。"]],
 exp:"人体の約数十兆個の細胞は、すべて<b>1個の受精卵</b>が分裂して生じたため、同一のDNAをもつ。発達に伴って分化しても、DNAは同じ。（P1）"},

/* ---------- 細胞の構造（P1） ---------- */
{q:"細胞を構成する基本要素の組合せで正しいのはどれか。",kihon:true,
 choices:[
  ["細胞膜・細胞質・核",true,""],
  ["細胞膜・血漿・核",false,"血漿は細胞外液（体液）の成分で、細胞そのものの構成要素ではない。"],
  ["細胞質・核・染色体",false,"染色体は核の中にある構造で、細胞膜が抜けている。"],
  ["細胞膜・組織液・核",false,"組織液は細胞の外を満たす体液で、細胞の構成要素ではない。"]],
 exp:"細胞は、<b>細胞膜</b>に覆われた<b>細胞質</b>と<b>核</b>で構成されている。（P1）"},

/* ---------- 細胞膜の構造（P2） ---------- */
{q:"細胞膜のリン脂質について誤っているのはどれか。",kihon:true,gori:true,
 choices:[
  ["尾部は親水性である",true,""],
  ["頭部はリン酸基からなる",false,"教科書どおりの記述なので、正しい。"],
  ["尾部は2本の脂肪酸からなる",false,"教科書どおりの記述なので、正しい。"],
  ["二重に重なって膜をつくる",false,"教科書どおりの記述なので、正しい。"]],
 exp:"尾部は2本の脂肪酸からなり、膜の内側にあって<b>疎水性</b>。親水性なのはリン酸基からなる頭部。（P2）"},

{q:"膜タンパク質の存在のしかたで正しいのはどれか。",
 choices:[
  ["脂質二重層の中に島状に埋め込まれている",true,""],
  ["細胞膜の外側の表面にだけ付着している",false,"膜タンパク質は膜の中に埋め込まれ、物質の通り道になる。表面に付くだけでは、物質を膜の向こうへ通せない。"],
  ["2層のリン脂質の間に、1枚の層となって挟まれている",false,"膜タンパク質は層をつくらず、島のように点在している。"],
  ["細胞質基質に浮かんでいて、必要なときだけ膜に移動する",false,"膜タンパク質は細胞膜に埋め込まれた状態で物質の輸送を担う。"]],
 exp:"膜タンパク質は細胞膜に<b>島状に埋め込まれた</b>タンパク質で、物質の輸送を担う。（P2）"},

{q:"細胞膜のはたらきでないのはどれか。",kihon:true,
 choices:[
  ["ATPを産生する",true,""],
  ["特定のイオンを選択的に通過させる",false,"チャネルのはたらき。"],
  ["濃度勾配に逆らって物質を運ぶ",false,"膜タンパク質が仕事をする能動輸送のはたらき。"],
  ["細胞外の物質を受容体に結合させて取り込む",false,"エンドサイトーシスのはたらき。"]],
 exp:"ATPを産生するのは<b>ミトコンドリア</b>で、クエン酸回路や電子伝達系による。細胞膜は膜タンパク質や受容体を使って物質の出入りを担う。（P2〜3、P6）"},

{q:"特定のイオンを選択的に通過させる膜タンパク質はどれか。",kihon:true,
 choices:[
  ["チャネル",true,""],
  ["輸送体",false,"結合部位にぴったり合う物質やイオンしか通さない膜タンパク質。"],
  ["ヒストン",false,"DNAが巻きつくタンパク質で、膜輸送には関与しない。"],
  ["リボソーム",false,"タンパク質を合成する構造で、膜のイオン通過とは無関係。"]],
 exp:"<b>チャネル</b>は特定のイオンを選択的に通過させる。輸送体は結合部位に合う物質やイオンしか通さない。（P2）"},

/* ---------- 拡散・浸透・濾過（P3） ---------- */
{q:"細胞膜を自由に通過できる物質はどれか。",kihon:true,
 choices:[
  ["酸素",true,""],
  ["ナトリウムイオン",false,"イオンは自由に通過できず、チャネルや輸送体を必要とする。"],
  ["タンパク質",false,"大きな物質は自由に通れず、エンドサイトーシスで取り込まれる。"],
  ["グルコース",false,"水溶性の栄養素で、輸送体を介して運ばれる。"]],
 exp:"細胞膜は半透膜の性質をもち、<b>酸素</b>・二酸化炭素や脂溶性のアルコールなどは自由に通過できる。（P3）"},

{q:"物質が濃度の高いほうから低いほうへ自然に移動する現象はどれか。",kihon:true,dobon:true,
 choices:[
  ["拡散",true,""],
  ["浸透",false,"濃度の高い場所へ“水”が移動して水溶液を薄める現象。移動するのは物質ではなく水。"],
  ["濾過",false,"小さな穴に水溶液を通し、大きな物質を分ける現象。"],
  ["能動輸送",false,"濃度勾配に“逆らって”物質を移動させ、膜タンパク質の仕事を必要とする輸送。"]],
 exp:"<b>拡散</b>は、物質が濃度勾配に従って高いほうから低いほうへ自然に移動する現象。（P3）"},

{q:"代謝によって細胞内の酸素分圧が下がると、酸素が細胞外から細胞内へ移動する。このしくみはどれか。",
 choices:[
  ["拡散",true,""],
  ["浸透",false,"水が、濃度の高い側へ移動する現象。"],
  ["濾過",false,"圧力によって、水溶液を小さな穴に通して分けること。"],
  ["一次能動輸送",false,"ATPのエネルギーを使い、濃度勾配に逆らって運ぶ輸送。"]],
 exp:"酸素は細胞膜を自由に通過できるので、多い細胞外から少ない細胞内へ<b>拡散</b>する。（P3）"},

{q:"半透膜で仕切った容器の一方に濃い食塩水、もう一方に薄い食塩水を入れた。水はどちらへ移動するか。",kihon:true,dobon:true,
 choices:[
  ["濃い食塩水の側へ",true,""],
  ["薄い食塩水の側へ",false,"この向きに水が動くと、濃さの差がさらに広がってしまう。"],
  ["どちらへも移動しない",false,"濃度に差がある限り、水は移動する。"],
  ["両側へ同じ量ずつ移動する",false,"差し引きでは水が動かないのと同じになり、濃度の差が縮まらない。"]],
 exp:"浸透は、物質の濃度が高い場所へ水が移動し、水溶液を薄める現象。水は<b>濃い食塩水の側</b>へ移動する。（P3）"},

{q:"浸透圧の説明で正しいのはどれか。",
 choices:[
  ["水を、濃度の高い側へ引き寄せる力",true,""],
  ["物質を、濃度の高い側から低い側へ押し出す力",false,"濃度勾配に従って物質が自然に移るのは拡散で、力で押し出すものではない。"],
  ["水溶液を小さな穴に押し通す力",false,"濾過を起こす圧の説明。"],
  ["物質を濃度勾配に逆らって運ぶ力",false,"膜タンパク質が仕事をして運ぶ能動輸送の説明。"]],
 exp:"物質の濃度が高い場所へ水が移動し水溶液を薄める現象が浸透で、このときはたらく力が<b>浸透圧</b>。（P3）"},

{q:"腎臓の糸球体で、血球やタンパク質が血管内に残るしくみはどれか。",kihon:true,
 choices:[
  ["濾過",true,""],
  ["拡散",false,"濃度の高いほうから低いほうへ物質が自然に移動すること。大きさで物質を分けるしくみではない。"],
  ["浸透",false,"濃度の高い場所へ水が移動すること。圧力でこし出すしくみではない。"],
  ["エンドサイトーシス",false,"細胞外の大きな物質を、小胞として細胞内へ取り込むこと。"]],
 exp:"<b>濾過</b>は、小さな穴に水溶液を通して大きな物質を分けること。毛細血管の壁などで行われる。（P3。糸球体は第12章）"},

/* ---------- 受動輸送・能動輸送（P3） ---------- */
{q:"細胞膜を介した物質の移動のうち、駆動力を必要としないものはどれか。",
 choices:[
  ["受動輸送",true,""],
  ["一次能動輸送",false,"ATPのエネルギーを使って勾配に逆らう輸送で、駆動力が必要。"],
  ["二次能動輸送",false,"イオンの電気化学的勾配を使って物質を運ぶ能動輸送。"],
  ["エンドサイトーシス",false,"大きな物質を小胞として取り込むはたらきで、膜タンパク質を通る移動ではない。"]],
 exp:"膜タンパク質を通る物質が濃度勾配に従って移動するときは、駆動力を必要とせず受動的なので<b>受動輸送</b>と呼ぶ。（P3）"},

{q:"能動輸送について正しいのはどれか。",kihon:true,dobon:true,
 choices:[
  ["濃度勾配に逆らって物質を移動させる",true,""],
  ["濃度勾配に従って移動する",false,"これは受動輸送の説明。"],
  ["駆動力を必要としない",false,"これも受動輸送の特徴。能動輸送は膜タンパク質が仕事をする必要がある。"],
  ["半透膜による現象である",false,"半透膜の性質で説明されるのは拡散・浸透などで、膜タンパク質の仕事による輸送ではない。"]],
 exp:"<b>能動輸送</b>は濃度勾配に逆らって物質を移動させ、膜タンパク質が仕事をする必要がある。（P3）"},

{q:"一次能動輸送が利用するエネルギー源はどれか。",kihon:true,dobon:true,
 choices:[
  ["ATP",true,""],
  ["電気化学的勾配",false,"イオンの電気化学的勾配を利用するのは“二次”能動輸送。"],
  ["浸透圧",false,"水の移動に関わる力で、能動輸送のエネルギー源ではない。"],
  ["熱エネルギー",false,"体内で生じる熱は、物質の輸送を動かすエネルギー源にはならない。"]],
 exp:"一次能動輸送は<b>ATP（アデノシン三リン酸）</b>のエネルギーを利用する。二次能動輸送はイオンの電気化学的勾配を利用する。（P3）"},

{q:"二次能動輸送を最もよく説明しているのはどれか。",
 choices:[
  ["ATPを直接使わず、イオンの電気化学的勾配を利用して物質を運ぶ",true,""],
  ["ATPを直接分解してそのエネルギーで物質を運ぶ",false,"これは“一次”能動輸送の説明。"],

  ["暑いときに汗をかいて、体温を下げる",false,"体温を一定に保つ調節で、負のフィードバックによる。"],
  ["血中のサイロキシンが増えると、甲状腺刺激ホルモン（TSH）の分泌が減る",false,"上流のはたらきを抑える、負のフィードバックの例。"],
  ["体液の浸透圧が上がると、飲水や尿量の調節で元に戻る",false,"浸透圧を一定に保つ、負のフィードバックによる調節。"]],
 exp:"補足知識（資料外）。分娩が始まると、子宮の収縮で子宮頸部（産道）が引き伸ばされ、その<b>機械的刺激</b>が神経を介して下垂体後葉からのオキシトシンの分泌を増やす。オキシトシンは子宮をさらに収縮させ、頸部はさらに引き伸ばされる。このように、ホルモンだけでなく<b>機械的刺激</b>も加わって、互いに促進し合う（<b>正のフィードバック</b>）。こうして収縮は急激に強まり、分娩に至る。オキシトシンの作用は、エストロゲンで増強され、プロゲステロンで抑制される（P92）。正のフィードバックは、ホメオスタシスの維持ではなく、急激な変化を起こすときにはたらく（P9）。"},

{q:"DNAの情報からタンパク質が合成されるまでの過程に含まれないのはどれか。",shinmon:true,
 choices:[
  ["DNAの複製",true,""],
  ["転写",false,"DNAの遺伝情報をメッセンジャーRNA（mRNA）に写し取る過程。"],
  ["翻訳",false,"メッセンジャーRNA（mRNA）の情報に基づいて、リボソームでタンパク質がつくられる過程。"],
  ["メッセンジャーRNA（mRNA）が、核膜孔から細胞質へ出る",false,"写し取った情報を、核の外のリボソームへ運ぶ段階。"]],
 exp:"タンパク質は、転写 → mRNAが細胞質へ出る → リボソームで翻訳、の順につくられる（P4・P5）。<b>複製</b>は細胞分裂の際などに起こり、同じDNAを2つつくって、遺伝情報を娘細胞へ伝えるはたらき（P4）。"},

{q:"アルコールなどの脂溶性の物質が、細胞膜を自由に通過できるのはなぜか。",shinmon:true,
 choices:[
  ["細胞膜の内側が、疎水性の脂肪酸の尾部でできているから",true,""],
  ["細胞膜の表面が、親水性のリン酸基の頭部でできているから",false,"頭部は細胞外液と細胞内液に面していて、水になじむ部分。"],
  ["チャネルが、これらの物質を選択的に通すから",false,"チャネルは、特定のイオンを選択的に通す膜タンパク質。"],
  ["エンドサイトーシスで取り込まれるから",false,"タンパク質などの大きな物質を、小胞として取り込むしくみ。"]],
 exp:"細胞膜はリン脂質が二重に重なった膜で、2本の脂肪酸からなる尾部が膜の内側にあり、<b>疎水性</b>である（P2）。脂に溶けやすい物質は、この脂質の層に溶け込んで通り抜けられる（P3）。酸素や二酸化炭素も自由に通れるが、こちらは小さく、電荷をもたない分子であるため。反対に、イオンや水に溶けるグルコースは通りにくく、チャネルや輸送体が必要になる。"},

];

/* ===== コース設定（プール数に比例して抽出。初見10問は常に全問） ===== */
const PARTS={A:POOL_A,B:POOL_B,C:POOL_C};
const COURSES={
  "30":{name:"コンプリート30",pick:{A:6,B:6,C:8}},
  "60":{name:"コンプリート60",pick:{A:15,B:15,C:20}},
  "all":{name:"ALL",            pick:null}
};
const ALL=[].concat(POOL_A,POOL_B,POOL_C,SHINMON);
const TOTAL=ALL.length;

/* ===== 学習モード用：問題の識別キーと保存 ===== */
function keyOf(it){return it.q+"｜"+it.choices.find(c=>c[1])[0];}
const BYKEY={}; ALL.forEach(it=>{BYKEY[keyOf(it)]=it;});
const SKEY="ch1_challenge_study_v1";   // 章ごとに別のキー
function sLoad(){
  try{
    const s=JSON.parse(localStorage.getItem(SKEY));
    if(!s||!Array.isArray(s.list))return null;
    s.list=s.list.filter(k=>BYKEY[k]);           // 問題を差し替えても壊れないように
    s.wrong=(s.wrong||[]).filter(k=>BYKEY[k]);
    if(!s.list.length)return null;
    s.pos=Math.min(Math.max(0,s.pos|0),s.list.length);
    s.round=s.round||1;
    return s;
  }catch(e){return null;}
}
function sSave(){try{localStorage.setItem(SKEY,JSON.stringify(st));}catch(e){}}
function sClear(){try{localStorage.removeItem(SKEY);}catch(e){}}

/* ===== 共通 ===== */
let mode="challenge";
let course="30", drawn=[], idx=0, correct=0, streak=0, best=0, lives=0, maxLives=0, answered=false, dead=false;
let st=null, sMiss=0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function hearts(){
  if(maxLives<=1) return "";
  let h="";
  for(let i=0;i<maxLives;i++) h += (i<lives) ? "♥" : '<span class="off">♥</span>';
  return h;
}
function paintHead(){
  document.getElementById("life").innerHTML = hearts();
  document.getElementById("pg").textContent = (drawn.length? `${idx+1} / ${drawn.length}問目` : "");
}
function cname(){ return COURSES[course].name; }
function lname(){ return (maxLives<=1) ? "一発勝負" : "ライフ "+maxLives; }
function resetHead(t){
  document.getElementById("htt").textContent=t;
  document.getElementById("life").innerHTML="";
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="0";
  drawn=[];
  document.getElementById("ctrl").innerHTML="";
}
function qBody(item){
  const opts=shuffle(item.choices);
  const L=["ア","イ","ウ","エ","オ"];
  let markHtml="";
  if(item.kihon)   markHtml += `<span class="mark kihon">🎯 基本</span>`;
  if(item.gori)    markHtml += `<span class="mark gori">⚠ 誤りを選ぶ</span>`;
  if(item.hosoku)  markHtml += `<span class="mark hosoku">📘 補足（資料外）</span>`;
  if(item.shinmon) markHtml += `<span class="mark shinmon">🔥 チャレンジ限定</span>`;
  const qText = item.gori ? item.q.replace("誤っている",'<span class="ng">誤っている</span>') : item.q;
  const qn = (mode==="study") ? st.pos+1 : idx+1;
  let h=`<div class="qnum">Q${qn} ${markHtml}</div><div class="q">${qText}</div><div class="opts">`;
  opts.forEach((o,i)=>{h+=`<button class="opt" onclick="pick(this,${o[1]})"><span class="mk">${L[i]}</span><span>${o[0]}</span></button>`;});
  h+=`</div><div class="exp" id="exp"><div class="vd" id="vd"></div><div class="tx" id="tx"></div></div>`;
  return h;
}

/* ステップ1：問題数（または学習モード）を選ぶ */
function home(){
  mode="challenge";
  resetHead("コンプリートチャレンジ");
  const sv=sLoad();
  const resume = (sv && sv.pos<sv.list.length) ? `
        <button class="mode resume" onclick="studyResume()">
          <div class="nm">📖 学習モード：続きから</div>
          <div class="ds">${sv.round}周目${sv.round>1?"（間違えた問題）":""}の ${sv.pos+1}問目 / ${sv.list.length}問 から再開します。</div>
        </button>` : "";
  document.getElementById("bd").innerHTML=`
    <div class="center">
      <p class="lead">第1章の全パートの問題に、チャレンジ限定の新問題を混ぜて出題します。<br>毎回ランダムに選んでシャッフル。ライフがなくなるまで出し続けます。</p>
      <div class="step">STEP 1　問題数を選ぶ</div>
      <div class="modes">
        <button class="mode" onclick="pickCourse('30')">
          <div class="nm">コンプリート30</div>
          <div class="ds">パートA〜Cから比例配分で20問＋チャレンジ限定10問。まずはここから。</div>
        </button>
        <button class="mode" onclick="pickCourse('60')">
          <div class="nm">コンプリート60</div>
          <div class="ds">パートA〜Cから比例配分で50問＋チャレンジ限定10問。</div>
        </button>
        <button class="mode hard" onclick="pickCourse('all')">
          <div class="nm">ALL（全${TOTAL}問）</div>
          <div class="ds">第1章の全問題。最後までたどり着けるか挑戦。</div>
        </button>
      </div>
      <div class="divider">じっくり学ぶ</div>
      <div class="modes">${resume}
        <button class="mode study" onclick="studyNew()">
          <div class="nm">📖 学習モード（全${TOTAL}問）</div>
          <div class="ds">ライフなし。間違えても選び直して最後まで進めます。1周したら、間違えた問題だけをもう一度。全問クリアするまで続けられます。進み具合は自動で保存されます。</div>
        </button>
      </div>
      <div class="legend">
        <span class="mark kihon">🎯 基本</span> 落としちゃダメな基本問題<br>
        <span class="mark gori">⚠ 誤りを選ぶ</span> 誤っているものを選ぶ問題<br>
        <span class="mark hosoku">📘 補足（資料外）</span> 教科書外の国試頻出テーマ<br>
        <span class="mark shinmon">🔥 チャレンジ限定</span> この章末だけに出る新問題<br>
        ※ チャレンジ（30・60・ALL）は選び直しができません。間違えた問題も解説は表示されます。<br>
        ※ 学習モードの進み具合は、<b>この端末のこのブラウザにだけ</b>保存されます。シークレットモードで開いた場合や、ブラウザの履歴・データを消した場合は保存されません。
      </div>
    </div>`;
}

/* ステップ2：ライフを選ぶ */
function pickCourse(c){
  course=c;
  resetHead(cname());
  document.getElementById("bd").innerHTML=`
    <div class="center">
      <p class="lead"><b>${cname()}</b>（${c==="all"?TOTAL:c}問）に挑戦します。</p>
      <div class="step">STEP 2　ライフを選ぶ</div>
      <div class="modes">
        <button class="mode hard" onclick="start(1)">
          <div class="nm">一発勝負（ライフなし）</div>
          <div class="ds">1問でも間違えたら、そこで終了。何問連続で正解できるかに挑戦。</div>
        </button>
        <button class="mode" onclick="start(3)">
          <div class="nm">ライフ 3</div>
          <div class="ds">3回まで間違えられます。3回目を間違えた時点で終了。</div>
        </button>
        <button class="mode" onclick="start(5)">
          <div class="nm">ライフ 5</div>
          <div class="ds">5回まで間違えられます。まずはここから挑戦してみましょう。</div>
        </button>
      </div>
    </div>`;
  document.getElementById("ctrl").innerHTML=`<button class="btn sub" onclick="home()">◀ 問題数を選び直す</button>`;
}

function draw(){
  const p=COURSES[course].pick;
  let list=SHINMON.slice();
  for(const k in PARTS){
    list = list.concat(p ? shuffle(PARTS[k]).slice(0,p[k]) : PARTS[k]);
  }
  return shuffle(list);
}

function start(n){
  mode="challenge";
  maxLives=n; lives=n;
  drawn=draw();
  idx=0; correct=0; streak=0; best=0; dead=false;
  render();
}

function render(){
  answered=false;
  const item=drawn[idx];
  document.getElementById("htt").textContent = cname()+"｜"+lname();
  paintHead();
  document.getElementById("bar").style.width=(idx/drawn.length*100)+"%";
  document.getElementById("bd").innerHTML=qBody(item);
  document.getElementById("ctrl").innerHTML=`<button class="btn" id="nx" onclick="next()" disabled>解答を選んでください</button>`;
}

function pick(el,ok){
  if(mode==="study") return studyPick(el,ok);
  if(answered)return;
  answered=true;
  const item=drawn[idx];
  const selText=el.querySelector("span:last-child").textContent;
  const selChoice=item.choices.find(c=>c[0]===selText);
  const exp=document.getElementById("exp");
  const nx=document.getElementById("nx");
  document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));

  if(ok){
    el.classList.add("correct");
    correct++; streak++; if(streak>best) best=streak;
    exp.className="exp show ok";
    document.getElementById("vd").textContent="正解！";
    document.getElementById("tx").innerHTML=item.exp;
  }else{
    // 選び直しなし。正解の語句・色は伏せたまま、選んだ選択肢が何かだけ説明する
    el.classList.add("wrong");
    lives--; streak=0;
    paintHead();
    exp.className="exp show ng";
    document.getElementById("vd").textContent =
      (lives>0) ? `不正解（残りライフ ${lives}）` : "不正解 — ここで終了";
    document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}`;
    if(lives<=0) dead=true;
  }
  nx.disabled=false;
  if(dead)                         nx.textContent="結果を見る ▶";
  else if(idx+1<drawn.length)      nx.textContent="次の問題 ▶";
  else                             nx.textContent="結果を見る ▶";
}

function next(){
  if(dead){result();return;}
  if(idx+1<drawn.length){idx++;render();}
  else result();
}

function result(){
  const n=drawn.length;
  const done=idx+1;
  const complete=(!dead && done>=n);
  document.getElementById("htt").textContent="結果";
  document.getElementById("life").innerHTML=hearts();
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="100%";

  let html;
  if(complete && correct===n){
    html=`<div class="center score">
      <span class="tag">🏆 ${cname()} COMPLETE</span>
      <div>全問ノーミス</div>
      <div class="big">${n} / ${n}</div>
      <div class="msg">第1章を完全制覇しました。文句なしです。</div>
      <div class="stats">最長連続正解 ${best}問</div>
    </div>`;
  }else if(complete){
    html=`<div class="center score">
      <span class="tag">🏁 ${cname()} 完走</span>
      <div>最後まで到達しました</div>
      <div class="big">${correct} / ${n}</div>
      <div class="msg">ライフを残して全問クリア。あと一歩でコンプリートです。</div>
      <div class="stats">最長連続正解 ${best}問　｜　残りライフ ${lives}</div>
    </div>`;
  }else if(maxLives<=1){
    html=`<div class="center score dead">
      <span class="tag dob">${cname()}｜一発勝負</span>
      <div>ここで終了</div>
      <div class="big">${correct} 問連続正解</div>
      <div class="msg">全${n}問中 ${done}問目でストップ。<br>上の解説を確認して、もう一度挑戦しましょう。</div>
    </div>`;
  }else{
    html=`<div class="center score dead">
      <span class="tag dob">${cname()}｜ライフ ${maxLives}</span>
      <div>ライフがなくなりました</div>
      <div class="big">${correct} / ${done}</div>
      <div class="msg">全${n}問中 ${done}問目でストップ。<br>最長で ${best}問連続正解でした。</div>
      <div class="stats">正解 ${correct}問　｜　最長連続 ${best}問</div>
    </div>`;
  }
  document.getElementById("bd").innerHTML=html;
  document.getElementById("ctrl").innerHTML=`<button class="btn sub" onclick="home()">問題数を選ぶ</button><button class="btn sub" onclick="pickCourse(course)">ライフを選ぶ</button><button class="btn" onclick="start(maxLives)">もう一度（シャッフル）▶</button>`;
}

/* ===== 📖 学習モード =====
   全問をシャッフルして出題。間違えたら選び直し（通常モードと同じ）。
   1周終わったら、1回でもミスした問題だけで次の周を作る。全問クリアで終了。
   1問答えるごとに localStorage に保存し、次に開いたとき「続きから」で再開できる。 */
function studyNew(){
  const sv=sLoad();
  if(sv && sv.pos<sv.list.length && !confirm("保存されている続きを消して、全問を最初から始めますか？")) return;
  st={v:1,round:1,list:shuffle(ALL.map(keyOf)),pos:0,wrong:[]};
  sSave();
  studyRender();
}
function studyResume(){
  st=sLoad();
  if(!st){home();return;}
  if(st.pos>=st.list.length){mode="study";studyEnd();return;}
  studyRender();
}
function studyRender(){
  mode="study"; sMiss=0;
  const item=BYKEY[st.list[st.pos]];
  document.getElementById("htt").textContent="学習モード｜"+st.round+"周目"+(st.round>1?"（間違えた問題）":"");
  document.getElementById("life").innerHTML="";
  document.getElementById("pg").textContent=`${st.pos+1} / ${st.list.length}問目`;
  document.getElementById("bar").style.width=(st.pos/st.list.length*100)+"%";
  document.getElementById("bd").innerHTML=qBody(item);
  document.getElementById("ctrl").innerHTML=`<button class="btn sub" onclick="home()">中断する（保存済み）</button><button class="btn" id="nx" onclick="studyNext()" disabled>解答を選んでください</button>`;
}
function studyPick(el,ok){
  if(el.classList.contains("dis"))return;
  const key=st.list[st.pos];
  const item=BYKEY[key];
  const selText=el.querySelector("span:last-child").textContent;
  const selChoice=item.choices.find(c=>c[0]===selText);
  const exp=document.getElementById("exp");
  const nx=document.getElementById("nx");
  if(ok){
    el.classList.add("correct");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    exp.className="exp show ok";
    document.getElementById("vd").textContent=(sMiss===0)?"正解！":"正解！（ミス "+sMiss+"回のあと）";
    document.getElementById("tx").innerHTML=item.exp;
    st.pos++; sSave();
    nx.disabled=false;
    nx.textContent=(st.pos<st.list.length)?"次の問題 ▶":"この周の結果を見る ▶";
    return;
  }
  sMiss++;
  if(!st.wrong.includes(key)){st.wrong.push(key); sSave();}
  el.classList.add("wrong","dis");
  exp.className="exp show ng";
  document.getElementById("vd").textContent="不正解（ミス "+sMiss+"回）";
  document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}<br>ほかの選択肢からもう一度選んでください。`;
}
function studyNext(){
  if(st.pos<st.list.length) studyRender();
  else studyEnd();
}
function studyEnd(){
  const n=st.list.length, w=st.wrong.length, ok=n-w, r=st.round;
  document.getElementById("htt").textContent="学習モード｜"+r+"周目の結果";
  document.getElementById("life").innerHTML="";
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="100%";
  let html, btns;
  if(w===0){
    sClear(); st=null;
    html = (r===1)
      ? `<div class="center score"><span class="tag study">📖 学習モード</span>
          <div>全問一発正解</div><div class="big">${n} / ${n}</div>
          <div class="msg">第1章の全問を1周目でノーミス。お見事です！</div></div>`
      : `<div class="center score"><span class="tag study">📖 学習モード</span>
          <div>✨ 全問クリア！</div><div class="big">${r}周で完了</div>
          <div class="msg">間違えた問題をすべて解き直しました。<br>次はチャレンジ（ライフ制）で腕試しをしてみましょう。</div></div>`;
    btns=`<button class="btn sub" onclick="home()">モード選択へ</button><button class="btn" onclick="studyNew()">全問をもう一度（シャッフル）▶</button>`;
  }else{
    html=`<div class="center score"><span class="tag study">📖 学習モード｜${r}周目</span>
      <div>一発正解</div><div class="big">${ok} / ${n}</div>
      <div class="msg">間違えた問題が <b>${w}問</b> あります。<br>この${w}問だけを、もう一度解きましょう。</div>
      <div class="stats">進み具合は保存済み。閉じても「続きから」で再開できます</div></div>`;
    st={v:1,round:r+1,list:shuffle(st.wrong.slice()),pos:0,wrong:[]};
    sSave();
    btns=`<button class="btn sub" onclick="home()">モード選択へ</button><button class="btn" onclick="studyRender()">間違えた${w}問だけもう一度 ▶</button>`;
  }
  document.getElementById("bd").innerHTML=html;
  document.getElementById("ctrl").innerHTML=btns;
}

home();

</script>
</body>
</html>
