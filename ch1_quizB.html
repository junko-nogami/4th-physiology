<style>

.slide{width:100%;max-width:820px;background:#fff;border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,.10);overflow:hidden}
.hd{background:#0e6b6b;padding:14px 28px;display:flex;align-items:center;justify-content:space-between}

.btn{padding:9px 18px;border-radius:7px;border:1px solid #0e6b6b;background:#0e6b6b;color:#fff;font-size:13px;cursor:pointer;font-family:inherit;font-weight:500;transition:background .15s;margin-left:auto}

<h1>生理学 第1章 生理学とは｜パートB 確認テスト</h1>
<div class="slide">
  <div class="hd"><div><div class="ch">第1章 生理学とは ｜ A-2 核・A-3 染色体と遺伝・A-4 細胞内小器官</div><div class="tt" id="htt">確認テスト</div></div><div class="pg" id="pg"></div></div>
  <div class="bar"><i id="bar"></i></div>

</div>
<script>
/* ===== 問題プール（教科書 第1章 P4〜7 ベース）=====
   choices: [表示文, 正解フラグ, その選択肢が何かの説明]
   kihon:true … 🎯基本　dobon:true … 💣ドボン（ドボンモードで外したら終了）
   gori:true … ⚠誤りを選ぶ　hosoku:true … 📘補足（資料外）
   g:"…" … 出題グループ（1回の出題での上限は GMAX）
   2026年11月 全面改訂（初版15問 → 24問、ドボン分離・グループ上限の新エンジン） */
const PICK=5;
const GMAX={enki:1,fukusei:1,tr:1,shoki:2,shoutai:1,kokkaku:1};
function draw(){const out=[],cnt={};for(const q of shuffle(POOL)){const g=q.g;if(g&&GMAX[g]!==undefined){if((cnt[g]||0)>=GMAX[g])continue;cnt[g]=(cnt[g]||0)+1;}out.push(q);if(out.length>=PICK)break;}return out;}
const POOL=[
/* ---------- A-2 核（P4〜5） ---------- */
{q:"核膜にある小孔（核膜孔）のはたらきはどれか。",
 choices:[
  ["核の内外の物質輸送を担う",true,""],
  ["核と細胞質基質を隔てる",false,"核膜そのもののはたらき。小孔はその膜にあいた穴。"],
  ["核の中でDNAを分解する",false,"DNAは遺伝情報を保つもので、核膜孔が分解することはない。"],
  ["細胞外の物質を受容体で取り込む",false,"細胞膜で起こるエンドサイトーシスのはたらき。"]],
 exp:"核膜には、核内外の物質輸送を担う小孔（<b>核膜孔</b>）がある。DNAの情報を写し取ったmRNAは、核から細胞質へ出ていく。（P4・P5）"},

{q:"ヌクレオチドとは何か。",kihon:true,
 choices:[
  ["DNAを構成する単位で、リン酸・デオキシリボース・塩基からなるもの",true,""],
  ["タンパク質を構成する単位",false,"アミノ酸の説明。"],
  ["リン酸基の頭部と2本の脂肪酸の尾部からなり、細胞膜をつくる分子",false,"リン脂質の説明。"],
  ["1つの配偶子（卵子または精子）にある遺伝情報の全体",false,"ゲノムの説明。"]],
 exp:"DNAは、リン酸・デオキシリボース・塩基からなる<b>ヌクレオチド</b>が鎖状につながった高分子化合物。（P4）"},

{q:"DNAで、アデニン（A）と相補的に結合する塩基はどれか。",kihon:true,g:"enki",
 choices:[
  ["チミン（T）",true,""],
  ["グアニン（G）",false,"シトシン（C）と相補的に結合する塩基。"],
  ["シトシン（C）",false,"グアニン（G）と相補的に結合する塩基。"],
  ["アデニン（A）",false,"同じ塩基どうしは結合しない。"]],
 exp:"<b>AとT</b>、GとCが相補的に結合して2本のヌクレオチド鎖を結びつけ、二重らせんをつくる。（P4）"},

{q:"DNAの2本のヌクレオチド鎖を結びつけているのはどれか。",g:"enki",
 choices:[
  ["相補的な塩基どうしの結合",true,""],
  ["デオキシリボース",false,"ヌクレオチドに含まれる糖。2本の鎖の間をつなぐのは別の部分。"],
  ["DNAポリメラーゼ",false,"複製のときにはたらくタンパク質で、ふだん2本の鎖をつなぎとめているものではない。"],
  ["メッセンジャーRNA（mRNA）",false,"DNAの遺伝情報を写し取った別の分子で、DNAの鎖をつなぐものではない。"]],
 exp:"相補性のあるAとT、GとCがそれぞれ結合して2本の鎖を結びつけ、<b>二重らせん</b>を形成している。（P4）"},

{q:"DNAに含まれない塩基はどれか。",hosoku:true,g:"enki",
 choices:[
  ["ウラシル（U）",true,""],
  ["チミン（T）",false,"アデニン（A）と相補的に結合する、DNAの塩基。"],
  ["グアニン（G）",false,"シトシン（C）と相補的に結合する、DNAの塩基。"],
  ["シトシン（C）",false,"グアニン（G）と相補的に結合する、DNAの塩基。"]],
 exp:"補足知識（資料外）。<b>ウラシル</b>はRNA（リボ核酸）に含まれる塩基で、RNAではチミンの代わりにアデニンと対をなす。DNAの塩基はA・T・G・Cの4種類。"},

{q:"DNAの複製で、DNAポリメラーゼが行うはたらきはどれか。",g:"fukusei",
 choices:[
  ["一本鎖になったDNAの塩基に、相補性をもつ塩基を結びつける",true,""],
  ["二重らせんの結合を切って、一本鎖にする",false,"DNAポリメラーゼは、結合が切れて一本鎖になったところに結合してはたらく。結合を切ることはしない。"],
  ["DNAの遺伝情報をメッセンジャーRNA（mRNA）に写し取る",false,"DNAの情報からmRNAをつくるはたらきで、DNAを増やすものではない。"],
  ["DNAを核膜孔から細胞質へ運び出す",false,"核から細胞質へ出ていくのはmRNAで、DNAは運び出されない。"]],
 exp:"二重らせんの結合が切れて一本鎖DNAになると、<b>DNAポリメラーゼ</b>が結合し、それぞれの塩基に相補的な塩基を結びつけて新たな二重鎖DNAをつくる。（P4）"},

{q:"細胞分裂でできた娘細胞が、親細胞と同じ遺伝情報をもつのはなぜか。",g:"fukusei",
 choices:[
  ["分裂の際に、DNAが同じ構造の二重らせん2つに複製されるから",true,""],
  ["親細胞のメッセンジャーRNA（mRNA）が、娘細胞に受け渡されるから",false,"mRNAはタンパク質をつくるために遺伝情報を写し取ったもので、次の細胞へ遺伝情報を伝えるはたらきはない。"],
  ["1組のDNAが、2つの娘細胞に半分ずつ分けられるから",false,"半分ずつでは、それぞれの娘細胞に遺伝情報の全部がそろわない。"],
  ["娘細胞のリボソームが、親細胞と同じDNAを合成するから",false,"リボソームはmRNAの情報からタンパク質を合成する場で、DNAはつくらない。"]],
 exp:"二重らせんがほどけた2本の一本鎖それぞれに相補的な塩基が結びつけられ、同じ構造のDNAが2つできる（<b>複製</b>）。これが娘細胞へ分けられ、親細胞の遺伝情報が伝えられる。（P4）"},

{q:"DNAの遺伝情報がメッセンジャーRNA（mRNA）に写し取られる過程はどれか。",kihon:true,dobon:true,g:"tr",
 choices:[
  ["転写",true,""],
  ["翻訳",false,"mRNAの情報をもとにタンパク質が合成される過程。"],
  ["複製",false,"DNAが同じ構造の2つにつくられる過程。"],
  ["分化",false,"細胞が異なる形態や機能をもつようになること。"]],
 exp:"DNAの遺伝情報はmRNAに<b>転写</b>される。mRNAは核から細胞質へ出て、その情報に基づいてタンパク質が合成される（翻訳）。（P5）"},

{q:"メッセンジャーRNA（mRNA）に写し取られた情報に基づいて、タンパク質が合成される過程はどれか。",kihon:true,g:"tr",
 choices:[
  ["翻訳",true,""],
  ["転写",false,"DNAの遺伝情報がmRNAに写し取られる過程。"],
  ["複製",false,"DNAが同じ構造の2つにつくられる過程。"],
  ["エクソサイトーシス",false,"分泌顆粒に蓄えたタンパク質などを細胞外へ放出するしくみ。"]],
 exp:"mRNAは核から細胞質へ出て、写し取られた情報に基づいてタンパク質が合成される。これを<b>翻訳</b>と呼ぶ。合成されたタンパク質は膜タンパク質や酵素としてはたらいたり、ホルモンとして分泌されたりする。（P5）"},

{q:"DNAの遺伝情報に基づいて、タンパク質が合成される場はどれか。",kihon:true,dobon:true,g:"shoki",
 choices:[
  ["リボソーム",true,""],
  ["滑面小胞体",false,"表面に粒子が付着していない小胞体で、タンパク質の合成は行わない。"],
  ["ミトコンドリア",false,"クエン酸回路や電子伝達系でATPを産生する小器官。"],
  ["ゴルジ装置",false,"合成された分泌タンパク質を修飾・濃縮し、分泌顆粒をつくる小器官。"]],
 exp:"mRNAは核から細胞質へ出て<b>リボソーム</b>と結合し、写し取られた情報に基づいてタンパク質が合成される。リボソームが付着した小胞体が粗面小胞体。（P5・P6）"},

/* ---------- A-3 染色体と遺伝（P5〜6） ---------- */
{q:"DNAが巻きついて、染色質（クロマチン）という構造物をつくっているタンパク質はどれか。",
 choices:[
  ["ヒストン",true,""],
  ["DNAポリメラーゼ",false,"DNAの複製のときにはたらくタンパク質で、DNAが巻きつく相手ではない。"],
  ["ミオシン",false,"筋の収縮に関わるタンパク質。"],
  ["アルブミン",false,"血漿に多く含まれるタンパク質。"]],
 exp:"DNAは<b>ヒストン</b>と呼ばれるタンパク質に巻きついており、この構造物を染色質（クロマチン）と呼ぶ。（P5）"},

{q:"染色質（クロマチン）は、細胞が分裂期に入るとどうなるか。",
 choices:[
  ["棒状の構造体（染色体）に変化する",true,""],
  ["ほどけて一本鎖のDNAになる",false,"DNAの複製の際に、二重らせんの結合が切れたときの状態。"],
  ["メッセンジャーRNA（mRNA）に変化する",false,"mRNAはDNAの情報を写し取ってつくられる別の分子で、クロマチンが形を変えたものではない。"],
  ["ヌクレオチドに分解される",false,"ヌクレオチドはDNAを構成する単位。分裂期にDNAが分解されることはない。"]],
 exp:"DNAはヒストンに巻きついて染色質（クロマチン）をつくっている。細胞が分裂期に入ると、クロマチンは棒状の構造体（<b>染色体</b>）に変化する。（P5）"},

{q:"ヒトの体細胞の染色体の構成で正しいのはどれか。",kihon:true,
 choices:[
  ["常染色体44本＋性染色体2本＝計46本",true,""],
  ["常染色体46本＋性染色体2本＝計48本",false,"この組合せでは、ヒトの体細胞の染色体数より多くなる。"],
  ["常染色体22本＋性染色体1本＝計23本",false,"配偶子（卵子・精子）がもつ染色体の数。"],
  ["常染色体44本＋性染色体1本＝計45本",false,"性染色体は対になっているので、1本だけということはない。"]],
 exp:"男女で共通の常染色体44本（22対）と、性を決める性染色体2本（1対）の、<b>計46本（23対）</b>。対の一方は卵子、他方は精子に由来する。（P5）"},

{q:"性染色体の構成がYYの個体が生存できないのはなぜか。",
 choices:[
  ["生命維持に必要な遺伝子がX染色体にあるから",true,""],
  ["Y染色体の遺伝子が多すぎるから",false,"Y染色体はX染色体に比べて小さく、遺伝子の数は極端に少ない。"],
  ["染色体の総数が46本にならないから",false,"YYでも、常染色体と合わせた総数は46本になる。"],
  ["Y染色体どうしが結合して1本になってしまうから",false,"染色体どうしが結合して1本になるしくみはない。"]],
 exp:"<b>X染色体</b>には生命維持に必要な遺伝子が含まれる。そのため、X染色体をもたないYYの個体は生存できない。（P6）"},

{q:"X染色体の異常による遺伝性の疾患が、女性より男性で発症しやすいのはなぜか。",
 choices:[
  ["男性はX染色体を1本しかもたないから",true,""],
  ["男性はY染色体を2本もつから",false,"男性の性染色体はXYで、Y染色体は1本。"],
  ["Y染色体のほうがX染色体より大きいから",false,"実際はY染色体のほうが小さく、遺伝子も極端に少ない。"],
  ["男性は常染色体の数が女性より少ないから",false,"常染色体は男女で共通の44本。"]],
 exp:"女性はX染色体を2本もつが、男性は<b>1本しかない</b>ため、X染色体の異常による疾患が発症しやすい。性染色体上の遺伝子によるこうした遺伝を伴性遺伝と呼ぶ。（P6）"},

{q:"ヒトの染色体について誤っているのはどれか。",gori:true,
 choices:[
  ["対になる2本の染色体は、どちらも卵子に由来する",true,""],
  ["常染色体は、男女で共通である",false,"教科書どおりの記述なので、正しい。"],
  ["男性の性染色体は、XYと表す",false,"教科書どおりの記述なので、正しい。"],
  ["1つの配偶子にある遺伝情報を、ゲノムと呼ぶ",false,"教科書どおりの記述なので、正しい。"]],
 exp:"対の一方は<b>卵子</b>由来、他方は<b>精子</b>由来。（P5）"},

/* ---------- A-4 細胞内小器官（P6〜7） ---------- */
{q:"クエン酸回路や電子伝達系によってATPを産生するのはどれか。",kihon:true,dobon:true,g:"shoki",
 choices:[
  ["ミトコンドリア",true,""],
  ["中心体",false,"核の近くにあり、細胞分裂やべん毛の形成に関与する。"],
  ["リソソーム",false,"多種類の加水分解酵素を含む顆粒。"],
  ["ゴルジ装置",false,"分泌タンパク質の修飾・濃縮と、分泌顆粒の生成にたずさわる。"]],
 exp:"<b>ミトコンドリア</b>は外膜・内膜・内腔からなり、内膜はクリステという折りたたみ構造をもつ。代謝の激しい心筋や骨格筋などに多い。（P6）"},

{q:"白血球が食作用で取り込んだバクテリアを分解するのにはたらく小器官はどれか。",kihon:true,dobon:true,g:"shoki",
 choices:[
  ["リソソーム",true,""],
  ["ゴルジ装置",false,"分泌タンパク質の修飾・濃縮と、分泌顆粒の生成にたずさわる。"],
  ["ミトコンドリア",false,"クエン酸回路や電子伝達系でATPを産生する。"],
  ["粗面小胞体",false,"表面に粒子が付着した小胞体で、タンパク質を合成する。"]],

 choices:[

 exp:"細胞内の物質輸送を担うのは<b>微小管</b>。中間径フィラメントは、形態維持、細胞間接着、細胞内小器官の空間的配置に関わる。（P7）"},

let mode="normal", drawn=[], idx=0, score=0, streak=0, answered=false, dead=false;
let qmiss=0, totalMiss=0, firstTryCount=0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function home(){
  document.getElementById("htt").textContent="確認テスト";
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="0";
  document.getElementById("bd").innerHTML=`
    <div class="center">
      <p class="lead">モードを選んでスタート。<br>問題は毎回シャッフルされ、プール${POOL.length}問から${PICK}問が出題されます。</p>
      <div class="modes">
        <button class="mode" onclick="start('normal')">
          <div class="nm">通常モード</div>
          <div class="ds">${PICK}問を最後まで解いて採点します。まちがえても正解するまで選び直せます。<span class="mark kihon" style="margin-left:4px">🎯基本</span> は落としちゃダメな基本問題。</div>
        </button>
        <button class="mode dob" onclick="start('dobon')">
          <div class="nm">💣 ドボンチャレンジ</div>
          <div class="ds">絶対に落とせない問題が <b>💣ドボン！</b> に変身。外したら選び直しなしで即終了。どこまで連続正解できるか挑戦！</div>
        </button>
      </div>
    </div>`;
  document.getElementById("ctrl").innerHTML="";
}
function start(m){
  mode=m; drawn=draw();
  idx=0;score=0;streak=0;dead=false;totalMiss=0;firstTryCount=0;render();
}
function render(){
  answered=false; qmiss=0;
  const item=drawn[idx];
  const opts=shuffle(item.choices);
  const isDob=(mode==="dobon" && item.dobon);
  document.getElementById("htt").textContent=(mode==="dobon")?"ドボンチャレンジ":"確認テスト";
  document.getElementById("pg").textContent=`問 ${idx+1} / ${drawn.length}`;
  document.getElementById("bar").style.width=(idx/drawn.length*100)+"%";
  const L=["ア","イ","ウ","エ","オ"];
  let markHtml="";
  if(isDob) markHtml+=`<span class="mark dobon">💣 ドボン！</span>`;
  else if(item.kihon) markHtml+=`<span class="mark kihon">🎯 基本</span>`;
  if(item.gori) markHtml+=`<span class="mark gori">⚠ 誤りを選ぶ</span>`;
  if(item.hosoku) markHtml+=`<span class="mark hosoku">📘 補足（資料外）</span>`;
  const qt=item.gori?item.q.replace("誤っている",'<span class="ng">誤っている</span>'):item.q;
  let h=`<div class="qnum">Q${idx+1} ${markHtml}</div><div class="q">${qt}</div><div class="opts">`;
  opts.forEach((o,i)=>{h+=`<button class="opt" onclick="pick(this,${o[1]})"><span class="mk">${L[i]}</span><span>${o[0]}</span></button>`;});
  h+=`</div><div class="exp" id="exp"><div class="vd" id="vd"></div><div class="tx" id="tx"></div></div>`;
  document.getElementById("bd").innerHTML=h;
  document.getElementById("ctrl").innerHTML=`<button class="btn" id="nx" onclick="next()" disabled>解答を選んでください</button>`;
}
function pick(el,ok){
  if(answered)return;
  if(el.classList.contains("dis"))return;
  const item=drawn[idx];
  const isDob=(mode==="dobon" && item.dobon);
  const selText=el.querySelector("span:last-child").textContent;
  const selChoice=item.choices.find(c=>c[0]===selText);
  const exp=document.getElementById("exp");
  const nx=document.getElementById("nx");

  if(ok){
    answered=true;
    el.classList.add("correct");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    score++;
    if(mode!=="dobon"){ if(qmiss===0) firstTryCount++; }
    if(mode==="dobon") streak++;
    exp.className="exp show ok";
    document.getElementById("vd").textContent="正解！";
    document.getElementById("tx").innerHTML=item.exp;
    nx.disabled=false;
    nx.textContent=(idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶";
    return;
  }
  if(mode==="dobon"){
    answered=true;
    el.classList.add("wrong");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    if(item.dobon){ dead=true; }
    exp.className="exp show ng";
    document.getElementById("vd").textContent=isDob?"💣 ドボン！":"不正解";
    document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}`;
    nx.disabled=false;
    nx.textContent=dead?"結果を見る（ドボン）▶":((idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶");
    return;
  }
  qmiss++; totalMiss++;
  el.classList.add("wrong","dis");
  exp.className="exp show ng";
  document.getElementById("vd").textContent="不正解（ミス "+qmiss+"回）";
  document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}<br>ほかの選択肢からもう一度選んでください。`;
}
function next(){
  if(dead){result();return;}
  if(idx+1<drawn.length){idx++;render();}
  else result();
}
function result(){
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="100%";
  if(mode==="dobon"){
    document.getElementById("htt").textContent="結果";
    if(dead){
      document.getElementById("bd").innerHTML=`<div class="center score dead">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>ドボンを踏んでしまいました</div>
        <div class="big">${score} 問正解</div>
        <div class="msg">${idx+1}問目でドボン。<br>解説を復習して再挑戦しましょう。</div>
      </div>`;
    }else{
      document.getElementById("bd").innerHTML=`<div class="center score">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>クリア！</div>
        <div class="big">${score} / ${drawn.length}</div>
        <div class="msg">ドボンを踏まず完走しました。お見事！</div>
      </div>`;
    }
  }else{
    document.getElementById("htt").textContent="結果";
    const n=drawn.length;
    const ftPct=Math.round(firstTryCount/n*100);
    const noMiss=(totalMiss===0);
    let head = noMiss
      ? `<div class="big">✨ ノーミス パーフェクト！</div><div>全 ${n} 問を一発で正解</div>`
      : `<div>今回の成績</div><div class="big">${firstTryCount} / ${n}</div><div>一発正解率 ${ftPct}%</div>`;
    let stat = `<div class="stats">一発正解 ${firstTryCount}問　｜　総ミス ${totalMiss}回</div>`;
    let msg = noMiss?"完璧です。この調子！":ftPct>=60?"よくできました。ミスした問題を復習しましょう。":"もう一度スライドで確認してから挑戦しましょう。";
    document.getElementById("bd").innerHTML=`<div class="center score">${head}${stat}<div class="msg">${msg}</div></div>`;
  }
  document.getElementById("ctrl").innerHTML=`<button class="btn sub" onclick="home()">モード選択へ</button><button class="btn" onclick="start(mode)">もう一度（シャッフル）▶</button>`;
}
home();
</script>
