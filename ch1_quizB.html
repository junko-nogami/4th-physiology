<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第1章 パートB 確認テスト｜生理学</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:#f0f2f5;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 12px}
h1{font-size:14px;color:#555;margin-bottom:16px;font-weight:400;letter-spacing:.05em}
.slide{width:100%;max-width:820px;background:#fff;border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,.10);overflow:hidden}
.hd{background:#0e6b6b;padding:14px 28px;display:flex;align-items:center;justify-content:space-between}
.hd .ch{font-size:11px;color:#a3ddd8;font-weight:500;letter-spacing:.07em;margin-bottom:3px}
.hd .tt{font-size:19px;font-weight:500;color:#fff}
.hd .pg{font-size:12px;color:#a3ddd8;font-weight:500;white-space:nowrap;margin-left:14px}
.bar{height:5px;background:#e5e7eb;overflow:hidden}
.bar > i{display:block;height:100%;background:#0e6b6b;transition:width .3s;width:0}
.bd{padding:22px 28px 18px;background:#fff;min-height:300px}
.qnum{font-size:11px;font-weight:600;color:#0e6b6b;letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.mark{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px}
.mark.kihon{background:rgba(14,107,107,.13);color:#0b5c5c}
.mark.dobon{background:rgba(200,60,40,.14);color:#c33c28}
.q{font-size:16px;line-height:1.8;color:#1a1a1a;font-weight:500;margin-bottom:18px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:left;font-size:14.5px;line-height:1.6;color:#222;background:#f8f9fb;border:1.5px solid #e5e7eb;border-radius:9px;padding:12px 15px;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;gap:10px;align-items:flex-start}
.opt .mk{flex-shrink:0;width:22px;height:22px;border-radius:50%;border:1.5px solid #c3c8d0;color:#888;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.opt:not(.dis):hover{border-color:#0e6b6b;background:#f0faf9}
.opt.dis{cursor:default}
.opt.correct{border-color:#1f9d6b;background:#e9f8f1}
.opt.correct .mk{border-color:#1f9d6b;background:#1f9d6b;color:#fff}
.opt.wrong{border-color:#d0483f;background:#fdeceb}
.opt.wrong .mk{border-color:#d0483f;background:#d0483f;color:#fff}
.exp{margin-top:16px;border-radius:9px;padding:14px 16px;font-size:14px;line-height:1.85;display:none}
.exp.show{display:block}
.exp.ok{background:#e9f8f1;border:1px solid #b6e6d1}
.exp.ng{background:#fdeceb;border:1px solid #f2c4c0}
.exp .vd{font-weight:700;font-size:15px;margin-bottom:4px}
.exp.ok .vd{color:#1f9d6b}
.exp.ng .vd{color:#d0483f}
.exp .tx{color:#333}
.exp .tx b{color:#111}
.ctrl{display:flex;align-items:center;gap:8px;padding:12px 28px 14px;background:#f8f9fb;border-top:1px solid #e5e7eb;border-radius:0 0 12px 12px}
.btn{padding:9px 18px;border-radius:7px;border:1px solid #0e6b6b;background:#0e6b6b;color:#fff;font-size:13px;cursor:pointer;font-family:inherit;font-weight:500;transition:background .15s;margin-left:auto}
.btn:hover{background:#0a5555}
.btn:disabled{opacity:.4;cursor:default}
.btn.sub{background:#fff;color:#0e6b6b;border-color:#d1d5db;margin-left:0}
.btn.sub:hover{background:#f0f2f5}
.center{text-align:center;padding:14px 10px}
.center .lead{font-size:14px;color:#555;line-height:1.8;margin-bottom:20px}
.modes{display:flex;flex-direction:column;gap:12px;max-width:470px;margin:0 auto}
.mode{text-align:left;border:1.5px solid #e5e7eb;border-radius:11px;padding:15px 18px;cursor:pointer;background:#fff;transition:all .15s;font-family:inherit}
.mode:hover{border-color:#0e6b6b;background:#f0faf9}
.mode .nm{font-size:16px;font-weight:600;color:#0e6b6b;margin-bottom:4px}
.mode .ds{font-size:13px;color:#666;line-height:1.7}
.mode.dob .nm{color:#c33c28}
.mode.dob:hover{border-color:#c33c28;background:#fdefec}
.score .big{font-size:40px;font-weight:700;color:#0e6b6b;margin:6px 0}
.score.dead .big{color:#c33c28}
.score .msg{font-size:15px;color:#444;line-height:1.8;margin-top:8px}
.score .stats{display:inline-block;margin-top:12px;font-size:13px;font-weight:600;color:#0b5c5c;background:rgba(14,107,107,.09);padding:7px 16px;border-radius:20px}
.tag{display:inline-block;font-size:12px;font-weight:600;color:#0e6b6b;background:rgba(14,107,107,.1);padding:3px 12px;border-radius:20px;margin-bottom:6px}
.tag.dob{color:#c33c28;background:rgba(200,60,40,.12)}
</style>
</head>
<body>
<h1>生理学 第1章 生理学とは｜パートB 確認テスト</h1>
<div class="slide">
  <div class="hd"><div><div class="ch">第1章 生理学とは ｜ B 核・DNA・染色体・細胞内小器官</div><div class="tt" id="htt">確認テスト</div></div><div class="pg" id="pg"></div></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="bd" id="bd"></div>
  <div class="ctrl" id="ctrl"></div>
</div>
<script>
/* choices: [表示文, 正解フラグ, その選択肢が何かの説明]  kihon:true=🎯基本(=💣ドボン)  exp=正解時の解説 */
const PICK=5;
const POOL=[
{q:"遺伝情報を担うDNAを内部に含み、核膜で細胞質基質と隔てられている構造はどれか。",kihon:true,
 choices:[
  ["核",true,""],
  ["リボソーム",false,"mRNAの情報からタンパク質を合成する場。DNAを収める構造ではない。"],
  ["ゴルジ装置",false,"分泌タンパク質の修飾・濃縮や分泌顆粒の生成にはたらく。"],
  ["リソソーム",false,"加水分解酵素を含み、物質や老廃物を分解する顆粒。"]],
 exp:"核は核膜で細胞質基質と隔てられ、内部にDNA（デオキシリボ核酸）を含む。核膜には核膜孔がある。"},

{q:"DNAの構成単位で、リン酸・デオキシリボース・塩基からなるものはどれか。",kihon:true,
 choices:[
  ["ヌクレオチド",true,""],
  ["アミノ酸",false,"タンパク質の構成単位で、DNAの単位ではない。"],
  ["ヒストン",false,"DNAが巻きつくタンパク質。DNAの構成単位ではない。"],
  ["クロマチン",false,"DNAとヒストンが集まった染色質のことで、構成“単位”ではない。"]],
 exp:"DNAは、リン酸・デオキシリボース・塩基からなるヌクレオチドが鎖状につながった高分子化合物。"},

{q:"DNAでアデニン（A）と相補的に結合する塩基はどれか。",kihon:true,
 choices:[
  ["チミン（T）",true,""],
  ["グアニン（G）",false,"Gはシトシン（C）と相補的に結合する。"],
  ["シトシン（C）",false,"Cはグアニン（G）と相補的に結合する。"],
  ["ウラシル（U）",false,"RNAでAと対をなす塩基で、DNAには含まれない。"]],
 exp:"DNAの塩基はA-T、G-Cが相補的に結合し、二重らせんを形成する。"},

{q:"DNAの複製で、一本鎖の塩基に相補的な塩基を結びつけるタンパク質はどれか。",
 choices:[
  ["DNAポリメラーゼ",true,""],
  ["リボソーム",false,"翻訳（タンパク質合成）の場で、DNA複製の酵素ではない。"],
  ["ヒストン",false,"DNAが巻きつくタンパク質で、複製反応を担うわけではない。"],
  ["リソソーム",false,"加水分解酵素で分解を行う顆粒で、複製とは無関係。"]],
 exp:"複製では二重らせんがほどけて一本鎖になり、DNAポリメラーゼが相補的な塩基を結びつけて新たな二重鎖をつくる。"},

{q:"DNAの遺伝情報がmRNAに写し取られる過程はどれか。",kihon:true,
 choices:[
  ["転写",true,""],
  ["翻訳",false,"mRNAの情報をもとにタンパク質が合成される過程。"],
  ["複製",false,"DNAが同じ構造の2本に複製される過程。"],
  ["分化",false,"細胞が異なる形態や機能をもつようになること。"]],
 exp:"DNAの遺伝情報はmRNA（メッセンジャーRNA）に転写され、その後リボソームで翻訳されてタンパク質になる。"},

{q:"mRNAの情報をもとにタンパク質が合成される場はどれか。",
 choices:[
  ["リボソーム",true,""],
  ["核",false,"DNAを収める場所で、mRNAはここから細胞質へ出ていく。"],
  ["ミトコンドリア",false,"クエン酸回路や電子伝達系でATPを産生する小器官。"],
  ["ゴルジ装置",false,"合成後の分泌タンパク質の修飾・濃縮を担う。"]],
 exp:"mRNAは核から細胞質へ出てリボソームと結合し、リボソームで翻訳されてタンパク質が合成される。"},

{q:"ヒトの体細胞がもつ染色体の数はどれか。",kihon:true,
 choices:[
  ["46本（23対）",true,""],
  ["44本（22対）",false,"常染色体だけの数で、性染色体2本が抜けている。"],
  ["23本",false,"配偶子（卵子・精子）がもつ染色体の数。"],
  ["48本",false,"ヒトの染色体数ではない。"]],
 exp:"ヒトの染色体は、常染色体44本（22対）＋性染色体2本（1対）＝計46本（23対）。"},

{q:"ヒトの常染色体の数はどれか。",
 choices:[
  ["44本（22対）",true,""],
  ["46本（23対）",false,"常染色体と性染色体を合わせた総数。"],
  ["2本（1対）",false,"性染色体の数。"],
  ["23本",false,"配偶子がもつ染色体の数。"]],
 exp:"男女で共通の常染色体は44本（22対）。これに性染色体2本（1対）を加えて計46本になる。"},

{q:"男性の性染色体の組合せはどれか。",
 choices:[
  ["XY",true,""],
  ["XX",false,"女性の性染色体の組合せ。"],
  ["YY",false,"X染色体に生命維持に必要な遺伝子があるため、この構成では生存できない。"],
  ["XXX",false,"通常の男女いずれの性染色体構成でもない。"]],
 exp:"男性の性染色体はXY、女性はXX。対の一方は卵子由来、他方は精子由来である。"},

{q:"DNAが巻きついているタンパク質はどれか。",
 choices:[
  ["ヒストン",true,""],
  ["DNAポリメラーゼ",false,"DNA複製で塩基を結びつける酵素で、DNAが巻きつく相手ではない。"],
  ["ミオシン",false,"筋の収縮に関わるタンパク質。"],
  ["アルブミン",false,"血漿に多く含まれるタンパク質。"]],
 exp:"DNAはヒストンに巻きついて染色質（クロマチン）を形成し、分裂期には染色体になる。"},

{q:"クエン酸回路や電子伝達系でATPを産生する細胞内小器官はどれか。",kihon:true,
 choices:[
  ["ミトコンドリア",true,""],
  ["リボソーム",false,"タンパク質を合成する構造で、ATP産生の場ではない。"],
  ["リソソーム",false,"加水分解酵素で物質や老廃物を分解する顆粒。"],
  ["中心体",false,"核の近くにあり、細胞分裂やべん毛の形成に関与する。"]],
 exp:"ミトコンドリアは内膜がクリステという折りたたみ構造をもち、クエン酸回路・電子伝達系でATPを産生する。心筋や骨格筋で多い。"},

{q:"リボソームが付着し、タンパク質を合成する小胞体はどれか。",
 choices:[
  ["粗面小胞体",true,""],
  ["滑面小胞体",false,"リボソームが付着せず、脂質やステロイドホルモンを合成する。"],
  ["ゴルジ装置",false,"合成された分泌タンパク質の修飾・濃縮を担う。"],
  ["リソソーム",false,"加水分解酵素で分解を行う顆粒。"]],
 exp:"リボソームが付着した小胞体が粗面小胞体で、タンパク質を合成する。付着しないものが滑面小胞体。"},

{q:"多種類の加水分解酵素を含み、取り込んだ物質や老廃物を分解する小器官はどれか。",
 choices:[
  ["リソソーム",true,""],
  ["ゴルジ装置",false,"分泌タンパク質の修飾・濃縮や分泌顆粒の生成を担う。"],
  ["中心体",false,"細胞分裂やべん毛の形成に関与する。"],
  ["粗面小胞体",false,"リボソームが付着しタンパク質を合成する。"]],
 exp:"リソソームは多種類の加水分解酵素を含み、細胞内へ取り込んだ物質や老廃物を分解処理する。"},

/* ---- やや難 ---- */
{q:"ヒトのゲノムを構成する塩基対の数として最も近いのはどれか。",
 choices:[
  ["約30億塩基対",true,""],
  ["約2万2千塩基対",false,"これはゲノムに含まれる“遺伝子の数”の概数で、塩基対の数ではない。"],
  ["約46塩基対",false,"46はヒトの染色体の“本数”。"],
  ["約200万塩基対",false,"ヒトゲノムの塩基対数としては大幅に少ない。"]],
 exp:"ゲノムは約30億の塩基対で構成され、23対の染色体にたたみ込まれている。遺伝子は約2万2千個と推定される。"},

{q:"アクチンフィラメントとも呼ばれ、筋細胞の収縮や貪食細胞の遊走に関与する細胞骨格はどれか。",
 choices:[
  ["マイクロフィラメント",true,""],
  ["微小管",false,"細胞骨格のうち最も太く、形態維持や細胞内の物質輸送を担う。"],
  ["中間径フィラメント",false,"形態保持や細胞間接着、細胞内小器官の配置に関わる。"],
  ["クリステ",false,"ミトコンドリア内膜の折りたたみ構造で、細胞骨格ではない。"]],
 exp:"細胞骨格は太い順に微小管・中間径フィラメント・マイクロフィラメント。マイクロフィラメント（アクチンフィラメント）は収縮や遊走など細胞の動きに関与する。"},
];

let mode="normal", drawn=[], idx=0, score=0, streak=0, answered=false, dead=false;
let qmiss=0, totalMiss=0, firstTryCount=0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function home(){
  document.getElementById("htt").textContent="確認テスト";
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="0";
  document.getElementById("bd").innerHTML=`
    <div class="center">
      <p class="lead">モードを選んでスタート。<br>問題は毎回シャッフルされ、プール${POOL.length}問から5問が出題されます。</p>
      <div class="modes">
        <button class="mode" onclick="start('normal')">
          <div class="nm">通常モード</div>
          <div class="ds">5問を最後まで解いて採点します。まちがえても正解するまで選び直せます。<span class="mark kihon" style="margin-left:4px">🎯基本</span> は落としちゃダメな基本問題。</div>
        </button>
        <button class="mode dob" onclick="start('dobon')">
          <div class="nm">💣 ドボンチャレンジ</div>
          <div class="ds">🎯基本の問題は <b>💣ドボン！</b> に変身。外したら選び直しなしで即終了。どこまで連続正解できるか挑戦！</div>
        </button>
      </div>
    </div>`;
  document.getElementById("ctrl").innerHTML="";
}
function start(m){
  mode=m; drawn=shuffle(POOL).slice(0,Math.min(PICK,POOL.length));
  idx=0;score=0;streak=0;dead=false;totalMiss=0;firstTryCount=0;render();
}
function render(){
  answered=false; qmiss=0;
  const item=drawn[idx];
  const opts=shuffle(item.choices);
  const isDob=(mode==="dobon" && item.kihon);
  document.getElementById("htt").textContent=(mode==="dobon")?"ドボンチャレンジ":"確認テスト";
  document.getElementById("pg").textContent=`問 ${idx+1} / ${drawn.length}`;
  document.getElementById("bar").style.width=(idx/drawn.length*100)+"%";
  const L=["ア","イ","ウ","エ","オ"];
  let markHtml = item.kihon ? (isDob?`<span class="mark dobon">💣 ドボン！</span>`:`<span class="mark kihon">🎯 基本</span>`) : "";
  let h=`<div class="qnum">Q${idx+1} ${markHtml}</div><div class="q">${item.q}</div><div class="opts">`;
  opts.forEach((o,i)=>{h+=`<button class="opt" onclick="pick(this,${o[1]})"><span class="mk">${L[i]}</span><span>${o[0]}</span></button>`;});
  h+=`</div><div class="exp" id="exp"><div class="vd" id="vd"></div><div class="tx" id="tx"></div></div>`;
  document.getElementById("bd").innerHTML=h;
  document.getElementById("ctrl").innerHTML=`<button class="btn" id="nx" onclick="next()" disabled>解答を選んでください</button>`;
}
function pick(el,ok){
  if(answered)return;
  if(el.classList.contains("dis"))return;
  const item=drawn[idx];
  const isDob=(mode==="dobon" && item.kihon);
  const selText=el.querySelector("span:last-child").textContent;
  const selChoice=item.choices.find(c=>c[0]===selText);
  const exp=document.getElementById("exp");
  const nx=document.getElementById("nx");

  if(ok){
    answered=true;
    el.classList.add("correct");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    score++;
    if(mode!=="dobon"){ if(qmiss===0) firstTryCount++; }
    if(mode==="dobon") streak++;
    exp.className="exp show ok";
    document.getElementById("vd").textContent=(qmiss===0)?"正解！":"正解！（"+qmiss+"回目で正解）";
    document.getElementById("tx").innerHTML=item.exp;
    nx.disabled=false;
    nx.textContent=(idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶";
    return;
  }
  if(mode==="dobon"){
    answered=true;
    el.classList.add("wrong");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    if(item.kihon){ dead=true; }
    exp.className="exp show ng";
    document.getElementById("vd").textContent=isDob?"💣 ドボン！":"不正解";
    document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}`;
    nx.disabled=false;
    nx.textContent=dead?"結果を見る（ドボン）▶":((idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶");
    return;
  }
  qmiss++; totalMiss++;
  el.classList.add("wrong","dis");
  exp.className="exp show ng";
  document.getElementById("vd").textContent="不正解（ミス "+qmiss+"回）";
  document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}<br>ほかの選択肢からもう一度選んでください。`;
}
function next(){
  if(dead){result();return;}
  if(idx+1<drawn.length){idx++;render();}
  else result();
}
function result(){
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="100%";
  if(mode==="dobon"){
    document.getElementById("htt").textContent="結果";
    if(dead){
      document.getElementById("bd").innerHTML=`<div class="center score dead">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>ドボンを踏んでしまいました</div>
        <div class="big">${streak} 問連続正解</div>
        <div class="msg">${idx}問正解のあと、${idx+1}問目でドボン。<br>上の解説を復習して再挑戦しましょう。</div>
      </div>`;
    }else{
      document.getElementById("bd").innerHTML=`<div class="center score">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>クリア！</div>
        <div class="big">${score} / ${drawn.length}</div>
        <div class="msg">ドボンを踏まず完走しました。お見事！</div>
      </div>`;
    }
  }else{
    document.getElementById("htt").textContent="結果";
    const n=drawn.length;
    const ftPct=Math.round(firstTryCount/n*100);
    const noMiss=(totalMiss===0);
    let head = noMiss
      ? `<div class="big">✨ ノーミス パーフェクト！</div><div>全 ${n} 問を一発で正解</div>`
      : `<div>今回の成績</div><div class="big">${firstTryCount} / ${n}</div><div>一発正解率 ${ftPct}%</div>`;
    let stat = `<div class="stats">一発正解 ${firstTryCount}問　｜　総ミス ${totalMiss}回</div>`;
    let msg = noMiss?"完璧です。この調子！":ftPct>=60?"よくできました。ミスした問題を復習しましょう。":"もう一度スライドで確認してから挑戦しましょう。";
    document.getElementById("bd").innerHTML=`<div class="center score">${head}${stat}<div class="msg">${msg}</div></div>`;
  }
  document.getElementById("ctrl").innerHTML=`<button class="btn sub" onclick="home()">モード選択へ</button><button class="btn" onclick="start(mode)">もう一度（シャッフル）▶</button>`;
}
home();
</script>
</body>
</html>
