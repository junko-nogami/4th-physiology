<script>
/* ===== 問題プール（教科書 第11章 P161〜P164 ベース）=====
   choices: [表示文, 正解フラグ, その選択肢が何かの説明]
   kihon / dobon / gori / hosoku の意味は確認テスト引き継ぎ資料（第5版）8節のとおり
   過去問での出題頻度（パートBの範囲）：肺気量の区分 約8回／安静呼吸の胸膜腔内圧・肺胞内圧 約5回／
   1秒率 3回／肺胞換気量・死腔・分時換気量 約3回／換気障害 2回／サーファクタント 1回 */
const PICK=5;
/* グループごとの1回あたりの出題上限（atsu＝胸膜腔内圧・肺胞内圧など圧の問題） */
const GMAX={atsu:2};
function draw(){const out=[],cnt={};for(const q of shuffle(POOL)){const g=q.g;if(g&&GMAX[g]!==undefined){if((cnt[g]||0)>=GMAX[g])continue;cnt[g]=(cnt[g]||0)+1;}out.push(q);if(out.length>=PICK)break;}return out;}
const POOL=[

/* ---------- 換気のしくみ（P161） ---------- */

{g:"atsu",q:"肺胞が自らの弾性で縮まろうとする、ゴム風船のような力を何というか。",
 choices:[
  ["肺胞壁弾性圧",true,""],
  ["肺胞内圧",false,"外気を取り込んだ肺胞が広がろうとするときの力。"],
  ["胸膜腔内圧",false,"2枚の胸膜の間（胸膜腔）の内圧。安静呼吸時は常に陰圧。"],
  ["大気圧",false,"体の外の空気の圧力。呼息の終わりには肺胞内圧がこれと等しくなる。"]],
 exp:"肺胞が自らの弾性で縮まろうとする力を<b>肺胞壁弾性圧</b>という。（教科書 P161）"},

{g:"atsu",q:"吸息が起こるのはどれか。",
 choices:[
  ["肺胞内圧が、肺胞壁弾性圧と胸膜腔内圧の合計を上回るとき",true,""],
  ["肺胞内圧が、肺胞壁弾性圧と胸膜腔内圧の合計を下回るとき",false,"呼息が起こる条件。"],
  ["肺胞内圧が大気圧と等しいとき",false,"呼息の終わりの静止時の状態。"],
  ["胸膜腔内圧が陽圧になったとき",false,"安静呼吸では胸膜腔内圧は陽圧にならない。"]],
 exp:"肺胞壁弾性圧と胸膜腔内圧の合計圧を肺胞内圧が<b>上回る</b>と吸息、下回ると呼息が行われる。（教科書 P161、図11・4）"},

{g:"atsu",q:"安静時の吸息で起こる変化はどれか。",kihon:true,dobon:true,
 choices:[
  ["胸膜腔内圧が低下し、肺が膨らむ",true,""],
  ["胸膜腔内圧が上昇し、肺が縮む",false,"呼息時の変化。"],
  ["肺胞内圧が陽圧になる",false,"呼息時の変化。"],
  ["胸郭の体積が減少する",false,"吸息筋が弛緩する呼息時の変化。"]],
 exp:"吸息筋が収縮して胸郭の体積が増えると、<b>胸膜腔内圧が低下して肺が膨らむ</b>。その結果、肺胞内圧が下がり外界から空気が流入する。（教科書 P161）"},

{g:"atsu",q:"安静時の呼息で起こる変化はどれか。",kihon:true,
 choices:[
  ["肺胞内圧が陽圧となり、空気が外界へ押し出される",true,""],
  ["胸膜腔内圧が陽圧になる",false,"安静呼吸時の胸膜腔内圧は、呼息時も大気圧より低い。"],
  ["吸息筋が収縮する",false,"吸息時の変化。"],
  ["胸郭の体積が増加する",false,"吸息時の変化。"]],
 exp:"吸息筋が弛緩して胸郭の体積が減ると胸膜腔内圧が上昇し、肺が縮む。<b>肺胞内圧が陽圧</b>となり空気が押し出される。（教科書 P161）"},

{g:"atsu",q:"安静呼吸について誤っているのはどれか。",kihon:true,dobon:true,gori:true,
 choices:[
  ["胸膜腔内圧は、呼息時に陽圧になる",true,""],
  ["胸膜腔内圧は、吸息時に陰圧である",false,"教科書どおりの記述なので、正しい。"],
  ["肺胞内圧は、吸息時に陰圧になる",false,"教科書どおりの記述なので、正しい。"],
  ["肺胞内圧は、呼息時に陽圧になる",false,"教科書どおりの記述なので、正しい。"]],
 exp:"安静呼吸時の胸膜腔内圧は、吸息時も呼息時も大気圧より常に低い<b>陰圧</b>。陰圧・陽圧が入れ替わるのは肺胞内圧のほう。（教科書 P161）"},

{g:"atsu",q:"呼息の終わりの静止時、肺胞内圧はどうなっているか。",kihon:true,
 choices:[
  ["大気圧と等しい",true,""],
  ["大気圧より高い",false,"呼息の途中の肺胞内圧（陽圧）。"],
  ["大気圧より低い",false,"吸息の途中の肺胞内圧（陰圧）。"],
  ["胸膜腔内圧と等しい",false,"胸膜腔内圧は常に陰圧で、この時点の肺胞内圧とは等しくない。"]],
 exp:"呼息の終わりの静止時には、肺胞内圧が<b>大気圧と等しく</b>なる。（教科書 P161）"},

{g:"atsu",q:"安静時の呼息中、胸膜腔内圧はどうなっているか。",kihon:true,dobon:true,
 choices:[
  ["大気圧より低い",true,""],
  ["大気圧より高い",false,"呼息中の肺胞内圧の状態（陽圧）。"],
  ["大気圧と等しい",false,"呼息の終わりの静止時の肺胞内圧の状態。"],
  ["吸息時より低い",false,"胸膜腔内圧の陰圧がもっとも強くなるのは吸息時。"]],
 exp:"安静呼吸時の胸膜腔内圧は、吸息時も呼息時も大気圧より常に低い<b>陰圧</b>。呼息で胸膜腔内圧は上昇するが、陽圧にまではならない。（教科書 P161）"},

{g:"atsu",q:"安静呼吸中、常に大気圧より低く保たれているのはどれか。",kihon:true,
 choices:[
  ["胸膜腔内圧",true,""],
  ["肺胞内圧",false,"吸息時は陰圧だが、呼息時には陽圧になる。"],
  ["気道内圧",false,"呼息時には肺胞内圧と同じく大気圧より高くなる。"],
  ["大動脈の血圧",false,"心臓の拍出による圧で、常に大気圧より高い。"]],
 exp:"常に陰圧なのは<b>胸膜腔内圧</b>。陰圧と陽圧が入れ替わるのは肺胞内圧。（教科書 P161）"},

{g:"atsu",q:"安静時の呼息について誤っているのはどれか。",gori:true,
 choices:[
  ["胸膜腔内圧が陽圧になる",true,""],
  ["吸息筋が弛緩する",false,"教科書どおりの記述なので、正しい。"],
  ["肺胞内圧が陽圧になる",false,"教科書どおりの記述なので、正しい。"],
  ["呼息の終わりの静止時には、肺胞内圧が大気圧と等しくなる",false,"教科書どおりの記述なので、正しい。"]],
 exp:"呼息では胸膜腔内圧は上昇するが、大気圧より低い<b>陰圧</b>のまま。陽圧になるのは肺胞内圧。（教科書 P161）"},

{g:"atsu",q:"安静呼吸で、肺胞内圧が大気圧と等しくなるのはどれか。",kihon:true,
 choices:[
  ["呼息の終わりの静止時",true,""],
  ["吸息の途中",false,"肺胞内圧は陰圧で、外界から空気が流入している。"],
  ["呼息の途中",false,"肺胞内圧は陽圧で、空気が外界へ押し出されている。"],
  ["呼吸周期のどの時点でも等しくならない",false,"空気の出入りが止まる時点がある。"]],
 exp:"<b>呼息の終わりの静止時</b>には、肺胞内圧が大気圧と等しくなり、空気の出入りが止まる。（教科書 P161）"},

{g:"atsu",q:"安静時の呼息の途中、肺胞内圧はどうなっているか。",kihon:true,
 choices:[
  ["大気圧より高い（陽圧）",true,""],
  ["大気圧より低い（陰圧）",false,"吸息の途中の肺胞内圧。"],
  ["大気圧と等しい",false,"呼息の終わりの静止時の肺胞内圧。"],
  ["胸膜腔内圧と等しい",false,"胸膜腔内圧は呼息中も陰圧で、肺胞内圧とは等しくない。"]],
 exp:"呼息では胸郭が縮んで肺が縮み、肺胞内圧が<b>陽圧</b>になる。この圧で空気が外界へ押し出される。（教科書 P161）"},

{g:"atsu",q:"安静呼吸の呼息の終わりの静止時の組合せで正しいのはどれか。（肺胞内圧 ― 胸膜腔内圧）",
 choices:[
  ["大気圧と等しい ― 陰圧",true,""],
  ["大気圧と等しい ― 大気圧と等しい",false,"胸膜腔内圧はこの時点でも陰圧。"],
  ["陽圧 ― 陰圧",false,"呼息の途中の状態。"],
  ["陰圧 ― 陰圧",false,"吸息の途中の状態。"]],
 exp:"呼息の終わりは<b>肺胞内圧＝大気圧</b>。<b>胸膜腔内圧</b>は呼吸のどの時点でも<b>陰圧</b>。（教科書 P161）"},

{g:"atsu",q:"安静呼吸時の胸膜腔内圧の組合せで正しいのはどれか。（吸息時 ― 呼息時）",kihon:true,
 choices:[
  ["陰圧 ― 陰圧",true,""],
  ["陰圧 ― 陽圧",false,"肺胞内圧の組合せ。"],
  ["陽圧 ― 陰圧",false,"吸息時も呼息時も、このような変化はしない。"],
  ["大気圧と等しい ― 陰圧",false,"胸膜腔内圧が大気圧と等しくなる時点はない。"]],
 exp:"胸膜腔内圧は吸息時も呼息時も<b>陰圧</b>（吸息時のほうが陰圧が強い）。（教科書 P161）"},

{g:"atsu",q:"安静吸息時の胸膜腔内圧はおよそどれか。",hosoku:true,
 choices:[
  ["−6 mmHg",true,""],
  ["−2.5 mmHg",false,"呼息時の胸膜腔内圧。"],
  ["−1 mmHg",false,"吸息時の肺胞内圧。"],
  ["＋1 mmHg",false,"呼息時の肺胞内圧。"]],
 exp:"補足知識（資料外）。胸膜腔内圧は吸息時に約<b>−6 mmHg</b>で最も陰圧が強く、呼息時も約−2.5 mmHgの陰圧。"},

{g:"atsu",q:"吸息時に起こる変化として誤っているのはどれか。",gori:true,hosoku:true,
 choices:[
  ["肺胞壁弾性力が減少する",true,""],

  ["肺胞内圧が陰圧になる",false,"正しい記述。"],
  ["胸膜腔内圧が低下する",false,"正しい記述。"]],
 exp:"補足知識（資料外）。吸息で肺胞壁が広げられると、肺胞は縮まろうとして弾性力が<b>増大</b>する。"},

/* ---------- 肺気量（P162〜163、表11・1） ---------- */

{q:"成人の1回換気量の正常値はどれか。",kihon:true,dobon:true,
 choices:[
  ["500 mL",true,""],
  ["150 mL",false,"死腔量の目安。"],

  ["1,500 mL",false,"残気量。"]],
 exp:"安静時の1回の呼吸で肺へ出入りする空気の容積＝1回換気量で、約<b>500 mL</b>。（表11・1）"},

{q:"成人の予備吸気量の正常値はどれか。",
 choices:[
  ["2,000〜2,500 mL",true,""],
  ["500 mL",false,"1回換気量。"],
  ["1,000 mL",false,"予備呼気量。"],
  ["3,000〜4,500 mL",false,"肺活量。"]],

{q:"成人の残気量の正常値はどれか。",
 choices:[
  ["1,500 mL",true,""],
  ["500 mL",false,"1回換気量。"],
  ["1,000 mL",false,"予備呼気量。"],

{q:"最大吸気位から最大努力で吐き出せる空気の量はどれか。",kihon:true,dobon:true,
 choices:[
  ["肺活量",true,""],
  ["残気量",false,"最大努力で吐き出したあとも肺に残る空気の量。"],

 exp:"<b>肺活量</b>＝1回換気量＋予備吸気量＋予備呼気量。最大に吸ってから最大に吐ける量にあたる。（表11・1）"},

{q:"機能的残気量を表すのはどれか。",kihon:true,dobon:true,

  ["1回換気量−死腔量",false,"1回肺胞換気量。"]],

  ["1回換気量",false,"安静時の1回の呼吸で出入りする量。"]],

 choices:[

let mode="normal", drawn=[], idx=0, score=0, streak=0, answered=false, dead=false;
let qmiss=0, totalMiss=0, firstTryCount=0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function home(){
  document.getElementById("htt").textContent="確認テスト";
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="0";
  document.getElementById("bd").innerHTML=`
    <div class="center">
      <p class="lead">モードを選んでスタート。<br>問題は毎回シャッフルされ、プール${POOL.length}問から${PICK}問が出題されます。</p>
      <div class="modes">
        <button class="mode" onclick="start('normal')">
          <div class="nm">通常モード</div>
          <div class="ds">${PICK}問を最後まで解いて採点します。ふだんの確認用。<span class="mark kihon" style="margin-left:4px">🎯基本</span> は落としちゃダメな基本問題、<span class="mark gori">⚠ 誤りを選ぶ</span> は誤っているものを選ぶ問題、<span class="mark hosoku">📘 補足（資料外）</span> は教科書外の国試頻出テーマ。</div>
        </button>
        <button class="mode dob" onclick="start('dobon')">
          <div class="nm">💣 ドボンチャレンジ</div>
          <div class="ds">プールの中のごく一部、<b>絶対に落とせない最重要問題</b>だけが <b>💣ドボン！</b> に変身。それを外したらそこで終了。どこまで正解を続けられるか挑戦！</div>
        </button>
      </div>
    </div>`;
  document.getElementById("ctrl").innerHTML="";
}
function start(m){
  mode=m; drawn=draw();
  idx=0;score=0;streak=0;dead=false;totalMiss=0;firstTryCount=0;render();
}
function render(){
  answered=false; qmiss=0;
  const item=drawn[idx];
  const opts=shuffle(item.choices);
  const isDob=(mode==="dobon" && item.dobon);
  document.getElementById("htt").textContent=(mode==="dobon")?"ドボンチャレンジ":"確認テスト";
  document.getElementById("pg").textContent=`問 ${idx+1} / ${drawn.length}`;
  document.getElementById("bar").style.width=(idx/drawn.length*100)+"%";
  const L=["ア","イ","ウ","エ","オ"];
  let markHtml = isDob ? `<span class="mark dobon">💣 ドボン！</span>`
                       : (item.kihon ? `<span class="mark kihon">🎯 基本</span>` : "");
  if(item.gori)   markHtml += `<span class="mark gori">⚠ 誤りを選ぶ</span>`;
  if(item.hosoku) markHtml += `<span class="mark hosoku">📘 補足（資料外）</span>`;
  const qText = item.gori ? item.q.replace("誤っている",'<span class="ng">誤っている</span>') : item.q;
  let h=`<div class="qnum">Q${idx+1} ${markHtml}</div><div class="q">${qText}</div><div class="opts">`;
  opts.forEach((o,i)=>{h+=`<button class="opt" onclick="pick(this,${o[1]})"><span class="mk">${L[i]}</span><span>${o[0]}</span></button>`;});
  h+=`</div><div class="exp" id="exp"><div class="vd" id="vd"></div><div class="tx" id="tx"></div></div>`;
  document.getElementById("bd").innerHTML=h;
  document.getElementById("ctrl").innerHTML=`<button class="btn" id="nx" onclick="next()" disabled>解答を選んでください</button>`;
}
function pick(el,ok){
  if(answered)return;
  if(el.classList.contains("dis"))return;
  const item=drawn[idx];
  const isDob=(mode==="dobon" && item.dobon);
  const selText=el.querySelector("span:last-child").textContent;
  const selChoice=item.choices.find(c=>c[0]===selText);
  const exp=document.getElementById("exp");
  const nx=document.getElementById("nx");

  if(ok){
    answered=true;
    el.classList.add("correct");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    score++;
    if(mode!=="dobon"){ if(qmiss===0) firstTryCount++; }
    if(mode==="dobon") streak++;
    exp.className="exp show ok";
    document.getElementById("vd").textContent=(qmiss===0)?"正解！":"正解！（"+qmiss+"回目で正解）";
    document.getElementById("tx").innerHTML=item.exp;
    nx.disabled=false;
    nx.textContent=(idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶";
    return;
  }

  if(mode==="dobon"){
    answered=true;
    el.classList.add("wrong");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    if(item.dobon){ dead=true; }
    exp.className="exp show ng";
    document.getElementById("vd").textContent=isDob?"💣 ドボン！":"不正解";
    document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}`;
    nx.disabled=false;
    nx.textContent=dead?"結果を見る（ドボン）▶":((idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶");
    return;
  }

  qmiss++; totalMiss++;
  el.classList.add("wrong","dis");
  exp.className="exp show ng";
  document.getElementById("vd").textContent="不正解（ミス "+qmiss+"回）";
  document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}<br>ほかの選択肢からもう一度選んでください。`;
}
function next(){
  if(dead){result();return;}
  if(idx+1<drawn.length){idx++;render();}
  else result();
}
function result(){
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="100%";
  if(mode==="dobon"){
    document.getElementById("htt").textContent="結果";
    if(dead){
      document.getElementById("bd").innerHTML=`<div class="center score dead">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>ドボンを踏んでしまいました</div>
        <div class="big">${streak} 問連続正解</div>
        <div class="msg">${idx}問正解のあと、${idx+1}問目でドボン。<br>上の解説を復習して再挑戦しましょう。</div>
      </div>`;
    }else{
      document.getElementById("bd").innerHTML=`<div class="center score">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>クリア！</div>
        <div class="big">${score} / ${drawn.length}</div>
        <div class="msg">ドボンを踏まず完走しました。お見事！</div>
      </div>`;
    }
  }else{
    document.getElementById("htt").textContent="結果";
    const n=drawn.length;
    const ftPct=Math.round(firstTryCount/n*100);
    const noMiss=(totalMiss===0);
    let head = noMiss
      ? `<div class="big">✨ ノーミス パーフェクト！</div><div>全 ${n} 問を一発で正解</div>`
      : `<div>今回の成績</div><div class="big">${firstTryCount} / ${n}</div><div>一発正解率 ${ftPct}%</div>`;
    let stat = `<div class="stats">一発正解 ${firstTryCount}問　｜　総ミス ${totalMiss}回</div>`;
    let msg = noMiss?"完璧です。この調子！":ftPct>=60?"よくできました。ミスした問題を復習しましょう。":"もう一度スライドで確認してから挑戦しましょう。";
    document.getElementById("bd").innerHTML=`<div class="center score">${head}${stat}<div class="msg">${msg}</div></div>`;
  }
  document.getElementById("ctrl").innerHTML=`<button class="btn sub" onclick="home()">モード選択へ</button><button class="btn" onclick="start(mode)">もう一度（シャッフル）▶</button>`;
}
home();
</script>
