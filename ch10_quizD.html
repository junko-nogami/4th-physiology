<script>
/* ===== 問題プール（教科書 第10章 P149〜153 ベース）=====
   対応スライド：ch10_partD.html
   choices: [表示文, 正解フラグ, その選択肢が何かの説明]
   kihon :true … 🎯基本。プールの4〜6割が目安
   dobon :true … 💣ドボン。プールの15〜20%
   gori  :true … 「誤っているのはどれか」形式。true が付くのは「誤っている記述」＝選ぶべき選択肢
   hosoku:true … 教科書に記述のない補足知識
   exp … 正解時に見せる「なぜ正しいか」

   過去問（宅ドリル循環30問）での出題：静脈還流（吸息・立位・筋ポンプ）4／リンパ系（弁・静脈角・流れの向き）2／
   組織液の還流・浮腫・タンパク質1／静脈＝容量血管1（quizCに収録済み）／脂肪の輸送1（📘）／圧が最も低い血管1（📘） */
const PICK=5;
const POOL=[

/* ---------- B-3 交換血管（P149） ---------- */

{q:"毛細血管の内皮細胞を取り巻いているのはどれか。",
 choices:[
  ["基底膜",true,""],
  ["平滑筋層",false,"細動脈の中膜に発達し、血管径を変える層。"],
  ["弾性線維の多い中膜",false,"大動脈の壁の特徴。"],
  ["静脈弁",false,"中静脈の内膜に発達し、血液を心臓側へ流す構造。"]],
 exp:"毛細血管は、1層の扁平な内皮細胞と、それを取り巻く<b>基底膜</b>からなる細い管である。（教科書 P149）"},

{q:"毛細血管で物質交換が生じるしくみの組合せはどれか。",kihon:true,
 choices:[
  ["拡散と限外濾過",true,""],
  ["静脈弁と筋肉のポンプ作用",false,"静脈血を心臓へ還すしくみ。"],
  ["自己調節と代謝産物による血管拡張",false,"臓器の血流量を調節するしくみ。"],
  ["受動的輸送と能動的輸送",false,"リンパを運ぶしくみ。"]],
 exp:"毛細血管は壁が薄く、孔があり、流速も遅い。物質の交換は<b>拡散と限外濾過</b>により生じる。（教科書 P149）"},

{q:"拡散による物質の移動速度を決める因子の組合せはどれか。",
 choices:[
  ["濃度差と毛細血管壁の透過性",true,""],
  ["静水圧と膠質浸透圧の差",false,"限外濾過で体液が動く向きを決める因子。"],
  ["灌流圧と血管抵抗",false,"臓器の血流量を決める因子。"],
  ["1回拍出量と心拍数",false,"心拍出量を決める因子。"]],
 exp:"移動速度は、血液と組織液の間の<b>濃度差</b>と、毛細血管壁のその物質に対する<b>透過性</b>で決まる。（教科書 P149）"},

{q:"毛細血管壁を拡散によって移動する物質はどれか。",kihon:true,
 choices:[
  ["グルコース",true,""],
  ["アルブミン",false,"高分子のタンパク質で、毛細血管壁の孔を通過できない。"],
  ["フィブリノーゲン",false,"血漿中の高分子タンパク質で、孔を通過できない。"],
  ["血小板",false,"血球成分で、拡散で壁を通り抜けるものではない。"]],
 exp:"拡散で移動する物質は、水、酸素、炭酸ガス、尿素、<b>グルコース</b>など。（教科書 P149）"},

{q:"血漿膠質浸透圧を生じさせる主な物質はどれか。",kihon:true,dobon:true,
 choices:[
  ["アルブミン",true,""],
  ["Na⁺",false,"低分子の電解質で、晶質浸透圧（低分子による浸透圧）のもとになる。毛細血管壁を通過するため、膠質浸透圧にはかかわらない。"],
  ["Cl⁻",false,"低分子の電解質で、晶質浸透圧（低分子による浸透圧）のもとになる。毛細血管壁を通過するため、膠質浸透圧にはかかわらない。"],
  ["グルコース",false,"低分子で、毛細血管壁を拡散で移動する。"]],
 exp:"血漿膠質浸透圧は、<b>アルブミン</b>などのタンパク質が毛細血管壁を通過しないために生じる圧力である。（教科書 P149）"},

{q:"血漿膠質浸透圧がはたらく向きはどれか。",kihon:true,
 choices:[
  ["体液を組織側から血管内へ移動させる",true,""],
  ["血漿を血管内から組織側へ押し出す",false,"細動脈側で静水圧がはたらく向き。"],
  ["組織液をリンパ管へ押し込む",false,"リンパ管を外から圧迫する受動的リンパ輸送のはたらき。"],
  ["血液を末梢から中枢へ押し出す",false,"筋肉のポンプ作用のはたらき。"]],
 exp:"血漿膠質浸透圧は、体液を<b>組織側から血管内側に移動させる力</b>となる。（教科書 P149）"},

{q:"晶質浸透圧（電解質などの低分子による浸透圧）について正しいのはどれか。",
 choices:[
  ["晶質が血管内外を移動し、平衡に達する",true,""],
  ["アルブミンによって生じる",false,"膠質浸透圧の説明。"],
  ["毛細血管壁を通過しにくいため、浸透圧差を生じる",false,"膠質浸透圧の説明。"],
  ["体液を組織側から血管内へ引き込む主な力となる",false,"血漿膠質浸透圧の説明。"]],
 exp:"電解質などの低分子による晶質浸透圧は、<b>晶質が血管内外を移動して平衡に達する</b>ため、毛細血管では水を動かす力にならない。（教科書 P149）<br>⚠注意：「晶質」はNa⁺やCl⁻、グルコースのような小さな物質のこと。タンパク質のような大きな物質＝「膠質」と対になる言葉で、国試ではほとんど使われない。毛細血管で水の出入りを決めるのは<b>膠質浸透圧</b>のほうなので、そちらを優先して覚えよう。"},

{q:"毛細血管の細動脈側で起こるのはどれか。",kihon:true,dobon:true,
 choices:[
  ["血漿の濾過",true,""],
  ["組織液の再吸収",false,"細静脈側で起こる。"],
  ["リンパ管自身の収縮",false,"能動的リンパ輸送。"],
  ["静脈弁の閉鎖",false,"静脈で血液の逆流を防ぐしくみ。"]],
 exp:"細動脈側では静水圧が膠質浸透圧より大きいため、血管内から組織側に血漿の<b>濾過</b>が生じる。（教科書 P149、図10・10）"},

{q:"毛細血管の細静脈側で、組織液が血管内に再吸収される理由はどれか。",kihon:true,
 choices:[
  ["静水圧が膠質浸透圧より小さい",true,""],
  ["静水圧が膠質浸透圧より大きい",false,"細動脈側の状態で、濾過が起こる。"],
  ["晶質浸透圧の差が大きくなる",false,"晶質は血管内外を移動して平衡に達するため、差は生じにくい。"],
  ["リンパ管が組織液を押し戻す",false,"リンパは静脈角から静脈に入る経路で、毛細血管へ押し戻すものではない。"]],
 exp:"細静脈側では毛細血管圧が下がり、<b>静水圧が膠質浸透圧より小さくなる</b>ため、組織液が再吸収される。（教科書 P149）"},

{q:"限外濾過について誤っているのはどれか。",gori:true,
 choices:[
  ["細動脈側では膠質浸透圧が静水圧より大きい",true,""],
  ["低分子物質は水とともに毛細血管壁の孔を通過する",false,"教科書どおりの記述なので、正しい。"],
  ["静水圧は毛細血管圧と組織圧の差である",false,"教科書どおりの記述なので、正しい。"],
  ["濾過された体液の一部は、リンパ系を通って血管内へ戻る",false,"教科書どおりの記述なので、正しい。"]],
 exp:"細動脈側では<b>静水圧が膠質浸透圧より大きい</b>ため、濾過が生じる。（教科書 P149）"},

/* ---------- B-4 容量血管（P150〜151） ---------- */

{q:"静脈が多量の血液を保持できる理由はどれか。",kihon:true,
 choices:[
  ["壁が薄く、伸展性がよい",true,""],
  ["中膜に弾力のある線維が多い",false,"大動脈の壁の特徴。"],
  ["中膜に平滑筋が発達している",false,"細動脈の壁の特徴。"],
  ["壁が1層の内皮細胞と基底膜からなる",false,"毛細血管の壁の特徴。"]],
 exp:"静脈壁は動脈壁に比べて<b>薄く、伸展性がよい</b>ため、多量の血液を保持できる。（教科書 P150、図10・11）"},

{q:"静脈系が保持している血液は、循環血液量のおよそどのくらいか。",kihon:true,dobon:true,
 choices:[
  ["60〜75％",true,""],
  ["5〜10％",false,"静脈系が保持する量よりはるかに少ない。"],
  ["20〜30％",false,"静脈系が保持する量よりかなり少ない。"],
  ["90％以上",false,"動脈系や心臓にも血液はあるので、静脈系だけでここまで多くはない。"]],
 exp:"静脈系は容量血管と呼ばれ、循環血液量の<b>60〜75％</b>を保持している。（教科書 P150）"},

{q:"静脈系が最終的につながる部位はどれか。",
 choices:[
  ["右心房",true,""],
  ["左心房",false,"肺静脈から動脈血が戻る部位。"],
  ["右心室",false,"三尖弁の先にあり、肺動脈へ血液を送り出す部位。"],
  ["左心室",false,"大動脈へ血液を送り出す部位。"]],
 exp:"静脈系は細静脈、中静脈、大静脈となり、最終的に<b>右心房</b>につながる。（教科書 P150）"},

{q:"動脈と比べた静脈壁の特徴はどれか。",
 choices:[
  ["中膜が薄く、弾性線維が少ない",true,""],
  ["中膜が厚く、弾性線維が多い",false,"大動脈の壁の特徴。"],
  ["内膜・中膜・外膜の区別がない",false,"静脈も動脈と同様に3層からなる。"],
  ["平滑筋をもたない",false,"静脈の中膜には平滑筋があり、交感神経の支配を受ける。"]],
 exp:"静脈は動脈と同様に3層からなるが、高い圧を受けないので<b>中膜が薄く弾性線維が少ない</b>。（教科書 P150）"},

{q:"静脈内の血液量が増えはじめたときの内圧の変化はどれか。",
 choices:[
  ["上昇は少ない",true,""],
  ["急激に上昇する",false,"静脈壁が伸展しきってから起こる変化。"],
  ["低下する",false,"血液量が増えて内圧が下がることはない。"],
  ["大動脈と同じ程度まで上昇する",false,"静脈は高い圧を受けない血管。"]],
 exp:"血液が少ないと静脈の断面は扁平で、増えると楕円から円形に変わるが、<b>内圧の上昇は少ない</b>。さらに増えると壁が伸展して内圧が上がる。（教科書 P150、図10・11）"},

{q:"中静脈の内膜に発達し、血液を心臓側へ流すのはどれか。",kihon:true,
 choices:[
  ["静脈弁",true,""],
  ["血管括約筋",false,"細動脈にあり、血管径を調節する。"],
  ["房室弁",false,"心房と心室の間にある弁。"],
  ["大動脈弁",false,"左心室と大動脈の間にある弁。"]],
 exp:"中静脈の内膜には<b>静脈弁</b>が発達しており、血液が心臓側に流れるようにはたらく。（教科書 P150）"},

{q:"交感神経活動が増加したときの静脈の変化はどれか。",
 choices:[
  ["静脈内容量が減少し、静脈還流量が増加する",true,""],
  ["静脈内容量が増加し、静脈還流量が減少する",false,"交感神経活動とは逆向きの変化。"],
  ["静脈壁の緊張が低下する",false,"交感神経活動の増加では緊張は増す。"],
  ["静脈弁が開かなくなる",false,"静脈弁は交感神経で開閉するものではない。"]],
 exp:"静脈中膜の平滑筋は交感神経の支配を受ける。活動が増すと静脈壁の緊張が増し、<b>静脈内容量が減って還流量が増える</b>。（教科書 P150）"},

{q:"「第二の心臓」と呼ばれるのはどれか。",kihon:true,dobon:true,
 choices:[
  ["筋肉のポンプ作用",true,""],
  ["呼吸のポンプ作用",false,"胸腔内圧と腹腔内圧の変化で静脈還流を促すしくみ。"],
  ["大動脈壁の弾性",false,"拡張期にも血液を末梢へ送るしくみ。"],
  ["能動的リンパ輸送",false,"リンパ管自身が収縮してリンパを送るしくみ。"]],
 exp:"筋の収縮で静脈が圧迫されると、血液は中枢側へ押し出され、静脈弁があるため逆流しない。運動時の還流量の増加は非常に大きく、<b>筋肉のポンプ作用</b>は「第二の心臓」と呼ばれる。（教科書 P150、図10・12）"},

{q:"吸息時の変化はどれか。",kihon:true,
 choices:[
  ["胸腔内圧は低下し、腹腔内圧は上昇する",true,""],
  ["胸腔内圧は上昇し、腹腔内圧は低下する",false,"両方の向きが逆。"],

let mode="normal", drawn=[], idx=0, score=0, streak=0, answered=false, dead=false;
let qmiss=0, totalMiss=0, firstTryCount=0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function home(){
  document.getElementById("htt").textContent="確認テスト";
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="0";
  document.getElementById("bd").innerHTML=`
    <div class="center">
      <p class="lead">モードを選んでスタート。<br>問題は毎回シャッフルされ、プール${POOL.length}問から${PICK}問が出題されます。</p>
      <div class="modes">
        <button class="mode" onclick="start('normal')">
          <div class="nm">通常モード</div>
          <div class="ds">${PICK}問を最後まで解いて採点します。ふだんの確認用。<span class="mark kihon" style="margin-left:4px">🎯基本</span> は落としちゃダメな基本問題、<span class="mark gori">⚠ 誤りを選ぶ</span> は誤っているものを選ぶ問題、<span class="mark hosoku">📘 補足（資料外）</span> は教科書の外から入れた国試頻出の知識。</div>
        </button>
        <button class="mode dob" onclick="start('dobon')">
          <div class="nm">💣 ドボンチャレンジ</div>
          <div class="ds">プールの中のごく一部、<b>絶対に落とせない最重要問題</b>だけが <b>💣ドボン！</b> に変身。それを外したらそこで終了。どこまで正解を続けられるか挑戦！</div>
        </button>
      </div>
    </div>`;
  document.getElementById("ctrl").innerHTML="";
}
function start(m){
  mode=m; drawn=shuffle(POOL).slice(0,Math.min(PICK,POOL.length));
  idx=0;score=0;streak=0;dead=false;totalMiss=0;firstTryCount=0;render();
}
function render(){
  answered=false; qmiss=0;
  const item=drawn[idx];
  const opts=shuffle(item.choices);
  const isDob=(mode==="dobon" && item.dobon);
  document.getElementById("htt").textContent=(mode==="dobon")?"ドボンチャレンジ":"確認テスト";
  document.getElementById("pg").textContent=`問 ${idx+1} / ${drawn.length}`;
  document.getElementById("bar").style.width=(idx/drawn.length*100)+"%";
  const L=["ア","イ","ウ","エ","オ"];
  let markHtml = isDob ? `<span class="mark dobon">💣 ドボン！</span>`
                       : (item.kihon ? `<span class="mark kihon">🎯 基本</span>` : "");
  if(item.gori)   markHtml += `<span class="mark gori">⚠ 誤りを選ぶ</span>`;
  if(item.hosoku) markHtml += `<span class="mark hosoku">📘 補足（資料外）</span>`;
  const qText = item.gori ? item.q.replace("誤っている",'<span class="ng">誤っている</span>') : item.q;
  let h=`<div class="qnum">Q${idx+1} ${markHtml}</div><div class="q">${qText}</div><div class="opts">`;
  opts.forEach((o,i)=>{h+=`<button class="opt" onclick="pick(this,${o[1]})"><span class="mk">${L[i]}</span><span>${o[0]}</span></button>`;});
  h+=`</div><div class="exp" id="exp"><div class="vd" id="vd"></div><div class="tx" id="tx"></div></div>`;
  document.getElementById("bd").innerHTML=h;
  document.getElementById("ctrl").innerHTML=`<button class="btn" id="nx" onclick="next()" disabled>解答を選んでください</button>`;
}
function pick(el,ok){
  if(answered)return;
  if(el.classList.contains("dis"))return;
  const item=drawn[idx];
  const isDob=(mode==="dobon" && item.dobon);
  const selText=el.querySelector("span:last-child").textContent;
  const selChoice=item.choices.find(c=>c[0]===selText);
  const exp=document.getElementById("exp");
  const nx=document.getElementById("nx");

  if(ok){
    answered=true;
    el.classList.add("correct");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    score++;
    if(mode!=="dobon"){ if(qmiss===0) firstTryCount++; }
    if(mode==="dobon") streak++;
    exp.className="exp show ok";
    document.getElementById("vd").textContent=(qmiss===0)?"正解！":"正解！（"+qmiss+"回目で正解）";
    document.getElementById("tx").innerHTML=item.exp;
    nx.disabled=false;
    nx.textContent=(idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶";
    return;
  }

  if(mode==="dobon"){
    answered=true;
    el.classList.add("wrong");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    if(item.dobon){ dead=true; }
    exp.className="exp show ng";
    document.getElementById("vd").textContent=isDob?"💣 ドボン！":"不正解";
    document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}`;
    nx.disabled=false;
    nx.textContent=dead?"結果を見る（ドボン）▶":((idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶");
    return;
  }

  qmiss++; totalMiss++;
  el.classList.add("wrong","dis");
  exp.className="exp show ng";
  document.getElementById("vd").textContent="不正解（ミス "+qmiss+"回）";
  document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}<br>ほかの選択肢からもう一度選んでください。`;
}
function next(){
  if(dead){result();return;}
  if(idx+1<drawn.length){idx++;render();}
  else result();
}
function result(){
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="100%";
  if(mode==="dobon"){
    document.getElementById("htt").textContent="結果";
    if(dead){
      document.getElementById("bd").innerHTML=`<div class="center score dead">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>ドボンを踏んでしまいました</div>
        <div class="big">${streak} 問連続正解</div>
        <div class="msg">${idx}問正解のあと、${idx+1}問目でドボン。<br>上の解説を復習して再挑戦しましょう。</div>
      </div>`;
    }else{
      document.getElementById("bd").innerHTML=`<div class="center score">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>クリア！</div>
        <div class="big">${score} / ${drawn.length}</div>
        <div class="msg">ドボンを踏まず完走しました。お見事！</div>
      </div>`;
    }
  }else{
    document.getElementById("htt").textContent="結果";
    const n=drawn.length;
    const ftPct=Math.round(firstTryCount/n*100);
    const noMiss=(totalMiss===0);
    let head = noMiss
      ? `<div class="big">✨ ノーミス パーフェクト！</div><div>全 ${n} 問を一発で正解</div>`
      : `<div>今回の成績</div><div class="big">${firstTryCount} / ${n}</div><div>一発正解率 ${ftPct}%</div>`;
    let stat = `<div class="stats">一発正解 ${firstTryCount}問　｜　総ミス ${totalMiss}回</div>`;
    let msg = noMiss?"完璧です。この調子！":ftPct>=60?"よくできました。ミスした問題を復習しましょう。":"もう一度スライドで確認してから挑戦しましょう。";
    document.getElementById("bd").innerHTML=`<div class="center score">${head}${stat}<div class="msg">${msg}</div></div>`;
  }
  document.getElementById("ctrl").innerHTML=`<button class="btn sub" onclick="home()">モード選択へ</button><button class="btn" onclick="start(mode)">もう一度（シャッフル）▶</button>`;
}
home();
</script>
</body>
</html>
