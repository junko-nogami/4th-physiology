<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第11章 呼吸の生理 パートC｜生理学スライド</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:#f0f2f5;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 12px}
h1{font-size:14px;color:#555;margin-bottom:16px;font-weight:400;letter-spacing:.05em}
.slide{width:100%;max-width:820px;background:#fff;border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,.10);overflow:hidden}
.hd{background:#0f766e;padding:14px 28px}
.hd .ch{font-size:11px;color:#cdeee9;font-weight:500;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.hd .tt{font-size:20px;font-weight:500;color:#fff}
.bd{padding:20px 28px 16px;background:#fff}
.sec{font-size:10px;font-weight:600;color:#888;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.box{background:#f8f9fb;border:1px solid #e5e7eb;border-radius:8px;padding:14px 18px;margin-bottom:12px}
.row{display:block;font-size:14px;line-height:1.9;color:#222;padding:5px 0;border-bottom:1px solid #e5e7eb}
.row:last-child{border-bottom:none}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#0f766e;color:#fff;padding:8px 10px;font-weight:500;text-align:left;font-size:12px}
.tbl td{padding:8px 10px;border-bottom:1px solid #e5e7eb;vertical-align:top;color:#222;line-height:1.7}
.tbl tr:last-child td{border-bottom:none}
.tbl td:first-child{font-weight:600;color:#0f766e;white-space:nowrap;min-width:110px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.two{grid-template-columns:1fr}.tbl td:first-child{white-space:normal;min-width:80px}}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:4px;margin-bottom:7px}
.tf{background:rgba(15,118,110,.12);color:#0f766e}
.tb{background:rgba(17,94,89,.12);color:#115e59}
.sup{display:inline-block;font-size:10.5px;font-weight:600;color:#fff;background:#8a8f98;border-radius:3px;padding:0 6px;margin-right:6px;vertical-align:1px}
.note{font-size:11.5px;color:#777}
.em{font-weight:700;color:#0f766e}
.blank{display:inline-block;min-width:72px;border-bottom:2.5px solid #0f766e;border-radius:3px 3px 0 0;cursor:pointer;text-align:center;padding:0 5px;transition:all .22s;position:relative;vertical-align:baseline}
.blank::after{content:"？";font-size:12px;color:#0f766e;opacity:.45;position:absolute;left:50%;transform:translateX(-50%)}
.blank span{visibility:hidden;font-weight:600;color:#0f766e;font-size:14px;opacity:0;transition:opacity .22s;display:inline-block}
.blank.on{border-bottom-color:transparent;background:rgba(15,118,110,.1);border-radius:4px;padding:1px 7px}
.blank.on::after{display:none}
.blank.on span{visibility:visible;opacity:1}
.blank:not(.on):hover{background:rgba(15,118,110,.07)}
.ctrl{display:flex;align-items:center;gap:8px;padding:10px 28px 12px;background:#f8f9fb;border-top:1px solid #e5e7eb;flex-wrap:wrap}
.btn{padding:7px 15px;border-radius:6px;border:1px solid #d1d5db;background:#fff;color:#333;font-size:12px;cursor:pointer;font-family:inherit;transition:background .15s}
.btn:hover{background:#f0f2f5}
.btnp{background:#0f766e;color:#fff;border-color:#0f766e}
.btnp:hover{background:#0b5a54}
.cnt{font-size:11px;color:#888;margin-left:auto}
.nav{display:flex;align-items:center;gap:7px;padding:9px 28px 11px;background:#f8f9fb;border-top:1px solid #e5e7eb;border-radius:0 0 12px 12px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:#d1d5db;cursor:pointer;transition:background .18s;flex-shrink:0}
.dot.a{background:#0f766e}
.pg{font-size:11px;color:#888;margin-left:auto}
</style>
</head>
<body>
<h1>生理学 第11章 呼吸の生理｜パートC：ガス交換と運搬</h1>
<div class="slide">
  <div id="sc"></div>
  <div class="ctrl">
    <button class="btn" onclick="nextBlank()">次のカッコを開く ▶</button>
    <button class="btn" onclick="showAll()">すべて表示</button>
    <button class="btn" onclick="resetAll()">リセット</button>
    <button class="btn btnp" onclick="go(cur-1)">◀ 前へ</button>
    <button class="btn btnp" onclick="go(cur+1)">次へ ▶</button>
    <span class="cnt" id="cnt"></span>
  </div>
  <div class="nav" id="nav"></div>
</div>
<script>
const SUP="<span class='sup'>補足知識（資料外）</span>";
const S=[
{t:"分圧とヘンリーの法則",ch:"第11章 呼吸の生理 ｜ C-1-a 分圧とは",type:"p",
rows:[
"大気には，酸素，二酸化炭素，窒素などさまざまな気体が混ざり合っている．そのうち1つの成分の圧力を [分圧] と呼ぶ．",
"分圧は，その気体が大気圧と同じ体積を占めると仮定して求める．",
"例：酸素分圧 ＝ 大気圧 [760.0 mmHg] × 酸素の割合 [21%] ＝ 約 [158.0 mmHg]",
"液体に溶け込む気体の量は，その気体の [分圧] に比例する．これを [ヘンリーの法則] と呼ぶ．",
"ある程度以上溶け込むとそれ以上溶け込まず，液体中のガス分圧は気体中のガス分圧と [等しく] なる．これを「[平衡状態] に達する」という．",
"液体中に溶け込んでいる気体の量は，この [分圧] の値で表す．",
]},
{t:"肺でのガス交換",ch:"第11章 呼吸の生理 ｜ C-1-b ガス交換",type:"p",
rows:[
"大気（大気圧760.0 mmHg，水蒸気圧5.7 mmHg）の分圧：酸素 [158.0 mmHg]，二酸化炭素 [0.3 mmHg]，窒素 596.0 mmHg（図11・6）．",
"吸気は気道内で約 [37℃] に温められ，水蒸気で飽和されて水蒸気圧 [47 mmHg] となって肺胞に入る．",
"肺胞内のガスは，右心室から肺へ運ばれてきた静脈血と比べると，酸素分圧が [高く]，二酸化炭素分圧が [低い]．",
"この分圧差により，酸素は [肺胞内から血液中] へ，二酸化炭素は [血液中から肺胞内] へ [拡散] する（図11・7）．",
"その結果，肺胞内では酸素分圧が [100 mmHg]，二酸化炭素分圧が [40 mmHg] とほぼ一定に保たれる．",
"肺胞内にある適度な [残気] は，呼吸による肺胞内ガス組成の急激な変化を防いでいる．",
]},
{t:"各部位のガス分圧",ch:"第11章 呼吸の生理 ｜ C-1-b ガス交換（図11・6）",type:"tbl",
cols:["部位","酸素分圧","二酸化炭素分圧"],
rows:[
["大気（吸気）","[158 mmHg]","[0.3 mmHg]"],
["肺胞気","[100 mmHg]","[40 mmHg]"],
["動脈血","約95〜97 mmHg <span class='sup'>補足</span>","[40 mmHg] <span class='sup'>補足</span>"],
["静脈血","[40 mmHg]","[46 mmHg] <span class='sup'>補足</span>"],
["覚え方","酸素分圧は 大気 ＞ 肺胞気 ＞ [動脈血] ＞ [静脈血] の順．二酸化炭素分圧は [大気] が最も低い","<span class='note'>"+SUP+"肺静脈には肺でガス交換を終えた [動脈血] が流れる</span>"],
]},
{t:"酸素の運搬と酸素飽和度",ch:"第11章 呼吸の生理 ｜ C-2-a 酸素の運搬",type:"p",
rows:[
"血液中の酸素の大部分は，[ヘモグロビン] が酸素と結合した [化学的溶解] によるものである（8章「血液」参照）．",
"ヘンリーの法則に従って血液中に [物理的] に溶解している酸素は，そのうちのわずかである．",
"ヘモグロビンが組織へ運ぶ酸素量は，[酸素解離曲線] でとらえられる（図11・8）．",
"血液中のすべてのヘモグロビンのうち，酸素と結合しているヘモグロビンの割合を [酸素飽和度] と呼ぶ．",
"酸素飽和度が高いほど [オキシヘモグロビン]（酸素化ヘモグロビン）が多く，低いほど [デオキシヘモグロビン]（脱酸素化ヘモグロビン）が多い．",
]},
{t:"酸素解離曲線",ch:"第11章 呼吸の生理 ｜ C-2-a 酸素の運搬（図11・8）",type:"p",
rows:[
"酸素分圧と，そのとき平衡状態となったヘモグロビンの [酸素飽和度] との関係を示したものが酸素解離曲線である．",
"肺胞内の酸素分圧は約 [100 mmHg] なので，肺から出る動脈血の酸素飽和度は [100%] 近くになる．",
"組織から戻ってきた混合静脈血は酸素分圧が [40 mmHg] 程度なので，酸素飽和度は約 [75%] となる．",
"血液100 mL中のヘモグロビンを約 [15 g] とすると，1 gのヘモグロビンは [1.34 mL] の酸素を結合できる．",
"血液100 mL中の酸素含有量は，動脈血で約 [20 mL]，静脈血で約 [14 mL] となる．",
"この差の約 [6 mL] が，ヘモグロビンから解離して [組織] へ供給された酸素量となる．",
]},
{t:"酸素を解離しやすくする因子①",ch:"第11章 呼吸の生理 ｜ C-2-a ヘモグロビンから酸素を解離しやすくする因子",type:"p",
rows:[
"ヘモグロビンは，[酸素分圧の低下]，[温度の上昇]，[pHの低下] などの要因があると，結合している酸素を解離しやすくなる．",
"【酸素分圧の低下】酸素分圧が [40 mmHg] 以下になると，酸素飽和度は [急激] に減少する（図11・8）．",
"つまり，その組織では酸素分圧がわずかに低下するだけで，[大量] の酸素がヘモグロビンから離れる．",
"【温度の上昇】血液の温度が高くなるほど，酸素解離曲線は [右下方] へシフトする（図11・9）．",
"つまり，体温が高くなる [代謝] の盛んな組織では，同じ酸素分圧でもヘモグロビンから酸素が解離しやすい．",
]},
{t:"酸素を解離しやすくする因子②",ch:"第11章 呼吸の生理 ｜ C-2-a ヘモグロビンから酸素を解離しやすくする因子",type:"p",
rows:[
"【pHの低下】pHが低くなるほど，酸素解離曲線は [右下方] へシフトする（図11・9）．",
"pHが低くなるほどヘモグロビンが酸素を解離しやすくなることを [ボーア効果] と呼ぶ．",
"例：運動時の筋では，代謝がさかんになって [温度] が上がるほか，[二酸化炭素] や [乳酸] が産生されるためpHが下がる．このとき，効率よく酸素を [筋] へ供給するために，ボーア効果は有利にはたらく．",
"【2,3-DPGの増加】[貧血] や [低酸素状態] が続くと，[赤血球] で [2,3-ジホスホグリセリン酸]（DPG）が産生される．",
"DPGは酸素と [競合] してヘモグロビンと結合する性質をもち，ヘモグロビンからの酸素の解離を [促進] する．",
]},
{t:"右方シフトの4要因",ch:"第11章 呼吸の生理 ｜ C-2-a 酸素解離曲線のシフト",type:"two",
left:{label:"右方（右下方）シフト＝酸素を離しやすい",rows:[
"① [二酸化炭素分圧] の上昇",
"② [pH] の低下（アシドーシス）",
"③ [体温] の上昇",
"④ [2,3-DPG] の増加",
"→ ヘモグロビンの酸素親和性が [低下] し，組織へ酸素を渡しやすい．",
]},
right:{label:"左方シフト＝酸素と結合しやすい",rows:[
"① 二酸化炭素分圧の [低下]",
"② pHの [上昇]（アルカローシス）",
"③ 体温の [低下]",
"④ 2,3-DPGの [減少]",
"→ ヘモグロビンの酸素親和性が [上昇] する．",
]}},
{t:"二酸化炭素の運搬：組織から血液へ",ch:"第11章 呼吸の生理 ｜ C-2-b 二酸化炭素の運搬",type:"p",
rows:[
"組織から血液中に溶解した二酸化炭素のほとんどは，[重炭酸イオン]（HCO₃⁻）として速やかに溶解する．",
"二酸化炭素は，赤血球中の [炭酸脱水酵素] のはたらきで [炭酸]（H₂CO₃）となる．",
"炭酸は [水素イオン]（H⁺）と重炭酸イオンに解離し，重炭酸イオンが赤血球内から [血漿] 中へ拡散する（図11・10）．",
"炭酸から解離した水素イオンは [ヘモグロビン] と結合する．",
"[デオキシヘモグロビン] はオキシヘモグロビンよりも水素イオンと結合しやすいため，[静脈血] は動脈血よりも多くの二酸化炭素を溶解できる．",
SUP+"運搬される形の割合：重炭酸イオン 約 [70〜80%]，ヘモグロビンなどと結合した [カルバミノ化合物] 約10〜20%，物理的に溶解したもの 約10%．",
]},
{t:"二酸化炭素の排出とpHの維持",ch:"第11章 呼吸の生理 ｜ C-2-b 二酸化炭素の運搬",type:"p",
rows:[
"重炭酸イオンが肺胞の毛細血管まで運ばれると，組織での反応と [逆] の反応が起こり，重炭酸イオンが [二酸化炭素] となって体外へ排出される．",
"体内で産生された酸である水素イオンは，血中の [重炭酸イオン] と反応して [炭酸] となることで処理される．",
"こうして血液の [pH] が一定に保たれる．",
SUP+"血液の正常なpHは [7.35〜7.45]（7.4±0.05）．これより低い状態を [アシドーシス]，高い状態を [アルカローシス] という．",
]},
{t:"呼吸と酸塩基平衡",ch:"📘 補足知識（資料外） ｜ 酸塩基平衡",type:"two",
left:{label:"呼吸性（CO₂の変化による）",rows:[
"過換気：CO₂が過剰に吐き出される → [呼吸性アルカローシス]．",
"このとき代償として腎臓から [重炭酸イオン] の排泄が増える．",
"呼吸困難：CO₂の排出が不十分 → [呼吸性アシドーシス]．",
]},
right:{label:"代謝性（HCO₃⁻の変化による）",rows:[
"嘔吐：胃酸（塩酸）が失われる → [代謝性アルカローシス]．",
"糖尿病性ケトアシドーシスなど → [代謝性アシドーシス]．",
"代謝性アシドーシスでは，深く速い [クスマウル呼吸] がみられる（CO₂を吐き出してpHを戻そうとする）．",
]}},
{t:"パートCまとめ",ch:"第11章 呼吸の生理 ｜ パートCまとめ",type:"tbl",
cols:["項目","内容"],
rows:[
["ヘンリーの法則","液体に溶け込む気体の量は，その気体の [分圧] に比例する"],
["ガス交換","分圧差による [拡散]．肺胞気はO₂ [100 mmHg]・CO₂ [40 mmHg]"],
["酸素の運搬","大部分は [ヘモグロビン] と結合（化学的溶解）"],
["酸素飽和度","動脈血 ほぼ [100%]，混合静脈血 約 [75%]"],
["組織への供給","血液100 mL当たり約 [6 mL]"],
["右方シフト","CO₂分圧 [上昇]・pH [低下]・体温 [上昇]・2,3-DPG [増加]"],
["ボーア効果","[pH] が低いほど酸素を解離しやすい"],
["CO₂の運搬","ほとんどが [重炭酸イオン]（赤血球の [炭酸脱水酵素] がはたらく）"],
["pHの維持","水素イオンは [重炭酸イオン] と反応して処理される"],
]}
];
let cur=0,bs=[];
function bl(id,ans){return `<span class="blank" id="${id}" onclick="revealBlank('${id}')"><span>${ans}</span></span>`;}
function fill(t){
  t=t.replace(/\{\{([^{}]+)\}\}/g,(m,a)=>`<span class="em">${a}</span>`);
  return t.replace(/\[([^\[\]]+)\]/g,(m,a)=>{const id="b"+bs.length;bs.push({id,on:false});return bl(id,a);});
}
function buildSlide(i){
  const s=S[i];bs=[];
  let h=`<div class="hd"><div class="ch">${s.ch}</div><div class="tt">${s.t}</div></div><div class="bd">`;
  if(s.type==="p"){
    h+=`<div class="sec">重要事項</div><div class="box">`;
    s.rows.forEach(r=>{h+=`<span class="row">${fill(r)}</span>`;});
    h+=`</div>`;
  }else if(s.type==="tbl"){
    h+=`<div class="sec">重要事項</div><div class="box" style="padding:0;overflow:hidden"><table class="tbl"><thead><tr>`;
    s.cols.forEach(c=>h+=`<th>${c}</th>`);
    h+=`</tr></thead><tbody>`;
    s.rows.forEach(row=>{h+=`<tr>`;row.forEach(cell=>{h+=`<td>${fill(cell)}</td>`;});h+=`</tr>`;});
    h+=`</tbody></table></div>`;
  }else if(s.type==="two"){
    h+=`<div class="two">`;
    ["left","right"].forEach(side=>{
      const d=s[side];const tc=side==="left"?"tf":"tb";
      h+=`<div class="box"><span class="tag ${tc}">${d.label}</span>`;
      d.rows.forEach(r=>{h+=`<p style="font-size:13px;line-height:1.8;border-bottom:1px solid #e5e7eb;padding:4px 0">${fill(r)}</p>`;});
      h+=`</div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;
  document.getElementById("sc").innerHTML=h;
  upd();bldNav();
}
function revealBlank(id){const b=bs.find(x=>x.id===id);if(b&&!b.on){b.on=true;document.getElementById(id).classList.add("on");}upd();}
function nextBlank(){const u=bs.find(x=>!x.on);if(u){revealBlank(u.id);const el=document.getElementById(u.id);if(el)el.scrollIntoView({behavior:"smooth",block:"center"});}}
function showAll(){bs.forEach(b=>revealBlank(b.id));}
function resetAll(){bs.forEach(b=>{b.on=false;const el=document.getElementById(b.id);if(el)el.classList.remove("on");});upd();}
function upd(){const d=bs.filter(x=>x.on).length;document.getElementById("cnt").textContent=bs.length?d+"/"+bs.length+" 表示済み":"参照用スライド（カッコなし）";}
function go(i){if(i>=0&&i<S.length){cur=i;buildSlide(cur);}}
function bldNav(){
  let h="";
  S.forEach((_,i)=>h+=`<div class="dot${i===cur?" a":""}" onclick="go(${i})"></div>`);
  h+=`<span class="pg">${cur+1} / ${S.length}</span>`;
  document.getElementById("nav").innerHTML=h;
}
buildSlide(0);
</script>
</body>
</html>
