<script>
/* ===== 問題プール（教科書 第9章 P133〜136 ベース）=====
   範囲：A 骨の構造・B-1 骨の形成過程（スライド ch9_partA）
   2026年11月：骨のはたらき2問・骨幹端部・成長後の関節軟骨の4問を追加
   過去問（13章 骨）でパートAの範囲の出題は少ない（長管骨の成長と骨膜1回）。骨端線・骨化中心は柔整の骨折理解の基礎として🎯にした */
const PICK=5;
const GMAX={bunrui:1,soshiki:2,kozo:2,keisei:2,seicho:1};
const POOL=[

/* ---------- 骨のはたらき（P133） ---------- */

{q:"骨が担うはたらきはどれか。",kihon:true,
 choices:[
  ["造血",true,""],
  ["尿の生成",false,"腎臓のはたらき。"],
  ["インスリンの分泌",false,"膵臓のB細胞のはたらき。"],
  ["胆汁の生成",false,"肝臓のはたらき。"]],
 exp:"骨は人体を支え、臓器を保護するほか、カルシウム代謝や<b>造血</b>を担う。造血は、海綿骨の骨梁の間などを満たす<b>骨髄</b>で行われる（第8章）。（教科書 P133〜134）"},

{q:"骨が担うはたらきはどれか。",kihon:true,
 choices:[
  ["カルシウム代謝",true,""],
  ["血糖値の調節",false,"主に膵臓から分泌されるインスリンとグルカゴンが担う。"],
  ["体温の調節",false,"視床下部の体温調節中枢が担う。"],
  ["体液の浸透圧の調節",false,"主にバソプレシン（抗利尿ホルモン）と腎臓が担う。"]],
 exp:"骨はカルシウムを蓄えており、骨形成と骨吸収によって血中カルシウム濃度の調節に関わる（<b>カルシウム代謝</b>）。（教科書 P133・P136）"},

/* ---------- A-1 骨の分類（P133） ---------- */

{g:"bunrui",q:"扁平骨に分類されるのはどれか。",kihon:true,
 choices:[
  ["頭頂骨",true,""],
  ["橈骨",false,"前腕の親指側にある長い骨で、長管骨に分類される。"],
  ["月状骨",false,"手根骨の1つで、短骨に分類される。"],
  ["下顎骨",false,"下あごの骨で、形が不規則な不規則骨に分類される。"]],
 exp:"扁平骨は、頭の骨のように扁平な骨。<b>頭頂骨</b>は頭蓋をつくる扁平骨。（教科書 P133）"},

{g:"bunrui",q:"短骨に分類されるのはどれか。",
 choices:[
  ["有頭骨",true,""],
  ["尺骨",false,"前腕の小指側にある長い骨で、長管骨に分類される。"],
  ["肩甲骨",false,"背中の上部にある板状の骨で、扁平骨に分類される。"],
  ["蝶形骨",false,"頭蓋底にある蝶のような形の骨で、不規則骨に分類される。"]],
 exp:"短骨は、手根骨のように短い骨。<b>有頭骨</b>は手根骨の1つ。（教科書 P133）"},

{g:"bunrui",q:"不規則骨に分類されるのはどれか。",
 choices:[
  ["腰椎",true,""],
  ["腓骨",false,"下腿の外側にある長い骨で、長管骨に分類される。"],
  ["胸骨",false,"胸の前面中央にある板状の骨で、扁平骨に分類される。"],
  ["距骨",false,"足根骨の1つで、短骨に分類される。"]],
 exp:"不規則骨は、脊椎骨などの形が不規則な骨。<b>腰椎</b>は脊椎骨の1つ。（教科書 P133）"},

{g:"bunrui",q:"骨とその分類の組合せで正しいのはどれか。",
 choices:[
  ["上腕骨 ― 長管骨",true,""],
  ["肋骨 ― 短骨",false,"肋骨は弓状に曲がった板状の骨で、扁平骨に分類される。"],
  ["舟状骨 ― 扁平骨",false,"舟状骨は手根骨（または足根骨）の1つで、短骨に分類される。"],
  ["蝶形骨 ― 長管骨",false,"蝶形骨は頭蓋底にある形の不規則な骨で、不規則骨に分類される。"]],
 exp:"骨は長管骨・短骨・扁平骨・不規則骨に分類される。<b>上腕骨</b>は大腿骨と同じく長い骨なので<b>長管骨</b>。（教科書 P133）"},

/* ---------- A-2 骨組織の種類（P133〜134） ---------- */

{g:"soshiki",q:"皮質骨とも呼ばれる骨組織はどれか。",kihon:true,
 choices:[
  ["緻密骨",true,""],
  ["海綿骨",false,"骨梁が網目のように広がる、スポンジのような構造の骨組織。"],
  ["関節軟骨",false,"関節面を覆う軟骨で、骨組織ではない。"],
  ["骨膜",false,"関節面以外の骨の表面を覆う膜。骨芽細胞と破骨細胞が存在する。"]],
 exp:"<b>緻密骨</b>は皮質骨ともいう。骨質がぎっしりと詰まっていて、硬い外殻で覆われている。（教科書 P133〜134）"},

{g:"soshiki",q:"短骨や扁平骨の大部分を構成している骨組織はどれか。",kihon:true,
 choices:[
  ["海綿骨",true,""],
  ["緻密骨",false,"骨質がぎっしり詰まった硬い骨組織。長管骨の骨幹部を主に形成する。"],
  ["関節軟骨",false,"関節面を覆う軟骨で、骨組織ではない。"],
  ["骨膜",false,"関節面以外の骨の表面を覆う膜。骨芽細胞と破骨細胞が存在する。"]],
 exp:"<b>海綿骨</b>は短骨・扁平骨・不規則骨の大部分を構成する。細い柱に似た骨梁が網目のように広がる構造。（教科書 P134）"},

{g:"soshiki",q:"海綿骨の骨梁の間を満たしているのはどれか。",
 choices:[
  ["骨髄組織",true,""],
  ["関節液",false,"関節腔を満たす液体で、関節の動きをなめらかにする。"],
  ["硝子軟骨",false,"関節軟骨などをつくる軟骨組織。"],
  ["緻密骨",false,"骨質がぎっしり詰まった硬い骨組織で、海綿骨の外側を囲む。"]],
 exp:"骨梁の間は<b>骨髄組織</b>で満たされている。（教科書 P134）"},

{g:"soshiki",q:"海綿骨の骨梁について正しいのはどれか。",
 choices:[
  ["骨が受ける力に対抗するように並んでいる",true,""],
  ["方向をもたず、ばらばらに並んでいる",false,"骨梁の並びには、はっきりとした方向性がある。"],
  ["骨の長軸に対して直角にだけ並んでいる",false,"骨梁の向きは骨が受ける力の方向で決まり、長軸に直角とは限らない。"],
  ["成長が終わると消失する",false,"骨梁は成長後も残り、骨の強度を支え続ける。"]],
 exp:"骨梁は、<b>骨が受ける力に対抗するように並んで</b>骨の強度を維持している。（教科書 P134）"},

{g:"soshiki",q:"緻密骨について誤っているのはどれか。",gori:true,
 choices:[
  ["骨梁の間が骨髄組織で満たされている",true,""],
  ["骨質がぎっしりと詰まっている",false,"教科書どおりの記述なので、正しい。"],
  ["硬い外殻で覆われている",false,"教科書どおりの記述なので、正しい。"],
  ["長管骨の骨幹部を主に形成している",false,"教科書どおりの記述なので、正しい。"]],
 exp:"骨梁の間が骨髄組織で満たされているのは<b>海綿骨</b>。緻密骨は骨質がぎっしり詰まった硬い骨組織で、長管骨の骨幹部を主に形成する。（教科書 P134）"},

{g:"soshiki",q:"海綿骨について正しいのはどれか。",
 choices:[
  ["細い柱に似た骨梁が網目のように広がっている",true,""],
  ["骨質がぎっしりと詰まっている",false,"緻密骨の特徴。"],
  ["皮質骨ともいう",false,"緻密骨の別名。"],
  ["長管骨の骨幹部を主に形成している",false,"緻密骨の特徴。海綿骨は骨端部や短骨・扁平骨に多い。"]],
 exp:"海綿骨は、<b>細い柱に似た骨梁が網目のように広がる</b>、スポンジのような構造の骨組織。（教科書 P134）"},

/* ---------- A-3 長管骨の構造（P134） ---------- */

{g:"kozo",q:"長管骨で、骨端部と骨幹部の間にある部分はどれか。",kihon:true,
 choices:[
  ["骨幹端部",true,""],
  ["骨髄腔",false,"骨幹部の緻密骨の中にある空間。"],
  ["骨端核",false,"成長期に骨端部の軟骨に形成される二次骨化中心。"],
  ["関節軟骨",false,"関節面を覆う軟骨。"]],
 exp:"長管骨は骨端部・骨幹部と、その間にある<b>骨幹端部</b>で構成される。骨端部と骨幹端部の境界が骨端線。（教科書 P134、図9・2）"},

{g:"kozo",q:"長管骨で骨端線があるのはどこか。",kihon:true,
 choices:[
  ["骨端部と骨幹端部の境界",true,""],
  ["骨幹端部と骨幹部の境界",false,"骨幹端部と骨幹部の間は、骨端線のある位置ではない。"],
  ["骨幹部の中央",false,"骨幹部の中には骨髄腔があり、骨端線はない。"],
  ["関節面",false,"関節面は骨端部の表面で、骨端線とは別の位置。"]],
 exp:"骨端部と骨幹端部の境界線を<b>骨端線</b>という。なお骨幹端部と骨幹部との間には明瞭な境界線がない。（教科書 P134、図9・2）"},

{g:"kozo",q:"長管骨の関節面を覆っているのはどれか。",kihon:true,
 choices:[
  ["関節軟骨",true,""],
  ["骨膜",false,"関節面以外の骨の表面を覆う膜。"],
  ["成長軟骨",false,"成長期に骨を長く伸ばす軟骨で、関節面にはない。"],
  ["緻密骨",false,"骨質がぎっしり詰まった硬い骨組織で、関節面を覆ってはいない。"]],
 exp:"長管骨は、関節面が<b>関節軟骨</b>で、それ以外が骨膜で覆われている。（教科書 P136、図9・2）"},

{g:"kozo",q:"長管骨の構造について誤っているのはどれか。",gori:true,
 choices:[
  ["骨幹端部と骨幹部の間には明瞭な境界線がある",true,""],
  ["骨端部は末端部の太い部分である",false,"教科書どおりの記述なので、正しい。"],
  ["骨幹部は主に緻密骨で形成されている",false,"教科書どおりの記述なので、正しい。"],
  ["骨幹部の緻密骨の中には骨髄腔がある",false,"教科書どおりの記述なので、正しい。"]],
 exp:"骨幹端部と骨幹部との間には<b>明瞭な境界線がない</b>。（教科書 P134）"},

{g:"kozo",q:"成長軟骨の別名はどれか。",kihon:true,
 choices:[
  ["骨端軟骨",true,""],
  ["関節軟骨",false,"関節面を覆う軟骨。成長が終わっても残る。"],
  ["骨端核",false,"二次骨化中心とも呼ばれる、骨化が始まる部分。"],
  ["骨梁",false,"海綿骨をつくる細い柱状の構造。"]],
 exp:"骨端線は、成長期には成長軟骨（<b>骨端軟骨</b>ともいう）と呼ばれ、骨の成長に関与する。（教科書 P134）"},

{g:"keisei",q:"骨端線閉鎖とはどのような状態か。",kihon:true,dobon:true,
 choices:[
  ["成長が終わり、成長軟骨が消失した状態",true,""],
  ["骨端部の軟骨に骨端核が形成された状態",false,"二次骨化中心ができた段階で、成長はまだ続く。"],
  ["骨幹部だけが骨化している状態",false,"一次骨化中心の段階で、成長はまだ続く。"],
  ["関節軟骨がすり減って消失した状態",false,"関節軟骨の変性で、骨の成長の終わりとは関係がない。"]],
 exp:"成長が終わると成長軟骨は消失する。これを<b>骨端線閉鎖</b>という。（教科書 P134）"},

{g:"keisei",q:"骨端線閉鎖のあと、骨端線はどうなるか。",
 choices:[
  ["次第に不明瞭になり、板状の骨梁となる",true,""],
  ["関節軟骨に置き換わる",false,"関節軟骨は関節面を覆う軟骨で、骨端線とは別のもの。"],
  ["骨髄腔になる",false,"骨髄腔は骨幹部の緻密骨の中にある空間。"],
  ["再び成長軟骨に戻る",false,"消失した成長軟骨が再び現れることはない。"]],
 exp:"骨端線閉鎖の後、骨端線は<b>次第に不明瞭になり、板状の骨梁</b>となる。（教科書 P134）"},

/* ---------- B-1 骨の形成過程（P135） ---------- */

{g:"keisei",q:"胎生期の長管骨を形成しているのはどれか。",kihon:true,
 choices:[
  ["軟骨",true,""],
  ["緻密骨",false,"骨質がぎっしり詰まった硬い骨組織。骨化が進んでからできる。"],
  ["海綿骨",false,"骨梁からなる骨組織。骨化が進んでからできる。"],
  ["骨髄組織",false,"骨髄腔や骨梁の間を満たす組織。"]],
 exp:"胎生期の長管骨は<b>軟骨</b>で形成されている。（教科書 P135、図9・3）"},

{g:"keisei",q:"出生直後の大部分の長管骨で、骨化しているのはどこか。",kihon:true,
 choices:[
  ["骨幹部のみ",true,""],
  ["骨端部のみ",false,"骨端部の骨化は、もっと後の時期に始まる。"],
  ["骨端部と骨幹部の全体",false,"出生直後には、まだ軟骨のままの部分が残っている。"],

let mode="normal", drawn=[], idx=0, score=0, streak=0, answered=false, dead=false;
let qmiss=0, totalMiss=0, firstTryCount=0;
function draw(){const out=[],cnt={};for(const q of shuffle(POOL)){const g=q.g;if(g&&GMAX[g]!==undefined){if((cnt[g]||0)>=GMAX[g])continue;cnt[g]=(cnt[g]||0)+1;}out.push(q);if(out.length>=PICK)break;}return out;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function home(){
  document.getElementById("htt").textContent="確認テスト";
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="0";
  document.getElementById("bd").innerHTML=`
    <div class="center">
      <p class="lead">モードを選んでスタート。<br>問題は毎回シャッフルされ、プール${POOL.length}問から${PICK}問が出題されます。</p>
      <div class="modes">
        <button class="mode" onclick="start('normal')">
          <div class="nm">通常モード</div>
          <div class="ds">${PICK}問を最後まで解いて採点します。ふだんの確認用。<span class="mark kihon" style="margin-left:4px">🎯基本</span> は落としちゃダメな基本問題、<span class="mark gori">⚠ 誤りを選ぶ</span> は誤っているものを選ぶ問題、<span class="mark hosoku">📘 補足（資料外）</span> は教科書外の国試頻出テーマ。</div>
        </button>
        <button class="mode dob" onclick="start('dobon')">
          <div class="nm">💣 ドボンチャレンジ</div>
          <div class="ds">プールの中のごく一部、<b>絶対に落とせない最重要問題</b>だけが <b>💣ドボン！</b> に変身。それを外したらそこで終了。どこまで正解を続けられるか挑戦！</div>
        </button>
      </div>
    </div>`;
  document.getElementById("ctrl").innerHTML="";
}
function start(m){
  mode=m; drawn=draw();
  idx=0;score=0;streak=0;dead=false;totalMiss=0;firstTryCount=0;render();
}
function render(){
  answered=false; qmiss=0;
  const item=drawn[idx];
  const opts=shuffle(item.choices);
  const isDob=(mode==="dobon" && item.dobon);
  document.getElementById("htt").textContent=(mode==="dobon")?"ドボンチャレンジ":"確認テスト";
  document.getElementById("pg").textContent=`問 ${idx+1} / ${drawn.length}`;
  document.getElementById("bar").style.width=(idx/drawn.length*100)+"%";
  const L=["ア","イ","ウ","エ","オ"];
  let markHtml = isDob ? `<span class="mark dobon">💣 ドボン！</span>`
                       : (item.kihon ? `<span class="mark kihon">🎯 基本</span>` : "");
  if(item.gori)   markHtml += `<span class="mark gori">⚠ 誤りを選ぶ</span>`;
  if(item.hosoku) markHtml += `<span class="mark hosoku">📘 補足（資料外）</span>`;
  const qText = item.gori ? item.q.replace("誤っている",'<span class="ng">誤っている</span>') : item.q;
  let h=`<div class="qnum">Q${idx+1} ${markHtml}</div><div class="q">${qText}</div><div class="opts">`;
  opts.forEach((o,i)=>{h+=`<button class="opt" onclick="pick(this,${o[1]})"><span class="mk">${L[i]}</span><span>${o[0]}</span></button>`;});
  h+=`</div><div class="exp" id="exp"><div class="vd" id="vd"></div><div class="tx" id="tx"></div></div>`;
  document.getElementById("bd").innerHTML=h;
  document.getElementById("ctrl").innerHTML=`<button class="btn" id="nx" onclick="next()" disabled>解答を選んでください</button>`;
}
function pick(el,ok){
  if(answered)return;
  if(el.classList.contains("dis"))return;
  const item=drawn[idx];
  const isDob=(mode==="dobon" && item.dobon);
  const selText=el.querySelector("span:last-child").textContent;
  const selChoice=item.choices.find(c=>c[0]===selText);
  const exp=document.getElementById("exp");
  const nx=document.getElementById("nx");
  if(ok){
    answered=true;
    el.classList.add("correct");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    score++;
    if(mode!=="dobon"){ if(qmiss===0) firstTryCount++; }
    if(mode==="dobon") streak++;
    exp.className="exp show ok";
    document.getElementById("vd").textContent="正解！";
    document.getElementById("tx").innerHTML=item.exp;
    nx.disabled=false;
    nx.textContent=(idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶";
    return;
  }
  if(mode==="dobon"){
    answered=true;
    el.classList.add("wrong");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    if(item.dobon){ dead=true; }
    exp.className="exp show ng";
    document.getElementById("vd").textContent=isDob?"💣 ドボン！":"不正解";
    document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}`;
    nx.disabled=false;
    nx.textContent=dead?"結果を見る（ドボン）▶":((idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶");
    return;
  }
  qmiss++; totalMiss++;
  el.classList.add("wrong","dis");
  exp.className="exp show ng";
  document.getElementById("vd").textContent="不正解（ミス "+qmiss+"回）";
  document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}<br>ほかの選択肢からもう一度選んでください。`;
}
function next(){
  if(dead){result();return;}
  if(idx+1<drawn.length){idx++;render();}
  else result();
}
function result(){
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="100%";
  document.getElementById("htt").textContent="結果";
  if(mode==="dobon"){
    if(dead){
      document.getElementById("bd").innerHTML=`<div class="center score dead">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>ドボンを踏んでしまいました</div>
        <div class="big">${streak} 問連続正解</div>
        <div class="msg">${idx+1}問目でドボン。<br>上の解説を復習して再挑戦しましょう。</div>
      </div>`;
    }else{
      document.getElementById("bd").innerHTML=`<div class="center score">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>クリア！</div>
        <div class="big">${score} / ${drawn.length}</div>
        <div class="msg">ドボンを踏まず完走しました。お見事！</div>
      </div>`;
    }
  }else{
    const n=drawn.length;
    const ftPct=Math.round(firstTryCount/n*100);
    const noMiss=(totalMiss===0);
    let head = noMiss
      ? `<div class="big">✨ ノーミス パーフェクト！</div><div>全 ${n} 問を一発で正解</div>`
      : `<div>今回の成績</div><div class="big">${firstTryCount} / ${n}</div><div>一発正解率 ${ftPct}%</div>`;
    let stat = `<div class="stats">一発正解 ${firstTryCount}問　｜　総ミス ${totalMiss}回</div>`;
    let msg = noMiss?"完璧です。この調子！":ftPct>=60?"よくできました。ミスした問題を復習しましょう。":"もう一度スライドで確認してから挑戦しましょう。";
    document.getElementById("bd").innerHTML=`<div class="center score">${head}${stat}<div class="msg">${msg}</div></div>`;
  }
  document.getElementById("ctrl").innerHTML=`<button class="btn sub" onclick="home()">モード選択へ</button><button class="btn" onclick="start(mode)">もう一度（シャッフル）▶</button>`;
}
home();
</script>
