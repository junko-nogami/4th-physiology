<style>

<script>
/* ===== 問題プール（教科書 第3章 P37〜P42 ベース）=====
   choices: [表示文, 正解フラグ, その選択肢が何かの説明]
   kihon :true … 🎯基本。通常モードで「ここは重要」と示す印。プールの4〜6割が目安
   dobon :true … 💣ドボン。ドボンモードで外すと即終了。プールの15〜20%に絞る
   gori  :true … 「誤っているのはどれか」形式。true が付くのは「誤っている記述」＝選ぶべき選択肢
   hosoku:true … 教科書に記述のない補足知識。kihon とは併用しない
   exp … 正解時に見せる「なぜ正しいか」

   過去問（10章 神経／(5)自律神経）は神経の章で最大のセクション。出題頻度：
   効果器への作用10回以上／伝達物質5回以上／受容体4回／単独性支配3回／二重支配・拮抗性支配2回

   自律反射の3分類は3問あるが、同時出題で答えが割れないよう問い方を変えてある
   （例を選ぶ＝内臓-体性／内臓-内臓、求心路と遠心路の組合せ＝体性-内臓） */
const PICK=5;
const POOL=[

/* ---------- D-1 自律神経系とは ---------- */

{q:"自律神経系は何と呼ばれるか。",
 choices:[
  ["植物性神経",true,""],
  ["動物性神経",false,"運動や感覚に関与する体性神経系を指す言い方で、自律神経系の別名ではない。"],
  ["体性神経",false,"運動神経と感覚神経からなる末梢神経で、自律神経系とは別の系。"],
  ["高次神経",false,"思考や言語などの高次機能に関わる語で、自律神経系の別名ではない。"]],
 exp:"自律神経系のはたらきは生命維持の根幹を担うもので植物にもみられる。そこで<b>植物性神経</b>とも呼ばれる。（教科書 P37）"},

{q:"内臓機能の調節を担うシステムの組み合わせはどれか。",
 choices:[
  ["自律神経系と内分泌系",true,""],
  ["自律神経系と体性神経系",false,"体性神経系は運動と感覚を担う系で、内臓機能の調節システムではない。"],
  ["中枢神経系と末梢神経系",false,"神経系全体の構造上の区分であり、内臓機能の調節システムの組み合わせではない。"],
  ["交感神経系と副交感神経系",false,"どちらも自律神経系の内側の分類であり、もう一方のシステムが抜けている。"]],
 exp:"生体内外の環境変化に応じて臓器の状態をモニターしたり制御したりするシステムが<b>自律神経系</b>と<b>内分泌系</b>。どちらもホメオスタシスで重要な役割を果たす。（教科書 P37）"},

/* ---------- D-2 交感神経と副交感神経 ---------- */

{q:"多くの器官が交感神経と副交感神経の両方の支配を受けていることを何というか。",kihon:true,
 choices:[
  ["二重支配",true,""],
  ["拮抗性支配",false,"二重支配のうち、一方が促進性・他方が抑制性にはたらくものを指す語。"],
  ["単独性支配",false,"交感神経か副交感神経のいずれか一方のみで支配されることを指す語。"],
  ["持続性神経支配",false,"自律神経が常に活動し、器官が刺激を持続的に受けていることを指す語。"]],
 exp:"多くの器官は交感神経と副交感神経の両方の支配を受けている。これを<b>二重支配</b>と呼ぶ。作用が互いに反対かどうかは別の話（拮抗性支配）。（教科書 P37）"},

{q:"一方が促進性に、他方が抑制性にはたらく支配を何というか。",kihon:true,
 choices:[
  ["拮抗性支配",true,""],
  ["二重支配",false,"両方の神経の支配を受けていること自体を指す語で、作用の向きまでは含まない。"],
  ["単独性支配",false,"いずれか一方の神経のみで支配されることを指す語。"],
  ["持続性神経支配",false,"自律神経が常に活動していることを指す語。"]],
 exp:"心臓では交感神経が心拍数・収縮力を増加させる一方、副交感神経がそれらを減少させる。このような支配を<b>拮抗性支配</b>と呼ぶ。（教科書 P37）"},

{q:"交感神経と副交感神経の両方で促進されるため、拮抗性支配ではないのはどれか。",kihon:true,dobon:true,
 choices:[
  ["唾液腺",true,""],
  ["心臓",false,"交感神経で心拍数増加、副交感神経で減少と作用が反対の、典型的な拮抗性支配。"],
  ["気管支",false,"交感神経で弛緩、副交感神経で収縮と作用が反対の拮抗性支配。"],
  ["瞳孔",false,"交感神経で散大、副交感神経で縮小と作用が反対の拮抗性支配。"]],
 exp:"<b>唾液腺</b>のはたらきは交感神経と副交感神経の両方で促進されるため、拮抗性支配ではない。教科書が明記する例外。（教科書 P37、表3・3）"},

{q:"交感神経のみの支配（単独性支配）を受けるのはどれか。",kihon:true,dobon:true,
 choices:[
  ["立毛筋",true,""],
  ["心臓",false,"交感神経と副交感神経の両方の支配を受ける二重支配。"],
  ["小腸",false,"交感神経と副交感神経の両方の支配を受ける二重支配。"],
  ["瞳孔括約筋",false,"副交感神経の支配を受けて収縮し、縮瞳を起こす。"]],
 exp:"<b>副腎髄質・汗腺・皮膚血管・立毛筋</b>などは交感神経のみの支配を受ける。これを単独性支配と呼ぶ。（教科書 P37）"},

{q:"自律神経が運動神経と異なり常に活動しており、支配器官が刺激を持続的に受けていることを何というか。",
 choices:[
  ["持続性神経支配",true,""],
  ["二重支配",false,"両方の神経の支配を受けていることを指す語。"],
  ["拮抗性支配",false,"一方が促進性、他方が抑制性にはたらく支配を指す語。"],
  ["単独性支配",false,"いずれか一方の神経のみで支配されることを指す語。"]],
 exp:"自律神経は常に活動している。器官の活動状態は、交感神経と副交感神経の<b>どちらの活動が優位であるか</b>で決まる。（教科書 P37）"},

{q:"交感神経の興奮によって起こるのはどれか。",kihon:true,
 choices:[
  ["瞳孔散大筋の収縮（散瞳）",true,""],
  ["瞳孔括約筋の収縮（縮瞳）",false,"副交感神経（ムスカリン様受容体）の作用。"],
  ["気管支筋の収縮",false,"副交感神経の作用。交感神経では気管支筋は弛緩する。"],
  ["胃腸管の平滑筋収縮",false,"副交感神経の作用。交感神経では平滑筋は弛緩する。"]],
 exp:"交感神経（α受容体）は<b>瞳孔散大筋を収縮</b>させ、瞳孔は散大する。（表3・3、教科書 P38）"},

{q:"副交感神経の興奮によって起こるのはどれか。",kihon:true,
 choices:[
  ["気管支筋の収縮",true,""],
  ["気管支筋の弛緩",false,"交感神経（β受容体）の作用で、向きが逆。"],
  ["立毛筋の収縮",false,"立毛筋は交感神経のみの単独性支配。"],
  ["皮膚血管の収縮",false,"交感神経（α受容体）の作用。皮膚血管も交感神経の単独性支配。"]],
 exp:"気管支は交感神経（β受容体）で弛緩し、<b>副交感神経で収縮</b>する。（表3・3、教科書 P38）"},

{q:"交感神経の興奮によって心臓に起こるのはどれか。",
 choices:[
  ["心拍数の増加",true,""],
  ["心拍数の減少",false,"副交感神経の作用で、向きが逆。"],
  ["収縮力の減少",false,"副交感神経の作用。交感神経では収縮力は増加する。"],
  ["伝導速度の低下",false,"副交感神経の作用。交感神経では伝導速度は上昇する。"]],
 exp:"交感神経（β受容体）で心拍数増加・収縮力増加・伝導速度上昇。副交感神経ではいずれも逆になる。（表3・3、教科書 P38）"},

{q:"副交感神経の興奮によって膀胱に起こるのはどれか。",
 choices:[
  ["排尿筋の収縮",true,""],
  ["排尿筋の弛緩",false,"交感神経（β受容体）の作用で、蓄尿の方向。"],
  ["膀胱三角・括約筋の収縮",false,"交感神経（α受容体）の作用で、蓄尿の方向。"],
  ["尿の貯留",false,"交感神経優位のときに起こる状態。"]],
 exp:"副交感神経では<b>排尿筋が収縮</b>し、膀胱三角・括約筋が弛緩する（排尿）。交感神経ではその逆で蓄尿となる。（表3・3、教科書 P38）"},

{q:"交感神経のβ受容体を介して起こるのはどれか。",
 choices:[
  ["気管支筋の弛緩",true,""],
  ["皮膚血管の収縮",false,"α受容体を介する作用。"],
  ["立毛筋の収縮",false,"α受容体を介する作用。"],
  ["瞳孔散大筋の収縮",false,"α受容体を介する作用。"]],
 exp:"β受容体では気管支筋弛緩、心拍数増加、皮膚血管拡張、レニン分泌などが起こる。<b>収縮系はα、弛緩系はβ</b>が多いとおさえる（ただし心臓は例外的にβで促進）。（表3・3、教科書 P38）"},

/* ---------- D-3 自律神経系の構成 ---------- */

{q:"自律神経の節前神経と節後神経の境目となるのはどれか。",kihon:true,
 choices:[
  ["神経節",true,""],
  ["交感神経幹のみ",false,"交感神経の神経節の1つだが、自律神経全体の境目を表す語ではない。"],
  ["効果器",false,"命令を受け取る側であり、ニューロンが入れ替わる場所ではない。"],
  ["シナプス間隙",false,"シナプス前終末とシナプス後膜のあいだのすきまのこと。"]],
 exp:"自律神経は中枢神経から効果器へ至る間に、<b>神経節</b>（ニューロンの細胞体が集まった部分）でシナプスを介する。神経節より中枢側が節前神経、効果器側が節後神経。（教科書 P39）"},

{q:"交感神経の節前神経から放出される神経伝達物質はどれか。",kihon:true,
 choices:[
  ["アセチルコリン",true,""],
  ["ノルアドレナリン",false,"交感神経の節後神経から放出される伝達物質。"],
  ["アドレナリン",false,"副腎髄質から分泌されるホルモンで、節前神経の伝達物質ではない。"],
  ["ドパミン",false,"中枢神経系ではたらく伝達物質で、自律神経の節前神経の伝達物質ではない。"]],
 exp:"節前神経は<b>交感・副交感とも アセチルコリン</b>。ここは共通で、節後で分かれる。（教科書 P39）"},

{q:"交感神経の節後神経から放出される神経伝達物質はどれか。",kihon:true,dobon:true,
 choices:[
  ["ノルアドレナリン",true,""],
  ["アセチルコリン",false,"副交感神経の節後神経の伝達物質（交感神経では汗腺のみ例外）。"],
  ["セロトニン",false,"脳幹の縫線核で合成され大脳に広く分布する伝達物質で、自律神経系のものではない。"],
  ["ドパミン",false,"黒質線条体路や大脳辺縁系ではたらく伝達物質で、自律神経系のものではない。"]],
 exp:"交感神経の節後神経は<b>ノルアドレナリン</b>を放出する（汗腺に向かうものを除く）。（教科書 P39）"},

{q:"副交感神経の節後神経から放出される神経伝達物質はどれか。",kihon:true,dobon:true,
 choices:[
  ["アセチルコリン",true,""],
  ["ノルアドレナリン",false,"交感神経の節後神経の伝達物質。"],
  ["アドレナリン",false,"副腎髄質から分泌されるホルモン。"],
  ["GABA（γ-アミノ酪酸）",false,"脳や脊髄ではたらく抑制性伝達物質で、自律神経系のものではない。"]],
 exp:"副交感神経は<b>節前・節後とも アセチルコリン</b>。（教科書 P39）"},

{q:"交感神経系に属しながら、節後神経がアセチルコリンを放出するのはどれか。",kihon:true,dobon:true,
 choices:[
  ["汗腺",true,""],
  ["心臓",false,"交感神経の節後神経はノルアドレナリンを放出し、β受容体にはたらく。"],
  ["立毛筋",false,"交感神経の単独性支配だが、伝達物質はノルアドレナリンでα受容体にはたらく。"],
  ["副腎髄質",false,"節前線維が直接つながり、ニコチン様受容体をもつという別の例外。"]],
 exp:"<b>汗腺</b>に向かう節後神経は交感神経系に属するがアセチルコリンを放出する。教科書が明記する例外で、「コリン作動性の交感神経節後線維」として国試で繰り返し問われる。（教科書 P39）"},

{q:"神経節にあり、節前線維が放出したアセチルコリンが結合する受容体はどれか。",kihon:true,
 choices:[
  ["ニコチン受容体",true,""],
  ["ムスカリン受容体",false,"効果器の細胞にあり、節後線維が放出したアセチルコリンが結合する受容体。"],

  let markHtml = isDob ? `<span class="mark dobon">💣 ドボン！</span>`
                       : (item.kihon ? `<span class="mark kihon">🎯 基本</span>` : "");
  if(item.gori)   markHtml += `<span class="mark gori">⚠ 誤りを選ぶ</span>`;
  if(item.hosoku) markHtml += `<span class="mark hosoku">📘 補足（資料外）</span>`;
  // 誤り選択問題は、設問中の「誤っている」を赤字にして読み飛ばしを防ぐ
  const qText = item.gori ? item.q.replace("誤っている",'<span class="ng">誤っている</span>') : item.q;
  let h=`<div class="qnum">Q${idx+1} ${markHtml}</div><div class="q">${qText}</div><div class="opts">`;
  opts.forEach((o,i)=>{h+=`<button class="opt" onclick="pick(this,${o[1]})"><span class="mk">${L[i]}</span><span>${o[0]}</span></button>`;});
  h+=`</div><div class="exp" id="exp"><div class="vd" id="vd"></div><div class="tx" id="tx"></div></div>`;
  document.getElementById("bd").innerHTML=h;
  document.getElementById("ctrl").innerHTML=`<button class="btn" id="nx" onclick="next()" disabled>解答を選んでください</button>`;
}
function pick(el,ok){
  if(answered)return;
  if(el.classList.contains("dis"))return; // 無効化済みの選択肢は再カウントしない
  const item=drawn[idx];
  const isDob=(mode==="dobon" && item.dobon);
  const selText=el.querySelector("span:last-child").textContent;
  const selChoice=item.choices.find(c=>c[0]===selText);
  const exp=document.getElementById("exp");
  const nx=document.getElementById("nx");

  if(ok){
    // 正解：ここで確定。正解した選択肢だけ緑にする（不正解の選択肢は先に色を変えない）
    answered=true;
    el.classList.add("correct");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    score++;
    if(mode!=="dobon"){ if(qmiss===0) firstTryCount++; }
    if(mode==="dobon") streak++;
    exp.className="exp show ok";
    document.getElementById("vd").textContent=(qmiss===0)?"正解！":"正解！（"+qmiss+"回目で正解）";
    document.getElementById("tx").innerHTML=item.exp;
    nx.disabled=false;
    nx.textContent=(idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶";
    return;
  }

  // 不正解
  if(mode==="dobon"){
    // ドボンモードは一発勝負：選び直しなし・正解は伏せる
    answered=true;
    el.classList.add("wrong");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    if(item.dobon){ dead=true; } // 💣ドボン対象を外したときだけ終了
    exp.className="exp show ng";
    document.getElementById("vd").textContent=isDob?"💣 ドボン！":"不正解";
    document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}`;
    nx.disabled=false;
    nx.textContent=dead?"結果を見る（ドボン）▶":((idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶");
    return;
  }

  // 通常モード：ミスを数え、選んだ選択肢だけ赤にして無効化。正解は伏せたまま選び直せる
  qmiss++; totalMiss++;
  el.classList.add("wrong","dis");
  exp.className="exp show ng";
  document.getElementById("vd").textContent="不正解（ミス "+qmiss+"回）";
  document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}<br>ほかの選択肢からもう一度選んでください。`;
  // 「次へ」はまだ出さない（正解するまで進めない）
}
function next(){
  if(dead){result();return;}
  if(idx+1<drawn.length){idx++;render();}
  else result();
}
function result(){
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="100%";
  if(mode==="dobon"){
    document.getElementById("htt").textContent="結果";
    if(dead){
      document.getElementById("bd").innerHTML=`<div class="center score dead">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>ドボンを踏んでしまいました</div>
        <div class="big">${streak} 問連続正解</div>
        <div class="msg">${idx}問正解のあと、${idx+1}問目でドボン。<br>上の解説を復習して再挑戦しましょう。</div>
      </div>`;
    }else{
      document.getElementById("bd").innerHTML=`<div class="center score">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>クリア！</div>
        <div class="big">${score} / ${drawn.length}</div>
        <div class="msg">ドボンを踏まず完走しました。お見事！</div>
      </div>`;
    }
  }else{
    document.getElementById("htt").textContent="結果";
    const n=drawn.length;
    const ftPct=Math.round(firstTryCount/n*100);
    const noMiss=(totalMiss===0);
    let head = noMiss
      ? `<div class="big">✨ ノーミス パーフェクト！</div><div>全 ${n} 問を一発で正解</div>`
      : `<div>今回の成績</div><div class="big">${firstTryCount} / ${n}</div><div>一発正解率 ${ftPct}%</div>`;
    let stat = `<div class="stats">一発正解 ${firstTryCount}問　｜　総ミス ${totalMiss}回</div>`;
    let msg = noMiss?"完璧です。この調子！":ftPct>=60?"よくできました。ミスした問題を復習しましょう。":"もう一度スライドで確認してから挑戦しましょう。";
    document.getElementById("bd").innerHTML=`<div class="center score">${head}${stat}<div class="msg">${msg}</div></div>`;
  }
  document.getElementById("ctrl").innerHTML=`<button class="btn sub" onclick="home()">モード選択へ</button><button class="btn" onclick="start(mode)">もう一度（シャッフル）▶</button>`;
}
home();
</script>

</html>
