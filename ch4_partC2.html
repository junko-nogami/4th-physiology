<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第4章 運動の生理 パートC2｜生理学スライド</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:#f0f2f5;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 12px}
h1{font-size:14px;color:#555;margin-bottom:16px;font-weight:400;letter-spacing:.05em}
.slide{width:100%;max-width:820px;background:#fff;border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,.10);overflow:hidden}
.hd{background:#1e4d7b;padding:14px 28px}
.hd .ch{font-size:11px;color:#c4d9f0;font-weight:500;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.hd .tt{font-size:20px;font-weight:500;color:#fff}
.bd{padding:20px 28px 16px;background:#fff}
.sec{font-size:10px;font-weight:600;color:#888;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.box{background:#f8f9fb;border:1px solid #e5e7eb;border-radius:8px;padding:14px 18px;margin-bottom:12px}
.row{display:block;font-size:14px;line-height:1.9;color:#222;padding:5px 0;border-bottom:1px solid #e5e7eb}
.row:last-child{border-bottom:none}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#1e4d7b;color:#fff;padding:8px 10px;font-weight:500;text-align:left;font-size:12px}
.tbl td{padding:8px 10px;border-bottom:1px solid #e5e7eb;vertical-align:top;color:#222;line-height:1.7}
.tbl tr:last-child td{border-bottom:none}
.tbl td:first-child{font-weight:600;color:#1e4d7b;white-space:nowrap;min-width:110px}
.tbl.wide td:first-child{white-space:normal;min-width:88px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:4px;margin-bottom:7px}
.tf{background:rgba(30,77,123,.12);color:#1e4d7b}
.tb{background:rgba(26,92,122,.12);color:#1a5c7a}
.blank{display:inline-block;min-width:72px;border-bottom:2.5px solid #1e4d7b;border-radius:3px 3px 0 0;cursor:pointer;text-align:center;padding:0 5px;transition:all .22s;position:relative;vertical-align:baseline}
.blank::after{content:"？";font-size:12px;color:#1e4d7b;opacity:.45;position:absolute;left:50%;transform:translateX(-50%)}
.blank span{visibility:hidden;font-weight:600;color:#1e4d7b;font-size:14px;opacity:0;transition:opacity .22s;display:inline-block}
.blank.on{border-bottom-color:transparent;background:rgba(30,77,123,.1);border-radius:4px;padding:1px 7px}
.blank.on::after{display:none}
.blank.on span{visibility:visible;opacity:1}
.blank:not(.on):hover{background:rgba(30,77,123,.07)}
.ctrl{display:flex;align-items:center;gap:8px;padding:10px 28px 12px;background:#f8f9fb;border-top:1px solid #e5e7eb;flex-wrap:wrap}
.btn{padding:7px 15px;border-radius:6px;border:1px solid #d1d5db;background:#fff;color:#333;font-size:12px;cursor:pointer;font-family:inherit;transition:background .15s}
.btn:hover{background:#f0f2f5}
.btnp{background:#1e4d7b;color:#fff;border-color:#1e4d7b}
.btnp:hover{background:#163a5c}
.cnt{font-size:11px;color:#888;margin-left:auto}
.nav{display:flex;align-items:center;gap:7px;padding:9px 28px 11px;background:#f8f9fb;border-top:1px solid #e5e7eb;border-radius:0 0 12px 12px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:#d1d5db;cursor:pointer;transition:background .18s;flex-shrink:0}
.dot.a{background:#1e4d7b}
.pg{font-size:11px;color:#888;margin-left:auto}
</style>
</head>
<body>
<h1>生理学 第4章 運動の生理｜パートC2：誘発筋電図と複雑な反射</h1>
<div class="slide">
  <div id="sc"></div>
  <div class="ctrl">
    <button class="btn" onclick="nextBlank()">次のカッコを開く ▶</button>
    <button class="btn" onclick="showAll()">すべて表示</button>
    <button class="btn" onclick="resetAll()">リセット</button>
    <button class="btn btnp" onclick="go(cur-1)">◀ 前へ</button>
    <button class="btn btnp" onclick="go(cur+1)">次へ ▶</button>
    <span class="cnt" id="cnt"></span>
  </div>
  <div class="nav" id="nav"></div>
</div>
<script>
const S=[
{t:"誘発筋電図とは",ch:"第4章 運動の生理 ｜ C-3 誘発筋電図",type:"p",
rows:[
"[末梢神経] を刺激することで，[伸張反射] を模倣した [単シナプス反射] を誘発できる．",
"神経や筋をこのように刺激することで得られる筋電図を [誘発筋電図] と呼ぶ．",
"図4・7は [膝窩部] で [脛骨神経] を電気刺激し，強度を徐々に上げた場合の誘発筋電図である．",
"電気刺激をすると，もっとも [太い] [Ia群線維] が最初に刺激される．",
]},
{t:"H波とH反射",ch:"第4章 運動の生理 ｜ C-3 誘発筋電図",type:"p",
rows:[
"Ia群線維で起こった活動電位は，伸張反射と同様に [α運動ニューロン] を興奮させる．",
"筋電図上に [H波] と呼ばれる潜時の [長い] 誘発筋電図が表れる（①）．これを [H反射] と呼ぶ．",
"刺激強度を上げると，H波の振幅は [大きく] なる（②）．",
"しかし，ある強度まで電気刺激が高まるとH波の振幅は [減少] し始める（③）．",
"これは，強い電気刺激によってIa線維よりも [閾値が高い] [α運動ニューロンの軸索] も刺激されるためである．",
]},
{t:"M波の出現とH波の消失",ch:"第4章 運動の生理 ｜ C-3 誘発筋電図",type:"p",
rows:[
"この刺激により，筋に向かう活動電位と，正常では起こらない [脊髄へ逆行する] 活動電位が生じる．",
"このとき筋に向かう活動電位によって，潜時の [短い] [M波] が現れる（③）．",
"一方，逆行する活動電位は，α運動ニューロンを下行してきた [H波] を起こすはずの活動電位と [衝突] し，両者ともに [消失] してしまう．",
"M波は刺激が強くなるにつれて振幅が [大きく] なる．",
"電気刺激が強くなると，H波はやがて [完全に消失] してしまう（④）．",
]},
{t:"H波とM波の対比",ch:"第4章 運動の生理 ｜ C-3 誘発筋電図",type:"two",
left:{label:"H波（H反射）",rows:[
"刺激されるのは [Ia群線維]（もっとも太い）．",
"脊髄のα運動ニューロンを経由するため，潜時は [長い]．",
"刺激を強めると，はじめ振幅は大きくなるが，やがて [減少] し [消失] する．",
"[伸張反射] を電気刺激で模倣したもの．",
]},
right:{label:"M波",rows:[
"刺激されるのは [α運動ニューロンの軸索]（閾値が [高い]）．",
"筋へ直接向かう活動電位によるため，潜時は [短い]．",
"刺激が強くなるにつれて振幅は [大きく] なる．",
"脊髄へ [逆行] する活動電位がH波を消失させる．",
]}},
{t:"屈曲反射（引っ込め反射）",ch:"第4章 運動の生理 ｜ C-4-a 複雑な反射",type:"p",
rows:[
"画びょうを踏んで皮膚や筋に [侵害刺激] が加わると，その踏んだ足を引っ込める反射が起こる（図4・8）．これを [屈曲反射]（[引っ込め反射]）と呼ぶ．",
"[侵害受容器] で生まれた求心性信号は，脊髄内で [いくつかのニューロン] を介して [屈筋] を支配する運動ニューロンを [興奮] させる．",
"一方，[伸筋] を支配する運動ニューロンを [抑制] する．",
"この結果，屈筋が [緊張] する一方で伸筋は [弛緩] し，関節は [屈曲] する．",
]},
{t:"交叉性伸展反射",ch:"第4章 運動の生理 ｜ C-4-b 複雑な反射",type:"p",
rows:[
"画びょうを踏んだ足で屈曲反射が起こったとき，それだけではからだがそちらに傾いて [倒れて] しまう．",
"そこで [対側肢] が伸展し，さらに [体重] をそちらに移す反射が同時に起こる（図4・8）．これを [交叉性伸展反射] と呼ぶ．",
"交叉性伸展反射では，屈曲反射とは逆に，[屈筋] が弛緩し [伸筋] が収縮する．",
"これにより，侵害刺激を受けた側の肢が刺激から遠ざかるとき，[体を支える] ことができる．",
]},
{t:"筋性防御",ch:"第4章 運動の生理 ｜ C-4-c 複雑な反射",type:"p",
rows:[
"[腹腔内] の急性炎症などで [腹壁] が緊張して硬くなる反射である．",
"たとえば [急性虫垂炎] では [右下腹部] に筋性防御が現れる．",
"この現象は，炎症で刺激された [腹膜] と [同一の脊髄分節] の支配を受ける運動ニューロンが，腹壁で [反射的] に活動することで起こる．",
]},
{t:"パートC2まとめ",ch:"第4章 運動の生理 ｜ パートC2まとめ",type:"tbl",
cols:["項目","内容"],
rows:[
["誘発筋電図","[末梢神経] を刺激して得られる筋電図．[伸張反射] を模倣した [単シナプス反射] を誘発する"],
["刺激部位（図4・7）","[膝窩部] で [脛骨神経] を電気刺激"],
["最初に刺激される線維","もっとも太い [Ia群線維]"],
["H波（H反射）","[Ia群線維] → α運動ニューロン経由．潜時が [長い]．強すぎる刺激で [消失] する"],
["M波","[α運動ニューロンの軸索] が直接刺激されて生じる．潜時が [短い]．刺激が強いほど [大きく] なる"],
["H波が消える理由","[逆行性] の活動電位がH波を起こす活動電位と [衝突] して両者とも消失する"],
["屈曲反射","侵害刺激 → [屈筋] 興奮・[伸筋] 抑制 → 関節が [屈曲]．別名 [引っ込め反射]"],
["交叉性伸展反射","[対側肢] が伸展して体重を移す．屈筋が [弛緩]，伸筋が [収縮]"],
["筋性防御","腹腔内の急性炎症で [腹壁] が硬くなる．[急性虫垂炎] では [右下腹部]"],
]}
];
let cur=0,bs=[];
function bl(id,ans){return `<span class="blank" id="${id}" onclick="revealBlank('${id}')"><span>${ans}</span></span>`;}
function fill(t){return t.replace(/\[([^\[\]]+)\]/g,(m,a)=>{const id="b"+bs.length;bs.push({id,on:false});return bl(id,a);});}
function buildSlide(i){
  const s=S[i];bs=[];
  let h=`<div class="hd"><div class="ch">${s.ch}</div><div class="tt">${s.t}</div></div><div class="bd">`;
  if(s.type==="p"){
    h+=`<div class="sec">重要事項</div><div class="box">`;
    s.rows.forEach(r=>{h+=`<span class="row">${fill(r)}</span>`;});
    h+=`</div>`;
  }else if(s.type==="tbl"){
    h+=`<div class="sec">重要事項</div><div class="box" style="padding:0;overflow:hidden"><table class="tbl${s.cols.length>2?' wide':''}"><thead><tr>`;
    s.cols.forEach(c=>h+=`<th>${c}</th>`);
    h+=`</tr></thead><tbody>`;
    s.rows.forEach(row=>{h+=`<tr>`;row.forEach(cell=>{h+=`<td>${fill(cell)}</td>`;});h+=`</tr>`;});
    h+=`</tbody></table></div>`;
  }else if(s.type==="two"){
    h+=`<div class="two">`;
    ["left","right"].forEach(side=>{
      const d=s[side];const tc=side==="left"?"tf":"tb";
      h+=`<div class="box"><span class="tag ${tc}">${d.label}</span>`;
      d.rows.forEach(r=>{h+=`<p style="font-size:13px;line-height:1.8;border-bottom:1px solid #e5e7eb;padding:4px 0">${fill(r)}</p>`;});
      h+=`</div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;
  document.getElementById("sc").innerHTML=h;
  upd();bldNav();
}
function revealBlank(id){const b=bs.find(x=>x.id===id);if(b&&!b.on){b.on=true;document.getElementById(id).classList.add("on");}upd();}
function nextBlank(){const u=bs.find(x=>!x.on);if(u){revealBlank(u.id);const el=document.getElementById(u.id);if(el)el.scrollIntoView({behavior:"smooth",block:"center"});}}
function showAll(){bs.forEach(b=>revealBlank(b.id));}
function resetAll(){bs.forEach(b=>{b.on=false;const el=document.getElementById(b.id);if(el)el.classList.remove("on");});upd();}
function upd(){const d=bs.filter(x=>x.on).length;document.getElementById("cnt").textContent=d+"/"+bs.length+" 表示済み";}
function go(i){if(i>=0&&i<S.length){cur=i;buildSlide(cur);}}
function bldNav(){
  let h="";
  S.forEach((_,i)=>h+=`<div class="dot${i===cur?" a":""}" onclick="go(${i})"></div>`);
  h+=`<span class="pg">${cur+1} / ${S.length}</span>`;
  document.getElementById("nav").innerHTML=h;
}
buildSlide(0);
</script>
</body>
</html>
