<script>
/* ===== 問題プール（教科書 第6章 P93〜97 ベース）=====
   choices: [表示文, 正解フラグ, その選択肢が何かの説明]
   kihon :true … 🎯基本。通常モードで「ここは重要」と示す印。プールの4〜6割が目安
   dobon :true … 💣ドボン。ドボンモードで外すと即終了。プールの15〜20%に絞る
   （旧）kihon :true … 落としちゃダメな基本問題（🎯基本／ドボンモードでは💣ドボン！）
   gori  :true … 「誤っているのはどれか」形式。設問の上に ⚠ 誤りを選ぶ タグが出る
                  gori問題では、true が付くのは「誤っている記述」＝選ぶべき選択肢
   hosoku:true … 教科書に記述のない補足知識（国試過去問の頻出テーマ）。kihon とは併用しない
   exp … 正解時に見せる「なぜ正しいか」 */
const PICK=5;
const POOL=[

/* ---------- B-1 甲状腺 ---------- */

{q:"甲状腺ホルモンの合成に必要なのはどれか。",kihon:true,
 choices:[
  ["ヨウ素",true,""],
  ["鉄",false,"ヘモグロビンの成分となる元素。甲状腺ホルモンの合成材料ではない。"],
  ["カルシウム",false,"骨の成分であり、カルシトニンやパラソルモンが血中濃度を調節する元素。"],
  ["ナトリウム",false,"細胞外液に多い陽イオンで、アルドステロンが再吸収を調節する。"]],
 exp:"T3やT4は、甲状腺濾胞腔に存在するサイログロブリンの<b>ヨウ素化</b>により合成される。（教科書 P93、図6・8）"},

{q:"トリヨードサイロニン（T3）とサイロキシン（T4）について正しいのはどれか。",
 choices:[
  ["生理活性はT3のほうが強い",true,""],
  ["分泌量はT3のほうが多い",false,"分泌量が多いのはもう一方（T4）。"],
  ["どちらもステロイドホルモンである",false,"甲状腺ホルモンはアミノ酸誘導体ホルモンに分類される。"],
  ["どちらも副甲状腺から分泌される",false,"副甲状腺から分泌されるのはパラソルモン。"]],
 exp:"甲状腺ホルモンにはT3とT4の2種類があり、<b>生理活性はT3でより強く</b>、<b>分泌量はT4で多い</b>。（教科書 P93）"},

{q:"甲状腺ホルモンの作用はどれか。",kihon:true,dobon:true,
 choices:[
  ["熱産生の増大",true,""],
  ["血糖値の低下",false,"甲状腺ホルモンはグリコーゲン分解や糖新生をさかんにする。血糖を下げる向きではない。"],
  ["組織の酸素消費量の減少",false,"向きが逆。甲状腺ホルモンは組織の酸素消費量を増加させる。"],
  ["心拍数の減少",false,"向きが逆。甲状腺ホルモンはカテコールアミンの作用を強め、心拍数を増やす。"]],
 exp:"T3とT4は<b>基礎代謝を高め</b>、組織の<b>酸素消費量の増加</b>と<b>代謝熱の上昇</b>を引き起こして体温を上げる。心拍数を増やし、発育初期の骨成長も促す。（教科書 P93）"},

{q:"甲状腺ホルモンの分泌が過剰になると、分泌が抑制されるのはどれか。",kihon:true,
 choices:[
  ["甲状腺刺激ホルモン（TSH）",true,""],
  ["副腎皮質刺激ホルモン（ACTH）",false,"コルチゾルとの間で負のフィードバックを形成する下垂体前葉ホルモン。"],
  ["カルシトニン",false,"血中Ca²⁺濃度で分泌が調節されるホルモン。"],
  ["パラソルモン",false,"血中Ca²⁺濃度の低下で分泌が増えるホルモン。"]],
 exp:"T3とT4の分泌が過剰になると<b>負のフィードバック</b>がはたらき、視床下部のTRHや下垂体前葉の<b>TSH</b>が抑制される。逆に甲状腺を摘出するとTSHは上昇する。（教科書 P93、図6・9）"},

{q:"甲状腺について誤っているのはどれか。",gori:true,
 choices:[
  ["カルシトニンは甲状腺ホルモンに含まれる",true,""],
  ["喉頭と気管の間にある",false,"教科書どおりの記述なので、正しい。"],
  ["組織内には多くの濾胞がみられる",false,"教科書どおりの記述なので、正しい。"],
  ["濾胞内は好酸性のコロイドで満たされている",false,"教科書どおりの記述なので、正しい。"]],
 exp:"カルシトニンは甲状腺で分泌されるものの、<b>甲状腺ホルモンには含まれない</b>。甲状腺ホルモンはT3とT4の2種類。（教科書 P93）"},

{q:"他のホルモンの作用を増強する効果を何というか。",
 choices:[
  ["許容効果",true,""],
  ["脱感作",false,"ホルモンが持続的に作用して受容体の数や感受性が低下し、効果が下がる現象。"],
  ["負のフィードバック",false,"最終産物が上位の内分泌腺に作用して分泌を抑制するしくみ。"],
  ["拮抗作用",false,"2つのホルモンが互いに逆向きにはたらくこと。"]],
 exp:"甲状腺ホルモンはカテコールアミンの作用を強めることで心拍数を増やす。このように他のホルモンの作用を増強する効果を<b>許容効果</b>と呼ぶ。（教科書 P93）"},

{q:"カルシトニンを分泌する細胞はどれか。",
 choices:[
  ["濾胞傍細胞（C細胞）",true,""],
  ["濾胞細胞",false,"ヨウ素を取り込み、甲状腺ホルモン（T3・T4）をつくる細胞。"],
  ["膵臓のβ細胞",false,"インスリンを分泌する細胞。"],
  ["破骨細胞",false,"骨を吸収する細胞で、カルシトニンが活動を抑える相手。"]],
 exp:"カルシトニンは甲状腺の濾胞の間にある<b>濾胞傍細胞（C細胞）</b>から分泌される。（教科書 P93、図6・8）"},

{q:"カルシトニンの作用はどれか。",kihon:true,
 choices:[
  ["破骨細胞の活動を抑え、骨吸収を抑制する",true,""],
  ["破骨細胞の活動を高め、骨吸収を促進する",false,"向きが逆。副甲状腺から分泌されるホルモンの作用。"],
  ["腎臓でのNa⁺の再吸収を促進する",false,"アルドステロンの作用。"],
  ["血中Ca²⁺濃度を上昇させる",false,"向きが逆。骨吸収を抑えると、血中Ca²⁺濃度は下がる方向にはたらく。"]],
 exp:"カルシトニンは<b>破骨細胞の活動を抑制</b>し、<b>骨吸収</b>（骨から血中にCa²⁺が移行すること）を抑える。（教科書 P94）"},

{q:"カルシトニンの分泌が増加するのはどれか。",
 choices:[
  ["血中Ca²⁺濃度の上昇",true,""],
  ["血中Ca²⁺濃度の低下",false,"向きが逆。カルシトニンの分泌はこのとき減少する。"],
  ["血糖値の上昇",false,"インスリンの分泌を増やす刺激。"],
  ["血漿浸透圧の上昇",false,"バソプレシンの分泌を増やす刺激。"]],
 exp:"カルシトニンの分泌量は、<b>血中Ca²⁺濃度の上昇で増加</b>し、低下で減少する。（教科書 P94）"},

/* ---------- B-2 副甲状腺 ---------- */

{q:"パラソルモン（PTH）の作用はどれか。",kihon:true,dobon:true,
 choices:[
  ["血中Ca²⁺濃度を上昇させる",true,""],
  ["血中Ca²⁺濃度を低下させる",false,"向きが逆。甲状腺のカルシトニンの方向の作用。"],
  ["破骨細胞の活動を抑制する",false,"向きが逆。カルシトニンの作用。"],
  ["血中Na⁺濃度を上昇させる",false,"副甲状腺ホルモンはナトリウムの調節には関与しない。"]],
 exp:"パラソルモンは骨細胞による骨溶解を促し、<b>破骨細胞の活動をさかんに</b>する。骨の分解・吸収が進み、<b>血中Ca²⁺濃度が上昇</b>する。カルシトニンとは逆のはたらき。（教科書 P94）"},

{q:"パラソルモンの分泌が増加するのはどれか。",kihon:true,
 choices:[
  ["血中Ca²⁺濃度の低下",true,""],
  ["血中Ca²⁺濃度の上昇",false,"向きが逆。PTHの分泌はこのとき減少する。"],
  ["血中K⁺濃度の上昇",false,"PTHの分泌はK⁺濃度では調節されない。"],
  ["血糖値の低下",false,"グルカゴンなど血糖を上げるホルモンの分泌を増やす刺激。"]],
 exp:"PTHの分泌は<b>血中Ca²⁺濃度の低下で増加</b>し、上昇で減少する。カルシトニンとは逆。（教科書 P94）"},

/* ---------- B-3 副腎皮質 ---------- */

{q:"副腎皮質の球状層から分泌されるのはどれか。",kihon:true,
 choices:[
  ["ミネラルコルチコイド",true,""],
  ["グルココルチコイド",false,"副腎皮質の束状層から分泌される。"],
  ["性ホルモン",false,"副腎皮質の網状層から少量分泌される。"],
  ["アドレナリン",false,"副腎髄質から分泌される。"]],
 exp:"副腎皮質は外側から<b>球状層・束状層・網状層</b>の3層。球状層→<b>ミネラルコルチコイド</b>、束状層→グルココルチコイド、網状層→少量の性ホルモン。（教科書 P94、図6・10）"},

{q:"アルドステロンの作用はどれか。",kihon:true,dobon:true,
 choices:[
  ["腎臓でのNa⁺の再吸収を促進する",true,""],
  ["腎臓でのK⁺の排泄を抑制する",false,"向きが逆。アルドステロンはK⁺の排泄を促進する。"],
  ["血圧を低下させる",false,"向きが逆。細胞外液量を増やして血圧を上げる。"],
  ["血中Ca²⁺濃度を上昇させる",false,"副甲状腺ホルモンの作用。"]],
 exp:"アルドステロン（ミネラルコルチコイド）は腎臓での<b>Na⁺の再吸収を促進</b>し、細胞外液量を増やして<b>血圧を上昇</b>させる。K⁺の排泄は促進する。（教科書 P94〜95）"},

{q:"アルドステロンについて誤っているのはどれか。",gori:true,
 choices:[
  ["血中K⁺濃度を上昇させる",true,""],
  ["電解質コルチコイドとも呼ばれる",false,"教科書どおりの記述なので、正しい。"],
  ["細胞外液量を増やす",false,"教科書どおりの記述なので、正しい。"],
  ["血圧を上昇させる",false,"教科書どおりの記述なので、正しい。"]],
 exp:"アルドステロンは<b>K⁺の腎臓での排泄を促進</b>するので、血中K⁺濃度は<b>低下</b>する方向にはたらく。（教科書 P95）"},

{q:"グルココルチコイドの作用はどれか。",kihon:true,dobon:true,
 choices:[
  ["抗炎症作用",true,""],
  ["血糖値の低下",false,"向きが逆。糖新生を促し、血糖を上昇させる。"],
  ["糖新生の抑制",false,"向きが逆。肝臓で糖新生を促進する。"],
  ["胃酸分泌の抑制",false,"向きが逆。胃酸やペプシノーゲンの分泌を促進し、胃潰瘍の原因にもなる。"]],
 exp:"グルココルチコイドは肝臓で<b>糖新生</b>を促して<b>血糖を上昇</b>させる。ほかに<b>抗炎症作用</b>・抗ショック作用・利尿作用、胃酸分泌の促進などがある。（教科書 P95）"},

{q:"グルココルチコイドについて誤っているのはどれか。",kihon:true,gori:true,
 choices:[
  ["副腎髄質から分泌される",true,""],
  ["血糖値を上昇させる",false,"教科書どおりの記述なので、正しい。"],
  ["筋でタンパク質の分解を促進する",false,"教科書どおりの記述なので、正しい。"],
  ["抗ショック作用をもつ",false,"教科書どおりの記述なので、正しい。"]],
 exp:"グルココルチコイドは副腎<b>皮質</b>の<b>束状層</b>から分泌される。副腎髄質から分泌されるのはアドレナリンとノルアドレナリン。（教科書 P94〜95）"},

{q:"グルココルチコイドのうち、作用が最も強いのはどれか。",
 choices:[
  ["コルチゾル",true,""],
  ["コルチコステロン",false,"グルココルチコイドの1つだが、作用が最も強いものではない。"],
  ["コルチゾン",false,"グルココルチコイドの1つだが、作用が最も強いものではない。"],
  ["アルドステロン",false,"ミネラルコルチコイドであり、グルココルチコイドではない。"]],
 exp:"グルココルチコイドはコルチゾル・コルチコステロン・コルチゾンなどの総称で、作用は<b>コルチゾル</b>でもっとも強い。（教科書 P95）"},

{q:"グルココルチコイドの作用で減少するのはどれか。",
 choices:[
  ["好酸球",true,""],
  ["好中球",false,"グルココルチコイドの作用で増加する。"],
  ["血小板",false,"グルココルチコイドの作用で増加する。"],
  ["赤血球",false,"グルココルチコイドの作用で増加する。"]],
 exp:"グルココルチコイドは<b>好酸球を減少</b>させ、好中球・血小板・赤血球の数を増加させる。胸腺やリンパ節は萎縮する。（教科書 P95）"},

{q:"コルチゾルの分泌が増加したとき、負のフィードバックで分泌が抑制されるのはどれか。",
 choices:[
  ["副腎皮質刺激ホルモン（ACTH）",true,""],
  ["甲状腺刺激ホルモン（TSH）",false,"甲状腺ホルモンとの間で負のフィードバックを形成する下垂体前葉ホルモン。"],

let mode="normal", drawn=[], idx=0, score=0, streak=0, answered=false, dead=false;
let qmiss=0, totalMiss=0, firstTryCount=0; // ミス回数の集計（通常モード）
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function home(){
  document.getElementById("htt").textContent="確認テスト";
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="0";
  document.getElementById("bd").innerHTML=`
    <div class="center">
      <p class="lead">モードを選んでスタート。<br>問題は毎回シャッフルされ、プール${POOL.length}問から${PICK}問が出題されます。</p>
      <div class="modes">
        <button class="mode" onclick="start('normal')">
          <div class="nm">通常モード</div>
          <div class="ds">${PICK}問を最後まで解いて採点します。ふだんの確認用。<span class="mark kihon" style="margin-left:4px">🎯基本</span> は落としちゃダメな基本問題、<span class="mark gori">⚠ 誤りを選ぶ</span> は誤っているものを選ぶ問題、<span class="mark hosoku">📘 補足（資料外）</span> は教科書外の国試頻出テーマ。</div>
        </button>
        <button class="mode dob" onclick="start('dobon')">
          <div class="nm">💣 ドボンチャレンジ</div>
          <div class="ds">プールの中のごく一部、<b>絶対に落とせない最重要問題</b>だけが <b>💣ドボン！</b> に変身。それを外したらそこで終了。どこまで正解を続けられるか挑戦！</div>
        </button>
      </div>
    </div>`;
  document.getElementById("ctrl").innerHTML="";
}
function start(m){
  mode=m; drawn=shuffle(POOL).slice(0,Math.min(PICK,POOL.length));
  idx=0;score=0;streak=0;dead=false;totalMiss=0;firstTryCount=0;render();
}
function render(){
  answered=false; qmiss=0;
  const item=drawn[idx];
  const opts=shuffle(item.choices);
  const isDob=(mode==="dobon" && item.dobon);
  document.getElementById("htt").textContent=(mode==="dobon")?"ドボンチャレンジ":"確認テスト";
  document.getElementById("pg").textContent=`問 ${idx+1} / ${drawn.length}`;
  document.getElementById("bar").style.width=(idx/drawn.length*100)+"%";
  const L=["ア","イ","ウ","エ","オ"];
  // ドボン対象の問題だけ💣に変わる。それ以外の🎯基本は通常どおり🎯のまま表示する
  let markHtml = isDob ? `<span class="mark dobon">💣 ドボン！</span>`
                       : (item.kihon ? `<span class="mark kihon">🎯 基本</span>` : "");
  if(item.gori)   markHtml += `<span class="mark gori">⚠ 誤りを選ぶ</span>`;
  if(item.hosoku) markHtml += `<span class="mark hosoku">📘 補足（資料外）</span>`;
  // 誤り選択問題は、設問中の「誤っている」を赤字にして読み飛ばしを防ぐ
  const qText = item.gori ? item.q.replace("誤っている",'<span class="ng">誤っている</span>') : item.q;
  let h=`<div class="qnum">Q${idx+1} ${markHtml}</div><div class="q">${qText}</div><div class="opts">`;
  opts.forEach((o,i)=>{h+=`<button class="opt" onclick="pick(this,${o[1]})"><span class="mk">${L[i]}</span><span>${o[0]}</span></button>`;});
  h+=`</div><div class="exp" id="exp"><div class="vd" id="vd"></div><div class="tx" id="tx"></div></div>`;
  document.getElementById("bd").innerHTML=h;
  document.getElementById("ctrl").innerHTML=`<button class="btn" id="nx" onclick="next()" disabled>解答を選んでください</button>`;
}
function pick(el,ok){
  if(answered)return;
  if(el.classList.contains("dis"))return; // 無効化済みの選択肢は再カウントしない
  const item=drawn[idx];
  const isDob=(mode==="dobon" && item.dobon);
  const selText=el.querySelector("span:last-child").textContent;
  const selChoice=item.choices.find(c=>c[0]===selText);
  const exp=document.getElementById("exp");
  const nx=document.getElementById("nx");

  if(ok){
    // 正解：ここで確定。正解した選択肢だけ緑にする（不正解の選択肢は先に色を変えない）
    answered=true;
    el.classList.add("correct");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    score++;
    if(mode!=="dobon"){ if(qmiss===0) firstTryCount++; }
    if(mode==="dobon") streak++;
    exp.className="exp show ok";
    document.getElementById("vd").textContent=(qmiss===0)?"正解！":"正解！（"+qmiss+"回目で正解）";
    document.getElementById("tx").innerHTML=item.exp;
    nx.disabled=false;
    nx.textContent=(idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶";
    return;
  }

  // 不正解
  if(mode==="dobon"){
    // ドボンモードは一発勝負：選び直しなし・正解は伏せる
    answered=true;
    el.classList.add("wrong");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    if(item.dobon){ dead=true; } // 💣ドボン対象を外したときだけ終了
    exp.className="exp show ng";
    document.getElementById("vd").textContent=isDob?"💣 ドボン！":"不正解";
    document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}`;
    nx.disabled=false;
    nx.textContent=dead?"結果を見る（ドボン）▶":((idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶");
    return;
  }

  // 通常モード：ミスを数え、選んだ選択肢だけ赤にして無効化。正解は伏せたまま選び直せる
  qmiss++; totalMiss++;
  el.classList.add("wrong","dis");
  exp.className="exp show ng";
  document.getElementById("vd").textContent="不正解（ミス "+qmiss+"回）";
  document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}<br>ほかの選択肢からもう一度選んでください。`;
  // 「次へ」はまだ出さない（正解するまで進めない）
}
function next(){
  if(dead){result();return;}
  if(idx+1<drawn.length){idx++;render();}
  else result();
}
function result(){
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="100%";
  if(mode==="dobon"){
    document.getElementById("htt").textContent="結果";
    if(dead){
      document.getElementById("bd").innerHTML=`<div class="center score dead">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>ドボンを踏んでしまいました</div>
        <div class="big">${streak} 問連続正解</div>
        <div class="msg">${idx}問正解のあと、${idx+1}問目でドボン。<br>上の解説を復習して再挑戦しましょう。</div>
      </div>`;
    }else{
      document.getElementById("bd").innerHTML=`<div class="center score">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>クリア！</div>
        <div class="big">${score} / ${drawn.length}</div>
        <div class="msg">ドボンを踏まず完走しました。お見事！</div>
      </div>`;
    }
  }else{
    document.getElementById("htt").textContent="結果";
    const n=drawn.length;
    const ftPct=Math.round(firstTryCount/n*100);
    const noMiss=(totalMiss===0);
    let head = noMiss
      ? `<div class="big">✨ ノーミス パーフェクト！</div><div>全 ${n} 問を一発で正解</div>`
      : `<div>今回の成績</div><div class="big">${firstTryCount} / ${n}</div><div>一発正解率 ${ftPct}%</div>`;
    let stat = `<div class="stats">一発正解 ${firstTryCount}問　｜　総ミス ${totalMiss}回</div>`;
    let msg = noMiss?"完璧です。この調子！":ftPct>=60?"よくできました。ミスした問題を復習しましょう。":"もう一度スライドで確認してから挑戦しましょう。";
    document.getElementById("bd").innerHTML=`<div class="center score">${head}${stat}<div class="msg">${msg}</div></div>`;
  }
  document.getElementById("ctrl").innerHTML=`<button class="btn sub" onclick="home()">モード選択へ</button><button class="btn" onclick="start(mode)">もう一度（シャッフル）▶</button>`;
}
home();
</script>
