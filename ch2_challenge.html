<style>

.modes{display:flex;flex-direction:column;gap:12px;max-width:470px;margin:0 auto}

<script>
/* ===== 問題プール =====
   パートA〜Dの全問（教科書 第2章 P11〜21 ベース）＋ チャレンジ限定の新問題10問
   choices: [表示文, 正解フラグ, その選択肢が何かの説明]
   章末はライフ制なので dobon フラグ・g（出題グループ上限）は使わない（データ上は残している）。
   内訳：パートA 23問／B 31問／C 28問／D 34問 ＋ 初見10問 ＝ 全126問
   エンジン：ch11_challenge.html と同じ（2段階の開始画面・ライフ制・📖学習モード）
   タグ配色：🎯＝臙脂 #9e3450／⚠＝紫 #6d3f9e／📘＝琥珀 #8a6314／🔥＝焦茶オレンジ #c2410c／📖学習モード＝ティール #0f766e */

/* ========== パートA のプール（ch2_quizA.html と同一：筋の分類・骨格筋の構造） ========== */
const POOL_A=[
/* ---- 筋の分類 ---- */
{q:"筋の分類について正しいのはどれか。",kihon:true,dobon:true,
 choices:[
  ["心筋は横紋をもつが、自律神経に支配される不随意筋である",true,""],
  ["骨格筋は自律神経に支配される",false,"骨格筋を支配するのは運動神経で、意思で動かせる随意筋。"],
  ["平滑筋は横紋をもつ",false,"平滑筋に横紋はなく、細胞は紡錘形をしている。"],
  ["平滑筋は意思で動かすことができる",false,"平滑筋は不随意筋で、意思では動かせない。"]],
 exp:"横紋の有無（骨格筋・心筋はあり／平滑筋はなし）と、随意・不随意（随意は骨格筋のみ）は別の分類軸。この2つを混同しやすいので整理しておく。"},

{q:"骨格筋と心筋に共通する特徴はどれか。",kihon:true,dobon:true,
 choices:[
  ["横紋がある",true,""],
  ["意思で動かせる",false,"骨格筋だけの特徴。心筋は意思では動かせない不随意筋。"],
  ["自律神経に支配される",false,"心筋と平滑筋の特徴。骨格筋は運動神経に支配される。"],
  ["介在板で連結する",false,"心筋だけの特徴。骨格筋の筋線維にはない。"]],
 exp:"骨格筋と心筋はどちらも横紋筋。ただし、随意か不随意か、支配神経が何かは異なる（P11 図2・1）。"},

{q:"心筋と平滑筋に共通する特徴はどれか。",
 choices:[
  ["自律神経に支配される",true,""],
  ["横紋がある",false,"骨格筋と心筋の特徴。平滑筋には横紋がない。"],
  ["細胞が紡錘形である",false,"平滑筋だけの特徴。心筋の細胞は枝分かれした円柱状。"],
  ["介在板をもつ",false,"心筋だけの特徴。平滑筋にはない。"]],
 exp:"心筋と平滑筋はどちらも自律神経に支配される不随意筋。両者は横紋の有無で分かれる（P11 図2・1）。"},

{q:"平滑筋の細胞の特徴として正しいのはどれか。",kihon:true,
 choices:[
  ["紡錘形で横紋がない",true,""],
  ["細長い円柱状で横紋がある",false,"骨格筋の筋線維の特徴。"],
  ["枝分かれした円柱状で介在板をもつ",false,"心筋細胞の特徴。"],
  ["多くの核をもつ多核細胞である",false,"骨格筋の筋線維の特徴。"]],
 exp:"平滑筋の細胞は紡錘形で横紋がない。血管や消化管など中腔臓器の壁を構成し、自律神経に支配される不随意筋である。"},

{q:"平滑筋でできているのはどれか。",kihon:true,
 choices:[
  ["幽門括約筋",true,""],
  ["外肛門括約筋",false,"意思で締めることのできる骨格筋。"],
  ["横隔膜",false,"呼吸に使われる骨格筋。"],
  ["心房の壁",false,"心筋でできている。"]],
 exp:"幽門括約筋は胃の出口にある平滑筋で、消化管の壁の一部。「括約筋」という名前だけでは筋の種類は決まらない。"},

{q:"心筋の筋線維について正しいのはどれか。",kihon:true,
 choices:[
  ["介在板によって細胞どうしが連結する",true,""],
  ["横紋をもたない",false,"平滑筋の特徴。心筋には横紋がある。"],
  ["運動神経の支配を受ける",false,"骨格筋の特徴。心筋を支配するのは自律神経。"],
  ["意思で動かすことができる",false,"随意筋である骨格筋の特徴。心筋は不随意筋。"]],
 exp:"心筋の細胞は枝分かれした円柱状で、介在板によって互いに連結している。横紋はあるが、自律神経に支配される不随意筋。"},

/* ---- 筋線維・筋原線維 ---- */
{q:"筋線維が集合して構成される単位はどれか。",
 choices:[
  ["筋束",true,""],
  ["筋原線維",false,"筋線維の内部を長軸方向に走る直径約1〜3μmの構造で、筋線維より小さい。"],
  ["サルコメア",false,"Z膜からZ膜までの分節で、筋収縮の機能的最小単位。"],
  ["筋周膜",false,"筋の内部を区切って包む結合組織であり、筋の構成単位そのものではない。"]],
 exp:"筋線維が集合して筋束をつくり、筋束が集合して1つの骨格筋（全筋）を構成する。"},

{q:"骨格筋の筋線維について正しいのはどれか。",
 choices:[
  ["多くの核をもつ",true,""],
  ["直径は約1〜3μmである",false,"筋線維の内部を走る筋原線維の直径。"],
  ["枝分かれして介在板で連結する",false,"心筋細胞の特徴。"],
  ["紡錘形をしている",false,"平滑筋の細胞の特徴。"]],
 exp:"骨格筋の筋線維（筋細胞）は多核細胞で、直径は10〜150μm程度、長さは数mmから10cm以上までさまざま（P12）。"},

{q:"骨格筋の構造について誤っているのはどれか。",gori:true,
 choices:[
  ["筋原線維の直径は10〜150μm程度である",true,""],
  ["筋線維は多くの核をもつ多核細胞である",false,"教科書どおりの記述なので、正しい。"],
  ["筋線維の直径は10〜150μm程度である",false,"教科書どおりの記述なので、正しい。"],
  ["筋線維が集合して筋束を構成する",false,"教科書どおりの記述なので、正しい。"]],
 exp:"直径は、筋線維（筋細胞）が10〜150μm、その中を走る筋原線維が約1〜3μm。桁が2つ違うので、どちらの数値かを取り違えないこと。"},

{q:"筋小胞体に蓄えられ、筋収縮に使われるイオンはどれか。",kihon:true,dobon:true,
 choices:[
  ["カルシウムイオン",true,""],
  ["ナトリウムイオン",false,"細胞外に多く、興奮（活動電位）の発生に関わるイオン。"],
  ["カリウムイオン",false,"細胞内に多く、静止電位の維持に関わるイオン。"],
  ["塩化物イオン",false,"細胞外に多い陰イオンで、筋小胞体に蓄えられるイオンではない。"]],
 exp:"筋小胞体は筋原線維を包む細胞小器官で、筋が収縮するときに使われるCa²⁺を蓄えている。"},

/* ---- ミオシンとアクチン ---- */
{q:"太いフィラメントを構成するタンパク質はどれか。",kihon:true,
 choices:[
  ["ミオシン",true,""],
  ["アクチン",false,"細いフィラメント（アクチンフィラメント）を構成するタンパク質。"],
  ["トロポニン",false,"細いフィラメント側に含まれる収縮調節タンパク質。"],
  ["トロポミオシン",false,"同じく細いフィラメント側に含まれる収縮調節タンパク質。"]],
 exp:"太いフィラメント＝ミオシンフィラメント、細いフィラメント＝アクチンフィラメント。"},

{q:"ミオシンフィラメントについて正しいのはどれか。",
 choices:[
  ["頭部が規則正しくらせん状に並ぶ",true,""],
  ["細いフィラメントを構成する",false,"細いフィラメントを構成するのはアクチン。"],
  ["トロポニンを含む",false,"トロポニンは細いフィラメント（アクチンフィラメント）側に含まれる調節タンパク質。"],
  ["収縮時にそれ自体が短縮する",false,"収縮してもA帯の幅は変わらず、フィラメント自体の長さは変化しない。"]],
 exp:"ミオシンフィラメントでは頭部が規則正しくらせん状に並び、アクチンと結合することで筋収縮が生じる。"},

{q:"1本のミオシンフィラメントの周囲に並ぶアクチンフィラメントの数はどれか。",
 choices:[
  ["6本",true,""],
  ["2本",false,"実際の配列より少ない。断面でみると、六角形の頂点に並ぶ配置になっている。"],
  ["4本",false,"実際の配列より少ない。四角形ではなく六角格子状に並ぶ。"],
  ["8本",false,"実際の配列より多い。六角格子状の配置と合わない。"]],
 exp:"ミオシンフィラメントの周囲には、アクチンフィラメントが六角格子状に6本、整然と並んでいる（P12）。"},

{q:"筋原線維を構成するタンパク質について誤っているのはどれか。",gori:true,
 choices:[
  ["トロポニンは太いフィラメントに含まれる",true,""],
  ["ミオシンフィラメントの周囲に6本のアクチンフィラメントが並ぶ",false,"六角格子状に6本が整然と並ぶ。教科書どおりの記述なので、正しい。"],
  ["ミオシンの頭部は規則正しくらせん状に並ぶ",false,"教科書どおりの記述なので、正しい。"],
  ["トロポミオシンは収縮調節タンパク質としてはたらく",false,"教科書どおりの記述なので、正しい。"]],
 exp:"トロポニンとトロポミオシンは、太いフィラメントではなく細いフィラメント（アクチンフィラメント）に含まれ、ミオシンとアクチンの結合を調整する収縮調節タンパク質としてはたらく。"},

/* ---- 筋の微細構造（帯の名称）：g band ---- */
{g:"band",q:"A帯（暗帯）に並ぶフィラメントはどれか。",kihon:true,
 choices:[
  ["ミオシンフィラメント",true,""],
  ["アクチンフィラメント",false,"I帯（明帯）に並ぶ細いフィラメント。"],
  ["コラーゲン線維",false,"結合組織の線維で、筋原線維の構成要素ではない。"],
  ["筋小胞体",false,"Ca²⁺を蓄える細胞小器官で、フィラメントではない。"]],
 exp:"暗い部分がA帯（暗帯）でミオシンフィラメントが並び、明るい部分がI帯（明帯）でアクチンフィラメントが並ぶ。"},

{g:"band",q:"ミオシンフィラメントが並ぶ部分はどれか。",
 choices:[
  ["A帯",true,""],
  ["I帯",false,"アクチンフィラメントだけが並ぶ明るい部分（明帯）。"],
  ["Z膜",false,"I帯の中央にある仕切りで、サルコメアの境界となる。"],
  ["筋内膜",false,"個々の筋線維を包む結合組織で、筋原線維の縞模様とは関係しない。"]],
 exp:"A帯（暗帯）にミオシンフィラメントが並ぶ。A帯の幅はミオシンフィラメントの長さに相当し、収縮しても変わらない（P13）。"},

{g:"band",q:"アクチンフィラメントだけが並ぶ部分はどれか。",kihon:true,
 choices:[
  ["I帯",true,""],
  ["A帯",false,"ミオシンフィラメントが並ぶ暗い部分（暗帯）。"],
  ["H帯",false,"A帯の中央で、ミオシンフィラメントだけからなるやや明るい部分。"],
  ["Z膜",false,"サルコメアの境界となる仕切り。"]],
 exp:"I帯（明帯）にはアクチンフィラメントだけが並ぶ。I帯の中央にZ膜がある（P13）。"},

{g:"band",q:"A帯の中央で、アクチンフィラメントと重ならない部分はどれか。",
 choices:[
  ["H帯",true,""],
  ["I帯",false,"アクチンフィラメントが並ぶ明るい部分（明帯）。"],
  ["Z膜",false,"I帯の中央にある仕切り。"],
  ["サルコメア",false,"Z膜からZ膜までの分節で、筋収縮の機能的最小単位。"]],
 exp:"H帯はミオシンフィラメントだけからなるやや明るい部分。収縮時にはアクチンが滑り込むため、幅が狭くなる（P13〜14）。"},

{q:"Z膜からZ膜までの分節で、筋収縮の機能的最小単位はどれか。",kihon:true,
 choices:[
  ["サルコメア（筋節）",true,""],
  ["H帯",false,"A帯の中央にある、アクチンと重なり合わないミオシンのみのやや明るい部分。"],
  ["I帯",false,"アクチンフィラメントが並ぶ明るい部分で、その中央にZ膜がある。"],

 exp:"もし心筋で強縮が起これば、心臓は収縮したまま固まって拡張できず、血液を充填できなくなる。活動電位の持続時間が長いことが、<b>ポンプとして働くためのしくみ</b>になっている。（P20）"},

 choices:[

  ["骨格筋と心筋はどちらも横紋をもつ",false,"教科書どおりの記述なので、正しい。"]],
 exp:"トロポニン・トロポミオシンで調節されるのは骨格筋と心筋。平滑筋は<b>ミオシン軽鎖のリン酸化と脱リン酸化</b>で調節される。（P11・P20〜21）"},

{q:"同じ筋を用いた実験について誤っているのはどれか。",gori:true,shinmon:true,
 choices:[
  ["サルコメア長を至適長の半分にすると、張力は最大になる",true,""],
  ["筋を引き伸ばしながら収縮させると、等尺性収縮時より大きな張力が出る",false,"教科書どおりの記述なので、正しい。"],
  ["収縮速度を上げると、求心性収縮の張力は小さくなる",false,"教科書どおりの記述なので、正しい。"],
  ["刺激頻度を上げていくと、不完全強縮を経て完全強縮になる",false,"教科書どおりの記述なので、正しい。"]],
 exp:"至適長の半分は長さ-張力関係の<b>上行脚にあたる短い領域</b>で、張力は大きく低下する。長さ・速度・刺激頻度という3つの条件を横断して整理する問題。（P17〜19）"},

 choices:[
  ["その筋が大きな張力を発揮していると断定できる",true,""],
  ["その筋への指令が大きいことを示している",false,"筋電図振幅値が示すものそのものなので、言える。"],

  ["運動単位の発火頻度が高い可能性がある",false,"振幅値を増減させる要因なので、言える。"]],
 exp:"筋電図は電気的活動状態をとらえるもので、筋の張力そのものを評価するわけではない。筋力とはおおむね直線関係が認められるが、疲労状態や筋温なども振幅に影響する。「<b>相関がある</b>」ことと「<b>測定している</b>」ことは別。（P19〜20）"},

/* ===== コース設定（プール数に比例して抽出。初見10問は常に全問） ===== */
const PARTS={A:POOL_A,B:POOL_B,C:POOL_C,D:POOL_D};
const COURSES={
  "50" :{name:"コンプリート50", pick:{A:8,B:11,C:9,D:12}},
  "100":{name:"コンプリート100",pick:{A:18,B:24,C:22,D:26}},
  "all":{name:"ALL",            pick:null}
};
const ALL=[].concat(POOL_A,POOL_B,POOL_C,POOL_D,SHINMON);
const TOTAL=ALL.length;

/* ===== 学習モード用：問題の識別キーと保存 ===== */
function keyOf(it){return it.q+"｜"+it.choices.find(c=>c[1])[0];}
const BYKEY={}; ALL.forEach(it=>{BYKEY[keyOf(it)]=it;});
const SKEY="ch2_challenge_study_v1";   // 章ごとに別のキー
function sLoad(){
  try{
    const s=JSON.parse(localStorage.getItem(SKEY));
    if(!s||!Array.isArray(s.list))return null;
    s.list=s.list.filter(k=>BYKEY[k]);           // 問題を差し替えても壊れないように
    s.wrong=(s.wrong||[]).filter(k=>BYKEY[k]);
    if(!s.list.length)return null;
    s.pos=Math.min(Math.max(0,s.pos|0),s.list.length);
    s.round=s.round||1;
    return s;
  }catch(e){return null;}
}
function sSave(){try{localStorage.setItem(SKEY,JSON.stringify(st));}catch(e){}}
function sClear(){try{localStorage.removeItem(SKEY);}catch(e){}}

/* ===== 共通 ===== */
let mode="challenge";
let course="50", drawn=[], idx=0, correct=0, streak=0, best=0, lives=0, maxLives=0, answered=false, dead=false;
let st=null, sMiss=0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function hearts(){
  if(maxLives<=1) return "";
  let h="";
  for(let i=0;i<maxLives;i++) h += (i<lives) ? "♥" : '<span class="off">♥</span>';
  return h;
}
function paintHead(){
  document.getElementById("life").innerHTML = hearts();
  document.getElementById("pg").textContent = (drawn.length? `${idx+1} / ${drawn.length}問目` : "");
}
function cname(){ return COURSES[course].name; }
function lname(){ return (maxLives<=1) ? "一発勝負" : "ライフ "+maxLives; }
function resetHead(t){
  document.getElementById("htt").textContent=t;
  document.getElementById("life").innerHTML="";
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="0";
  drawn=[];
  document.getElementById("ctrl").innerHTML="";
}
function qBody(item){
  const opts=shuffle(item.choices);
  const L=["ア","イ","ウ","エ","オ"];
  let markHtml="";
  if(item.kihon)   markHtml += `<span class="mark kihon">🎯 基本</span>`;
  if(item.gori)    markHtml += `<span class="mark gori">⚠ 誤りを選ぶ</span>`;
  if(item.hosoku)  markHtml += `<span class="mark hosoku">📘 補足（資料外）</span>`;
  if(item.shinmon) markHtml += `<span class="mark shinmon">🔥 チャレンジ限定</span>`;
  const qText = item.gori ? item.q.replace("誤っている",'<span class="ng">誤っている</span>') : item.q;
  const qn = (mode==="study") ? st.pos+1 : idx+1;
  let h=`<div class="qnum">Q${qn} ${markHtml}</div><div class="q">${qText}</div><div class="opts">`;
  opts.forEach((o,i)=>{h+=`<button class="opt" onclick="pick(this,${o[1]})"><span class="mk">${L[i]}</span><span>${o[0]}</span></button>`;});
  h+=`</div><div class="exp" id="exp"><div class="vd" id="vd"></div><div class="tx" id="tx"></div></div>`;
  return h;
}

/* ステップ1：問題数（または学習モード）を選ぶ */
function home(){
  mode="challenge";
  resetHead("コンプリートチャレンジ");
  const sv=sLoad();
  const resume = (sv && sv.pos<sv.list.length) ? `
        <button class="mode resume" onclick="studyResume()">
          <div class="nm">📖 学習モード：続きから</div>
          <div class="ds">${sv.round}周目${sv.round>1?"（間違えた問題）":""}の ${sv.pos+1}問目 / ${sv.list.length}問 から再開します。</div>
        </button>` : "";
  document.getElementById("bd").innerHTML=`
    <div class="center">
      <p class="lead">第2章の全パートの問題に、チャレンジ限定の新問題を混ぜて出題します。<br>毎回ランダムに選んでシャッフル。ライフがなくなるまで出し続けます。</p>
      <div class="step">STEP 1　問題数を選ぶ</div>
      <div class="modes">
        <button class="mode" onclick="pickCourse('50')">
          <div class="nm">コンプリート50</div>
          <div class="ds">パートA〜Dから比例配分で40問＋チャレンジ限定10問。まずはここから。</div>
        </button>
        <button class="mode" onclick="pickCourse('100')">
          <div class="nm">コンプリート100</div>
          <div class="ds">パートA〜Dから比例配分で90問＋チャレンジ限定10問。</div>
        </button>
        <button class="mode hard" onclick="pickCourse('all')">
          <div class="nm">ALL（全${TOTAL}問）</div>
          <div class="ds">第2章の全問題。最後までたどり着けるか挑戦。</div>
        </button>
      </div>
      <div class="divider">じっくり学ぶ</div>
      <div class="modes">${resume}
        <button class="mode study" onclick="studyNew()">
          <div class="nm">📖 学習モード（全${TOTAL}問）</div>
          <div class="ds">ライフなし。間違えても選び直して最後まで進めます。1周したら、間違えた問題だけをもう一度。全問クリアするまで続けられます。進み具合は自動で保存されます。</div>
        </button>
      </div>
      <div class="legend">
        <span class="mark kihon">🎯 基本</span> 落としちゃダメな基本問題<br>
        <span class="mark gori">⚠ 誤りを選ぶ</span> 誤っているものを選ぶ問題<br>
        <span class="mark hosoku">📘 補足（資料外）</span> 教科書外の国試頻出テーマ<br>
        <span class="mark shinmon">🔥 チャレンジ限定</span> この章末だけに出る新問題<br>
        ※ チャレンジ（50・100・ALL）は選び直しができません。間違えた問題も解説は表示されます。<br>
        ※ 学習モードの進み具合は、<b>この端末のこのブラウザにだけ</b>保存されます。シークレットモードで開いた場合や、ブラウザの履歴・データを消した場合は保存されません。
      </div>
    </div>`;
}

/* ステップ2：ライフを選ぶ */
function pickCourse(c){
  course=c;
  resetHead(cname());
  document.getElementById("bd").innerHTML=`
    <div class="center">
      <p class="lead"><b>${cname()}</b>（${c==="all"?TOTAL:c}問）に挑戦します。</p>
      <div class="step">STEP 2　ライフを選ぶ</div>
      <div class="modes">
        <button class="mode hard" onclick="start(1)">
          <div class="nm">一発勝負（ライフなし）</div>
          <div class="ds">1問でも間違えたら、そこで終了。何問連続で正解できるかに挑戦。</div>
        </button>
        <button class="mode" onclick="start(3)">
          <div class="nm">ライフ 3</div>
          <div class="ds">3回まで間違えられます。3回目を間違えた時点で終了。</div>
        </button>
        <button class="mode" onclick="start(5)">
          <div class="nm">ライフ 5</div>
          <div class="ds">5回まで間違えられます。まずはここから挑戦してみましょう。</div>
        </button>
      </div>
    </div>`;
  document.getElementById("ctrl").innerHTML=`<button class="btn sub" onclick="home()">◀ 問題数を選び直す</button>`;
}

function draw(){
  const p=COURSES[course].pick;
  let list=SHINMON.slice();
  for(const k in PARTS){
    list = list.concat(p ? shuffle(PARTS[k]).slice(0,p[k]) : PARTS[k]);
  }
  return shuffle(list);
}

function start(n){
  mode="challenge";
  maxLives=n; lives=n;
  drawn=draw();
  idx=0; correct=0; streak=0; best=0; dead=false;
  render();
}

function render(){
  answered=false;
  const item=drawn[idx];
  document.getElementById("htt").textContent = cname()+"｜"+lname();
  paintHead();
  document.getElementById("bar").style.width=(idx/drawn.length*100)+"%";
  document.getElementById("bd").innerHTML=qBody(item);
  document.getElementById("ctrl").innerHTML=`<button class="btn" id="nx" onclick="next()" disabled>解答を選んでください</button>`;
}

function pick(el,ok){
  if(mode==="study") return studyPick(el,ok);
  if(answered)return;
  answered=true;
  const item=drawn[idx];
  const selText=el.querySelector("span:last-child").textContent;
  const selChoice=item.choices.find(c=>c[0]===selText);
  const exp=document.getElementById("exp");
  const nx=document.getElementById("nx");
  document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));

  if(ok){
    el.classList.add("correct");
    correct++; streak++; if(streak>best) best=streak;
    exp.className="exp show ok";
    document.getElementById("vd").textContent="正解！";
    document.getElementById("tx").innerHTML=item.exp;
  }else{
    // 選び直しなし。正解の語句・色は伏せたまま、選んだ選択肢が何かだけ説明する
    el.classList.add("wrong");
    lives--; streak=0;
    paintHead();
    exp.className="exp show ng";
    document.getElementById("vd").textContent =
      (lives>0) ? `不正解（残りライフ ${lives}）` : "不正解 — ここで終了";
    document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}`;
    if(lives<=0) dead=true;
  }
  nx.disabled=false;
  if(dead)                         nx.textContent="結果を見る ▶";
  else if(idx+1<drawn.length)      nx.textContent="次の問題 ▶";
  else                             nx.textContent="結果を見る ▶";
}

function next(){
  if(dead){result();return;}
  if(idx+1<drawn.length){idx++;render();}
  else result();
}

function result(){
  const n=drawn.length;
  const done=idx+1;
  const complete=(!dead && done>=n);
  document.getElementById("htt").textContent="結果";
  document.getElementById("life").innerHTML=hearts();
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="100%";

  let html;
  if(complete && correct===n){
    html=`<div class="center score">
      <span class="tag">🏆 ${cname()} COMPLETE</span>
      <div>全問ノーミス</div>
      <div class="big">${n} / ${n}</div>
      <div class="msg">第2章を完全制覇しました。文句なしです。</div>
      <div class="stats">最長連続正解 ${best}問</div>
    </div>`;
  }else if(complete){
    html=`<div class="center score">
      <span class="tag">🏁 ${cname()} 完走</span>
      <div>最後まで到達しました</div>
      <div class="big">${correct} / ${n}</div>
      <div class="msg">ライフを残して全問クリア。あと一歩でコンプリートです。</div>
      <div class="stats">最長連続正解 ${best}問　｜　残りライフ ${lives}</div>
    </div>`;
  }else if(maxLives<=1){
    html=`<div class="center score dead">
      <span class="tag dob">${cname()}｜一発勝負</span>
      <div>ここで終了</div>
      <div class="big">${correct} 問連続正解</div>
      <div class="msg">全${n}問中 ${done}問目でストップ。<br>上の解説を確認して、もう一度挑戦しましょう。</div>
    </div>`;
  }else{
    html=`<div class="center score dead">
      <span class="tag dob">${cname()}｜ライフ ${maxLives}</span>
      <div>ライフがなくなりました</div>
      <div class="big">${correct} / ${done}</div>
      <div class="msg">全${n}問中 ${done}問目でストップ。<br>最長で ${best}問連続正解でした。</div>
      <div class="stats">正解 ${correct}問　｜　最長連続 ${best}問</div>
    </div>`;
  }
  document.getElementById("bd").innerHTML=html;
  document.getElementById("ctrl").innerHTML=`<button class="btn sub" onclick="home()">問題数を選ぶ</button><button class="btn sub" onclick="pickCourse(course)">ライフを選ぶ</button><button class="btn" onclick="start(maxLives)">もう一度（シャッフル）▶</button>`;
}

/* ===== 📖 学習モード =====
   全問をシャッフルして出題。間違えたら選び直し（通常モードと同じ）。
   1周終わったら、1回でもミスした問題だけで次の周を作る。全問クリアで終了。
   1問答えるごとに localStorage に保存し、次に開いたとき「続きから」で再開できる。 */
function studyNew(){
  const sv=sLoad();
  if(sv && sv.pos<sv.list.length && !confirm("保存されている続きを消して、全問を最初から始めますか？")) return;
  st={v:1,round:1,list:shuffle(ALL.map(keyOf)),pos:0,wrong:[]};
  sSave();
  studyRender();
}
function studyResume(){
  st=sLoad();
  if(!st){home();return;}
  if(st.pos>=st.list.length){mode="study";studyEnd();return;}
  studyRender();
}
function studyRender(){
  mode="study"; sMiss=0;
  const item=BYKEY[st.list[st.pos]];
  document.getElementById("htt").textContent="学習モード｜"+st.round+"周目"+(st.round>1?"（間違えた問題）":"");
  document.getElementById("life").innerHTML="";
  document.getElementById("pg").textContent=`${st.pos+1} / ${st.list.length}問目`;
  document.getElementById("bar").style.width=(st.pos/st.list.length*100)+"%";
  document.getElementById("bd").innerHTML=qBody(item);
  document.getElementById("ctrl").innerHTML=`<button class="btn sub" onclick="home()">中断する（保存済み）</button><button class="btn" id="nx" onclick="studyNext()" disabled>解答を選んでください</button>`;
}
function studyPick(el,ok){
  if(el.classList.contains("dis"))return;
  const key=st.list[st.pos];
  const item=BYKEY[key];
  const selText=el.querySelector("span:last-child").textContent;
  const selChoice=item.choices.find(c=>c[0]===selText);
  const exp=document.getElementById("exp");
  const nx=document.getElementById("nx");
  if(ok){
    el.classList.add("correct");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    exp.className="exp show ok";
    document.getElementById("vd").textContent=(sMiss===0)?"正解！":"正解！（ミス "+sMiss+"回のあと）";
    document.getElementById("tx").innerHTML=item.exp;
    st.pos++; sSave();
    nx.disabled=false;
    nx.textContent=(st.pos<st.list.length)?"次の問題 ▶":"この周の結果を見る ▶";
    return;
  }
  sMiss++;
  if(!st.wrong.includes(key)){st.wrong.push(key); sSave();}
  el.classList.add("wrong","dis");
  exp.className="exp show ng";
  document.getElementById("vd").textContent="不正解（ミス "+sMiss+"回）";
  document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}<br>ほかの選択肢からもう一度選んでください。`;
}
function studyNext(){
  if(st.pos<st.list.length) studyRender();
  else studyEnd();
}
function studyEnd(){
  const n=st.list.length, w=st.wrong.length, ok=n-w, r=st.round;
  document.getElementById("htt").textContent="学習モード｜"+r+"周目の結果";
  document.getElementById("life").innerHTML="";
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="100%";
  let html, btns;
  if(w===0){
    sClear(); st=null;
    html = (r===1)
      ? `<div class="center score"><span class="tag study">📖 学習モード</span>
          <div>全問一発正解</div><div class="big">${n} / ${n}</div>
          <div class="msg">第2章の全問を1周目でノーミス。お見事です！</div></div>`
      : `<div class="center score"><span class="tag study">📖 学習モード</span>
          <div>✨ 全問クリア！</div><div class="big">${r}周で完了</div>
          <div class="msg">間違えた問題をすべて解き直しました。<br>次はチャレンジ（ライフ制）で腕試しをしてみましょう。</div></div>`;
    btns=`<button class="btn sub" onclick="home()">モード選択へ</button><button class="btn" onclick="studyNew()">全問をもう一度（シャッフル）▶</button>`;
  }else{
    html=`<div class="center score"><span class="tag study">📖 学習モード｜${r}周目</span>
      <div>一発正解</div><div class="big">${ok} / ${n}</div>
      <div class="msg">間違えた問題が <b>${w}問</b> あります。<br>この${w}問だけを、もう一度解きましょう。</div>
      <div class="stats">進み具合は保存済み。閉じても「続きから」で再開できます</div></div>`;
    st={v:1,round:r+1,list:shuffle(st.wrong.slice()),pos:0,wrong:[]};
    sSave();
    btns=`<button class="btn sub" onclick="home()">モード選択へ</button><button class="btn" onclick="studyRender()">間違えた${w}問だけもう一度 ▶</button>`;
  }
  document.getElementById("bd").innerHTML=html;
  document.getElementById("ctrl").innerHTML=btns;
}

home();

</script>
</body>
</html>
