<div class="slide">
  <div class="hd"><div><div class="ch">第12章 尿の生成と排泄 ｜ D 排尿（教科書 P179〜180）</div><div class="tt" id="htt">確認テスト</div></div><div class="pg" id="pg"></div></div>

<script>
/* ===== 問題プール（教科書 第12章 P179〜P180 ベース）=====
   対応スライド：ch12_partD.html（D 排尿）
   choices: [表示文, 正解フラグ, その選択肢が何かの説明]
   kihon/dobon/gori/hosoku の意味は他章と同じ。g … 出題グループ（GMAXで1回の出題数を制限）

   グループ（すべて上限1）：同じテーマの問題や、先に出た問題の解説・ダミー説明が次の答えになる組を同じグループにした。
     kotsuban（骨盤神経が答え）／inbu（陰部神経・我慢）／jiritsu（自律神経のはたらき）／chusu（排尿中枢）
     kin（筋の性質）／ryo（尿量・尿意・排尿のきっかけ）／kanwa（括約筋がゆるむしくみ）／chikunyo（蓄尿時の神経）

   過去問（尿の生成と排泄「(3)排尿」5問＋神経の章の膀胱関連）：外尿道括約筋＝陰部神経5回／骨盤神経で排尿筋収縮4回／
   下腹神経で排尿筋弛緩・内尿道括約筋収縮3回／排尿中枢は仙髄（S2〜S4）3回／排尿筋は平滑筋1回／骨盤神経が求心路1回
   模試（尿の生成と排泄 19問）：排尿の出題なし。尿意（150〜300 mL）はユーザー判断で🎯
   内尿道括約筋の弛緩：教科書は「下腹神経の活動低下」、国試は「骨盤神経のはたらき」で問うことがあるため、骨盤神経をダミーにしない */
const PICK=5;
const GMAX={kotsuban:1,inbu:1,jiritsu:1,chusu:1,kin:1,ryo:1,kanwa:1,chikunyo:1};
function draw(){const out=[],cnt={};for(const q of shuffle(POOL)){const g=q.g;if(g&&GMAX[g]!==undefined){if((cnt[g]||0)>=GMAX[g])continue;cnt[g]=(cnt[g]||0)+1;}out.push(q);if(out.length>=PICK)break;}return out;}
const POOL=[
/* ---------- 排尿にかかわる神経（P180・図12・7） ---------- */

{g:"kotsuban",q:"排尿時に排尿筋を収縮させる神経はどれか。",kihon:true,dobon:true,
 choices:[
  ["骨盤神経",true,""],
  ["下腹神経",false,"交感神経。蓄尿時に排尿筋を弛緩させ、内尿道括約筋を収縮させる。"],
  ["陰部神経",false,"体性神経。外尿道括約筋を収縮させて排尿を抑える。"],
  ["迷走神経",false,"延髄から出る副交感神経で、心臓や胸腹部の内臓に分布する。膀胱には分布しない。"]],
 exp:"排尿反射が起こると、<b>骨盤神経</b>（副交感神経）の遠心路を通じて排尿筋が強く収縮する。（教科書 P180・図12・7）"},

{g:"inbu",q:"外尿道括約筋を収縮させて排尿を抑える神経はどれか。",kihon:true,dobon:true,
 choices:[
  ["陰部神経",true,""],
  ["骨盤神経",false,"副交感神経。排尿時に排尿筋を収縮させる。膀胱壁の緊張を中枢へ伝える求心路も通る。"],
  ["下腹神経",false,"交感神経。蓄尿時に内尿道括約筋を収縮させる。"],
  ["坐骨神経",false,"下肢の筋や皮膚に分布する神経。"]],
 exp:"横紋筋である外尿道括約筋は、<b>陰部神経</b>（体性神経）のはたらきで収縮し、排尿を抑える。（教科書 P180）"},

{g:"jiritsu",q:"蓄尿時に下腹神経がはたらくと、膀胱と尿道はどうなるか。",kihon:true,
 choices:[
  ["排尿筋が弛緩し、内尿道括約筋が収縮する",true,""],
  ["排尿筋が収縮し、内尿道括約筋が弛緩する",false,"排尿反射で起こる変化。"],
  ["排尿筋も内尿道括約筋も収縮する",false,"排尿筋が収縮すると膀胱内圧が上がり、尿を押し出す方向にはたらくので、尿をためる反射とは合わない。"],
  ["外尿道括約筋だけが収縮する",false,"陰部神経がはたらいたときの変化。"]],
 exp:"下腹神経（交感神経）は<b>排尿筋を反射性に弛緩させ、同時に内尿道括約筋を収縮させて</b>尿をためる。（教科書 P180）"},

{g:"jiritsu",q:"副交感神経の活動が高まると、膀胱はどうなるか。",kihon:true,
 choices:[
  ["排尿筋が収縮し、排尿が起こりやすくなる",true,""],
  ["排尿筋が弛緩し、尿をためやすくなる",false,"交感神経（下腹神経）の活動が高まったときの変化。"],
  ["内尿道括約筋が収縮し、尿道が閉じる",false,"交感神経（下腹神経）の活動が高まったときの変化。"],
  ["外尿道括約筋が収縮し、排尿が抑えられる",false,"体性神経（陰部神経）のはたらき。"]],
 exp:"副交感神経である骨盤神経の遠心路を通じて<b>排尿筋が強く収縮</b>し、排尿が起こる。（教科書 P180）"},

{g:"chusu",q:"排尿反射の中枢がある部位はどれか。",kihon:true,dobon:true,
 choices:[
  ["仙髄",true,""],
  ["腰髄",false,"下腹神経（交感神経）が出る高さ。蓄尿反射にかかわる。"],
  ["延髄",false,"呼吸や循環の中枢がある部位。"],
  ["視床下部",false,"体温調節や摂食・飲水の中枢がある部位。"]],
 exp:"排尿は、橋排尿中枢を介した<b>仙髄</b>排尿中枢の反射で起こる。（教科書 P180）"},

/* ---------- 排尿にかかわる筋（P179〜180） ---------- */

{g:"kin",q:"外尿道括約筋について正しいのはどれか。",kihon:true,
 choices:[
  ["横紋筋で、意識して締めることができる",true,""],
  ["平滑筋で、排尿に伴って自動的に弛緩する",false,"内尿道括約筋の性質。"],
  ["下腹神経のはたらきで収縮する",false,"下腹神経が収縮させるのは内尿道括約筋。"],
  ["排尿筋が膀胱の出口で厚くなってできている",false,"内尿道括約筋のでき方。"]],
 exp:"外尿道括約筋は<b>横紋筋</b>で、陰部神経（体性神経）に支配されるため、意識して収縮させ排尿を我慢できる。（教科書 P179〜180）"},

{g:"kin",q:"排尿筋について正しいのはどれか。",kihon:true,
 choices:[
  ["膀胱の平滑筋で、排尿時に収縮する",true,""],
  ["横紋筋で、意識して収縮させることができる",false,"外尿道括約筋の性質。"],
  ["蓄尿時に収縮して、尿が漏れないようにする",false,"内尿道括約筋のはたらき。"],
  ["陰部神経のはたらきで収縮する",false,"陰部神経が収縮させるのは外尿道括約筋。"]],
 exp:"膀胱の<b>平滑筋</b>を排尿筋と呼び、排尿時に収縮して尿を押し出す。（教科書 P179）"},

{g:"kin",q:"内尿道括約筋について正しいのはどれか。",
 choices:[
  ["排尿筋が膀胱の出口で厚くなってできた平滑筋である",true,""],
  ["横紋筋で、陰部神経に支配される",false,"外尿道括約筋の性質。"],
  ["排尿時に強く収縮する",false,"排尿筋のはたらき。"],
  ["副交感神経のはたらきで収縮する",false,"副交感神経（骨盤神経）が収縮させるのは排尿筋。"]],
 exp:"排尿筋は出口で厚くなって内尿道括約筋をつくる。<b>排尿に伴って自動的に弛緩する平滑筋</b>である。（教科書 P179）"},

/* ---------- 蓄尿（P180） ---------- */

{g:"chikunyo",q:"尿をためているとき（蓄尿時）に、遠心路の活動が高まらない神経はどれか。",kihon:true,
 choices:[
  ["骨盤神経",true,""],
  ["下腹神経",false,"蓄尿時に排尿筋を弛緩させ、内尿道括約筋を収縮させる交感神経。"],
  ["陰部神経",false,"蓄尿時に外尿道括約筋の収縮を高める体性神経。"]],

{g:"jiritsu",q:"排尿のしくみについて誤っているのはどれか。",gori:true,
 choices:[
  ["副交感神経の活動が高まると、排尿筋は弛緩する",true,""],
  ["外尿道括約筋は、陰部神経のはたらきで収縮する",false,"教科書どおりの記述なので、正しい。"],
  ["内尿道括約筋は、交感神経のはたらきで収縮する",false,"教科書どおりの記述なので、正しい。"],
  ["膀胱壁の緊張は、骨盤神経の求心路を通じて排尿中枢へ伝えられる",false,"教科書どおりの記述なので、正しい。"]],
 exp:"副交感神経（骨盤神経）がはたらくと、排尿筋は弛緩ではなく<b>強く収縮</b>する。（教科書 P180）"},

{g:"ryo",q:"膀胱にたまった尿がどのくらいの量になると、尿意を感じるか。",kihon:true,
 choices:[
  ["150〜300 mL",true,""],
  ["400〜500 mL",false,"膀胱内圧が急に上がり、排尿の準備が整う量。"],
  ["30〜50 mL",false,"実際よりかなり少ない量。"],
  ["1,000〜1,500 mL",false,"健康な成人が1日に出す尿の量に近い量。"]],
 exp:"尿がたまると膀胱内圧が上がり、<b>150〜300 mL</b>で尿意を感じる。ただし、ふつうは我慢できるので、すぐに排尿反射が起こることはない。400〜500 mLに達すると内圧が急に上がり、排尿の準備が整う。（教科書 P180）"},

{g:"ryo",q:"尿意を感じても、すぐに排尿反射が起こらないのはなぜか。",
 choices:[
  ["前頭葉や上位中枢からの抑制を受け、陰部神経が外尿道括約筋の収縮を高めるから",true,""],
  ["骨盤神経が排尿筋を強く収縮させるから",false,"排尿反射で起こる変化で、尿を押し出す方向にはたらく。"],
  ["内尿道括約筋が自動的に弛緩するから",false,"排尿に伴って起こる変化。"],
  ["膀胱壁の緊張が中枢へ伝わらないから",false,"実際には、骨盤神経の求心路を通じて伝わっている。"]],
 exp:"尿意を感じてからも、<b>上位中枢の抑制を受けて陰部神経が外尿道括約筋の収縮を高め</b>、排尿を抑える。これを蓄尿反射と呼ぶ。（教科書 P180）"},

{g:"ryo",q:"排尿が始まるきっかけはどれか。",
 choices:[

  ["下腹神経の活動が高まる",false,"蓄尿時の変化で、排尿筋を弛緩させる。"],

 exp:"尿量が400〜500 mLに達すると排尿の準備が整い、<b>大脳からの抑制を意識的に解除</b>すると排尿が始まる。（教科書 P180）"},

/* ---------- 排尿（P180） ---------- */

{g:"kanwa",q:"排尿時に内尿道括約筋が弛緩するしくみはどれか。",
 choices:[
  ["下腹神経の活動が低下する",true,""],
  ["陰部神経の活動が低下する",false,"外尿道括約筋が弛緩するしくみ。"],

  ["陰部神経の活動が高まる",false,"外尿道括約筋が収縮し、排尿を抑える変化。"]],

  ["陰部神経の活動を、意識して高める",false,"外尿道括約筋を収縮させて、排尿を我慢するはたらき。"],

  ["下腹神経の活動が低下する",false,"内尿道括約筋がゆるむしくみ。自律神経なので、意識して変えるものではない。"]],

  ["下腹神経",false,"交感神経の遠心路で、蓄尿時に排尿筋を弛緩させ、内尿道括約筋を収縮させる。"],
  ["陰部神経",false,"体性神経で、外尿道括約筋を収縮させる。"],
  ["迷走神経",false,"延髄から出る副交感神経で、心臓や胸腹部の内臓に分布する。膀胱には分布しない。"]],
 exp:"膀胱内圧が上がると、膀胱壁の緊張が<b>骨盤神経</b>の求心路を通じて排尿中枢へ伝えられる。（教科書 P180）"},

 choices:[
  ["第2〜4仙髄（S2〜S4）",true,""],

  ["第5〜7頸髄",false,"上肢に分布する神経が出る高さ。"]],
 exp:"補足知識（資料外）。脊髄の排尿中枢は<b>第2〜4仙髄（S2〜S4）</b>にある。教科書には「仙髄排尿中枢」とだけ書かれている。（教科書 P180）"},

{g:"chikunyo",q:"蓄尿について誤っているのはどれか。",gori:true,
 choices:[

  ["外尿道括約筋の収縮は、陰部神経を介して高められる",false,"教科書どおりの記述なので、正しい。"]],
 exp:"蓄尿時は、下腹神経（交感神経）によって<b>排尿筋が弛緩</b>する。骨盤神経の遠心路が排尿筋を収縮させるのは排尿時である。（教科書 P180）"},

 choices:[

 choices:[
  ["体性神経（陰部神経）のはたらきで、外尿道括約筋が収縮している",true,""],
  ["副交感神経が優位になっている",false,"副交感神経（骨盤神経）は排尿筋を収縮させ、排尿を進める。"],
  ["排尿筋が強く収縮している",false,"排尿反射のときの変化。"],
  ["内尿道括約筋が弛緩している",false,"排尿に伴って起こる変化。"]],
 exp:"排尿を我慢するときは、<b>陰部神経（体性神経）のはたらきで外尿道括約筋を収縮</b>させる。（教科書 P180）"},

{g:"jiritsu",q:"排尿にかかわる神経とその種類の組合せで正しいのはどれか。",kihon:true,
 choices:[
  ["下腹神経 ― 交感神経",true,""],
  ["骨盤神経 ― 交感神経",false,"骨盤神経は副交感神経。"],

{g:"chusu",q:"排尿反射で、仙髄の排尿中枢とともにはたらく脳の排尿中枢がある部位はどれか。",
 choices:[
  ["橋",true,""],
  ["延髄",false,"呼吸や循環の中枢がある部位。"],
  ["視床下部",false,"体温調節や摂食・飲水の中枢がある部位。"],
  ["小脳",false,"運動の調節にかかわる部位。"]],
 exp:"排尿は、<b>橋</b>排尿中枢を介した仙髄排尿中枢の反射で起こる。蓄尿のときは、前頭葉や上位中枢からの抑制も受ける。（教科書 P180）"},

];

let mode="normal", drawn=[], idx=0, score=0, streak=0, answered=false, dead=false;
let qmiss=0, totalMiss=0, firstTryCount=0; // ミス回数の集計（通常モード）
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function home(){
  document.getElementById("htt").textContent="確認テスト";
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="0";
  document.getElementById("bd").innerHTML=`
    <div class="center">
      <p class="lead">モードを選んでスタート。<br>問題は毎回シャッフルされ、プール${POOL.length}問から${PICK}問が出題されます。</p>
      <div class="modes">
        <button class="mode" onclick="start('normal')">
          <div class="nm">通常モード</div>
          <div class="ds">${PICK}問を最後まで解いて採点します。ふだんの確認用。<span class="mark kihon" style="margin-left:4px">🎯基本</span> は落としちゃダメな基本問題、<span class="mark gori">⚠ 誤りを選ぶ</span> は誤っているものを選ぶ問題、<span class="mark hosoku">📘 補足（資料外）</span> は教科書外の国試頻出テーマ。</div>
        </button>
        <button class="mode dob" onclick="start('dobon')">
          <div class="nm">💣 ドボンチャレンジ</div>
          <div class="ds">プールの中のごく一部、<b>絶対に落とせない最重要問題</b>だけが <b>💣ドボン！</b> に変身。それを外したらそこで終了。どこまで正解を続けられるか挑戦！</div>
        </button>
      </div>
    </div>`;
  document.getElementById("ctrl").innerHTML="";
}
function start(m){
  mode=m; drawn=draw();
  idx=0;score=0;streak=0;dead=false;totalMiss=0;firstTryCount=0;render();
}
function render(){
  answered=false; qmiss=0;
  const item=drawn[idx];
  const opts=shuffle(item.choices);
  const isDob=(mode==="dobon" && item.dobon);
  document.getElementById("htt").textContent=(mode==="dobon")?"ドボンチャレンジ":"確認テスト";
  document.getElementById("pg").textContent=`問 ${idx+1} / ${drawn.length}`;
  document.getElementById("bar").style.width=(idx/drawn.length*100)+"%";
  const L=["ア","イ","ウ","エ","オ"];
  let markHtml = isDob ? `<span class="mark dobon">💣 ドボン！</span>`
                       : (item.kihon ? `<span class="mark kihon">🎯 基本</span>` : "");
  if(item.gori)   markHtml += `<span class="mark gori">⚠ 誤りを選ぶ</span>`;
  if(item.hosoku) markHtml += `<span class="mark hosoku">📘 補足（資料外）</span>`;
  const qText = item.gori ? item.q.replace("誤っている",'<span class="ng">誤っている</span>') : item.q;
  let h=`<div class="qnum">Q${idx+1} ${markHtml}</div><div class="q">${qText}</div><div class="opts">`;
  opts.forEach((o,i)=>{h+=`<button class="opt" onclick="pick(this,${o[1]})"><span class="mk">${L[i]}</span><span>${o[0]}</span></button>`;});
  h+=`</div><div class="exp" id="exp"><div class="vd" id="vd"></div><div class="tx" id="tx"></div></div>`;
  document.getElementById("bd").innerHTML=h;
  document.getElementById("ctrl").innerHTML=`<button class="btn" id="nx" onclick="next()" disabled>解答を選んでください</button>`;
}
function pick(el,ok){
  if(answered)return;
  if(el.classList.contains("dis"))return;
  const item=drawn[idx];
  const isDob=(mode==="dobon" && item.dobon);
  const selText=el.querySelector("span:last-child").textContent;
  const selChoice=item.choices.find(c=>c[0]===selText);
  const exp=document.getElementById("exp");
  const nx=document.getElementById("nx");

  if(ok){
    answered=true;
    el.classList.add("correct");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    score++;
    if(mode!=="dobon"){ if(qmiss===0) firstTryCount++; }
    if(mode==="dobon") streak++;
    exp.className="exp show ok";
    document.getElementById("vd").textContent="正解！";
    document.getElementById("tx").innerHTML=item.exp;
    nx.disabled=false;
    nx.textContent=(idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶";
    return;
  }

  if(mode==="dobon"){
    answered=true;
    el.classList.add("wrong");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    if(item.dobon){ dead=true; }
    exp.className="exp show ng";
    document.getElementById("vd").textContent=isDob?"💣 ドボン！":"不正解";
    document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}`;
    nx.disabled=false;
    nx.textContent=dead?"結果を見る（ドボン）▶":((idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶");
    return;
  }

  qmiss++; totalMiss++;
  el.classList.add("wrong","dis");
  exp.className="exp show ng";
  document.getElementById("vd").textContent="不正解（ミス "+qmiss+"回）";
  document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}<br>ほかの選択肢からもう一度選んでください。`;
}
function next(){
  if(dead){result();return;}
  if(idx+1<drawn.length){idx++;render();}
  else result();
}
function result(){
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="100%";
  if(mode==="dobon"){
    document.getElementById("htt").textContent="結果";
    if(dead){
      document.getElementById("bd").innerHTML=`<div class="center score dead">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>ドボンを踏んでしまいました</div>
        <div class="big">${streak} 問連続正解</div>
        <div class="msg">${idx}問正解のあと、${idx+1}問目でドボン。<br>上の解説を復習して再挑戦しましょう。</div>
      </div>`;
    }else{
      document.getElementById("bd").innerHTML=`<div class="center score">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>クリア！</div>
        <div class="big">${score} / ${drawn.length}</div>
        <div class="msg">ドボンを踏まず完走しました。お見事！</div>
      </div>`;
    }
  }else{
    document.getElementById("htt").textContent="結果";
    const n=drawn.length;
    const ftPct=Math.round(firstTryCount/n*100);
    const noMiss=(totalMiss===0);
    let head = noMiss
      ? `<div class="big">✨ ノーミス パーフェクト！</div><div>全 ${n} 問を一発で正解</div>`
      : `<div>今回の成績</div><div class="big">${firstTryCount} / ${n}</div><div>一発正解率 ${ftPct}%</div>`;
    let stat = `<div class="stats">一発正解 ${firstTryCount}問　｜　総ミス ${totalMiss}回</div>`;
    let msg = noMiss?"完璧です。この調子！":ftPct>=60?"よくできました。ミスした問題を復習しましょう。":"もう一度スライドで確認してから挑戦しましょう。";
    document.getElementById("bd").innerHTML=`<div class="center score">${head}${stat}<div class="msg">${msg}</div></div>`;
  }
  document.getElementById("ctrl").innerHTML=`<button class="btn sub" onclick="home()">モード選択へ</button><button class="btn" onclick="start(mode)">もう一度（シャッフル）▶</button>`;
}
home();
</script>
</body>
</html>
