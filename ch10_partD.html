<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第10章 循環 パートD｜生理学スライド</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:#f0f2f5;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 12px}
h1{font-size:14px;color:#555;margin-bottom:16px;font-weight:400;letter-spacing:.05em}
.slide{width:100%;max-width:820px;background:#fff;border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,.10);overflow:hidden}
.hd{background:#8c2a2a;padding:14px 28px}
.hd .ch{font-size:11px;color:#f0c4c4;font-weight:500;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.hd .tt{font-size:20px;font-weight:500;color:#fff}
.bd{padding:20px 28px 16px;background:#fff}
.sec{font-size:10px;font-weight:600;color:#888;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.box{background:#f8f9fb;border:1px solid #e5e7eb;border-radius:8px;padding:14px 18px;margin-bottom:12px}
.row{display:block;font-size:14px;line-height:1.9;color:#222;padding:5px 0;border-bottom:1px solid #e5e7eb}
.row:last-child{border-bottom:none}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#8c2a2a;color:#fff;padding:8px 10px;font-weight:500;text-align:left;font-size:12px}
.tbl td{padding:8px 10px;border-bottom:1px solid #e5e7eb;vertical-align:top;color:#222;line-height:1.7}
.tbl tr:last-child td{border-bottom:none}
.tbl td:first-child{font-weight:600;color:#8c2a2a;white-space:nowrap;min-width:110px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:4px;margin-bottom:7px}
.tf{background:rgba(140,42,42,.12);color:#8c2a2a}
.tb{background:rgba(42,90,140,.12);color:#2a5a8c}
.blank{display:inline-block;min-width:72px;border-bottom:2.5px solid #8c2a2a;border-radius:3px 3px 0 0;cursor:pointer;text-align:center;padding:0 5px;transition:all .22s;position:relative;vertical-align:baseline}
.blank::after{content:"？";font-size:12px;color:#8c2a2a;opacity:.45;position:absolute;left:50%;transform:translateX(-50%)}
.blank span{visibility:hidden;font-weight:600;color:#8c2a2a;font-size:14px;opacity:0;transition:opacity .22s;display:inline-block}
.blank.on{border-bottom-color:transparent;background:rgba(140,42,42,.1);border-radius:4px;padding:1px 7px}
.blank.on::after{display:none}
.blank.on span{visibility:visible;opacity:1}
.blank:not(.on):hover{background:rgba(140,42,42,.07)}
.ctrl{display:flex;align-items:center;gap:8px;padding:10px 28px 12px;background:#f8f9fb;border-top:1px solid #e5e7eb;flex-wrap:wrap}
.btn{padding:7px 15px;border-radius:6px;border:1px solid #d1d5db;background:#fff;color:#333;font-size:12px;cursor:pointer;font-family:inherit;transition:background .15s}
.btn:hover{background:#f0f2f5}
.btnp{background:#8c2a2a;color:#fff;border-color:#8c2a2a}
.btnp:hover{background:#6f2020}
.cnt{font-size:11px;color:#888;margin-left:auto}
.nav{display:flex;align-items:center;gap:7px;padding:9px 28px 11px;background:#f8f9fb;border-top:1px solid #e5e7eb;border-radius:0 0 12px 12px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:#d1d5db;cursor:pointer;transition:background .18s;flex-shrink:0}
.dot.a{background:#8c2a2a}
.pg{font-size:11px;color:#888;margin-left:auto}
</style>
</head>
<body>
<h1>生理学 第10章 循環｜パートD：血管（交換血管・容量血管）・リンパ系</h1>
<div class="slide">
  <div id="sc"></div>
  <div class="ctrl">
    <button class="btn" onclick="nxt()">次のカッコを開く ▶</button>
    <button class="btn" onclick="showAll()">すべて表示</button>
    <button class="btn" onclick="rst()">リセット</button>
    <button class="btn btnp" onclick="go(cur-1)">◀ 前へ</button>
    <button class="btn btnp" onclick="go(cur+1)">次へ ▶</button>
    <span class="cnt" id="cnt"></span>
  </div>
  <div class="nav" id="nav"></div>
</div>
<script>
const S=[
{t:"交換血管（毛細血管）",ch:"第10章 循環 ｜ B-3 交換血管",type:"p",
rows:[
"1層の扁平な [内皮細胞] とそれを取り巻く [基底膜] よりなる細い管である（図10・7）．",
"血管壁は薄く，孔があり，また血液の流速も [遅く]，物質の交換に適しているため [交換血管] と呼ばれる．",
"物質の交換は [拡散] と [限外濾過] により生じる．",
"【拡散】拡散で移動する物質：水，[酸素]，炭酸ガス，尿素，[グルコース] など．",
"移動速度は，血液と組織液間の [濃度差] と，毛細血管壁のその物質に対する [透過性] によって決まる．",
]},
{t:"限外濾過と膠質浸透圧",ch:"第10章 循環 ｜ B-3 交換血管",type:"p",
rows:[
"[タンパク質] などの高分子物質は血管壁の孔を通過できないが，低分子物質は水とともに孔を通過し移動する．これを [限外濾過] と呼ぶ（図10・10）．",
"毛細血管壁に作用する圧には，[静水圧] と [浸透圧] がある．",
"電解質等の低分子による [晶質浸透圧] は，晶質が血管内外を移動し平衡に達する．",
"タンパク質のような高分子物質は毛細血管壁を通過しにくいため浸透圧差を生じ，これを [膠質浸透圧] と呼ぶ．",
"[血漿膠質浸透圧] は，[アルブミン] などのタンパク質が通過しないために生じる圧力であり，体液を組織側から [血管内側] に移動させる力となる．",
]},
{t:"毛細血管での濾過と再吸収",ch:"第10章 循環 ｜ B-3 交換血管",type:"two",
left:{label:"細動脈側：濾過",rows:[
"静水圧（毛細血管圧と組織圧の差）が膠質浸透圧より [大きい]．",
"そのため，血管内から組織側に血漿の [濾過] が生じる．",
]},
right:{label:"細静脈側：再吸収",rows:[
"静水圧が膠質浸透圧より [小さい]．",
"そのため，組織液は血管内に [再吸収] される．",
"濾過された体液は，静脈側で再吸収される経路と [リンパ系] より血管内へ入る経路により心臓に還流する（図10・14）．",
]}},
{t:"容量血管（静脈）",ch:"第10章 循環 ｜ B-4 容量血管",type:"p",
rows:[
"静脈系は毛細血管の細静脈側から始まり，細静脈，中静脈，大静脈となり，最終的には [右心房] につながる．",
"動脈と同様に3層からなるが，高い圧を受けないので [中膜] が薄く [弾性線維] が少ない．",
"血管壁は動脈壁に比べて薄く，かつ [伸展性] がよいため，多量の血液を保持できる（図10・11）．",
"図10・11：血液が少ないと断面は [扁平]，増えると楕円から円型に変わるが内圧の上昇は [少ない]．",
"静脈系は別名 [容量血管] と呼ばれ，循環血液量の [60〜75%] の血液を保持している．",
"中静脈の内膜には [静脈弁] が発達し，血液が心臓側に流れるように働く．",
"静脈系は，心臓に還る血液量（[静脈還流量]）を調節する役割を担う．",
]},
{t:"静脈還流量に影響を与える因子",ch:"第10章 循環 ｜ B-4 容量血管",type:"tbl",
cols:["因子","内容"],
rows:[
["① 交感神経性調節","中膜の平滑筋は [交感神経] の支配を受ける．活動増加で静脈壁の緊張は増し，静脈内容量は [減少] するため静脈還流量が [増加] する．"],
["② 筋肉のポンプ作用","筋肉が収縮すると静脈が圧迫され，血液は中枢側に押し出される．[静脈弁] があるため逆流しない．別名 [第二の心臓]（図10・12）．"],
["③ 呼吸のポンプ作用","吸息時：[胸腔内圧] は低下し，横隔膜の下降で [腹腔内圧] が上昇 → 静脈還流量は [増大]．呼息時は低下する．"],
["（呼吸の注意点）","胸腔内圧が高くなりすぎると還流量は著しく低下する．ウェイトトレーニング時に [息を止めない] のはこのため．"],
["④ 重力の影響","仰臥位 → 立位：下肢の静脈圧が増加し，静脈内の血液量が増え，静脈還流量は [減少] する．仰臥位で下肢を上げると [増加] する．"],
]},
{t:"リンパ系とリンパ管の解剖",ch:"第10章 循環 ｜ C リンパ系",type:"p",
rows:[
"[リンパ] はリンパ管内を流れる液体で，毛細血管から濾過された組織液の一部がリンパ管から [静脈] に還流する．",
"リンパ管の末端（[リンパ毛細管]）は組織間にあり，毛細血管壁を通過した組織液の一部が入る．",
"下肢，腹部および左上半身のリンパ液は，[左静脈角]（左内頸静脈と左鎖骨下静脈の接合部）付近で静脈に注ぐ．",
"右上半身のリンパ管は，[右静脈角]（右内頸静脈と右鎖骨下静脈の接合部）付近で静脈に入る．",
"図10・13：左上半身・両下半身・腹腔臓器からのリンパは [乳び槽] から [胸管] に運ばれる．",
"リンパ管には [弁] が多数あり，リンパ液は静脈側へと一定方向に流れる．",
]},
{t:"リンパの流れ",ch:"第10章 循環 ｜ C リンパ系",type:"p",
rows:[
"ヒトのリンパ流量は，約 [2〜4L/日] である（図10・14）．",
"図10・14（水）：濾過 20L − 再吸収 16〜18L ＝ リンパ流量 2〜4L/日．",
"リンパ管を介して血管内に戻される [タンパク質] 量は75〜195g/日にも及ぶ．",
"リンパ系は，[血漿量] と [血漿タンパク質] の維持機構として重要である．",
"[受動的リンパ輸送] 機構：リンパ管を外的な圧力で圧迫しリンパ流を生じる．圧迫因子は筋肉運動，[呼吸運動]，消化管運動，動脈の拍動など．",
"[能動的リンパ輸送] 機構：リンパ管自身が収縮しリンパを輸送する．",
"食後は [腸] 由来のリンパが増加する．",
]},
{t:"リンパの役割",ch:"第10章 循環 ｜ C リンパ系",type:"p",
rows:[
"リンパは，感染・炎症反応時の組織間隙の [滲出液]，異物の排除を行う．",
"[免疫グロブリン] やがん細胞の輸送にもリンパ系が主要経路となる．",
"主幹リンパ管には [リンパ節] が存在する．",
"リンパ節の [細網内皮細胞] は，侵入異物を貪食し血液内に入れない [フィルター] の役目をする．",
"リンパ管炎・リンパ管閉塞などで流れが阻害されると，組織間に体液が貯留し [浮腫] を生じる．",
"リンパ系はがん細胞の体内移動経路となるため，リンパ節には [がん転移] が多い．",
]},
{t:"パートDまとめ",ch:"第10章 循環 ｜ パートDまとめ",type:"tbl",
cols:["項目","内容"],
rows:[
["毛細血管","内皮細胞＋基底膜．物質交換は [拡散] と [限外濾過]"],
["血漿膠質浸透圧","[アルブミン] などによる．体液を血管内へ引き込む力"],
["細動脈側／細静脈側","静水圧＞膠質浸透圧で [濾過]／静水圧＜膠質浸透圧で [再吸収]"],
["静脈","容量血管．循環血液量の [60〜75%] を保持．静脈弁あり"],
["還流量が増える","交感神経活動増加，[筋肉のポンプ]（第二の心臓），[吸息] 時，仰臥位で下肢挙上"],
["還流量が減る","呼息時，胸腔内圧の過度な上昇，[立位]"],
["リンパの合流","下肢・腹部・左上半身 → [左静脈角]／右上半身 → 右静脈角"],
["リンパ流量","約 [2〜4L/日]．タンパク質75〜195g/日を血管内へ戻す"],
["リンパ節","[細網内皮細胞] が異物を貪食（フィルター）"],
]}
];
let cur=0,bs=[];
function bl(id,ans){return `<span class="blank" id="${id}" onclick="rb('${id}')"><span>${ans}</span></span>`;}
function fill(t){return t.replace(/\[([^\[\]]+)\]/g,(m,a)=>{const id="b"+bs.length;bs.push({id,on:false});return bl(id,a);});}
function buildSlide(i){
  const s=S[i];bs=[];
  let h=`<div class="hd"><div class="ch">${s.ch}</div><div class="tt">${s.t}</div></div><div class="bd">`;
  if(s.type==="p"){
    h+=`<div class="sec">重要事項</div><div class="box">`;
    s.rows.forEach(r=>{h+=`<span class="row">${fill(r)}</span>`;});
    h+=`</div>`;
  }else if(s.type==="tbl"){
    h+=`<div class="sec">重要事項</div><div class="box" style="padding:0;overflow:hidden"><table class="tbl"><thead><tr>`;
    s.cols.forEach(c=>h+=`<th>${c}</th>`);
    h+=`</tr></thead><tbody>`;
    s.rows.forEach(row=>{h+=`<tr>`;row.forEach(cell=>{h+=`<td>${fill(cell)}</td>`;});h+=`</tr>`;});
    h+=`</tbody></table></div>`;
  }else if(s.type==="two"){
    h+=`<div class="two">`;
    ["left","right"].forEach(side=>{
      const d=s[side];const tc=side==="left"?"tf":"tb";
      h+=`<div class="box"><span class="tag ${tc}">${d.label}</span>`;
      d.rows.forEach(r=>{h+=`<p style="font-size:13px;line-height:1.8;border-bottom:1px solid #e5e7eb;padding:4px 0">${fill(r)}</p>`;});
      h+=`</div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;
  document.getElementById("sc").innerHTML=h;
  upd();bldNav();
}
function rb(id){const b=bs.find(x=>x.id===id);if(b&&!b.on){b.on=true;document.getElementById(id).classList.add("on");}upd();}
function nxt(){const u=bs.find(x=>!x.on);if(u)rb(u.id);}
function showAll(){bs.forEach(b=>rb(b.id));}
function rst(){bs.forEach(b=>{b.on=false;const el=document.getElementById(b.id);if(el)el.classList.remove("on");});upd();}
function upd(){const d=bs.filter(x=>x.on).length;document.getElementById("cnt").textContent=d+"/"+bs.length+" 表示済み";}
function go(i){if(i>=0&&i<S.length){cur=i;buildSlide(cur);}}
function bldNav(){
  let h="";
  S.forEach((_,i)=>h+=`<div class="dot${i===cur?" a":""}" onclick="go(${i})"></div>`);
  h+=`<span class="pg">${cur+1} / ${S.length}</span>`;
  document.getElementById("nav").innerHTML=h;
}
buildSlide(0);
</script>
</body>
</html>
