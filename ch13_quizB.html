   choices: [表示文, 正解フラグ, その選択肢が何かの説明]
   kihon :true … 🎯基本　dobon :true … 💣ドボン　gori :true … ⚠誤りを選ぶ　hosoku:true … 📘補足（資料外）
   g … 出題グループ（GMAXで1回の出題数を制限）
     kiso＝基礎代謝（上限2）／tosin＝糖新生の材料（上限2）／cori＝コリ回路（上限1）／keton＝ケトン体まわり（上限1）
     tanpaku＝タンパク質代謝の理由（上限1）／beta＝β酸化（上限1）／rq＝呼吸商の値（上限1）
   過去問での出題回数（過去問集6章＋宅ドリル便）：基礎代謝 約10回／呼吸商 5回／β酸化 4回／特異動的作用 4回／
   糖新生 3回／食後の血糖・インスリン・グルカゴン 3回／尿素 3回 */
const PICK=5;
const GMAX={kiso:2,tosin:2,cori:1,keton:1,tanpaku:1,beta:1,rq:1};
const POOL=[

/* ---------- C-1 糖質の代謝（P192） ---------- */

{q:"体内でもっとも多くグリコーゲンが蓄えられている部位はどれか。",
 choices:[
  ["骨格筋",true,""],
  ["肝臓",false,"約100gのグリコーゲンを蓄え、空腹時に分解して血糖値を保つ。"],
  ["脳",false,"体重の約2％で、全身の酸素の約20％を消費する臓器。"],
  ["脂肪組織",false,"過剰なグルコースをトリグリセリドとして貯蔵する。"]],
 exp:"糖質は肝臓に約100g、<b>筋に約300g</b>で、体重の1％にも満たない。このことから、摂取された糖質は活発に代謝されているとわかる。（教科書 P192）"},

{q:"食後に骨格筋へのグルコースの取り込みを促進するホルモンはどれか。",kihon:true,
 choices:[
  ["インスリン",true,""],
  ["グルカゴン",false,"空腹時に分泌され、グリコーゲン分解を促す。"],
  ["アドレナリン",false,"運動時に筋のグリコーゲン分解を促す。"],
  ["抗利尿ホルモン",false,"腎臓で水の再吸収を促す。"]],
 exp:"食後の<b>インスリン</b>濃度の上昇に伴い、骨格筋へのグルコースの取り込みが促進され、グリコーゲンとして蓄えられる。（教科書 P192）"},

{q:"空腹時に肝臓で促進される反応の組合せはどれか。",kihon:true,
 choices:[
  ["グリコーゲン分解と糖新生",true,""],
  ["解糖系とグリコーゲン合成",false,"食後に肝臓で促進される組合せ。"],
  ["グリコーゲン合成と糖新生",false,"グリコーゲン合成は食後に促進される。"],
  ["解糖系とグリコーゲン分解",false,"解糖系は食後に促進される。"]],
 exp:"空腹時の肝臓では<b>グリコーゲン分解と糖新生</b>が促進されて、血糖値が維持される。（教科書 P192）"},

{q:"運動時に骨格筋のグリコーゲン分解を促すホルモンはどれか。",
 choices:[
  ["アドレナリン",true,""],
  ["インスリン",false,"筋へのグルコース取り込みと、グリコーゲンとしての蓄積を促す。"],
  ["抗利尿ホルモン",false,"腎臓で水の再吸収を促す。"],
  ["カルシトニン",false,"血中カルシウム濃度を下げる。"]],
 exp:"運動時には<b>アドレナリン</b>やグルカゴンでグリコーゲンが分解され、グルコースがエネルギー源として利用される。（教科書 P192）"},

{q:"脳が通常、唯一のエネルギー源としているのはどれか。",kihon:true,dobon:true,

  ["ケトン体",false,"絶食が続いたときに脳が利用するようになる。"],
  ["アミノ酸",false,"飢餓時に糖新生の材料になる。"]],
 exp:"脳は通常<b>グルコース</b>を唯一のエネルギー源としている。睡眠中も覚醒時と同じくらいのエネルギーを消費する。（教科書 P192）"},

{g:"keton",q:"絶食が続いたときに、脳がエネルギー源として利用するようになるのはどれか。",
 choices:[
  ["ケトン体",true,""],
  ["脂肪酸",false,"ミトコンドリアでβ酸化される、脂質の構成成分。"],
  ["尿素",false,"アミノ基の窒素から肝臓でつくられる。"],
  ["グリセロール",false,"トリグリセリドの分解で生じ、糖新生に使われる。"]],
 exp:"<b>ケトン体</b>は、脂肪酸がβ酸化されてできたアセチルCoAから、肝臓でつくられる（補足）。インスリンが作用しない糖尿病では、細胞がグルコースを使えずに脂肪分解が進む。するとケトン体が増えて血液が酸性に傾く。これが<b>糖尿病性ケトアシドーシス</b>。（教科書 P192）"},

{q:"脳が消費する酸素は、全身の約何％か。",

  ["約20％",true,""],
  ["約2％",false,"脳の重さが体重に占める割合。"],
  ["約10％",false,"実際の値より少ない。"],
  ["約50％",false,"実際の値より多い。"]],
 exp:"脳は体重の約2％にすぎないが、全身で使う酸素の<b>約20％</b>を消費する。（教科書 P192）"},

{q:"ミトコンドリアをもたず、解糖系だけでエネルギーを得る細胞はどれか。",kihon:true,
 choices:[
  ["成熟した赤血球",true,""],
  ["骨格筋細胞",false,"ミトコンドリアをもち、好気的代謝も行う。"],
  ["肝細胞",false,"ミトコンドリアをもち、糖新生も行う。"],
  ["神経細胞",false,"ミトコンドリアをもち、グルコースを好気的に代謝する。"]],
 exp:"<b>成熟した赤血球</b>にはミトコンドリアがないため、解糖系でエネルギーを得る。生じた乳酸は血中に放出される。（教科書 P192）"},

/* ---------- C-1f 糖新生（P192〜193） ---------- */

{q:"糖新生とはどれか。",kihon:true,dobon:true,
 choices:[
  ["糖質以外の物質からグルコースを合成すること",true,""],
  ["グリコーゲンを分解してグルコースをつくること",false,"グリコーゲン分解。"],
  ["グルコースからグリコーゲンを合成すること",false,"グリコーゲン合成。"],
  ["グルコースをピルビン酸に分解すること",false,"解糖系。"]],
 exp:"<b>糖新生</b>とは、糖質以外の物質からグルコースが合成されること。絶食などで肝臓のグリコーゲンが枯渇すると行われる。（教科書 P192）"},

{q:"糖新生が行われる臓器の組合せはどれか。",kihon:true,
 choices:[
  ["肝臓と腎臓",true,""],
  ["肝臓と骨格筋",false,"骨格筋はグリコーゲンを蓄える場所。"],
  ["骨格筋と脂肪組織",false,"脂肪組織はトリグリセリドを蓄える場所。"],
  ["脳と腎臓",false,"脳はグルコースを使う側の臓器。"]],
 exp:"糖新生は<b>肝臓と腎臓</b>で行われる。骨格筋はグリコーゲンを蓄えるが、糖新生は行わない。（教科書 P192）"},

{g:"tosin",q:"糖新生の材料になるのはどれか。",kihon:true,dobon:true,
 choices:[
  ["アミノ酸",true,""],
  ["グリコーゲン",false,"分解されてグルコースになるが、これは糖新生ではない。"],
  ["尿素",false,"アミノ基の窒素から肝臓で合成され、尿中に排泄される。"],
  ["コレステロール",false,"ステロイドホルモンや胆汁酸の材料。"]],
 exp:"糖新生には<b>アミノ酸</b>・乳酸・グリセロールが使われる。（教科書 P192）"},

{g:"tosin",q:"糖新生の材料になるのはどれか。",kihon:true,
 choices:[
  ["乳酸",true,""],
  ["グリコーゲン",false,"分解されてグルコースになるが、これは糖新生ではない。"],
  ["尿素",false,"アミノ基の窒素から肝臓で合成され、尿中に排泄される。"],
  ["脂肪酸",false,"β酸化でアセチルCoAになり、エネルギー源として使われる。"]],
 exp:"激しい運動で筋に生じた<b>乳酸</b>は肝臓へ運ばれ、糖新生でグルコースになる。（教科書 P192）"},

{g:"tosin",q:"糖新生の材料になるのはどれか。",
 choices:[
  ["グリセロール",true,""],
  ["グリコーゲン",false,"分解されてグルコースになるが、これは糖新生ではない。"],
  ["コレステロール",false,"ステロイドホルモンや胆汁酸の材料。"],
  ["尿素",false,"アミノ基の窒素から肝臓で合成される。"]],

{g:"keton",q:"糖新生の材料の約90％を占めるのはどれか。",
 choices:[
  ["糖原性アミノ酸の炭素骨格",true,""],
  ["乳酸",false,"激しい運動時に筋で生じ、コリ回路で肝臓へ運ばれる。"],
  ["グリセロール",false,"トリグリセリドの加水分解で生じる。"],
  ["ケトン体",false,"絶食が続くと脳が利用するようになる。"]],
 exp:"糖新生の90％は<b>糖原性アミノ酸</b>の炭素骨格、10％は乳酸とグリセロールが使われる。アミノ酸には糖原性のほかに、グルコースにならないケト原性アミノ酸もある。（教科書 P192）"},

{g:"keton",q:"代謝されてアセチルCoAやケトン体になり、グルコースの材料にならないアミノ酸を何と呼ぶか。",hosoku:true,
 choices:[
  ["ケト原性アミノ酸",true,""],
  ["糖原性アミノ酸",false,"炭素骨格が糖新生でグルコースになるアミノ酸。"],

  ["非必須アミノ酸",false,"体内で合成できるアミノ酸。"]],
 exp:"補足知識（資料外）。<b>ケト原性アミノ酸</b>はアセチルCoAになって、クエン酸回路でエネルギー源になるか、ケトン体や脂肪酸になる。ロイシンとリシンはケト原性だけのアミノ酸。糖原性とケト原性の両方の性質をもつアミノ酸もある。"},

{g:"cori",q:"コリ回路で、筋から肝臓へ運ばれるのはどれか。",kihon:true,dobon:true,

  ["アラニン",false,"グルコース-アラニン回路で筋から肝臓へ運ばれる。"],

{g:"cori",q:"コリ回路で、乳酸はどこからどこへ運ばれるか。",
 choices:[

  ["肝臓から筋へ",false,"コリ回路でグルコースが運ばれる向き。"],

{g:"cori",q:"コリ回路で、肝臓に運ばれた乳酸はどうなるか。",

  ["糖新生でグルコースになり、筋へ戻る",true,""],

  ["β酸化されてアセチルCoAになる",false,"脂肪酸がたどる経路。"],

/* ---------- C-2 タンパク質の代謝（P193） ---------- */

{q:"体タンパク質の代謝が速い組織と遅い組織の組合せはどれか。",
 choices:[

  ["速い：骨格筋 ／ 遅い：肝臓",false,"速さが逆。"],

 choices:[

  ["同性・同年齢では女性のほうが高い",false,"男性のほうが高い。"],
  ["飢餓によって上昇する",false,"飢餓では低下する。"]],
 exp:"補足知識（資料外）。基礎代謝量は乳幼児期から<b>思春期に高く</b>、加齢とともに低下する。"},

{g:"keton",q:"脂肪分解が過剰になったときに、血中に増えるのはどれか。",hosoku:true,
 choices:[
  ["ケトン体",true,""],
  ["尿素",false,"アミノ基の窒素から肝臓で合成される。"],
  ["アルブミン",false,"もっとも多い血漿タンパク質。"],
  ["アンモニア",false,"アミノ酸のアミノ基から生じる。"]],
 exp:"補足知識（資料外）。脂肪酸の分解が過剰になるとアセチルCoAが余り、肝臓で<b>ケトン体</b>がつくられる。増えすぎるとケトアシドーシスになる。"},

];

let mode="normal", drawn=[], idx=0, score=0, streak=0, answered=false, dead=false;
let qmiss=0, totalMiss=0, firstTryCount=0; // ミス回数の集計（通常モード）
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function draw(){const out=[],cnt={};for(const q of shuffle(POOL)){const g=q.g;if(g&&GMAX[g]!==undefined){if((cnt[g]||0)>=GMAX[g])continue;cnt[g]=(cnt[g]||0)+1;}out.push(q);if(out.length>=PICK)break;}return out;}
function home(){
  document.getElementById("htt").textContent="確認テスト";
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="0";
  document.getElementById("bd").innerHTML=`
    <div class="center">
      <p class="lead">モードを選んでスタート。<br>問題は毎回シャッフルされ、プール${POOL.length}問から${PICK}問が出題されます。</p>
      <div class="modes">
        <button class="mode" onclick="start('normal')">
          <div class="nm">通常モード</div>
          <div class="ds">${PICK}問を最後まで解いて採点します。ふだんの確認用。<span class="mark kihon" style="margin-left:4px">🎯基本</span> は落としちゃダメな基本問題、<span class="mark gori">⚠ 誤りを選ぶ</span> は誤っているものを選ぶ問題、<span class="mark hosoku">📘 補足（資料外）</span> は教科書外の国試頻出テーマ。</div>
        </button>
        <button class="mode dob" onclick="start('dobon')">
          <div class="nm">💣 ドボンチャレンジ</div>
          <div class="ds">プールの中のごく一部、<b>絶対に落とせない最重要問題</b>だけが <b>💣ドボン！</b> に変身。それを外したらそこで終了。どこまで正解を続けられるか挑戦！</div>
        </button>
      </div>
    </div>`;
  document.getElementById("ctrl").innerHTML="";
}
function start(m){
  mode=m; drawn=draw();
  idx=0;score=0;streak=0;dead=false;totalMiss=0;firstTryCount=0;render();
}
function render(){
  answered=false; qmiss=0;
  const item=drawn[idx];
  const opts=shuffle(item.choices);
  const isDob=(mode==="dobon" && item.dobon);
  document.getElementById("htt").textContent=(mode==="dobon")?"ドボンチャレンジ":"確認テスト";
  document.getElementById("pg").textContent=`問 ${idx+1} / ${drawn.length}`;
  document.getElementById("bar").style.width=(idx/drawn.length*100)+"%";
  const L=["ア","イ","ウ","エ","オ"];
  // ドボン対象の問題だけ💣に変わる。それ以外の🎯基本は通常どおり🎯のまま表示する
  let markHtml = isDob ? `<span class="mark dobon">💣 ドボン！</span>`
                       : (item.kihon ? `<span class="mark kihon">🎯 基本</span>` : "");
  if(item.gori)   markHtml += `<span class="mark gori">⚠ 誤りを選ぶ</span>`;
  if(item.hosoku) markHtml += `<span class="mark hosoku">📘 補足（資料外）</span>`;
  // 誤り選択問題は、設問中の「誤っている」を色付きにして読み飛ばしを防ぐ
  const qText = item.gori ? item.q.replace("誤っている",'<span class="ng">誤っている</span>') : item.q;
  let h=`<div class="qnum">Q${idx+1} ${markHtml}</div><div class="q">${qText}</div><div class="opts">`;
  opts.forEach((o,i)=>{h+=`<button class="opt" onclick="pick(this,${o[1]})"><span class="mk">${L[i]}</span><span>${o[0]}</span></button>`;});
  h+=`</div><div class="exp" id="exp"><div class="vd" id="vd"></div><div class="tx" id="tx"></div></div>`;
  document.getElementById("bd").innerHTML=h;
  document.getElementById("ctrl").innerHTML=`<button class="btn" id="nx" onclick="next()" disabled>解答を選んでください</button>`;
}
function pick(el,ok){
  if(answered)return;
  if(el.classList.contains("dis"))return; // 無効化済みの選択肢は再カウントしない
  const item=drawn[idx];
  const isDob=(mode==="dobon" && item.dobon);
  const selText=el.querySelector("span:last-child").textContent;
  const selChoice=item.choices.find(c=>c[0]===selText);
  const exp=document.getElementById("exp");
  const nx=document.getElementById("nx");

  if(ok){
    // 正解：ここで確定。正解した選択肢だけ緑にする（不正解の選択肢は先に色を変えない）
    answered=true;
    el.classList.add("correct");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    score++;
    if(mode!=="dobon"){ if(qmiss===0) firstTryCount++; }
    if(mode==="dobon") streak++;
    exp.className="exp show ok";
    document.getElementById("vd").textContent="正解！";
    document.getElementById("tx").innerHTML=item.exp;
    nx.disabled=false;
    nx.textContent=(idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶";
    return;
  }

  // 不正解
  if(mode==="dobon"){
    // ドボンモードは一発勝負：選び直しなし・正解は伏せる
    answered=true;
    el.classList.add("wrong");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    if(item.dobon){ dead=true; } // 💣ドボン対象を外したときだけ終了
    exp.className="exp show ng";
    document.getElementById("vd").textContent=isDob?"💣 ドボン！":"不正解";
    document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}`;
    nx.disabled=false;
    nx.textContent=dead?"結果を見る（ドボン）▶":((idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶");
    return;
  }

  // 通常モード：ミスを数え、選んだ選択肢だけ赤にして無効化。正解は伏せたまま選び直せる
  qmiss++; totalMiss++;
  el.classList.add("wrong","dis");
  exp.className="exp show ng";
  document.getElementById("vd").textContent="不正解（ミス "+qmiss+"回）";
  document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}<br>ほかの選択肢からもう一度選んでください。`;
  // 「次へ」はまだ出さない（正解するまで進めない）
}
function next(){
  if(dead){result();return;}
  if(idx+1<drawn.length){idx++;render();}
  else result();
}
function result(){
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="100%";
  if(mode==="dobon"){
    document.getElementById("htt").textContent="結果";
    if(dead){
      document.getElementById("bd").innerHTML=`<div class="center score dead">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>ドボンを踏んでしまいました</div>
        <div class="big">${streak} 問連続正解</div>
        <div class="msg">${idx}問正解のあと、${idx+1}問目でドボン。<br>上の解説を復習して再挑戦しましょう。</div>
      </div>`;
    }else{
      document.getElementById("bd").innerHTML=`<div class="center score">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>クリア！</div>
        <div class="big">${score} / ${drawn.length}</div>
        <div class="msg">ドボンを踏まず完走しました。お見事！</div>
      </div>`;
    }
  }else{
    document.getElementById("htt").textContent="結果";
    const n=drawn.length;
    const ftPct=Math.round(firstTryCount/n*100);
    const noMiss=(totalMiss===0);
    let head = noMiss
      ? `<div class="big">✨ ノーミス パーフェクト！</div><div>全 ${n} 問を一発で正解</div>`
      : `<div>今回の成績</div><div class="big">${firstTryCount} / ${n}</div><div>一発正解率 ${ftPct}%</div>`;
    let stat = `<div class="stats">一発正解 ${firstTryCount}問　｜　総ミス ${totalMiss}回</div>`;
    let msg = noMiss?"完璧です。この調子！":ftPct>=60?"よくできました。ミスした問題を復習しましょう。":"もう一度スライドで確認してから挑戦しましょう。";
    document.getElementById("bd").innerHTML=`<div class="center score">${head}${stat}<div class="msg">${msg}</div></div>`;
  }
  document.getElementById("ctrl").innerHTML=`<button class="btn sub" onclick="home()">モード選択へ</button><button class="btn" onclick="start(mode)">もう一度（シャッフル）▶</button>`;
}
home();
</script>
</body>
</html>
