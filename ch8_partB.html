<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第8章 血液｜B 止血</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:#f0f2f5;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 12px}
h1{font-size:14px;color:#555;margin-bottom:16px;font-weight:400;letter-spacing:.05em}
.slide{width:100%;max-width:820px;background:#fff;border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,.10);overflow:hidden}
.hd{background:#8b2635;padding:14px 28px}
.hd .ch{font-size:11px;color:#f0d5d8;font-weight:500;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.hd .tt{font-size:20px;font-weight:500;color:#fff}
.bd{padding:20px 28px 16px;background:#fff}
.sec{font-size:10px;font-weight:600;color:#888;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.box{background:#f8f9fb;border:1px solid #e5e7eb;border-radius:8px;padding:14px 18px;margin-bottom:12px}
.row{display:block;font-size:14px;line-height:1.9;color:#222;padding:5px 0;border-bottom:1px solid #e5e7eb}
.row:last-child{border-bottom:none}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#8b2635;color:#fff;padding:8px 10px;font-weight:500;text-align:left;font-size:12px}
.tbl td{padding:8px 10px;border-bottom:1px solid #e5e7eb;vertical-align:top;color:#222;line-height:1.7}
.tbl tr:last-child td{border-bottom:none}
.tbl td:first-child{font-weight:600;color:#8b2635;white-space:nowrap;min-width:110px}
.tbl.wide td:first-child{white-space:normal;min-width:88px}
.kw{font-weight:700;color:#8b2635}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:4px;margin-bottom:7px}
.tf{background:rgba(139,38,53,.12);color:#8b2635}
.tb{background:rgba(90,30,40,.12);color:#5a1e28}
.blank{display:inline-block;min-width:72px;border-bottom:2.5px solid #8b2635;border-radius:3px 3px 0 0;cursor:pointer;text-align:center;padding:0 5px;transition:all .22s;position:relative;vertical-align:baseline}
.blank::after{content:"？";font-size:12px;color:#8b2635;opacity:.45;position:absolute;left:50%;transform:translateX(-50%)}
.blank span{visibility:hidden;font-weight:600;color:#8b2635;font-size:14px;opacity:0;transition:opacity .22s;display:inline-block}
.blank.on{border-bottom-color:transparent;background:rgba(139,38,53,.1);border-radius:4px;padding:1px 7px}
.blank.on::after{display:none}
.blank.on span{visibility:visible;opacity:1}
.blank:not(.on):hover{background:rgba(139,38,53,.07)}
.ctrl{display:flex;align-items:center;gap:8px;padding:10px 28px 12px;background:#f8f9fb;border-top:1px solid #e5e7eb;flex-wrap:wrap}
.btn{padding:7px 15px;border-radius:6px;border:1px solid #d1d5db;background:#fff;color:#333;font-size:12px;cursor:pointer;font-family:inherit;transition:background .15s}
.btn:hover{background:#f0f2f5}
.btnp{background:#8b2635;color:#fff;border-color:#8b2635}
.btnp:hover{background:#6b1d29}
.cnt{font-size:11px;color:#888;margin-left:auto}
.nav{display:flex;align-items:center;gap:7px;padding:9px 28px 11px;background:#f8f9fb;border-top:1px solid #e5e7eb;border-radius:0 0 12px 12px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:#d1d5db;cursor:pointer;transition:background .18s;flex-shrink:0}
.dot.a{background:#8b2635}
.pg{font-size:11px;color:#888;margin-left:auto}
</style>
</head>
<body>
<h1>生理学 第8章 血液｜B 止血（教科書 P120〜125）</h1>
<div class="slide">
  <div id="sc"></div>
  <div class="ctrl">
    <button class="btn" onclick="nextBlank()">次のカッコを開く ▶</button>
    <button class="btn" onclick="showAll()">すべて表示</button>
    <button class="btn" onclick="resetAll()">リセット</button>
    <button class="btn btnp" onclick="go(cur-1)">◀ 前へ</button>
    <button class="btn btnp" onclick="go(cur+1)">次へ ▶</button>
    <span class="cnt" id="cnt"></span>
  </div>
  <div class="nav" id="nav"></div>
</div>
<script>
const S=[
{t:"止血の3段階",ch:"B 止血 ｜ 教科書P120",type:"tbl",
cols:["項目","内容"],
rows:[
["止血とは","血管が損傷しても出血はやがて止まる．これを [止血] と呼ぶ．"],
["3つの反応","① 損傷部の [局所的血管収縮]　② [血小板の凝集]　③ [血液凝固] の一連の反応で行われる（図8・7）．"],
["一次血栓","①②でできる血栓．別名 [血小板血栓]．"],
["二次血栓","③でできる血栓．別名 [フィブリン血栓]（[凝固血栓]）．"],
]},
{t:"① 局所的血管収縮",ch:"B-1 局所的血管収縮 ｜ 教科書P120",type:"tbl",
cols:["段階","内容"],
rows:[
["コラーゲン線維の露出","血管が損傷すると，傷口では [コラーゲン線維] が露出する．"],
["血小板の粘着","コラーゲン線維に [粘着] しやすい性質をもつ [血小板] が，そこに粘着しはじめる．"],
["血管の収縮","粘着した血小板は [セロトニン] などを放出することで血管を [収縮] させ，[血流量] を減少させる．"],
]},
{t:"② 血小板凝集",ch:"B-2 血小板凝集 ｜ 教科書P120",type:"tbl",
cols:["段階","内容"],
rows:[
["ADPの放出","粘着した血小板は [アデノシン二リン酸]（[ADP]）を放出する．"],
["凝集","ADPによって他の血小板を自身の周りに次々と [付着] させ，傷口に [血小板の塊] を形成する．"],
["一次血栓","血管の損傷が [小さ] ければ，この血小板凝集で損傷部位が塞がれて止血される．これを [一次血栓]（[血小板血栓]）と呼ぶ．"],
["血小板の異常","血小板が [不足] したり [機能に障害] があったりすると止血されず，[点状の出血斑] が現れることがある．"],
]},
{t:"③ 血液凝固の概要",ch:"B-3 血液凝固 ｜ 教科書P121",type:"tbl",
cols:["項目","内容"],
rows:[
["二次血栓","[フィブリン] が血液細胞を閉じ込めることで [血餅] が形成され，止血が行われる．これを [二次血栓]（[フィブリン血栓]）と呼ぶ．"],
["二次血栓の意義","[一次血栓] では止血できない [大規模] な血管の損傷に対応できる．"],
["2つの反応過程","[内因系] と [外因系] の2つがある（図8・8）．"],
["関与するもの","[血液凝固因子] と呼ばれる一連の [タンパク質]（表8・2）のほか，血管損傷部位に粘着した血小板から放出される [血小板第3因子]（[PF-3]）などが関与してフィブリンが形成される．"],
]},
{t:"内因系",ch:"B-3-a 内因系 ｜ 教科書P122",type:"tbl",
cols:["段階","内容"],
rows:[
["特徴","血液中の [凝固因子のみ] が関わって進行する．"],
["第XII因子","傷口に露出した [コラーゲン線維] に接触すると活性化して [第XIIa因子] となる．"],
["第XI因子","第XIIa因子は第XI因子を活性化させて [第XIa因子] を生成する．"],
["第IX因子","第XIa因子は第IX因子を活性化して [第IXa因子] にする．"],
["第VIII因子複合体","第IXa因子に [第VIII因子]，[血小板第3因子]，[第IV因子] が加わって [第VIII因子複合体] が形成される（図8・8）．"],
]},
{t:"外因系",ch:"B-3-b 外因系 ｜ 教科書P122",type:"tbl",
cols:["段階","内容"],
rows:[
["きっかけ","血管の損傷が [大きい] 場合，血液が [組織内] へ流出したり [組織液] が血管内に流入したりする．"],
["接触","血漿中の [第VII因子] が，組織液中の [第III因子]（[組織トロンボプラスチン] とも呼ばれる）と接触する．"],
["第VII因子複合体","その結果 [第VII因子複合体] が形成される．この過程を [外因系] という．"],
["図8・8では","第VII因子複合体には [第III因子]，[第VII因子]，[第IV因子] が関与する．"],
]},
{t:"フィブリンの形成",ch:"B-3-c フィブリンの形成 ｜ 教科書P122〜123",type:"tbl",
cols:["段階","内容"],
rows:[
["内因系と外因系の合流","内因系では [第VIII因子複合体]，外因系では [第VII因子複合体] が形成される．これらはともに [第X因子] を活性化する作用をもつ．"],
["第Xa因子","活性化した第X因子（[第Xa因子]）は，凝固因子を次々と活性化し [トロンビン] を形成する．"],
["トロンビンのもと","トロンビンは [プロトロンビン]（[第II因子]）からつくられる．"],
["フィブリンの生成","トロンビンの作用を受けて，[第I因子] である [フィブリノゲン] が [フィブリン] に変化する．"],
["安定化","形成されたばかりのフィブリンは [不安定] であるものの，[第XIIIa因子] が作用することで [安定] した [網目状] の線維となる．"],
]},
{t:"表8・2　血液凝固因子",ch:"B-3 血液凝固 ｜ 教科書P123",type:"tbl",
cols:["因子名","慣用名"],
rows:[
["第I因子","[フィブリノゲン]"],
["第II因子","[プロトロンビン]"],
["第III因子","[組織トロンボプラスチン]"],
["第IV因子","[カルシウムイオン]（Ca²⁺）"],
["第V因子","[ACグロブリン]"],
["第VI因子","[欠番]"],
["第VII因子","[プロコンバーチン]"],
["第VIII因子","[抗血友病因子]"],
["第IX因子","[クリスマス因子]"],
["第X因子","[スチュアート因子]"],
["第XI因子","[PTA]"],
["第XII因子","[ハーゲマン因子]"],
["第XIII因子","[フィブリン安定化因子]"],
]},
{t:"図8・9　一次血栓と二次血栓の成立までの流れ",ch:"B 止血 ｜ 教科書P124",type:"tbl",
cols:["経路","流れ"],
rows:[
["出発点","[血管の損傷]"],
["2つの分かれ道","① [コラーゲン線維の露出]　② 血漿中の [第VII因子] と組織液中の凝固因子との接触"],
["① 一次血栓へ","コラーゲン線維の露出 → 損傷部への [血小板粘着] → [血小板凝集] ＋ 損傷部の [局所的血管収縮] → [一次血栓]（血小板血栓）"],
["① 凝固系へも","コラーゲン線維の露出は [第XII因子の活性化] も起こす → [血液凝固系の活性化]"],
["② 二次血栓へ","第VII因子と凝固因子の接触 → [第VII因子複合体] の形成 → [血液凝固系の活性化]"],
["最終","血液凝固系の活性化 → [二次血栓]（[凝固血栓]）"],
]},
{t:"線維素溶解（線溶）",ch:"B-4 線維素溶解 ｜ 教科書P124〜125",type:"tbl",
cols:["項目","内容"],
rows:[
["なぜ必要か","凝固血栓はそのまま存在すると [血流再開] の妨げになる．"],
["線維素溶解とは","損傷した血管が [修復] されたのちに，凝固血栓の [フィブリン塊] が分解されること（図8・10）．[線溶] とも呼ぶ．"],
["分解する酵素","[タンパク質分解作用] をもつ [プラスミン] と呼ばれる酵素が行う．"],
["プラスミンのもと","血漿中の [プラスミノゲン] と呼ばれる [前駆物質] が活性化したものである（図8・11）．"],
["活性化因子","[組織プラスミノゲン活性化因子]（[t-PA]）と [ウロキナーゼ]（[UK]）で活性化される．図8・11では [第XIa因子]・[第XIIa因子] も促進にはたらく．"],
["治療薬","これらを純化した製剤は，血管内に生じた [血栓] を溶解する [治療薬] として用いられる．"],
["抑制因子","血漿中には [アンチプラスミン] などのプラスミン抑制因子が存在する．このほか，血液凝固因子である [トロンビン] もプラスミンのはたらきを [抑制] する作用をもつ．"],
]},
{t:"B まとめ",ch:"B 止血 ｜ まとめ",type:"tbl",
cols:["項目","内容"],
rows:[
["止血の3段階","① [局所的血管収縮]　② [血小板凝集]　③ [血液凝固]"],
["一次血栓／二次血栓","一次＝[血小板血栓]／二次＝[フィブリン血栓]（凝固血栓）"],
["局所的血管収縮","[コラーゲン線維] の露出 → 血小板の粘着 → [セロトニン] 放出 → 血管収縮"],
["血小板凝集","粘着した血小板が [ADP] を放出して血小板の塊をつくる．異常があると [点状の出血斑]"],
["内因系","[第XII因子] がコラーゲン線維で活性化 → XIa → IXa → [第VIII因子複合体]"],
["外因系","血漿の [第VII因子] ＋ 組織液の [第III因子]（組織トロンボプラスチン）→ [第VII因子複合体]"],
["共通の経路","両複合体 → [第Xa因子] → [トロンビン] → フィブリノゲン（[第I因子]）→ [フィブリン]"],
["フィブリンの安定化","[第XIIIa因子] が不安定なフィブリンを [安定] な網目状線維にする"],
["凝固因子の注意点","[第VI因子] は欠番／第III因子＝[組織トロンボプラスチン]／第IV因子＝[カルシウムイオン]"],
["線維素溶解","[プラスミノゲン] →（[t-PA]・[UK]）→ [プラスミン] → フィブリンを分解"],
["線溶の抑制因子","[アンチプラスミン]，[トロンビン]"],
]}
];
let cur=0,bs=[];
function bl(id,ans){return `<span class="blank" id="${id}" onclick="revealBlank('${id}')"><span>${ans}</span></span>`;}
function fill(t){t=t.replace(/\{\{([^{}]+)\}\}/g,'<span class="kw">$1</span>');return t.replace(/\[([^\[\]]+)\]/g,(m,a)=>{const id="b"+bs.length;bs.push({id,on:false});return bl(id,a);});}
function buildSlide(i){
  const s=S[i];bs=[];
  let h=`<div class="hd"><div class="ch">${s.ch}</div><div class="tt">${s.t}</div></div><div class="bd">`;
  if(s.type==="p"){
    h+=`<div class="sec">重要事項</div><div class="box">`;
    s.rows.forEach(r=>{h+=`<span class="row">${fill(r)}</span>`;});
    h+=`</div>`;
  }else if(s.type==="tbl"){
    h+=`<div class="sec">重要事項</div><div class="box" style="padding:0;overflow:hidden"><table class="tbl${s.cols.length>2?' wide':''}"><thead><tr>`;
    s.cols.forEach(c=>h+=`<th>${c}</th>`);
    h+=`</tr></thead><tbody>`;
    s.rows.forEach(row=>{h+=`<tr>`;row.forEach(cell=>{h+=`<td>${fill(cell)}</td>`;});h+=`</tr>`;});
    h+=`</tbody></table></div>`;
  }else if(s.type==="two"){
    h+=`<div class="two">`;
    ["left","right"].forEach(side=>{
      const d=s[side];const tc=side==="left"?"tf":"tb";
      h+=`<div class="box"><span class="tag ${tc}">${d.label}</span>`;
      d.rows.forEach(r=>{h+=`<p style="font-size:13px;line-height:1.8;border-bottom:1px solid #e5e7eb;padding:4px 0">${fill(r)}</p>`;});
      h+=`</div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;
  document.getElementById("sc").innerHTML=h;
  upd();bldNav();
}
function revealBlank(id){const b=bs.find(x=>x.id===id);if(b&&!b.on){b.on=true;document.getElementById(id).classList.add("on");}upd();}
function nextBlank(){const u=bs.find(x=>!x.on);if(u){revealBlank(u.id);const el=document.getElementById(u.id);if(el)el.scrollIntoView({behavior:"smooth",block:"center"});}}
function showAll(){bs.forEach(b=>revealBlank(b.id));}
function resetAll(){bs.forEach(b=>{b.on=false;const el=document.getElementById(b.id);if(el)el.classList.remove("on");});upd();}
function upd(){const d=bs.filter(x=>x.on).length;document.getElementById("cnt").textContent=bs.length?d+"/"+bs.length+" 表示済み":"参照用スライド（カッコなし）";}
function go(i){if(i>=0&&i<S.length){cur=i;buildSlide(cur);}}
function bldNav(){
  let h="";
  S.forEach((_,i)=>h+=`<div class="dot${i===cur?" a":""}" onclick="go(${i})"></div>`);
  h+=`<span class="pg">${cur+1} / ${S.length}</span>`;
  document.getElementById("nav").innerHTML=h;
}
buildSlide(0);
</script>
</body>
</html>
