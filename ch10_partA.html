<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第10章 循環 パートA｜生理学スライド</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:#f0f2f5;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 12px}
h1{font-size:14px;color:#555;margin-bottom:16px;font-weight:400;letter-spacing:.05em}
.slide{width:100%;max-width:820px;background:#fff;border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,.10);overflow:hidden}
.hd{background:#8c2a2a;padding:14px 28px}
.hd .ch{font-size:11px;color:#f0c4c4;font-weight:500;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.hd .tt{font-size:20px;font-weight:500;color:#fff}
.bd{padding:20px 28px 16px;background:#fff}
.sec{font-size:10px;font-weight:600;color:#888;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.box{background:#f8f9fb;border:1px solid #e5e7eb;border-radius:8px;padding:14px 18px;margin-bottom:12px}
.row{display:block;font-size:14px;line-height:1.9;color:#222;padding:5px 0;border-bottom:1px solid #e5e7eb}
.row:last-child{border-bottom:none}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#8c2a2a;color:#fff;padding:8px 10px;font-weight:500;text-align:left;font-size:12px}
.tbl td{padding:8px 10px;border-bottom:1px solid #e5e7eb;vertical-align:top;color:#222;line-height:1.7}
.tbl tr:last-child td{border-bottom:none}
.tbl td:first-child{font-weight:600;color:#8c2a2a;white-space:nowrap;min-width:110px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:4px;margin-bottom:7px}
.tf{background:rgba(140,42,42,.12);color:#8c2a2a}
.tb{background:rgba(42,90,140,.12);color:#2a5a8c}
.blank{display:inline-block;min-width:72px;border-bottom:2.5px solid #8c2a2a;border-radius:3px 3px 0 0;cursor:pointer;text-align:center;padding:0 5px;transition:all .22s;position:relative;vertical-align:baseline}
.blank::after{content:"？";font-size:12px;color:#8c2a2a;opacity:.45;position:absolute;left:50%;transform:translateX(-50%)}
.blank span{visibility:hidden;font-weight:600;color:#8c2a2a;font-size:14px;opacity:0;transition:opacity .22s;display:inline-block}
.blank.on{border-bottom-color:transparent;background:rgba(140,42,42,.1);border-radius:4px;padding:1px 7px}
.blank.on::after{display:none}
.blank.on span{visibility:visible;opacity:1}
.blank:not(.on):hover{background:rgba(140,42,42,.07)}
.ctrl{display:flex;align-items:center;gap:8px;padding:10px 28px 12px;background:#f8f9fb;border-top:1px solid #e5e7eb;flex-wrap:wrap}
.btn{padding:7px 15px;border-radius:6px;border:1px solid #d1d5db;background:#fff;color:#333;font-size:12px;cursor:pointer;font-family:inherit;transition:background .15s}
.btn:hover{background:#f0f2f5}
.btnp{background:#8c2a2a;color:#fff;border-color:#8c2a2a}
.btnp:hover{background:#6f2020}
.cnt{font-size:11px;color:#888;margin-left:auto}
.nav{display:flex;align-items:center;gap:7px;padding:9px 28px 11px;background:#f8f9fb;border-top:1px solid #e5e7eb;border-radius:0 0 12px 12px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:#d1d5db;cursor:pointer;transition:background .18s;flex-shrink:0}
.dot.a{background:#8c2a2a}
.pg{font-size:11px;color:#888;margin-left:auto}
</style>
</head>
<body>
<h1>生理学 第10章 循環｜パートA：循環系の概要・心臓の機能的解剖・心臓の電気的活動</h1>
<div class="slide">
  <div id="sc"></div>
  <div class="ctrl">
    <button class="btn" onclick="nxt()">次のカッコを開く ▶</button>
    <button class="btn" onclick="showAll()">すべて表示</button>
    <button class="btn" onclick="rst()">リセット</button>
    <button class="btn btnp" onclick="go(cur-1)">◀ 前へ</button>
    <button class="btn btnp" onclick="go(cur+1)">次へ ▶</button>
    <span class="cnt" id="cnt"></span>
  </div>
  <div class="nav" id="nav"></div>
</div>
<script>
const S=[
{t:"循環系のはたらき",ch:"第10章 循環 ｜ 章のはじめに",type:"p",
rows:[
{t:"循環系は，血液の移動により細胞の周囲まで物質を運搬し，代謝産物を取り除き，[内部環境の恒常性] を保つ基本的手段である．",b:["内部環境の恒常性"]},
{t:"① 肺から取り入れた [酸素]，消化管から吸収した [栄養素] などを，からだの各細胞まで運ぶ．",b:["酸素","栄養素"]},
{t:"② 細胞の代謝によって生じた [炭酸ガス]，尿素，熱などを，排泄系（肺，[腎臓]，皮膚など）に運搬する．",b:["炭酸ガス","腎臓"]},
{t:"③ 貯蔵された脂肪，糖などを，それを必要とする組織まで運ぶ．",b:[]},
{t:"④ [血小板]，白血球などを目的の場所に集め，出血，感染を防ぐ．",b:["血小板"]},
{t:"⑤ [ホルモン] を運搬して，細胞間情報伝達の手段となっている．",b:["ホルモン"]},
{t:"循環系は，血液を循環させる [心臓血管系] と，リンパ液を循環させる [リンパ系] から構成される．",b:["心臓血管系","リンパ系"]},
]},
{t:"肺循環系と体循環系",ch:"第10章 循環 ｜ A 心臓",type:"p",
rows:[
{t:"心臓より駆出された血液は，血管系を巡り臓器を経て心臓に還る．その循環回路は2つに分かれる（図10・1）．",b:[]},
{t:"[肺循環系]：右心房，右心室と [肺] よりなる．",b:["肺循環系","肺"]},
{t:"[体循環系]：左心房，左心室と，からだの各臓器からなる．",b:["体循環系"]},
{t:"肺循環系と体循環系は [直列] につながっている．",b:["直列"]},
{t:"血液は 左心 →［[体循環]］→ 右心 →［[肺循環]］→ 左心 と循環する（図10・2）．",b:["体循環","肺循環"]},
{t:"※補足知識（資料外・過去問頻出）：肺循環は「小循環」，体循環は「大循環」とも呼ばれる．肺動脈には静脈血が，肺静脈には動脈血が流れる（肺静脈は左心房へ戻る）．肺動脈圧は約15mmHgで，体循環の動脈圧より低い．",b:[]},
]},
{t:"心臓の機能的解剖",ch:"第10章 循環 ｜ A-1 心臓の機能的解剖",type:"p",
rows:[
{t:"ポンプ作用の担い手である [心室] を中心に考えると理解が容易である．",b:["心室"]},
{t:"心室の前には [心房] があり，収縮により血液を心室に送り込む．",b:["心房"]},
{t:"心室の後ろには [動脈] があり，血液を送り出す．",b:["動脈"]},
{t:"心室には入り口と出口に弁がある．心臓には血液の逆流を防ぐ [4つ] の弁がある．",b:["4つ"]},
{t:"これらの弁は [圧力差] によって受動的に開閉し，血液を [一方向] に流れるようにしている．",b:["圧力差","一方向"]},
]},
{t:"心臓の4つの弁",ch:"第10章 循環 ｜ A-1 心臓の機能的解剖",type:"tbl",
cols:["位置","弁の名前","分類"],
rows:[
["右心房と右心室の間","[三尖弁]","[房室弁]"],
["左心房と左心室の間","[僧帽弁]","房室弁"],
["右心室の出口","[肺動脈弁]","[半月弁]"],
["左心室の出口","[大動脈弁]","半月弁"],
],
},
{t:"心筋の種類と特徴",ch:"第10章 循環 ｜ A-1 心臓の機能的解剖",type:"p",
rows:[
{t:"心筋は [横紋筋] に分類され，2種類に大別される．",b:["横紋筋"]},
{t:"[固有心筋]：心房筋と心室筋に分けられる．血液の [駆出] を担う．",b:["固有心筋","駆出"]},
{t:"[特殊心筋]：興奮の [自動発生] と [伝導] を担う．",b:["特殊心筋","自動発生","伝導"]},
{t:"心筋細胞の間は [ギャップ結合] により連結されているため，電気的活動を各細胞を通じて伝達することができる．",b:["ギャップ結合"]},
{t:"そのため，心臓はあたかも1つの細胞のようにふるまい，[機能的合胞体] と呼ばれる．",b:["機能的合胞体"]},
{t:"骨格筋と異なり，心筋には [自動能] があり，神経を切り離しても一定のリズムで収縮する．",b:["自動能"]},
{t:"※補足知識（資料外・過去問頻出）：心筋は不随意筋である．不応期が長いため強縮を起こさない．また，心筋は伸展されるほど強い張力を発生する（スターリングの心臓の法則）．",b:[]},
]},
{t:"心筋細胞の興奮",ch:"第10章 循環 ｜ A-2 心臓の電気的活動",type:"p",
rows:[
{t:"心筋細胞は [−75mV] のマイナスの静止電位をもつ（[分極] 状態）．",b:["−75mV","分極"]},
{t:"刺激により膜電位は上昇し，[閾膜電位]（[−50mV]）に達すると，電位は急速に上昇し [+40mV] に達する．",b:["閾膜電位","−50mV","+40mV"]},
{t:"このような心筋の電位変化を [活動電位]（興奮）という（3章「神経の生理」参照）．",b:["活動電位"]},
{t:"心筋細胞の興奮期間は約 [0.3秒] あり，この期間は新たな刺激に反応しない（[不応期]）．",b:["0.3秒","不応期"]},
{t:"その後，膜電位は −75mV の静止電位に戻る（[再分極]）．",b:["再分極"]},
{t:"1個の細胞が興奮すると周囲の細胞を刺激し，次々と興奮が [伝搬] する．不応期には刺激に反応しないため，隣の細胞に伝わった自らの興奮によって脱分極を繰り返すことはない．",b:["伝搬"]},
{t:"※補足知識（資料外）：心筋の活動電位は，Ca²⁺ の細胞内流入により平坦な部分（プラトー）が続くため，骨格筋よりも持続時間が長い．",b:[]},
]},
{t:"心筋の刺激伝導系",ch:"第10章 循環 ｜ A-2 心臓の電気的活動",type:"p",
rows:[
{t:"心臓は，個々の心筋細胞が互いに協調して収縮と弛緩を繰り返す．",b:[]},
{t:"心臓の [特殊心筋] は，興奮を伝える経路（[興奮伝導系] あるいは [刺激伝導系]）としてはたらく（図10・3）．",b:["特殊心筋","興奮伝導系","刺激伝導系"]},
{t:"【伝わる順番】[洞房結節] → [房室結節] → [ヒス束] → 左右の脚 → [プルキンエ線維] → 心室筋",b:["洞房結節","房室結節","ヒス束","プルキンエ線維"]},
{t:"この経路のはたらきにより，心臓は順序だった [規則正しい] 収縮と拡張を繰り返すことができる．",b:["規則正しい"]},
{t:"※補足知識（資料外・過去問頻出）：洞房結節を「第一のペースメーカー」，房室結節を「第二のペースメーカー」と呼ぶことがある．",b:[]},
]},
{t:"刺激伝導系の各部（1）",ch:"第10章 循環 ｜ A-2 心臓の電気的活動",type:"tbl",
cols:["部位","特徴"],
rows:[
["① 洞房結節","[上大静脈] と [右心房] の移行部に局在する細胞群．静止膜電位レベルが自然に上昇し，外部からの刺激なしに興奮する．"],
["（ペースメーカー）","興奮の周期が [心拍数] を決めるため，別名「[ペースメーカー]（歩調取り）細胞」と呼ばれる．興奮は左右の心房に伝わり [心房収縮] が起こる．"],
["② 房室結節","心房と心室は [線維輪] で分けられているため，心房からの刺激は心室に直接伝わらない．房室結節は，心房からの刺激を受け心室に伝える [中継点] となる．"],
["（伝導の遅れ）","刺激の伝導を約 [0.07秒] 遅らせるため，心房の収縮は心室の収縮の [前] に完了する．"],
],
},
{t:"刺激伝導系の各部（2）",ch:"第10章 循環 ｜ A-2 心臓の電気的活動",type:"tbl",
cols:["部位","特徴"],
rows:[
["③ ヒス束，左脚，右脚","房室結節からの刺激は，[ヒス束] から，[心室中隔] の左右の脚を通って [心尖部] に伝導する．"],
["④ プルキンエ線維","ヒス束の末梢部で，左右の心室 [内膜側] に分布している線維．"],
["（収縮の広がり）","プルキンエ線維の興奮により，心筋の収縮は [心内膜側] から [心外膜側] へと広がる．"],
],
},
{t:"パートAまとめ",ch:"第10章 循環 ｜ パートAまとめ",type:"tbl",
cols:["項目","内容"],
rows:[
["循環系の構成","血液を循環させる [心臓血管系] ＋ リンパ液を循環させる [リンパ系]"],
["2つの循環","肺循環系（右心房・右心室・肺）と体循環系（左心房・左心室・各臓器）．両者は [直列]"],
["房室弁","右：[三尖弁]／左：[僧帽弁]"],
["半月弁","右心室出口：肺動脈弁／左心室出口：[大動脈弁]"],
["心筋の種類","[固有心筋]（駆出）／[特殊心筋]（興奮の自動発生と伝導）"],
["機能的合胞体","[ギャップ結合] で連結 → 1つの細胞のようにふるまう"],
["心筋の電位","静止電位 [−75mV]／閾膜電位 −50mV／ピーク +40mV"],
["不応期","興奮期間 約 [0.3秒]．この間は新たな刺激に反応しない"],
["伝導の順番","洞房結節 → [房室結節] → ヒス束 → 左右の脚 → [プルキンエ線維]"],
["ペースメーカー","[洞房結節]（上大静脈と右心房の移行部）"],
["房室結節の遅れ","約 [0.07秒] → 心房収縮が心室収縮の前に完了"],
],
},
];
let cur=0,bs=[];
function bl(id,ans){return `<span class="blank" id="${id}" onclick="rb('${id}')"><span>${ans}</span></span>`;}
function buildSlide(i){
  const s=S[i];bs=[];
  let h=`<div class="hd"><div class="ch">${s.ch}</div><div class="tt">${s.t}</div></div><div class="bd">`;
  if(s.type==="p"){
    h+=`<div class="sec">重要事項</div><div class="box">`;
    s.rows.forEach(r=>{
      let t=r.t;
      r.b.forEach(a=>{const id="b"+bs.length;bs.push({id,on:false});t=t.replace("["+a+"]",bl(id,a));});
      h+=`<span class="row">${t}</span>`;
    });
    h+=`</div>`;
  }else if(s.type==="tbl"){
    h+=`<div class="sec">重要事項</div><div class="box" style="padding:0;overflow:hidden"><table class="tbl"><thead><tr>`;
    s.cols.forEach(c=>h+=`<th>${c}</th>`);
    h+=`</tr></thead><tbody>`;
    s.rows.forEach(row=>{
      h+=`<tr>`;
      row.forEach(cell=>{
        const t=cell.replace(/\[([^\[\]]+)\]/g,(m,a)=>{
          const id="b"+bs.length;bs.push({id,on:false});return bl(id,a);
        });
        h+=`<td>${t}</td>`;
      });
      h+=`</tr>`;
    });
    h+=`</tbody></table></div>`;
  }else if(s.type==="two"){
    h+=`<div class="two">`;
    ["left","right"].forEach(side=>{
      const d=s[side];
      const tc=side==="left"?"tf":"tb";
      h+=`<div class="box"><span class="tag ${tc}">${d.label}</span>`;
      d.rows.forEach(r=>{
        let t=r.t;
        r.b.forEach(a=>{const id="b"+bs.length;bs.push({id,on:false});t=t.replace("["+a+"]",bl(id,a));});
        h+=`<p style="font-size:13px;line-height:1.8;border-bottom:1px solid #e5e7eb;padding:4px 0">${t}</p>`;
      });
      h+=`</div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;
  document.getElementById("sc").innerHTML=h;
  upd();bldNav();
}
function rb(id){const b=bs.find(x=>x.id===id);if(b&&!b.on){b.on=true;document.getElementById(id).classList.add("on");}upd();}
function nxt(){const u=bs.find(x=>!x.on);if(u)rb(u.id);}
function showAll(){bs.forEach(b=>rb(b.id));}
function rst(){bs.forEach(b=>{b.on=false;const el=document.getElementById(b.id);if(el)el.classList.remove("on");});upd();}
function upd(){const d=bs.filter(x=>x.on).length;document.getElementById("cnt").textContent=d+"/"+bs.length+" 表示済み";}
function go(i){if(i>=0&&i<S.length){cur=i;buildSlide(cur);}}
function bldNav(){
  let h="";
  S.forEach((_,i)=>h+=`<div class="dot${i===cur?" a":""}" onclick="go(${i})"></div>`);
  h+=`<span class="pg">${cur+1} / ${S.length}</span>`;
  document.getElementById("nav").innerHTML=h;
}
buildSlide(0);
</script>
</body>
</html>
