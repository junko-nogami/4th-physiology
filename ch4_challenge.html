 .bd{padding:18px 16px 16px}.hd{padding:12px 16px}.ctrl{padding:11px 16px 13px}

}

<script>
/* ===== 問題プール（パートA〜Eの確認テスト全問＋🔥チャレンジ限定10問）=====
   part   … 出題元のパート（A/B/C1/C2/D/E、Xはチャレンジ限定）

   ※章末はライフ制のため dobon フラグは表示・判定に使っていない（データ上は残している） */
const POOL=[
/* ---------- パートA（35問） ---------- */

/* ---------- A-1 運動の3つのカテゴリー（P43） ---------- */

{part:"A",q:"咀嚼は、運動の3つのカテゴリーのうちどれにあたるか。",
 choices:[
  ["生まれつき備わったプログラムで、無意識的・自動的に行われる運動",true,""],
  ["反射",false,"刺激に対して意識と無関係に起こる運動。熱いものに触れて手を引っ込めるなど。"],
  ["ある目的のために意識的に行われる運動",false,"目的をもって意識して行う運動。"],
  ["学習によってはじめて獲得される運動",false,"練習で身につける運動。咀嚼は生まれつき備わっている。"]],
 exp:"<b>咀嚼</b>は歩行・起立と同じく、開始と終了は意識的だが、<b>生まれつき備わっているプログラム</b>で無意識的・自動的に行われる。（教科書 P43）"},

{part:"A",q:"運動のカテゴリーとその例の組合せで正しいのはどれか。",
 choices:[
  ["生まれつきのプログラムで自動的に行われる運動 ― 起立",true,""],
  ["反射 ― 練習して身につけた自転車の運転",false,"自転車の運転は、意識的に行っていた運動が学習で自動化したもの。"],
  ["意識的に行われる運動 ― 目の前に物が急に近づいたとき、まぶたを閉じる",false,"刺激に対して無意識に起こる反射。"],
  ["学習によって自動化された運動 ― 歩行",false,"歩行は練習で身につけるものではなく、生まれつき備わったプログラムによる運動。"]],
 exp:"運動は①<b>反射</b>（熱いものに触れて手を引っ込めるなど）、②<b>生まれつき備わったプログラムで無意識的・自動的に行われる運動</b>（歩行・起立・咀嚼）、③<b>意識的に行われる運動</b>に分けられる。③は学習によって<b>自動化</b>されることがある（自転車の運転など）。（教科書 P43）"},

{part:"A",q:"骨格筋の収縮に不可欠な信号を送るのはどれか。",
 choices:[
  ["運動神経",true,""],
  ["感覚神経",false,"受容器からの情報を中枢へ伝える神経。"],
  ["自律神経",false,"内臓・血管・腺のはたらきを調節する神経。"],
  ["内分泌系",false,"ホルモンによって全身の器官を調節するしくみ。"]],
 exp:"運動するということは骨格筋を収縮させること。その収縮には<b>運動神経</b>から送られる信号が不可欠なので、運動が起こるときには神経（脳）がいつもはたらいている。（教科書 P43）"},

{part:"A",q:"意識的に行われる運動が、学習によって無意識に行えるようになることを何というか。",
 choices:[
  ["自動化",true,""],
  ["反射",false,"生まれつき備わった、刺激に対して無意識に起こる運動。"],
  ["協調",false,"複数の筋をタイミングよく連動させること。"],
  ["階層化",false,"脳部位が上位・下位の層をなして組織されていること。"]],
 exp:"③の意識的な運動も、<b>学習</b>することで無意識化（<b>自動化</b>）される。（教科書 P43）"},

{part:"A",q:"運動の目的や意識に応じて変化するとされるのはどれか。",
 choices:[
  ["反射の大きさ",true,""],
  ["反射中枢の位置",false,"反射中枢の場所は決まっており、目的や意識で移動しない。"],
  ["α運動ニューロンの数",false,"細胞の数が目的や意識で増減することはない。"],
  ["錐体交叉の割合",false,"伝導路の構造で決まっており、目的や意識で変化しない。"]],
 exp:"<b>反射の大きさ</b>も、運動の目的や意識に応じて変化する。日常動作は3つのカテゴリーの運動が組み合わさって成り立つ。（教科書 P43）"},

/* ---------- A-2 脊髄（P44） ---------- */

{part:"A",q:"骨格筋の収縮を支配するα運動ニューロンの細胞体があるのはどこか。",kihon:true,
 choices:[
  ["脊髄前角",true,""],
  ["脊髄側角",false,"胸髄・腰髄にあり、交感神経の節前ニューロンの細胞体がある部位。"],
  ["後根神経節",false,"感覚ニューロンの細胞体が集まった部位。"],
  ["脊髄白質",false,"伝導路の線維が通る部分で、細胞体の集まりではない。"]],
 exp:"<b>脊髄前角</b>には<b>α運動ニューロン</b>の細胞体がある。α運動ニューロンは骨格筋の収縮を支配する。（教科書 P44）"},

{part:"A",q:"歩行の基本的な運動パターンをつくる神経機構があるのはどれか。",kihon:true,
 choices:[
  ["脊髄",true,""],
  ["延髄",false,"呼吸や循環など、生命維持に不可欠な中枢がある部位。"],
  ["小脳",false,"協調した滑らかな動作や運動の学習に不可欠な部位。"],
  ["大脳辺縁系",false,"情動行動・本能行動に重要な役割を果たす部位。"]],
 exp:"脊髄前角は反射中枢として機能するほか、<b>歩行の基本的な運動パターン</b>をつくる神経機構がある。（教科書 P44）"},

{part:"A",q:"脊髄前角が反射中枢としてはたらく反射はどれか。",kihon:true,
 choices:[
  ["伸張反射",true,""],
  ["対光反射",false,"光で瞳孔が縮小する反射で、中枢は中脳にある。"],
  ["嚥下反射",false,"飲み込みの反射で、中枢は延髄にある。"],
  ["角膜反射",false,"角膜に触れるとまばたきが起こる反射で、中枢は橋にある。"]],
 exp:"<b>伸張反射</b>は脊髄前角を反射中枢とする代表的な脊髄反射。脊髄反射はほかにもいくつもある。（教科書 P44・P47）"},

{part:"A",q:"脊髄前角が反射中枢としてはたらく反射はどれか。",kihon:true,
 choices:[
  ["屈曲反射",true,""],
  ["対光反射",false,"光で瞳孔が縮小する反射で、中枢は中脳にある。"],
  ["前庭動眼反射",false,"頭が動いたとき、視線がぶれないよう眼球が反対に動く反射で、中枢は脳幹にある。"],
  ["立ち直り反射",false,"傾いた頭や体をまっすぐに戻す反射で、中枢は中脳にある。"]],
 exp:"画びょうを踏んだときに足を引っ込める<b>屈曲反射</b>（引っ込め反射）は、脊髄内でいくつかのニューロンを介して起こる脊髄反射。（教科書 P51）"},

{part:"A",q:"脊髄前角が反射中枢としてはたらく反射はどれか。",
 choices:[
  ["交叉性伸展反射",true,""],
  ["嚥下反射",false,"飲み込みの反射で、中枢は延髄にある。"],
  ["角膜反射",false,"角膜に触れるとまばたきが起こる反射で、中枢は橋にある。"],
  ["立ち直り反射",false,"傾いた頭や体をまっすぐに戻す反射で、中枢は中脳にある。"]],
 exp:"屈曲反射が起こったとき、反対側の肢が伸展して体重を支える反射が<b>交叉性伸展反射</b>。脊髄で起こる。なお運動学の教科書では「交<b>差</b>性伸展反射」と書くが、同じ反射である。（教科書 P52）"},

{part:"A",q:"脊髄前角が反射中枢としてはたらく反射はどれか。",
 choices:[
  ["筋性防御",true,""],
  ["対光反射",false,"光で瞳孔が縮小する反射で、中枢は中脳にある。"],
  ["前庭動眼反射",false,"頭が動いたとき、視線がぶれないよう眼球が反対に動く反射で、中枢は脳幹にある。"],
  ["嚥下反射",false,"飲み込みの反射で、中枢は延髄にある。"]],
 exp:"腹腔内の炎症で腹壁が硬くなる<b>筋性防御</b>は、炎症で刺激された腹膜と同じ脊髄分節の運動ニューロンが反射的に活動して起こる。脊髄反射のひとつ。（教科書 P52）"},

/* ---------- A-3 脳幹（P44） ---------- */

{part:"A",q:"脳幹の運動核が担う運動はどれか。",kihon:true,
 choices:[
  ["発声・嚥下や、頭部・顔面の運動",true,""],
  ["上肢・下肢の随意運動",false,"皮質脊髄路を経て、脊髄前角のα運動ニューロンが担う。"],
  ["歩行の基本的な運動パターン",false,"脊髄にある神経機構がつくる。"],
  ["内臓平滑筋の収縮",false,"自律神経系が調節する。"]],
 exp:"脳幹には、<b>運動核</b>と呼ばれる遠心性神経の起点にあたるニューロン群がある。運動核は<b>発声・嚥下</b>のほか、<b>頭部や顔面</b>の運動を担う。（教科書 P44）"},

{part:"A",q:"脳幹にあり、随意運動のはたらきを反射的に助ける伝導路の起点となるのはどれか。",kihon:true,
 choices:[
  ["前庭核",true,""],
  ["尾状核",false,"大脳の奥深くにある、大脳基底核の一部。"],
  ["視床下部",false,"間脳にあり、情動行動・本能行動やホルモン分泌に関わる。"],
  ["脊髄前角",false,"α運動ニューロンの細胞体がある脊髄の部位。"]],
 exp:"脳幹では<b>赤核・網様体・前庭核・視蓋</b>を起点とした伝導路が構成され、これらが随意運動のはたらきを反射的に助けている。（教科書 P44）"},

{part:"A",q:"延髄について正しいのはどれか。",kihon:true,dobon:true,
 choices:[
  ["呼吸や循環など、生命維持に不可欠な機能を担う中枢がある",true,""],
  ["運動の学習に不可欠な部位である",false,"大脳基底核と小脳のはたらき。"],
  ["情動行動・本能行動に重要な役割を果たす",false,"視床下部と大脳辺縁系のはたらき。"],
  ["体温調節の中枢がある",false,"体温調節の中枢は視床下部にある。"]],
 exp:"脳幹には呼吸や循環など生命維持に不可欠な機能を担う中枢がある。これらの中枢は主に<b>延髄</b>にあり、障害を受けると呼吸が停止し生命を失う。（教科書 P44、3章 P41）"},

/* ---------- A-4 大脳皮質（P44） ---------- */

{part:"A",q:"大脳皮質の運動関連領域に含まれないのはどれか。",kihon:true,dobon:true,
 choices:[
  ["一次体性感覚野",true,""],
  ["補足運動野",false,"運動関連領域のひとつ。"],
  ["運動前野",false,"運動関連領域のひとつ。"],
  ["帯状皮質運動野",false,"運動関連領域のひとつ。"]],
 exp:"大脳皮質の運動関連領域は、<b>一次運動野・補足運動野・運動前野・帯状皮質運動野</b>など。一次体性感覚野は感覚の領域。（教科書 P44）"},

/* ---------- A-5 その他の領域（P45） ---------- */

{part:"A",q:"協調した滑らかな動作や運動の学習に不可欠なのはどれか。",kihon:true,dobon:true,
 choices:[
  ["大脳基底核と小脳",true,""],
  ["視床下部と大脳辺縁系",false,"摂食・飲水・性行動などの情動行動、本能行動に重要な部位。"],
  ["脊髄と脳幹",false,"反射中枢や生命維持の中枢がある部位。"],
  ["一次運動野と運動前野",false,"大脳皮質の運動関連領域。"]],
 exp:"協調した滑らかな動作や<b>運動の学習</b>のためには、<b>大脳基底核</b>と<b>小脳</b>が不可欠である。（教科書 P45）"},

{part:"A",q:"摂食や飲水などの本能行動に重要な役割を果たすのはどれか。",
 choices:[
  ["視床下部",true,""],
  ["小脳",false,"協調した滑らかな動作や運動の学習に関わる部位。"],
  ["脊髄",false,"反射中枢や、歩行の基本パターンをつくる神経機構がある部位。"],
  ["一次運動野",false,"大脳皮質の運動関連領域。"]],
 exp:"摂食・飲水・性行動などの情動行動、本能行動には、<b>視床下部</b>と大脳辺縁系が重要な役割を果たす。（教科書 P45）"},

{part:"A",q:"運動に関わる脳部位の組織について正しいのはどれか。",
 choices:[
  ["階層的に組織されていて、上位層が関係するほど複雑な運動を滑らかに行える",true,""],
  ["階層的に組織されていて、下位層が関係するほど複雑な運動を滑らかに行える",false,"上位と下位の関係が逆。"],
  ["各部位はそれぞれ独立しており、互いに関係せず運動を制御する",false,"教科書は階層的な組織と述べている。"],
  ["大脳皮質だけで運動のすべてを制御している",false,"反射や歩行パターンのように、脊髄・脳幹が担う運動もある。"]],
 exp:"脳部位は<b>階層的</b>に組織されていて、<b>上位層</b>が関係するほど複雑な運動を滑らかに行うことが可能になる。（教科書 P45）"},

/* ---------- A-6 伝導路（P45） ---------- */

{part:"A",q:"運動関連領域（主として一次運動野）から脊髄前角のα運動ニューロンへつながる下行性伝導路はどれか。",kihon:true,dobon:true,

/* ===== コース設定 =====
   初見（🔥）10問は毎回全問入れる。コースの問題数から10を引いた残りを
   パートのプール数に比例配分（最大剰余法）した結果が下の alloc。
   コンプリート50 → パートから40問、コンプリート100 → パートから90問。 */
const COURSES={
  c50 :{name:"コンプリート50", alloc:{A:8, B:6, C1:7, C2:6, D:5, E:8}},
  c100:{name:"コンプリート100",alloc:{A:18,B:14,C1:16,C2:13,D:12,E:17}},
  all :{name:"ALL（全問）",    alloc:null}
};

/* ===== エンジン ===== */
const app=document.getElementById("app");
let courseKey="c50",livesMax=3,lives=3,qs=[],idx=0,miss=0,streak=0,best=0,dead=false,locked=false;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function qHTML(t){return esc(t).replace(/誤っている/g,'<span class="err">誤っている</span>');}
function hearts(){return livesMax>=99?"":"♥".repeat(Math.max(lives,0))+'<span style="opacity:.3">'+"♥".repeat(Math.max(livesMax-lives,0))+"</span>";}

function pickSet(){
  const c=COURSES[courseKey];
  if(!c.alloc)return shuffle(POOL);
  let out=POOL.filter(x=>x.part==="X");
  for(const p in c.alloc){
    out=out.concat(shuffle(POOL.filter(x=>x.part===p)).slice(0,c.alloc[p]));
  }
  return shuffle(out);
}

/* ---- STEP1：問題数 ---- */
function start(){
  app.innerHTML=`
  <div class="hd"><div><div class="ch">第4章 運動の生理</div><div class="tt">章末コンプリートチャレンジ</div></div></div>
  <div class="start">
    <div class="step">STEP 1 / 2</div>
    <div class="lead">パートA〜Eの確認テスト全問に、ここでしか出ない初見問題を混ぜた総仕上げです。<br>
    まず、何問に挑戦するかを選んでください。</div>
    <div class="modes">
      <button class="mbtn" onclick="step2('c50')">
        <div class="mt">コンプリート50</div>
        <div class="md">全パートからバランスよく50問。まずは力試しに。</div>
      </button>
      <button class="mbtn" onclick="step2('c100')">
        <div class="mt">コンプリート100</div>
        <div class="md">100問。試験前の総点検に。</div>
      </button>
      <button class="mbtn hot" onclick="step2('all')">
        <div class="mt">🏆 ALL（全問）</div>
        <div class="md">プール${POOL.length}問すべてに挑戦。完走できるか。</div>
      </button>
    </div>
    <div class="legend">
      🎯 基本 … 落としてはいけない基本・頻出問題<br>
      ⚠ 誤りを選ぶ … 「誤っているのはどれか」形式<br>
      📘 補足（資料外） … 教科書には載っていない国試頻出テーマ<br>
      🔥 チャレンジ限定 … ここでしか出ない初見問題（毎回すべて出ます）
    </div>
  </div>`;
}

/* ---- STEP2：ライフ ---- */
function step2(ck){
  courseKey=ck;
  const c=COURSES[ck];
  app.innerHTML=`
  <div class="hd"><div><div class="ch">第4章 運動の生理 ｜ ${c.name}</div><div class="tt">章末コンプリートチャレンジ</div></div></div>
  <div class="start">
    <div class="step">STEP 2 / 2</div>
    <div class="lead">ライフの数を選んでください。<br>どのモードでも<b>選び直しはできません</b>。間違えても解説は表示されます。</div>
    <div class="modes">
      <button class="mbtn hot" onclick="begin(1)">
        <div class="mt">一発勝負</div>
        <div class="md">1問でも間違えたら終了。何問連続で正解できるかに挑戦します。</div>
      </button>
      <button class="mbtn" onclick="begin(3)">
        <div class="mt">♥♥♥ ライフ 3</div>
        <div class="md">3回間違えたら終了。</div>
      </button>
      <button class="mbtn" onclick="begin(5)">
        <div class="mt">♥♥♥♥♥ ライフ 5</div>
        <div class="md">5回間違えたら終了。長いコースはこちらから。</div>
      </button>
    </div>
  </div>
  <div class="ctrl"><button class="btn" onclick="start()">◀ 問題数を選び直す</button><span class="cnt">${c.name}</span></div>`;
}

function begin(lv){
  livesMax=lv;lives=lv;qs=pickSet();idx=0;miss=0;streak=0;best=0;dead=false;
  render();
}

function render(){
  const it=qs[idx];
  locked=false;
  let tags="";
  if(it.shinmon)tags+='<span class="tag t-sh">🔥 チャレンジ限定</span>';
  else if(it.kihon)tags+='<span class="tag t-ki">🎯 基本</span>';
  if(it.gori)tags+='<span class="tag t-go">⚠ 誤りを選ぶ</span>';
  if(it.hosoku)tags+='<span class="tag t-ho">📘 補足（資料外）</span>';

  it._order=shuffle(it.choices.map((c,i)=>i));
  let cs="";
  it._order.forEach((ci,pos)=>{
    cs+=`<button class="c" id="c${pos}" onclick="pick(${pos})">${esc(it.choices[ci][0])}</button>`;
  });

  app.innerHTML=`
  <div class="hd">
    <div><div class="ch">第4章 運動の生理 ｜ ${COURSES[courseKey].name}</div>
    <div class="tt">章末コンプリートチャレンジ</div></div>
    <div class="rt"><span class="hp">${hearts()}</span><br>第 ${idx+1} 問 / ${qs.length}問　連続 ${streak}</div>
  </div>
  <div class="bar"><i style="width:${idx/qs.length*100}%"></i></div>
  <div class="bd">
    <div class="tags">${tags||'<span class="tag t-ki" style="visibility:hidden">-</span>'}</div>
    <div class="q">${qHTML(it.q)}</div>
    <div class="ch-list">${cs}</div>
    <div id="fb"></div>
  </div>
  <div class="ctrl" id="ctrl"><span class="cnt">選択肢をクリックすると判定されます（選び直しはできません）</span></div>`;
}

function pick(pos){
  if(locked)return;
  locked=true;
  const it=qs[idx];
  const c=it.choices[it._order[pos]];
  const btn=document.getElementById("c"+pos);

  if(c[1]){
    btn.classList.add("ok");
    disableAll();
    streak++;if(streak>best)best=streak;
    showFB(true,"正解！",it.exp);
  }else{
    btn.classList.add("ng");
    disableAll();
    miss++;lives--;streak=0;
    if(lives<=0)dead=true;
    showFB(false,dead?"ライフが尽きました":"不正解（ライフ −1）",
      `選んだのは「${esc(c[0])}」。${c[2]}<br><br><b>解説：</b>${it.exp}`);
  }
  document.querySelector(".hd .rt").innerHTML=`<span class="hp">${hearts()}</span><br>第 ${idx+1} 問 / ${qs.length}問　連続 ${streak}`;
  nextBtn();
}

function disableAll(){document.querySelectorAll(".c").forEach(b=>{b.disabled=true;if(!b.classList.contains("ok")&&!b.classList.contains("ng"))b.classList.add("mute");});}

function showFB(ok,title,body){
  document.getElementById("fb").innerHTML=
   `<div class="fb ${ok?"ok":"ng"}"><div class="ttl">${title}</div><div>${body}</div></div>`;
}

function nextBtn(){
  const last=(idx===qs.length-1);
  document.getElementById("ctrl").innerHTML=
   (dead||last)
   ? `<button class="btn btnp" onclick="result()">結果を見る ▶</button><span class="cnt">${dead?"ライフ切れのため終了":"これが最後の問題です"}</span>`
   : `<button class="btn btnp" onclick="next()">次の問題へ ▶</button><span class="cnt">残り ${qs.length-idx-1} 問</span>`;
}

function next(){idx++;render();}

function result(){
  const done=dead?idx+1:qs.length;
  const correct=done-miss;
  const complete=(!dead&&miss===0);
  const body=`
    <div class="course">${COURSES[courseKey].name}｜${livesMax===1?"一発勝負":"ライフ "+livesMax}</div>
    <div class="big${dead?" ng":""}">${correct} / ${done} 問正解</div>
    <div class="sub">最長連続正解　<b>${best} 問</b><br>
    ${dead?`${done}問目でライフが尽きました。全${qs.length}問のうち${done}問に挑戦。`:`全${qs.length}問を走りきりました。`}</div>
    ${complete?'<div class="perfect">🏆 COMPLETE ノーミス完走！</div>':""}`;
  app.innerHTML=`
  <div class="hd"><div><div class="ch">第4章 運動の生理 ｜ 章末コンプリートチャレンジ</div>
  <div class="tt">結果</div></div></div>
  <div class="bar"><i style="width:100%"></i></div>
  <div class="res">${body}</div>
  <div class="ctrl">
    <button class="btn btnp" onclick="begin(${livesMax})">もう一度（同じコース）▶</button>
    <button class="btn" onclick="start()">コースを選び直す</button>
    <span class="cnt">プール${POOL.length}問から出題</span>
  </div>`;
}
start();
</script>
