<h1>生理学 第6章 内分泌｜パートC：膵臓・性腺・血圧と血糖の調節 確認テスト</h1>
<div class="slide">

<script>
/* ===== 問題プール（教科書 第6章 P97〜101 ベース）=====
   choices: [表示文, 正解フラグ, その選択肢が何かの説明]
   kihon :true … 🎯基本。通常モードで「ここは重要」と示す印。プールの4〜6割が目安
   dobon :true … 💣ドボン。ドボンモードで外すと即終了。プールの15〜20%に絞る
   （旧）kihon :true … 落としちゃダメな基本問題（🎯基本／ドボンモードでは💣ドボン！）
   gori  :true … 「誤っているのはどれか」形式。設問の上に ⚠ 誤りを選ぶ タグが出る
                  gori問題では、true が付くのは「誤っている記述」＝選ぶべき選択肢
   hosoku:true … 教科書に記述のない補足知識（国試過去問の頻出テーマ）。kihon とは併用しない
   exp … 正解時に見せる「なぜ正しいか」 */
const PICK=5;
const POOL=[

/* ---------- C-1 膵臓 ---------- */

{q:"ランゲルハンス島のβ細胞から分泌されるのはどれか。",kihon:true,
 choices:[
  ["インスリン",true,""],
  ["グルカゴン",false,"ランゲルハンス島のα細胞（A細胞）から分泌される。"],
  ["ソマトスタチン",false,"ランゲルハンス島のδ細胞（D細胞）から分泌される。"],
  ["消化酵素",false,"膵臓の外分泌腺から分泌され、食物の消化吸収を助ける。"]],
 exp:"ランゲルハンス島（膵島）では、<b>α細胞→グルカゴン</b>、<b>β細胞→インスリン</b>、<b>δ細胞→ソマトスタチン</b>が分泌される。（教科書 P97、図6・12）"},

{q:"ランゲルハンス島の細胞と分泌ホルモンの組合せで正しいのはどれか。",
 choices:[
  ["δ細胞 ― ソマトスタチン",true,""],
  ["α細胞 ― インスリン",false,"α細胞が分泌するのは血糖を上げるホルモン。組合せが入れ替わっている。"],
  ["β細胞 ― グルカゴン",false,"β細胞が分泌するのは血糖を下げるホルモン。組合せが入れ替わっている。"],
  ["δ細胞 ― グルカゴン",false,"δ細胞が分泌するのは、インスリンやグルカゴンの分泌を抑えるホルモン。"]],
 exp:"<b>δ（D）細胞</b>は<b>ソマトスタチン</b>を分泌し、ランゲルハンス島内でインスリンやグルカゴンの分泌を抑制する。（教科書 P97）"},

{q:"血糖値を下げることができるホルモンはどれか。",kihon:true,dobon:true,
 choices:[
  ["インスリン",true,""],
  ["グルカゴン",false,"肝臓でのグリコーゲン分解と糖新生を促し、血糖値を上げるホルモン。"],
  ["成長ホルモン",false,"血糖値を上げる作用をもつホルモン。"],
  ["コルチゾル",false,"肝臓での糖新生を促し、血糖値を上げるホルモン。"]],
 exp:"グルカゴン・成長ホルモン・アドレナリン・ノルアドレナリン・コルチゾルは血糖値を上げる。<b>血糖値を下げることができるホルモンはインスリンのみ</b>。（教科書 P89）"},

{q:"インスリンの作用はどれか。",kihon:true,dobon:true,
 choices:[
  ["肝臓でのグリコーゲン合成の促進",true,""],
  ["肝臓でのグリコーゲン分解の促進",false,"向きが逆。グルカゴンやアドレナリンの作用。"],
  ["脂肪組織での脂肪分解の促進",false,"向きが逆。インスリンは脂肪組織で脂肪の合成と蓄積を促進する。"],
  ["骨格筋でのタンパク質合成の抑制",false,"向きが逆。インスリンはアミノ酸の取り込みを促し、タンパク質の合成を増加させる。"]],
 exp:"インスリンは骨格筋・脂肪組織・肝臓ではたらく。<b>肝臓と骨格筋ではグリコーゲンの合成を促進</b>し、脂肪組織では脂肪の合成と蓄積を、骨格筋ではタンパク質の合成を促進する。（教科書 P97）"},

{q:"インスリンによってグルコースの取り込みが促進されるのはどれか。",kihon:true,
 choices:[
  ["骨格筋",true,""],
  ["赤血球",false,"インスリンによる取り込み（GLUT4）が示されている組織ではない。"],
  ["腸上皮細胞",false,"インスリンによる取り込み（GLUT4）が示されている組織ではない。"],
  ["大脳のニューロン",false,"インスリンによる取り込み（GLUT4）が示されている組織ではない。"]],
 exp:"インスリンは<b>骨格筋</b>や<b>脂肪組織</b>でグルコースの取り込みを促進する。取り込みは<b>GLUT4</b>を介して行われ、GLUT4は骨格筋・脂肪組織・心筋にみられる。（教科書 P97、P101）"},

{q:"インスリンの刺激で細胞膜へ移動し、グルコースを細胞内に取り込むのはどれか。",
 choices:[
  ["グルコース輸送体4（GLUT4）",true,""],
  ["Na⁺-K⁺ポンプ",false,"Na⁺とK⁺を運んで細胞内外の濃度差をつくるしくみ。"],
  ["電位依存性Na⁺チャネル",false,"膜電位の変化で開閉し、活動電位の上昇相をつくるチャネル。"],
  ["アンジオテンシン変換酵素",false,"アンジオテンシンⅠをアンジオテンシンⅡに変換する酵素。"]],
 exp:"標的細胞でのグルコースの取り込みは<b>グルコース輸送体4（GLUT4）</b>を介して行われる。GLUT4はインスリン刺激で細胞内から細胞膜に移行し、細胞外のグルコースを取り込む。（教科書 P101）"},

{q:"インスリンについて誤っているのはどれか。",kihon:true,gori:true,
 choices:[
  ["血糖値が下がると分泌が促進される",true,""],
  ["β細胞から分泌される",false,"教科書どおりの記述なので、正しい。"],
  ["骨格筋でのタンパク質合成を増やす",false,"教科書どおりの記述なので、正しい。"],
  ["脂肪組織で脂肪の合成を促進する",false,"教科書どおりの記述なので、正しい。"]],
 exp:"食後などに<b>血糖が高くなると</b>インスリンの分泌がさかんになる。低血糖時にはインスリン分泌は<b>低下</b>する。（教科書 P101）"},

{q:"グルカゴンの作用はどれか。",kihon:true,
 choices:[
  ["肝臓でのグリコーゲン分解の促進",true,""],
  ["肝臓でのグリコーゲン合成の促進",false,"向きが逆。インスリンの作用。"],
  ["骨格筋へのグルコース取り込みの促進",false,"インスリンの作用。"],
  ["脂肪組織での脂肪合成の促進",false,"インスリンの作用。"]],
 exp:"グルカゴンは肝臓での<b>グリコーゲン分解</b>と<b>アミノ酸からの糖新生</b>を促すことで、グルコースの放出量を増やし<b>血糖を上昇</b>させる。（教科書 P97）"},

{q:"膵臓で分泌されるソマトスタチンの作用はどれか。",
 choices:[
  ["インスリンやグルカゴンの分泌を抑制する",true,""],
  ["血糖値を上昇させる",false,"グルカゴンなどの作用。"],
  ["インスリンの分泌を促進する",false,"向きが逆。ソマトスタチンは分泌を抑える側にはたらく。"],
  ["消化酵素の分泌を促進する",false,"ソマトスタチンの作用としては示されていない。"]],
 exp:"ソマトスタチンは主に<b>ランゲルハンス島内でインスリンやグルカゴンの分泌を抑制</b>する。視床下部では成長ホルモンの分泌を抑える（GHIH）。（教科書 P91、P97）"},

/* ---------- C-2 血糖調節 ---------- */

{q:"飢餓（低血糖）時に起こるのはどれか。",kihon:true,dobon:true,
 choices:[
  ["グルカゴンの分泌増加",true,""],
  ["インスリンの分泌増加",false,"向きが逆。低血糖時にはインスリン分泌は低下する。"],
  ["肝臓でのグリコーゲン合成の促進",false,"血糖を下げる方向の反応。低血糖時にはグリコーゲンは分解される。"],
  ["骨格筋へのグルコース取り込みの促進",false,"血糖を下げる方向の反応。低血糖時にはグルコースの利用が制限される。"]],
 exp:"低血糖時には<b>グルカゴン</b>・アドレナリン・コルチゾルの分泌が増え、肝臓でのグリコーゲン分解や糖新生で血糖を上げる。<b>インスリン分泌は低下</b>し、さまざまな組織でグルコースの利用が制限される。（教科書 P99〜101、図6・14）"},

{q:"低血糖時に、肝臓での糖新生を促して血糖を上げる副腎皮質ホルモンはどれか。",
 choices:[
  ["コルチゾル",true,""],
  ["アルドステロン",false,"副腎皮質ホルモンだが、腎臓でのNa⁺の再吸収を促すミネラルコルチコイド。"],
  ["アドレナリン",false,"副腎髄質のホルモン。肝臓のグリコーゲン分解を促進して血糖を上げる。"],
  ["アンドロゲン",false,"副腎皮質の網状層から少量分泌される性ホルモン。血糖調節の主役ではない。"]],
 exp:"低血糖時には交感神経が活性化されて副腎髄質からアドレナリンが、副腎皮質から<b>コルチゾル</b>が分泌される。アドレナリンは肝臓のグリコーゲン分解を、コルチゾルは肝臓の<b>糖新生</b>を促して血糖を上げる。（教科書 P101）"},

/* ---------- C-3 精巣 ---------- */

{q:"テストステロンの作用はどれか。",kihon:true,
 choices:[
  ["筋量の増加",true,""],
  ["血糖値の低下",false,"インスリンの作用。"],
  ["基礎体温の上昇",false,"プロゲステロンの作用。"],
  ["乳腺の発育",false,"プロラクチンやエストロゲン・プロゲステロンの作用。"]],
 exp:"テストステロンは思春期に<b>第二次性徴</b>を発現させ、恥毛の発育、<b>骨や筋の量の増加</b>をもたらす。筋量の増加は<b>タンパク質同化作用</b>の促進による。（教科書 P98）"},

{q:"精巣から分泌され、FSHの分泌を抑制するのはどれか。",
 choices:[
  ["インヒビン",true,""],
  ["テストステロン",false,"精巣から分泌されるアンドロゲンの主体。第二次性徴などを発現させる。"],
  ["黄体形成ホルモン",false,"下垂体前葉から分泌されるホルモン。"],
  ["プロラクチン",false,"下垂体前葉から分泌され、乳腺にはたらくホルモン。"]],
 exp:"<b>インヒビン</b>は精巣と卵巣から分泌されるポリペプチドで、<b>FSHの分泌を抑制</b>する。（教科書 P86、P92、表6・1）"},

{q:"テストステロンの局所濃度を大きく上げ、精子形成を促進するのはどれか。",
 choices:[
  ["アンドロゲン結合タンパク質（ABP）",true,""],
  ["インヒビン",false,"FSHの分泌を抑制するポリペプチド。"],
  ["黄体形成ホルモン",false,"下垂体前葉ホルモン。精巣でのテストステロン分泌などに関わる。"],
  ["オキシトシン",false,"下垂体後葉から放出され、子宮収縮や射乳にはたらくホルモン。"]],
 exp:"精子形成は、<b>アンドロゲン結合タンパク質（ABP）</b>がテストステロンの局所濃度を著しく上昇させることで促進される。ABPはFSHのはたらきで精巣で産生される。（教科書 P98）"},

/* ---------- C-4 卵巣 ---------- */

{q:"エストロゲンの作用はどれか。",kihon:true,dobon:true,
 choices:[
  ["子宮内膜の増殖",true,""],
  ["基礎体温の上昇",false,"プロゲステロンの作用。"],
  ["乳汁の射出",false,"オキシトシンの作用（射乳反射）。"],
  ["受精卵の着床の準備",false,"プロゲステロンの作用。"]],
 exp:"エストロゲンは思春期の女子に<b>第二次性徴</b>を発現させる。子宮では内膜の腺と血管を増殖させ（<b>子宮内膜の増殖</b>）、月経周期の増殖期を形成する。（教科書 P99）"},

{q:"基礎体温を上昇させるホルモンはどれか。",kihon:true,dobon:true,
 choices:[
  ["プロゲステロン",true,""],
  ["エストロゲン",false,"子宮内膜の増殖などにはたらく卵巣ホルモン。体温上昇作用は示されていない。"],
  ["テストステロン",false,"精巣から分泌される男性ホルモン。"],
  ["プロラクチン",false,"乳腺の発育や乳汁の産生を促すホルモン。"]],
 exp:"<b>プロゲステロン</b>には<b>基礎体温を上昇</b>させるはたらきがある。受精卵の着床に有利な状況もつくる。（教科書 P99）"},

{q:"エストロゲンについて誤っているのはどれか。",gori:true,
 choices:[
  ["子宮筋のオキシトシン感受性を低下させ、流産を防ぐ",true,""],
  ["思春期の女子に第二次性徴を発現させる",false,"教科書どおりの記述なので、正しい。"],
  ["子宮頸管の粘液分泌を増やす",false,"教科書どおりの記述なので、正しい。"],
  ["FSHの分泌を抑制する",false,"教科書どおりの記述なので、正しい。"]],
 exp:"妊娠中に子宮筋のオキシトシン（OXT）に対する感受性を低下させて流産を防ぐのは<b>プロゲステロン</b>の作用。（教科書 P99）"},

{q:"エストロゲンのうち、生物学的活性が最も高いのはどれか。",
 choices:[
  ["エストラジオール",true,""],
  ["エストロン",false,"エストロゲンの1つだが、活性が最も高いものではない。"],

let mode="normal", drawn=[], idx=0, score=0, streak=0, answered=false, dead=false;
let qmiss=0, totalMiss=0, firstTryCount=0; // ミス回数の集計（通常モード）
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function home(){
  document.getElementById("htt").textContent="確認テスト";
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="0";
  document.getElementById("bd").innerHTML=`
    <div class="center">
      <p class="lead">モードを選んでスタート。<br>問題は毎回シャッフルされ、プール${POOL.length}問から${PICK}問が出題されます。</p>
      <div class="modes">
        <button class="mode" onclick="start('normal')">
          <div class="nm">通常モード</div>
          <div class="ds">${PICK}問を最後まで解いて採点します。ふだんの確認用。<span class="mark kihon" style="margin-left:4px">🎯基本</span> は落としちゃダメな基本問題、<span class="mark gori">⚠ 誤りを選ぶ</span> は誤っているものを選ぶ問題、<span class="mark hosoku">📘 補足（資料外）</span> は教科書外の国試頻出テーマ。</div>
        </button>
        <button class="mode dob" onclick="start('dobon')">
          <div class="nm">💣 ドボンチャレンジ</div>
          <div class="ds">プールの中のごく一部、<b>絶対に落とせない最重要問題</b>だけが <b>💣ドボン！</b> に変身。それを外したらそこで終了。どこまで正解を続けられるか挑戦！</div>
        </button>
      </div>
    </div>`;
  document.getElementById("ctrl").innerHTML="";
}
function start(m){
  mode=m; drawn=shuffle(POOL).slice(0,Math.min(PICK,POOL.length));
  idx=0;score=0;streak=0;dead=false;totalMiss=0;firstTryCount=0;render();
}
function render(){
  answered=false; qmiss=0;
  const item=drawn[idx];
  const opts=shuffle(item.choices);
  const isDob=(mode==="dobon" && item.dobon);
  document.getElementById("htt").textContent=(mode==="dobon")?"ドボンチャレンジ":"確認テスト";
  document.getElementById("pg").textContent=`問 ${idx+1} / ${drawn.length}`;
  document.getElementById("bar").style.width=(idx/drawn.length*100)+"%";
  const L=["ア","イ","ウ","エ","オ"];
  // ドボン対象の問題だけ💣に変わる。それ以外の🎯基本は通常どおり🎯のまま表示する
  let markHtml = isDob ? `<span class="mark dobon">💣 ドボン！</span>`
                       : (item.kihon ? `<span class="mark kihon">🎯 基本</span>` : "");
  if(item.gori)   markHtml += `<span class="mark gori">⚠ 誤りを選ぶ</span>`;
  if(item.hosoku) markHtml += `<span class="mark hosoku">📘 補足（資料外）</span>`;
  // 誤り選択問題は、設問中の「誤っている」を赤字にして読み飛ばしを防ぐ
  const qText = item.gori ? item.q.replace("誤っている",'<span class="ng">誤っている</span>') : item.q;
  let h=`<div class="qnum">Q${idx+1} ${markHtml}</div><div class="q">${qText}</div><div class="opts">`;
  opts.forEach((o,i)=>{h+=`<button class="opt" onclick="pick(this,${o[1]})"><span class="mk">${L[i]}</span><span>${o[0]}</span></button>`;});
  h+=`</div><div class="exp" id="exp"><div class="vd" id="vd"></div><div class="tx" id="tx"></div></div>`;
  document.getElementById("bd").innerHTML=h;
  document.getElementById("ctrl").innerHTML=`<button class="btn" id="nx" onclick="next()" disabled>解答を選んでください</button>`;
}
function pick(el,ok){
  if(answered)return;
  if(el.classList.contains("dis"))return; // 無効化済みの選択肢は再カウントしない
  const item=drawn[idx];
  const isDob=(mode==="dobon" && item.dobon);
  const selText=el.querySelector("span:last-child").textContent;
  const selChoice=item.choices.find(c=>c[0]===selText);
  const exp=document.getElementById("exp");
  const nx=document.getElementById("nx");

  if(ok){
    // 正解：ここで確定。正解した選択肢だけ緑にする（不正解の選択肢は先に色を変えない）
    answered=true;
    el.classList.add("correct");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    score++;
    if(mode!=="dobon"){ if(qmiss===0) firstTryCount++; }
    if(mode==="dobon") streak++;
    exp.className="exp show ok";
    document.getElementById("vd").textContent=(qmiss===0)?"正解！":"正解！（"+qmiss+"回目で正解）";
    document.getElementById("tx").innerHTML=item.exp;
    nx.disabled=false;
    nx.textContent=(idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶";
    return;
  }

  // 不正解
  if(mode==="dobon"){
    // ドボンモードは一発勝負：選び直しなし・正解は伏せる
    answered=true;
    el.classList.add("wrong");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    if(item.dobon){ dead=true; } // 💣ドボン対象を外したときだけ終了
    exp.className="exp show ng";
    document.getElementById("vd").textContent=isDob?"💣 ドボン！":"不正解";
    document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}`;
    nx.disabled=false;
    nx.textContent=dead?"結果を見る（ドボン）▶":((idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶");
    return;
  }

  // 通常モード：ミスを数え、選んだ選択肢だけ赤にして無効化。正解は伏せたまま選び直せる
  qmiss++; totalMiss++;
  el.classList.add("wrong","dis");
  exp.className="exp show ng";
  document.getElementById("vd").textContent="不正解（ミス "+qmiss+"回）";
  document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}<br>ほかの選択肢からもう一度選んでください。`;
  // 「次へ」はまだ出さない（正解するまで進めない）
}
function next(){
  if(dead){result();return;}
  if(idx+1<drawn.length){idx++;render();}
  else result();
}
function result(){
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="100%";
  if(mode==="dobon"){
    document.getElementById("htt").textContent="結果";
    if(dead){
      document.getElementById("bd").innerHTML=`<div class="center score dead">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>ドボンを踏んでしまいました</div>
        <div class="big">${streak} 問連続正解</div>
        <div class="msg">${idx}問正解のあと、${idx+1}問目でドボン。<br>上の解説を復習して再挑戦しましょう。</div>
      </div>`;
    }else{
      document.getElementById("bd").innerHTML=`<div class="center score">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>クリア！</div>
        <div class="big">${score} / ${drawn.length}</div>
        <div class="msg">ドボンを踏まず完走しました。お見事！</div>
      </div>`;
    }
  }else{
    document.getElementById("htt").textContent="結果";
    const n=drawn.length;
    const ftPct=Math.round(firstTryCount/n*100);
    const noMiss=(totalMiss===0);
    let head = noMiss
      ? `<div class="big">✨ ノーミス パーフェクト！</div><div>全 ${n} 問を一発で正解</div>`
      : `<div>今回の成績</div><div class="big">${firstTryCount} / ${n}</div><div>一発正解率 ${ftPct}%</div>`;
    let stat = `<div class="stats">一発正解 ${firstTryCount}問　｜　総ミス ${totalMiss}回</div>`;
    let msg = noMiss?"完璧です。この調子！":ftPct>=60?"よくできました。ミスした問題を復習しましょう。":"もう一度スライドで確認してから挑戦しましょう。";
    document.getElementById("bd").innerHTML=`<div class="center score">${head}${stat}<div class="msg">${msg}</div></div>`;
  }
  document.getElementById("ctrl").innerHTML=`<button class="btn sub" onclick="home()">モード選択へ</button><button class="btn" onclick="start(mode)">もう一度（シャッフル）▶</button>`;
}
home();
</script>
