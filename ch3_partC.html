<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第3章 神経の生理 パートC｜生理学スライド</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:#f0f2f5;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 12px}
h1{font-size:14px;color:#555;margin-bottom:16px;font-weight:400;letter-spacing:.05em}
.slide{width:100%;max-width:820px;background:#fff;border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,.10);overflow:hidden}
.hd{background:#3a4a8c;padding:14px 28px}
.hd .ch{font-size:11px;color:#b8c2e8;font-weight:500;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.hd .tt{font-size:20px;font-weight:500;color:#fff}
.bd{padding:20px 28px 16px;background:#fff}
.sec{font-size:10px;font-weight:600;color:#888;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.box{background:#f8f9fb;border:1px solid #e5e7eb;border-radius:8px;padding:14px 18px;margin-bottom:12px}
.row{display:block;font-size:14px;line-height:1.9;color:#222;padding:5px 0;border-bottom:1px solid #e5e7eb}
.row:last-child{border-bottom:none}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#3a4a8c;color:#fff;padding:8px 10px;font-weight:500;text-align:left;font-size:12px}
.tbl td{padding:8px 10px;border-bottom:1px solid #e5e7eb;vertical-align:top;color:#222;line-height:1.7}
.tbl tr:last-child td{border-bottom:none}
.tbl td:first-child{font-weight:600;color:#3a4a8c;white-space:nowrap;min-width:110px}
.tbl.sm{font-size:12px}
.tbl.sm th{font-size:11px;padding:7px 7px}
.tbl.sm td{padding:6px 7px;line-height:1.6}
.tbl.sm td:first-child{min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:4px;margin-bottom:7px}
.tf{background:rgba(58,74,140,.12);color:#3a4a8c}
.tb{background:rgba(168,96,46,.14);color:#a8602e}
.blank{display:inline-block;min-width:72px;border-bottom:2.5px solid #3a4a8c;border-radius:3px 3px 0 0;cursor:pointer;text-align:center;padding:0 5px;transition:all .22s;position:relative;vertical-align:baseline}
.blank::after{content:"？";font-size:12px;color:#3a4a8c;opacity:.45;position:absolute;left:50%;transform:translateX(-50%)}
.blank span{visibility:hidden;font-weight:600;color:#3a4a8c;font-size:14px;opacity:0;transition:opacity .22s;display:inline-block}
.blank.on{border-bottom-color:transparent;background:rgba(58,74,140,.1);border-radius:4px;padding:1px 7px}
.blank.on::after{display:none}
.blank.on span{visibility:visible;opacity:1}
.blank:not(.on):hover{background:rgba(58,74,140,.07)}
.ctrl{display:flex;align-items:center;gap:8px;padding:10px 28px 12px;background:#f8f9fb;border-top:1px solid #e5e7eb;flex-wrap:wrap}
.btn{padding:7px 15px;border-radius:6px;border:1px solid #d1d5db;background:#fff;color:#333;font-size:12px;cursor:pointer;font-family:inherit;transition:background .15s}
.btn:hover{background:#f0f2f5}
.btnp{background:#3a4a8c;color:#fff;border-color:#3a4a8c}
.btnp:hover{background:#2f3d73}
.cnt{font-size:11px;color:#888;margin-left:auto}
.nav{display:flex;align-items:center;gap:7px;padding:9px 28px 11px;background:#f8f9fb;border-top:1px solid #e5e7eb;border-radius:0 0 12px 12px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:#d1d5db;cursor:pointer;transition:background .18s;flex-shrink:0}
.dot.a{background:#3a4a8c}
.pg{font-size:11px;color:#888;margin-left:auto}
</style>
</head>
<body>
<h1>生理学 第3章 神経の生理｜パートC：神経系の構成・脳の構造と機能局在・連合野・言語中枢</h1>
<div class="slide">
  <div id="sc"></div>
  <div class="ctrl">
    <button class="btn" onclick="nxt()">次のカッコを開く ▶</button>
    <button class="btn" onclick="all()">すべて表示</button>
    <button class="btn" onclick="rst()">リセット</button>
    <button class="btn btnp" onclick="go(cur-1)">◀ 前へ</button>
    <button class="btn btnp" onclick="go(cur+1)">次へ ▶</button>
    <span class="cnt" id="cnt"></span>
  </div>
  <div class="nav" id="nav"></div>
</div>
<script>
const S=[
{t:"神経系の全体構成",ch:"第3章 神経の生理 ｜ B 神経系の構成",type:"tbl",
cols:["区分","内訳"],
rows:[
["[中枢神経系]","[脳]／[脊髄]"],
["[末梢神経系]","[体性神経系]（運動・感覚）／[自律神経系]"],
["体性神経系","[運動神経]／[感覚神経]"],
["自律神経系","[交感神経]（胸髄・腰髄から）／[副交感神経]（脳幹・仙髄から）"],
]},
{t:"中枢神経系",ch:"第3章 神経の生理 ｜ B-1 中枢神経系",type:"p",
rows:[
{t:"中枢神経系は [脳] と [脊髄] からなる．",b:["脳","脊髄"]},
{t:"脳は，おびただしい数（[数百〜数千億個]）のニューロンで構成された中枢神経系の中心的な器官である．",b:["数百〜数千億個"]},
{t:"脊髄は，[頸髄]・[胸髄]・[腰髄]・[仙髄] で構成されている．",b:["頸髄","胸髄","腰髄","仙髄"]},
]},
{t:"末梢神経系",ch:"第3章 神経の生理 ｜ B-2 末梢神経系",type:"p",
rows:[
{t:"中枢神経系に入出力する神経線維群を [末梢神経系] と呼ぶ．この神経線維群はからだ全体に分布する．",b:["末梢神経系"]},
{t:"機能の違いから [体性神経系] と [自律神経系] に分類される．",b:["体性神経系","自律神経系"]},
{t:"体性神経系は，運動や感覚などの [動物性機能] に関与する神経である．",b:["動物性機能"]},
{t:"自律神経系は，呼吸・循環・排泄・体温調節などの [植物性機能] に関与する神経である．",b:["植物性機能"]},
{t:"どちらの神経にも，各種受容器に由来する情報を中枢神経系へ伝達する [求心性神経線維] と，中枢神経系からの指令を効果器へ伝える [遠心性神経線維] が含まれている．",b:["求心性神経線維","遠心性神経線維"]},
]},
{t:"脳の構造",ch:"第3章 神経の生理 ｜ C-1 脳の構造",type:"p",
rows:[
{t:"脳は，生きていくために最低限必要な呼吸・摂食・睡眠などの活動を司るだけではなく，人間らしく生きるための思考や言語機能などの機能（[高次機能]）を担っている．",b:["高次機能"]},
{t:"脳は，[小脳]・[延髄]・[橋]・[中脳]・[間脳]（視床，視床下部）・[終脳]（大脳基底核，大脳皮質）で構成されている．",b:["小脳","延髄","橋","中脳","間脳","終脳"]},
{t:"成人の脳は約 [1,400g] であり，他の動物に比べて著しく発達した [大脳皮質] が脳表面を覆っている．",b:["1,400g","大脳皮質"]},
{t:"脳表面に多数の「[皺]（溝）」があり，その表面積は約 [2,500cm²] と新聞紙ほどの大きさになる．",b:["皺","2,500cm²"]},
]},
{t:"脳の数値と血液脳関門",ch:"第3章 神経の生理 ｜ C-1 脳の構造",type:"p",
rows:[
{t:"脳は，頭蓋骨の中にあり [脳脊髄液] に浮かんでいる．",b:["脳脊髄液"]},
{t:"脳には約 [1,000億個] のニューロンがある．シナプスは約 [100兆個] に上る．",b:["1,000億個","100兆個"]},
{t:"これらのニューロンへ酸素や栄養素を供給したり，老廃物を除去したりする必要があることから，脳には [血管] がよく発達している．",b:["血管"]},
{t:"また脳には，血液中の物質がニューロンへ影響を直接与えることを防ぐ [血液脳関門]（blood-brain barrier）がある．",b:["血液脳関門"]},
{t:"この機能は，ニューロンを栄養している [グリア細胞]（数はニューロンの数倍）のはたらきでなされている．",b:["グリア細胞"]},
]},
{t:"大脳皮質の機能局在",ch:"第3章 神経の生理 ｜ C-2 大脳皮質の機能局在",type:"p",
rows:[
{t:"大脳皮質は，組織学的特徴から [52] の部位に分類される．",b:["52"]},
{t:"[ブロードマン]（Brodmann）が組織構造に基づいて作成したものが [脳地図] である．",b:["ブロードマン","脳地図"]},
{t:"大脳皮質は部位ごとに機能が異なる．これを [機能局在] と呼ぶ．",b:["機能局在"]},
{t:"機能局在がもっとも明確な部位は，[運動野] と [感覚野] である．",b:["運動野","感覚野"]},
{t:"一次運動野（ブロードマンの [4野]）を電気刺激すると，からだの部位に対応した運動機能が再現される．これを一次運動野の [体部位再現] という．",b:["4野","体部位再現"]},
{t:"[体性感覚野] でも同様の体部位の局在性が確認できる．",b:["体性感覚野"]},
]},
{t:"連合野とは",ch:"第3章 神経の生理 ｜ C-3 連合野の統合機能",type:"p",
rows:[
{t:"ヒトの脳でもっとも発達した大脳皮質の部位は [連合野] である．",b:["連合野"]},
{t:"連合野は，大脳皮質で広い領域を占め，[前頭連合野]・[頭頂連合野]・[側頭連合野] に分類される．",b:["前頭連合野","頭頂連合野","側頭連合野"]},
{t:"各連合野は機能的にも発生学的にも [高次] の皮質領域である．",b:["高次"]},
{t:"運動野・体性感覚野・聴覚野・視覚野の機能と密接に連携しながら，種々の [統合的] な作用を営んでいる．",b:["統合的"]},
]},
{t:"表3・2 連合野の機能",ch:"第3章 神経の生理 ｜ C-3 連合野の統合機能",type:"tbl",small:true,
cols:["部位","機能","損傷時の症状"],
rows:[
["前頭連合野　運動前野","[運動の統合中枢]","[失行症]"],
["前頭連合野　前言語野","発声の統合中枢（[ブローカ野]）","[運動性失語症]"],
["前頭連合野　前頭前野","[創造・意欲]の中枢／人格の統合","[人格変容]"],
["[頭頂連合野]","知覚・[空間の認知]／記憶の保持","[失認症]"],
["[側頭連合野]","聴覚に関した言語中枢（[ウェルニッケ野]）","[感覚性失語症]，精神ろう"],
["側頭連合野","[視覚の高次中枢]","失認症"],
]},
{t:"各連合野のはたらき",ch:"第3章 神経の生理 ｜ C-3 連合野の統合機能",type:"p",
rows:[
{t:"連合野は，感覚に関連する領野からの情報を受け取り，統合された情報を [運動関連領野] へ伝え意識状態を調整し，本能的なはたらきを担う [大脳辺縁系] の活動を調節する．",b:["運動関連領野","大脳辺縁系"]},
{t:"[前頭連合野] は，連合野の中でも特に高度な [統合作用] をもっており，[知的機能] を主に担う．",b:["前頭連合野","統合作用","知的機能"]},
{t:"前頭連合野を損傷すると，創造力・計画力の低下や [人格の変容]（軽薄，粗野，短気，無気力など）を生じ，欲望や情感などをコントロールできなくなる．",b:["人格の変容"]},
{t:"[頭頂連合野] は，視覚と体性感覚に関連する領域からの情報を受けて，[空間認知] と環境への注意喚起などにはたらく．損傷すると，物を手で触ってもそれが何かがわからなくなる．",b:["頭頂連合野","空間認知"]},
{t:"右半球損傷者の約 [4割] で [左半側空間無視] が認められる．一方，左半球損傷で右半側空間無視が起こることはまれである．",b:["4割","左半側空間無視"]},
{t:"[側頭連合野] は，高次の聴覚情報処理や視覚形態認知のほか，言語機能や視覚的記憶などに関わっている．",b:["側頭連合野"]},
{t:"言語野は約 [95%] の人で [左半球] にみられる．",b:["95%","左半球"]},
]},
{t:"言語中枢",ch:"第3章 神経の生理 ｜ C-3 連合野の統合機能",type:"two",
left:{label:"ブローカ野",tag:"tf",rows:[
{t:"[前頭連合野] にある [運動性言語中枢]．",b:["前頭連合野","運動性言語中枢"]},
{t:"障害では，人の話を [理解] したり発声をしたりすることには問題がない．",b:["理解"]},
{t:"しかし，話し方が遅くなり [構音]（正確な発声機能）に障害が生じる（[運動性失語症]）．",b:["構音","運動性失語症"]},
{t:"ウェルニッケ野からの情報を受けて言語の [パターン] をつくり，運動性皮質にその情報を出力すると考えられている．",b:["パターン"]},
]},
right:{label:"ウェルニッケ野",tag:"tb",rows:[
{t:"[側頭連合野] にある [感覚性言語中枢]．",b:["側頭連合野","感覚性言語中枢"]},
{t:"ブロードマンの [22野] に相当する．",b:["22野"]},
{t:"障害が起こると，音は [聞こえる] が [意味を理解できなく] なる．",b:["聞こえる","意味を理解できなく"]},
{t:"このような症状を [感覚性失語症] という．",b:["感覚性失語症"]},
]}},
{t:"パートCまとめ",ch:"第3章 神経の生理 ｜ パートCまとめ",type:"tbl",
cols:["項目","内容"],
rows:[
["神経系の区分","[中枢]神経系（脳・脊髄）／[末梢]神経系（体性・自律）"],
["体性／自律","体性＝[動物性]機能（運動・感覚）／自律＝[植物性]機能（呼吸・循環など）"],
["求心性／遠心性","求心性＝受容器から[中枢へ]／遠心性＝中枢から[効果器へ]"],
["脳の構成","小脳・延髄・橋・中脳・[間脳]（視床，視床下部）・[終脳]（大脳基底核，大脳皮質）"],
["脳の数値","重さ約[1,400g]／皮質の表面積約2,500cm²／ニューロン約[1,000億個]／シナプス約100兆個"],
["血液脳関門","血液中の物質がニューロンへ直接影響するのを防ぐ．[グリア細胞] のはたらきによる"],
["機能局在","大脳皮質は[52]の部位に分類（[ブロードマン]の脳地図）．最も明確なのは運動野と感覚野"],
["体部位再現","一次運動野＝ブロードマンの[4野]．電気刺激で対応する部位の運動が再現"],
["連合野","[前頭]連合野／[頭頂]連合野／[側頭]連合野の3つ"],
["前頭連合野","知的機能・人格の統合．損傷＝[人格変容]・失行症"],
["頭頂連合野","知覚と[空間の認知]．損傷＝失認症．右半球損傷で[左半側空間無視]"],
["側頭連合野","聴覚性の言語中枢と視覚の高次中枢．損傷＝[感覚性失語症]"],
["ブローカ野","[前頭]連合野・運動性言語中枢．障害＝[運動性失語症]（理解はできるが話せない）"],
["ウェルニッケ野","[側頭]連合野・感覚性言語中枢（[22野]）．障害＝聞こえるが意味がわからない"],
["言語野の左右差","約[95%]の人で[左半球]にある"],
]},
];
let cur=0,bs=[];
function bl(id,ans){return `<span class="blank" id="${id}" onclick="rb('${id}')"><span>${ans}</span></span>`;}
function buildSlide(i){
  const s=S[i];bs=[];
  let h=`<div class="hd"><div class="ch">${s.ch}</div><div class="tt">${s.t}</div></div><div class="bd">`;
  if(s.type==="p"){
    h+=`<div class="sec">重要事項</div><div class="box">`;
    s.rows.forEach(r=>{
      let t=r.t;
      r.b.forEach(a=>{const id="b"+bs.length;bs.push({id,on:false});t=t.replace("["+a+"]",bl(id,a));});
      h+=`<span class="row">${t}</span>`;
    });
    h+=`</div>`;
  }else if(s.type==="tbl"){
    h+=`<div class="sec">重要事項</div><div class="box" style="padding:0;overflow:hidden"><table class="tbl${s.small?" sm":""}"><thead><tr>`;
    s.cols.forEach(c=>h+=`<th>${c}</th>`);
    h+=`</tr></thead><tbody>`;
    s.rows.forEach(row=>{
      h+=`<tr>`;
      row.forEach(cell=>{
        const t=cell.replace(/\[([^\[\]]+)\]/g,(m,a)=>{
          const id="b"+bs.length;bs.push({id,on:false});return bl(id,a);
        });
        h+=`<td>${t}</td>`;
      });
      h+=`</tr>`;
    });
    h+=`</tbody></table></div>`;
  }else if(s.type==="two"){
    h+=`<div class="two">`;
    ["left","right"].forEach(side=>{
      const d=s[side];
      const tc=side==="left"?"tf":"tb";
      h+=`<div class="box"><span class="tag ${tc}">${d.label}</span>`;
      d.rows.forEach(r=>{
        let t=r.t;
        r.b.forEach(a=>{const id="b"+bs.length;bs.push({id,on:false});t=t.replace("["+a+"]",bl(id,a));});
        h+=`<p style="font-size:13px;line-height:1.8;border-bottom:1px solid #e5e7eb;padding:4px 0">${t}</p>`;
      });
      h+=`</div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;
  document.getElementById("sc").innerHTML=h;
  upd();bldNav();
}
function rb(id){const b=bs.find(x=>x.id===id);if(b&&!b.on){b.on=true;document.getElementById(id).classList.add("on");}upd();}
function nxt(){const u=bs.find(x=>!x.on);if(u)rb(u.id);}
function all(){bs.forEach(b=>rb(b.id));}
function rst(){bs.forEach(b=>{b.on=false;const el=document.getElementById(b.id);if(el)el.classList.remove("on");});upd();}
function upd(){const d=bs.filter(x=>x.on).length;document.getElementById("cnt").textContent=d+"/"+bs.length+" 表示済み";}
function go(i){if(i>=0&&i<S.length){cur=i;buildSlide(cur);}}
function bldNav(){
  let h="";
  S.forEach((_,i)=>h+=`<div class="dot${i===cur?" a":""}" onclick="go(${i})"></div>`);
  h+=`<span class="pg">${cur+1} / ${S.length}</span>`;
  document.getElementById("nav").innerHTML=h;
}
buildSlide(0);
</script>
</body>
</html>
