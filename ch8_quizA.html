<h1>生理学 第8章 血液｜パートA 確認テスト</h1>
<div class="slide">
  <div class="hd"><div><div class="ch">第8章 血液 ｜ A 血液の成分と組成（教科書 P115〜120）</div><div class="tt" id="htt">確認テスト</div></div><div class="pg" id="pg"></div></div>
  <div class="bar"><i id="bar"></i></div>

<script>
/* ===== 問題プール（教科書 第8章 P115〜P120上段 ベース）=====
   対応スライド：ch8_partA1.html（血漿）＋ ch8_partA2.html（血球）
   choices: [表示文, 正解フラグ, その選択肢が何かの説明]
   kihon :true … 🎯基本。通常モードで「ここは重要」と示す印。プールの4〜6割が目安
   dobon :true … 💣ドボン。ドボンモードで外すと即終了になる問題。プールの15〜20%
   gori  :true … 「誤っているのはどれか」形式。true が付くのは「誤っている記述」＝選ぶべき選択肢
   hosoku:true … 教科書に記述のない補足知識（国試過去問の頻出テーマ）
   exp … 正解時に見せる「なぜ正しいか」

   内訳：全56問／🎯基本30問（54%）／💣ドボン10問（18%）／⚠誤りを選ぶ3問／📘補足7問

   ★例外：Q「生理食塩水の塩化ナトリウム濃度」は📘補足だが💣ドボンを付けている。
     資料外だが常識レベルの知識という判断（引き継ぎ資料5節の例外）。🎯は付けていない。

   過去問（2章 血液（生理学）／(1)血液の組成とその働き）での出題頻度：
   貧血4回／エリスロポエチン3回／膠質浸透圧＝アルブミン2回／血清＝血漿－フィブリノゲン2回／
   血液成分と機能の組合せ2回／造血器官2回／赤血球の破壊＝脾臓1回／ヘマトクリット1回／血小板1回
   ※白血球の割合・赤沈・溶血・生理食塩水・チアノーゼ・網赤血球は教科書に記述がないため📘に回している */
const PICK=5;
const POOL=[

/* ---------- A-1 血漿（P115〜117） ---------- */

{q:"細胞の周囲を満たしている体液はどれか。",
 choices:[
  ["組織液",true,""],
  ["血液",false,"血管を流れる体液。"],
  ["リンパ液",false,"リンパ管を流れる体液。"],
  ["血清",false,"血液が凝固したあとに残る液体。"]],
 exp:"ヒトの体液は<b>血液</b>（血管）・<b>リンパ液</b>（リンパ管）・<b>組織液</b>（組織の細胞を取り囲む）に分けられ、いずれも細胞の外にある体液（細胞外液）である。（教科書 P115）"},

{q:"血液は体重の約何％を占めるか。",kihon:true,
 choices:[
  ["約8％",true,""],
  ["約3％",false,"教科書が示す値より少ない。"],
  ["約15％",false,"教科書が示す値より多い。"],
  ["約25％",false,"教科書が示す値より大幅に多い。"]],
 exp:"血液は粘り気がある赤色の液体で、<b>体重の約8％</b>を占める。（教科書 P115）"},

{q:"血液のうち液体成分が占める割合はどれか。",kihon:true,
 choices:[
  ["55％",true,""],
  ["45％",false,"細胞成分が占める割合。"],
  ["75％",false,"図8・1が示す値ではない。"],
  ["90％",false,"血漿そのものに含まれる水の割合。"]],
 exp:"血液は<b>血漿（液体成分）55％</b>と<b>血球（細胞成分）45％</b>で構成される。（図8・1、教科書 P115）"},

{q:"血漿の約90％を占めるのはどれか。",
 choices:[
  ["水",true,""],
  ["タンパク質",false,"血漿に含まれるが、大部分を占めるものではない。"],
  ["電解質",false,"血漿に含まれるが、大部分を占めるものではない。"],
  ["グルコース",false,"血漿に含まれる栄養素だが、大部分を占めるものではない。"]],
 exp:"血漿の約90％は<b>水</b>で、そこに電解質、グルコースなどの栄養素や代謝老廃物、タンパク質が含まれる。（図8・1、教科書 P115）"},

{q:"血漿中でもっとも多い陽イオンはどれか。",kihon:true,
 choices:[
  ["Na⁺（143 mEq/L）",true,""],
  ["K⁺（4 mEq/L）",false,"血漿中の濃度は低い陽イオン。"],
  ["Ca²⁺（5 mEq/L）",false,"血漿中の濃度は低い陽イオン。"],
  ["Mg²⁺（3 mEq/L）",false,"血漿中の濃度は低い陽イオン。"]],
 exp:"表8・1より、もっとも多い陽イオンは<b>Na⁺</b>（143 mEq/L）である。（教科書 P116）"},

{q:"血漿中でもっとも多い陰イオンはどれか。",
 choices:[
  ["Cl⁻（103 mEq/L）",true,""],
  ["HCO₃⁻（27 mEq/L）",false,"血漿中に含まれる陰イオンだが、最多ではない。"],
  ["HPO₄²⁻（2 mEq/L）",false,"血漿中の濃度は低い陰イオン。"],
  ["SO₄²⁻（1 mEq/L）",false,"血漿中の濃度は低い陰イオン。"]],
 exp:"表8・1より、もっとも多い陰イオンは<b>Cl⁻</b>（103 mEq/L）である。（教科書 P116）"},

{q:"血漿の浸透圧の維持で大きな役割を果たす電解質の組合せはどれか。",kihon:true,
 choices:[
  ["Na⁺ と Cl⁻",true,""],
  ["K⁺ と Ca²⁺",false,"神経や筋で活動電位を起こすために必要な電解質の組合せ。"],
  ["HCO₃⁻ と HPO₄²⁻",false,"HCO₃⁻は体液のpHが大きく変化しないようにするはたらきをもつ。HPO₄²⁻は血漿中の濃度が2 mEq/Lと低い。"],
  ["Mg²⁺ と SO₄²⁻",false,"どちらも血漿中の濃度が1〜3 mEq/Lと低く、浸透圧を左右するほどの量がない。"]],
 exp:"血液に含まれる電解質のうち、<b>Na⁺とCl⁻</b>は浸透圧の維持で大きな役割を果たす。血漿中でもっとも多い陽イオン（143 mEq/L）と陰イオン（103 mEq/L）なので、量がそのまま浸透圧に効いてくる。電解質のはたらきは「<b>浸透圧＝Na⁺・Cl⁻</b>」「活動電位＝K⁺・Ca²⁺」「pH緩衝＝HCO₃⁻」の3つで整理しておく。（教科書 P116）"},

{q:"神経や筋で活動電位を起こすために必要な電解質の組合せはどれか。",kihon:true,
 choices:[
  ["K⁺ と Ca²⁺",true,""],
  ["Na⁺ と Cl⁻",false,"血漿中でもっとも多い陽イオンと陰イオンで、浸透圧の維持で大きな役割を果たす組合せ。"],
  ["HCO₃⁻ と HPO₄²⁻",false,"HCO₃⁻は体液のpHが大きく変化しないようにするはたらきをもつ。HPO₄²⁻は血漿中の濃度が2 mEq/Lと低い。"],
  ["Mg²⁺ と SO₄²⁻",false,"どちらも血漿中の濃度が1〜3 mEq/Lと低く、表8・1で個別のはたらきが示されていない電解質。"]],
 exp:"<b>K⁺とCa²⁺</b>は、神経や筋で活動電位を起こすために必要である。電解質のはたらきは「浸透圧＝Na⁺・Cl⁻」「<b>活動電位＝K⁺・Ca²⁺</b>」「pH緩衝＝HCO₃⁻」の3つで整理しておく。（教科書 P116）"},

{q:"体液のpHが大きく変化しないようにする作用をもつ電解質はどれか。",kihon:true,
 choices:[
  ["HCO₃⁻（重炭酸イオン）",true,""],
  ["Na⁺",false,"血漿中でもっとも多い陽イオンで、Cl⁻とともに浸透圧の維持で大きな役割を果たす。"],
  ["Ca²⁺",false,"K⁺とともに、神経や筋で活動電位を起こすために必要な電解質。"],
  ["HPO₄²⁻",false,"血漿中の濃度が2 mEq/Lと低く、表8・1で個別のはたらきが示されていない陰イオン。"]],
 exp:"重炭酸イオンのこのはたらきを<b>pH緩衝作用</b>という。血漿タンパク質も酸塩基平衡の調節分子として同じはたらきをもつ。電解質のはたらきは「浸透圧＝Na⁺・Cl⁻」「活動電位＝K⁺・Ca²⁺」「<b>pH緩衝＝HCO₃⁻</b>」の3つで整理しておく。（教科書 P116）"},

{q:"血漿タンパク質の作用はどれか。",kihon:true,
 choices:[
  ["浸透圧維持・pH緩衝作用・物質運搬",true,""],
  ["酸素運搬・二酸化炭素運搬・pH維持",false,"ヘモグロビンの3つのはたらき。"],
  ["止血・凝固・線溶",false,"止血のしくみに関する語の並び。"],
  ["造血・成熟・分化",false,"血球がつくられる過程に関する語の並び。"]],
 exp:"血漿タンパク質は<b>浸透圧維持・pH緩衝作用・物質運搬</b>などのはたらきを担う。そのほか血液の粘性を維持し、血液凝固作用や免疫作用でも重要な役割を果たす。（教科書 P116）"},

{q:"もっとも多い血漿タンパク質はどれか。",kihon:true,dobon:true,
 choices:[
  ["アルブミン",true,""],
  ["グロブリン",false,"電気的な性質の差によって4種類に分けられる血漿タンパク質。"],
  ["フィブリノゲン",false,"血液の凝固で中心的な役割を果たす血漿タンパク質。"],
  ["ヘモグロビン",false,"赤血球の内部にある色素タンパク質で、血漿タンパク質ではない。"]],
 exp:"<b>アルブミン</b>は血漿タンパク質の60％を占める。浸透圧を維持して血漿の量を一定に保つはたらきへの寄与も最大である。（教科書 P117）"},

{q:"アルブミンが血漿タンパク質に占める割合はどれか。",
 choices:[
  ["約60％",true,""],
  ["約30％",false,"教科書が示す値より少ない。"],
  ["約45％",false,"教科書が示す値より少ない。"],
  ["約90％",false,"教科書が示す値より多い。"]],
 exp:"アルブミンは血漿タンパク質の<b>60％</b>を占める。（教科書 P117）"},

{q:"抗体として免疫機能を担う血漿タンパク質はどれか。",kihon:true,
 choices:[
  ["γグロブリン",true,""],
  ["アルブミン",false,"もっとも多い血漿タンパク質。"],
  ["フィブリノゲン",false,"フィブリンに変化して血餅をつくる血漿タンパク質。"],
  ["ヘモグロビン",false,"赤血球の内部にある色素タンパク質。"]],
 exp:"グロブリンはα₁、α₂、β、γの4種類に分けられ、α₁・α₂・βはホルモンやビタミンと結合して全身へ運び、<b>γ</b>は抗体として免疫機能を担う。（教科書 P117）"},

{q:"血漿からある成分を除いたものが血清である。除かれるのはどれか。",kihon:true,dobon:true,
 choices:[
  ["フィブリノゲン",true,""],
  ["赤血球",false,"血液の細胞成分であり、液体成分である血漿にはもともと含まれない。"],
  ["アルブミン",false,"もっとも多い血漿タンパク質で、血清にも残る。"],
  ["グルコース",false,"血漿に含まれる栄養素で、血清にも残る。"]],
 exp:"血漿から<b>フィブリノゲン</b>を除去したものは凝固せず、<b>血清</b>と呼ばれる。（教科書 P117）"},

{q:"スターリングの仮説で、毛細血管の動脈側で起こるのはどれか。",kihon:true,
 choices:[
  ["毛細血管から間質へ水分が押し出される",true,""],
  ["タンパク質が毛細血管から間質へ自由に移動する",false,"タンパク質は内皮細胞の隙間を透過しにくい。"],
  ["赤血球が間質へ出ていく",false,"血球が毛細血管壁を通り抜けるわけではない。"],
  ["水分の移動がまったく起こらない",false,"内圧の差によって水分は移動している。"]],
 exp:"動脈側は内圧が高いため毛細血管から間質へ水分が<b>押し出される</b>。静脈側は内圧が次第に低下するため、間質側から毛細血管へ水分が<b>引き込まれる</b>。（教科書 P116）"},

{q:"血漿タンパク質が結合して運搬するのはどれか。",
 choices:[
  ["カルシウム",true,""],
  ["酸素",false,"赤血球内のヘモグロビンが結合して運ぶ。"],
  ["ブドウ糖",false,"血漿に溶けて運ばれる栄養素。"],
  ["尿素",false,"血漿に含まれる代謝老廃物。"]],
 exp:"血漿タンパク質は<b>薬物、カルシウム、ホルモン</b>などの一部と結合してこれらを運搬する。（教科書 P116）"},

{q:"血液が末梢組織から回収するものはどれか。",
 choices:[
  ["代謝老廃物と二酸化炭素",true,""],
  ["酸素とホルモン",false,"末梢組織へ運ばれるもの。"],
  ["熱と栄養分",false,"末梢組織へ運ばれるもの。"],
  ["鉄と葉酸",false,"赤血球の産生に必要な材料。"]],
 exp:"血液は心臓のポンプ作用で循環し、酸素・栄養分・熱・ホルモンなどを末梢組織へ運び、<b>代謝老廃物と二酸化炭素</b>を回収する。（教科書 P115）"},

/* ---------- A-2 赤血球（P117〜119） ---------- */

{q:"赤血球の直径はどれか。",kihon:true,
 choices:[
  ["7〜8μm",true,""],
  ["2〜3μm",false,"血液の成分のうち、これより小さいものの直径。"],
  ["5〜20μm",false,"赤血球より幅のある直径。"],
  ["15〜20μm",false,"図8・1が赤血球に示している値ではない。"]],
 exp:"赤血球は両凹型をした直径約<b>7〜8μm</b>の円盤状の細胞。柔軟に変形するため直径5μm程度の毛細血管でも通過できる。（教科書 P117、図8・1）"},

{q:"血液1μL中の赤血球の数はどれか。",kihon:true,

 exp:"補足知識（資料外）。赤沈は赤血球と血漿の比重の差で起こる現象で、赤血球の凝集・血漿の粘性・赤血球数に左右される。<b>赤血球が増えると遅くなる</b>。正常1時間値は成人男性で10mm以下、女性で15mm以下。"},

 choices:[
  ["蒸留水",true,""],
  ["0.9％食塩水",false,"血漿と浸透圧が等しい液。"],
  ["ナトリウムイオン",false,"血液に加えても溶血は起こらない。"],
  ["カルシウムイオン",false,"血液に加えても溶血は起こらない。"]],
 exp:"補足知識（資料外）。<b>蒸留水</b>は血漿より浸透圧が低いため、水が赤血球内へ入って赤血球が膨張し、細胞膜が破れて溶血が起こる。"},

 choices:[

 choices:[

 exp:"補足知識（資料外）。<b>好中球</b>が白血球の60〜70％を占める。資料には割合の記載がないが、国試では繰り返し問われる。"},

 choices:[
  ["約10日",true,""],
  ["約60日",false,"血小板の寿命としては長すぎる。"],
  ["約120日",false,"血液の別の成分の寿命にあたる長さで、血小板はこれより大幅に短い。"],

 exp:"補足知識（資料外）。血小板の寿命は<b>約8〜11日</b>。減少すると出血時間が延長する。"},

 choices:[
  ["血中還元ヘモグロビン量の増加",true,""],
  ["血中酸素分圧の上昇",false,"血液の酸素化が進んだ状態。"],
  ["酸化ヘモグロビンの増加",false,"酸素と結合したヘモグロビンが増えた状態。"],

 choices:[
  ["骨髄から放出されたばかりの未成熟な赤血球",true,""],

];

let mode="normal", drawn=[], idx=0, score=0, streak=0, answered=false, dead=false;
let qmiss=0, totalMiss=0, firstTryCount=0; // ミス回数の集計（通常モード）
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function home(){
  document.getElementById("htt").textContent="確認テスト";
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="0";
  document.getElementById("bd").innerHTML=`
    <div class="center">
      <p class="lead">モードを選んでスタート。<br>問題は毎回シャッフルされ、プール${POOL.length}問から${PICK}問が出題されます。</p>
      <div class="modes">
        <button class="mode" onclick="start('normal')">
          <div class="nm">通常モード</div>
          <div class="ds">${PICK}問を最後まで解いて採点します。ふだんの確認用。<span class="mark kihon" style="margin-left:4px">🎯基本</span> は落としちゃダメな基本問題、<span class="mark gori">⚠ 誤りを選ぶ</span> は誤っているものを選ぶ問題、<span class="mark hosoku">📘 補足（資料外）</span> は教科書外の国試頻出テーマ。</div>
        </button>
        <button class="mode dob" onclick="start('dobon')">
          <div class="nm">💣 ドボンチャレンジ</div>
          <div class="ds">プールの中のごく一部、<b>絶対に落とせない最重要問題</b>だけが <b>💣ドボン！</b> に変身。それを外したらそこで終了。どこまで正解を続けられるか挑戦！</div>
        </button>
      </div>
    </div>`;
  document.getElementById("ctrl").innerHTML="";
}
function start(m){
  mode=m; drawn=shuffle(POOL).slice(0,Math.min(PICK,POOL.length));
  idx=0;score=0;streak=0;dead=false;totalMiss=0;firstTryCount=0;render();
}
function render(){
  answered=false; qmiss=0;
  const item=drawn[idx];
  const opts=shuffle(item.choices);
  const isDob=(mode==="dobon" && item.dobon);
  document.getElementById("htt").textContent=(mode==="dobon")?"ドボンチャレンジ":"確認テスト";
  document.getElementById("pg").textContent=`問 ${idx+1} / ${drawn.length}`;
  document.getElementById("bar").style.width=(idx/drawn.length*100)+"%";
  const L=["ア","イ","ウ","エ","オ"];
  // ドボン対象の問題だけ💣に変わる。それ以外の🎯基本は通常どおり🎯のまま表示する
  let markHtml = isDob ? `<span class="mark dobon">💣 ドボン！</span>`
                       : (item.kihon ? `<span class="mark kihon">🎯 基本</span>` : "");
  if(item.gori)   markHtml += `<span class="mark gori">⚠ 誤りを選ぶ</span>`;
  if(item.hosoku) markHtml += `<span class="mark hosoku">📘 補足（資料外）</span>`;
  // 誤り選択問題は、設問中の「誤っている」を色付きにして読み飛ばしを防ぐ
  const qText = item.gori ? item.q.replace("誤っている",'<span class="ng">誤っている</span>') : item.q;
  let h=`<div class="qnum">Q${idx+1} ${markHtml}</div><div class="q">${qText}</div><div class="opts">`;
  opts.forEach((o,i)=>{h+=`<button class="opt" onclick="pick(this,${o[1]})"><span class="mk">${L[i]}</span><span>${o[0]}</span></button>`;});
  h+=`</div><div class="exp" id="exp"><div class="vd" id="vd"></div><div class="tx" id="tx"></div></div>`;
  document.getElementById("bd").innerHTML=h;
  document.getElementById("ctrl").innerHTML=`<button class="btn" id="nx" onclick="next()" disabled>解答を選んでください</button>`;
}
function pick(el,ok){
  if(answered)return;
  if(el.classList.contains("dis"))return; // 無効化済みの選択肢は再カウントしない
  const item=drawn[idx];
  const isDob=(mode==="dobon" && item.dobon);
  const selText=el.querySelector("span:last-child").textContent;
  const selChoice=item.choices.find(c=>c[0]===selText);
  const exp=document.getElementById("exp");
  const nx=document.getElementById("nx");

  if(ok){
    // 正解：ここで確定。正解した選択肢だけ緑にする（不正解の選択肢は先に色を変えない）
    answered=true;
    el.classList.add("correct");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    score++;
    if(mode!=="dobon"){ if(qmiss===0) firstTryCount++; }
    if(mode==="dobon") streak++;
    exp.className="exp show ok";
    document.getElementById("vd").textContent=(qmiss===0)?"正解！":"正解！（"+qmiss+"回目で正解）";
    document.getElementById("tx").innerHTML=item.exp;
    nx.disabled=false;
    nx.textContent=(idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶";
    return;
  }

  // 不正解
  if(mode==="dobon"){
    // ドボンモードは一発勝負：選び直しなし・正解は伏せる
    answered=true;
    el.classList.add("wrong");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    if(item.dobon){ dead=true; } // 💣ドボン対象を外したときだけ終了
    exp.className="exp show ng";
    document.getElementById("vd").textContent=isDob?"💣 ドボン！":"不正解";
    document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}`;
    nx.disabled=false;
    nx.textContent=dead?"結果を見る（ドボン）▶":((idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶");
    return;
  }

  // 通常モード：ミスを数え、選んだ選択肢だけ赤にして無効化。正解は伏せたまま選び直せる
  qmiss++; totalMiss++;
  el.classList.add("wrong","dis");
  exp.className="exp show ng";
  document.getElementById("vd").textContent="不正解（ミス "+qmiss+"回）";
  document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}<br>ほかの選択肢からもう一度選んでください。`;
  // 「次へ」はまだ出さない（正解するまで進めない）
}
function next(){
  if(dead){result();return;}
  if(idx+1<drawn.length){idx++;render();}
  else result();
}
function result(){
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="100%";
  if(mode==="dobon"){
    document.getElementById("htt").textContent="結果";
    if(dead){
      document.getElementById("bd").innerHTML=`<div class="center score dead">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>ドボンを踏んでしまいました</div>
        <div class="big">${streak} 問連続正解</div>
        <div class="msg">${idx}問正解のあと、${idx+1}問目でドボン。<br>上の解説を復習して再挑戦しましょう。</div>
      </div>`;
    }else{
      document.getElementById("bd").innerHTML=`<div class="center score">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>クリア！</div>
        <div class="big">${score} / ${drawn.length}</div>
        <div class="msg">ドボンを踏まず完走しました。お見事！</div>
      </div>`;
    }
  }else{
    document.getElementById("htt").textContent="結果";
    const n=drawn.length;
    const ftPct=Math.round(firstTryCount/n*100);
    const noMiss=(totalMiss===0);
    let head = noMiss
      ? `<div class="big">✨ ノーミス パーフェクト！</div><div>全 ${n} 問を一発で正解</div>`
      : `<div>今回の成績</div><div class="big">${firstTryCount} / ${n}</div><div>一発正解率 ${ftPct}%</div>`;
    let stat = `<div class="stats">一発正解 ${firstTryCount}問　｜　総ミス ${totalMiss}回</div>`;
    let msg = noMiss?"完璧です。この調子！":ftPct>=60?"よくできました。ミスした問題を復習しましょう。":"もう一度スライドで確認してから挑戦しましょう。";
    document.getElementById("bd").innerHTML=`<div class="center score">${head}${stat}<div class="msg">${msg}</div></div>`;
  }
  document.getElementById("ctrl").innerHTML=`<button class="btn sub" onclick="home()">モード選択へ</button><button class="btn" onclick="start(mode)">もう一度（シャッフル）▶</button>`;
}
home();
</script>
</body>
</html>
