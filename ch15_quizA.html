<script>
/* ===== 問題プール（教科書 第15章 P215〜216 ベース）=====
   choices: [表示文, 正解フラグ, その選択肢が何かの説明]
   kihon :true … 🎯基本　dobon:true … 💣ドボン（ドボンモードで外すと終了）
   gori  :true … ⚠誤りを選ぶ　hosoku:true … 📘補足（資料外）
   過去問（7章 体温）での出題回数：日内リズム9／食後の上昇8／核心温度の指標7／
   月経周期6／ふるえ6／直腸温＞口腔温＞腋窩温5／褐色脂肪組織3／年齢差3 */
const PICK=5;
const POOL=[

/* ---------- A-1 体温・体内の温度分布（P215〜216） ---------- */

{q:"安静時と身体活動時に、体内で温度が高くなる部位の組合せで正しいのはどれか。",kihon:true,
 choices:[
  ["安静時：肝臓・腎臓 ／ 身体活動時：骨格筋",true,""],
  ["安静時：皮膚 ／ 身体活動時：骨格筋",false,"皮膚は体表にあり、外気温の影響で温度が低くなる部位。"],
  ["安静時：肝臓・腎臓 ／ 身体活動時：皮膚",false,"皮膚は体表にあり、外気温の影響で温度が低くなる部位。"],
  ["安静時：皮下の脂肪組織 ／ 身体活動時：肝臓・腎臓",false,"皮下の脂肪組織は代謝が低く体表に近いため、温度は高くならない。"]],
 exp:"体内の温度は代謝が活発な部位で高くなる。<b>安静時</b>は<b>肝臓・腎臓・消化管</b>、<b>身体活動時</b>は<b>骨格筋</b>で温度が高くなる。（教科書 P215）"},

{q:"気温が大きく変化しても体内の温度が保たれるしくみで正しいのはどれか。",kihon:true,
 choices:[
  ["熱産生と熱放散のバランスを調節し、約37℃に保つ",true,""],
  ["熱産生だけを増減させて、約37℃に保つ",false,"熱産生だけでなく、熱放散も調節に使われる。"],
  ["熱産生と熱放散のバランスを調節し、約35℃に保つ",false,"35℃は低体温の目安となる値。"],
  ["外気温に合わせて、体内の温度も変化させる",false,"皮膚表面など、外殻温度の性質。"]],
 exp:"体内の温度は<b>熱産生と熱放散のバランス</b>を調節することで、<b>約37℃</b>と非常に狭い範囲に維持される（<b>体温のホメオスタシス</b>）。（教科書 P215）"},

{q:"外殻温度と核心温度について正しいのはどれか。",kihon:true,
 choices:[
  ["核心温度は、外気温が変わっても狭い範囲に調節される",true,""],
  ["外殻温度は、外気温が変わっても一定に保たれる",false,"外殻温度は外気温の変化に伴って変化する。"],
  ["核心温度は、皮膚表面や浅層の部位の温度である",false,"皮膚表面や浅層の温度は外殻温度。"],
  ["体温は、体表に近いほど高い",false,"体温は深部で高く、体表に近いほど低い。"]],
 exp:"<b>外殻温度</b>＝皮膚表面や浅層の温度で、外気温に伴って変化する。<b>核心温度（深部温）</b>＝頭蓋腔・胸腔・腹腔の臓器の温度で、外気温が変わっても狭い範囲に調節される。（教科書 P216、図15・1）"},

{q:"核心温度の指標のうち、心臓近くの温度を反映するのはどれか。",kihon:true,
 choices:[
  ["食道温",true,""],
  ["直腸温",false,"肛門から体温計を入れて測る直腸内の温度。"],
  ["腋窩温",false,"わきの下にはさんで測る温度。"],
  ["口腔温",false,"舌の下にはさんで測る温度。"]],
 exp:"食道は心臓のすぐ後ろを通るため、<b>食道温</b>は心臓近くの温度を反映する。（教科書 P216）"},

{q:"核心温度の指標のうち、脳の温度を反映するのはどれか。",hosoku:true,
 choices:[
  ["鼓膜温",true,""],
  ["直腸温",false,"肛門から体温計を入れて測る直腸内の温度。"],
  ["腋窩温",false,"わきの下にはさんで測る温度。"],
  ["口腔温",false,"舌の下にはさんで測る温度。"]],
 exp:"補足知識（資料外）。鼓膜は視床下部と同じ動脈系から血液を受けるため、<b>鼓膜温</b>は脳の温度に近い。"},

{q:"日常の体温測定で、簡便なため広く用いられる部位はどれか。",hosoku:true,
 choices:[
  ["腋窩",true,""],
  ["食道",false,"センサーを食道内に入れる必要があり、手術中などに用いる。"],
  ["直腸",false,"肛門から体温計を入れる必要があり、乳幼児や重症患者などに用いる。"],
  ["内臓",false,"体外から直接は測れない。"]],
 exp:"補足知識（資料外）。深部温として信頼性が高いのは直腸温だが、日常では便宜的に<b>腋窩温</b>や口腔温が用いられる。"},

{q:"外気温の影響をもっとも受けにくいのはどれか。",kihon:true,dobon:true,
 choices:[
  ["直腸温",true,""],
  ["腋窩温",false,"わきの下で測る温度。わきの閉じ方や外気温で値が変わりやすい。"],
  ["口腔温",false,"舌の下で測る温度。飲食や呼吸、外気温で値が変わりやすい。"],
  ["手掌の皮膚温",false,"外殻温度で、外気温に伴って大きく変化する。"]],
 exp:"食道温・内臓温・<b>直腸温</b>は外気温の影響を受けにくい。（教科書 P216）"},

{q:"核心温度の指標として用いられないのはどれか。",
 choices:[
  ["前腕の皮膚温",true,""],
  ["鼓膜温",false,"核心温度の指標のひとつ（外耳道温ともいう）。"],
  ["内臓温",false,"核心温度の指標のひとつ。"],
  ["口腔温",false,"核心温度の指標のひとつ。"]],
 exp:"核心温度の指標は、食道温・内臓温・直腸温・鼓膜温（外耳道温）・腋窩温・口腔温。<b>皮膚温</b>は外殻温度にあたる。（教科書 P216）"},

{q:"直腸温・口腔温・腋窩温を、温度の高い順に並べたのはどれか。",hosoku:true,dobon:true,
 choices:[
  ["直腸温 ＞ 口腔温 ＞ 腋窩温",true,""],
  ["腋窩温 ＞ 口腔温 ＞ 直腸温",false,"体表に近い部位ほど温度が高い並びになっている。"],
  ["口腔温 ＞ 直腸温 ＞ 腋窩温",false,"口腔は外気や呼吸の影響を受ける部位。"],
  ["口腔温 ＞ 腋窩温 ＞ 直腸温",false,"直腸はもっとも深部にある測定部位。"]],
 exp:"補足知識（資料外）。身体の深部ほど温度が高く、<b>直腸温 ＞ 口腔温 ＞ 腋窩温</b>の順になる。差は1℃以内。"},

/* ---------- A-2 体温の生理的変動（P216） ---------- */

{q:"安静時の体温の日内リズムで正しいのはどれか。",kihon:true,dobon:true,
 choices:[
  ["明け方にもっとも低く、夕方にもっとも高い",true,""],
  ["明け方にもっとも高く、夕方にもっとも低い",false,"最高と最低の時間帯が合わない。"],
  ["正午にもっとも高く、深夜にもっとも低い",false,"最高と最低の時間帯が合わない。"],
  ["入眠直後にもっとも低く、正午にもっとも高い",false,"最高と最低の時間帯が合わない。"]],
 exp:"安静にしていると、体温は<b>明け方</b>にもっとも低く、<b>夕方</b>にもっとも高くなる（<b>日内リズム</b>）。（教科書 P216）"},

{q:"安静状態での体温の1日の変動幅はどれか。",
 choices:[
  ["0.7〜1.2℃",true,""],
  ["0.1〜0.2℃",false,"安静時の1日の変動幅と合わない値。"],
  ["2〜3℃",false,"安静時の1日の変動幅と合わない値。"],
  ["4〜5℃",false,"安静時の1日の変動幅と合わない値。"]],
 exp:"1日の変動幅は、安静状態で<b>0.7〜1.2℃</b>。（教科書 P216）"},

{q:"体温の日内リズムについて誤っているのはどれか。",gori:true,
 choices:[
  ["ヒトが本来もっている周期は、24時間よりも短い",true,""],
  ["光の明暗によって24時間周期に同調する",false,"教科書どおりの記述なので、正しい。"],
  ["睡眠と覚醒によって24時間周期に同調する",false,"教科書どおりの記述なので、正しい。"],
  ["食事や身体活動によって24時間周期に同調する",false,"教科書どおりの記述なので、正しい。"]],
 exp:"ヒトが本来もっている体温の日内リズムの周期は24時間よりも<b>長い</b>。光の明暗・睡眠と覚醒・食事や身体活動などで24時間周期に同調する。（教科書 P216）"},

{q:"女性の体温が月経周期で上昇するのはいつか。",kihon:true,dobon:true,
 choices:[
  ["排卵直後に0.3℃以上上昇する",true,""],
  ["月経開始直後に0.3℃以上上昇する",false,"月経開始後の卵胞期は低温相が続く。"],
  ["卵胞期の中ごろに1℃以上上昇する",false,"卵胞期は低温相が続く時期。"],
  ["排卵直前に1℃以上上昇する",false,"時期も上昇幅も合わない。"]],
 exp:"卵胞期は低温相が続き、<b>排卵直後に0.3℃以上</b>上昇して、黄体期は高温相となる。（教科書 P216、図7・9）"},

{q:"基礎体温の高温相をつくるホルモンはどれか。",kihon:true,
 choices:[
  ["黄体ホルモン（プロゲステロン）",true,""],
  ["卵胞ホルモン（エストロゲン）",false,"卵胞から分泌され、子宮内膜を増殖させるホルモン。"],
  ["黄体形成ホルモン（LH）",false,"下垂体前葉から分泌され、排卵を起こすホルモン。"],
  ["オキシトシン",false,"下垂体後葉から分泌され、子宮収縮や射乳を起こすホルモン。"]],
 exp:"黄体期の体温上昇は、<b>黄体ホルモンのプロゲステロン</b>の作用による。（教科書 P216、第7章）"},

{q:"加齢に伴って体温が低下する要因について誤っているのはどれか。",gori:true,
 choices:[
  ["褐色脂肪組織が増加する",true,""],
  ["エネルギー代謝が低下する",false,"教科書どおりの記述なので、正しい。"],
  ["筋量が減少し、ふるえによる熱産生量が減る",false,"教科書どおりの記述なので、正しい。"],
  ["寒冷環境での皮膚血管の収縮反応性が低下する",false,"教科書どおりの記述なので、正しい。"]],
 exp:"非ふるえ熱産生に関わる褐色脂肪組織は、加齢とともに<b>減少</b>する。（教科書 P216）"},

{q:"年齢による体温の違いで正しいのはどれか。",hosoku:true,
 choices:[
  ["小児は成人より高く、高齢者は成人より低い",true,""],
  ["小児は成人より低く、高齢者は成人より高い",false,"年齢と体温の関係が合わない。"],
  ["小児も高齢者も、成人より高い",false,"年齢と体温の関係が合わない。"],
  ["年齢による違いはみられない",false,"体温には年齢による違いがある。"]],
 exp:"補足知識（資料外）。<b>小児</b>は代謝が盛んで成人より0.5℃ほど<b>高い</b>。<b>高齢者</b>で<b>低い</b>のは、教科書P216の「加齢に伴う変化」のとおり。"},

/* ---------- B-1 ふるえ（P216） ---------- */

{q:"寒冷環境で、短時間のうちに大量の熱を産生できるのはどれか。",kihon:true,
 choices:[
  ["骨格筋のふるえ",true,""],
  ["褐色脂肪組織での熱産生",false,"非ふるえ熱産生。新生児で発達している。"],
  ["皮膚血管の収縮",false,"皮膚への血流を減らして熱放散を抑える反応で、熱を産生するしくみではない。"],
  ["立毛筋の収縮",false,"毛を立てる皮膚の平滑筋の収縮。ヒトでは熱産生への寄与はほとんどない。"]],
 exp:"寒冷環境では、<b>骨格筋のふるえ</b>で短時間のうちに熱が大量に産生される。（教科書 P216）"},

{q:"ふるえによる熱産生をもたらす筋はどれか。",
 choices:[
  ["背筋",true,""],
  ["心筋",false,"心臓の壁をつくる筋。"],
  ["血管平滑筋",false,"血管の壁にある平滑筋。皮膚血管の収縮・拡張を担う。"],
  ["消化管平滑筋",false,"消化管の壁にある平滑筋。蠕動運動を担う。"]],
 exp:"ふるえは、頸・四肢・胸筋・<b>背筋</b>などの骨格筋の不随意的な律動的収縮でもたらされる。（教科書 P216）"},

{q:"ふるえについて誤っているのはどれか。",gori:true,
 choices:[
  ["随意運動なので、意識的に止めることができる",true,""],
  ["寒冷環境で起こる",false,"教科書どおりの記述なので、正しい。"],
  ["四肢の筋で起こる",false,"教科書どおりの記述なので、正しい。"],
  ["律動的な収縮である",false,"教科書どおりの記述なので、正しい。"]],

 exp:"補足知識（資料外）。摂取エネルギーに対する割合は、<b>たんぱく質</b>で約30％、糖質で約6％、脂質で約4％。"},

let mode="normal", drawn=[], idx=0, score=0, streak=0, answered=false, dead=false;
let qmiss=0, totalMiss=0, firstTryCount=0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function home(){
  document.getElementById("htt").textContent="確認テスト";
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="0";
  document.getElementById("bd").innerHTML=`
    <div class="center">
      <p class="lead">モードを選んでスタート。<br>問題は毎回シャッフルされ、プール${POOL.length}問から${PICK}問が出題されます。</p>
      <div class="modes">
        <button class="mode" onclick="start('normal')">
          <div class="nm">通常モード</div>
          <div class="ds">${PICK}問を最後まで解いて採点します。ふだんの確認用。<span class="mark kihon" style="margin-left:4px">🎯基本</span> は落としちゃダメな基本問題、<span class="mark gori">⚠ 誤りを選ぶ</span> は誤っているものを選ぶ問題、<span class="mark hosoku">📘 補足（資料外）</span> は教科書外の国試頻出テーマ。</div>
        </button>
        <button class="mode dob" onclick="start('dobon')">
          <div class="nm">💣 ドボンチャレンジ</div>
          <div class="ds">プールの中のごく一部、<b>絶対に落とせない最重要問題</b>だけが <b>💣ドボン！</b> に変身。それを外したらそこで終了。どこまで正解を続けられるか挑戦！</div>
        </button>
      </div>
    </div>`;
  document.getElementById("ctrl").innerHTML="";
}
function start(m){
  mode=m; drawn=shuffle(POOL).slice(0,Math.min(PICK,POOL.length));
  idx=0;score=0;streak=0;dead=false;totalMiss=0;firstTryCount=0;render();
}
function render(){
  answered=false; qmiss=0;
  const item=drawn[idx];
  const opts=shuffle(item.choices);
  const isDob=(mode==="dobon" && item.dobon);
  document.getElementById("htt").textContent=(mode==="dobon")?"ドボンチャレンジ":"確認テスト";
  document.getElementById("pg").textContent=`問 ${idx+1} / ${drawn.length}`;
  document.getElementById("bar").style.width=(idx/drawn.length*100)+"%";
  const L=["ア","イ","ウ","エ","オ"];
  let markHtml = isDob ? `<span class="mark dobon">💣 ドボン！</span>`
                       : (item.kihon ? `<span class="mark kihon">🎯 基本</span>` : "");
  if(item.gori)   markHtml += `<span class="mark gori">⚠ 誤りを選ぶ</span>`;
  if(item.hosoku) markHtml += `<span class="mark hosoku">📘 補足（資料外）</span>`;
  const qText = item.gori ? item.q.replace("誤っている",'<span class="ng">誤っている</span>') : item.q;
  let h=`<div class="qnum">Q${idx+1} ${markHtml}</div><div class="q">${qText}</div><div class="opts">`;
  opts.forEach((o,i)=>{h+=`<button class="opt" onclick="pick(this,${o[1]})"><span class="mk">${L[i]}</span><span>${o[0]}</span></button>`;});
  h+=`</div><div class="exp" id="exp"><div class="vd" id="vd"></div><div class="tx" id="tx"></div></div>`;
  document.getElementById("bd").innerHTML=h;
  document.getElementById("ctrl").innerHTML=`<button class="btn" id="nx" onclick="next()" disabled>解答を選んでください</button>`;
}
function pick(el,ok){
  if(answered)return;
  if(el.classList.contains("dis"))return;
  const item=drawn[idx];
  const isDob=(mode==="dobon" && item.dobon);
  const selText=el.querySelector("span:last-child").textContent;
  const selChoice=item.choices.find(c=>c[0]===selText);
  const exp=document.getElementById("exp");
  const nx=document.getElementById("nx");
  if(ok){
    answered=true;
    el.classList.add("correct");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    score++;
    if(mode!=="dobon"){ if(qmiss===0) firstTryCount++; }
    if(mode==="dobon") streak++;
    exp.className="exp show ok";
    document.getElementById("vd").textContent="正解！";
    document.getElementById("tx").innerHTML=item.exp;
    nx.disabled=false;
    nx.textContent=(idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶";
    return;
  }
  if(mode==="dobon"){
    answered=true;
    el.classList.add("wrong");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    if(item.dobon){ dead=true; }
    exp.className="exp show ng";
    document.getElementById("vd").textContent=isDob?"💣 ドボン！":"不正解";
    document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}`;
    nx.disabled=false;
    nx.textContent=dead?"結果を見る（ドボン）▶":((idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶");
    return;
  }
  qmiss++; totalMiss++;
  el.classList.add("wrong","dis");
  exp.className="exp show ng";
  document.getElementById("vd").textContent="不正解（ミス "+qmiss+"回）";
  document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}<br>ほかの選択肢からもう一度選んでください。`;
}
function next(){
  if(dead){result();return;}
  if(idx+1<drawn.length){idx++;render();}
  else result();
}
function result(){
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="100%";
  document.getElementById("htt").textContent="結果";
  if(mode==="dobon"){
    if(dead){
      document.getElementById("bd").innerHTML=`<div class="center score dead">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>ドボンを踏んでしまいました</div>
        <div class="big">${streak} 問連続正解</div>
        <div class="msg">${idx}問正解のあと、${idx+1}問目でドボン。<br>上の解説を復習して再挑戦しましょう。</div>
      </div>`;
    }else{
      document.getElementById("bd").innerHTML=`<div class="center score">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>クリア！</div>
        <div class="big">${score} / ${drawn.length}</div>
        <div class="msg">ドボンを踏まず完走しました。お見事！</div>
      </div>`;
    }
  }else{
    const n=drawn.length;
    const ftPct=Math.round(firstTryCount/n*100);
    const noMiss=(totalMiss===0);
    let head = noMiss
      ? `<div class="big">✨ ノーミス パーフェクト！</div><div>全 ${n} 問を一発で正解</div>`
      : `<div>今回の成績</div><div class="big">${firstTryCount} / ${n}</div><div>一発正解率 ${ftPct}%</div>`;
    let stat = `<div class="stats">一発正解 ${firstTryCount}問　｜　総ミス ${totalMiss}回</div>`;
    let msg = noMiss?"完璧です。この調子！":ftPct>=60?"よくできました。ミスした問題を復習しましょう。":"もう一度スライドで確認してから挑戦しましょう。";
    document.getElementById("bd").innerHTML=`<div class="center score">${head}${stat}<div class="msg">${msg}</div></div>`;
  }
  document.getElementById("ctrl").innerHTML=`<button class="btn sub" onclick="home()">モード選択へ</button><button class="btn" onclick="start(mode)">もう一度（シャッフル）▶</button>`;
}
home();
</script>
