<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第9章 骨の生理｜パートB</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:#f0f2f5;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 12px}
h1{font-size:14px;color:#555;margin-bottom:16px;font-weight:400;letter-spacing:.05em}
.slide{width:100%;max-width:820px;background:#fff;border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,.10);overflow:hidden}
.hd{background:#4a5560;padding:14px 28px}
.hd .ch{font-size:11px;color:#d5dbe0;font-weight:500;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.hd .tt{font-size:20px;font-weight:500;color:#fff}
.bd{padding:20px 28px 16px;background:#fff}
.sec{font-size:10px;font-weight:600;color:#888;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.box{background:#f8f9fb;border:1px solid #e5e7eb;border-radius:8px;padding:14px 18px;margin-bottom:12px}
.row{display:block;font-size:14px;line-height:1.9;color:#222;padding:5px 0;border-bottom:1px solid #e5e7eb}
.row:last-child{border-bottom:none}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#4a5560;color:#fff;padding:8px 10px;font-weight:500;text-align:left;font-size:12px}
.tbl td{padding:8px 10px;border-bottom:1px solid #e5e7eb;vertical-align:top;color:#222;line-height:1.7}
.tbl tr:last-child td{border-bottom:none}
.tbl td:first-child{font-weight:600;color:#4a5560;white-space:nowrap;min-width:110px}
.tbl.wide td:first-child{white-space:normal;min-width:88px}
.kw{font-weight:700;color:#4a5560}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:4px;margin-bottom:7px}
.tf{background:rgba(74,85,96,.12);color:#4a5560}
.tb{background:rgba(46,53,60,.14);color:#2e353c}
.blank{display:inline-block;min-width:72px;border-bottom:2.5px solid #4a5560;border-radius:3px 3px 0 0;cursor:pointer;text-align:center;padding:0 5px;transition:all .22s;position:relative;vertical-align:baseline}
.blank::after{content:"？";font-size:12px;color:#4a5560;opacity:.45;position:absolute;left:50%;transform:translateX(-50%)}
.blank span{visibility:hidden;font-weight:600;color:#4a5560;font-size:14px;opacity:0;transition:opacity .22s;display:inline-block}
.blank.on{border-bottom-color:transparent;background:rgba(74,85,96,.1);border-radius:4px;padding:1px 7px}
.blank.on::after{display:none}
.blank.on span{visibility:visible;opacity:1}
.blank:not(.on):hover{background:rgba(74,85,96,.07)}
.ctrl{display:flex;align-items:center;gap:8px;padding:10px 28px 12px;background:#f8f9fb;border-top:1px solid #e5e7eb;flex-wrap:wrap}
.btn{padding:7px 15px;border-radius:6px;border:1px solid #d1d5db;background:#fff;color:#333;font-size:12px;cursor:pointer;font-family:inherit;transition:background .15s}
.btn:hover{background:#f0f2f5}
.btnp{background:#4a5560;color:#fff;border-color:#4a5560}
.btnp:hover{background:#38414a}
.cnt{font-size:11px;color:#888;margin-left:auto}
.nav{display:flex;align-items:center;gap:7px;padding:9px 28px 11px;background:#f8f9fb;border-top:1px solid #e5e7eb;border-radius:0 0 12px 12px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:#d1d5db;cursor:pointer;transition:background .18s;flex-shrink:0}
.dot.a{background:#4a5560}
.pg{font-size:11px;color:#888;margin-left:auto}
</style>
</head>
<body>
<h1>生理学 第9章 骨の生理｜パートB：骨形成・骨吸収とカルシウム代謝</h1>
<div class="slide">
  <div id="sc"></div>
  <div class="ctrl">
    <button class="btn" onclick="nextBlank()">次のカッコを開く ▶</button>
    <button class="btn" onclick="showAll()">すべて表示</button>
    <button class="btn" onclick="resetAll()">リセット</button>
    <button class="btn btnp" onclick="go(cur-1)">◀ 前へ</button>
    <button class="btn btnp" onclick="go(cur+1)">次へ ▶</button>
    <span class="cnt" id="cnt"></span>
  </div>
  <div class="nav" id="nav"></div>
</div>
<script>
const S=[
{t:"骨芽細胞と破骨細胞",ch:"B 骨の成長 ｜ 教科書P136",type:"two",
left:{label:"骨芽細胞",rows:[
"[骨膜] に存在し，骨を [形成] するはたらきをもつ．",
"長管骨を [太く] する（横径成長）．",
"骨形成でカルシウムが骨へ [沈着] すると，血中カルシウム濃度は [低下] する．",
]},
right:{label:"破骨細胞",rows:[
"骨膜に存在し，骨を [吸収] するはたらきをもつ．",
"成長時に骨の形を修正する（[モデリング]）．",
"骨吸収でカルシウムが骨から [溶け出る] と，血中カルシウム濃度は [上昇] する．",
"<span style='font-size:11px;color:#888'>※過去問より：破骨細胞が欠如する大理石病では，骨吸収ができず骨密度が異常に高くなる</span>",
]}},
{t:"リモデリングと骨粗鬆症",ch:"B 骨の成長 ｜ 教科書P136",type:"p",
rows:[
"骨芽細胞による [骨形成] と，破骨細胞による [骨吸収] のサイクルを，骨の [リモデリング]（再構築）と呼ぶ．",
"骨量や骨質は，リモデリングが [バランス] よく行われることで維持される．",
"何らかの原因でバランスが崩れて骨量が減少すると [骨粗鬆症] が発症する．",
"骨粗鬆症は，[高齢者] のほか，[長期臥床] の患者や，無重力空間で長時間過ごす [宇宙飛行士] で起こりやすい．",
"スポーツ選手では骨が太くなることから，リモデリングは骨への [力学的ストレス] で促進されると考えられている．",
]},
{t:"カルシウムと血中カルシウム濃度",ch:"B 骨の成長 ｜ 教科書P136〜137",type:"p",
rows:[
"カルシウムは，骨形成のほか，細胞膜での [活動電位] の発生や [血液凝固] などに関わる．",
"血漿カルシウム濃度は [9〜10] mg/dL で，このうち遊離Ca²⁺は約 [5] mg/dL である．",
"[骨吸収] でカルシウムが骨から溶け出ると血中濃度は上昇し，[骨形成] で骨へ沈着すると低下する．",
"骨代謝は，[副甲状腺ホルモン]（パラソルモン）・[カルシトニン]・[ビタミンD] などのはたらきで調節される．",
"<span style='font-size:11px;color:#888'>※過去問より：体内のカルシウムの約99％は骨や歯に存在する</span>",
]},
{t:"骨代謝に関わるホルモン①：カルシウム調節ホルモン",ch:"B 骨の成長 ｜ 教科書P137 表9・1",type:"tbl",
cols:["ホルモン","分泌臓器","骨代謝に関わる作用"],
rows:[
["[パラソルモン]<br>（PTH・副甲状腺ホルモン）","[副甲状腺]","血中カルシウム濃度の [上昇]<br>血中リン濃度の [低下]<br>[骨吸収] の促進<br>腎臓での [ビタミンD] の活性化促進<br>腎臓でのカルシウム [再吸収] の促進"],
["[カルシトニン]","[甲状腺]","破骨細胞による骨吸収を [抑制]<br>カルシウムやリンの骨への [沈着] を促進"],
["[ビタミンD]","食物から摂取，[皮膚] で合成","[活性型ビタミンD] となり，[腸管] でのカルシウム吸収を促進"],
]},
{t:"パラソルモン・カルシトニン・ビタミンDの補足",ch:"B 骨の成長 ｜ 教科書P138",type:"p",
rows:[
"パラソルモンは，腎臓でのカルシウムの再吸収と [リン] の再吸収抑制を行う．[間欠的] に投与すると骨形成を促進する．",
"カルシトニンは，腎臓で尿中へのカルシウムやリンの [排泄] を増加させる．腸管でのカルシウム吸収を [間接的] に促進する．",
"ビタミンDは，[紫外線] を浴びることで皮膚で合成される．特定の標的器官に作用することから [ホルモン] として扱われる．",
"ビタミンDは [肝臓] と [腎臓] で代謝され，活性型ビタミンDとなる．<br><span style='font-size:11px;color:#888'>※教科書は「腎臓と肝臓」と記載しているが，代謝される順は肝臓→腎臓</span>",
"<span style='font-size:11px;color:#888'>※過去問より：この3つを「カルシウム調節ホルモン」という．副腎皮質ホルモンは含まれない</span>",
]},
{t:"骨代謝に関わるホルモン②",ch:"B 骨の成長 ｜ 教科書P137 表9・1",type:"tbl",
cols:["ホルモン","分泌臓器","骨代謝に関わる作用"],
rows:[
["[甲状腺ホルモン]","甲状腺","骨吸収を [促進]"],
["[成長ホルモン]","[脳下垂体前葉]","[IGF-1] を介して成長期の [成長軟骨] に作用し，骨の成長を司る<br><span style='font-size:11px;color:#888'>※教科書表9・1の「IFG-1」は誤植．正しくはIGF-1</span>"],
["[エストロゲン]","[卵巣]","骨吸収の [抑制]<br>骨形成の維持<br>成長軟骨を抑制して [身長増加] を抑制"],
["[副腎皮質ホルモン]","副腎皮質","腸管でのカルシウム吸収の [抑制]<br>[骨芽細胞] の活動の抑制"],
]},
{t:"促進するホルモン・抑制するホルモン",ch:"B 骨の成長 ｜ 教科書P137 図9・5",type:"tbl",
cols:["対象","促進","抑制"],
rows:[
["骨形成（Caの沈着）","[カルシトニン]","[副腎皮質ホルモン]"],
["骨吸収（Caの溶出）","[パラソルモン]・[甲状腺ホルモン]","[カルシトニン]・[エストロゲン]"],
["腸管からのCa吸収","[活性型ビタミンD]","[副腎皮質ホルモン]"],
["腎臓でのCa再吸収","[パラソルモン]","―"],
["成長軟骨（成長期）","[成長ホルモン]","[エストロゲン]・副腎皮質ホルモン（過量で）"],
]},
{t:"骨年齢",ch:"B 骨の成長 ｜ 教科書P138",type:"p",
rows:[
"X線は，[軟骨組織] を透過するが，[骨化] 部分は透過しない．",
"このため [単純X線像] を観ることで骨年齢を評価し，その時点からどのくらい骨が成長するのかを予測できる．",
"骨年齢は，骨変形や骨短縮の矯正治療での適切な [矯正量] の決定や，骨疾患や [成長障害] の診断・治療効果の判定に有用である．",
"[男児] は女児に比較して [1〜2年] ほど成長が遅いため，骨年齢の評価時には注意が必要である．",
]},
{t:"パートBまとめ",ch:"第9章 骨の生理 ｜ パートBまとめ",type:"tbl",
cols:["項目","内容"],
rows:[
["骨芽細胞","骨 [形成] → 血中Ca濃度 [低下]"],
["破骨細胞","骨 [吸収] → 血中Ca濃度 [上昇]"],
["リモデリング","骨形成と骨吸収のサイクル．バランスが崩れると [骨粗鬆症]"],
["血漿Ca濃度","[9〜10] mg/dL（遊離Ca²⁺は約5 mg/dL）"],
["パラソルモン","[副甲状腺] から分泌．血中Ca濃度 [上昇]・骨吸収 [促進]"],
["カルシトニン","[甲状腺] から分泌．骨吸収 [抑制]"],
["ビタミンD","[肝臓] と [腎臓] で活性化 → [腸管] でCa吸収を促進"],
["エストロゲン","骨吸収を [抑制]"],
["骨年齢","[単純X線像] で評価．男児は女児より1〜2年成長が遅い"],
]},
];
let cur=0,bs=[];
function bl(id,ans){return `<span class="blank" id="${id}" onclick="revealBlank('${id}')"><span>${ans}</span></span>`;}
function fill(t){t=t.replace(/\{\{([^{}]+)\}\}/g,'<span class="kw">$1</span>');return t.replace(/\[([^\[\]]+)\]/g,(m,a)=>{const id="b"+bs.length;bs.push({id,on:false});return bl(id,a);});}
function buildSlide(i){
  const s=S[i];bs=[];
  let h=`<div class="hd"><div class="ch">${s.ch}</div><div class="tt">${s.t}</div></div><div class="bd">`;
  if(s.type==="p"){
    h+=`<div class="sec">重要事項</div><div class="box">`;
    s.rows.forEach(r=>{h+=`<span class="row">${fill(r)}</span>`;});
    h+=`</div>`;
  }else if(s.type==="tbl"){
    h+=`<div class="sec">重要事項</div><div class="box" style="padding:0;overflow:hidden"><table class="tbl${s.cols.length>2?' wide':''}"><thead><tr>`;
    s.cols.forEach(c=>h+=`<th>${c}</th>`);
    h+=`</tr></thead><tbody>`;
    s.rows.forEach(row=>{h+=`<tr>`;row.forEach(cell=>{h+=`<td>${fill(cell)}</td>`;});h+=`</tr>`;});
    h+=`</tbody></table></div>`;
  }else if(s.type==="two"){
    h+=`<div class="two">`;
    ["left","right"].forEach(side=>{
      const d=s[side];const tc=side==="left"?"tf":"tb";
      h+=`<div class="box"><span class="tag ${tc}">${d.label}</span>`;
      d.rows.forEach(r=>{h+=`<p style="font-size:13px;line-height:1.8;border-bottom:1px solid #e5e7eb;padding:4px 0">${fill(r)}</p>`;});
      h+=`</div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;
  document.getElementById("sc").innerHTML=h;
  upd();bldNav();
}
function revealBlank(id){const b=bs.find(x=>x.id===id);if(b&&!b.on){b.on=true;document.getElementById(id).classList.add("on");}upd();}
function nextBlank(){const u=bs.find(x=>!x.on);if(u){revealBlank(u.id);const el=document.getElementById(u.id);if(el)el.scrollIntoView({behavior:"smooth",block:"center"});}}
function showAll(){bs.forEach(b=>revealBlank(b.id));}
function resetAll(){bs.forEach(b=>{b.on=false;const el=document.getElementById(b.id);if(el)el.classList.remove("on");});upd();}
function upd(){const d=bs.filter(x=>x.on).length;document.getElementById("cnt").textContent=bs.length?d+"/"+bs.length+" 表示済み":"参照用スライド（カッコなし）";}
function go(i){if(i>=0&&i<S.length){cur=i;buildSlide(cur);}}
function bldNav(){
  let h="";
  S.forEach((_,i)=>h+=`<div class="dot${i===cur?" a":""}" onclick="go(${i})"></div>`);
  h+=`<span class="pg">${cur+1} / ${S.length}</span>`;
  document.getElementById("nav").innerHTML=h;
}
buildSlide(0);
</script>
</body>
</html>
