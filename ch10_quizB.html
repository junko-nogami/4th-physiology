<script>
/* ===== 問題プール（教科書 第10章 P141下〜145 ベース）=====
   対応スライド：ch10_partB.html
   choices: [表示文, 正解フラグ, その選択肢が何かの説明]
   kihon :true … 🎯基本。通常モードで「ここは重要」と示す印。プールの4〜6割が目安
   dobon :true … 💣ドボン。ドボンモードで外すと即終了になる問題。プールの15〜20%
   gori  :true … 「誤っているのはどれか」形式。true が付くのは「誤っている記述」＝選ぶべき選択肢
   hosoku:true … 教科書に記述のない補足知識（国試過去問の頻出テーマ）
   exp … 正解時に見せる「なぜ正しいか」

   ★1回拍出量＝拡張期末容量−収縮期末容量 は教科書P154（D 循環調節）にあるため、パートBには入れていない。

   過去問（3章 循環（生理学）2008〜2017＋宅ドリル循環30問）での出題頻度：
   心臓の活動周期（各期の内圧・弁・時期）7回／心電図の波形の意味 5回／心電図から判読できないもの 3回／
   心室細動＝心停止 3回／心音（Ⅰ音＝房室弁閉鎖）2回／心房細動 2回 */
const PICK=5;
const POOL=[

/* ---------- B-1 心電図の記録（P141〜142） ---------- */

{q:"心電図の波形が表しているものはどれか。",
 choices:[
  ["心筋細胞の電気活動の総和による、電位の変化値",true,""],
  ["1個の心筋細胞の膜電位の絶対値",false,"細胞に電極を刺して測る値。心電図は皮膚上の電極で多数の細胞の活動をまとめてとらえる。"],
  ["心室内圧の変化",false,"心臓カテーテルなどで測る圧の変化で、電気活動ではない。"],
  ["心臓の弁の開閉による振動",false,"心音図がとらえるもの。"]],
 exp:"心電図は<b>心筋細胞の電気活動の総和</b>としてとらえられる。直流成分はカットされているので、電位の絶対値ではなく<b>変化値</b>が示される。（教科書 P142）"},

{q:"双極誘導法の第Ⅱ誘導はどれか。",
 choices:[
  ["右手と左足の間",true,""],
  ["両腕の間",false,"第Ⅰ誘導。"],
  ["左手と左足の間",false,"第Ⅲ誘導。"],
  ["右手と右足の間",false,"双極誘導法では右足は使わない。電極は左右の手と左足に置く。"]],
 exp:"第Ⅰ誘導＝両腕間、<b>第Ⅱ誘導＝右手と左足間</b>、第Ⅲ誘導＝左手と左足間。（教科書 P142）"},

{q:"左右の手と左足を頂点とする、心電図の正三角形モデルを何というか。",
 choices:[
  ["アイントーベンの三角形",true,""],
  ["スターリングの三角形",false,"スターリングは心臓の法則（心室が引き伸ばされるほど強く収縮する）に名を残す人物で、心電図の三角形とは関係がない。"],
  ["ウィリス動脈輪",false,"脳底部で動脈どうしがつながってできる輪で、心電図とは関係がない。"],
  ["ヘーリング・ブロイエルの三角形",false,"ヘーリング・ブロイエルは肺の伸展による呼吸の反射に名を残す人物で、心電図の三角形とは関係がない。"]],
 exp:"左右の手と左足を頂点とする<b>アイントーベン</b>の正三角形モデルをつくり、その各辺を第Ⅰ、Ⅱ、Ⅲ誘導と呼ぶ。（教科書 図10・4）"},

{q:"単極誘導法で、一方の極に用いる電極はどれか。",
 choices:[
  ["電位が心起電力の影響を受けない不関電極",true,""],
  ["心臓の真上に置く探査電極だけ",false,"単極誘導法では探査側の電極と組にして、もう一方の極に別の電極を用いる。"],
  ["左右の手に置いた2つの電極",false,"両腕の2点で記録するのは双極誘導法の第Ⅰ誘導。"],
  ["心筋に直接刺した針電極",false,"心電図は皮膚上に置いた電極で記録する。"]],
 exp:"単極誘導法は、一方の極に電位が心起電力の影響を受けない電極（<b>不関電極</b>）を用いる誘導法である。（教科書 P142）"},

{q:"単極胸部誘導の表し方はどれか。",
 choices:[
  ["V₁〜V₆",true,""],
  ["aVR・aVL・aVF",false,"単極肢誘導の表し方。"],
  ["Ⅰ・Ⅱ・Ⅲ",false,"双極誘導（標準肢誘導）の表し方。"],
  ["P・QRS・T",false,"心電図の波形の名前。"]],
 exp:"単極誘導法には、単極胸部誘導（<b>V₁〜V₆</b>）と単極肢誘導（aVR、aVL、aVF）がある。（教科書 P142）"},

{q:"心電図の形態の基準とされる誘導はどれか。",
 choices:[
  ["第Ⅱ誘導",true,""],
  ["第Ⅰ誘導",false,"両腕間の双極誘導。"],
  ["第Ⅲ誘導",false,"左手と左足間の双極誘導。"],
  ["aVR",false,"単極肢誘導のひとつ。"]],
 exp:"心電図の形態は、一般に<b>第Ⅱ誘導</b>心電図が基準とされている。（教科書 P142）"},

{q:"通常の心電図の記録の基準で正しいのはどれか。",
 choices:[
  ["縦10 mmが1 mV、横25 mmが1秒",true,""],
  ["縦1 mmが1 mV、横25 mmが1秒",false,"縦の倍率が小さすぎ、波形が10分の1の高さになってしまう。"],
  ["縦10 mmが1 mV、横10 mmが1秒",false,"横の送りが遅く、波形が詰まって記録される。"],
  ["縦25 mmが1 mV、横10 mmが1秒",false,"縦と横の数値が入れ替わっている。"]],
 exp:"通常、心電図は<b>10 mmを1 mV</b>、<b>25 mmを1秒</b>として記録する。（教科書 図10・4）"},

/* ---------- B-2 心電図の波形（P142） ---------- */

{q:"左右の心房筋の脱分極によって生じる波はどれか。",kihon:true,dobon:true,
 choices:[
  ["P波",true,""],
  ["QRS波",false,"心室の脱分極によって生じる波。"],
  ["T波",false,"心室の再分極の過程を示す波。"],
  ["ST部分",false,"QRS波の終わりからT波の始まりまでで、心室全体の興奮状態を示す。"]],
 exp:"<b>P波</b>は左右の心房筋が脱分極することによって生じる。心房の再分極はQRS波と重なるため、心電図には現れない。（教科書 P142）"},

{q:"心室の再分極の過程を示すのはどれか。",kihon:true,dobon:true,
 choices:[
  ["T波",true,""],
  ["P波",false,"左右の心房筋の脱分極によって生じる波。"],
  ["QRS波",false,"心室の脱分極によって生じる波。"],
  ["PQ時間",false,"房室伝導に要する時間を示す区間。"]],
 exp:"<b>T波</b>は心室の再分極の過程を示す波である。（教科書 P142）"},

{q:"QRS波が示すのはどれか。",kihon:true,dobon:true,
 choices:[
  ["心室の脱分極",true,""],
  ["心房の脱分極",false,"P波が示すもの。"],
  ["心室の再分極",false,"T波が示すもの。"],
  ["心房の再分極",false,"QRS波と時期が重なって隠れるため、心電図には独立した波として現れない。"]],
 exp:"QRS波は<b>心室の脱分極</b>によって生じる波である。（教科書 P142）"},

{q:"房室伝導に要する時間を示すのはどれか。",kihon:true,
 choices:[
  ["PQ時間",true,""],
  ["QT時間",false,"心室の脱分極開始から再分極終了までの時間。"],
  ["QRS幅",false,"心室内伝導時間を示す。"],
  ["R-R間隔",false,"心拍の間隔で、リズムの異常の判読や心拍数の算出に使う。"]],
 exp:"<b>PQ（PR）時間</b>はP波の始まりからQRS波の始まりまでで、房室伝導に要する時間を示す。（教科書 P142）"},

{q:"心室内伝導時間を示すのはどれか。",kihon:true,
 choices:[
  ["QRS幅",true,""],
  ["PQ時間",false,"房室伝導に要する時間を示す。"],
  ["ST部分",false,"心室全体の興奮状態を示す。"],
  ["QT時間",false,"心室の脱分極開始から再分極終了までの時間。"]],
 exp:"<b>QRS幅</b>はQ（R）の始まりからR（S）の終わりまでで、心室内伝導時間を示す。（教科書 P142）"},

{q:"ST部分が基線に近くなる理由はどれか。",
 choices:[
  ["心室全体が興奮していて、大きな電位変化がない",true,""],
  ["心臓全体が休止している",false,"ST部分の時期、心室はむしろ全体が興奮している。休止に近いのはT波の後から次のP波まで。"],
  ["心房が再分極している",false,"心房の再分極はQRS波と重なる時期に起こる。"],
  ["房室結節で伝導が遅れている",false,"PQ時間に含まれる現象。"]],
 exp:"ST部分は<b>心室全体の興奮状態</b>を示す。心室筋の脱分極直後から再分極開始直前までは、大きな電位変化がないため基線に近くなる。（教科書 P142）"},

{q:"QT時間が示すのはどれか。",
 choices:[
  ["心室の脱分極開始から再分極終了までの時間",true,""],
  ["心房の脱分極開始から心室の脱分極開始までの時間",false,"PQ時間が示すもの。"],
  ["心室の再分極だけにかかる時間",false,"T波の幅にあたる。QT時間は脱分極の開始から数える。"],
  ["1回の心拍にかかる時間",false,"R-R間隔が示すもの。"]],
 exp:"QT時間はQRS波の始まりからT波の終わりまでで、<b>心室の脱分極開始から再分極終了まで</b>の時間である。（教科書 P142）"},

{q:"心電図の基線はどれか。",
 choices:[
  ["T波の終わりと次のP波の始めを結ぶ線",true,""],
  ["P波の終わりとQRS波の始めを結ぶ線",false,"PQ時間の中にあたる部分。"],
  ["QRS波の終わりとT波の始めを結ぶ線",false,"ST部分にあたる。"],
  ["R波の頂点どうしを結ぶ線",false,"R-R間隔を測るときの目印で、基線ではない。"]],
 exp:"基線は<b>T波の終わりと次のP波の始め</b>を結ぶ線である。（教科書 P142）"},

{q:"心電図の波形・区間とその意味の組合せで誤っているのはどれか。",kihon:true,gori:true,
 choices:[
  ["QRS幅 ― 房室伝導時間",true,""],
  ["P波 ― 左右の心房筋の脱分極",false,"教科書どおりの記述なので、正しい。"],
  ["ST部分 ― 心室全体の興奮状態",false,"教科書どおりの記述なので、正しい。"],
  ["QT時間 ― 心室の脱分極開始から再分極終了まで",false,"教科書どおりの記述なので、正しい。"]],
 exp:"QRS幅が示すのは<b>心室内伝導時間</b>。房室伝導時間を示すのはPQ時間である。（教科書 P142）"},

/* ---------- B-3 心電図の判読と異常（P143） ---------- */

{q:"心電図から判読できないのはどれか。",kihon:true,dobon:true,
 choices:[
  ["1回拍出量",true,""],
  ["心拍数",false,"R-R間隔から求められる。"],
  ["心筋梗塞の有無",false,"ST上昇や異常Q波などの波形の変化から判読できる。"],
  ["房室伝導の異常",false,"PQ時間から判読できる。"]],
 exp:"心電図がとらえるのは電気活動なので、拍出される<b>血液の量</b>はわからない。判読で得られるのは不整脈、心筋障害、心房や心室の肥大・拡張などである。（教科書 P143）"},

{q:"心臓のリズムの異常を判読するときにみるのはどれか。",kihon:true,
 choices:[
  ["R-R間隔",true,""],
  ["QRS幅",false,"心室内伝導時間をみるときに使う。"],
  ["ST部分",false,"心筋障害（ST上昇など）をみるときに使う。"],
  ["T波の振幅",false,"波形の振幅の異常をみるときに使う。"]],
 exp:"リズムの異常は<b>R-R間隔</b>でみる。心拍数もR-R間隔から求められる。（教科書 P143）"},

{q:"洞房結節がペースメーカーになっているかを判読するときにみるのはどれか。",
 choices:[
  ["P波とQRS波の関係",true,""],
  ["ST部分の高さ",false,"心筋障害をみるときに使う。"],
  ["T波の向き",false,"心筋梗塞の冠性T波など、波形の異常をみるときに使う。"],
  ["QT時間の長さ",false,"心室の興奮から回復までの時間で、興奮伝導の異常をみるときに使う。"]],
 exp:"心房の興奮（P波）のあとに心室の興奮（QRS波）が続いているかで、<b>洞房結節</b>がペースメーカーになっているかを判断する。（教科書 P143）"},

{q:"心電図の判読で主に得られる情報の組合せはどれか。",
 choices:[
  ["不整脈・心筋障害・心房や心室の肥大",true,""],
  ["心拍出量・血圧・血流量",false,"血液の量や圧にかかわる情報で、電気活動をとらえる心電図からは得られない。"],
  ["血液量・血液の粘性・血管抵抗",false,"血圧を決める因子の並びで、心電図からは得られない。"],
  ["弁の形・冠動脈の太さ・心臓の重さ",false,"心臓の形や構造にかかわる情報で、画像検査などで調べる。"]],
 exp:"判読によって得られる情報は、<b>不整脈、心筋障害、心房や心室の肥大・拡張</b>などが主なものである。（教科書 P143）"},

let mode="normal", drawn=[], idx=0, score=0, streak=0, answered=false, dead=false;
let qmiss=0, totalMiss=0, firstTryCount=0; // ミス回数の集計（通常モード）
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function home(){
  document.getElementById("htt").textContent="確認テスト";
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="0";
  document.getElementById("bd").innerHTML=`
    <div class="center">
      <p class="lead">モードを選んでスタート。<br>問題は毎回シャッフルされ、プール${POOL.length}問から${PICK}問が出題されます。</p>
      <div class="modes">
        <button class="mode" onclick="start('normal')">
          <div class="nm">通常モード</div>
          <div class="ds">${PICK}問を最後まで解いて採点します。ふだんの確認用。<span class="mark kihon" style="margin-left:4px">🎯基本</span> は落としちゃダメな基本問題、<span class="mark gori">⚠ 誤りを選ぶ</span> は誤っているものを選ぶ問題、<span class="mark hosoku">📘 補足（資料外）</span> は教科書外の国試頻出テーマ。</div>
        </button>
        <button class="mode dob" onclick="start('dobon')">
          <div class="nm">💣 ドボンチャレンジ</div>
          <div class="ds">プールの中のごく一部、<b>絶対に落とせない最重要問題</b>だけが <b>💣ドボン！</b> に変身。それを外したらそこで終了。どこまで正解を続けられるか挑戦！</div>
        </button>
      </div>
    </div>`;
  document.getElementById("ctrl").innerHTML="";
}
function start(m){
  mode=m; drawn=shuffle(POOL).slice(0,Math.min(PICK,POOL.length));
  idx=0;score=0;streak=0;dead=false;totalMiss=0;firstTryCount=0;render();
}
function render(){
  answered=false; qmiss=0;
  const item=drawn[idx];
  const opts=shuffle(item.choices);
  const isDob=(mode==="dobon" && item.dobon);
  document.getElementById("htt").textContent=(mode==="dobon")?"ドボンチャレンジ":"確認テスト";
  document.getElementById("pg").textContent=`問 ${idx+1} / ${drawn.length}`;
  document.getElementById("bar").style.width=(idx/drawn.length*100)+"%";
  const L=["ア","イ","ウ","エ","オ"];
  // ドボン対象の問題だけ💣に変わる。それ以外の🎯基本は通常どおり🎯のまま表示する
  let markHtml = isDob ? `<span class="mark dobon">💣 ドボン！</span>`
                       : (item.kihon ? `<span class="mark kihon">🎯 基本</span>` : "");
  if(item.gori)   markHtml += `<span class="mark gori">⚠ 誤りを選ぶ</span>`;
  if(item.hosoku) markHtml += `<span class="mark hosoku">📘 補足（資料外）</span>`;
  // 誤り選択問題は、設問中の「誤っている」を色付きにして読み飛ばしを防ぐ
  const qText = item.gori ? item.q.replace("誤っている",'<span class="ng">誤っている</span>') : item.q;
  let h=`<div class="qnum">Q${idx+1} ${markHtml}</div><div class="q">${qText}</div><div class="opts">`;
  opts.forEach((o,i)=>{h+=`<button class="opt" onclick="pick(this,${o[1]})"><span class="mk">${L[i]}</span><span>${o[0]}</span></button>`;});
  h+=`</div><div class="exp" id="exp"><div class="vd" id="vd"></div><div class="tx" id="tx"></div></div>`;
  document.getElementById("bd").innerHTML=h;
  document.getElementById("ctrl").innerHTML=`<button class="btn" id="nx" onclick="next()" disabled>解答を選んでください</button>`;
}
function pick(el,ok){
  if(answered)return;
  if(el.classList.contains("dis"))return; // 無効化済みの選択肢は再カウントしない
  const item=drawn[idx];
  const isDob=(mode==="dobon" && item.dobon);
  const selText=el.querySelector("span:last-child").textContent;
  const selChoice=item.choices.find(c=>c[0]===selText);
  const exp=document.getElementById("exp");
  const nx=document.getElementById("nx");

  if(ok){
    // 正解：ここで確定。正解した選択肢だけ緑にする（不正解の選択肢は先に色を変えない）
    answered=true;
    el.classList.add("correct");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    score++;
    if(mode!=="dobon"){ if(qmiss===0) firstTryCount++; }
    if(mode==="dobon") streak++;
    exp.className="exp show ok";
    document.getElementById("vd").textContent=(qmiss===0)?"正解！":"正解！（"+qmiss+"回目で正解）";
    document.getElementById("tx").innerHTML=item.exp;
    nx.disabled=false;
    nx.textContent=(idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶";
    return;
  }

  // 不正解
  if(mode==="dobon"){
    // ドボンモードは一発勝負：選び直しなし・正解は伏せる
    answered=true;
    el.classList.add("wrong");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    if(item.dobon){ dead=true; } // 💣ドボン対象を外したときだけ終了
    exp.className="exp show ng";
    document.getElementById("vd").textContent=isDob?"💣 ドボン！":"不正解";
    document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}`;
    nx.disabled=false;
    nx.textContent=dead?"結果を見る（ドボン）▶":((idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶");
    return;
  }

  // 通常モード：ミスを数え、選んだ選択肢だけ赤にして無効化。正解は伏せたまま選び直せる
  qmiss++; totalMiss++;
  el.classList.add("wrong","dis");
  exp.className="exp show ng";
  document.getElementById("vd").textContent="不正解（ミス "+qmiss+"回）";
  document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}<br>ほかの選択肢からもう一度選んでください。`;
  // 「次へ」はまだ出さない（正解するまで進めない）
}
function next(){
  if(dead){result();return;}
  if(idx+1<drawn.length){idx++;render();}
  else result();
}
function result(){
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="100%";
  if(mode==="dobon"){
    document.getElementById("htt").textContent="結果";
    if(dead){
      document.getElementById("bd").innerHTML=`<div class="center score dead">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>ドボンを踏んでしまいました</div>
        <div class="big">${streak} 問連続正解</div>
        <div class="msg">${idx}問正解のあと、${idx+1}問目でドボン。<br>上の解説を復習して再挑戦しましょう。</div>
      </div>`;
    }else{
      document.getElementById("bd").innerHTML=`<div class="center score">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>クリア！</div>
        <div class="big">${score} / ${drawn.length}</div>
        <div class="msg">ドボンを踏まず完走しました。お見事！</div>
      </div>`;
    }
  }else{
    document.getElementById("htt").textContent="結果";
    const n=drawn.length;
    const ftPct=Math.round(firstTryCount/n*100);
    const noMiss=(totalMiss===0);
    let head = noMiss
      ? `<div class="big">✨ ノーミス パーフェクト！</div><div>全 ${n} 問を一発で正解</div>`
      : `<div>今回の成績</div><div class="big">${firstTryCount} / ${n}</div><div>一発正解率 ${ftPct}%</div>`;
    let stat = `<div class="stats">一発正解 ${firstTryCount}問　｜　総ミス ${totalMiss}回</div>`;
    let msg = noMiss?"完璧です。この調子！":ftPct>=60?"よくできました。ミスした問題を復習しましょう。":"もう一度スライドで確認してから挑戦しましょう。";
    document.getElementById("bd").innerHTML=`<div class="center score">${head}${stat}<div class="msg">${msg}</div></div>`;
  }
  document.getElementById("ctrl").innerHTML=`<button class="btn sub" onclick="home()">モード選択へ</button><button class="btn" onclick="start(mode)">もう一度（シャッフル）▶</button>`;
}
home();
</script>
</body>
</html>
