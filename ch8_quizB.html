   ★例外：「血液凝固因子の生合成に必要なビタミン」は📘補足だが💣ドボンを付けている。
     資料外だが過去問2回＋解説中に頻出という判断（引き継ぎ資料5節の例外、2例目）。🎯は付けていない。

   ★内因系・外因系は教科書P122の各4行しかないため、因子番号の連鎖（XII→XI→IX）や
     複合体の構成要素は問わない。「内因系＝血液中の凝固因子のみ／外因系＝組織液が関わる」
     という違いと、それぞれの入口（第XII因子／第VII因子）に絞っている。

   過去問（2章 血液（生理学）／(2)血液凝固・(5)混合）での出題頻度：
   プラスミンがフィブリン（線維素）を溶解 4回／血液凝固因子の同定 3回／
   トロンビンがフィブリノゲンをフィブリンに変える 3回／ビタミンKと凝固因子 2回／
   第IV因子＝カルシウムイオン 2回／ヘパリン＝抗凝固 2回／セロトニン 1回／ウロキナーゼ 1回
   ※内因系・外因系の因子番号を直接問う過去問は見当たらなかったため💣は付けていない
   ※ビタミンK・ヘパリン・クエン酸ナトリウムは教科書に記述がないため📘に回している */
const PICK=5;
const POOL=[

/* ---------- B-1 止血の3段階（P120） ---------- */

{q:"止血の反応として正しい順序はどれか。",kihon:true,
 choices:[
  ["局所的血管収縮 → 血小板凝集 → 血液凝固",true,""],
  ["血小板凝集 → 局所的血管収縮 → 血液凝固",false,"最初に起こる反応が入れ替わっている。"],
  ["血液凝固 → 血小板凝集 → 局所的血管収縮",false,"順序が逆になっている。"],
  ["局所的血管収縮 → 血液凝固 → 血小板凝集",false,"2番目と3番目が入れ替わっている。"]],
 exp:"止血は、①損傷部の<b>局所的血管収縮</b>、②<b>血小板の凝集</b>、③<b>血液凝固</b>の一連の反応で行われる。（教科書 P120、図8・7）"},

{q:"一次血栓の別名はどれか。",kihon:true,
 choices:[
  ["血小板血栓",true,""],
  ["フィブリン血栓",false,"二次血栓の別名。"],
  ["凝固血栓",false,"二次血栓の別名。"],
  ["血餅",false,"フィブリンが血液細胞を閉じ込めてできる塊のこと。"]],
 exp:"血管の損傷が小さければ、血小板凝集で損傷部位が塞がれて止血される。これを<b>一次血栓（血小板血栓）</b>という。（教科書 P120）"},

{q:"二次血栓の別名はどれか。",kihon:true,
 choices:[
  ["フィブリン血栓",true,""],
  ["血小板血栓",false,"一次血栓の別名。"],
  ["血餅",false,"二次血栓ができるときに形成される塊そのもののこと。"],
  ["出血斑",false,"血小板の不足や機能障害でみられる、点状の出血のこと。"]],
 exp:"フィブリンが血液細胞を閉じ込めることで血餅が形成され、止血が行われる。これを<b>二次血栓（フィブリン血栓・凝固血栓）</b>という。（教科書 P121）"},

{q:"二次血栓が必要になるのはどのようなときか。",
 choices:[
  ["一次血栓では止血できない大規模な血管の損傷",true,""],
  ["出血がまったくないとき",false,"止血の反応が起こる状況ではない。"],
  ["血管が修復されたあと",false,"できあがった凝固血栓が分解される時期。"],
  ["血小板が過剰にあるとき",false,"血栓はできやすくなるが、二次血栓が必要になる理由ではない。"]],
 exp:"二次血栓は、<b>一次血栓では止血できない大規模な血管の損傷</b>に対応できる。（教科書 P121）"},

/* ---------- B-2 局所的血管収縮（P120） ---------- */

{q:"血管が損傷したとき、傷口で露出するのはどれか。",kihon:true,
 choices:[
  ["コラーゲン線維",true,""],
  ["フィブリン",false,"凝固の最終段階でつくられる線維。"],
  ["プラスミン",false,"フィブリンを分解する酵素。"],
  ["組織トロンボプラスチン",false,"組織液中にあり、外因系のきっかけになる凝固因子。"]],
 exp:"血管が損傷すると傷口では<b>コラーゲン線維</b>が露出し、そこに粘着しやすい性質をもつ血小板が粘着しはじめる。（教科書 P120）"},

{q:"粘着した血小板が放出し、血管を収縮させるのはどれか。",kihon:true,
 choices:[
  ["セロトニン",true,""],
  ["ADP",false,"他の血小板を自身の周りに次々と付着させる物質。"],
  ["ヘパリン",false,"血液の凝固を抑制する物質。"],
  ["プラスミノゲン",false,"血漿中にある前駆物質で、活性化すると線溶にはたらく。"]],
 exp:"粘着した血小板は<b>セロトニン</b>などを放出することで血管を収縮させ、血流量を減少させる。（教科書 P120）"},

{q:"セロトニンの放出によって起こるのはどれか。",
 choices:[
  ["血流量の減少",true,""],
  ["血管の拡張",false,"血流量が増える向きの変化。"],
  ["血小板の分解",false,"止血の過程で起こる反応ではない。"],
  ["フィブリンの溶解",false,"血管が修復されたのちに起こる反応。"]],
 exp:"血管を収縮させることで<b>血流量を減少</b>させる。これが止血の第1段階である。（教科書 P120）"},

{q:"血小板がコラーゲン線維に粘着するのはなぜか。",
 choices:[
  ["コラーゲン線維に粘着しやすい性質をもつから",true,""],
  ["コラーゲン線維が血小板を引き寄せるADPを出すから",false,"ADPを放出するのは粘着した血小板のほうである。"],
  ["血流が止まって沈殿するから",false,"粘着は血流が止まる前に起こる。"],
  ["血小板に核があり運動できるから",false,"血小板は核をもたない細胞片である。"]],
 exp:"血小板はもともと<b>コラーゲン線維に粘着しやすい性質</b>をもっている。（教科書 P120）"},

/* ---------- B-3 血小板凝集（P120） ---------- */

{q:"粘着した血小板が放出し、他の血小板を次々と付着させるのはどれか。",kihon:true,
 choices:[
  ["アデノシン二リン酸（ADP）",true,""],
  ["セロトニン",false,"血管を収縮させて血流量を減少させる物質。"],
  ["トロンビン",false,"フィブリノゲンをフィブリンに変える酵素。"],
  ["アンチプラスミン",false,"線維素溶解を抑制する因子。"]],
 exp:"粘着した血小板は<b>ADP</b>を放出することで他の血小板を自身の周りに次々と付着させ、傷口に血小板の塊を形成する。（教科書 P120）"},

{q:"一次血栓だけで止血されるのはどのようなときか。",kihon:true,
 choices:[
  ["血管の損傷が小さいとき",true,""],
  ["血管の損傷が大きいとき",false,"フィブリンによる二次血栓が必要になる。"],
  ["血小板が不足しているとき",false,"止血されず、点状の出血斑が現れることがある。"],
  ["血管が完全に切断されたとき",false,"大規模な損傷にあたる。"]],
 exp:"<b>血管の損傷が小さければ</b>、血小板凝集で損傷部位が塞がれて止血される。（教科書 P120）"},

{q:"血小板が不足したり機能に障害があったりすると現れるのはどれか。",kihon:true,
 choices:[
  ["点状の出血斑",true,""],
  ["凝固血栓の増加",false,"むしろ血栓ができにくくなる。"],
  ["血管の過度な収縮",false,"セロトニンによる収縮が強まるわけではない。"],
  ["フィブリンの過剰形成",false,"凝固が亢進する向きの変化。"]],
 exp:"血小板が不足したり機能に障害があったりすると止血されず、<b>点状の出血斑</b>が現れることがある。（教科書 P120）"},

{q:"ADPの正式な名称はどれか。",
 choices:[
  ["アデノシン二リン酸",true,""],
  ["アデノシン三リン酸",false,"細胞のエネルギー源として使われる物質で、リン酸基の数が異なる。"],
  ["アデニル酸シクラーゼ",false,"細胞内の情報伝達に関わる酵素。"],
  ["アデノシン一リン酸",false,"リン酸基の数が異なる。"]],
 exp:"<b>アデノシン二リン酸</b>（adenosine diphosphate）、略してADP。（教科書 P120）"},

/* ---------- B-4 血液凝固の概要（P121） ---------- */

{q:"血液凝固の2つの反応過程はどれか。",kihon:true,
 choices:[
  ["内因系と外因系",true,""],
  ["一次系と二次系",false,"血栓の呼び名であって、反応過程の名前ではない。"],
  ["促進系と抑制系",false,"線維素溶解を調節する因子の分類に近い言い方。"],
  ["粘着系と凝集系",false,"血小板が関わる段階を指す言い方。"]],
 exp:"血液凝固には<b>内因系</b>と<b>外因系</b>の2つの反応過程がある。（教科書 P121、図8・8）"},

{q:"血管損傷部位に粘着した血小板から放出され、凝固に関与するのはどれか。",
 choices:[
  ["血小板第3因子（PF-3）",true,""],
  ["第III因子",false,"組織液中にあり、外因系のきっかけになる因子。"],
  ["第XIII因子",false,"できあがったフィブリンを安定化させる因子。"],
  ["プラスミノゲン",false,"フィブリンを分解する酵素のもとになる物質。"]],
 exp:"血液凝固因子と呼ばれる一連のタンパク質のほか、血管損傷部位に粘着した血小板から放出される<b>血小板第3因子（PF-3）</b>などが関与してフィブリンが形成される。（教科書 P121）"},

{q:"血餅をつくるのはどれか。",
 choices:[
  ["フィブリンが血液細胞を閉じ込めること",true,""],
  ["血小板がADPで集まること",false,"一次血栓ができる過程。"],
  ["コラーゲン線維が露出すること",false,"止血の最初のきっかけ。"],
  ["プラスミンがはたらくこと",false,"できあがった血栓を分解する過程。"]],
 exp:"<b>フィブリンが血液細胞を閉じ込める</b>ことで血餅が形成され、止血が行われる。（教科書 P121）"},

/* ---------- B-5 内因系（P122） ---------- */

{q:"内因系の特徴はどれか。",kihon:true,
 choices:[
  ["血液中の凝固因子のみが関わって進行する",true,""],
  ["組織液中の因子が必ず必要である",false,"外因系のきっかけになる経路の説明。"],
  ["血小板がまったく関与しない",false,"血小板第3因子が複合体の形成に加わる。"],
  ["フィブリンを分解する過程である",false,"血管が修復されたのちに起こる線維素溶解の説明。"]],

{q:"傷口に露出したコラーゲン線維に接触して活性化する凝固因子はどれか。",
 choices:[

  ["第VII因子",false,"組織液中の因子と接触して外因系を開始する。"],

/* ---------- B-6 外因系（P122） ---------- */

{q:"外因系が始まるきっかけはどれか。",kihon:true,

 exp:"血管の損傷が大きい場合、<b>血液が組織内へ流出したり組織液が血管内に流入したり</b>する。これが外因系のきっかけになる。（教科書 P122）"},

{q:"外因系で、血漿中の第VII因子と接触するのはどれか。",

          <div class="ds">プールの中のごく一部、<b>絶対に落とせない最重要問題</b>だけが <b>💣ドボン！</b> に変身。それを外したらそこで終了。どこまで正解を続けられるか挑戦！</div>

function start(m){
  mode=m; drawn=shuffle(POOL).slice(0,Math.min(PICK,POOL.length));
  idx=0;score=0;streak=0;dead=false;totalMiss=0;firstTryCount=0;render();
}
function render(){
  answered=false; qmiss=0;
  const item=drawn[idx];
  const opts=shuffle(item.choices);
  const isDob=(mode==="dobon" && item.dobon);
  document.getElementById("htt").textContent=(mode==="dobon")?"ドボンチャレンジ":"確認テスト";
  document.getElementById("pg").textContent=`問 ${idx+1} / ${drawn.length}`;
  document.getElementById("bar").style.width=(idx/drawn.length*100)+"%";
  const L=["ア","イ","ウ","エ","オ"];
  // ドボン対象の問題だけ💣に変わる。それ以外の🎯基本は通常どおり🎯のまま表示する
  let markHtml = isDob ? `<span class="mark dobon">💣 ドボン！</span>`
                       : (item.kihon ? `<span class="mark kihon">🎯 基本</span>` : "");
  if(item.gori)   markHtml += `<span class="mark gori">⚠ 誤りを選ぶ</span>`;
  if(item.hosoku) markHtml += `<span class="mark hosoku">📘 補足（資料外）</span>`;
  // 誤り選択問題は、設問中の「誤っている」を色付きにして読み飛ばしを防ぐ
  const qText = item.gori ? item.q.replace("誤っている",'<span class="ng">誤っている</span>') : item.q;
  let h=`<div class="qnum">Q${idx+1} ${markHtml}</div><div class="q">${qText}</div><div class="opts">`;
  opts.forEach((o,i)=>{h+=`<button class="opt" onclick="pick(this,${o[1]})"><span class="mk">${L[i]}</span><span>${o[0]}</span></button>`;});
  h+=`</div><div class="exp" id="exp"><div class="vd" id="vd"></div><div class="tx" id="tx"></div></div>`;
  document.getElementById("bd").innerHTML=h;
  document.getElementById("ctrl").innerHTML=`<button class="btn" id="nx" onclick="next()" disabled>解答を選んでください</button>`;
}
function pick(el,ok){
  if(answered)return;
  if(el.classList.contains("dis"))return; // 無効化済みの選択肢は再カウントしない
  const item=drawn[idx];
  const isDob=(mode==="dobon" && item.dobon);
  const selText=el.querySelector("span:last-child").textContent;
  const selChoice=item.choices.find(c=>c[0]===selText);
  const exp=document.getElementById("exp");
  const nx=document.getElementById("nx");

  if(ok){
    // 正解：ここで確定。正解した選択肢だけ緑にする（不正解の選択肢は先に色を変えない）
    answered=true;
    el.classList.add("correct");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    score++;
    if(mode!=="dobon"){ if(qmiss===0) firstTryCount++; }
    if(mode==="dobon") streak++;
    exp.className="exp show ok";
    document.getElementById("vd").textContent=(qmiss===0)?"正解！":"正解！（"+qmiss+"回目で正解）";
    document.getElementById("tx").innerHTML=item.exp;
    nx.disabled=false;
    nx.textContent=(idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶";
    return;
  }

  // 不正解
  if(mode==="dobon"){
    // ドボンモードは一発勝負：選び直しなし・正解は伏せる
    answered=true;
    el.classList.add("wrong");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    if(item.dobon){ dead=true; } // 💣ドボン対象を外したときだけ終了
    exp.className="exp show ng";
    document.getElementById("vd").textContent=isDob?"💣 ドボン！":"不正解";
    document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}`;
    nx.disabled=false;
    nx.textContent=dead?"結果を見る（ドボン）▶":((idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶");
    return;
  }

  // 通常モード：ミスを数え、選んだ選択肢だけ赤にして無効化。正解は伏せたまま選び直せる
  qmiss++; totalMiss++;
  el.classList.add("wrong","dis");
  exp.className="exp show ng";
  document.getElementById("vd").textContent="不正解（ミス "+qmiss+"回）";
  document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}<br>ほかの選択肢からもう一度選んでください。`;
  // 「次へ」はまだ出さない（正解するまで進めない）
}
function next(){
  if(dead){result();return;}
  if(idx+1<drawn.length){idx++;render();}
  else result();
}
function result(){
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="100%";
  if(mode==="dobon"){
    document.getElementById("htt").textContent="結果";
    if(dead){
      document.getElementById("bd").innerHTML=`<div class="center score dead">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>ドボンを踏んでしまいました</div>
        <div class="big">${streak} 問連続正解</div>
        <div class="msg">${idx}問正解のあと、${idx+1}問目でドボン。<br>上の解説を復習して再挑戦しましょう。</div>
      </div>`;
    }else{
      document.getElementById("bd").innerHTML=`<div class="center score">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>クリア！</div>
        <div class="big">${score} / ${drawn.length}</div>
        <div class="msg">ドボンを踏まず完走しました。お見事！</div>
      </div>`;
    }
  }else{
    document.getElementById("htt").textContent="結果";
    const n=drawn.length;
    const ftPct=Math.round(firstTryCount/n*100);
    const noMiss=(totalMiss===0);
    let head = noMiss
      ? `<div class="big">✨ ノーミス パーフェクト！</div><div>全 ${n} 問を一発で正解</div>`
      : `<div>今回の成績</div><div class="big">${firstTryCount} / ${n}</div><div>一発正解率 ${ftPct}%</div>`;
    let stat = `<div class="stats">一発正解 ${firstTryCount}問　｜　総ミス ${totalMiss}回</div>`;
    let msg = noMiss?"完璧です。この調子！":ftPct>=60?"よくできました。ミスした問題を復習しましょう。":"もう一度スライドで確認してから挑戦しましょう。";
    document.getElementById("bd").innerHTML=`<div class="center score">${head}${stat}<div class="msg">${msg}</div></div>`;
  }
  document.getElementById("ctrl").innerHTML=`<button class="btn sub" onclick="home()">モード選択へ</button><button class="btn" onclick="start(mode)">もう一度（シャッフル）▶</button>`;
}
home();
</script>
</body>
</html>
