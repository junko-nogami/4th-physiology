<script>
/* ===== 問題プール（教科書 第5章 P62〜74 ベース）=====
   対応スライド：ch5_partB.html
   choices: [表示文, 正解フラグ, その選択肢が何かの説明]
   kihon :true … 🎯基本 / dobon:true … 💣ドボン / gori:true … ⚠誤りを選ぶ / hosoku:true … 📘補足（資料外）

   過去問（11章 感覚）での出題頻度（パートB範囲）：
   杆体・錐体 6回／平衡（半規管・耳石器・有毛細胞）6回／遠近調節 5回／網膜の層構造 3回／
   聴覚（耳小骨・内側膝状体・コルチ器）3回／味覚の伝導路 2回／対光反射 2回／視覚伝導路 2回／嗅覚と視床 1回 */
const PICK=5;
const POOL=[

/* ---------- B-1 視覚：眼球の構造・遠近調節（P62〜63） ---------- */

{q:"光が網膜に達するまでに通る順序で正しいのはどれか。",kihon:true,
 choices:[
  ["角膜→眼房→水晶体→硝子体",true,""],
  ["角膜→硝子体→水晶体→眼房",false,"硝子体は眼球のいちばん奥を占めるゲル状の物質。"],
  ["眼房→角膜→水晶体→硝子体",false,"眼房は眼球の最前面にはない。"],
  ["角膜→水晶体→眼房→硝子体",false,"眼房は水晶体より後ろにはない。"]],
 exp:"光は<b>角膜→眼房→水晶体→硝子体</b>と、屈折しながら通って網膜に達する。（教科書 P62、図5・3）"},

{q:"近くを見るときに収縮するのはどれか。",kihon:true,dobon:true,
 choices:[
  ["毛様体筋",true,""],
  ["瞳孔散大筋",false,"交感神経の支配を受け、収縮すると散瞳する筋。"],
  ["外側直筋",false,"眼球を外側へ向ける外眼筋。"],
  ["上斜筋",false,"眼球を動かす外眼筋のひとつ。"]],
 exp:"近くを見るときは副交感神経が興奮して<b>毛様体筋</b>が収縮する。すると毛様体小帯が弛緩し、水晶体が自らの弾力で膨らむ。（教科書 P63）"},

{q:"近くを見るときの変化で正しいのはどれか。",kihon:true,
 choices:[
  ["水晶体が厚くなる",true,""],
  ["毛様体小帯が緊張する",false,"遠くを見るとき（安静時）の状態。"],
  ["角膜の彎曲が強くなる",false,"角膜の形は変わらない。遠近調節は別の構造の厚みで行う。"],
  ["瞳孔が散大する",false,"暗い場所で起こる変化。"]],
 exp:"毛様体小帯がゆるむと、<b>水晶体</b>は自らの弾力で膨らみ屈折率が大きくなる。こうして近くの物を網膜上に結像させる。（教科書 P63）"},

{q:"遠くを眺めているとき（安静時）の状態で正しいのはどれか。",
 choices:[
  ["水晶体が毛様体小帯に引っ張られて薄くなる",true,""],
  ["毛様体筋が収縮している",false,"近くを見るときの状態。"],
  ["副交感神経が興奮している",false,"近くを見るときに起こる。"],
  ["水晶体が自らの弾力で膨らむ",false,"近くを見るときの状態。"]],
 exp:"休止眼では毛様体筋が弛緩し、水晶体は<b>毛様体小帯に引っ張られて</b>緊張している。このとき遠くの物が網膜上に結像する。（教科書 P63）"},

{q:"近くを見るときにみられる眼球の動きはどれか。",hosoku:true,
 choices:[
  ["両眼の内転",true,""],
  ["両眼の外転",false,"眼球が外側を向く動き。近くを見るときには起こらない。"],
  ["両眼の上転",false,"眼球が上を向く動き。"],
  ["眼振",false,"眼の速やかな周期的動揺。前庭器官が強く刺激されたときに起こる。"]],
 exp:"補足知識（資料外）。近くを見るときは、両眼が<b>内側に寄る（輻輳）</b>、縮瞳、水晶体が厚くなる、の3つがそろって起こる。"},

/* ---------- B-1 視覚：屈折の異常（P63） ---------- */

{q:"近視について正しいのはどれか。",kihon:true,dobon:true,
 choices:[
  ["網膜の前方で焦点を結ぶ",true,""],
  ["網膜の後方で焦点を結ぶ",false,"遠視の状態。"],
  ["眼球の前後径が短いことで起こる",false,"遠視の原因。"],
  ["角膜面が完全な球形でないことで生じることが多い",false,"乱視の原因。"]],
 exp:"近視は眼球の前後径が長い、または屈折率が大きすぎるため、<b>網膜の前方</b>で焦点を結ぶ。凹レンズで焦点距離を伸ばして矯正する。（教科書 P63、図5・4）"},

{q:"遠視の矯正に用いるのはどれか。",
 choices:[
  ["凸レンズ",true,""],
  ["凹レンズ",false,"焦点距離を伸ばすレンズで、近視の矯正に使う。"],
  ["円柱レンズ",false,"乱視の矯正に使う。"],
  ["偏光レンズ",false,"反射光のまぶしさを抑えるレンズで、屈折異常の矯正には使わない。"]],
 exp:"遠視は網膜の後方で焦点を結ぶため、<b>凸レンズ</b>で焦点距離を縮めて矯正する。（教科書 P63）"},

{q:"屈折の異常について誤っているのはどれか。",gori:true,
 choices:[
  ["遠視は眼球の前後径が長いことで起こる",true,""],
  ["近視は凹レンズで矯正する",false,"教科書どおりの記述なので、正しい。"],
  ["乱視は円柱レンズで矯正する",false,"教科書どおりの記述なので、正しい。"],
  ["正視眼では、毛様体筋が収縮しなくても遠くからの光が網膜上に焦点を結ぶ",false,"教科書どおりの記述なので、正しい。"]],
 exp:"前後径が長いのは<b>近視</b>。遠視は前後径が短い、または屈折率が小さすぎるため、網膜の後方で焦点を結ぶ。（教科書 P63）"},

/* ---------- B-1 視覚：虹彩と瞳孔（P64） ---------- */

{q:"瞳孔散大筋を支配するのはどれか。",kihon:true,
 choices:[
  ["交感神経",true,""],
  ["副交感神経",false,"動眼神経に含まれ、瞳孔の周囲に輪状に分布する筋を支配する。"],
  ["視神経",false,"網膜の情報を脳へ伝える感覚神経。"],
  ["顔面神経",false,"表情筋を支配する脳神経。"]],
 exp:"瞳孔散大筋は瞳孔縁から放射状に分布し、<b>交感神経</b>の支配を受ける。収縮すると散瞳する。（教科書 P64）"},

{q:"縮瞳を起こすのはどれか。",kihon:true,
 choices:[
  ["瞳孔括約筋の収縮",true,""],
  ["瞳孔散大筋の収縮",false,"散瞳を起こす。"],
  ["毛様体筋の弛緩",false,"遠くを見るときの状態で、水晶体を薄くする。"],
  ["上斜筋の収縮",false,"眼球を動かす外眼筋で、瞳孔の大きさは変えない。"]],
 exp:"<b>瞳孔括約筋</b>は瞳孔の周囲に輪状に分布し、副交感神経（動眼神経）の支配で収縮して縮瞳を起こす。（教科書 P64）"},

{q:"対光反射の遠心路はどれか。",kihon:true,dobon:true,
 choices:[
  ["動眼神経に含まれる副交感神経",true,""],
  ["視神経",false,"視細胞からの情報を中枢へ伝える、対光反射の求心路。"],
  ["交感神経",false,"瞳孔散大筋を支配し、散瞳を起こす。"],
  ["外転神経",false,"外側直筋を支配する運動神経。"]],
 exp:"対光反射は、視細胞（受容器）→視神経（求心路）→両側の動眼神経副核（E-W核）→<b>動眼神経の副交感神経</b>（遠心路）→瞳孔括約筋、と進む。（教科書 P64、図5・7）"},

{q:"対光反射の中枢がある部位はどれか。",
 choices:[
  ["中脳",true,""],
  ["延髄",false,"呼吸・循環などの生命維持の中枢がある。"],
  ["視床の外側膝状体",false,"視覚情報を大脳皮質へ中継する核。"],
  ["大脳皮質の後頭葉",false,"一次視覚野がある。"]],
 exp:"中枢は<b>中脳</b>の動眼神経副核（E-W核）。このため瞳孔の左右不同や対光反射の障害は、中脳の障害でみられることがある。（教科書 P64）"},

{q:"対光反射について誤っているのはどれか。",gori:true,
 choices:[
  ["光を当てた側の眼だけが縮瞳する",true,""],
  ["受容器は視細胞である",false,"教科書どおりの記述なので、正しい。"],
  ["求心路は視神経である",false,"教科書どおりの記述なので、正しい。"],
  ["片眼からの情報は両側の動眼神経副核に入力する",false,"教科書どおりの記述なので、正しい。"]],
 exp:"片眼だけに光を当てても<b>両眼が縮瞳する</b>（共感性反射）。片眼からの情報が両側の動眼神経副核に入るため。（教科書 P64）"},

{q:"近距離の物体を見たときに瞳孔が縮小する反射はどれか。",
 choices:[

  ["角膜反射",false,"角膜に触れるとまぶたを閉じる反射。"]],

/* ---------- B-1 視覚：網膜（P64〜65） ---------- */

{q:"網膜の神経細胞のうち、もっとも強膜側（外側）にあるのはどれか。",kihon:true,dobon:true,
 choices:[
  ["視細胞",true,""],
  ["双極細胞",false,"網膜の中間層にあり、情報を中継する細胞。"],

{q:"網膜で視覚情報が伝わる順序で正しいのはどれか。",kihon:true,
 choices:[
  ["視細胞→双極細胞→神経節細胞",true,""],
  ["神経節細胞→双極細胞→視細胞",false,"情報の流れが逆。"],
  ["双極細胞→視細胞→神経節細胞",false,"最初に光を受け取る細胞が違う。"],
  ["視細胞→神経節細胞→双極細胞",false,"中継の順が違う。"]],

  ["中心窩",true,""],

  ["毛様体",false,"網膜ではなく、水晶体の厚みを調節する筋がある部位。"]],
 exp:"<b>中心窩</b>には錐体が集中しており、ここで結像するよう注視したときに視力がもっとも大きい。（教科書 P65、P67）"},

{q:"網膜について誤っているのはどれか。",gori:true,
 choices:[
  ["視神経乳頭には錐体が多く存在する",true,""],
  ["黄斑は視神経乳頭のやや耳側にある",false,"教科書どおりの記述なので、正しい。"],
  ["網膜の最外層は色素上皮層である",false,"教科書どおりの記述なので、正しい。"],
  ["アマクリン細胞は視覚情報の経路を調節する",false,"教科書どおりの記述なので、正しい。"]],

/* ---------- B-1 視覚：視細胞と視物質・色覚・順応（P65〜66） ---------- */

 choices:[

let mode="normal", drawn=[], idx=0, score=0, streak=0, answered=false, dead=false;
let qmiss=0, totalMiss=0, firstTryCount=0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function home(){
  document.getElementById("htt").textContent="確認テスト";
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="0";
  document.getElementById("bd").innerHTML=`
    <div class="center">
      <p class="lead">モードを選んでスタート。<br>問題は毎回シャッフルされ、プール${POOL.length}問から${PICK}問が出題されます。</p>
      <div class="modes">
        <button class="mode" onclick="start('normal')">
          <div class="nm">通常モード</div>
          <div class="ds">${PICK}問を最後まで解いて採点します。ふだんの確認用。<span class="mark kihon" style="margin-left:4px">🎯基本</span> は落としちゃダメな基本問題、<span class="mark gori">⚠ 誤りを選ぶ</span> は誤っているものを選ぶ問題、<span class="mark hosoku">📘 補足（資料外）</span> は教科書外の国試頻出テーマ。</div>
        </button>
        <button class="mode dob" onclick="start('dobon')">
          <div class="nm">💣 ドボンチャレンジ</div>
          <div class="ds">プールの中のごく一部、<b>絶対に落とせない最重要問題</b>だけが <b>💣ドボン！</b> に変身。それを外したらそこで終了。どこまで正解を続けられるか挑戦！</div>
        </button>
      </div>
    </div>`;
  document.getElementById("ctrl").innerHTML="";
}
function start(m){
  mode=m; drawn=shuffle(POOL).slice(0,Math.min(PICK,POOL.length));
  idx=0;score=0;streak=0;dead=false;totalMiss=0;firstTryCount=0;render();
}
function render(){
  answered=false; qmiss=0;
  const item=drawn[idx];
  const opts=shuffle(item.choices);
  const isDob=(mode==="dobon" && item.dobon);
  document.getElementById("htt").textContent=(mode==="dobon")?"ドボンチャレンジ":"確認テスト";
  document.getElementById("pg").textContent=`問 ${idx+1} / ${drawn.length}`;
  document.getElementById("bar").style.width=(idx/drawn.length*100)+"%";
  const L=["ア","イ","ウ","エ","オ"];
  let markHtml = isDob ? `<span class="mark dobon">💣 ドボン！</span>`
                       : (item.kihon ? `<span class="mark kihon">🎯 基本</span>` : "");
  if(item.gori)   markHtml += `<span class="mark gori">⚠ 誤りを選ぶ</span>`;
  if(item.hosoku) markHtml += `<span class="mark hosoku">📘 補足（資料外）</span>`;
  const qText = item.gori ? item.q.replace("誤っている",'<span class="ng">誤っている</span>') : item.q;
  let h=`<div class="qnum">Q${idx+1} ${markHtml}</div><div class="q">${qText}</div><div class="opts">`;
  opts.forEach((o,i)=>{h+=`<button class="opt" onclick="pick(this,${o[1]})"><span class="mk">${L[i]}</span><span>${o[0]}</span></button>`;});
  h+=`</div><div class="exp" id="exp"><div class="vd" id="vd"></div><div class="tx" id="tx"></div></div>`;
  document.getElementById("bd").innerHTML=h;
  document.getElementById("ctrl").innerHTML=`<button class="btn" id="nx" onclick="next()" disabled>解答を選んでください</button>`;
}
function pick(el,ok){
  if(answered)return;
  if(el.classList.contains("dis"))return;
  const item=drawn[idx];
  const isDob=(mode==="dobon" && item.dobon);
  const selText=el.querySelector("span:last-child").textContent;
  const selChoice=item.choices.find(c=>c[0]===selText);
  const exp=document.getElementById("exp");
  const nx=document.getElementById("nx");
  if(ok){
    answered=true;
    el.classList.add("correct");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    score++;
    if(mode!=="dobon"){ if(qmiss===0) firstTryCount++; }
    if(mode==="dobon") streak++;
    exp.className="exp show ok";
    document.getElementById("vd").textContent=(qmiss===0)?"正解！":"正解！（"+qmiss+"回目で正解）";
    document.getElementById("tx").innerHTML=item.exp;
    nx.disabled=false;
    nx.textContent=(idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶";
    return;
  }
  if(mode==="dobon"){
    answered=true;
    el.classList.add("wrong");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    if(item.dobon){ dead=true; }
    exp.className="exp show ng";
    document.getElementById("vd").textContent=isDob?"💣 ドボン！":"不正解";
    document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}`;
    nx.disabled=false;
    nx.textContent=dead?"結果を見る（ドボン）▶":((idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶");
    return;
  }
  qmiss++; totalMiss++;
  el.classList.add("wrong","dis");
  exp.className="exp show ng";
  document.getElementById("vd").textContent="不正解（ミス "+qmiss+"回）";
  document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}<br>ほかの選択肢からもう一度選んでください。`;
}
function next(){
  if(dead){result();return;}
  if(idx+1<drawn.length){idx++;render();}
  else result();
}
function result(){
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="100%";
  if(mode==="dobon"){
    document.getElementById("htt").textContent="結果";
    if(dead){
      document.getElementById("bd").innerHTML=`<div class="center score dead">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>ドボンを踏んでしまいました</div>
        <div class="big">${streak} 問連続正解</div>
        <div class="msg">${idx}問正解のあと、${idx+1}問目でドボン。<br>上の解説を復習して再挑戦しましょう。</div>
      </div>`;
    }else{
      document.getElementById("bd").innerHTML=`<div class="center score">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>クリア！</div>
        <div class="big">${score} / ${drawn.length}</div>
        <div class="msg">ドボンを踏まず完走しました。お見事！</div>
      </div>`;
    }
  }else{
    document.getElementById("htt").textContent="結果";
    const n=drawn.length;
    const ftPct=Math.round(firstTryCount/n*100);
    const noMiss=(totalMiss===0);
    let head = noMiss
      ? `<div class="big">✨ ノーミス パーフェクト！</div><div>全 ${n} 問を一発で正解</div>`
      : `<div>今回の成績</div><div class="big">${firstTryCount} / ${n}</div><div>一発正解率 ${ftPct}%</div>`;
    let stat = `<div class="stats">一発正解 ${firstTryCount}問　｜　総ミス ${totalMiss}回</div>`;
    let msg = noMiss?"完璧です。この調子！":ftPct>=60?"よくできました。ミスした問題を復習しましょう。":"もう一度スライドで確認してから挑戦しましょう。";
    document.getElementById("bd").innerHTML=`<div class="center score">${head}${stat}<div class="msg">${msg}</div></div>`;
  }
  document.getElementById("ctrl").innerHTML=`<button class="btn sub" onclick="home()">モード選択へ</button><button class="btn" onclick="start(mode)">もう一度（シャッフル）▶</button>`;
}
home();
</script>
