<h1>生理学 第1章 生理学とは｜パートC 確認テスト</h1>
<div class="slide">
  <div class="hd"><div><div class="ch">第1章 生理学とは ｜ B 組織・器官と生体の機能系・C 生体の恒常性と統合機能・D 体液の区分と組成</div><div class="tt" id="htt">確認テスト</div></div><div class="pg" id="pg"></div></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="bd" id="bd"></div>
  <div class="ctrl" id="ctrl"></div>
</div>
<script>
/* ===== 問題プール（教科書 第1章 P7〜10 ベース）=====
   choices: [表示文, 正解フラグ, その選択肢が何かの説明]
   kihon:true … 🎯基本　dobon:true … 💣ドボン（ドボンモードで外したら終了）
   gori:true … ⚠誤りを選ぶ　hosoku:true … 📘補足（資料外）
   g:"…" … 出題グループ（1回の出題での上限は GMAX）
   2026年11月 全面改訂（初版15問 → 33問、ドボン分離・グループ上限の新エンジン） */
const PICK=5;
const GMAX={kino:2,homeo:1,fb:2,taieki:2,ion:2};
function draw(){const out=[],cnt={};for(const q of shuffle(POOL)){const g=q.g;if(g&&GMAX[g]!==undefined){if((cnt[g]||0)>=GMAX[g])continue;cnt[g]=(cnt[g]||0)+1;}out.push(q);if(out.length>=PICK)break;}return out;}
const POOL=[
/* ---------- B 組織・器官と生体の機能系（P7〜8） ---------- */
{q:"消化管で分泌作用と吸収作用をもつ組織はどれか。",
 choices:[
  ["上皮組織",true,""],
  ["支持組織",false,"骨組織・軟骨組織・血液・結合組織を含み、組織同士をつなぎ合わせて間を埋める組織。"],
  ["筋組織",false,"収縮して力を生み出す組織（第2章）。"],
  ["神経組織",false,"興奮を伝えて情報を伝達する組織（第3章）。"]],
 exp:"<b>上皮組織</b>は、からだや器官の内外の表面を覆って器官を保護する。消化管では分泌作用と吸収作用、網膜では感覚作用をもつ。（P7）"},

{q:"組織同士をつなぎ合わせて、その間を埋めるはたらきをもつ組織に含まれるのはどれか。",
 choices:[
  ["血液",true,""],
  ["表皮",false,"からだの表面を覆う上皮組織。"],
  ["骨格筋",false,"収縮して骨を動かす筋組織。"],
  ["末梢神経",false,"興奮を伝える神経組織。"]],
 exp:"支持組織には骨組織・軟骨組織・<b>血液</b>・結合組織が含まれる。液体の血液も支持組織に分類される点に注意。（P7）"},

{q:"呼吸や消化などの機能を営むために、いくつかの器官がまとまってはたらく単位を何というか。",
 choices:[
  ["系統",true,""],
  ["組織",false,"同じ種類の細胞が集まり、一定のはたらきをもつようになったもの。"],
  ["器官",false,"組織が組み合わさってつくられたもの。単独の臓器にあたる。"],
  ["細胞",false,"からだを構成する基本単位。人体は約数十兆個の細胞からなる。"]],
 exp:"細胞 → 組織 → 器官 → <b>系統</b>の順にまとまる。たとえば、心臓・血管・リンパ管で構成されるものが循環系統である。（P7・P8）"},

{q:"各系統のはたらきを統合して、生命活動を維持しているのはどれか。",kihon:true,
 choices:[
  ["神経系と内分泌系",true,""],
  ["循環系と呼吸系",false,"酸素を取り込んで全身へ運ぶ系統。個体の生命維持に必須だが、ほかの系統をまとめる役割ではない。"],
  ["消化系と泌尿系",false,"栄養素を吸収し、老廃物を尿として排泄する系統。"],
  ["筋系と骨格系",false,"からだを支えて動かす、動物性機能の系統。"]],
 exp:"系統はそれぞれ独立しているのではなく相互に依存している。各系統のはたらきが<b>神経系と内分泌系</b>で統合されることで、生命活動が維持される。（P8）"},

{q:"個体の生命維持ではなく、種族の保存のために必須とされる機能はどれか。",g:"kino",
 choices:[
  ["生殖",true,""],
  ["循環",false,"血液・リンパを循環させる。個体の生命維持に必須の5系統の1つ。"],
  ["呼吸",false,"ガス交換を担う。個体の生命維持に必須の5系統の1つ。"],
  ["泌尿",false,"尿を生成・排泄する。個体の生命維持に必須の5系統の1つ。"]],
 exp:"循環・呼吸・消化・泌尿・内分泌系の5系統は個体の生命維持に必須である。これに対して、<b>生殖</b>・内分泌系は種族の保存のために必須である。（P8）"},

{q:"動物性機能に分類されるのはどれか。",g:"kino",
 choices:[
  ["感覚",true,""],
  ["消化",false,"食物を消化・吸収する機能で、動物・植物のいずれにも一般的にみられる植物性機能。"],
  ["呼吸",false,"ガス交換を担う機能で、植物性機能に分類される。"],
  ["泌尿",false,"尿を生成・排泄する機能で、植物性機能に分類される。"]],
 exp:"神経・筋・<b>感覚</b>・骨格系の活動は、動物で特によく発達していることから動物性機能と呼ぶ。（P8）"},

{q:"植物性機能と動物性機能について誤っているのはどれか。",gori:true,g:"kino",
 choices:[
  ["動物性機能は、動物と植物のいずれにも一般的にみられる",true,""],
  ["植物性機能には、内分泌系の機能が含まれる",false,"教科書どおりの記述なので、正しい。"],
  ["循環・呼吸・消化・泌尿・内分泌系の5系統は、個体の生命維持に必須である",false,"教科書どおりの記述なので、正しい。"],
  ["骨格系の活動は、動物性機能に含まれる",false,"教科書どおりの記述なので、正しい。"]],
 exp:"動物・植物のいずれにも一般的にみられるのは<b>植物性機能</b>。動物性機能は動物で特によく発達している。（P8）"},

{q:"個体の生命維持に必須とされる5系統に含まれないのはどれか。",g:"kino",
 choices:[
  ["神経系",true,""],
  ["循環系",false,"血液・リンパを循環させる。個体の生命維持に必須の5系統の1つ（植物性機能）。"],
  ["呼吸系",false,"ガス交換を担う。個体の生命維持に必須の5系統の1つ（植物性機能）。"],
  ["泌尿系",false,"尿を生成・排泄する。個体の生命維持に必須の5系統の1つ（植物性機能）。"]],
 exp:"個体の生命維持に必須なのは、循環・呼吸・消化・泌尿・内分泌系の5系統（植物性機能）。<b>神経系</b>は動物性機能に分類される。（P8）"},

/* ---------- C 生体の恒常性と統合機能（P8〜9） ---------- */
{q:"細胞を取り巻く主な環境で、生体の内部環境と呼ばれるのはどれか。",kihon:true,dobon:true,
 choices:[
  ["細胞外液",true,""],
  ["細胞内液",false,"細胞の中にある液。細胞を取り巻いている液ではない。"],
  ["外気",false,"温度・湿度など、からだの外の環境（外部環境）。"],
  ["消化管の内容物",false,"口から肛門まで外界とつながった管の中にあり、からだの外にあるのと同じ扱いになる。"]],
 exp:"細胞を取り巻く主な環境は<b>細胞外液</b>で、これを生体の内部環境と呼ぶ。内部環境が一定に保たれることは、生命の維持と機能の発揮に重要である。（P8）"},

{q:"ホメオスタシスの説明として正しいのはどれか。",kihon:true,dobon:true,g:"homeo",
 choices:[
  ["内部環境が狭い範囲で一定に保たれていること",true,""],
  ["1個の受精卵が分裂し、異なる形態や機能をもつ細胞になること",false,"細胞の分化の説明。"],
  ["外部環境の変化に合わせて、体温が大きく変わること",false,"体温は一定の範囲に保たれており、外部環境に合わせて大きく変わるわけではない。"],
  ["生殖によって子孫を残すこと",false,"種族の保存の説明。"]],
 exp:"細胞外液だけでなく、生体の各機能が一定に保たれることを生体の恒常性（<b>ホメオスタシス</b>）と呼ぶ。（P8・P9）"},

{q:"内部環境が一定に保たれることを何というか。",kihon:true,g:"homeo",
 choices:[
  ["恒常性（ホメオスタシス）",true,""],
  ["フィードバック",false,"結果が上流に戻ってはたらきを調節するしくみ。一定に保たれている「状態」を指す語ではない。"],
  ["分化",false,"細胞が分裂を重ね、異なる形態や機能をもつようになること。"],
  ["代謝",false,"体内で物質を分解・合成し、エネルギーを出し入れすること。"]],
 exp:"内部環境（細胞外液）が一定に保たれることを<b>恒常性（ホメオスタシス）</b>という。神経系と内分泌系のフィードバックで絶えず調節されている。（P8・P9）"},

{q:"細胞外液が海水と似た組成をもつのは、何と関係していると考えられているか。",
 choices:[
  ["生命が太古の海の中で誕生したこと",true,""],
  ["ヒトが海水から塩分を直接取り込んでいること",false,"ヒトは海水から直接塩分を取り込んではいない。"],
  ["細胞外液がつねに外部環境と自由に入れ替わっていること",false,"細胞外液は内部環境で、外部環境から隔てられて一定に保たれている。"],
  ["腎臓が海水と同じ組成の尿をつくること",false,"尿の組成は体内の状態に応じて変わり、海水と同じではない。"]],
 exp:"細胞外液は海水と似た組成をもつ。これは、<b>生命が太古の海中で誕生した</b>ことと関係している。（P8）"},

{q:"ホルモン分泌の負のフィードバックの説明として正しいのはどれか。",kihon:true,g:"fb",
 choices:[
  ["血中濃度が高まったホルモンが、上位のホルモンの分泌を抑え、自らの分泌を減らす",true,""],
  ["血中濃度が高まったホルモンが、上位のホルモンの分泌をさらに促し、分泌が急激に増える",false,"正のフィードバックの説明。排卵のときなど、特殊な場面でみられる。"],
  ["下位のホルモンの血中濃度が下がると、上位のホルモンの分泌も減る",false,"これでは不足がさらに進んでしまう。実際は、下位のホルモンが減ると上位のホルモンの分泌は増える。"],
  ["上位のホルモンの分泌は、下位のホルモンの血中濃度に関係なく一定に保たれる",false,"下位のホルモンの量が上位に戻ってこないので、調節がはたらかない状態。"]],
 exp:"作用が最終的に強まったものが、上流のはたらきを抑えて自らの作用量を減らす調節機構を<b>負のフィードバック</b>という。例：血中のサイロキシン（甲状腺ホルモン）が増えると、下垂体前葉からの甲状腺刺激ホルモン（TSH）の分泌が抑えられ、サイロキシンの分泌が減る。温度や浸透圧なども、このしくみで安定的に調節されている（ホメオスタシスの維持）。ふつう「フィードバック」といえば、負のフィードバックを指す。（P9、ホルモンの例は第6章）"},

{q:"温度や浸透圧などを安定的に調節し、ホメオスタシスを維持するしくみはどれか。",g:"fb",
 choices:[
  ["負のフィードバック",true,""],
  ["正のフィードバック",false,"互いの作用を促進し合うしくみ。値を一定に保つのではなく、急激な変化を引き起こすときにはたらく。"],
  ["拡散",false,"物質が濃度の高いほうから低いほうへ自然に移動する現象。値を調節するしくみではない。"],
  ["能動輸送",false,"膜タンパク質がエネルギーを使い、濃度勾配に逆らって物質を運ぶこと。細胞膜での物質の移動のしかた。"]],
 exp:"生体の多くの物質や物理量（温度・浸透圧など）は、<b>負のフィードバック</b>で安定的に調節されている。（P9）"},

{q:"正のフィードバックの説明として正しいのはどれか。",g:"fb",
 choices:[
  ["AとBが互いの作用を促進し合い、生体に急激な変化を引き起こす",true,""],
  ["強まった作用が上流のはたらきを抑え、自らの作用量を減らす",false,"負のフィードバックの説明。値を安定させ、ホメオスタシスを維持する。"],
  ["外部環境の変化に合わせて、内部環境も同じように変化させる",false,"内部環境を一定に保てなくなる。フィードバックによる調節ではない。"],
  ["上流のはたらきだけで下流が決まり、結果が上流に戻らない",false,"結果が戻ってこないので、フィードバックがない状態。"]],
 exp:"AがBの作用を促進し、同時にBもAの作用を促進する調節機構を<b>正のフィードバック</b>という。ホメオスタシスを維持するのではなく、急激な変化を引き起こすときに機能する（例：排卵時）。（P9）"},

{q:"排卵の直前に、エストロゲンと黄体形成ホルモン（LH）の間で起こることはどれか。",g:"fb",
 choices:[
  ["正のフィードバックにより、黄体形成ホルモン（LH）の分泌が亢進する",true,""],
  ["負のフィードバックにより、黄体形成ホルモン（LH）の分泌が抑制される",false,"排卵の時期以外にみられる関係。排卵直前には起こらない。"],

let mode="normal", drawn=[], idx=0, score=0, streak=0, answered=false, dead=false;
let qmiss=0, totalMiss=0, firstTryCount=0;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function home(){
  document.getElementById("htt").textContent="確認テスト";
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="0";
  document.getElementById("bd").innerHTML=`
    <div class="center">
      <p class="lead">モードを選んでスタート。<br>問題は毎回シャッフルされ、プール${POOL.length}問から${PICK}問が出題されます。</p>
      <div class="modes">
        <button class="mode" onclick="start('normal')">
          <div class="nm">通常モード</div>
          <div class="ds">${PICK}問を最後まで解いて採点します。まちがえても正解するまで選び直せます。<span class="mark kihon" style="margin-left:4px">🎯基本</span> は落としちゃダメな基本問題。</div>
        </button>
        <button class="mode dob" onclick="start('dobon')">
          <div class="nm">💣 ドボンチャレンジ</div>
          <div class="ds">絶対に落とせない問題が <b>💣ドボン！</b> に変身。外したら選び直しなしで即終了。どこまで連続正解できるか挑戦！</div>
        </button>
      </div>
    </div>`;
  document.getElementById("ctrl").innerHTML="";
}
function start(m){
  mode=m; drawn=draw();
  idx=0;score=0;streak=0;dead=false;totalMiss=0;firstTryCount=0;render();
}
function render(){
  answered=false; qmiss=0;
  const item=drawn[idx];
  const opts=shuffle(item.choices);
  const isDob=(mode==="dobon" && item.dobon);
  document.getElementById("htt").textContent=(mode==="dobon")?"ドボンチャレンジ":"確認テスト";
  document.getElementById("pg").textContent=`問 ${idx+1} / ${drawn.length}`;
  document.getElementById("bar").style.width=(idx/drawn.length*100)+"%";
  const L=["ア","イ","ウ","エ","オ"];
  let markHtml="";
  if(isDob) markHtml+=`<span class="mark dobon">💣 ドボン！</span>`;
  else if(item.kihon) markHtml+=`<span class="mark kihon">🎯 基本</span>`;
  if(item.gori) markHtml+=`<span class="mark gori">⚠ 誤りを選ぶ</span>`;
  if(item.hosoku) markHtml+=`<span class="mark hosoku">📘 補足（資料外）</span>`;
  const qt=item.gori?item.q.replace("誤っている",'<span class="ng">誤っている</span>'):item.q;
  let h=`<div class="qnum">Q${idx+1} ${markHtml}</div><div class="q">${qt}</div><div class="opts">`;
  opts.forEach((o,i)=>{h+=`<button class="opt" onclick="pick(this,${o[1]})"><span class="mk">${L[i]}</span><span>${o[0]}</span></button>`;});
  h+=`</div><div class="exp" id="exp"><div class="vd" id="vd"></div><div class="tx" id="tx"></div></div>`;
  document.getElementById("bd").innerHTML=h;
  document.getElementById("ctrl").innerHTML=`<button class="btn" id="nx" onclick="next()" disabled>解答を選んでください</button>`;
}
function pick(el,ok){
  if(answered)return;
  if(el.classList.contains("dis"))return;
  const item=drawn[idx];
  const isDob=(mode==="dobon" && item.dobon);
  const selText=el.querySelector("span:last-child").textContent;
  const selChoice=item.choices.find(c=>c[0]===selText);
  const exp=document.getElementById("exp");
  const nx=document.getElementById("nx");

  if(ok){
    answered=true;
    el.classList.add("correct");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    score++;
    if(mode!=="dobon"){ if(qmiss===0) firstTryCount++; }
    if(mode==="dobon") streak++;
    exp.className="exp show ok";
    document.getElementById("vd").textContent="正解！";
    document.getElementById("tx").innerHTML=item.exp;
    nx.disabled=false;
    nx.textContent=(idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶";
    return;
  }
  if(mode==="dobon"){
    answered=true;
    el.classList.add("wrong");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    if(item.dobon){ dead=true; }
    exp.className="exp show ng";
    document.getElementById("vd").textContent=isDob?"💣 ドボン！":"不正解";
    document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}`;
    nx.disabled=false;
    nx.textContent=dead?"結果を見る（ドボン）▶":((idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶");
    return;
  }
  qmiss++; totalMiss++;
  el.classList.add("wrong","dis");
  exp.className="exp show ng";
  document.getElementById("vd").textContent="不正解（ミス "+qmiss+"回）";
  document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}<br>ほかの選択肢からもう一度選んでください。`;
}
function next(){
  if(dead){result();return;}
  if(idx+1<drawn.length){idx++;render();}
  else result();
}
function result(){
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="100%";
  if(mode==="dobon"){
    document.getElementById("htt").textContent="結果";
    if(dead){
      document.getElementById("bd").innerHTML=`<div class="center score dead">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>ドボンを踏んでしまいました</div>
        <div class="big">${score} 問正解</div>
        <div class="msg">${idx+1}問目でドボン。<br>解説を復習して再挑戦しましょう。</div>
      </div>`;
    }else{
      document.getElementById("bd").innerHTML=`<div class="center score">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>クリア！</div>
        <div class="big">${score} / ${drawn.length}</div>
        <div class="msg">ドボンを踏まず完走しました。お見事！</div>
      </div>`;
    }
  }else{
    document.getElementById("htt").textContent="結果";
    const n=drawn.length;
    const ftPct=Math.round(firstTryCount/n*100);
    const noMiss=(totalMiss===0);
    let head = noMiss
      ? `<div class="big">✨ ノーミス パーフェクト！</div><div>全 ${n} 問を一発で正解</div>`
      : `<div>今回の成績</div><div class="big">${firstTryCount} / ${n}</div><div>一発正解率 ${ftPct}%</div>`;
    let stat = `<div class="stats">一発正解 ${firstTryCount}問　｜　総ミス ${totalMiss}回</div>`;
    let msg = noMiss?"完璧です。この調子！":ftPct>=60?"よくできました。ミスした問題を復習しましょう。":"もう一度スライドで確認してから挑戦しましょう。";
    document.getElementById("bd").innerHTML=`<div class="center score">${head}${stat}<div class="msg">${msg}</div></div>`;
  }
  document.getElementById("ctrl").innerHTML=`<button class="btn sub" onclick="home()">モード選択へ</button><button class="btn" onclick="start(mode)">もう一度（シャッフル）▶</button>`;
}
home();
</script>
</body>
</html>
