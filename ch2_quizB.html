<style>
*{box-sizing:border-box;margin:0;padding:0}

.mark{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px}
.mark.kihon{background:rgba(158,52,80,.13);color:#84293f}
.mark.dobon{background:rgba(200,60,40,.14);color:#c33c28}
.mark.gori{background:rgba(168,50,46,.13);color:#a8322e;border:1px solid rgba(168,50,46,.35)}
.mark.hosoku{background:rgba(40,90,140,.12);color:#285a8c;border:1px solid rgba(40,90,140,.3)}
.q{font-size:16px;line-height:1.8;color:#1a1a1a;font-weight:500;margin-bottom:18px}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:left;font-size:14.5px;line-height:1.6;color:#222;background:#f8f9fb;border:1.5px solid #e5e7eb;border-radius:9px;padding:12px 15px;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;gap:10px;align-items:flex-start}
.opt .mk{flex-shrink:0;width:22px;height:22px;border-radius:50%;border:1.5px solid #c3c8d0;color:#888;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}

.btn:hover{background:#84293f}

.modes{display:flex;flex-direction:column;gap:12px;max-width:470px;margin:0 auto}
.mode{text-align:left;border:1.5px solid #e5e7eb;border-radius:11px;padding:15px 18px;cursor:pointer;background:#fff;transition:all .15s;font-family:inherit}

.mode .nm{font-size:16px;font-weight:600;color:#9e3450;margin-bottom:4px}
.mode .ds{font-size:13px;color:#666;line-height:1.7}

.tag{display:inline-block;font-size:12px;font-weight:600;color:#9e3450;background:rgba(158,52,80,.1);padding:3px 12px;border-radius:20px;margin-bottom:6px}

<body>
<h1>生理学 第2章 筋の生理｜パートB 確認テスト</h1>
<div class="slide">
  <div class="hd"><div><div class="ch">第2章 筋の生理 ｜ B 骨格筋の収縮と弛緩</div><div class="tt" id="htt">確認テスト</div></div><div class="pg" id="pg"></div></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="bd" id="bd"></div>
  <div class="ctrl" id="ctrl"></div>
</div>
<script>
/* ===== 問題プール（教科書 第2章 P14〜15 ベース）=====
   choices: [表示文, 正解フラグ, その選択肢が何かの説明]
   kihon :true … 落としちゃダメな基本問題（🎯基本／ドボンモードでは💣ドボン！）
   gori  :true … 「誤っているのはどれか」形式。true が付くのは「誤っている記述」＝選ぶべき選択肢
   hosoku:true … 教科書に記述のない補足知識（国試過去問の頻出テーマ）。🎯基本にはしない
   exp … 正解時に見せる「なぜ正しいか」 */
const PICK=5;
const POOL=[
{q:"骨格筋の神経支配について正しいのはどれか。",kihon:true,
 choices:[
  ["1本の筋線維に運動終末は1つある",true,""],
  ["自律神経の支配を受ける",false,"心筋や平滑筋の特徴。骨格筋を支配するのは運動神経。"],
  ["1本の筋線維に運動終末が多数ある",false,"運動終末（神経筋接合部）は各筋線維に1つだけある。"],
  ["神経の支配を受けずに自動的に収縮する",false,"自動性をもつのは心筋。骨格筋は運動神経の興奮によって収縮する。"]],
 exp:"骨格筋線維は運動神経の支配を受け、運動神経と筋線維の接合部（神経筋接合部・運動終末）は各筋線維に1つある。"},

{q:"神経筋接合部で放出される神経伝達物質はどれか。",kihon:true,
 choices:[
  ["アセチルコリン",true,""],
  ["ノルアドレナリン",false,"交感神経の節後線維末端などから放出される伝達物質。"],
  ["セロトニン",false,"主に中枢神経ではたらく伝達物質。"],
  ["カルシウムイオン",false,"筋小胞体から放出されるイオンで、神経伝達物質ではない。"]],
 exp:"神経筋接合部ではアセチルコリンが放出され、筋細胞膜のニコチン型アセチルコリン受容体に結合する。"},

{q:"アセチルコリンが受容体に結合したとき、筋細胞膜に最初に生じるのはどれか。",
 choices:[
  ["終板電位",true,""],
  ["活動電位",false,"終板電位の加重によって、そのあとに発生する。"],
  ["静止電位",false,"興奮していないときの膜電位で、刺激によって生じるものではない。"],
  ["興奮収縮連関",false,"電気的興奮から機械的反応までの一連の過程の呼び名で、膜電位の名前ではない。"]],
 exp:"アセチルコリンがニコチン型アセチルコリン受容体に結合すると終板電位が発生し、その加重で活動電位が発生する。"},

{q:"筋線維鞘に伝わった活動電位を筋線維の深部へ導く構造はどれか。",kihon:true,
 choices:[
  ["横行小管（T管）",true,""],
  ["筋小胞体",false,"活動電位が伝わるとCa²⁺を放出する側の構造。"],
  ["筋内膜",false,"個々の筋線維を包む結合組織。"],
  ["神経筋接合部",false,"運動神経と筋線維の接合部で、筋線維の表面にある。"]],
 exp:"筋線維鞘に伝わった活動電位は、横行小管（T管）を経て筋線維の深部へ導かれ、筋小胞体へ伝わる。"},

{q:"活動電位が筋小胞体へ伝わったとき、筋線維内に放出されるのはどれか。",kihon:true,
 choices:[
  ["Ca²⁺",true,""],
  ["Na⁺",false,"細胞外に多く、活動電位の発生に関わるイオン。"],
  ["K⁺",false,"細胞内に多く、静止電位の維持に関わるイオン。"],
  ["Cl⁻",false,"細胞外に多い陰イオンで、筋小胞体から放出されるものではない。"]],
 exp:"筋小胞体の内部に蓄えられたCa²⁺が筋線維内へ放出され、これをきっかけに収縮が始まる。"},

{q:"放出されたCa²⁺が結合するタンパク質はどれか。",kihon:true,
 choices:[
  ["トロポニン",true,""],
  ["ミオシン",false,"頭部を回転させてアクチンをたぐり込む側のタンパク質。"],
  ["アクチン",false,"細いフィラメント本体で、Ca²⁺が直接結合する相手ではない。"],
  ["トロポミオシン",false,"細いフィラメント側の調節タンパク質だが、Ca²⁺が結合するのはその上にあるトロポニン。"]],
 exp:"放出されたCa²⁺がトロポミオシンの上にあるトロポニンに結合すると、アクチンがミオシンと結合できる状態になる。"},

{q:"筋収縮が起こるときのミオシンのはたらきで正しいのはどれか。",
 choices:[
  ["頭部（側枝）を回転させてアクチンをたぐり込む",true,""],
  ["フィラメント全体が短縮する",false,"収縮してもA帯の幅は変わらず、フィラメント自体の長さは変化しない。"],
  ["トロポニンと結合する",false,"ミオシンが結合する相手はアクチン。トロポニンに結合するのはCa²⁺。"],
  ["筋小胞体へCa²⁺を取り込む",false,"弛緩時に筋小胞体が行うはたらき。"]],
 exp:"ミオシンが頭部（側枝）を回転させてアクチン結合部位と連結し、たぐり込むことで、アクチンフィラメントがサルコメアの中央部へ引き込まれて筋収縮が生じる。"},

{q:"筋が弛緩するしくみとして正しいのはどれか。",kihon:true,
 choices:[
  ["Ca²⁺が筋小胞体へ再取り込みされる",true,""],
  ["Ca²⁺がさらに放出される",false,"収縮を続けさせる向きの変化で、弛緩とは逆。"],
  ["アセチルコリンが放出される",false,"収縮を始めるときの過程。"],
  ["横行小管が消失する",false,"構造そのものが消えることはない。"]],
 exp:"約50〜70ミリ秒後にCa²⁺が筋小胞体へ再取り込みされ、筋線維中のCa²⁺濃度が下がることで筋が弛緩する。"},

{q:"筋の収縮に直接用いられるエネルギー源はどれか。",kihon:true,
 choices:[
  ["ATP（アデノシン三リン酸）",true,""],
  ["グリコーゲン",false,"肝臓や筋に貯蔵される糖で、直接のエネルギー源ではない。"],
  ["乳酸",false,"無酸素的な代謝で生じる産物で、エネルギー源ではない。"],
  ["熱エネルギー",false,"ATP分解によって生じる側であり、収縮を起こす源ではない。"]],
 exp:"筋の収縮には、ATP（アデノシン三リン酸）の分解でもたらされるエネルギーが用いられる。"},

{q:"ATPが分解されるときに生じるものの組合せで正しいのはどれか。",
 choices:[
  ["ADP（アデノシン二リン酸）と無機リン酸（Pi）",true,""],
  ["AMPと無機リン酸",false,"教科書が示すのはADPとPiへの分解。"],
  ["ADPとグリコーゲン",false,"グリコーゲンはATP分解の産物ではなく、糖の貯蔵形。"],
  ["ADPと乳酸",false,"乳酸はATP分解の産物ではなく、無酸素的な代謝の産物。"]],
 exp:"ATPはADPと無機リン酸（Pi）に分解されるときに大きなエネルギーを発生する。ATPのTは三を、ADPのDは二を表す。"},

{q:"筋収縮の過程について誤っているのはどれか。",gori:true,
 choices:[
  ["活動電位は筋小胞体を経て横行小管へ伝わる",true,""],
  ["神経筋接合部でアセチルコリンが放出される",false,"教科書どおりの記述なので、正しい。"],
  ["Ca²⁺はトロポニンに結合する",false,"教科書どおりの記述なので、正しい。"],
  ["ミオシンは頭部を回転させてアクチンをたぐり込む",false,"教科書どおりの記述なので、正しい。"]],
 exp:"順序が逆。活動電位は 筋線維鞘 → 横行小管（T管） → 筋小胞体 の順に伝わり、そこでCa²⁺が放出される。"},

/* ---- やや難（ひっかけ・複合・理由を問う） ---- */
{q:"興奮収縮連関について誤っているのはどれか。",gori:true,
 choices:[
  ["機械的反応から始まり、最後に電気的興奮が生じる",true,""],
  ["筋線維鞘の電気的な興奮から始まる",false,"教科書どおりの記述なので、正しい。"],
  ["Ca²⁺の作用という化学的過程を経る",false,"教科書どおりの記述なので、正しい。"],
  ["ミオシンとアクチンの結合という機械的反応へ移る",false,"教科書どおりの記述なので、正しい。"]],
 exp:"興奮収縮連関は「電気的興奮 → 化学的過程（Ca²⁺の作用） → 機械的反応（ミオシンとアクチンの結合）」の順に進む。この3段階の並びを逆にしたひっかけ。"},

{q:"ATPによるエネルギー供給について誤っているのはどれか。",gori:true,
 choices:[
  ["激しい運動をしなくても、筋線維内のATP濃度はすぐに低下する",true,""],
  ["ATPの分解で生じたエネルギーは、力学的エネルギーと熱エネルギーに変換される",false,"教科書どおりの記述なので、正しい。"],
  ["ADPはATPへとすぐに再変換される",false,"教科書どおりの記述なので、正しい。"],
  ["ATPのTは三を、ADPのDは二を表す",false,"教科書どおりの記述なので、正しい。"]],
 exp:"激しい運動をしない限り、筋線維内のATP濃度が低下することはほとんどない。分解産物であるADPがATPへすぐに再変換されるためで、この理由とセットで押さえる。"},

{q:"Ca²⁺がトロポニンに結合しなかった場合、筋収縮はどうなるか。",
 choices:[
  ["アクチンとミオシンが結合できず、収縮が起こらない",true,""],
  ["活動電位が発生しなくなる",false,"活動電位はCa²⁺放出よりも前の段階の出来事で、影響を受けない。"],
  ["横行小管へ活動電位が伝わらなくなる",false,"これもCa²⁺放出より前の段階で、影響を受けない。"],
  ["アセチルコリンが放出されなくなる",false,"神経筋接合部での最初の過程で、Ca²⁺とは無関係。"]],
 exp:"Ca²⁺がトロポニンに結合してはじめて、アクチンがミオシンと結合できる状態になる。つまりCa²⁺はスイッチの役割で、ここが止まると前の段階が正常でも収縮は起こらない。"},

{q:"筋の収縮・弛緩の過程でATPを必要とするのはどれか。",
 choices:[
  ["Ca²⁺を筋小胞体へ再取り込みすること",true,""],
  ["筋小胞体からCa²⁺が放出されること",false,"濃度勾配に従って出ていく移動なので、ATPは必要としない。"],
  ["Ca²⁺がトロポニンに結合すること",false,"結合そのものにエネルギーは必要としない。"],
  ["アセチルコリンが受容体に結合すること",false,"これも結合自体にATPは必要としない。"]],
 exp:"教科書の見出しが「収縮・弛緩のためのATPによるエネルギーの供給」となっているとおり、ATPは収縮だけでなく弛緩にも必要。弛緩時のCa²⁺は濃度勾配に逆らって筋小胞体へ能動的に取り込まれるため、ATPを消費する（1章の能動輸送）。「弛緩は力を抜くだけだからエネルギーは要らない」という思い込みが落とし穴。"},

/* ---- 補足知識（教科書外・国試過去問の頻出テーマ） ---- */
{q:"アセチルコリンを酢酸とコリンに分解する酵素はどれか。",hosoku:true,
 choices:[
  ["アセチルコリンエステラーゼ",true,""],
  ["ミオシンATPase",false,"ミオシンがもつATP分解酵素で、筋線維のタイプ分類に関わる。"],
  ["クレアチンキナーゼ",false,"クレアチンリン酸からATPを再生する反応ではたらく酵素。"],
  ["トロポニン",false,"酵素ではなく、Ca²⁺が結合する収縮調節タンパク質。"]],
 exp:"補足知識（資料外）。終板電位を発生させたアセチルコリンは、アセチルコリンエステラーゼによって速やかに酢酸とコリンに分解され、膜は静止電位に戻る。分解されなければ収縮が続いてしまう。"},

{q:"クラーレが筋を弛緩させる作用機序はどれか。",hosoku:true,
 choices:[
  ["アセチルコリン受容体に結合し、アセチルコリンの作用を阻害する",true,""],
  ["筋小胞体からのCa²⁺放出を促す",false,"収縮を強める向きの作用で、弛緩させる機序ではない。"],
  ["ミオシンATPaseを活性化する",false,"ATPの分解を進める向きで、筋を弛緩させる作用ではない。"],
  ["横行小管を遮断して活動電位の伝搬を止める",false,"クラーレの作用点は筋細胞膜の受容体であり、横行小管ではない。"]],
 exp:"補足知識（資料外）。クラーレは神経毒で、アセチルコリン受容体をふさぐことで本来のアセチルコリンが結合できなくなり、筋が収縮できなくなる。"},

{q:"運動単位の説明として正しいのはどれか。",hosoku:true,
 choices:[
  ["1個の運動ニューロンと、それが支配する筋線維群",true,""],
  ["1本の筋線維と1つの神経筋接合部",false,"神経筋接合部が各筋線維に1つあることの説明で、運動単位の定義ではない。"],
  ["1つの筋束とそれを包む筋周膜",false,"構造上の単位の説明で、神経支配の単位ではない。"],
  ["Z膜からZ膜までの分節",false,"サルコメア（筋節）の説明。"]],
 exp:"補足知識（資料外）。α運動ニューロン1個と、その軸索、支配される筋線維群をまとめて運動単位と呼ぶ。細かい動きをする筋ほど、1つの運動単位が支配する筋線維の数は少ない。"},

{q:"クレアチンリン酸のはたらきとして正しいのはどれか。",hosoku:true,
 choices:[
  ["ADPからATPを再生してATPを補給する",true,""],
  ["筋収縮の直接のエネルギー源となる",false,"直接のエネルギー源はATP。クレアチンリン酸はその補給にはたらく。"],
  ["筋の疲労時に蓄積して収縮を妨げる",false,"疲労した骨格筋に蓄積するのは乳酸。"],
  ["Ca²⁺と結合してトロポニンを活性化する",false,"Ca²⁺が結合するのはトロポニンで、クレアチンリン酸は関与しない。"]],
 exp:"補足知識（資料外）。クレアチンリン酸はローマン反応によってADPからATPをつくり、ATPを補給する。直接のエネルギー源はあくまでATPである点を区別する。"},
];

let mode="normal", drawn=[], idx=0, score=0, streak=0, answered=false, dead=false;
let qmiss=0, totalMiss=0, firstTryCount=0; // ミス回数の集計（通常モード）
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function home(){
  document.getElementById("htt").textContent="確認テスト";
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="0";
  document.getElementById("bd").innerHTML=`
    <div class="center">
      <p class="lead">モードを選んでスタート。<br>問題は毎回シャッフルされ、プール${POOL.length}問から${PICK}問が出題されます。</p>
      <div class="modes">
        <button class="mode" onclick="start('normal')">
          <div class="nm">通常モード</div>
          <div class="ds">${PICK}問を最後まで解いて採点します。ふだんの確認用。<span class="mark kihon" style="margin-left:4px">🎯基本</span> は落としちゃダメな基本問題、<span class="mark gori">⚠ 誤りを選ぶ</span> は誤っているものを選ぶ問題、<span class="mark hosoku">📘 補足</span> は教科書外の国試頻出テーマ。</div>
        </button>
        <button class="mode dob" onclick="start('dobon')">
          <div class="nm">💣 ドボンチャレンジ</div>
          <div class="ds">🎯基本の問題は <b>💣ドボン！</b> に変身。1問でも外したら、解説を見てそこで終了。どこまで正解を続けられるか挑戦！</div>
        </button>
      </div>
    </div>`;
  document.getElementById("ctrl").innerHTML="";
}
function start(m){
  mode=m; drawn=shuffle(POOL).slice(0,Math.min(PICK,POOL.length));
  idx=0;score=0;streak=0;dead=false;totalMiss=0;firstTryCount=0;render();
}
function render(){
  answered=false; qmiss=0;
  const item=drawn[idx];
  const opts=shuffle(item.choices);
  const isDob=(mode==="dobon" && item.kihon);
  document.getElementById("htt").textContent=(mode==="dobon")?"ドボンチャレンジ":"確認テスト";
  document.getElementById("pg").textContent=`問 ${idx+1} / ${drawn.length}`;
  document.getElementById("bar").style.width=(idx/drawn.length*100)+"%";
  const L=["ア","イ","ウ","エ","オ"];
  let markHtml = item.kihon ? (isDob?`<span class="mark dobon">💣 ドボン！</span>`:`<span class="mark kihon">🎯 基本</span>`) : "";
  if(item.gori)   markHtml += `<span class="mark gori">⚠ 誤りを選ぶ</span>`;
  if(item.hosoku) markHtml += `<span class="mark hosoku">📘 補足（資料外）</span>`;
  // 誤り選択問題は、設問中の「誤っている」を赤字にして読み飛ばしを防ぐ
  const qText = item.gori ? item.q.replace("誤っている",'<span class="ng">誤っている</span>') : item.q;
  let h=`<div class="qnum">Q${idx+1} ${markHtml}</div><div class="q">${qText}</div><div class="opts">`;
  opts.forEach((o,i)=>{h+=`<button class="opt" onclick="pick(this,${o[1]})"><span class="mk">${L[i]}</span><span>${o[0]}</span></button>`;});
  h+=`</div><div class="exp" id="exp"><div class="vd" id="vd"></div><div class="tx" id="tx"></div></div>`;
  document.getElementById("bd").innerHTML=h;
  document.getElementById("ctrl").innerHTML=`<button class="btn" id="nx" onclick="next()" disabled>解答を選んでください</button>`;
}
function pick(el,ok){
  if(answered)return;
  if(el.classList.contains("dis"))return; // 無効化済みの選択肢は再カウントしない
  const item=drawn[idx];
  const isDob=(mode==="dobon" && item.kihon);
  const selText=el.querySelector("span:last-child").textContent;
  const selChoice=item.choices.find(c=>c[0]===selText);
  const exp=document.getElementById("exp");
  const nx=document.getElementById("nx");

  if(ok){
    // 正解：ここで確定。正解した選択肢だけ緑にする（不正解の選択肢は先に色を変えない）
    answered=true;
    el.classList.add("correct");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    score++;
    if(mode!=="dobon"){ if(qmiss===0) firstTryCount++; }
    if(mode==="dobon") streak++;
    exp.className="exp show ok";
    document.getElementById("vd").textContent=(qmiss===0)?"正解！":"正解！（"+qmiss+"回目で正解）";
    document.getElementById("tx").innerHTML=item.exp;
    nx.disabled=false;
    nx.textContent=(idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶";
    return;
  }

  // 不正解
  if(mode==="dobon"){
    // ドボンモードは一発勝負：選び直しなし・正解は伏せる
    answered=true;
    el.classList.add("wrong");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    if(item.kihon){ dead=true; }
    exp.className="exp show ng";
    document.getElementById("vd").textContent=isDob?"💣 ドボン！":"不正解";
    document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}`;
    nx.disabled=false;
    nx.textContent=dead?"結果を見る（ドボン）▶":((idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶");
    return;
  }

  // 通常モード：ミスを数え、選んだ選択肢だけ赤にして無効化。正解は伏せたまま選び直せる
  qmiss++; totalMiss++;
  el.classList.add("wrong","dis");
  exp.className="exp show ng";
  document.getElementById("vd").textContent="不正解（ミス "+qmiss+"回）";
  document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}<br>ほかの選択肢からもう一度選んでください。`;
  // 「次へ」はまだ出さない（正解するまで進めない）
}
function next(){
  if(dead){result();return;}
  if(idx+1<drawn.length){idx++;render();}
  else result();
}
function result(){
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="100%";
  if(mode==="dobon"){
    document.getElementById("htt").textContent="結果";
    if(dead){
      document.getElementById("bd").innerHTML=`<div class="center score dead">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>ドボンを踏んでしまいました</div>
        <div class="big">${streak} 問連続正解</div>
        <div class="msg">${idx}問正解のあと、${idx+1}問目でドボン。<br>上の解説を復習して再挑戦しましょう。</div>
      </div>`;
    }else{
      document.getElementById("bd").innerHTML=`<div class="center score">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>クリア！</div>
        <div class="big">${score} / ${drawn.length}</div>
        <div class="msg">ドボンを踏まず完走しました。お見事！</div>
      </div>`;
    }
  }else{
    document.getElementById("htt").textContent="結果";
    const n=drawn.length;
    const ftPct=Math.round(firstTryCount/n*100);
    const noMiss=(totalMiss===0);
    let head = noMiss
      ? `<div class="big">✨ ノーミス パーフェクト！</div><div>全 ${n} 問を一発で正解</div>`
      : `<div>今回の成績</div><div class="big">${firstTryCount} / ${n}</div><div>一発正解率 ${ftPct}%</div>`;
    let stat = `<div class="stats">一発正解 ${firstTryCount}問　｜　総ミス ${totalMiss}回</div>`;
    let msg = noMiss?"完璧です。この調子！":ftPct>=60?"よくできました。ミスした問題を復習しましょう。":"もう一度スライドで確認してから挑戦しましょう。";
    document.getElementById("bd").innerHTML=`<div class="center score">${head}${stat}<div class="msg">${msg}</div></div>`;
  }
  document.getElementById("ctrl").innerHTML=`<button class="btn sub" onclick="home()">モード選択へ</button><button class="btn" onclick="start(mode)">もう一度（シャッフル）▶</button>`;
}
home();
</script>
</body>
</html>
