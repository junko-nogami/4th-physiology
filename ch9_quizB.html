<script>
/* ===== 問題プール（教科書 第9章 P136〜138 ベース）=====
   範囲：B-2 骨形成と骨吸収・B-3 骨のカルシウム代謝の調節・B-4 骨年齢（スライド ch9_partB）
   2026年11月：12問追加。骨年齢8問を nenrei（上限2）、分泌器官2問を bunpi（上限1）にした
   過去問（13章 骨＋宅ドリル）での出題回数：パラソルモンの作用7／ビタミンDの活性化臓器5／
   ビタミンDと腸管Ca吸収4／紫外線3／Ca調節ホルモン3／Caの99％3／Caのはたらき3／テタニー3／
   骨芽細胞・破骨細胞3／骨の病気3／Ca低下時の反応2／エストロゲン2 */
const PICK=5;
const GMAX={pth:2,horm:2,vd:2,shikkan:1,ca:1,canodo:1,nenrei:2,bunpi:1};
const POOL=[

/* ---------- B-2 骨形成と骨吸収（P136） ---------- */

{q:"骨芽細胞と破骨細胞が存在するのはどこか。",kihon:true,
 choices:[
  ["骨膜",true,""],
  ["関節軟骨",false,"関節面を覆う軟骨。"],
  ["成長軟骨",false,"成長期に増殖・骨化して、骨を長軸方向に伸ばす軟骨。"],
  ["関節液",false,"関節腔を満たす液体で、関節の動きをなめらかにする。"]],
 exp:"長管骨は関節面が関節軟骨で、それ以外が骨膜で覆われている。<b>骨膜</b>には骨芽細胞と破骨細胞が存在する。（教科書 P136）"},

{q:"手根骨や足根骨が成長するしくみはどれか。",
 choices:[
  ["骨化が起こる部位が徐々に大きくなる",true,""],
  ["成長軟骨が増殖して骨化する",false,"長管骨が長軸方向に伸びるしくみ。"],
  ["破骨細胞が骨を吸収する",false,"成長時に骨の形を修正するしくみ（モデリング）。"],
  ["関節軟骨が骨に置き換わる",false,"関節軟骨は成長後も関節面に残る。"]],
 exp:"手根骨や足根骨などの短骨は、長管骨と異なり、<b>骨化が起こる部位が徐々に大きくなる</b>ことで成長する。（教科書 P136）"},

{q:"骨吸収を行う細胞はどれか。",kihon:true,
 choices:[
  ["破骨細胞",true,""],
  ["骨芽細胞",false,"骨膜に存在し、骨を形成する細胞。"],
  ["軟骨細胞",false,"軟骨をつくる細胞。成長軟骨で増殖する。"],
  ["巨核球",false,"骨髄にある大きな細胞で、血小板をつくる（第8章）。"]],
 exp:"<b>破骨細胞</b>は骨を吸収するはたらきをもつ。骨芽細胞は骨を形成する。（教科書 P136）"},

{q:"骨吸収でカルシウムが骨から溶け出すと、血中カルシウム濃度はどうなるか。",kihon:true,
 choices:[
  ["上昇する",true,""],
  ["低下する",false,"骨形成でカルシウムが骨へ沈着したときの変化。"],
  ["変化しない",false,"骨とのカルシウムの出入りは、血中カルシウム濃度を変化させる。"],
  ["いったん低下したのち上昇する",false,"そのような二段階の変化は起こらない。"]],
 exp:"血中カルシウム濃度は、骨吸収でカルシウムが骨から溶け出ると<b>上昇</b>し、骨形成でカルシウムが骨へ沈着すると低下する。（教科書 P136）"},

{q:"骨芽細胞について正しいのはどれか。",hosoku:true,
 choices:[
  ["コラーゲンなどの骨基質を分泌する",true,""],
  ["骨を吸収する",false,"破骨細胞のはたらき。"],
  ["多数の核をもつ巨大な細胞である",false,"破骨細胞の特徴。"],
  ["骨髄で血小板をつくる",false,"巨核球のはたらき（第8章）。"]],
 exp:"補足知識（資料外）。骨芽細胞は<b>コラーゲンなどの骨基質を分泌</b>して骨をつくり、やがて自らが骨基質に埋もれて骨細胞になる。"},

{q:"骨のリモデリングとはどれか。",kihon:true,
 choices:[
  ["骨芽細胞による骨形成と、破骨細胞による骨吸収のサイクル",true,""],
  ["成長時に、骨の形を修正すること",false,"モデリング。成長時に破骨細胞が行う。"],
  ["成長軟骨が増殖して骨化すること",false,"長管骨が長軸方向に伸びるしくみ。"],
  ["成長が終わり、成長軟骨が消失すること",false,"骨端線閉鎖。"]],
 exp:"骨芽細胞による骨形成と、破骨細胞による骨吸収のサイクルを骨の<b>リモデリング</b>（再構築）と呼ぶ。これがバランスよく行われることで骨量や骨質が維持される。（教科書 P136）"},

{g:"shikkan",q:"リモデリングのバランスが崩れて骨量が減少すると発症するのはどれか。",kihon:true,dobon:true,
 choices:[
  ["骨粗鬆症",true,""],
  ["大理石病",false,"骨吸収ができず、骨密度が異常に高くなる病気。"],
  ["変形性関節症",false,"関節軟骨がすり減り、関節が変形する病気。"],
  ["痛風",false,"尿酸の結晶が関節にたまって炎症を起こす病気。"]],
 exp:"何らかの原因でリモデリングのバランスが崩れ、骨量が減少すると<b>骨粗鬆症</b>が発症する。（教科書 P136）"},

{q:"骨粗鬆症が起こりやすい状況として誤っているのはどれか。",gori:true,
 choices:[
  ["スポーツ選手として長年トレーニングを続けている",true,""],
  ["高齢である",false,"教科書どおりの記述なので、正しい。"],
  ["長期間、臥床している",false,"教科書どおりの記述なので、正しい。"],
  ["無重力空間で長期間過ごす",false,"教科書どおりの記述なので、正しい。"]],
 exp:"<b>スポーツ選手では骨が太くなる</b>。このことから、リモデリングは<b>骨への力学的ストレス</b>で促進されると考えられている。骨粗鬆症は、高齢者・長期臥床の患者・宇宙飛行士で起こりやすい。（教科書 P136）"},

{q:"骨のリモデリングを促進すると考えられているのはどれか。",kihon:true,
 choices:[
  ["骨への力学的ストレス",true,""],
  ["長期間の臥床",false,"骨粗鬆症が起こりやすくなる状況の1つ。"],
  ["副腎皮質ホルモン（コルチゾル）の増加",false,"骨芽細胞の活動を抑制するホルモン。"],
  ["紫外線を浴びない生活",false,"皮膚でのビタミンDの合成が減る。"]],
 exp:"スポーツ選手では骨が太くなることから、骨のリモデリングは<b>骨への力学的ストレス</b>で促進されると考えられている。（教科書 P136）"},

{g:"shikkan",q:"骨密度が異常に高くなるのはどれか。",hosoku:true,
 choices:[
  ["大理石病",true,""],
  ["骨粗鬆症",false,"骨量が減少し、骨がもろくなる病気。"],
  ["骨軟化症",false,"成人で骨の石灰化が障害される病気。"],
  ["くる病",false,"小児で骨の石灰化が障害される病気。"]],
 exp:"補足知識（資料外）。<b>大理石病</b>は破骨細胞のはたらきが欠けるため骨吸収ができず、骨密度が異常に高くなる。"},

{g:"shikkan",q:"成人で、カルシウムやビタミンDの不足によって骨の石灰化が障害されるのはどれか。",hosoku:true,
 choices:[
  ["骨軟化症",true,""],
  ["くる病",false,"小児で同様の障害が起こる病気。"],
  ["大理石病",false,"骨吸収ができず、骨密度が異常に高くなる病気。"],
  ["骨粗鬆症",false,"骨量が減少する病気で、石灰化そのものの障害ではない。"]],
 exp:"補足知識（資料外）。カルシウムやビタミンDの不足で石灰化が障害される病気は、成人では<b>骨軟化症</b>、小児ではくる病と呼ばれる。"},

/* ---------- B-3 骨のカルシウム代謝の調節（P136〜138） ---------- */

{g:"ca",q:"カルシウムが関わるはたらきはどれか。",kihon:true,
 choices:[
  ["血液凝固",true,""],
  ["浸透圧の維持",false,"主にNa⁺とCl⁻が担うはたらき（第8章）。"],
  ["酸素の運搬",false,"赤血球のヘモグロビンが担うはたらき（第8章）。"],
  ["体液のpHの緩衝",false,"主にHCO₃⁻が担うはたらき（第8章）。"]],
 exp:"カルシウムは骨形成のほか、細胞膜での活動電位の発生や<b>血液凝固</b>に関わる（Ca²⁺は血液凝固第Ⅳ因子＝第8章）。（教科書 P136）"},

{g:"ca",q:"カルシウムが関わるはたらきはどれか。",
 choices:[
  ["細胞膜での活動電位の発生",true,""],
  ["浸透圧の維持",false,"主にNa⁺とCl⁻が担うはたらき（第8章）。"],
  ["酸素の運搬",false,"赤血球のヘモグロビンが担うはたらき（第8章）。"],
  ["体液のpHの緩衝",false,"主にHCO₃⁻が担うはたらき（第8章）。"]],
 exp:"カルシウムは<b>細胞膜での活動電位の発生</b>に関わる。筋収縮の興奮収縮連関にも関わる（第2章）。（教科書 P136）"},

{g:"canodo",q:"血漿カルシウム濃度（mg/dL）はどれか。",kihon:true,dobon:true,
 choices:[
  ["9〜10",true,""],
  ["0.9〜1.0",false,"生理食塩水のNaCl濃度（0.9％）とまぎらわしい数字で、低すぎる値。"],
  ["20〜25",false,"高すぎる値。この濃度では著しい高カルシウム血症になる。"],
  ["90〜100",false,"空腹時血糖値（mg/dL）に近い値。"]],
 exp:"血漿カルシウム濃度は<b>9〜10 mg/dL</b>。このうち遊離Ca²⁺は約5 mg/dL。（教科書 P137、図9・5）"},

{g:"canodo",q:"血漿中の遊離Ca²⁺の濃度はおよそどれか。",
 choices:[
  ["約5 mg/dL",true,""],
  ["約1 mg/dL",false,"低すぎる値。"],
  ["約9 mg/dL",false,"結合型を含めた血漿カルシウム全体に近い値。"],
  ["約20 mg/dL",false,"血漿カルシウム全体よりも高い値で、ありえない。"]],
 exp:"血漿カルシウム濃度9〜10 mg/dLのうち、遊離Ca²⁺は<b>約5 mg/dL</b>。（教科書 P137、図9・5）"},

{q:"体内のカルシウムの約99％が存在するのはどこか。",dobon:true,hosoku:true,
 choices:[
  ["骨や歯",true,""],
  ["血液",false,"血液中にあるのは、体内カルシウムのごく一部。"],
  ["骨格筋",false,"筋小胞体にカルシウムを蓄えるが、量は体内全体のごく一部。"],
  ["肝臓",false,"カルシウムの主な貯蔵場所ではない。"]],
 exp:"補足知識（資料外）。体内のカルシウムの約99％は<b>骨や歯</b>に存在し、残りが血液・筋・神経などに存在する。"},

{q:"血中カルシウム濃度の調節に主に関わるホルモンはどれか。",kihon:true,
 choices:[

  ["グルカゴン",false,"膵臓のA細胞から分泌され、血糖値を上げる。"],

 exp:"骨代謝は、<b>副甲状腺ホルモン（パラソルモン）</b>・カルシトニン・ビタミンDなどのはたらきで調節される。この3つを「カルシウム調節ホルモン」ともいう。（教科書 P136）"},

{g:"pth",q:"パラソルモンの作用で正しいのはどれか。",kihon:true,dobon:true,
 choices:[
  ["骨吸収を促進する",true,""],
  ["骨吸収を抑制する",false,"カルシトニンやエストロゲンの作用。"],
  ["腎臓でのカルシウムの再吸収を抑制する",false,"パラソルモンは、腎臓でのカルシウムの再吸収を促進する。"],
  ["血中カルシウム濃度を低下させる",false,"カルシトニンが骨吸収を抑えることで起こる方向の変化。"]],

{g:"pth",q:"副甲状腺ホルモンの作用で正しいのはどれか。",kihon:true,
 choices:[

{g:"pth",q:"パラソルモンが血中リン濃度に及ぼす作用はどれか。",
 choices:[
  ["低下させる",true,""],
  ["上昇させる",false,"リンの再吸収に対する作用と、向きが合わない。"],

  ["その時点からどのくらい骨が成長するか",true,""],
  ["骨折が治るまでの期間",false,"骨年齢は骨化の進み具合を表すもので、骨折の治癒期間を表すものではない。"],
  ["将来の血中カルシウム濃度",false,"血液検査で測るもの。"],
  ["筋力の発達の程度",false,"筋力測定で評価するもの。"]],
 exp:"単純X線像で骨年齢を評価し、<b>その時点からどのくらい骨が成長するのか</b>を予測できる。（教科書 P138）"},

{g:"nenrei",q:"骨年齢を評価するときに注意すべき男女差はどれか。",kihon:true,
 choices:[
  ["男児は女児に比較して、1〜2年ほど成長が遅い",true,""],
  ["女児は男児に比較して、1〜2年ほど成長が遅い",false,"男女が逆になっている。"],
  ["男女で成長の進み方に差はない",false,"男女で差があるため、評価時には注意が必要。"],
  ["男児は女児に比較して、5〜6年ほど成長が遅い",false,"差が大きすぎる。"]],
 exp:"<b>男児は女児に比較して1〜2年ほど成長が遅い</b>ため、骨年齢の評価時には注意が必要。（教科書 P138）"},

];

let mode="normal", drawn=[], idx=0, score=0, streak=0, answered=false, dead=false;
let qmiss=0, totalMiss=0, firstTryCount=0;
function draw(){const out=[],cnt={};for(const q of shuffle(POOL)){const g=q.g;if(g&&GMAX[g]!==undefined){if((cnt[g]||0)>=GMAX[g])continue;cnt[g]=(cnt[g]||0)+1;}out.push(q);if(out.length>=PICK)break;}return out;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function home(){
  document.getElementById("htt").textContent="確認テスト";
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="0";
  document.getElementById("bd").innerHTML=`
    <div class="center">
      <p class="lead">モードを選んでスタート。<br>問題は毎回シャッフルされ、プール${POOL.length}問から${PICK}問が出題されます。</p>
      <div class="modes">
        <button class="mode" onclick="start('normal')">
          <div class="nm">通常モード</div>
          <div class="ds">${PICK}問を最後まで解いて採点します。ふだんの確認用。<span class="mark kihon" style="margin-left:4px">🎯基本</span> は落としちゃダメな基本問題、<span class="mark gori">⚠ 誤りを選ぶ</span> は誤っているものを選ぶ問題、<span class="mark hosoku">📘 補足（資料外）</span> は教科書外の国試頻出テーマ。</div>
        </button>
        <button class="mode dob" onclick="start('dobon')">
          <div class="nm">💣 ドボンチャレンジ</div>
          <div class="ds">プールの中のごく一部、<b>絶対に落とせない最重要問題</b>だけが <b>💣ドボン！</b> に変身。それを外したらそこで終了。どこまで正解を続けられるか挑戦！</div>
        </button>
      </div>
    </div>`;
  document.getElementById("ctrl").innerHTML="";
}
function start(m){
  mode=m; drawn=draw();
  idx=0;score=0;streak=0;dead=false;totalMiss=0;firstTryCount=0;render();
}
function render(){
  answered=false; qmiss=0;
  const item=drawn[idx];
  const opts=shuffle(item.choices);
  const isDob=(mode==="dobon" && item.dobon);
  document.getElementById("htt").textContent=(mode==="dobon")?"ドボンチャレンジ":"確認テスト";
  document.getElementById("pg").textContent=`問 ${idx+1} / ${drawn.length}`;
  document.getElementById("bar").style.width=(idx/drawn.length*100)+"%";
  const L=["ア","イ","ウ","エ","オ"];
  let markHtml = isDob ? `<span class="mark dobon">💣 ドボン！</span>`
                       : (item.kihon ? `<span class="mark kihon">🎯 基本</span>` : "");
  if(item.gori)   markHtml += `<span class="mark gori">⚠ 誤りを選ぶ</span>`;
  if(item.hosoku) markHtml += `<span class="mark hosoku">📘 補足（資料外）</span>`;
  const qText = item.gori ? item.q.replace("誤っている",'<span class="ng">誤っている</span>') : item.q;
  let h=`<div class="qnum">Q${idx+1} ${markHtml}</div><div class="q">${qText}</div><div class="opts">`;
  opts.forEach((o,i)=>{h+=`<button class="opt" onclick="pick(this,${o[1]})"><span class="mk">${L[i]}</span><span>${o[0]}</span></button>`;});
  h+=`</div><div class="exp" id="exp"><div class="vd" id="vd"></div><div class="tx" id="tx"></div></div>`;
  document.getElementById("bd").innerHTML=h;
  document.getElementById("ctrl").innerHTML=`<button class="btn" id="nx" onclick="next()" disabled>解答を選んでください</button>`;
}
function pick(el,ok){
  if(answered)return;
  if(el.classList.contains("dis"))return;
  const item=drawn[idx];
  const isDob=(mode==="dobon" && item.dobon);
  const selText=el.querySelector("span:last-child").textContent;
  const selChoice=item.choices.find(c=>c[0]===selText);
  const exp=document.getElementById("exp");
  const nx=document.getElementById("nx");
  if(ok){
    answered=true;
    el.classList.add("correct");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    score++;
    if(mode!=="dobon"){ if(qmiss===0) firstTryCount++; }
    if(mode==="dobon") streak++;
    exp.className="exp show ok";
    document.getElementById("vd").textContent="正解！";
    document.getElementById("tx").innerHTML=item.exp;
    nx.disabled=false;
    nx.textContent=(idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶";
    return;
  }
  if(mode==="dobon"){
    answered=true;
    el.classList.add("wrong");
    document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
    if(item.dobon){ dead=true; }
    exp.className="exp show ng";
    document.getElementById("vd").textContent=isDob?"💣 ドボン！":"不正解";
    document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}`;
    nx.disabled=false;
    nx.textContent=dead?"結果を見る（ドボン）▶":((idx+1<drawn.length)?"次の問題 ▶":"結果を見る ▶");
    return;
  }
  qmiss++; totalMiss++;
  el.classList.add("wrong","dis");
  exp.className="exp show ng";
  document.getElementById("vd").textContent="不正解（ミス "+qmiss+"回）";
  document.getElementById("tx").innerHTML=`選んだ「<b>${selText}</b>」は… ${selChoice[2]}<br>ほかの選択肢からもう一度選んでください。`;
}
function next(){
  if(dead){result();return;}
  if(idx+1<drawn.length){idx++;render();}
  else result();
}
function result(){
  document.getElementById("pg").textContent="";
  document.getElementById("bar").style.width="100%";
  document.getElementById("htt").textContent="結果";
  if(mode==="dobon"){
    if(dead){
      document.getElementById("bd").innerHTML=`<div class="center score dead">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>ドボンを踏んでしまいました</div>
        <div class="big">${streak} 問連続正解</div>
        <div class="msg">${idx+1}問目でドボン。<br>上の解説を復習して再挑戦しましょう。</div>
      </div>`;
    }else{
      document.getElementById("bd").innerHTML=`<div class="center score">
        <span class="tag dob">💣 ドボンチャレンジ</span>
        <div>クリア！</div>
        <div class="big">${score} / ${drawn.length}</div>
        <div class="msg">ドボンを踏まず完走しました。お見事！</div>
      </div>`;
    }
  }else{
    const n=drawn.length;
    const ftPct=Math.round(firstTryCount/n*100);
    const noMiss=(totalMiss===0);
    let head = noMiss
      ? `<div class="big">✨ ノーミス パーフェクト！</div><div>全 ${n} 問を一発で正解</div>`
      : `<div>今回の成績</div><div class="big">${firstTryCount} / ${n}</div><div>一発正解率 ${ftPct}%</div>`;
    let stat = `<div class="stats">一発正解 ${firstTryCount}問　｜　総ミス ${totalMiss}回</div>`;
    let msg = noMiss?"完璧です。この調子！":ftPct>=60?"よくできました。ミスした問題を復習しましょう。":"もう一度スライドで確認してから挑戦しましょう。";
    document.getElementById("bd").innerHTML=`<div class="center score">${head}${stat}<div class="msg">${msg}</div></div>`;
  }
  document.getElementById("ctrl").innerHTML=`<button class="btn sub" onclick="home()">モード選択へ</button><button class="btn" onclick="start(mode)">もう一度（シャッフル）▶</button>`;
}
home();
</script>
</body>
</html>
